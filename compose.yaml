# DuckyMoMo Network - file gốc.
# Mỗi thành phần / chế độ có compose.yaml riêng; thêm chế độ = thêm 1 dòng include.
name: duckymomo

include:
  - infra/compose.yaml          # MariaDB, Redis
  - proxy/compose.yaml          # Velocity + Geyser + Floodgate (cổng duy nhất mở ra ngoài)
  - lobby/compose.yaml          # Lobby (Paper)
  - modes/banghoi/compose.yaml  # Chế độ 1: Bang Hội Chiến (Paper)
  - modes/pokemon/compose.yaml  # Chế độ Pokémon (Fabric) - chỉ chạy khi bật: --profile pokemon
  - relay/compose.yaml          # Cổng VPS (WireGuard, giữ IP thật) - chạy cùng --profile tunnel
  - dashboard/compose.yaml      # Dozzle: xem log/chat qua trình duyệt, http://localhost:8888/mc/log/
  - panel/compose.yaml          # Trang Cài đặt: chỉnh setting các chế độ, http://localhost:8889
  - site/compose.yaml           # Trang giới thiệu công khai cho người chơi, http://localhost:8892
  - modes/practice/compose.yaml
  - modes/sangtao/compose.yaml  # Thái Ấp Sáng Tạo (ẩn khỏi menu, vào qua cổng trong Thái Ấp)
