services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Chưa đặt DB_ROOT_PASSWORD trong .env}
      MARIADB_DATABASE: network
      MARIADB_USER: ${DB_USER:?Chưa đặt DB_USER trong .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Chưa đặt DB_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ../data/mariadb:/var/lib/mysql
      # Chạy 1 lần khi data/mariadb còn trống: tạo các database và bảng ban đầu
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Không mở cổng ra ngoài. Các container khác gọi bằng tên "mariadb".

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Chưa đặt REDIS_PASSWORD trong .env}
      - --appendonly
      - "yes"
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Sao lưu NGOÀI MÁY (19/10): mỗi OFFSITE_INTERVAL đẩy cả BACKUP_DIR (kho restic đã mã hoá + dump DB) lên đám mây bằng rclone.
  # Chỉ chạy với --profile offsite, sau khi cấu hình bằng ./ops/saoluu-ngoai.sh (rclone.conf ở data/rclone, không commit).
  backup-offsite:
    image: rclone/rclone:1.68.2
    profiles: ["offsite"]
    restart: unless-stopped
    entrypoint: ["sh", "/infra/backup-offsite.sh"]
    environment:
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-}            # vd gdrive:DuckyMoMo-saoluu
      OFFSITE_INTERVAL: ${OFFSITE_INTERVAL:-24h}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-30}    # file bị xoá/ghi đè ở máy nhà còn giữ trên mây ngần này ngày
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./:/infra:ro
      - ${BACKUP_DIR:-../backups}:/backups
      - ../data/rclone:/config/rclone

  # Sao lưu toàn bộ MariaDB theo chu kỳ (script: infra/backup-db.sh). File: backups/db/db-*.sql.gz
  backup-db:
    image: mariadb:11.4
    restart: unless-stopped
    entrypoint: ["sh", "/infra/backup-db.sh"]
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD}       # mariadb-dump đọc mật khẩu từ biến này, không lộ trên dòng lệnh
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-6h}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      # Gắn cả thư mục, không gắn file lẻ: Docker Desktop + WSL hay lỗi "no such file" với bind mount từng file
      - ./:/infra:ro
      - ${BACKUP_DIR:-../backups}/db:/backups
    depends_on:
      mariadb:
        condition: service_healthy
