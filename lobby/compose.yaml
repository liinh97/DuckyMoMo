services:
  lobby:
    image: itzg/minecraft-server   # khi chạy thật nên ghim tag cụ thể
    restart: unless-stopped
    stop_grace_period: 1m        # cho server đủ thời gian lưu thế giới khi tắt (mặc định Docker chỉ chờ 10 giây)
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: ${MC_VERSION:-26.2}
      # Không bật USE_AIKAR_FLAGS: lobby nhẹ, không cần giữ sẵn cả heap (AlwaysPreTouch).
      # INIT_MEMORY nhỏ: Java bắt đầu ít RAM, chỉ lấy thêm khi cần, tối đa MAX_MEMORY.
      INIT_MEMORY: 512M
      MAX_MEMORY: 2G              # lobby phẳng; 2G đủ cho đông người chờ ở sảnh (11/10: 1G -> 2G khi máy lên 64 GB)
      TZ: Asia/Ho_Chi_Minh
      RCON_PASSWORD: ${RCON_PASSWORD:?Chưa đặt RCON_PASSWORD trong .env (chạy lại ./ops/init.sh)}   # dùng chung với dịch vụ sao lưu, trang Cài đặt
      ONLINE_MODE: "FALSE"        # proxy lo xác thực; server con không mở cổng ra ngoài
      # Gói font tiếng Việt (ops/build-font-pack.sh ghi FONT_PACK_URL/SHA1 vào .env). Không bắt buộc: từ chối vẫn chơi được.
      RESOURCE_PACK: ${FONT_PACK_URL:-}
      RESOURCE_PACK_SHA1: ${FONT_PACK_SHA1:-}
      RESOURCE_PACK_ENFORCE: "FALSE"
      RESOURCE_PACK_PROMPT: '{"text":"Tải font tiếng Việt dễ đọc (khoảng 60 KB)? Bấm Có để chữ có dấu rõ hơn.","color":"gold"}'
      MOTD: "DuckyMoMo Lobby"
      # Lobby: đảo bay "Sakura Spawn" của ArtillexStudios (map tải về, bản 1.12.2; Paper tự chuyển chunk sang 26.2 khi nạp,
      # đã nạp + lưu sẵn). Spawn (0, 89, 0), viền 360 block quanh (0, -40), khoá trưa + trời quang.
      # Rơi khỏi đảo thì DuckyMoMoCore đưa về spawn (plugins/DuckyMoMoCore/config.yml: void-teleport).
      # World cũ vẫn giữ trong data/lobby: world (phẳng), lobby-hub, lobby-sanh (thử 12/10). Quay lại: LEVEL: world.
      LEVEL: sakura               # ghi rõ: level-name đã lưu trong server.properties, bỏ biến LEVEL không tự quay về
      LEVEL_TYPE: minecraft:flat
      GENERATE_STRUCTURES: "FALSE"
      MODE: adventure
      DIFFICULTY: peaceful
      SPAWN_MONSTERS: "FALSE"
      ALLOW_NETHER: "FALSE"
      VIEW_DISTANCE: "10"         # đảo sảnh rộng ~460 block, nhìn xa mới thấy hết
      SIMULATION_DISTANCE: "4"
      # Plugin tải tự động từ Modrinth
      # authmereloaded: lobby là nơi /register, /login (proxy chặn chưa đăng nhập thì không sang server khác)
      # viaversion/viabackwards/viarewind: cho client nhiều phiên bản vào (cài trên server Paper, không cài ở proxy).
      #   viaversion: client mới hơn server, viabackwards: client cũ hơn, viarewind: 1.7-1.8
      # decentholograms: chữ nổi (hologram) /dh create <tên> <chữ>; bản 2.10.1 hỗ trợ 26.2
      # Lưu ý: dòng bắt đầu bằng # BÊN TRONG khối '|' không phải comment, image itzg sẽ đọc thành tên plugin.
      # WorldEdit: Modrinth chỉ có bản beta cho 26.2 nên image không tự tải; chép tay worldedit-bukkit-7.4.5.jar vào data/lobby/plugins
      # (lấy từ data/banghoi-1/plugins). Không có trong Git.
      # simple-voice-chat (15/10): voice theo khoảng cách cho người chơi Java có cài mod; cấu hình ở plugins/voicechat/, đi qua proxy (UDP 24454).
      MODRINTH_PROJECTS: |
        luckperms
        authmereloaded
        viaversion
        viabackwards
        viarewind
        decentholograms
        playerparticles
        simplepets
        simple-voice-chat
      # Floodgate (bản Spigot, tải từ GeyserMC): nhận người chơi Bedrock từ proxy (send-floodgate-data), menu dạng form
      PLUGINS: |
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        https://cdn.modrinth.com/data/TsLS8Py5/versions/ziIzW16f/SkinsRestorer.jar
      # Biến cho các file cấu hình trong ./config và ./plugins
      CFG_SERVER_NAME: lobby
      # /rank mua (QR ủng hộ trong game): plugin hỏi panel tạo yêu cầu donate, cùng khoá với trang web
      PANEL_URL: http://panel:8080
      PANEL_SITE_KEY: ${PANEL_SITE_KEY:-}
      CFG_VELOCITY_SECRET: ${VELOCITY_SECRET}
      CFG_DB_USER: ${DB_USER}
      CFG_DB_PASSWORD: ${DB_PASSWORD}
      CFG_REDIS_PASSWORD: ${REDIS_PASSWORD}
      CFG_AUTHME_SECRET: ${AUTHME_SECRET}
    mem_limit: 3g
    volumes:
      - ../data/lobby:/data
      - ../data/proxy/plugins/floodgate/key.pem:/run/floodgate/key.pem:ro   # khoá Floodgate chung với proxy (plugins/floodgate/config.yml: key-file-name)
      - ./config:/config:ro        # -> /data/config (paper-global.yml…)
      - ./plugins:/plugins:ro      # -> /data/plugins (cấu hình plugin, jar tải tay)
      - ../modes:/modes:ro         # menu chọn chế độ đọc modes/*/mode.yml
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Sao lưu thế giới + plugin của lobby (itzg/mc-backup + restic: tạm dừng ghi qua RCON, chỉ lưu phần thay đổi, xoá bản quá hạn).
  # Sao lưu ngay: docker compose exec backup-lobby backup now. Khôi phục: README.md, mục "Sao lưu và khôi phục".
  backup-lobby:
    image: itzg/mc-backup
    restart: unless-stopped
    environment:
      RCON_HOST: lobby
      RCON_PASSWORD: ${RCON_PASSWORD}
      BACKUP_NAME: lobby
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-6h}
      # restic: kho sao lưu khử trùng lặp, lần đầu ~ cỡ world, các lần sau chỉ phần thay đổi (map 1:1000 nặng 17+ GB,
      # nén tar.gz mỗi lần sẽ đầy ổ). Mất RESTIC_PASSWORD là KHÔNG khôi phục được: cất thêm một bản ngoài máy.
      BACKUP_METHOD: restic
      RESTIC_REPOSITORY: /backups/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Chưa đặt RESTIC_PASSWORD trong .env (chạy lại ./ops/init.sh)}
      RESTIC_HOSTNAME: lobby
      PRUNE_RESTIC_RETENTION: "--keep-within ${BACKUP_KEEP_DAYS:-7}d --keep-daily 30"
      # Không sao lưu file tải lại được (*.jar), log, cache, và các world cũ đã cất bằng ops/doi-map-banghoi.sh
      EXCLUDES: "*.jar,cache,logs,*.tmp,world-*"   # world-* = các world cũ đã cất (world_nether, world_the_end dùng dấu gạch dưới nên vẫn được sao lưu)
      PAUSE_IF_NO_PLAYERS: "true"      # không ai vào kể từ lần trước thì bỏ qua, đỡ tốn ổ
      INITIAL_DELAY: 5m
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ../data/lobby:/data:ro
      # BACKUP_DIR trong .env phải là đường dẫn tuyệt đối (ví dụ /mnt/f/DuckyMoMo-backups); bỏ trống = backups/ trong repo
      - ${BACKUP_DIR:-../backups}/lobby:/backups
    depends_on:
      - lobby
