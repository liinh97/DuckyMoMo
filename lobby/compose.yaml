services:
  lobby:
    image: itzg/minecraft-server   # khi chạy thật nên ghim tag cụ thể
    restart: unless-stopped
    stop_grace_period: 1m        # cho server đủ thời gian lưu thế giới khi tắt (mặc định Docker chỉ chờ 10 giây)
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: ${MC_VERSION:-LATEST}
      # Không bật USE_AIKAR_FLAGS: bộ tham số đó chiếm sẵn toàn bộ heap (AlwaysPreTouch), máy nhà đang thiếu RAM.
      # INIT_MEMORY nhỏ: Java bắt đầu ít RAM, chỉ lấy thêm khi cần, tối đa MAX_MEMORY.
      INIT_MEMORY: 512M
      MAX_MEMORY: 1G              # lobby phẳng, ít người. Tăng khi đông (và mem_limit)
      TZ: Asia/Ho_Chi_Minh
      RCON_PASSWORD: ${RCON_PASSWORD:?Chưa đặt RCON_PASSWORD trong .env (chạy lại ./ops/init.sh)}   # dùng chung với dịch vụ sao lưu, trang Cài đặt
      ONLINE_MODE: "FALSE"        # proxy lo xác thực; server con không mở cổng ra ngoài
      MOTD: "DuckyMoMo Lobby"
      # Lobby: thế giới phẳng, an toàn, không quái
      LEVEL_TYPE: minecraft:flat
      GENERATE_STRUCTURES: "FALSE"
      MODE: adventure
      DIFFICULTY: peaceful
      SPAWN_MONSTERS: "FALSE"
      ALLOW_NETHER: "FALSE"
      VIEW_DISTANCE: "6"
      # Plugin tải tự động từ Modrinth
      # authmereloaded: lobby là nơi /register, /login (proxy chặn chưa đăng nhập thì không sang server khác)
      # viaversion/viabackwards/viarewind: cho client nhiều phiên bản vào (cài trên server Paper, không cài ở proxy).
      #   viaversion: client mới hơn server, viabackwards: client cũ hơn, viarewind: 1.7-1.8
      # Lưu ý: dòng bắt đầu bằng # BÊN TRONG khối '|' không phải comment, image itzg sẽ đọc thành tên plugin.
      MODRINTH_PROJECTS: |
        luckperms
        authmereloaded
        viaversion
        viabackwards
        viarewind
      # Biến cho các file cấu hình trong ./config và ./plugins
      CFG_SERVER_NAME: lobby
      CFG_VELOCITY_SECRET: ${VELOCITY_SECRET}
      CFG_DB_USER: ${DB_USER}
      CFG_DB_PASSWORD: ${DB_PASSWORD}
      CFG_REDIS_PASSWORD: ${REDIS_PASSWORD}
      CFG_AUTHME_SECRET: ${AUTHME_SECRET}
    mem_limit: 2g
    volumes:
      - ../data/lobby:/data
      - ./config:/config:ro        # -> /data/config (paper-global.yml…)
      - ./plugins:/plugins:ro      # -> /data/plugins (cấu hình plugin, jar tải tay)
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Sao lưu thế giới + plugin của lobby (itzg/mc-backup: tạm dừng ghi qua RCON, nén tar.gz, xoá bản cũ).
  # Sao lưu ngay: docker compose exec backup-lobby backup now. Khôi phục: README.md, mục "Sao lưu và khôi phục".
  backup-lobby:
    image: itzg/mc-backup
    restart: unless-stopped
    environment:
      RCON_HOST: lobby
      RCON_PASSWORD: ${RCON_PASSWORD}
      BACKUP_NAME: lobby
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-6h}
      PRUNE_BACKUPS_DAYS: ${BACKUP_KEEP_DAYS:-7}
      PAUSE_IF_NO_PLAYERS: "true"      # không ai vào kể từ lần trước thì bỏ qua, đỡ tốn ổ
      INITIAL_DELAY: 5m
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ../data/lobby:/data:ro
      # BACKUP_DIR trong .env phải là đường dẫn tuyệt đối (ví dụ /mnt/f/DuckyMoMo-backups); bỏ trống = backups/ trong repo
      - ${BACKUP_DIR:-../backups}/lobby:/backups
    depends_on:
      - lobby
