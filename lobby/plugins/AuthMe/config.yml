# AuthMe trên lobby: chỉ ghi các mục cần đổi, plugin tự điền phần còn lại.
# Tài liệu: https://github.com/AuthMe/AuthMeReloaded/blob/master/docs/config.md
DataSource:
    backend: MARIADB
    # Tắt cache khi chạy sau proxy (theo khuyến nghị của AuthMe)
    caching: false
    mySQLHost: mariadb
    mySQLPort: '3306'
    mySQLUseSSL: false
    mySQLCheckServerCertificate: false
    mySQLUsername: '${CFG_DB_USER}'
    mySQLPassword: '${CFG_DB_PASSWORD}'
    # Tài khoản dùng chung toàn network nên để trong database network
    mySQLDatabase: network
    mySQLTablename: authme
settings:
    serverName: DuckyMoMo
    messagesLanguage: vn
    # Mọi người đều nhận tiếng Việt (bật thì AuthMe theo ngôn ngữ client: client để English sẽ thấy tiếng Anh)
    perPlayerLocale: false
    # Người có bản quyền gõ /premium để lần sau vào thẳng, không cần mật khẩu (proxy xác minh với Mojang)
    enablePremium: true
    # Phiên đăng nhập (19/10): đăng nhập rồi thì vào lại từ CÙNG IP trong timeout phút khỏi gõ mật khẩu; đổi IP là phải đăng nhập lại.
    # Chỉ an toàn khi server thấy IP thật (cổng VPS, playit đã bỏ). Sửa ở Cài đặt › Toàn mạng › Đăng nhập.
    # 19/10 (rà bảo mật): 4G Viettel/Vina, quán net dùng chung IP công khai (CGNAT) → người khác cùng IP gõ đúng TÊN trong thời hạn
    # là vào thẳng không cần mật khẩu (cả tài khoản admin). Chủ server chốt: giữ phiên nhưng chỉ 60 phút (trước là 1440 = 1 ngày).
    sessions:
        enabled: true
        timeout: 60
    restrictions:
        # 0 = không giới hạn. Chơi trong mạng nhà nhiều người chung 1 IP,
        # để 1 như mặc định thì người thứ hai không đăng ký được. Xem lại khi mở công khai.
        maxRegPerIp: 0
        # Cho phép dấu chấm ở đầu: tiền tố tên người chơi Bedrock của Floodgate (ví dụ .TenNguoiChoi)
        allowedNicknameCharacters: '\.?[a-zA-Z0-9_]*'
        # 20/10: KHÔNG hiện "Bạn sở hữu N tài khoản: …" cho người chơi (lộ tên tài khoản của người dùng chung IP: quán net, 4G).
        # Admin xem bằng /authme accounts <tên>.
        displayOtherAccounts: false
        # 20/10: gõ sai mật khẩu KHÔNG bị đá ra (người dùng: sai 1 lần đã bị kick là quá gắt). Gõ lại tại chỗ;
        # sai 3 lần phải /captcha, sai 10 lần/30 phút cấm IP 30 phút (Security bên dưới), hết registerTimeout/timeout thì vẫn bị đá.
        kickOnWrongPassword: false
        # 20/10: mật khẩu phải có cả CHỮ và SỐ (chặn 123455, 000000, abcdef… mà danh sách cấm không bắt hết). Chỉ ký tự ASCII thấy được.
        # Câu báo lỗi: messages_vn.yml › password.forbidden_characters (repo: lobby/plugins/AuthMe/messages/).
        allowedPasswordCharacters: '(?=.*[A-Za-z])(?=.*[0-9])[!-~]*'
    registration:
        dialog:
            # Không dùng hộp thoại mật khẩu (người dùng muốn vào game rồi gõ /login, /register trong chat).
            # preJoin: hộp thoại trước khi vào (màn hình đen); postJoin: hộp thoại sau khi vào sảnh.
            preJoin:
                enable: false
            postJoin:
                enable: false
    security:
        minPasswordLength: 6
        passwordHash: BCRYPT
        unsafePasswords:
            -   '123456'
            -   password
            -   qwerty
            -   '12345'
            -   '54321'
            -   '123456789'
            -   help
            -   '12345678'
            -   '1234567'
            -   '111111'
            -   '000000'
            -   '123123'
            -   abc123
            -   matkhau
            -   minecraft
            -   iloveyou
            -   admin
            -   '666666'
            -   '888888'
            -   '112233'
            -   qwerty123
            -   '1234567890'
            -   asdfgh
            -   matkhau1
            -   matkhau123
            -   abc123456
            -   a123456
            -   123456a
            -   minecraft1
            -   qwerty1
            -   admin123
            -   duckymomo1
            -   duckymomo123
            -   vietnam1
            -   password1
Hooks:
    bungeecord: true
    # Lấy từ AUTHME_SECRET trong .env, phải trùng proxySharedSecret trên proxy
    proxySharedSecret: '${CFG_AUTHME_SECRET}'
# Chống dò mật khẩu: sai 10 lần trong 30 phút thì cấm IP đó 30 phút.
# 20/10: TẮT captcha chữ của AuthMe (chép được nên bot qua dễ, người dùng thấy thừa vì đã có captcha BẢN ĐỒ của Sonar lúc vào lần đầu).
# Trước đó (19/10): sai 3 lần phải gõ /captcha <mã>
# (ngắn vì nhiều người chung IP 4G/quán net). Sai mật khẩu còn bị kick (kickOnWrongPassword mặc định), Sonar ở proxy hãm tốc độ vào lại.
Security:
    captcha:
        useCaptcha: false
        maxLoginTry: 3
        captchaLength: 5
    tempban:
        enableTempban: true
        maxLoginTries: 10
        tempbanLength: 30
        minutesBeforeCounterReset: 30
