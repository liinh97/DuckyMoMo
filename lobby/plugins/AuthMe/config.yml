# AuthMe trên lobby: chỉ ghi các mục cần đổi, plugin tự điền phần còn lại.
# Tài liệu: https://github.com/AuthMe/AuthMeReloaded/blob/master/docs/config.md
DataSource:
    backend: MARIADB
    # Tắt cache khi chạy sau proxy (theo khuyến nghị của AuthMe)
    caching: false
    mySQLHost: mariadb
    mySQLPort: '3306'
    mySQLUseSSL: false
    mySQLCheckServerCertificate: false
    mySQLUsername: '${CFG_DB_USER}'
    mySQLPassword: '${CFG_DB_PASSWORD}'
    # Tài khoản dùng chung toàn network nên để trong database network
    mySQLDatabase: network
    mySQLTablename: authme
settings:
    serverName: DuckyMoMo
    messagesLanguage: vn
    # Mọi người đều nhận tiếng Việt (bật thì AuthMe theo ngôn ngữ client: client để English sẽ thấy tiếng Anh)
    perPlayerLocale: false
    # Người có bản quyền gõ /premium để lần sau vào thẳng, không cần mật khẩu (proxy xác minh với Mojang)
    enablePremium: true
    # Phiên đăng nhập (19/10): đăng nhập rồi thì vào lại từ CÙNG IP trong timeout phút khỏi gõ mật khẩu; đổi IP là phải đăng nhập lại.
    # Chỉ an toàn khi server thấy IP thật (cổng VPS, playit đã bỏ). Sửa ở Cài đặt › Toàn mạng › Đăng nhập.
    sessions:
        enabled: true
        timeout: 1440
    restrictions:
        # 0 = không giới hạn. Chơi trong mạng nhà nhiều người chung 1 IP,
        # để 1 như mặc định thì người thứ hai không đăng ký được. Xem lại khi mở công khai.
        maxRegPerIp: 0
        # Cho phép dấu chấm ở đầu: tiền tố tên người chơi Bedrock của Floodgate (ví dụ .TenNguoiChoi)
        allowedNicknameCharacters: '\.?[a-zA-Z0-9_]*'
    registration:
        dialog:
            # Không dùng hộp thoại mật khẩu (người dùng muốn vào game rồi gõ /login, /register trong chat).
            # preJoin: hộp thoại trước khi vào (màn hình đen); postJoin: hộp thoại sau khi vào sảnh.
            preJoin:
                enable: false
            postJoin:
                enable: false
    security:
        minPasswordLength: 6
        passwordHash: BCRYPT
Hooks:
    bungeecord: true
    # Lấy từ AUTHME_SECRET trong .env, phải trùng proxySharedSecret trên proxy
    proxySharedSecret: '${CFG_AUTHME_SECRET}'
