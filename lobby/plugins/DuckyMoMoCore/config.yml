# DuckyMoMoCore ở lobby: bật menu chọn chế độ (la bàn trên tay + /menu)
lobby-menu:
  enabled: true
  modes-dir: /modes       # ../modes gắn vào đây (chỉ đọc), xem lobby/compose.yaml
  item-slot: 4

# Giới hạn đăng ký AuthMe: tối đa N tài khoản mỗi IP trong 24 giờ (luật mùa 1, mục 37). Không tính IP 127.x (playit) và mạng nội bộ.
# Không dùng maxRegPerIp của AuthMe: nó tính tổng vĩnh viễn, sẽ khoá cả quán net / mạng 4G dùng chung IP. Lưu: dangky-ip.yml
register-limit:
  enabled: true
  per-ip-per-day: 2

# World sảnh là đảo bay (Sakura Spawn): rơi xuống dưới y này thì về spawn, không chết vì hư không
void-teleport:
  below-y: 0
  spawn-on-join: true      # mỗi lần vào sảnh đều đứng giữa ô spawn (0, 89, 0)

# Chat có prefix role + rank donate từ LuckPerms ("[Admin] [VIP] Linh: ..."), vì lobby không có EssentialsX Chat
chat-format:
  enabled: true

# Lọc chat (chung lobby/banghoi/practice, giữ giống nhau ở cả 3 file config.yml): che từ tục bằng ***, chống spam.
#   words-accented: khớp đúng dạng CÓ DẤU (từ mà bỏ dấu sẽ trùng từ thường: lồn/lớn, cặc/các, buồi/buổi, đéo/đeo, đĩ/đi).
#   words-plain: khớp sau khi bỏ dấu (bắt cả kiểu gõ không dấu), chỉ dùng cho từ không trùng từ thường.
#   Quyền duckymomo.chat.bypass (op): không bị chống spam.
chat-filter:
  enabled: true
  words-accented: [lồn, cặc, buồi, đéo, đĩ, đụ, đụ má, đụ mẹ, mẹ mày, má mày, con mẹ mày, óc chó, chó má, thằng chó, con chó,
                   ngu như chó, lìn, cứt]
  words-plain: [dm, dmm, dmmm, dcm, dkm, dcmm, dcmn, dit, dit me, dit ma, djt, vcl, vkl, vcc, vklm, vl, vloz, vlon, clm, clmm, cmm,
                cmn, cmnr, ccmm, dmcs, dmvl, cl, cc, loz, l0n, lon me, cak, cac lon, du ma, du me, ditconme, dcmvl, dmml, fuck,
                fucking, shit, bitch, dick, pussy, motherfucker]
  min-interval-seconds: 1.5
  repeat-seconds: 30
  caps-ratio: 0.7
  too-fast-message: "&cChat chậm lại một chút!"
  repeat-message: "&cĐừng gửi lặp lại cùng một câu!"

# Rank donate (tước vị) + thông báo vào/ra server. Giữ GIỐNG NHAU ở lobby/banghoi/practice.
# Nhóm LuckPerms: tools/donate-ranks.cmds (bậc cao kế thừa bậc thấp). CHỈ quyền trang trí (luật Mojang).
# Admin cấp: /rank give <tên> <bậc> <1|3|6|12> (1 tháng = 30 ngày, gia hạn cộng dồn). /rank remove, /rank check.
# prices: giá ĐỀ XUẤT (12/10/2026), sửa theo ý chủ server.
donate-ranks:
  enabled: true
  how-to-buy: "&7Mua rank: nhắn admin qua Discord/Zalo, chuyển khoản ghi &fTÊN NHÂN VẬT + GÓI&7. Admin cấp trong ngày."
  join-message: "&8[&a+&8] {prefix}&f{player}"
  quit-message: "&8[&c-&8] {prefix}&f{player}"
  rank-join-message: "&e✦ {tiercolor}{tier} &f{player} &evừa giá lâm!"
  tiers:
    - group: namtuoc
      name: Nam Tước
      color: "&a"
      perks: [prefix, chat màu, /hat, chào khi vào server, /cuahang khi ở kinh đô]
      prices: [1 tháng 20k, 3 tháng 50k, 6 tháng 90k, 1 năm 160k]
    - group: tutuoc
      name: Tử Tước
      color: "&b"
      perks: [/nick, 1 hiệu ứng hạt (/pp)]
      prices: [1 tháng 40k, 3 tháng 100k, 6 tháng 180k, 1 năm 320k]
    - group: batuoc
      name: Bá Tước
      color: "&9"
      perks: [nick có màu, 2 hiệu ứng hạt, 1 pet (/pet)]
      prices: [1 tháng 70k, 3 tháng 180k, 6 tháng 320k, 1 năm 560k]
    - group: hautuoc
      name: Hầu Tước
      color: "&d"
      perks: [chat đậm/nghiêng, 3 hiệu ứng hạt, pet hiếm]
      prices: [1 tháng 100k, 3 tháng 260k, 6 tháng 460k, 1 năm 800k]
    - group: congtuoc
      name: Công Tước
      color: "&6"
      perks: [chat/nick màu tuỳ chọn (hex), 6 hiệu ứng hạt, mọi pet, chuông khi vào server]
      prices: [1 tháng 150k, 3 tháng 390k, 6 tháng 690k, 1 năm 1.200k]

# Cẩm nang trong game (/huongdan): nội dung plugins/DuckyMoMoCore/huongdan.yml (bản gốc modes/_network/huongdan.yml, chép bằng ./ops/huongdan.sh)
guide:
  default-chapter: batdau
  join-hint: "&6✦ &fMới chơi? Gõ &e/huongdan &f(hoặc bấm vào đây) để xem cẩm nang."

# Ủng hộ bằng QR ngay trong game (/rank mua): chọn gói -> panel tạo yêu cầu (chung hàng chờ trang quản trị > Donate) -> QR VietQR vẽ trên tấm bản đồ,
# hết hạn sau minutes phút. Cần PANEL_URL + PANEL_SITE_KEY (compose) và tài khoản ngân hàng trong site/config/site.yml (donate). Thiếu thì chỉ hiện link web.
donate-qr:
  enabled: true
  minutes: 10
  web: "https://app.goc6.io.vn/mc/web/taikhoan.html"

# Quảng trường Vinh danh (/vinhdanh): đọc S<mùa>.json do Bang Hội Chiến ghi trong thư mục dùng chung (data/shared/vinhdanh, mount /shared).
# Admin đứng đúng chỗ: /vinhdanh dat <mùa|moinhat> <tieude|bachu|chienthan|phuho|kientrucsu|dautruong|pet>
hall-of-fame:
  display: true
  dir: /shared/vinhdanh

# Tiêu đề khung nhắc lúc vào game (gom hướng dẫn, mùa, công thành, điểm danh… thành một khung)
join-notes-title: "DuckyMoMo"
