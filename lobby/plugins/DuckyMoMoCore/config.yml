# DuckyMoMoCore ở lobby: bật menu chọn chế độ (la bàn trên tay + /menu)
lobby-menu:
  enabled: true
  modes-dir: /modes       # ../modes gắn vào đây (chỉ đọc), xem lobby/compose.yaml
  item-slot: 4

# Giới hạn đăng ký AuthMe theo IP (luật mùa 1, mục 37). Không tính IP nội bộ. Lưu: dangky-ip.yml.
# Không dùng maxRegPerIp của AuthMe vì không có danh sách IP miễn (whitelist) cho quán net / nhà đông người.
register-limit:
  enabled: true
  # 20/10 chủ server: mỗi IP TỔNG tối đa 2 tài khoản, mãi mãi (đếm cả tài khoản cũ AuthMe gắn IP đó). Quán net / nhà đông người: thêm IP vào whitelist.
  per-ip-total: 2
  per-ip-per-day: 0         # giới hạn phụ theo 24 giờ (0 = tắt, đã có per-ip-total)
  per-ip-per-30-days: 0     # giới hạn phụ theo 30 ngày (0 = tắt)
  # IP không bị giới hạn (chủ server, admin test, quán net quen): mỗi dòng 1 IP; kết thúc bằng "." = cả dải (vd "171.255.251.").
  # Sửa ở Cài đặt › Toàn mạng › Sảnh › Giới hạn đăng ký tài khoản.
  # Miễn theo TÊN thành viên (dễ dùng nhất): IP lần đăng nhập gần nhất của người đó được miễn, đổi mạng thì tự đi theo.
  # Quán net: nhập tên 1 người trong nhóm, người đó đăng nhập ở quán một lần là cả nhóm ở quán đăng ký được.
  whitelist-players:
    - vanlinh
    - Itrap
  # Miễn theo IP (khi cần cố định một IP / dải IP)
  whitelist: []

# World sảnh là đảo bay (Sakura Spawn): rơi xuống dưới y này thì về spawn, không chết vì hư không
void-teleport:
  below-y: 0
  spawn-on-join: true      # mỗi lần vào sảnh đều đứng giữa ô spawn (0, 89, 0)

# Chat có prefix từ LuckPerms (chỉ một: nhóm cao nhất, vd "[Công Tước] Linh: ..."), vì lobby không có EssentialsX Chat
chat-format:
  enabled: true

# Lọc chat (chung lobby/banghoi/practice, giữ giống nhau ở cả 3 file config.yml): che từ tục bằng ***, chống spam.
#   words-accented: khớp đúng dạng CÓ DẤU (từ mà bỏ dấu sẽ trùng từ thường: lồn/lớn, cặc/các, buồi/buổi, đéo/đeo, đĩ/đi).
#   words-plain: khớp sau khi bỏ dấu (bắt cả kiểu gõ không dấu), chỉ dùng cho từ không trùng từ thường.
#   Quyền duckymomo.chat.bypass (op): không bị chống spam.
chat-filter:
  enabled: true
  words-accented: [lồn, cặc, buồi, đéo, đĩ, đụ, đụ má, đụ mẹ, mẹ mày, má mày, con mẹ mày, óc chó, chó má, thằng chó, con chó,
                   ngu như chó, lìn, cứt]
  words-plain: [dm, dmm, dmmm, dcm, dkm, dcmm, dcmn, dit, dit me, dit ma, djt, vcl, vkl, vcc, vklm, vl, vloz, vlon, clm, clmm, cmm,
                cmn, cmnr, ccmm, dmcs, dmvl, cl, cc, loz, l0n, lon me, cak, cac lon, du ma, du me, ditconme, dcmvl, dmml, fuck,
                fucking, shit, bitch, dick, pussy, motherfucker]
  min-interval-seconds: 1.5
  repeat-seconds: 30
  caps-ratio: 0.7
  too-fast-message: "&cChat chậm lại một chút!"
  repeat-message: "&cĐừng gửi lặp lại cùng một câu!"
  # chặn quảng cáo: câu có tên miền (abc.net, abc chấm net) hoặc IP thì không gửi; allow = tên miền được nhắc
  ads:
    enabled: true
    allow: [goc6.io.vn]
    message: "&cKhông quảng cáo server hay trang web khác trong chat."

# Rank donate (tước vị) + thông báo vào/ra server. Giữ GIỐNG NHAU ở lobby/banghoi/practice.
# Nhóm LuckPerms: tools/donate-ranks.cmds (bậc cao kế thừa bậc thấp). CHỈ quyền trang trí (luật Mojang).
# Admin cấp: /rank give <tên> <bậc> <1|3|6|12> (1 tháng = 30 ngày, gia hạn cộng dồn). /rank remove, /rank check.
# prices: giá ĐỀ XUẤT (12/10/2026), sửa theo ý chủ server.
donate-ranks:
  enabled: true
  skin-sync: true         # đồng bộ quyền skin theo rank vào LuckPerms (chỉ BẬT ở một server: sảnh)
  how-to-buy: "&7Mua rank: nhắn admin qua Discord/Zalo, chuyển khoản ghi &fTÊN NHÂN VẬT + GÓI&7. Admin cấp trong ngày."
  join-message: "&8[&a+&8] {prefix}&f{player}"
  quit-message: "&8[&c-&8] {prefix}&f{player}"
  rank-join-message: "&e✦ {tiercolor}{tier} &f{player} &evừa giá lâm!"
  tiers:
    - group: namtuoc
      name: Nam Tước
      color: "&a"
      perks: [prefix, chat màu, /hat, chào khi vào server, /cuahang khi ở kinh đô, 1 balo (/balo), chờ dịch chuyển 3 giây]
      prices: [1 tháng 20k, 3 tháng 50k, 6 tháng 90k, 1 năm 160k]
      skins: []          # skin độc quyền (tên custom skin SkinsRestorer: /sr createcustom <tên> <link>), bậc cao kế thừa bậc thấp
    - group: tutuoc
      name: Tử Tước
      color: "&b"
      perks: [/nick, 1 hiệu ứng hạt (/pp), 2 balo]
      prices: [1 tháng 40k, 3 tháng 100k, 6 tháng 180k, 1 năm 320k]
      skins: []          # skin độc quyền (tên custom skin SkinsRestorer: /sr createcustom <tên> <link>), bậc cao kế thừa bậc thấp
    - group: batuoc
      name: Bá Tước
      color: "&9"
      perks: [nick có màu, 2 hiệu ứng hạt, 1 pet (/pet)]
      prices: [1 tháng 70k, 3 tháng 180k, 6 tháng 320k, 1 năm 560k]
      skins: []          # skin độc quyền (tên custom skin SkinsRestorer: /sr createcustom <tên> <link>), bậc cao kế thừa bậc thấp
    - group: hautuoc
      name: Hầu Tước
      color: "&d"
      perks: [chat đậm/nghiêng, 3 hiệu ứng hạt, pet hiếm, 3 balo]
      prices: [1 tháng 100k, 3 tháng 260k, 6 tháng 460k, 1 năm 800k]
      skins: []          # skin độc quyền (tên custom skin SkinsRestorer: /sr createcustom <tên> <link>), bậc cao kế thừa bậc thấp
    - group: congtuoc
      name: Công Tước
      color: "&6"
      perks: [chat/nick màu tuỳ chọn (hex), 6 hiệu ứng hạt, mọi pet, chuông khi vào server, 4 balo]
      prices: [1 tháng 150k, 3 tháng 390k, 6 tháng 690k, 1 năm 1.200k]
      skins: []          # skin độc quyền (tên custom skin SkinsRestorer: /sr createcustom <tên> <link>), bậc cao kế thừa bậc thấp

# Cẩm nang trong game (/huongdan): nội dung plugins/DuckyMoMoCore/huongdan.yml (bản gốc modes/_network/huongdan.yml, chép bằng ./ops/huongdan.sh)
guide:
  default-chapter: batdau
  join-hint: "&6✦ &fMới chơi? Gõ &e/huongdan &f(hoặc bấm vào đây) để xem cẩm nang."

# Ủng hộ bằng QR ngay trong game (/rank mua): chọn gói -> panel tạo yêu cầu (chung hàng chờ trang quản trị > Donate) -> QR VietQR vẽ trên tấm bản đồ,
# hết hạn sau minutes phút. Cần PANEL_URL + PANEL_SITE_KEY (compose) và tài khoản ngân hàng trong site/config/site.yml (donate). Thiếu thì chỉ hiện link web.
donate-qr:
  enabled: true
  minutes: 10
  web: "https://app.goc6.io.vn/mc/web/taikhoan.html"

# Quảng trường Danh vọng (/vinhdanh): đọc S<mùa>.json do Bang Hội Chiến ghi trong thư mục dùng chung (data/shared/vinhdanh, mount /shared).
# Admin đứng đúng chỗ: /vinhdanh dat <mùa|moinhat> <tieude|bachu|chienthan|phuho|kientrucsu|dautruong|pet>
hall-of-fame:
  display: true
  dir: /shared/vinhdanh

# Tiêu đề khung nhắc lúc vào game (gom hướng dẫn, mùa, công thành, điểm danh… thành một khung)
join-notes-title: "DuckyMoMo"

# Đăng nhập trang web bằng mã /web (19/10: 5 → 60 phút). Sửa ở Cài đặt › Đăng nhập trang web (ghi cả 4 server).
web-login:
  code-minutes: 60

# Gói tài nguyên theo lựa chọn từng người (/caidat › Font tiếng Việt, 20/10). URL/SHA1 do ./ops/build-font-pack.sh ghi vào .env
# -> compose -> CFG_*. Bật = gói font tiếng Việt + hình vật phẩm; tắt = chỉ hình vật phẩm (font gốc). Không bắt buộc tải.
resource-pack:
  font-url: "${CFG_FONT_PACK_URL}"
  font-sha1: "${CFG_FONT_PACK_SHA1}"
  item-url: "${CFG_ITEM_PACK_URL}"
  item-sha1: "${CFG_ITEM_PACK_SHA1}"
  font-prompt: "&6Tải font tiếng Việt dễ đọc (khoảng 70 KB)? Bấm Có để chữ có dấu rõ hơn. Không thích: /caidat tắt Font tiếng Việt."
  item-prompt: "&6Tải hình vật phẩm riêng của server (khoảng 12 KB)?"

# Đăng nhập lâu (23/10): người trong danh sách được giữ đăng nhập lâu hơn, cả trong game (sảnh: vào lại từ ĐÚNG IP lần trước, chưa quá
# "ngay" ngày thì tự đăng nhập, người khác vẫn theo phiên AuthMe) lẫn web (trang tài khoản + quyền quản trị /web giữ "ngay" ngày).
# Chỉ thêm người tin cậy. Sửa ở Cài đặt › Toàn mạng › Đăng nhập lâu.
dang-nhap-lau:
  ngay: 30
  nguoi: [Linh]
