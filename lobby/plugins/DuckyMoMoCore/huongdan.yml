# Cẩm nang trong game (/huongdan, /hd). Sửa trên trang Cài đặt > "Cẩm nang game" (tự chép, có hiệu lực ngay), hoặc sửa file này rồi chạy ./ops/huongdan.sh (chép sang lobby, banghoi, practice,
# có hiệu lực ngay, không cần khởi động lại). Plugin: DuckyMoMoCore (Guide.java).
# - Plugin TỰ NGẮT DÒNG theo bề rộng chữ và TỰ SANG TRANG khi quá 13 dòng (dòng cuối tự thêm "« Mục lục"). Xuống dòng bằng \n hoặc khối "|-".
#   Nên giữ mỗi trang nguồn khoảng 12 dòng ngắn để không bị cắt giữa chừng (trang tiếp theo không có tiêu đề).
# - MỤC LỤC chỉ có 1 trang (14 dòng): toc-title + mỗi chương 1 dòng + toc-footer. Tối đa khoảng 11 chương, tên chương ngắn (≤ 17 chữ).
# - Mã chương batdau / banghoi / practice là chương mở mặc định ở sảnh / Bang Hội Chiến / Practice (guide.default-chapter): đừng đổi mã.
# - Mã màu: &0 đen, &1 xanh đậm, &2 xanh lá đậm, &4 đỏ đậm, &5 tím, &6 vàng cam, &8 xám, &r bỏ định dạng.
#   Nền sách màu giấy: tránh &e/&f/&a (khó đọc).
# - Người chơi điện thoại (Bedrock) thấy cả chương trong một bảng.
# - SỐ LIỆU (phí thị trấn, lịch công thành, giá...) ghi tay: đổi trên trang Cài đặt thì sửa luôn ở đây.
#   Đối chiếu 19/10: Towny 1500/75/3000 xu, phí 30/300 xu/ngày (định giá lại 21/10); hoà bình chờ 2 ngày, rời 14 ngày; Hội đồng nhiệm kỳ 30 ngày;
#   tổ chức 3 người, 300 xu/tuần; Kiến Trúc Sư đăng ký tuần 12, bình chọn tuần 13; bắt pet gốc 30%, bùa +25%; Thái Ấp 15.000/24.000/45.000.
