    &1/binhchon xem <thị trấn> &0tham quan
    &1/binhchon <thị trấn> &0bỏ phiếu (tuần 13&r&0)
  - |-
    &6KIẾN TRÚC SƯ (tiếp)
    &4Lưu ý: &01 phiếu/người, ≥5 giờ chơi, không bầu thị trấn mình, acc phụ không bầu.
- id: congthanh
  name: Công thành
  pages:
  - |-
    &6Công thành (1)
    &0Muốn đánh thị trấn địch: cắm banner màu&r&0 (không trắng) sát rìa thị trấn đó.
    &0Chỉ cắm cờ được &4thứ Năm&0, quốc gia cần &42 thị trấn&0.
    &1/sw &0xem cuộc vây.
  - |-
    &6Công thành (1b)
    &0Quốc gia trả quỹ chiến tranh&r&0 60 xu mỗi ô đất của thị trấn bị vây.
    &4Lưu ý: &0thị trấn mới lập, vừa bị vây, dân hoà bình không vây được.
  - |-
    &6Công thành (2)
    &0Đánh theo phiên&r&0:
    &0Tối thứ 7 và CN, 20:00 và 21:00
    &0(mỗi phiên 1 giờ, 4 phiên mỗi cuộc vây).
    &0Trong phiên, quanh cờ bật PvP.
    &1/lichcongthanh &0phiên tới, có cho pet không.
  - |-
    &6Công thành (3)
    &0Ghi điểm: giữ khu vực quanh cờ và hạ lính địch.
    &0Hết các phiên, bên nhiều điểm thắng: lấy quỹ, cướp tiền hoặc chiếm thị trấn.
    &0Thua mà thiếu tiền thì trả nợ dần 7 ngày&r&0.
    &2Chết trong vùng vây không rơi đồ.
  - |-
    &6Công thành (4)
    &0Thị trấn vừa bị vây được miễn vây 7 ngày&r&0 (thủ đô 14 ngày), thị trấn mới lập cũng được 7 ngày.
    &0Thị trấn không bị phá hay trộm khi chủ offline.
    &8Chỉ người chơi ≥5 giờ, không phải acc phụ mới có quân hàm.
  - |-
    &6THẮNG RỒI LÀM GÌ
    &0Vua bên thắng đứng cạnh cờ:
    &0Cướp tiền: &1đặt một cái rương
    &0Chiếm làm thuộc địa: &1cắm lại cờ màu
    &0Rút quân / đầu hàng: &1cắm cờ trắng
    &8Xem trận: /sw hud <thị trấn>
  - |-
    &6PHONG QUÂN HÀM
    &0Có quân hàm mới được tính điểm trận, giữ cờ.
    &0Vua gõ:
    &1/n rank add <người> <hàm>
    &0Thị trưởng gõ:
    &1/t rank add <người> guard
  - |-
    &6QUÂN HÀM (tiếp)
    &0Hàm: private, sergeant, lieutenant, captain, major, colonel, general.
    &0Gỡ: &1/n rank remove
    &8Người được phong cần ≥5 giờ chơi thật, không phải acc phụ.
  - |-
    &6CÂN BẰNG
    &0Nước to đi vây tốn quỹ hơn, thuộc địa tốn phí, tối đa 3&r&0 thuộc địa.
    &0Thủ nhà ít người được cộng điểm.
    &0Nước nắm nhiều thị trấn thành &4Bá chủ&0: đánh vào được lợi.
    &1/canbang
  - |-
    &6KHO LƯƠNG
    &0Quân đánh trong vùng vây ăn từ kho lương thị trấn mình&r&0: còn lương thì no, cạn thì mau đói.
    &1/kholuong &0xem kho
    &1/kholuong nop &0nộp đồ đang cầm (nông sản, cá, món)
    &1/kholuong noptat &0nộp nông sản cả túi
    &1/kholuong top
  - |-
    &6MÓN ĂN RA TRẬN
    &1/nauan &0nấu cá câu + nông sản thành món có hiệu ứng (chạy nhanh, hồi máu…).
    &0Nấu trong Thái Ấp của mình: hiệu ứng lâu hơn 50%.
    &0Món cũng nộp được vào kho lương.
  - |-
    &6TRỜI ĐẤT CÔNG THÀNH
    &8Đêm&0: tối mù, trừ ai dẫn pet mắt đêm&r&0 (dơi, mèo, cáo, sói, nhện).
    &1Mưa&0: đi bộ chậm, cưỡi pet thì không; pet nước mạnh, pet lửa yếu.
    &6Nắng gắt&0 mùa khô: mau đói, trừ ai dẫn pet lửa.
  - |-
    &6LÍNH ĐÁNH THUÊ
    &0Không thuộc nước nào vẫn ra trận được (≥5 giờ chơi):
    &1/linhdanhthue dangky <giá>
    &8Vd: /linhdanhthue dangky 2000
    &1/linhdanhthue huy &0rút
    &0Vua/tướng thuê bằng ngân khố:
    &1/linhdanhthue thue <tên>
  - |-
    &6LÍNH ĐÁNH THUÊ (tiếp)
    &0Hợp đồng 48 giờ: vào vùng vây không ốm, ăn kho lương nước thuê. Server thu 10%.
  - |-
    &4TREO THƯỞNG
    &1/treothuong &0xem ai bị treo
    &1/treothuong dat <người> <xu>
    &8Vd: /treothuong dat Ga 500
    &0Ai hạ được người đó nhận hết tiền.
    &4Lưu ý: &0tiền treo không lấy lại được.
- id: kinhte
  name: Kiếm tiền, buôn bán
  pages:
  - |-
    &6Kiếm tiền
    &0Bắt đầu 500 xu&r&0. &1/bal &0xem tiền.
    &2Nghề:&0 gõ &1/jobs&0 chọn 1 nghề&r&0 (thợ mỏ, tiều phu, nông dân, thợ săn, ngư dân…). Làm đúng việc của nghề mới có tiền.
    &8Vào / rời nghề phải đứng trong kinh đô hoặc thị trấn hoà bình (dân hoà bình ở đâu cũng được); xem nghề thì ở đâu cũng được. Đổi nghề chờ 1 ngày, vào lại nghề cũ mất bớt cấp.
    &4Lưu ý: &0phá lại khối tự đặt không có tiền; nhiệm vụ ngày cũng không tính.
  - |-
    &6Bán đồ cho server
    &1/cuahang &0bấm nút bán trong cửa hàng
    &1/sell <tên món> [số] &0vd /sell cobblestone 64
    &1/worth &0xem giá món đang cầm
    &0Biển [Sell]&r&0 ở spawn: bấm để bán.
    &8Chỉ bán được trong kinh đô / thị trấn hoà bình (dân hoà bình ở đâu cũng được). Ở kinh đô +10%. Tối đa 8.000 xu/ngày.
  - |-
    &6Chuyển tiền
    &1/pay <tên> <xu>
    &8Vd: /pay Linh 100
    &1/baltop &0top giàu
    &4Lưu ý: &0chuyển rồi không lấy lại được. Mua bán đồ thì dùng &1/trade&0.
  - |-
    &6Đổi đồ an toàn
    &1/trade <tên> &0mời đổi đồ
    &8Vd: /trade Linh
    &0Hai bên bỏ đồ/tiền vào bảng, cả hai cùng bấm đồng ý&r&0 mới đổi.
    &4Đừng đưa đồ trước "tin tưởng": admin không trả lại đồ bị lừa ngoài /trade.
  - |-
    &6Shop rương: tạo shop
    &01. Đặt rương ở đất của bạn (chế độ sinh tồn).
    &02. Cầm món muốn bán, nhìn vào rương, gõ:
    &1/qs create <giá>
    &8Vd: /qs create 5 (5 xu mỗi món)
    &03. Bỏ hàng vào rương. Hết hàng thì người mua được báo.
    &0Người mua: &1bấm trái&0 vào shop mở menu chọn số lượng, &1Shift + bấm trái&0 mua ngay 1 chồng.
  - |-
    &6Shop rương: sửa shop
    &0Nhìn vào shop rồi gõ:
    &1/qs price <giá> &0đổi giá
    &1/qs sell &0shop bán ra (mặc định)
    &1/qs buy &0shop thu mua (người khác bán cho bạn)
    &1/qs remove &0dỡ shop
    &1/qs find <món> &0tìm shop gần nhất
  - |-
    &6Shop rương (tiếp)
    &0Tối đa 10 shop (Thương Hội nhiều hơn). Người khác mua được khi bạn offline.
  - |-
    &6CHỢ ĐEN /choden
    &0Một lệnh cho cả chợ giữa người chơi.
    &1/choden mua &0xem hàng, bấm là mua
    &1/choden ban [số] <giá cả lô> &0bán món đang cầm
    &8Vd: /choden ban 16 80 (16 món, cả lô 80 xu); bỏ số = cả chồng
    &1/choden cuatoi &0đồ đang treo
    &1/choden hethan &0đồ hết hạn (tự về túi khi túi còn chỗ)
    &8Chợ đen: dùng ở đâu cũng được.
  - |-
    &6Dân làng bán hàng
    &0NPC dân làng ở spawn: bấm chuột phải để mua/bán như dân làng thường.
    &1/shopsearch <món> &0tìm shop
    &8Bán cho dân làng tối đa 1.500 xu/ngày (riêng với /sell 8.000).
  - |-
    &6Cửa hàng Kinh Đô
    &0Bấm NPC cửa hàng&r&0 ở spawn: vật liệu (đất, đá, kính…), đồ trang trí, danh hiệu, trả bằng xu.
    &0Rank ủng hộ: gõ &1/cuahang&0 khi đứng trong kinh đô.
    &8Không bán gì tăng sức mạnh.
  - |-
    &6CHỢ ĐEN: THU MUA
    &0Cần nhiều gỗ, đá…? Cầm 1 món làm mẫu:
    &1/choden dat <số> <giá/món>
    &8Vd: /choden dat 1000 1
    &0(tiền 1000 xu được giữ trước).
    &0Người khác &1/choden thumua&0 bấm đơn để giao, nhận tiền ngay.
  - |-
    &6THU MUA (tiếp)
    &1/choden don &0nhận hàng
    &1/choden huy <số> &0huỷ, hoàn tiền phần chưa giao
    &8Phí đăng đơn 2% (không hoàn), đơn hạn 7 ngày, tối đa 5 đơn. Chỉ nhận đồ trơn (không tên, không phù phép).
  - |-
    &6THỢ RÈN
    &1/thoren &0rèn đồ set (mũ, áo, quần, giày; vũ khí chọn kiếm, rìu, giáo, cung hoặc chuỳ) từ nguyên liệu, nâng từ +0 lên +9.
    &0Nâng +N cần món cùng set +N-1 và nguyên liệu: xu, &6Xu Quái&0, &5Lõi Quái&0 (quái dungeon rơi), khoáng sản.
    &0Không bao giờ thất bại.
  - |-
    &6QUẦY ĐỔI KINH ĐÔ
    &0Đồ thô → &6mảnh&0 → &6tinh thể&0 → đồ set.
    &6Lão Khoáng&0: than, đồng, sắt, vàng, lưu ly, đá đỏ, kim cương → mảnh.
    &cLão Săn Quái&0: xương, tơ, thuốc súng, ngọc ender → mảnh. &3Ngư Ông&0: cá → Vảy Ánh Trăng.
  - |-
    &6QUẦY ĐỔI: ghép
    &eThợ Kim Hoàn&0 ghép nhiều loại mảnh thành tinh thể (Phôi Hợp Kim, Lam Linh Châu, Huyết Tinh Thạch, Hồn Quái…).
    &0Mảnh và tinh thể &6lấp lánh&0, chỉ server tạo ra được; đổi một chiều. Trao đổi được với người khác.
  - |-
    &6THỢ RÈN: các set
    &0Chuỗi chính: Tân Thủ (+9) → &cChiến Binh&0 (+7) → &5Tinh Anh&0 (+5) → &6Cao Cấp&0 (+5) → &4Huyền Thoại&0 (+3) → &dThần Thoại&0 (+4) → &eThần Thánh&0 (+3).
    &0Mảnh ấn rơi trong dungeon: tầng 1–3 Chiến Ấn, 4–6 Linh Ấn, 7–10 Kim Ấn; Huyền Ấn rất hiếm ở dungeon khó. Thần Ấn, Thánh Ấn: chưa ai tìm ra.
  - |-
    &6THỢ RÈN: set nghề, set mùa
    &0Set nghề: &6Thợ Mỏ&0 (cúp), &3Ngư Phủ&0 (cần câu), &2Du Hiệp&0 (cung), &2Nông Gia&0 (cuốc, gấp đôi nông sản), &cThợ Săn&0 (đánh quái ban đêm mạnh hơn).
    &0Set mùa &6U Linh&0: chỉ rèn trong Lễ Hội Bí Ngô (25/10–8/11), đúng mùa mạnh hơn; &dKẹo Linh Hồn&0 rơi từ quái khi đang mùa.
    &2Lão Nông&0: lúa, cà rốt, khoai, mật ong → mảnh.
  - |-
    &6THỢ RÈN: hiệu ứng bộ
    &0Mặc 2 hoặc 4 món cùng set cấp cao: thêm máu, kháng đẩy lùi, giảm sát thương (set nghề có hiệu ứng riêng).
    &0Cấp càng cao càng mòn chậm.
    &0Đồ set trao đổi được (/trade, chợ đen).
  - |-
    &6XƯỞNG CHẾ TẠO
    &1/xuong &0chế đồ có hiệu ứng&r&0, độ bền, hạn 7 ngày: khoan 3×3, rìu chặt cả cây, hút đồ, móc bay, xô nước vô tận…
    &4Lưu ý: &0hết hạn hoặc hết lượt thì đồ biến mất.
  - |-
    &5TINH LUYỆN
    &1/tinhluyen &0đổi khối thành món tinh luyện, vd 64 khối kim cương → 1 Tinh Luyện Kim Cương.
    &0Dùng để đổi đồ ở dân làng&r&0, chế đồ Xưởng, hoặc bán.
    &0Bấm = 1 lần, Shift+bấm = hết.
    &1/tinhluyen ban &0bán món đang cầm
  - |-
    &5TINH LUYỆN: lưu ý
    &4Đổi một chiều&0, không đổi lại thành khối được.
    &0Khối phải là đồ trơn (không đổi tên).
    &6Xu Quái&0 rơi khi hạ quái (quái lồng không rơi), gom 64 đổi Xu Quái 2.
    &1/tinhluyen ds &0xem giá, công thức.
  - |-
    &6KHAI HOANG
    &1/khaihoang &0xem quỹ mở vùng mới.
    &1/khaihoang gop <xu>
    &8Vd: /khaihoang gop 200
    &0Đủ mốc thì mở rộng bản đồ. 10 người tới đầu tiên là &2Tiên Phong&0.
  - |-
    &6Phù phép hiếm
    &0Có phù phép mới, chỉ tìm được sách trong rương công trình&r&0, khi câu cá&r&0 hoặc đổi với dân làng&r&0: Telepathy, Smelting, Tunnelling (đào 3x3), Replanting, Volley...
    &0Ghép bằng đe&r&0. Hiếm nên bán được giá cao!
  - |-
    &6Shop phù phép /ce
    &0Mua sách phù phép lạ: &2Thường 900 xu&0, &1Hiếm 2.400 xu&0. Kéo sách thả vào đồ để ghép.
    &4Sách ghi tỉ lệ thành công và tỉ lệ vỡ đồ!
    &0Cuộn giấy trắng&r&0 giữ đồ khi ghép hỏng.
    &1/blacksmith &0gộp sách
    &1/ce info &0xem công dụng
  - |-
    &2MÙA MƯA, MÙA KHÔ
    &0Mỗi mùa 7 ngày&r&0, xen kẽ. &1/mua&0 xem còn mấy ngày.
    &1☔ Mưa&0: lúa, mía, tre lớn nhanh.
    &6☀ Khô&0: khoai, cà rốt, dưa, bí lớn nhanh.
    &0Đúng mùa gặt cây chín còn rơi thêm&r&0.
    &0Lũ cuối mùa mưa, hạn hán giữa mùa khô.
  - |-
    &2ĐẶC SẢN VÙNG
    &0Phe có nhiều thị trấn nhất trong một vùng được mùa đặc sản vùng đó (lúa Nam Bộ, ca cao Tây Nguyên…).
    &1/dacsan &0xem vùng nào của ai.
  - |-
    &1CÂU CÁ
    &0Có 24 loại cá Việt&r&0 (cá linh, cá lóc, cá kèo, cá anh vũ…), nhiều con chỉ có theo mùa&r&0. Cá biển câu ở biển.
    &1/emf &0menu câu cá
    &1/emf shop &0bán cá
    &0Thi câu T7, CN 20h&r&0, có thưởng xu, &1Bùa bắt pet&0.
  - |-
    &1CÁ ĐỂ LÀM GÌ
    &0Bán: &1/emf shop
    &0Cho pet ăn&r&0: cầm cá, chuột phải vào pet: no, hồi máu, thêm kinh nghiệm (cá hiếm bổ hơn).
    &0Nấu món: &1/nauan
    &0Nộp kho lương: &1/kholuong nop
- id: khampha
  name: Khám phá, dungeon
  pages:
  - |-
    &2KỸ NĂNG NGHỀ
    &1/skills &0xem 6 kỹ năng: trồng, đốn gỗ, đào mỏ, câu cá, đào đất, pha chế.
    &0Làm nhiều thì lên cấp (tối đa 20&r&0): rơi thêm đồ, cấp 5/10/15/20 có thưởng xu, vài cấp cộng máu/sức mạnh.
  - |-
    &2Kỹ năng: dùng chiêu
    &0Cấp 10 mở chiêu đặc biệt&r&0 mỗi kỹ năng: cầm công cụ, chuột phải&r&0 rồi đào/chặt ngay.
    &0Chiêu chạy 5 giây, hồi 5 phút.
    &4Lưu ý: &0kỹ năng không dùng ở Thái Ấp, khu spawn; ở Đấu Trường không cộng máu. Mỗi mùa mới làm lại từ đầu.
  - |-
    &6CỐT TRUYỆN
    &0Tìm &6Già Làng&0 rồi chuột phải&r&0 để nói chuyện, bấm chọn câu trả lời.
    &0Chương 1 «Điềm Báo»: săn quái, giúp Bác Thợ Rèn, đào tìm Mảnh Sao Rơi. Có thưởng xu.
    &1/journal &0nhật ký (việc đang làm)
    &1/backpack &0đồ nhiệm vụ
  - |-
    &6LỮ KHÁCH
    &0Người lạ lang thang ngoài đất hoang, mỗi người kể chuyện về một nơi sau &5Cổng Hoang&0.
    &1/lukhach &0xem họ ở vùng nào.
    &0Nghe chuyện, đi qua cổng tới nơi họ kể, rồi tìm họ kể lại: có thưởng.
  - |-
    &6LỮ KHÁCH (tiếp)
    &8Lữ khách đổi chỗ mỗi 3 ngày.
  - |-
    &5CỔNG DUNGEON
    &0Dungeon cày đồ hiếm, đi theo nhóm.
    &1/dungeon &0danh sách, bấm tên để vào.
    &1/dungeon vao <mã>
