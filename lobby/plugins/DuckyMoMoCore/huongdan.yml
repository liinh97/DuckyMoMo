chapters:
- id: batdau
  name: Bắt đầu
  pages:
  - |-
    &6Chào mừng!
    &0DuckyMoMo có nhiều chế độ chơi, vào từ sảnh&r&0 (đảo hoa anh đào).

    &1Lần đầu vào:
    &0/register <mk> <mk>
    &8Vd: /register meo123 meo123
    &1Lần sau:
    &0/login <mk>
  - |-
    &6Chào mừng! (tiếp)
    &0Vào lại trong 1 giờ&r&0 từ cùng mạng thì khỏi /login; quá 1 giờ hoặc đổi mạng phải /login lại.
    &0Sai mật khẩu 3 lần: gõ &1/captcha <mã>&0 theo mã hiện trong chat. Sai 10 lần: chờ 30 phút.
  - |-
    &6Mật khẩu
    &4Lưu ý: &0mật khẩu ít nhất 6 ký tự, không dùng 123456, matkhau…, không giống tài khoản khác, không đưa cho ai.
    &0Đổi: &1/changepassword <cũ> <mới>
  - |-
    &6Chọn chế độ
    &0Bấm la bàn&r&0 trên tay hoặc gõ &1/menu&0.

    &2Bang Hội Chiến&0: sinh tồn, thị trấn, công thành (chế độ chính).
    &2Practice&0: luyện PvP 1v1, không mất đồ.
    &8Pokémon: chưa mở.
  - |-
    &6Đổi chế độ
    &0Đổi bất cứ lúc nào:
    &1/server lobby
    &1/server banghoi-1
    &1/server practice-1
    &0Đồ, tiền mỗi chế độ riêng&r&0, không mang qua lại.
    &4Lưu ý: &0đang giao tranh mà đổi server = thoát game lúc đánh nhau (chết, rơi đồ).
  - |-
    &6Lệnh chung
    &1/msg <tên> <tin> &0nhắn riêng
    &8Vd: /msg Linh chào bạn
    &1/r <tin> &0trả lời
    &1/huongdan &0(hoặc &1/hd&0) mở sách này
    &1/caidat &0bật/tắt chat, thông báo
    &1/web &0mã đăng nhập web
    &1/rank &0rank ủng hộ
  - |-
    &6Lệnh chung (tiếp)
    &1/changepassword <cũ> <mới>
  - |-
    &6SKIN & TỦ SKIN
    &0Vào game tự có skin theo tên tài khoản. &6Đổi skin cần rank có quyền&0 (Hào Kiệt, rank ủng hộ…).
    &1/skin <tên> &0skin tài khoản bản quyền.
    &1/skin url <link> &0skin từ ảnh PNG.
    &1/tuskin &0tủ skin, bấm [Mặc] để đổi.
    &1/tuskin luu &0lưu skin đang mặc.
    &0Bậc danh phận cao có thêm ô tủ. Trên web tải ảnh lên được.
  - |-
    &6Điện thoại (Bedrock)
    &0Bấm la bàn: hiện bảng nút&r&0 thay cho menu rương.
    &0Cẩm nang hiện thành bảng, mỗi chương một nút.
    &0Lệnh gõ giống máy tính.
    &8Voice chat chưa có cho điện thoại.
- id: luat
  name: Luật server
  pages:
  - |-
    &4LUẬT
    &01. Không hack, không x-ray, không auto-click, không mod nhìn xuyên.
    2. Không chửi bới, quấy rối, phân biệt. Từ tục bị che &8***&0.
    3. Không spam, không quảng cáo server khác.
  - |-
    &4LUẬT (tiếp)
    &8Chống hack tự động: bị kick nhầm thì báo admin kèm giờ.
  - |-
    &4LUẬT (tiếp)
    &04. Không lợi dụng lỗi game: thấy lỗi, cách lách luật thì báo admin (Discord discord.gg/Hg9cDWApF kênh #reports, hoặc nhắn riêng) để &6được thưởng&0. Lợi dụng thay vì báo: bị phạt, thu hồi đồ.
    5. Đánh nhau theo luật công thành. Thoát game khi đang đánh = chết, rơi đồ.
    6. Không lừa đảo giao dịch: dùng &1/trade&0 cho an toàn.
  - |-
    &4LUẬT (tiếp)
    &8Vi phạm: mute, kick, ban tuỳ mức độ.
  - |-
    &4LUẬT (tiếp)
    &07. Map là Trái Đất nhưng lãnh thổ trong game không&r&0 liên quan chủ quyền thật. Cấm tên, chat kích động biên giới, biển đảo, dân tộc.
