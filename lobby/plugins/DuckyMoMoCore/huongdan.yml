# MENU /hd (21/10, người dùng: "dài như này ai mà muốn đọc", làm theo kiểu menu lệnh của CherryMC):
#   /hd mở rương các nhóm; rê chuột lên nhóm thấy ngay lệnh + mô tả ngắn; bấm thì mở SÁCH CHI TIẾT chỉ của chương "chuong".
#   /hd sach = cả cuốn sách như cũ; /hd <mã chương> = sách của chương đó. Điện thoại (Bedrock): bảng nút, cùng nội dung.
#   Mỗi nhóm: slot (ô rương, hàng đầu 0-8), icon (vật liệu), ten, mo (1 dòng), lenh ("/lệnh|mô tả", không có | = dòng thường),
#   ghi (lưu ý, tuỳ chọn), chuong (mã chương bên dưới). Mô tả lệnh nên ≤ 24 chữ cho khung gọn. Sửa xong chạy ./ops/huongdan.sh.
