# DuckyMoMo: Simple Voice Chat ở server con (Paper). Người chơi Java cài mod Simple Voice Chat mới nghe/nói được.
# Voice đi qua proxy Velocity (plugin voicechat ở proxy, cổng UDP 24454 mở ra ngoài qua VPS), nên port ở đây chỉ dùng trong mạng Docker
# và voice_host ở đây bị bỏ qua. Mỗi container một mạng riêng nên cả 3 server cùng dùng 24454 được.
# Các mục không ghi ở đây plugin tự thêm giá trị mặc định khi chạy.
port=24454
# Nghe trong bán kính (block): nói thường 40, thì thầm 20. Nhỏ hơn = đỡ tốn mạng nhà.
max_voice_distance=40
whisper_distance=20
# VOIP = tối ưu cho giọng nói, ít băng thông nhất
codec=VOIP
# Nhóm (/voicechat hoặc phím G): nói chuyện với nhóm ở mọi khoảng cách (vd cả thị trấn)
enable_groups=true
# Không cho client ghi âm người khác (riêng tư)
allow_recording=false
# Không bắt buộc cài mod: không có mod vẫn chơi bình thường
force_voice_chat=false
spectator_interaction=false
