# Cẩm nang sử dụng: trang Cài đặt > "Cẩm nang" (panel đọc file này mỗi lần mở, không cần build lại).
# Mỗi plugin:
#   name      tên hiển thị
#   jar       đoạn đầu tên file .jar trong data/<server>/plugins (để trang tự đánh dấu đang cài ở server nào)
#   kind      loại (nhóm trên trang): Đăng nhập & kết nối, Quản lý, Chat & hiển thị, Kinh tế & buôn bán, Thị trấn & chiến tranh,
#             PvP & chống hack, Rank donate, Bản đồ & thế giới, Practice, Hệ thống
#   purpose   dùng để làm gì
#   player    lệnh cho người chơi: [lệnh, ý nghĩa]
#   admin     lệnh cho admin/mod: [lệnh, ý nghĩa]
#   settings  chỉnh ở đâu (trang Cài đặt / file)
#   notes     lưu ý
# Thêm plugin mới: thêm một mục ở đây. Plugin đang cài mà chưa có mục sẽ hiện ở cuối trang "Chưa có trong cẩm nang".

guide:
  - title: Việc admin hay làm
    items:
      - ["Cấp role staff", "Trang Cài đặt > Role (bấm nút), hoặc /lp user <tên> parent add helper  (lên tiếp: /lp user <tên> promote staff → mod → admin)"]
      - ["Cấp rank donate", "/rank give <tên> <namtuoc|tutuoc|batuoc|hautuoc|congtuoc> <số tháng>  · xem: /rank check <tên> · gỡ: /rank remove <tên>"]
      - ["Đồ phù phép vượt cấp", "/dmm enchant sharpness 30 (món đang cầm) · /dmm sach sharpness 30 <tên> (tặng sách)"]
      - ["Cộng/trừ tiền", "/eco give <tên> <số> · /eco take <tên> <số> · /eco set <tên> <số>  (Bang Hội Chiến)"]
      - ["Phạt", "/mute <tên> <thời gian> · /kick <tên> <lý do> · /tempban <tên> 1d <lý do> · /ban <tên> <lý do> · /unban <tên>"]
      - ["Kiểm tra phá hoại", "/co i (bấm vào block xem ai phá/đặt) · /co rollback u:<tên> t:2h r:30 (khôi phục)"]
      - ["Xem cảnh báo hack", "/grim alerts (bật/tắt) — Mod/Admin tự bật khi vào"]
      - ["Dọn rác ngay", "/dmm clean (Bang Hội Chiến)"]
      - ["Áp dụng lại config DuckyMoMoCore", "/dmm reload — trang Cài đặt tự gọi khi bấm Lưu"]
      - ["Chuyển server", "/server lobby | banghoi-1 | practice-1"]
      - ["Font tiếng Việt", "Gói font gửi tự động khi vào (không bắt buộc). Sửa/làm lại: ./ops/build-font-pack.sh rồi docker compose up -d lobby banghoi-1 practice-1"]
      - ["Sao lưu ngay", "Trên máy chủ: docker compose exec backup-banghoi-1 backup now (lưu ở F:\\DuckyMoMo-backups)"]
  - title: Người chơi mới cần biết
    items:
      - ["Đăng ký / đăng nhập", "Lần đầu: /register <mật khẩu> <mật khẩu> · lần sau: /login <mật khẩu>"]
      - ["Chọn chế độ", "Bấm la bàn ở sảnh hoặc /menu (điện thoại: hiện bảng nút bấm)"]
      - ["Cẩm nang trong game", "/huongdan — sửa nội dung: modes/_network/huongdan.yml rồi ./ops/huongdan.sh (có hiệu lực ngay)"]
      - ["Bang Hội Chiến", "/warp để đi các địa danh · /t new <tên> lập thị trấn · /jobs xem nghề · /sell hand bán đồ · /ah chợ"]
      - ["Rank donate", "/rank xem các bậc, giá, cách mua (chỉ trang trí, không mua được lợi thế)"]
  - title: Địa chỉ vào server
    items:
      - ["Máy tính (Java)", "pgsql-youths.tun.ply.gg — bản 1.13 tới mới nhất"]
      - ["Điện thoại (Bedrock)", "pgsql-mississauga.tun.ply.gg cổng 21185"]

plugins:
  # ---------------------------------------------------------------- Đăng nhập & kết nối
  - name: Velocity (proxy)
    jar: "-"
    kind: Đăng nhập & kết nối
    purpose: Cổng vào chung của cả network, chuyển người chơi giữa lobby, Bang Hội Chiến, practice. Không phải plugin, là phần mềm proxy.
    player:
      - ["/server <tên>", "Chuyển sang server khác (lobby, banghoi-1, practice-1)"]
    admin:
      - ["/glist", "Ai đang ở server nào"]
      - ["/send <tên> <server>", "Đưa người chơi sang server khác"]
    settings: "proxy/config/velocity.toml"
  - name: AuthMe
    jar: AuthMe
    kind: Đăng nhập & kết nối
    purpose: Đăng ký / đăng nhập bằng mật khẩu (server chạy offline mode). Chưa đăng nhập thì không rời sảnh được. Người chơi Bedrock tự đăng nhập.
    player:
      - ["/register <mk> <mk>", "Đăng ký lần đầu"]
      - ["/login <mk>", "Đăng nhập"]
      - ["/changepassword <mk cũ> <mk mới>", "Đổi mật khẩu"]
      - ["/logout", "Đăng xuất"]
    admin:
      - ["/authme unregister <tên>", "Xoá đăng ký (người chơi quên mật khẩu)"]
      - ["/authme password <tên> <mk>", "Đặt lại mật khẩu cho người chơi"]
      - ["/authme reload", "Nạp lại cấu hình"]
    settings: "lobby/plugins/AuthMe/config.yml"
  - name: Geyser + Floodgate
    jar: floodgate
    kind: Đăng nhập & kết nối
    purpose: Cho người chơi Bedrock (điện thoại, console) vào server Java. Floodgate ở các server con để nhận ra người Bedrock (menu nút bấm, chống hack).
    player:
      - ["(không cần lệnh)", "Điện thoại vào địa chỉ Bedrock ở trên; tên có dấu chấm đầu, ví dụ .griim7833"]
    admin:
      - ["/geyser reload", "Nạp lại Geyser (trên proxy)"]
    settings: "proxy/plugins/Geyser-Velocity, */plugins/floodgate/config.yml"
  - name: SkinsRestorer
    jar: SkinsRestorer
    kind: Đăng nhập & kết nối
    purpose: Hiện skin cho người chơi offline mode (lấy skin theo tên tài khoản Mojang).
    player:
      - ["/skin set <tên Mojang>", "Đổi skin theo tên"]
      - ["/skin clear", "Bỏ skin"]
    admin:
      - ["/sr reload", "Nạp lại"]
  - name: ViaVersion + ViaBackwards + ViaRewind
    jar: ViaVersion
    kind: Đăng nhập & kết nối
    purpose: Cho client nhiều phiên bản vào (1.13 tới mới nhất). Bản 1.12 trở xuống bị proxy chặn (đã chốt).
    admin:
      - ["/viaver list", "Ai đang dùng phiên bản nào"]

  # ---------------------------------------------------------------- Quản lý
  - name: LuckPerms
    jar: LuckPerms
    kind: Quản lý
    purpose: Quyền và nhóm (role, rank donate), dùng chung toàn network (lưu MariaDB).
    admin:
      - ["/lp user <tên> info", "Xem nhóm, quyền của người chơi"]
      - ["/lp user <tên> parent add <nhóm>", "Thêm vào nhóm (helper, mod, admin, builder)"]
      - ["/lp user <tên> parent remove <nhóm>", "Bỏ khỏi nhóm"]
      - ["/lp user <tên> promote staff", "Thăng chức Helper → Mod → Admin"]
      - ["/lp user <tên> demote staff", "Giáng chức"]
      - ["/lp editor", "Mở trình sửa quyền trên web"]
    settings: "Rank donate: dùng /rank (DuckyMoMoCore), không cấp tay bằng lp. Danh sách quyền rank: tools/donate-ranks.cmds"
    notes: "Role: Dân (mặc định), Builder, Helper, Mod, Admin. Rank donate: 5 tước vị, track donate."
  - name: DuckyMoMoCore
    jar: DuckyMoMoCore
    kind: Quản lý
    purpose: "Plugin riêng của DuckyMoMo: menu chọn chế độ, rank donate, thông báo vào/ra, lọc chat, chat có prefix ở sảnh, rơi khỏi đảo về spawn, dọn rác, chống đặt-phá lấy tiền nghề, ranh giới thị trấn trên bản đồ web, menu nút bấm cho Bedrock."
    player:
      - ["/menu", "Mở menu chọn chế độ (ở sảnh)"]
      - ["/huongdan [chương] · /hd", "Cẩm nang trong game (sách; điện thoại: bảng nút). Chương: batdau, luat, banghoi, practice, rank, pokemon, hotro"]
      - ["/rank", "Xem các bậc rank donate, giá, rank của mình"]
    admin:
      - ["/rank give <tên> <bậc> <tháng>", "Cấp rank donate (gia hạn cộng dồn)"]
      - ["/rank check <tên>", "Xem rank và hạn"]
      - ["/rank remove <tên>", "Gỡ rank donate"]
      - ["/dmm clean", "Dọn rác ngay"]
      - ["/dmm enchant <phù phép> <cấp>", "Phù phép VƯỢT CẤP món đang cầm (vd sharpness 30, efficiency 20; cấp 0 = gỡ; tối đa over-enchant.max-level = 50)"]
      - ["/dmm sach <phù phép> <cấp> [người]", "Tạo sách vượt cấp tặng người chơi đang online; người chơi ghép bằng đe giữ nguyên cấp. Chỉ làm phần thưởng / hàng trong game, KHÔNG bán lấy tiền thật"]
      - ["/dmm reload", "Nạp lại config"]
      - ["/dmm decorate | structures start|pause|status", "Trang trí map / đặt công trình (dùng khi làm map mới)"]
    settings: "Trang Cài đặt: Toàn mạng (Chat, Rank donate, Sảnh), Bang Hội Chiến (Hệ thống)"
  - name: WorldEdit
    jar: worldedit
    kind: Quản lý
    purpose: Công cụ xây dựng cho admin (chọn vùng, đặt/xoá hàng loạt, dán công trình).
    admin:
      - ["//wand", "Lấy rìu chọn vùng"]
      - ["//set <block>", "Đặt block cho vùng chọn"]
      - ["//undo", "Hoàn tác"]
      - ["//schem load <tên>.schem rồi //paste", "Dán công trình (thư mục plugins/WorldEdit/schematics)"]
    notes: "Lobby cài tay (không có trên Modrinth cho 26.2)."
  - name: EssentialsX (+ Chat, Spawn)
    jar: EssentialsX
    kind: Quản lý
    purpose: Lệnh cơ bản (nhà, dịch chuyển, tin nhắn), tiền tệ, /sell, định dạng chat có prefix.
    player:
      - ["/spawn", "Về spawn"]
      - ["/sethome [tên] · /home [tên] · /delhome", "Đặt / về nhà"]
      - ["/warp [tên]", "Danh sách / đi tới địa danh"]
      - ["/tpa <tên> · /tpaccept · /tpdeny", "Xin dịch chuyển tới người khác"]
      - ["/msg <tên> <tin> · /r <tin>", "Nhắn riêng / trả lời"]
      - ["/bal · /baltop · /pay <tên> <tiền>", "Xem tiền, top giàu, chuyển tiền"]
      - ["/sell hand · /sell all · /worth", "Bán đồ cho server, xem giá"]
      - ["/hat · /nick <tên>", "Đội đồ lên đầu, đổi tên hiển thị (cần rank donate)"]
    admin:
      - ["/eco give|take|set <tên> <số>", "Sửa tiền"]
      - ["/mute · /kick · /tempban · /ban · /unban", "Phạt"]
      - ["/tp <tên> · /tphere <tên> · /vanish · /invsee <tên>", "Kiểm tra người chơi"]
      - ["/setwarp <tên> · /delwarp <tên>", "Tạo / xoá warp"]
      - ["/essentials reload", "Nạp lại"]
    settings: "Trang Cài đặt: Bang Hội Chiến > Kinh tế (tiền khởi đầu, giá /sell)"
  - name: Vault (VaultUnlocked)
    jar: VaultUnlocked
    kind: Quản lý
    purpose: Lớp nối kinh tế/quyền để các plugin dùng chung tiền EssentialsX. Không có lệnh.
  - name: PlaceholderAPI
    jar: PlaceholderAPI
    kind: Quản lý
    purpose: Biến hiển thị (%vault_eco_balance%, %townyadvanced_town%…) cho bảng bên phải, chữ nổi.
    admin:
      - ["/papi ecloud download <tên> · /papi reload", "Cài phần mở rộng (đã có: Vault, Essentials)"]
      - ["/papi parse <tên> <%biến%>", "Thử một biến"]
  - name: CoreProtect
    jar: CoreProtect
    kind: Quản lý
    purpose: Ghi lại mọi lượt phá/đặt block, mở rương để tra cứu và khôi phục khi bị phá hoại.
    admin:
      - ["/co i", "Bật chế độ soi: bấm vào block xem lịch sử"]
      - ["/co lookup u:<tên> t:1h", "Xem người đó làm gì trong 1 giờ"]
      - ["/co rollback u:<tên> t:2h r:30", "Khôi phục những gì người đó phá trong 2 giờ, bán kính 30"]
      - ["/co restore …", "Làm lại (huỷ rollback)"]
  - name: WorldGuard
    jar: worldguard
    kind: Quản lý
    purpose: Vùng bảo vệ (khu spawn không PvP, không xây phá).
    admin:
      - ["/rg info", "Xem vùng đang đứng"]
      - ["//wand rồi /rg define <tên>", "Tạo vùng"]
      - ["/rg flag <vùng> pvp deny", "Đặt cờ cho vùng"]
      - ["/wg reload", "Nạp lại"]
    notes: "Vùng spawn Bang Hội Chiến: spawn (x 12556..12801, z -2623..-2298)."
  - name: DecentHolograms
    jar: DecentHolograms
    kind: Chat & hiển thị
    purpose: Chữ nổi (bảng xếp hạng, ghi công, hướng dẫn).
    admin:
      - ["/dh create <tên> <chữ>", "Tạo chữ nổi tại chỗ đứng"]
      - ["/dh line add <tên> 1 <chữ>", "Thêm dòng"]
      - ["/dh movehere <tên>", "Dời tới chỗ đứng"]
      - ["/dh delete <tên> · /dh list", "Xoá / danh sách"]
    notes: "Bảng xếp hạng giàu nhất: bxh_tien (spawn Bang Hội Chiến)."
  - name: TAB
    jar: TAB
    kind: Chat & hiển thị
    purpose: Bảng thông tin bên phải, boss bar mẹo trên cùng, đầu/cuối danh sách Tab, prefix trong Tab.
    player:
      - ["/sb", "Ẩn/hiện bảng bên phải"]
      - ["/bossbar", "Ẩn/hiện boss bar"]
    admin:
      - ["/tab reload", "Nạp lại"]
    settings: "Trang Cài đặt: Bang Hội Chiến > Hiển thị"

  # ---------------------------------------------------------------- Kinh tế & buôn bán
  - name: uJobs
    jar: UJobs
    kind: Kinh tế & buôn bán
    purpose: Nghề kiếm tiền tự động (đào, chặt, săn, trồng, câu cá…), không cần tham gia nghề.
    player:
      - ["/jobs", "Xem cấp nghề, bảng xếp hạng, cách kiếm tiền"]
    admin:
      - ["/jobs reload", "Nạp lại"]
    settings: "Trang Cài đặt: Bang Hội Chiến > Nghề (tiền từng hành động)"
    notes: "Phá lại block tự đặt và đào quặng bằng Mềm Mại không được tiền."
  - name: QuickShop-Hikari
    jar: QuickShop
    kind: Kinh tế & buôn bán
    purpose: Cửa hàng rương của người chơi; người khác mua bán được cả khi chủ offline.
    player:
      - ["Cầm món đồ, bấm chuột trái vào rương, gõ giá", "Tạo cửa hàng"]
      - ["/qs price <giá>", "Đổi giá (nhìn vào rương)"]
      - ["/qs sell · /qs buy", "Đổi cửa hàng thành thu mua / bán ra"]
      - ["/qs remove", "Xoá cửa hàng"]
  - name: zAuctionHouse (+ zMenu)
    jar: zAuctionHouse
    kind: Kinh tế & buôn bán
    purpose: Chợ đấu giá chung, mỗi người đăng tối đa 5 món.
    player:
      - ["/ah", "Mở chợ"]
      - ["/ah sell <giá>", "Đăng bán món đang cầm"]
    admin:
      - ["/ah admin reload", "Nạp lại"]
  - name: TradePro
    jar: TradePro
    kind: Kinh tế & buôn bán
    purpose: Đổi đồ trực tiếp giữa 2 người, hai bên cùng bấm đồng ý mới đổi.
    player:
      - ["/trade <tên>", "Gửi lời mời đổi đồ"]

  - name: Enchantio
    jar: Enchantio
    kind: Kinh tế & buôn bán
    purpose: "Phù phép mới kiểu gốc Minecraft, làm hàng hiếm để đổi bán. KHÔNG ra từ bàn phù phép: chỉ có sách trong rương công trình, câu cá, dân làng; ghép vào đồ bằng đe. Đang bật: Telepathy (đồ đào vào thẳng túi), Replanting (cuốc tự trồng lại), Smelting (tự nung quặng), Tunnelling (đào 3x3 đá và quặng), Executioner I-II (đánh mạnh hơn khi địch dưới 25% máu), Volley I-II (bắn thêm tên), Beheading (rơi đầu), Airbag (giảm va đập khi bay cánh) + 3 lời nguyền. Đã tắt: Soulbound, Homecoming, Cloaking, Ward (phá luật chiến tranh)."
    player:
      - ["(không có lệnh)", "Tìm sách trong rương công trình, câu cá, đổi với dân làng thủ thư; ghép vào đồ bằng đe; bán qua /ah, /trade, cửa hàng rương"]
    admin:
      - ["/minecraft:enchant <tên> enchantio:<phù phép> <cấp>", "Phù phép đồ đang cầm của người chơi (vd enchantio:telepathy 1)"]
      - ["/minecraft:give <tên> minecraft:enchanted_book[stored_enchantments={'enchantio:smelting':1}]", "Tặng sách (làm quà sự kiện); /give của Essentials không hiểu cú pháp này"]
    settings: "modes/banghoi/server/plugins/Enchantio/config.yml (bật/tắt, cấp tối đa, nguồn ra sách). Đổi phải KHỞI ĐỘNG LẠI banghoi-1."
    notes: "Config mặc định có thẻ #minecraft:ores không tồn tại (Tunnelling không đào quặng): đã thay bằng *_ores từng loại."

  - name: CrazyEnchantments
    jar: CrazyEnchantments
    kind: Kinh tế & buôn bán
    purpose: "105 phù phép kiểu server factions (bản BETA cho 26.x). Sách có tỉ lệ thành công / vỡ đồ; cuộn giấy trắng (giữ đồ khi ghép hỏng), đen (tách phù phép), bụi tăng tỉ lệ; thợ rèn gộp sách; tinkerer đổi đồ lấy kinh nghiệm. Shop /ce bán sách Thường 300 xu, Hiếm 800 xu (44 phù phép nhẹ/tiện ích). 50 phù phép mạnh (Rage, StormCaller, LifeSteal, VeinMiner, Blast, Gears...) chỉ ở Huyền thoại/Thần thoại: admin phát làm thưởng. Đã tắt: Wings, SystemReboot, Cyborg, Boom, SelfDestruct, Guards, Necromancer, Infestation, Disarmer, Telepathy, Furnace."
    player:
      - ["/ce", "Mở shop sách phù phép, cuộn giấy, bụi (trả bằng tiền)"]
      - ["Kéo sách vào đồ trong túi đồ", "Ghép phù phép (có tỉ lệ thành công / vỡ đồ ghi trên sách)"]
      - ["/blacksmith", "Thợ rèn: gộp 2 sách cùng loại lên cấp"]
      - ["/tinker", "Đổi đồ / sách không dùng lấy kinh nghiệm"]
      - ["/ce info [phù phép]", "Xem công dụng phù phép"]
    admin:
      - ["/ce book <phù phép> <cấp> 1 <người>", "Phát sách (cả Huyền thoại/Thần thoại), vd /ce book Rage 3 1 Linh"]
      - ["/ce lostbook <Common|Rare|Legendary|Mythical> 1 <người>", "Phát sách bí ẩn (mở ra phù phép ngẫu nhiên của độ hiếm đó)"]
      - ["/ce scroll <white|black|transmog> 1 <người>", "Phát cuộn giấy"]
      - ["/ce add <phù phép> <cấp> · /ce remove <phù phép>", "Thêm / gỡ phù phép món đang cầm"]
      - ["/ce reload", "Nạp lại cấu hình"]
    settings: "modes/banghoi/server/plugins/CrazyEnchantments/ (README.txt ghi lý do từng thay đổi); quyền người chơi trong LuckPerms nhóm default"
    notes: "Bản BETA cho 26.x: lỗi thì xem log banghoi-1 và báo. GKitz (bộ đồ phát miễn phí) đã tắt."

  - name: Đồ phù phép vượt cấp (Sắc bén XXX…)
    jar: DuckyMoMoCore
    kind: Kinh tế & buôn bán
    purpose: "Admin tạo đồ hoặc sách phù phép VƯỢT cấp tối đa của game (vd Sắc bén 30, Hiệu suất 20, Bền bỉ 10) làm phần thưởng sự kiện / hàng hiếm. Người chơi không tự ghép lên được: ghép hai sách với nhau vẫn theo luật gốc; ghép sách vượt cấp vào đồ bằng đe thì giữ nguyên cấp (tốn 30 cấp kinh nghiệm). Có ở Bang Hội Chiến."
    admin:
      - ["/dmm enchant <phù phép> <cấp>", "Phù phép món đang cầm, vd /dmm enchant sharpness 30 · /dmm enchant efficiency 20 · cấp 0 = gỡ"]
      - ["/dmm sach <phù phép> <cấp> [người]", "Tạo sách tặng người chơi đang online, vd /dmm sach sharpness 30 Linh"]
      - ["Tên phù phép", "Tên gốc tiếng Anh: sharpness (sắc bén), protection (bảo vệ), efficiency (hiệu suất), unbreaking (bền bỉ), fortune (gia tài), looting (cướp bóc), power (sức mạnh), feather_falling, mending... hoặc enchantio:telepathy"]
    settings: "Trang Cài đặt: Bang Hội Chiến > Phù phép > Đồ phù phép vượt cấp (bật/tắt, cấp tối đa)"
    notes: "Chỉ làm phần thưởng hoặc bán bằng tiền trong game. KHÔNG bán lấy tiền thật (pay-to-win, vi phạm luật Mojang). Mỗi lần tạo đều ghi log server."

  - name: Shopkeepers (+ ShopkeepersAddon)
    jar: Shopkeepers
    kind: Kinh tế & buôn bán
    purpose: "Dân làng NPC bán hàng (vd ở spawn bán các set đồ). Admin tạo NPC, chọn đồ bán và giá (vật phẩm hoặc tiền trong game qua Addon). Người chơi bấm vào NPC ra bảng đổi đồ như dân làng thường (dùng được trên điện thoại). Người chơi tự mở shop dân làng: đang TẮT (quyền shopkeeper.player = false; đã có cửa hàng rương). Bán đồ cho shop admin bị giới hạn 1.000 xu/ngày mỗi người (chống lạm phát)."
    player:
      - ["Bấm chuột phải vào dân làng bán hàng", "Mở bảng đổi đồ"]
      - ["/shops", "Menu danh sách shop"]
      - ["/shopsearch <món>", "Tìm shop bán món đồ"]
    admin:
      - ["/shopkeeper admin", "Tạo shop admin tại chỗ đang nhìn (gõ /shopkeeper để xem các loại; mặc định là dân làng)"]
      - ["Chuột phải (cúi người) vào NPC", "Mở trình sửa: kéo đồ bán vào hàng trên, giá vào hàng dưới; đổi tên, nghề, kiểu dáng"]
      - ["/shopkeeper list admin · /shopkeeper remove <id> · /shopkeeper teleport <id>", "Danh sách / xoá / dịch chuyển tới shop"]
      - ["/shopkeeper history all", "Xem lịch sử giao dịch"]
      - ["/shopkeeper reload · /shopkeepersaddon reload", "Nạp lại"]
    settings: "Trang Cài đặt: Bang Hội Chiến > Shop > Dân làng bán hàng (Shopkeepers). Config: data/banghoi-1/plugins/Shopkeepers/config.yml, modes/banghoi/server/plugins/ShopkeepersAddon/config.yml"
    notes: "Tiền tệ hiện '100 xu'. Giao diện admin tiếng Anh (plugin chỉ có tiếng Anh, Đức)."

