      - ["Thêm trang vote", "Đăng ký server trên trang vote (IP mc.goc6.io.vn, cổng game 25565, Votifier cổng 8192 + khoá công khai plugins/Votifier/rsa/public.key), rồi thêm link vào vote.sites trong config DuckyMoMoCore (banghoi-1) + /dmm reload"]
