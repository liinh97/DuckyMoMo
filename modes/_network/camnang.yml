      - ["/mypetadmin remove <người>", "Xoá pet đang dùng của người chơi"]
    settings: "data/banghoi-1/plugins/MyPet/config.yml (KHÔNG có lệnh nạp lại: phải khởi động lại banghoi-1); pet-config.yml (máu, tốc độ, cách bắt từng loài); skilltrees/"
    notes: "Pet đánh được người chơi nhưng bị giảm % sát thương (Cài đặt > PvP & combat > Pet chiến đấu, mặc định 50%). Mỗi phiên công thành bốc thăm cho/không cho pet tham chiến (mặc định 30% phiên cho), báo trước 60 và 10 phút, xem bằng /lichcongthanh. Lúc bắt mọi loài 20 máu; lớn lên theo HỆ (người chơi chọn) × NHÓM LOÀI (10 nhóm: Thú lớn trâu đánh yếu, Thú săn đánh đau máu mỏng, Loài bay, Thú cưỡi, Xác sống, Cung thủ, Phù thủy, Thủy tộc, Gia súc, Quái nhầy & nổ) + đặc tính riêng ~35 loài (ong độc, blaze lửa, dê húc...). Cây kỹ năng SINH bằng tools/mypet/sinh-cay-ky-nang.py (sửa nhóm/đặc tính ở đó, hệ gốc ở tools/mypet/he.json) ra modes/banghoi/server/plugins/MyPet/skilltrees/ (230 file), rồi khởi động lại banghoi-1. Đừng sửa tay trong data/. Tên pet chiến đấu có ⚔ đỏ; pet trang trí SimplePets có ✿. Tiếng Việt (OverwriteLanguages: vi). Mốc kỹ năng cấp 15–50 mỗi hệ (Hộ chủ, Dậm đất, Chảy máu, Héo mòn, Sét đánh, hào quang Đào nhanh/nhìn đêm/hồi máu...), có báo khi đạt mốc (Notifications trong skilltrees). CHỈ loài bay (nhóm Loài bay) chọn hệ Thú Cưỡi mới bay được, từ cấp 5: giữ phím nhảy khi đang ở trên không, bay lên 4 khối/giây; giới hạn QUÃNG ĐƯỜNG bay mỗi lần 40 khối (cấp 5–19; cấp 20: 80, 30: 150, 50: 250), hết thì rơi (không mất máu), hồi lại khi đứng đất (10 khối/giây, cấp 20+ 15, cấp 50+ 20). Bay không có trần độ cao riêng; chặn bay theo vùng bằng cờ WorldGuard mypet-fly. Đấu Trường cấm cưỡi pet. Lúc có phiên công thành, trong vùng vây: pet cưỡi cao hơn 3 khối so với mặt đất thì người cưỡi bị đẩy xuống kèm Rơi chậm 6 giây (PetCombat.noSiegeFlight); chạy và nhảy dưới đất vẫn được. Bật/tắt + độ cao: Cài đặt › PvP & combat › Pet chiến đấu (pet-combat.siege-no-fly, siege-no-fly-height). Giới hạn quãng bay chỉ tính khi Pet bị đói bật và mục «Cưỡi pet - mất điểm no mỗi khối» > 0 (MyPet.Skill.Ride.HungerPerMeter), đặt 0 = bay vô hạn. Web: trang chủ mục Pet có bảng nhóm loài; trang tài khoản hiện hệ + nhóm loài từng pet. Bắt theo xác suất (module PetCapture, Cài đặt › PvP & combat › Bắt pet theo xác suất): mọi loài trong pet-config.yml có thêm yêu cầu Permission:duckymomo.pet.batduoc; plugin quay % theo nhóm loài và cấp quyền tạm đúng cú đánh trúng. Đừng cấp tay quyền đó; tài khoản có * luôn trúng. Tắt module thì phải bỏ dòng đó trong pet-config.yml. Số lần thử lưu trên con vật (PDC batpet_lanthu). Trao đổi/bán pet bằng xu: quyền MyPet.command.trade.offer(.*)/receive(.*) cho nhóm default. Đấu Trường: thắng (còn trong số trận thưởng/ngày) cộng arena.pet-exp-win kinh nghiệm cho pet đang dẫn. Bảng xếp hạng pet: /bxhpet, web trang chủ mục Pet, trang tài khoản hiện hạng từng pet. Quái từ lồng quái (máy farm), lồng thử thách, trứng sinh quái KHÔNG cho pet kinh nghiệm (MyPet.Exp.Gain.PreventFromSpawnReason, Cài đặt › Pet chiến đấu - lên cấp…). Cho pet ăn cá câu (PetFish, pet-fish): cầm cá EvenMoreFish (PDC evenmorefish:emf-fish-rarity) chuột phải pet mình → no/hồi máu/kinh nghiệm theo độ hiếm, giới hạn kinh nghiệm/ngày (petfish.yml). Bắt pet theo mùa: pet-capture.season-bonus (mùa mưa Thủy tộc +15, Quái nhầy +10; mùa khô Loài bay +10, Thú săn +5). Thời tiết công thành (pet-combat.siege-weather, lúc có phiên đánh, trong vùng vây, mỗi giây): đêm (giờ game 13000–23000) Bóng tối trừ ai có pet mắt đêm trong 24 khối (được Nhìn đêm, pet +20%); mưa: đi bộ bị Chậm, pet nước +20%, pet lửa −25%; nắng gắt mùa khô ban ngày: Đói trừ ai dẫn pet lửa, pet lửa +15%. /doimanh nhận giá bằng cá (ca:rare, ca:epic, ca:legendary) và quà petexp. Quyền bắt: tools/mypet.cmds (không cho bắt Warden, Wither, Rồng Ender, Elder Guardian, Ravager, Golem sắt, Ghast)."
