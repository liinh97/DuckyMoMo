# Cẩm nang sử dụng: trang Cài đặt > "Cẩm nang" (panel đọc file này mỗi lần mở, không cần build lại).
# Mỗi plugin:
#   name      tên hiển thị
#   jar       đoạn đầu tên file .jar trong data/<server>/plugins (để trang tự đánh dấu đang cài ở server nào)
#   kind      loại (nhóm trên trang): Đăng nhập & kết nối, Quản lý, Chat & hiển thị, Kinh tế & buôn bán, Thị trấn & chiến tranh,
#             PvP & chống hack, Rank donate, Bản đồ & thế giới, Practice, Hệ thống
#   purpose   dùng để làm gì
#   player    lệnh cho người chơi: [lệnh, ý nghĩa]
#   admin     lệnh cho admin/mod: [lệnh, ý nghĩa]
#   settings  chỉnh ở đâu (trang Cài đặt / file)
#   notes     lưu ý
# Thêm plugin mới: thêm một mục ở đây. Plugin đang cài mà chưa có mục sẽ hiện ở cuối trang "Chưa có trong cẩm nang".

guide:
  - title: Việc admin hay làm
    items:
      - ["Lệnh admin /dmm", "/dmm = DuckyMoMo (lệnh riêng của plugin DuckyMoMoCore, gõ dài /duckymomo). Gõ /dmm rồi bấm Tab để gợi ý lệnh con, tên phù phép, mã thư viện đồ, tên người chơi; gõ /dmm không kèm gì để xem hướng dẫn"]
      - ["Quyền của role / rank", "Trang Role & rank: chọn role bên trái, bật công tắc quyền (vd Helper: bay; Builder: gamemode). Có thể chọn áp dụng toàn mạng hoặc từng server"]
      - ["Role Builder", "Tạo quyền 1 lần: docker exec -i duckymomo-lobby-1 rcon-cli < tools/builder-role.cmds. Chỉ ở SẢNH: WorldEdit, xây vượt vùng bảo vệ, /gamemode, /tp. Bang Hội Chiến: không WorldEdit, không vượt vùng, không sáng tạo (xây ở sảnh rồi admin dán //schem). Mọi nơi cấm fill/clone/setblock gốc, towny.admin, give/item/eco. Người giữ thêm role cao hơn (vd Manager) thì khoá của role cao hơn thắng"]
      - ["Role Manager (mã quanly, dưới Admin)", "Tạo 1 lần: trang Role > Manager > nút Tạo role + bộ quyền khuyên dùng (hoặc docker exec -i duckymomo-lobby-1 rcon-cli < tools/quanly-role.cmds) (kế thừa Mod; track staff: helper → mod → quanly → admin). Làm hầu hết mọi việc: phạt, CoreProtect rollback, kinh tế (/eco), đồ (/give, /i, đưa đồ thư viện), WorldEdit, fill/clone/setblock, xây vượt vùng bảo vệ, quản trị Towny, sáng tạo, cấp rank donate, web (cài đặt trừ Hệ thống/Chống hack/Role, cấp role tới Mod). CẤM (ghi false): LuckPerms, sửa quyền role, toàn quyền web, /sudo (leo thang quyền), op/deop/stop/reload/whitelist/plugins/execute/gamerule/worldborder/forceload, /dmm, xoá log CoreProtect (để mọi thay đổi vẫn tra và khôi phục được)"]
      - ["Cấp role staff", "Người được cấp/gỡ role trên trang Role nhận tin trong game nếu đang online. Bật/tắt quyền của role: mọi người trong role (kể cả role kế thừa) đang online nhận tin; ai vừa MẤT quyền bay/bất tử/tàng hình/tốc độ/đổi chế độ chơi thì panel tắt luôn trạng thái đó (Essentials không tự tắt). Gỡ role cũng vậy. Lệnh Essentials (/fly, /kick, /ban, /tp…) chỉ có ở Bang Hội Chiến và Practice (sảnh không cài Essentials, gõ ở sảnh báo Unknown command). Trang Role & rank: chọn role, gõ tên ở mục Thành viên, hoặc /lp user <tên> parent add helper  (lên tiếp: /lp user <tên> promote staff → mod → admin)"]
      - ["Ủng hộ bằng QR trong game", "/rank mua (hoặc /donate mua): người chơi chọn gói trong menu → QR VietQR hiện trên tấm bản đồ trong tay (10 phút) → bấm [Tôi đã chuyển khoản] trong chat → admin nhận tin như trên web, duyệt ở trang quản trị > Donate. Cần: tài khoản ngân hàng trong site/config/site.yml (donate) + PANEL_SITE_KEY trong .env. Bản đồ QR không vứt/cất rương được, hết hạn tự biến mất"]
      - ["Cấp rank donate", "/rank give <tên> <namtuoc|tutuoc|batuoc|hautuoc|congtuoc> <số tháng>  · xem: /rank check <tên> · gỡ: /rank remove <tên>"]
      - ["Đồ phù phép vượt cấp", "/dmm enchant sharpness 30 (món đang cầm) · /dmm sach sharpness 30 <tên> (tặng sách)"]
      - ["Kit quà tân thủ", "Tự phát khi vào Bang Hội Chiến lần đầu (kit tanthu). Sửa đồ trong kit: trang Cài đặt > Bang Hội Chiến > Người mới. Phát tay: /kit tanthu <tên>"]
      - ["Cộng/trừ tiền", "/eco give <tên> <số> · /eco take <tên> <số> · /eco set <tên> <số>  (Bang Hội Chiến)"]
      - ["Phạt", "/mute <tên> <thời gian> · /kick <tên> <lý do> · /tempban <tên> 1d <lý do> · /ban <tên> <lý do> · /unban <tên>"]
      - ["Kiểm tra phá hoại", "/co i (bấm vào block xem ai phá/đặt) · /co rollback u:<tên> t:2h r:30 (khôi phục)"]
      - ["Xem cảnh báo hack", "/grim alerts (bật/tắt) — Mod/Admin tự bật khi vào"]
      - ["Dọn rác ngay", "/dmm clean (Bang Hội Chiến)"]
      - ["Áp dụng lại config DuckyMoMoCore", "/dmm reload — trang Cài đặt tự gọi khi bấm Lưu"]
      - ["Chuyển server", "/server lobby | banghoi-1 | practice-1"]
      - ["Font tiếng Việt", "Gói font gửi tự động khi vào (không bắt buộc). Sửa/làm lại: ./ops/build-font-pack.sh rồi docker compose up -d lobby banghoi-1 practice-1"]
      - ["Sao lưu ngay", "Trên máy chủ: docker compose exec backup-banghoi-1 backup now (lưu ở F:\\DuckyMoMo-backups)"]
      - ["Cổng VPS (giữ IP thật)", "VPS Vinahost 125.212.218.74 (Viettel TP.HCM) chuyển người chơi về nhà qua WireGuard: Java 25565, Bedrock 19132, vote 8192 (25570/19130 cũ vẫn chạy). Xem trạng thái: docker compose logs relay. playit vẫn chạy làm đường dự phòng"]
      - ["Điểm danh hằng ngày", "/diemdanh (Bang Hội Chiến): đếm tổng số ngày (bỏ ngày không mất chuỗi), quà ngày + quà mốc 7/14/30 lặp mỗi 30 lần, phải online đủ 5 phút. Sửa quà: Cài đặt > Bang Hội Chiến > Thưởng & sự kiện (ô chọn quà: xu, đồ thư viện, đồ thường, lệnh). Dữ liệu: plugins/DuckyMoMoCore/diemdanh.yml"]
      - ["Nhiệm vụ hằng ngày", "/nhiemvu (Bang Hội Chiến): mỗi người 3 nhiệm vụ ngẫu nhiên/ngày (đổi 0h) từ danh sách; xong hết thêm thưởng. Khối tự đặt rồi phá không tính. Sửa danh sách, số lượng, quà: Cài đặt > Bang Hội Chiến > Thưởng & sự kiện. Dữ liệu: nhiemvu.yml"]
      - ["Vòng quay miễn phí", "/vongquay (Bang Hội Chiến): chơi thật 60 phút (treo máy không tính) = 1 vé, giữ tối đa 5. Menu hiện tỉ lệ từng món; món hiếm báo cả server. Vé không bán, không trao đổi. Scoreboard có dòng Vé quay (%dmmvq_ve%, %dmmvq_con%). Sửa phần thưởng, trọng số: Cài đặt > Bang Hội Chiến > Thưởng & sự kiện. Tặng vé: /vongquay give <người> <số>"]
      - ["Xưởng chế tạo (/xuong)", "Bang Hội Chiến (Workshop, config workshop.items; Cài đặt › Shop › Xưởng chế tạo, bảng sửa từng món). Logic HIỆU ỨNG + ĐỘ BỀN + THỜI HẠN (ý từ Server Tools của UniMC, tự làm lại): menu 54 ô (tối đa 28 món) → bấm món mở bảng chế 3×3 (grid 9 ô «VẬT_LIỆU số»), bấm thành phẩm để chế (trừ xu + nguyên liệu). Độ bền (uses): công cụ mất 1 mỗi khối (kể cả khối phụ của đào vùng/chặt cây), vũ khí 1 mỗi đòn, cung/nỏ 1 mỗi phát, món dùng 1 mỗi lần; -1 = độ bền gốc. Món có độ bền riêng thì không hỏng theo độ bền gốc (Unbreakable ẩn). Hết độ bền / hết hạn (days) là biến mất. 19 hiệu ứng: dao_vung (3×3/5×5, phá bằng Player.breakBlock nên Towny/CoreProtect thấy, bỏ qua rương và lồng quái), chat_cay, tu_nung (quặng/quặng thô → thỏi, mảnh vụn cổ → mảnh netherite), da_nang (tự đổi cuốc/rìu/xẻng), gat_lua (gặt 3×3 + gieo lại bằng hạt trong túi), hut_do, nam_cham (bán kính; không hút đồ người khác vứt, đồ trong 10 khối quanh chỗ có người chết 5 phút), ban_ruong (đánh vào rương có quyền SWITCH Towny: bán theo Essentials worth.yml, cộng quỹ khai hoang như /sell), tui_hu, nuoc, dung_nham, bat_thu (thú hiền, không thú có chủ/pet MyPet/đã đặt tên, phải có quyền xây ở đó), co_le (lồng quái, mặc định TẮT), moc_bay, hut_mau, khien_than (giảm %, phản 1/2 phần giảm), kiem_nhat (chuột phải lướt chém, hồi 4 giây), riu_chien (% chí mạng ×1,5 + chảy máu 3 giây). Phù phép: gốc, enchantio:<tên>, ce:<Tên> (CrazyEnchantments qua CeBridge, giữ dòng mô tả CE trên lore). pvp: true = mất tác dụng trong vùng vây khi đang đánh. Admin: /xuong tang <mã> [người]. Dấu PDC xuong_id/xuong_luot/xuong_het/xuong_celo"]
      - ["Treo thưởng (/treothuong)", "Bang Hội Chiến: /treothuong dat <người> <xu> (phí 5% không hoàn), ai hạ được nhận hết; giết liền 5 mạng không chết thì hệ thống tự treo 500 xu (+100/mạng). Không tính tài khoản phụ, cùng IP; không treo lên dân Hoà Bình. Hết 3 ngày trả lại tiền. Khác truy nã (án Hội Bàn Tròn). Dữ liệu treothuong.yml. Sửa: Cài đặt > PvP & combat > Treo thưởng"]
      - ["Khai hoang vùng mới (/khaihoang)", "Bang Hội Chiến: quỹ chung tăng khi bán /sell (100% tiền bán tính vào quỹ, người bán không mất gì) và /khaihoang gop <xu>. Đủ mốc tự chạy lệnh nới viền ChunkyBorder (3 mốc: Mã Lai 300k, Philippines 800k, Borneo+Java 2 triệu). SAU KHI MỞ: sửa Tâm viền/Viền thế giới ở Cài đặt > Thế giới cho khớp (ghi chú từng mốc trong nhóm Khai hoang). Admin cộng quỹ: /khaihoang them <xu>. Hologram ở spawn: %dmmkh_ten% %dmmkh_thanh% %dmmkh_pct%% (%dmmkh_quy% / %dmmkh_can%). Mở mốc thì vùng mới (rtp.zones có requires: <mốc>: Mã Lai, Philippines, Borneo, Java) hiện ở /tpr, có đặc sản riêng (region-specialty), pioneer.count người đầu tiên đặt chân tới nhận pioneer.rewards (mặc định 2000 xu + danh hiệu [Tiên Phong]); lưu tienphong.<mốc> trong khaihoang.yml. Quà danh hiệu dùng loại quà «danhhieu <mã>»"]
      - ["Sàn thu mua (/donhang)", "Bang Hội Chiến: cầm món cần mua, /donhang tao <số lượng> <đơn giá> (tiền giữ trước + phí 2% không hoàn). Người khác /donhang, bấm đơn giao hàng nhận tiền ngay; người mua nhận ở /donhang cuatoi (chuột trái nhận, chuột phải huỷ). Đơn đóng sau 7 ngày, trả tiền phần chưa giao. Chỉ đồ thường. Admin huỷ đơn bất kỳ: /donhang huy <số>. Dữ liệu donhang.yml. Sửa: Cài đặt > Bang Hội Chiến > Shop > Sàn thu mua"]
      - ["Vũ khí nổ lên người chơi", "Bang Hội Chiến: end crystal, respawn anchor, nổ giường mặc định 0 sát thương lên người chơi (không hất), xe goòng TNT còn 30%. Quái, rồng, phá khối như gốc. Sửa: Cài đặt > Bang Hội Chiến > PvP & combat > Vũ khí nổ (config explosive-pvp)"]
      - ["La bàn sảnh bị dịch chuyển (admin)", "La bàn cũng là gậy dịch chuyển của WorldEdit (gắn theo phiên người chơi). Đã đổi data/lobby/plugins/WorldEdit/config.yml navigation-wand.item = minecraft:stick; ai đã bị gắn thì cầm la bàn gõ //none. Menu sảnh cũng tự chặn WorldEdit khi bấm la bàn (bản 16/10)"]
      - ["Mùa mưa / mùa khô", "/mua (Bang Hội Chiến): mùa đổi theo ngày thật (mặc định 7 ngày/mùa, bắt đầu mùa mưa 12/10/2026). Mùa mưa: lúa, mía, tre lớn nhanh, xương rồng chậm, mưa nhiều; mùa khô: khoai, cà rốt, dưa, bí nhanh, mía chậm, ít mưa. Được mùa: % rơi thêm 1 nông sản khi gặt cây chín. Cá theo mùa (EvenMoreFish) đọc %dmmmua_id% (mua|kho). Thử: /mua dat kho · /mua dat tudong (trả về lịch). Sửa: Cài đặt > Bang Hội Chiến > Thế giới > Mùa mưa / mùa khô; thêm cây, câu gợi ý: plugins/DuckyMoMoCore/config.yml (seasons)"]
      - ["Quảng trường Vinh danh", "/vinhdanh (dentvinhdanh): Bang Hội Chiến ghi data/shared/vinhdanh/S<mùa>.json (tạm tính 30 phút/lần; /vinhdanh chot khoá khi đóng mùa, /vinhdanh tam ghi ngay) gồm Bá Chủ (nước, vua, thị trấn, thị trưởng, thành viên + chức vụ), Á Chủ, Chiến Thần, Đại Phú Hộ, Kiến Trúc Sư, Đấu Trường, Pet. Ở SẢNH admin đứng đúng chỗ: /vinhdanh dat <mùa|moinhat> <tieude|bachu|chienthan|phuho|kientrucsu|dautruong|pet> dựng bảng chữ nổi + tượng đầu top 3 (quay mặt về phía admin), /vinhdanh xoa (điểm gần nhất), lammoi; người chơi /vinhdanh tp. Lưu điểm đặt: lobby plugins/DuckyMoMoCore/vinhdanh.yml. Web: mục Vinh danh (api/vinhdanh). Đầu người chơi lấy da từ Mojang theo tên (tên không bản quyền thì đầu mặc định)"]
      - ["Mùa giải 3 tháng", "Mỗi mùa 13 tuần: tuần 1–2 hoà bình (tắt vây thành), 3–12 chiến tranh, 13 đại chiến (điểm lãnh thổ ×2, bình chọn Kiến Trúc Sư), rồi đóng mùa (/bxh dongmua → /bxh traothuong → /vinhdanh chot). Mùa sau làm lại từ đầu với BẢN ĐỒ MỚI; giữ tài khoản, rank donate, đồ trang trí, danh hiệu, Quảng trường Vinh danh. Ngày bắt đầu: leaderboard.season-start (trống = chưa mở mùa)"]
      - ["Tiền cướp khi thắng vây", "Tấn công thắng cướp 40 xu × số ô từ ngân khố thị trấn thua. Thiếu tiền thì bên thắng vẫn nhận đủ, thị trấn thua trả nợ dần 7 ngày (SiegeWar plunder_paid_over_time), không bị phá sản vì một trận. Cài đặt › Chiến tranh › Luật công thành"]
      - ["Bản đồ kho báu", "/khobau (TreasureHunt, config treasure): câu cá fish-chance %, hạ quái mob-chance %, tối đa max-per-day/người/ngày (khobau.yml). Bản đồ (PAPER, PDC dmm_khobau = bậc;world;x;y;z) ghi điểm đất hoang ngẫu nhiên trong vùng /tpr đã mở. Cầm trên tay: thanh hành động lạnh/ấm/nóng. Trong dig-radius khối, Shift để đào: lính canh (PDC linhcanh) xuất hiện, hạ hết trong guard-minutes (đứng trong 40 khối) thì nhận quà (Rewards), không thì trả bản đồ. Bậc broadcast báo cả server. Admin: /khobau give <người>. Lính canh sót lại bị xoá khi chunk nạp lại"]
      - ["Bảng truy nã quái", "/truyna (WantedBoard, config wanted): mỗi interval-minutes dán lệnh truy nã một mục trong targets (loài, máu, nhân sát thương, giáp) ở điểm đất hoang của vùng /tpr đã mở, tối đa max-active. Quái chỉ spawn khi có người trong spawn-distance khối, phát sáng, không tự biến mất; hết expire-minutes thì trốn. Người gây nhiều sát thương nhất (Culprit: tính cả pet, tên) nhận rewards, báo cả server. Lệnh không lưu qua khởi động lại (quái sót bị xoá khi chunk nạp)"]
      - ["Cổng Dungeon", "/dungeon (dg, hamnguc; DungeonGate, config dungeon-gate): đặt trường permission của từng gói EliteMobs = duckymomo.dungeon.<mã> (reflection, đặt lại mỗi phút để /em reload không mất; tắt module thì trả quyền gốc), rồi cấp quyền tạm (PermissionAttachment) cho người qua cổng. Mọi lối vào của EliteMobs (menu /em, NPC, nhóm) đều hỏi quyền này. 6 kiểu: gate (chỉ vào qua Cổng Hoang: Cống Ngầm, Bắc Cực), chain (10 tầng Story Mode; trùm cuối tầng requires rơi CHÌA KHOÁ thật (TRIAL_KEY, PDC dmm_chiatang) cho từng người chưa mở và chưa có chìa; dùng chìa = /dungeon vao hoặc chuột phải: mất chìa, mở VĨNH VIỄN tầng đó cho người dùng (dungeon.yml mo.<uuid>); key-tradeable false (mặc định) = chìa ghi tên người nhận, người khác không dùng được; nhóm: mỗi người cần chìa/đã mở riêng), hidden (lối vào chưa đặt thì server TỰ chọn chỗ đất hoang ngẫu nhiên lúc bật, ghi toạ độ vào log; admin xem chỗ + nút [Tới]: /dungeon ds; đổi: /dungeon datan <mã> tại chỗ đứng hoặc /dungeon datan <mã> ngaunhien; tới trong hidden-radius khối là tìm ra cả mùa; night-only; hạt tím quanh lối vào trong 24 khối), luck (Vé Vận Mệnh AMETHYST_SHARD PDC dmm_vevanmenh rơi luck.mob-chance/fish-chance %, max-per-day; dùng có roll-chance % mở, trượt mất vé; báo cả server khi nhặt), ticket (/dungeon mua <mã> [số], price/vé, tối đa max-tickets), server (/dungeon gop <mã> <xu> tới goal → mở cho cả server open-days ngày, 0 = tới hết mùa). Vé trừ lúc /dungeon vao, cổng mở window-seconds giây, không vào kịp (PlayerJoinDungeonEvent) thì hoàn vé. Chung: requires-frontier (mốc khai hoang), first-rewards (quà lần đầu/người), báo cả server người ĐẦU TIÊN vượt. Điều kiện phụ từng dungeon (kiểm cho từng người trong nhóm EliteMobs /em party; dungeon có điều kiện thì không cấp quyền sẵn, mỗi lần vào đều qua /dungeon vao): min-pet-level (pet đang dẫn, MyPetBridge), party «2-4» (PartyManager.getDungeonEntryMemberIds), days [t2..t7, cn], hours «19-23», seasons [mua, kho], hegemon-only (WarBalance), min-achievements. Mặc định: Hoang Mạc Địa Ngục pet 10+, Chuông Địa Ngục nhóm 2–4, Lâu Đài Hiệp Sĩ T7/CN, Xưởng Hơi Nước 8 thành tích, Đấu Trường Ma nhóm 2–5 + 19–24h, Kẻ Trói Buộc nhóm 3–6 + pet 20+. Dungeon ẩn có fragments: tìm ra rồi còn ghép N Mảnh Chìa (ECHO_SHARD, PDC dmm_manhchia; rơi fragment.mob-chance/fish-chance %, chỉ cho người đã tìm ra; Thánh Đường Bóng Tối cần 3). Nhóm mở cổng: trưởng nhóm /dungeon vao, cả nhóm được quyền tạm, vé trừ của từng người. Dungeon của tuần (weekly): chọn ngẫu nhiên đầu tuần (khác tuần trước), vượt được thêm weekly.rewards tối đa max-per-week lần/người. Kỷ lục tốc độ: từ lúc vào tới DungeonCompleteEvent, top 5 mỗi dungeon, báo cả server khi phá kỷ lục, web hiện top 3. Kho báu bậc có reveal-hidden % (huyền thoại 40%): kèm mảnh giấy chỉ đường (±40 khối) tới lối vào ẩn chưa tìm ra. Admin: /dungeon cho <mã> <người> [số] (vé / Vé Vận Mệnh / Mảnh Chìa / Chìa khoá tầng), /dungeon datan <mã>, /dungeon mo <mã>. Thành tích dg1 (vượt 1), dg2 (30 lượt, danh hiệu chinhphuc), dga (tìm dungeon ẩn, danh hiệu timan). 18 dungeon (18/10): chain 10 (Đỉnh Vách Đá 10 → Hang Thánh Địa → Mỏ Hoang → Cây Cầu Cổ → Thành Phố Đổ Nát → Cung Điện → Mỏ Đá → Mỏ Sâu → Hoang Mạc Địa Ngục → Chuông Địa Ngục 55), gate 2 (Cống Ngầm, Bắc Cực), hidden 1 (Thánh Đường Bóng Tối), ticket 2 (Lâu Đài Hiệp Sĩ 3000, Xưởng Hơi Nước 5000), server 3 (Pháo Hoa 100k/7 ngày, Đấu Trường Ma 150k/7 ngày, Kẻ Trói Buộc Thế Giới 1 triệu/hết mùa), luck 0 (chưa có → Vé Vận Mệnh không rơi). Web: thẻ Cổng Dungeon (trang chủ: kiểu, điều kiện, quỹ, Dungeon của tuần, kỷ lục top 3), thẻ Dungeon (tài khoản: tầng đã vượt, dungeon ẩn đã tìm, vé). Lưu dungeon.yml, ghi dungeon.json. Cài đặt › Thế giới › Cổng Dungeon"]
      - ["Cổng Hoang", "/conghoang (cong-hoang, rift; WildGates, config wild-gates): khi đã mở mùa (leaderboard.season-start), mỗi interval-days (7) ngày đặt 1 cổng, tối đa max-gates (4)/mùa, đích ưu tiên dungeon ít cổng nhất, ở đất hoang vùng /tpr đã mở, cách spawn thị trấn >= min-town-distance, cách cổng khác >= min-gate-distance; báo «tin đồn» (vùng + hướng, không toạ độ). Ngụy trang ngẫu nhiên hợp địa hình, 14 kiểu: đồng cỏ/núi (vòng đá rêu, tượng đá đổ, vòng nấm, đá tảng), rừng (gốc cây rêu, tượng đổ, vòng nấm, đá tảng), sa mạc (giếng cạn, cột đá đổ, xương hoá thạch), tuyết (cột băng, gò tuyết, đá tảng), đầm lầy (rễ đước, xác thuyền, vòng nấm), biển (xác thuyền), DƯỚI NƯỚC (vòng san hô, cột đá chìm, xác thuyền; đáy sâu 2–24 khối, underwater-chance %), khối của cổng không phá được (lưu để gỡ lại). Độ khó nhận ra theo bậc dungeon (wild-gates.dungeons.<mã>.tier 1–3; tiers.t1–t3): hạt tím particle-range (16/8/4 khối, bậc 3 chỉ ban đêm), dòng nhắc hint-range (6/3/0), dựng structure-percent chi tiết (100/55/25%), tin đồn chi-tiet (vùng + hướng) / vung / mo-ho (chỉ loại địa hình), kho báu chỉ đường sai số treasure-radius (40/80/150). Tin đồn ghép cảnh vật ngụy trang + dấu hiệu riêng của dungeon (dungeons.<mã>.rumor). Đứng ô giữa + Shift để vào. Người tìm ra đầu tiên: grace-minutes phút ưu tiên (chặn TownPreClaimEvent/PreNewTownEvent của người khác trong grace-radius), thành tích + danh hiệu mocong. Chủ cổng = thị trấn có ô đất chứa cổng: dân thị trấn / cùng nước / nước đang chiếm (SiegeWar getTownOccupier) vào miễn phí; người ngoài trả phí /conghoang phi <mã> <xu> (<= max-toll) vào ngân khố thị trấn, hoặc /conghoang dong|mo; người quản lý: vua nước chiếm nếu bị chiếm, không thì thị trưởng. Cổng dẫn vào 1 dungeon trong wild-gates.dungeons qua DungeonGate.passThrough (bỏ qua điều kiện). upkeep-per-day và revolt-hours-less (WarBalance) mặc định 0. Kho báu huyền thoại có thể chỉ đường tới cổng chưa ai tìm. Admin: tao [here], ds, xoa <mã>, datlai. Lưu conghoang.yml, ghi conghoang.json (không có toạ độ). Cài đặt › Thế giới › Cổng Hoang"]
      - ["Thăng Cấp", "/capdo (cap, prestige, thangcap; LevelUp, config level-up, Bang Hội Chiến; ý từ Prestige của UniMC): cấp riêng của server, max-level 100. Lên cấp N cần ĐỦ: xu = money-base × N^money-exponent (mặc định 500 × N^1,25, TRẢ khi lên), giờ chơi thật của mùa (Activity) ≥ hours-per-level × N (0,5), điểm hạ gục tích luỹ ≥ kill-points-per-level × N (20); hạ quái +mob-points (1), hạ người +player-points (10), quái từ lồng không tính, giết lại cùng một người trong player-cooldown-minutes (10) không tính. Lên cấp +points-per-level điểm; mỗi milestone-every (10) cấp quà milestone-rewards + báo «sự kiện». Cửa hàng (level-up.shop: name, icon, cost, perms [quyền LuckPerms cấp vĩnh viễn cho người chơi], rewards, description): craft, disposal, anvil, hat, thêm 1 hiệu ứng hạt, pet mèo, giảm 5% Xưởng (duckymomo.xuong.giam), danh hiệu Lão Luyện. CHỈ tiện ích / trang trí. keep-on-new-season false (mặc định): leaderboard.season-start đổi → làm lại cấp, điểm, gỡ quyền đã mua. Menu: lên cấp, cửa hàng, xếp hạng (đầu người). Tab: %dmmcap_cap% (TAB groups.yml tabsuffix). Admin: /capdo dat <tên> <cấp>. Lưu capdo.yml, capdo.json (web: top 10 + thẻ tài khoản). Cài đặt › Kinh tế › Thăng Cấp"]
      - ["Lữ khách", "/lukhach (lu-khach, wanderers; Wanderers + CitizensBridge + WanderersPapi, config wander-npcs, chỉ Bang Hội Chiến, cần Citizens; lời thoại BetonQuest gói cotruyen/lukhach/): 4 NPC Citizens, mỗi người gắn một dungeon đích của Cổng Hoang (npcs.<mã>.dungeon): cong = Thợ Cống Già (Cống Ngầm), bacuc = Người Kéo Xe Tuần Lộc (Bắc Cực), hiepsi = Hiệp Sĩ Lạc Đàn (Lâu Đài Hiệp Sĩ), hoinuoc = Kỹ Sư Bỏ Trốn (Xưởng Hơi Nước). Đặt ở chỗ đất hoang ngẫu nhiên (WildGates.randomSpot, không dưới nước), mỗi move-hours (72) giờ dời chỗ, báo tin đồn «Ở <vùng> (<hướng>) <rumor>» nếu announce. Lời thoại đọc tình trạng cổng qua PAPI %dmmlk_<mã>_cong|tim|tindon|vung|huong|chu|timboi|ten|npcvung|npchuong% (BetonQuest %ph.…% + variable … forceSync): chưa có cổng (chưa mở mùa) → chỉ kể truyền thuyết; có cổng → chỉ đường bằng tin đồn của cổng / ai tìm ra / thị trấn đang giữ. Đi qua Cổng Hoang (WildGates.use sau passThrough) → console bq tag <tên> add cotruyen>lk_<mã>_qua; về kể → constants.lk_thuong xu (mặc định 1000), tag lk_<mã>_xong, mỗi người 1 lần mỗi lữ khách (chưa làm lại theo mùa). Admin: /lukhach ds | doi <mã|all> | xoa. Lưu lukhach.yml (ID NPC, chỗ, lúc dời), ghi lukhach.json (web: trang chủ thẻ Cốt truyện › Lữ khách, trang tài khoản thẻ Lữ khách). Cài đặt › Cốt truyện › Lữ khách"]
      - ["Cài đặt cá nhân", "/caidat (settings, tuychon; PlayerSettings, mọi server, player-settings.enabled mặc định bật): menu 19 công tắc, lưu ở LuckPerms meta của người chơi «dmmcaidat.<mã>» = bat|tat (không có = mặc định) nên dùng chung mọi server + proxy; trang tài khoản trên web có thẻ Cài đặt cá nhân bật/tắt được (panel gửi lp user … meta set/unset qua RCON sảnh; plugin nghe UserDataRecalculateEvent để áp lại ngay). Công tắc: chat (bỏ người tắt khỏi người xem chat), msg (/msg /tell /w /m /t /pm /whisper…: chặn gửi tới người tắt), goiten (tiếng ting khi bị nhắc tên), loctuc (người tắt thấy bản gốc: ChatFilter.ORIGINAL + bọc renderer, chạy cả với EssentialsXChat), vaora / tuvong (tin vào-rời, tử vong gửi riêng từng người), donrac (ItemCleaner), sukien (truy nã, kho báu, Cổng Hoang, dungeon), khungnhac (JoinNotes), bangphai / bossbar (tab scoreboard|bossbar on|off <tên> -s), hat (PlayerParticles togglePlayerParticleVisibility), maumob (HoloMobHealth playersEnabled + Database.toggle), tpa / tpahere (chặn /tpa, /tpahere tới người tắt), loimoi (/duel <tên>, /party invite <tên>), nhacvay (còn ≤15 phút tới phiên đánh SiegeWar: báo người có thị trấn bị vây / nước đi vây), nhacngay (mỗi giờ: chưa điểm danh / còn nhiệm vụ), goipet (mặc định tắt: vào game tự /petcall). Staff có duckymomo.caidat.bypass nhắn/TPA/mời được cả người đã tắt. Lệnh nhanh: /caidat <mã> bat|tat"]
      - ["Thái Ấp", "/thaiap (datrieng; ThaiAp, config thai-ap): thế giới phẳng riêng (mặc định thaiap: đá-đất-cỏ ở y 64, đồng bằng, không hang/quặng/công trình, không quái, không PvP, Towny tắt ở thế giới này bằng API). Mua /thaiap mua (prices[0], cạnh sizes[0]), mở rộng /thaiap morong, mời moi/duoi (max-trusted), ghé ghe <tên>, thích thich (1 lần/người/mảnh), top, ten, datspawn. Mảnh xếp lưới 20 mảnh/hàng cách nhau cell khối, viền lối mòn. Bảo vệ: phá/đặt/xô/tương tác/thú/khung tranh/giá giáp chỉ chủ + người được mời (admin vượt), chặn nổ, nước tràn, piston qua ranh. Bếp riêng: món /nauan nấu trong Thái Ấp của mình +kitchen-bonus % thời gian hiệu ứng. MyPet worldgroups: thaiap trong nhóm default. Lưu thaiap.yml, ghi thaiap.json"]
      - ["Thái Ấp Sáng Tạo (server sangtao-1)", "Server sáng tạo RIÊNG (modes/sangtao), KHÔNG có trong menu sảnh (mode.yml status: closed). Lối vào duy nhất: cổng tím (khung thạch anh tím 4×5 + chữ nổi + hạt) trong thế giới Thái Ấp của Bang Hội Chiến, tự dựng ở chỗ xuất hiện (0, 64, 6); dời cổng: admin đứng chỗ mới gõ /thaiap congsangtao. Người chơi: /thaiap sangtao (tới trước cổng) rồi bước vào; phải có Thái Ấp hoặc được mời xây cùng. Bước vào → ghi vé data/banghoi-1/plugins/DuckyMoMoCore/sangtao-ve.yml (hạn thai-ap.sang-tao.ticket-seconds = 60 giây) → chuyển server. sangtao-1 chạy DuckyMoMoCore ở chế độ BẢN SAO: đọc thaiap.yml của Bang Hội Chiến (mount chỉ đọc /banghoi-dmm, đọc lại mỗi 30 giây) nên mảnh đất cùng số, cùng cỡ, cùng người được mời; mua/mở rộng/mời/đặt tên vẫn làm ở Bang Hội Chiến. Vào bằng /server sangtao-1 không có vé → báo và đưa về sảnh (admin quyền duckymomo.admin vào thẳng được). Túi đồ, tiền tách hẳn (server khác, không Vault/Essentials): không có đường mang đồ sáng tạo về. Chặn ném đồ, kích nổ (TNT, creeper…), triệu hồi wither/rồng, tuần tra/đột kích; tối đa max-entities (40) sinh vật trong 48 khối. Lệnh ở sangtao-1: /thaiap (về mảnh đất), /thaiap ghe <tên>, /thaiap ve (về Bang Hội Chiến). Config: modes/sangtao/server/plugins/DuckyMoMoCore/config.yml (thai-ap.sizes, cell, world PHẢI giống Bang Hội Chiến). Server 2 GB RAM (mem_limit 3g), có sao lưu backup-sangtao-1. Chưa có WorldEdit (để sau)"]
      - ["Lính đánh thuê", "/linhdanhthue (ldt): người KHÔNG thuộc nước nào (không Liên minh Hoà Bình, không tài khoản phụ, >= min-hours giờ) /linhdanhthue dangky <giá>, rút: huy. Vua hoặc chức hire-ranks: /linhdanhthue thue <tên> (lính phải online) → lính nhan|tuchoi → ngân khố nước trả, server giữ fee-percent %. Hợp đồng contract-hours giờ: quyền tạm siegewar.immune.to.war.nausea (vào vùng vây không ốm), ăn kho lương thủ đô nước thuê, không đánh được người nước thuê và ngược lại; không giữ cờ, không điểm Chiến Thần. Module Mercenary, lưu linhdanhthue.yml"]
      - ["Sổ thành tích", "/thanhtich (sothanhtich): 18 mốc chơi một mình (khám phá vùng /tpr, câu cá, loài cá, quái, cấp pet, số pet, thắng Đấu Trường, nấu món, nộp kho lương, giờ chơi), tự đếm, đạt là tự nhận quà (Rewards); mốc có danh hiệu thì báo cả server. Sửa ở achievements.list. Admin xem người khác: /thanhtich <tên>. Lưu thanhtich.yml"]
      - ["Server vắng thì nhẹ đi", "low-population: quy mô = số người có chơi trong 7 ngày (chốt mỗi ngày). Dưới threshold (15): nhiệm vụ hằng ngày × quest-scale (0,6), bắt pet +capture-bonus % (10), phe phòng thủ không ai online thì bên tấn công chỉ ăn absent-defender-attack-percent % (50) điểm giữ cờ. Module LowPop"]
      - ["Cân bằng chiến tranh", "/canbang (bachu): nước đi vây tốn quỹ +war-chest-extra-percent-per-town% mỗi thị trấn (trừ thị trấn đầu) — thu thêm lúc cắm cờ, cộng vào quỹ của cuộc vây; mỗi thuộc địa tốn colony-upkeep-per-day xu/ngày (thiếu ghi nợ, còn nợ thì chặn cắm cờ); tối đa max-colonies thuộc địa (chặn PreInvadeEvent); hạn khởi nghĩa = 72 giờ trừ 12 giờ mỗi thuộc địa khác (tối thiểu 24); bên phòng thủ ít dân (bên kia gấp underdog-ratio) +15% điểm giữ cờ; Bá chủ (>= 30% thị trấn, >= 5): đánh vào được hoàn 30% quỹ và +15% điểm, Bá chủ chỉ hưởng đặc sản 2 vùng. Module WarBalance (SiegeWar qua phản chiếu), lưu canbang.yml, ghi canbang.json"]
      - ["Kho lương công thành", "/kholuong (Bang Hội Chiến): mỗi thị trấn một kho (điểm). Nộp: /kholuong nop (đồ đang cầm, kể cả cá câu và món ăn), noptat (cả túi nhưng BỎ QUA cá câu và món ăn, vì là đồ quý), top (các kho). Lúc có phiên đánh, mỗi 15 giây người trong vùng vây ăn cost-per-player-minute/4 điểm từ kho THỊ TRẤN MÌNH: còn thì được nuôi no (tự hồi máu), cạn thì bị Đói. Kho chỉ giảm khi quân ăn trong trận, trừ khi bật hao hụt (spoil-percent-per-day, mặc định 0). Module SiegeSupply, config siege-supply, lưu kholuong.yml (+ kholuong.json cho web). Cài đặt › PvP & combat › Kho lương"]
      - ["Món ăn ra trận", "/nauan (bep, monan): bếp nấu cá câu (ca:<độ hiếm>) + nông sản thành món có hiệu ứng ngắn (Cơm nắm, Canh chua cá, Cá kho tộ, Lẩu cá, Gỏi cá huyền thoại). Ăn xong chờ cooldown-minutes mới ăn món khác. Món là đồ vật (PDC dmm_mon), nộp kho lương được. Sửa món trên Cài đặt › PvP & combat › Món ăn ra trận › Các món: bảng chọn nguyên liệu (vật phẩm hoặc cá theo độ hiếm) và hiệu ứng (loại, cấp, giây), tối đa 7 món. Module Dishes, config dishes.list"]
      - ["Đặc sản vùng", "/dacsan: vùng = rtp.zones; phe (nước, hoặc thị trấn chưa vào nước) có nhiều thị trấn nhất trong vùng (đếm nhà chính/spawn) là chủ vùng, dân phe đó gặt đặc sản vùng ở BẤT KỲ đâu được mùa thêm % (cộng vào được mùa của /mua). Tính lại mỗi refresh-minutes, ghi dacsan.json cho web. Module RegionSpecialty, config region-specialty.regions"]
      - ["Sự kiện mùa", "Lũ (ngày cuối mùa mưa: ép mưa, lúa/khoai chậm, Thủy tộc dễ bắt) và Hạn hán (ngày 3–4 mùa khô: ép nắng, cây chậm, nộp nông sản kho lương x1,5). Config seasons.events (from-day/to-day, số âm đếm từ cuối). Thử: /mua sukien <lu|han|tudong>. Placeholder %dmmmua_sukien%"]
      - ["Bùa bắt pet", "/buabatpet: cầm tay trái khi quăng dây xích bắt pet: +charm-bonus% (25), mất 1 bùa mỗi lần thử. Có từ giải nhất/nhì/ba thi câu cá (3/2/1, EvenMoreFish COMMAND:buabatpet give {player} N trong competitions/thicau.yml). Admin phát: /buabatpet give <người> [số] (quyền duckymomo.pet.admin)"]
      - ["Câu cá (EvenMoreFish)", "Cá còn dùng để cho pet ăn (chuột phải pet) và đổi đồ ở /doimanh (giá ca:<độ hiếm>). /emf (Bang Hội Chiến, gõ tắt /cauca): 24 loại cá Việt (Thường/Hiếm/Quý/Huyền thoại), cá có mùa chỉ câu được mùa đó, cá biển chỉ ở biển. Đồ kho báu gốc (sách phù phép…) vẫn ra như thường. Bán cá: /emf shop. Thi câu tự động T7, CN 20:00 (con dài nhất, 2 người trở lên). Mở tay: /emfa competition start 20 LARGEST_FISH. Thêm/sửa cá: plugins/EvenMoreFish/rarities/*.yml rồi /emfa reload"]
      - ["Cửa hàng Kinh Đô trên web", "Cài đặt > Bang Hội Chiến > Shop > Cửa hàng trang trí: sửa vật liệu cơ bản, đồ trang trí (đồ thường hoặc đồ trong Thư viện đồ), danh hiệu và giá; Lưu là nạp ngay. Vật liệu bán rẻ hơn giá thu mua /sell tự bị bỏ"]
      - ["Hệ thống (trang quản trị)", "Trang quản trị > Theo dõi > Hệ thống (quyền duckymomo.web.hethong, tính năng hethong trong web-quyen.yml): mỗi server (sảnh, Bang Hội Chiến, Practice) hiện online + tên người chơi, TPS 1/5/15 phút, MSPT, RAM (essentials:gc; sảnh không có Essentials nên không có RAM), chunk, thực thể, thời gian đã chạy; tự làm mới 15 giây. Nút: Lưu thế giới (save-all flush), Dọn rác (dmm clean: giữ đồ quanh chỗ chết, đồ có tên, đất thị trấn; chỉ Bang Hội Chiến), Nạp DuckyMoMoCore, Nạp TAB, Nạp EliteMobs (Bang Hội Chiến). Khởi động lại: chọn 30 giây / 1 / 2 / 5 phút / ngay; có người online thì hỏi xác nhận kèm tên; trong game báo ở các mốc 5 phút, 2 phút, 1 phút, 30, 10, 5…1 giây (chữ + title); hết giờ: save-all flush rồi stop qua RCON, Docker (restart: unless-stopped) tự bật lại. Có nút Huỷ khi đang đếm ngược. Mọi thao tác ghi web-thaotac.jsonl. Proxy không có RCON: khởi động lại proxy phải làm trên máy chủ (docker compose restart proxy)."]
      - ["Boss (trang quản trị)", "Trang quản trị > Boss: tạo boss EliteMobs trên web (tên màu/dải màu, loại quái, cấp, máu ×, sát thương ×, kỹ năng chọn từ danh sách, trang bị, thông báo, bảng vinh danh top sát thương, lệnh khi chết, nút chia mảnh sự kiện cho người tham gia). Lưu = em reload. Gọi boss cạnh một người chơi hoặc tại toạ độ (em spawn bossAt). Boss có sẵn của EliteMobs: sửa thẳng file gốc (chỉ ghi mục đã đổi, tự sao lưu bản gốc vào data/panel/boss-goc, có nút Khôi phục) hoặc Chép thành boss mới"]
      - ["Mảnh sự kiện & đổi quà", "Mảnh là đồ vật (trao đổi, bán được), có dấu ẩn chống làm giả. /doimanh mở cửa hàng đổi. Phần thưởng 'Mảnh sự kiện' (điểm danh, nhiệm vụ, vòng quay) giới hạn 20 mảnh/người/ngày; boss/admin phát bằng /doimanh give <người> <loại> <số> (không giới hạn). Mỗi loại có hạn đổi. Sửa loại mảnh, cửa hàng: Cài đặt > Bang Hội Chiến > Thưởng & sự kiện"]
      - ["Thanh đếm ngược bảo vệ người mới", "Boss bar của PvPManager (15 phút). Sửa chữ, màu, bật/tắt: Cài đặt > Bang Hội Chiến > PvP & combat"]
      - ["Thư viện đồ (phần thưởng)", "Trang quản trị > Thư viện đồ: tạo đồ trên web (tên màu, lore, phù phép kể cả vượt cấp, Enchantio và CrazyEnchantments (Boom, Vampire…, ghi [CE]), không thể hỏng), xem trước như trong game, Lưu là Bang Hội Chiến nạp ngay; nút Đưa cho người chơi đang online. Đồ đặc biệt từ game: cầm trên tay, /dmm luudo <mã> (giữ nguyên vẹn). Phát: /dmm laydo <mã> [người] [số]. Dùng cho điểm danh, nhiệm vụ, vòng quay, đổi mảnh, cửa hàng (đang làm)"]
      - ["Tự sửa sau khi máy khởi động lại", "Tự chạy 2 phút sau khi đăng nhập Windows (tác vụ 'DuckyMoMo tu sua'): sửa cổng chết, thư mục gắn bị treo, playit cho cả Minecraft, Trạm 6, goc6; có người online thì không khởi động lại. Chạy tay: ./ops/tu-sua-sau-khoi-dong.sh (thêm --kiem-tra để chỉ xem). Nhật ký: data/ops/tu-sua.log"]
      - ["Trang trí trên web", "Trang tài khoản > Trang trí: đổi tên (nick, bảng màu theo quyền nick.color/format/rgb, xem trước chat + trên đầu + Tab), hiệu ứng hạt (PlayerParticles, hình động xem trước, chỉ hiện hiệu ứng/kiểu rank có), chọn danh hiệu; mục Pet trang trí chỉ liệt kê loài rank được dùng (gọi pet làm trong game bằng /pet, web không gọi pet). Chạy THAY người chơi bằng /sudo của Essentials (plugin tự kiểm quyền), nên người chơi phải đang online ở Bang Hội Chiến hoặc Practice (danh hiệu: chỉ Bang Hội Chiến). /hat vẫn làm trong game. Danh sách hiệu ứng/kiểu/pet: panel/taikhoan.py (PP_EFFECTS, PP_STYLES, PASSIVE_PETS)"]
      - ["Lệnh hay dùng (trang tài khoản)", "Mục 'Lệnh bạn dùng được' trên web hiện '⭐ Hay dùng' trước (nhóm Người chơi / Staff / Admin, đúng thứ tự trong modes/_network/lenh-hay-dung.yml, sửa không cần build), các lệnh khác thu gọn theo plugin. Mỗi người chỉ thấy lệnh mình dùng được"]
      - ["Donate qua web (QR)", "Trang tài khoản > Ủng hộ server: người chơi chọn bậc + gói (giá đọc từ donate-ranks.tiers.*.prices), web hiện QR VietQR (img.vietqr.io) với số tiền + nội dung 'DMM <TÊN> R<bậc> <tháng>T <mã>', bấm 'Tôi đã chuyển khoản' thì báo admin online trong game + dòng Hoạt động. CHƯA tự cấp: trang quản trị > Donate, kiểm tra tiền về rồi bấm 'Cấp rank' (chạy /rank give) hoặc 'Đã cấp tay' / 'Huỷ'. Số tài khoản: site/config/site.yml mục donate (sửa không cần build). Dữ liệu: data/panel/donate.json"]
      - ["Đăng nhập web bằng tài khoản game", "Trang web có nút Đăng nhập (taikhoan.html): người chơi xem rank, hạn rank, tiền, giờ chơi, điểm danh, nhiệm vụ, vé quay, vote, thị trấn, lệnh mình dùng được. CHỈ đăng nhập bằng mã 6 số từ /web (dùng 1 lần, 5 phút), web không nhận mật khẩu. Staff mở trang quản trị NGAY TRÊN TRANG WEB, chỉ thấy phần có quyền (modes/_network/web-quyen.yml; cấp quyền ở trang Role > Trang quản trị web); quyền quản trị 12 giờ sau khi nhập mã, hết thì /web lại. Sai 5 lần khoá tên 15 phút; mỗi lần đăng nhập web báo vào game cho chủ tài khoản. Có thẻ Chơi lại từ đầu (/choilai): hiện số lần còn, ngày phải chờ, có quà không; bấm nút thì server hỏi xác nhận TRONG GAME (phải online ở Bang Hội Chiến). Nhật ký đăng nhập + thao tác: data/panel/web-thaotac.jsonl"]
      - ["Trước khi khởi động lại (BẮT BUỘC)", "1) Kiểm ai online bằng lệnh RIÊNG (không gộp với lệnh restart): for s in lobby banghoi-1 practice-1; do docker compose exec -T $s rcon-cli minecraft:list; done (hoặc trang Hệ thống). Có người thì DỪNG, báo trước trong game (/broadcast) rồi chờ. 2) Khởi động lại đúng server cần: docker compose restart banghoi-1 (đổi jar/biến môi trường mới cần docker compose up -d <server>). 3) Xem log tới dòng Done: docker logs -f duckymomo-banghoi-1-1. Lobby/practice phải thấy DuckyMoMoCore bật (không NoClassDefFound). 4) Có khởi động lại / tạo lại PROXY thì PHẢI tạo lại relay: docker compose --profile tunnel up -d --force-recreate relay, rồi docker exec duckymomo-relay-1 wg show phải có latest handshake. 5) DuckyMoMo, tram6, goc6 luôn phải chạy"]
      - ["Mở Mùa 1 (khi mở server cho người chơi)", "Cài đặt › Bang Hội Chiến › Bảng xếp hạng: Ngày bắt đầu mùa (leaderboard.season-start, yyyy-mm-dd). Đặt ngày thì: Cổng Hoang tự đặt cổng (4 cổng, 7 ngày thêm 1), tuần mùa bắt đầu đếm (Kiến Trúc Sư tuần 12/13, tuần nhân đôi 13), Thăng Cấp làm lại nếu keep-on-new-season tắt, kỹ năng AuraSkills làm lại khi người chơi vào (aura-skills.reset-each-season). Trước đó: đặt Quảng trường Vinh danh ở sảnh (/vinhdanh dat), NPC chương 1 (/npc create Già Làng, Bác Thợ Rèn, Người Gác Cổng), NPC cửa hàng (/dmm shopnpc), NPC /tpr (/dmm rtpnpc), kiểm tra TEST-CHECKLIST. Hết mùa: /bxh dongmua → 3 ngày khiếu nại → /bxh traothuong → /vinhdanh chot"]
      - ["Người chơi báo mất đồ / bị phá nhà", "1) Hỏi GIỜ, CHỖ (toạ độ F3), tên nghi phạm. 2) Đứng ở chỗ đó: /co i rồi bấm khối/rương xem ai đặt, phá, lấy. Hoặc /co lookup u:<tên> t:2h r:20 (Vd: /co lookup u:Ga t:3h r:15 a:container). 3) Hoàn tác: /co rollback u:<tên> t:2h r:20 (thử /co rollback ... #preview trước). Lỡ tay: /co restore với cùng tham số. 4) Chết rơi đồ do lỗi server: chỉ trả nếu log xác nhận (data/banghoi-1/logs/latest.log); dùng /dmm laydo từ thư viện đồ hoặc /give, ghi lại vào nhật ký. 5) Bị lừa ngoài /trade: không trả (luật đã ghi trong cẩm nang)"]
      - ["Nghi hack / bị kick nhầm", "/grim alerts bật cảnh báo. Xem lịch sử: docker logs duckymomo-banghoi-1-1 | grep -i grim. Người bị kick nhầm (lag, Bedrock): kiểm ping (/ping <tên> nếu có, hoặc TAB), không phạt khi chỉ có 1 cảnh báo lẻ. X-ray: /co lookup u:<tên> a:-block b:diamond_ore t:1d xem tỉ lệ đào kim cương"]
      - ["Phát quà / bồi thường nhanh", "Tiền: /eco give <tên> <xu> (Vd: /eco give Linh 500). Bùa bắt pet: /buabatpet give <tên> [số]. Mảnh sự kiện: /doimanh give <tên> <loại> <số>. Vé vòng quay: /vongquay give <tên> <số>. Bản đồ kho báu: /khobau give <tên>. Đồ trong thư viện: /dmm laydo <mã> (Tab gợi ý). Sách vượt cấp: /dmm sach <phù phép> <cấp> <tên>. Ghi lại lý do trong Discord staff để tránh phát trùng"]
      - ["Sửa cẩm nang trong game (/huongdan)", "Trang quản trị › Cẩm nang game (sửa, lưu là chép sang 3 server, có hiệu lực ngay) hoặc sửa modes/_network/huongdan.yml rồi ./ops/huongdan.sh. Plugin TỰ ngắt dòng và sang trang (13 dòng/trang); trang dài bị cắt sang trang sau không tiêu đề nên chia trang khoảng 12 dòng. Mục lục chỉ 1 trang: tối đa ~11 chương, tên ≤ 17 chữ. Không đổi mã batdau / banghoi / practice (chương mở mặc định). Số liệu (giá, phí, lịch) GHI TAY: đổi ở Cài đặt thì sửa luôn cẩm nang. Màu: &0 &1 &2 &4 &5 &6 &8, tránh &e &f &a (nền giấy khó đọc)"]
      - ["Hội đồng Hoà Bình & Tổ chức (admin)", "Không có lệnh admin riêng: tự chạy theo phiếu. Dữ liệu plugins/DuckyMoMoCore/hoidong.yml (đại diện, bầu cử, kiến nghị K1, K2…) và tochuc.yml (tổ chức, quỹ, giấy phép, sự kiện S1, S2…). Sửa tay CHỈ khi server tắt (plugin giữ dữ liệu trong bộ nhớ, lưu đè). Giấy phép = nhóm LuckPerms giayphep-thuonghoi / giayphep-sukien (server=banghoi-1); thu hồi khẩn cấp: /lp user <tên> parent remove giayphep-thuonghoi server=banghoi-1, rồi cho Hội Bàn Tròn ra kiến nghị THUHOI để dữ liệu khớp. Cài đặt: council.* (nhiệm kỳ 30 ngày, bầu 2 ngày, tối đa 2 nhiệm kỳ, kiến nghị 3 ngày, ≥3 dân hoạt động mới có phiếu), organizations.* (3 người, 100 xu/tuần, 3 suất Thương Hội, 2 suất Sự kiện, rao 60 phút/lần, điểm dịch chuyển sự kiện 24 giờ)"]
      - ["Việt hoá plugin (tools/vi)", "Đã Việt hoá: Essentials, Towny, SiegeWar, QuickShop, EvenMoreFish, Duels, zAuctionHouse, Shopkeepers, TradePro, CrazyEnchantments (cả 105 phù phép), SimplePets, GrimAC, Sonar, AuraSkills, BetonQuest, zMenu, OldCombatMechanics, uJobs… Plugin cập nhật mà lòi tiếng Anh: chạy trong image panel (có ruamel): docker run --rm -u $(id -u):$(id -g) -e PANEL_PASSWORD=x -v $PWD/tools:/t:ro -v <thư mục file>:/f --entrypoint python3 duckymomo-panel /t/vi/yamlvi.py dump /f/messages.yml → dịch → apply /f/messages.yml <bandich.json> (tự kiểm biến {x} %x% <x>; --no-angle nếu <x> chỉ là cú pháp lệnh). Bản dịch có sẵn ở tools/vi/bandich/*.json (apply lại được). Riêng: essentials.py, towny.py, quickshop.py, evenmorefish.py, crazyenchantments.py, auraskills-vi.py. Sau khi sửa: lệnh reload của plugin (Vd: ah admin reload, tradepro reload) hoặc khởi động lại; file do trang Cài đặt quản lý chỉ sửa trong data/, không chép vào repo. Giữ nguyên tên lệnh tiếng Anh (/t, /ah…)"]
      - ["Bảo mật & chống hack (rà 19/10)", "ĐANG CÓ: Sonar ở proxy (chống bot dồn kết nối), AuthMe bcrypt + captcha sau 3 lần sai + cấm IP 30 phút sau 10 lần sai + kick khi sai, KHÔNG có phiên tự đăng nhập (CGNAT 4G/quán net dùng chung IP: bật lại phải để ≤ 10 phút), AuthMeVelocity chặn đổi server/lệnh/chat trước khi đăng nhập, Velocity modern forwarding (server con không mở cổng ra ngoài, không giả tên được), Bedrock xác thực Xbox qua Floodgate (tên có dấu chấm, Java không giả được), GrimAC (Bang Hội Chiến, Practice), anti-xray Paper, giới hạn gói tin/sách/tên đồ của Paper, server Sáng Tạo lọc đồ tự chế (chỉ số, phù phép vượt cấp, trứng có dữ liệu, thuốc tự chế, đồ > 8 KB → đổi bản trơn, ghi log). Không ai là OP (admin dùng LuckPerms nhóm admin). WEB: đăng nhập chỉ bằng mã /web (6 số SecureRandom, 1 lần, 5 phút), sai 5 lần/tên hoặc 20 lần/IP trong 15 phút thì khoá 15 phút, IP thật lấy từ CF-Connecting-IP (trước 19/10 mọi người chung IP 172.20.0.1); mọi thao tác lấy tên từ phiên phía server, giá donate do server tính, CSRF chặn bằng Origin/Sec-Fetch-Site, cookie HttpOnly + SameSite, panel chỉ qua Trạm 6 (đăng nhập) + Basic auth, /quantri kiểm quyền LuckPerms từng lần. Mật khẩu .env 32–64 ký tự, chưa từng commit. KHI BỊ TẤN CÔNG: bot dồn vào → /sonar verbose, xem docker logs duckymomo-proxy-1; dò mật khẩu 1 tài khoản → /authme password <tên> <mk mới> rồi báo chủ tài khoản; nghi tài khoản bị chiếm → /co lookup u:<tên> t:1d, /lp user <tên> parent info, /ban; web bị spam đăng nhập → xem data/panel/web-thaotac.jsonl (cột ip). Xem thêm docs/HANDOFF.md mục rà bảo mật 19/10"]
  - title: Người chơi mới cần biết
    items:
      - ["Đăng ký / đăng nhập", "Lần đầu: /register <mật khẩu> <mật khẩu> · lần sau: /login <mật khẩu>"]
      - ["Chọn chế độ", "Bấm la bàn ở sảnh hoặc /menu (điện thoại: hiện bảng nút bấm)"]
      - ["Cẩm nang trong game", "/huongdan — sửa nội dung: modes/_network/huongdan.yml rồi ./ops/huongdan.sh (có hiệu lực ngay)"]
      - ["Bang Hội Chiến", "/warp để đi các địa danh · /tpr <khu> tìm đất hoang · /t new <tên> lập thị trấn (cần 3 giờ chơi thật, 500 xu) · /jobs xem nghề · /sell hand bán đồ · /ah chợ (chỉ trong đất hoà bình) · /trade <tên> đổi đồ an toàn"]
      - ["Không thích đánh nhau", "Vào thị trấn trong Liên minh Hoà Bình (/hoabinh): không bị vây, không PvP; đổi lại không đánh trận. Thị trưởng hoà bình bầu Hội đồng (/hoidong), dân lập Thương Hội / Tổ chức Sự kiện (/tochuc)"]
      - ["Mỗi ngày nên làm", "/diemdanh (xu + quà mốc 7/14/30 ngày) · /nhiemvu (3 nhiệm vụ) · /vongquay (vé mỗi 60 phút chơi thật) · /vote (100 xu/lượt)"]
      - ["Lên cấp, kỹ năng, cốt truyện", "/capdo (thăng cấp, đổi đặc quyền /craft /anvil…) · /skills (6 kỹ năng nghề, tối đa cấp 20) · tìm Già Làng ở spawn (chương 1) · /lukhach · /dungeon · /thanhtich"]
      - ["Lưu ý quan trọng", "Thoát game lúc giao tranh = chết rơi đồ · đồ dưới đất dọn mỗi 10 phút · hết quỹ thị trấn thì tan · tối đa 2 tài khoản (khai /taikhoanphu) · /choilai mất hết (phải dỡ shop, rút /ah trước) · đừng đưa mã /web cho ai"]
      - ["Rank donate", "/rank xem các bậc, giá, cách mua (chỉ trang trí, không mua được lợi thế). /rank mua hiện QR trên bản đồ trong tay"]
  - title: Địa chỉ vào server
    items:
      - ["Máy tính (Java)", "mc.goc6.io.vn (không cần cổng) — bản 1.13 tới mới nhất"]
      - ["Điện thoại (Bedrock)", "mc.goc6.io.vn cổng 19132 (mặc định)"]
      - ["playit (đã bỏ 19/10)", "Chủ server bỏ playit: mọi người vào qua cổng VPS (giữ IP thật). Container playit + playit-watchdog đã xoá, tunnel/compose.yaml đã gỡ. Muốn dùng lại: lấy tunnel/ từ git (trước commit bỏ playit) và TẮT phiên đăng nhập AuthMe (playit làm mọi người chung 1 IP)."]

plugins:
  # ---------------------------------------------------------------- Đăng nhập & kết nối
  - name: Velocity (proxy)
    jar: "-"
    kind: Đăng nhập & kết nối
    purpose: Cổng vào chung của cả network, chuyển người chơi giữa lobby, Bang Hội Chiến, practice. Không phải plugin, là phần mềm proxy.
    player:
      - ["/server <tên>", "Chuyển sang server khác (lobby, banghoi-1, practice-1)"]
    admin:
      - ["/glist", "Ai đang ở server nào"]
      - ["/send <tên> <server>", "Đưa người chơi sang server khác"]
    settings: "proxy/config/velocity.toml"
  - name: AuthMe
    jar: AuthMe
    kind: Đăng nhập & kết nối
    purpose: Đăng ký / đăng nhập bằng mật khẩu (server chạy offline mode). Chưa đăng nhập thì không rời sảnh được. Người chơi Bedrock tự đăng nhập.
    player:
      - ["/register <mk> <mk>", "Đăng ký lần đầu"]
      - ["/login <mk>", "Đăng nhập"]
      - ["/changepassword <mk cũ> <mk mới>", "Đổi mật khẩu"]
      - ["/logout", "Đăng xuất"]
    admin:
      - ["/authme unregister <tên>", "Xoá đăng ký (người chơi quên mật khẩu)"]
      - ["/authme password <tên> <mk>", "Đặt lại mật khẩu cho người chơi"]
      - ["/authme reload", "Nạp lại cấu hình"]
    settings: "lobby/plugins/AuthMe/config.yml"
    notes: "19/10: TẮT phiên tự đăng nhập (chung IP 4G/quán net → người khác gõ đúng tên là vào), sai 3 lần phải /captcha <mã>, sai 10 lần cấm IP 30 phút, cấm mật khẩu dễ (123456, matkhau…, danh sách unsafePasswords). Người chơi quên mật khẩu: /authme password <tên> <mk mới>. Lưu ý: protectInventory (ẩn túi đồ trước khi đăng nhập) đang tự tắt vì sảnh chưa có PacketEvents — sảnh không có đồ giá trị nên chấp nhận"
  - name: Geyser + Floodgate
    jar: floodgate
    kind: Đăng nhập & kết nối
    purpose: Cho người chơi Bedrock (điện thoại, console) vào server Java. Floodgate ở các server con để nhận ra người Bedrock (menu nút bấm, chống hack).
    player:
      - ["(không cần lệnh)", "Điện thoại vào địa chỉ Bedrock ở trên; tên có dấu chấm đầu, ví dụ .griim7833"]
    admin:
      - ["/geyser reload", "Nạp lại Geyser (trên proxy)"]
    settings: "proxy/plugins/Geyser-Velocity, */plugins/floodgate/config.yml"
    notes: "NetherNet (bật 19/10, BẮT BUỘC từ Bedrock 26.60 ngày 27/10/2026, RakNet bị bỏ): Geyser transport both, webrtc-port 19133 (UDP), signaling builtin TCP 19132, advertise-addresses = IP VPS 125.212.218.74 (đổi VPS thì sửa ở proxy/plugins/Geyser-Velocity/config.yml rồi tạo lại proxy + relay). VPS mở bằng ./ops/nethernet.sh vps. Người chơi vẫn nhập mc.goc6.io.vn cổng 19132; lần đầu hiện hỏi tin tưởng máy chủ (chưa có HTTPS). Lỗi điện thoại không vào được: xem docker logs duckymomo-proxy-1 | grep -i -E 'nethernet|webrtc|signal', kiểm VPS iptables -t nat -S MC_RELAY và relay ip rule (pref 304, 305)"
  - name: SkinsRestorer
    jar: SkinsRestorer
    kind: Đăng nhập & kết nối
    purpose: "Hiện skin cho người chơi offline mode (tự lấy skin theo tên tài khoản Mojang; trùng tên người khác thì mặc skin người đó, đổi bằng /skin). Menu /skins: 93 skin gợi ý + skin riêng của server. Skin theo rank (18/10): perSkinPermissions BẬT (proxy/config/plugins/skinsrestorer/config.yml, đã đồng ý luật: chỉ bán skin server tự làm, không bắt trả tiền để dùng skin của chính mình). Nhóm default có skinsrestorer.skin.* + skinsrestorer.ownskin (mọi skin thường miễn phí); skin độc quyền: CÁCH NHANH trong game: /rank skin them <bậc> <tên> <link .png> (sửa LuckPerms ngay: default false, bậc đó true, bậc cao kế thừa) rồi bấm nút [Bấm để tạo skin] (chạy /sr createcustom ở proxy); bỏ khoá: /rank skin xoa <tên>; xem: /rank skin. Hoặc Cài đặt › Rank donate › Bậc N: skin độc quyền (donate-ranks.tiers[].skins), sảnh (skin-sync: true) đồng bộ lúc khởi động. /rank đọc danh sách thẳng từ LuckPerms. Người thiếu bậc thấy ô khoá trong /skins. Đổi skin chờ 30 giây (skinsrestorer.bypasscooldown để bỏ)."
    player:
      - ["/skin set <tên Mojang>", "Đổi skin theo tên"]
      - ["/skin clear", "Bỏ skin"]
      - ["/skins", "Mở kho skin (menu chọn skin)"]
      - ["/skin url <link .png>", "Đổi skin bằng ảnh (minecraftskins.com, namemc.com, planetminecraft.com, novaskin.me)"]
      - ["/skin update", "Lấy lại skin mới nhất của tài khoản Mojang (sau khi đổi trên minecraft.net)"]
    admin:
      - ["/sr reload", "Nạp lại"]
      - ["/sr createcustom <tên> <link .png>", "Tạo skin riêng của server (hiện ở mục custom của /skins); gán cho rank ở Cài đặt › Rank donate"]
    notes: "Cài ở proxy VÀ mọi server con (cùng bản 15.12.6, link ghim trong PLUGINS của từng compose). Thiếu ở server con thì /skins chỉ báo 'Opening the skins menu' mà không mở menu (menu là kho đồ, chỉ server con mở được). Server con tự nhận chế độ proxy (proxyMode AUTO)."
  - name: Sonar (chống bot)
    jar: Sonar
    kind: Đăng nhập & kết nối
    purpose: Chống nhồi bot ở proxy. Xếp hàng người mới vào, tối đa 20 người/IP; khi phát hiện người mới vào dồn dập (bị tấn công) thì bắt người mới qua bài kiểm tra rơi/va chạm (đạt thì bị kick 1 lần, vào lại là xong). Bedrock không bị kiểm tra. Không chặn được DDoS làm nghẽn mạng (cần giấu IP nhà bằng playit hoặc VPS).
    admin:
      - ["/sonar stats", "Số người đang chờ, đã xác minh, bị chặn"]
      - ["/sonar verbose", "Bật/tắt dòng theo dõi tấn công trên thanh hành động"]
      - ["/sonar notify", "Bật/tắt thông báo khi bị tấn công"]
      - ["/sonar blacklist remove <IP>", "Gỡ chặn IP bị nhầm"]
      - ["/sonar verified remove <IP>", "Bắt một IP kiểm tra lại"]
      - ["/sonar reload", "Nạp lại cấu hình"]
    settings: proxy/plugins/sonar/config.yml (chép vào data/proxy khi proxy khởi động lại)
    notes: "Lệnh /sonar gõ ở console proxy (proxy chưa có LuckPerms nên trong game chưa ai có quyền sonar.*). Danh sách đã xác minh lưu trong RAM, khởi động lại proxy thì mất (không sao vì chỉ kiểm tra khi bị tấn công)."
  - name: ViaVersion + ViaBackwards + ViaRewind
    jar: ViaVersion
    kind: Đăng nhập & kết nối
    purpose: Cho client nhiều phiên bản vào (1.13 tới mới nhất). Bản 1.12 trở xuống bị proxy chặn (đã chốt).
    admin:
      - ["/viaver list", "Ai đang dùng phiên bản nào"]

  # ---------------------------------------------------------------- Quản lý
  - name: LuckPerms
    jar: LuckPerms
    kind: Quản lý
    purpose: "Quyền và nhóm (role, rank donate), dùng chung toàn network (lưu MariaDB, đồng bộ Redis). Cài cả ở PROXY (18/10, LuckPerms-Velocity 5.5.71, proxy/config/plugins/luckperms/config.yml, server context \"proxy\") để plugin proxy (SkinsRestorer) đọc quyền rank. LƯU Ý mc-proxy: thêm plugin vào PLUGINS hoặc thêm biến CFG_ thì phải \"docker compose up -d proxy\" (restart không nhận biến mới); file trong proxy/config có ${CFG_...} chỉ được điền khi chép sang data/proxy, mà file đích đã có và mới hơn thì KHÔNG chép lại → lỡ chép thiếu biến thì xoá file trong data/proxy/plugins/... rồi up -d --force-recreate proxy."
    admin:
      - ["/lp user <tên> info", "Xem nhóm, quyền của người chơi"]
      - ["/lp user <tên> parent add <nhóm>", "Thêm vào nhóm (helper, mod, admin, builder)"]
      - ["/lp user <tên> parent remove <nhóm>", "Bỏ khỏi nhóm"]
      - ["/lp user <tên> promote staff", "Thăng chức Helper → Mod → Admin"]
      - ["/lp user <tên> demote staff", "Giáng chức"]
      - ["/lp editor", "Mở trình sửa quyền trên web"]
    settings: "Rank donate: dùng /rank (DuckyMoMoCore), không cấp tay bằng lp. Danh sách quyền rank: tools/donate-ranks.cmds"
    notes: "Role: Dân (mặc định), Builder, Helper, Mod, Admin. Rank donate: 5 tước vị, track donate."
  - name: DuckyMoMoCore
    jar: DuckyMoMoCore
    kind: Quản lý
    purpose: "Plugin riêng của DuckyMoMo: menu chọn chế độ, rank donate, thông báo vào/ra, lọc chat, chat có prefix ở sảnh, rơi khỏi đảo về spawn, dọn rác, dịch chuyển ngẫu nhiên /tpr (NPC ở spawn), luật chiến tranh (PvP đất hoang bật/tắt, giờ chơi thật tối thiểu để được phong quân hàm, tài khoản phụ), giờ chơi thật, luật đất đai Towny (lập thị trấn/quốc gia, vòng spawn, chờ đổi thị trấn, đất theo dân hoạt động, quốc gia cần 2 thị trấn mới cắm cờ), chơi lại /choilai, Hội đồng Hoà Bình, tổ chức và giấy phép, Hội Bàn Tròn và án, bảng xếp hạng và danh hiệu, cửa hàng trang trí, Liên minh Hoà Bình (/hoabinh: đất lan liền kề, giá tăng dần, phí bảo hộ, /ah chỉ trong đất hoà bình, /sell ở kinh đô +20%, shop rương miễn thuế, báo vây thành cho dân hoà bình, vùng vây trên bản đồ web), chống đặt-phá lấy tiền nghề, ranh giới thị trấn trên bản đồ web, menu nút bấm cho Bedrock."
    player:
      - ["/menu", "Mở menu chọn chế độ (ở sảnh)"]
      - ["/huongdan [chương] · /hd", "Cẩm nang trong game (sách; điện thoại: bảng nút). Chương: batdau, luat, banghoi, thitran, congthanh, kinhte, khampha, pet, hangngay, practice, hotro. Vd: /hd pet (máy tính: báo số trang của chương)"]
      - ["/rank", "Xem các bậc rank donate, giá, rank của mình"]
      - ["/web · /dangnhapweb", "Lấy mã 6 số đăng nhập trang web (dùng 1 lần, hết hạn 5 phút). Đây là cách đăng nhập web duy nhất, không có mật khẩu web"]
      - ["/hoatdong · /giochoi", "Bang Hội Chiến: xem giờ chơi thật (không tính AFK) và có phải dân hoạt động không"]
      - ["/taikhoanphu khai <chính> · xacnhan <phụ>", "Bang Hội Chiến: tự khai tài khoản phụ (tối đa 2 tài khoản/người); tài khoản phụ không nhận quân hàm, không đánh trận"]
      - ["/choilai · /choilai xacnhan", "Bang Hội Chiến: chơi lại từ đầu (mất đồ, tiền, nhà, nghề, thị trấn; giữ rank, danh hiệu, án). 7 ngày/lần, 3 lần/mùa, quà tân thủ chỉ lần đầu. Phải dỡ shop rương, rút hàng /ah trước"]
      - ["/hoabinh · vao · roi · danhsach", "Bang Hội Chiến: Liên minh Hoà Bình (thị trưởng đưa thị trấn vào/ra; vào chờ 2 ngày mới hoà bình, rời 14 ngày mới vào lại; thị trấn phải chạm đất liên minh)"]
      - ["/hoidong · ungcu · bau <tên> · phieu <mã> co|khong · baimien · deuoi <thị trấn> <lý do>", "Hội đồng Hoà Bình: dân hoà bình ứng cử, thị trưởng (thị trấn >= 3 dân hoạt động) bầu đại diện và bỏ phiếu kiến nghị"]
      - ["/tochuc lap thuonghoi|sukien <tên> · moi · vao · roi · gop <tiền> · xinphep · danhsach", "Tổ chức của dân hoà bình; đủ 3 người xin giấy phép, Hội đồng Hoà Bình duyệt, phí 100 xu/tuần từ quỹ"]
