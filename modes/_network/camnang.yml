      - ["/pet summon target <tên> <loài>", "Gọi pet cho người chơi (thử pet)"]
      - ["/pet reload config", "Nạp lại config"]
    notes: "Config: Simpler-Pet-GUI-Command: true (gõ /pet là mở menu; mặc định plugin phải gõ /pet gui). /pets là alias trong commands.yml của server, có hiệu lực sau khi khởi động lại."
    player:
      - ["/pet (hoặc /pets)", "Mở menu pet"]
      - ["/pet summon <loài>", "Gọi pet thẳng, vd /pet summon cat (wolf, parrot, fox, axolotl, panda...)"]
      - ["/pet remove · /pet rename <loài> <tên>", "Cất pet / đặt tên pet"]

  # ---------------------------------------------------------------- Bản đồ & thế giới
  - name: Simple Voice Chat
    jar: voicechat
    kind: Chat & hiển thị
    purpose: "CHƯA BẬT (16/10: plugin đã cài ở 3 server, còn thiếu jar ở proxy và cổng UDP trên VPS, xem HANDOFF mục 17). Nói chuyện bằng giọng theo khoảng cách (nói thường 40 block, thì thầm 20) và nhóm (nghe nhau ở mọi nơi). CHỈ người chơi Java có cài mod Simple Voice Chat; Bedrock (điện thoại) chưa dùng được. Cài ở lobby, banghoi-1, practice-1 + proxy Velocity (một cổng UDP 24454 qua VPS)."
    player:
      - ["Cài mod", "Fabric/Forge/NeoForge + mod Simple Voice Chat (modrinth.com/plugin/simple-voice-chat) đúng phiên bản game"]
      - ["Phím V", "Mở menu voice (âm lượng, micro, tắt tiếng từng người)"]
      - ["Caps Lock (giữ)", "Bấm để nói (mặc định). Đổi sang tự nói khi có tiếng trong cài đặt voice"]
      - ["Phím G · /voicechat join <nhóm>", "Tạo / vào nhóm (có thể đặt mật khẩu)"]
      - ["/voicechat invite <người>", "Mời vào nhóm"]
      - ["/voicechat leave", "Rời nhóm"]
    admin:
      - ["/voicechat test <người>", "Kiểm tra kết nối voice của người đó"]
      - ["/lp user <tên> permission set voicechat.speak false", "Cấm nói voice (gỡ: permission unset)"]
    settings: "plugins/voicechat/voicechat-server.properties ở lobby/, modes/banghoi/server/, modes/practice/server/ (khoảng cách, nhóm); proxy/plugins/voicechat/voicechat-proxy.properties (cổng 24454). Jar proxy: ./ops/voicechat.sh"
    notes: "Voice không ghi âm được (allow_recording=false) nên chửi bới qua voice không có bằng chứng: xử lý theo báo cáo, cấm nói bằng quyền voicechat.speak. Đường dự phòng playit không có voice. Mỗi người đang nói tốn ~3–6 KB/s cho mỗi người nghe (ước tính)."
  - name: EvenMoreFish
    jar: even-more-fish
    kind: Bản đồ & thế giới
    purpose: "Câu cá kiểu mới (Bang Hội Chiến): 24 loại cá Việt có độ dài, 4 độ hiếm, cá theo mùa mưa/khô (DuckyMoMoCore /mua), nhật ký cá, bán cá, mồi câu, thi câu cuối tuần. Không cần resource pack, Bedrock chơi được."
    player:
      - ["/emf · /cauca", "Menu câu cá"]
      - ["/emf journal", "Nhật ký: đã câu được những loại nào"]
      - ["/emf shop · /emf sellall", "Bán cá lấy xu (giá = dài x hệ số độ hiếm)"]
      - ["/emf applybaits", "Gắn mồi vào cần câu đang cầm"]
      - ["/emf top", "Bảng xếp hạng cuộc thi câu đang diễn ra"]
      - ["/emf next", "Bao giờ có thi câu tiếp"]
      - ["/emf toggle", "Tắt/bật cá tuỳ chỉnh cho riêng mình"]
    admin:
      - ["/emfa competition start thiCauCuoiTuan <giây>", "Mở thi câu ngay (thời lượng tính bằng giây, vd 1200 = 20 phút)"]
      - ["/emfa competition end", "Kết thúc thi câu"]
      - ["/emfa fish <độ hiếm> <cá> [người]", "Lấy cá (vd /emfa fish Legendary CaAnhVu)"]
      - ["/emfa bait <mồi> [số] [người]", "Lấy mồi (giunDat, tomSong)"]
      - ["/emfa reload", "Nạp lại sau khi sửa file"]
    settings: "File modes/banghoi/server/plugins/EvenMoreFish/: rarities/*.yml (cá, độ hiếm, mùa), competitions/thicau.yml (thi câu), baits/ (mồi), config.yml"
    notes: "Cá có mùa dùng requirements.placeholder \"%dmmmua_id% == mua|kho\" (cần PlaceholderAPI + DuckyMoMoCore). Tên cá (id) chỉ chữ không dấu; tên hiện là displayname. Giữ đồ kho báu gốc (only-fish: true) để sách Enchantio vẫn câu ra được."
