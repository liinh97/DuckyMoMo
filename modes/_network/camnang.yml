  - name: EliteMobs
    jar: EliteMobs
    kind: Boss & Dungeon
    purpose: "Nội dung PvE (cài 14/10): dungeon cày đồ, cày tiền; boss tuỳ chỉnh; sự kiện boss (dự kiến chuỗi 'Trái Đất lâm nguy': các bang hội chung tay đánh boss ở nhiều bối cảnh). Quái elite tự sinh ngoài thế giới: TẮT (không lệch cán cân chiến tranh). Tiền rơi dùng xu chung của server, hệ số 0,3. Dungeon tải trong game bằng /em setup (đã đăng nhập Nightbreak; ô vàng = tải được hoặc bấm để kiểm tra quyền, ô tím = phải mua). Đã cài 18/10 (11 gói miễn phí): Adventurers Guild Hub, Story Mode Chapter One (10 tầng), Dark Cathedral, Sewers, North Pole, Knight's Castle, Steamworks, Fireworks, Hallosseum, Binder of Worlds, Free Enchantment Challenges. KHÔNG cài: Free Goblins Events Pack (yêu tinh khắp server, ngược preset), Primis/Oasis (phải mua), các gói tím. Bản 10.9.10 (18/10; itzg không tự nâng vì tên file EliteMobs.jar không đổi: nâng tay bằng jar Modrinth, kiểm tra lại các chỗ Cổng Dungeon đọc bằng reflection trước khi thay). Preset Content-Only (18/10): không quái elite tự sinh, giữ dungeon + cấp/kỹ năng. Ngôn ngữ: tiếng Việt (/em language vietnamese, 18/10: 35.303 dòng, 50 dòng chưa dịch; file plugins/EliteMobs/translations/vietnamese.csv). CẦN THỬ: kỹ năng class đang dùng được ngoài dungeon (AdvancedCombatSystem allowClassAbilitiesOutsideEliteMobsWorlds: true) và lượng xu rơi. Đồ rơi: mỗi trùm uniqueLootList (chance 1.0 = 100%) trong plugins/EliteMobs/custombosses/<dungeon>/; đồ ngẫu nhiên ItemSettings flatDropRateV3 0.2; khoá nhận đồ mỗi trùm 3 ngày. Muốn rơi/đổi đồ EliteMobs bằng quà của server: cầm món đó, /dmm luudo <mã> (thư viện đồ). Lối vào dungeon bị khoá theo Cổng Dungeon (/dungeon)."
    player:
      - ["/em", "Menu EliteMobs: cấp kỹ năng, đồ, nhiệm vụ. Vào dungeon: qua /dungeon (menu /em báo không có quyền nếu chưa qua cổng)"]
      - ["Đánh boss", "Chia thưởng theo sát thương mỗi người gây ra"]
    admin:
      - ["/em setup", "Tải/cập nhật dungeon, sự kiện, gói đồ (đã đăng nhập Nightbreak). Đừng bấm Download/Update Everything (kéo cả Goblins Events + cập nhật plugin)"]
      - ["/em reload", "Nạp lại cấu hình (trang Cài đặt tự gọi)"]
    settings: "Trang Cài đặt: Bang Hội Chiến > Thế giới > Boss & Dungeon (EliteMobs). File: plugins/EliteMobs/"
    notes: "Cần FreeMinecraftModels cho gậy phép và lớp pháp sư (tuỳ chọn, chưa cài). Không cài ResourcePackManager để khỏi đụng gói font tiếng Việt."
  - name: AuraSkills (kỹ năng nghề)
    jar: AuraSkills
    kind: Kinh tế & buôn bán
    purpose: "Kỹ năng nghề ở «mức cơ bản» (cài 19/10, bản 2.4.0 ghim, GPL): làm việc nào lên cấp kỹ năng đó. Bật 6 kỹ năng: Trồng trọt, Đốn gỗ, Đào mỏ, Câu cá, Đào đất, Pha chế; trần 20. Khả năng nội tại tối đa bậc 4 (rơi thêm đồ tối đa 8 may mắn, +20% kinh nghiệm kỹ năng, cây lớn nhanh quanh mình, thuốc kéo dài, no lâu). Khả năng mana bậc 1, mở ở cấp 10, hiệu lực 5 giây, hồi chiêu 300 giây: Đào nhanh (cuốc), Đốn cả cây (rìu), Xúc đất (xẻng), Tự gieo (cuốc đất) — chuột phải cầm công cụ rồi đào. Chỉ số chiến đấu: cả 6 kỹ năng max = +1 tim, +2% sát thương. Mốc 5/10/15/20 thưởng 200/400/700/1200 xu mỗi kỹ năng. Làm lại mỗi mùa (DuckyMoMoCore SkillSeason). Chạy song song uJobs (uJobs ra tiền, AuraSkills ra cấp + khả năng)."
    player:
      - ["/skills", "Menu kỹ năng: cấp, kinh nghiệm, khả năng, mốc thưởng (/sk)"]
      - ["/skills top", "Bảng xếp hạng kỹ năng (/skilltop)"]
      - ["/skills rank", "Hạng của mình (/skillrank)"]
      - ["/stats", "Chỉ số của mình (máu, sức mạnh, may mắn, thông thái)"]
      - ["/skills toggle", "Bật/tắt thanh kinh nghiệm trên màn hình (/abtoggle)"]
      - ["/mining, /farming, /foraging, /fishing, /excavation, /alchemy", "Mở thẳng trang của một kỹ năng"]
    admin:
      - ["/skills reload", "Nạp lại cấu hình (trang Cài đặt tự gọi)"]
      - ["/skills skill setlevel <tên> <kỹ năng> <cấp>", "Đặt cấp (vd auraskills/mining hoặc mining)"]
      - ["/skills skill reset <tên> [kỹ năng]", "Xoá cấp (người đang online); mùa mới DuckyMoMoCore tự làm lúc người chơi vào game"]
      - ["/skills xp add <tên> <kỹ năng> <số>", "Cộng kinh nghiệm kỹ năng"]
    settings: "Trang Cài đặt: Bang Hội Chiến > Nghề > Kỹ năng nghề (trần cấp, khả năng mana, rơi thêm đồ, thưởng xu mốc, làm lại mỗi mùa). File: plugins/AuraSkills/ (repo: modes/banghoi/server/plugins/AuraSkills/)."
    notes: "Chỉ ở Bang Hội Chiến. ĐÃ TẮT: kỹ năng Chiến đấu/Bắn cung/Phòng thủ/Nhanh nhẹn/Phù phép, khả năng đánh nhau, chí mạng, chỉ số hồi máu/giảm sát thương/tốc độ, bảng đồ rơi riêng (EvenMoreFish + kho báu lo), ra tiền theo kinh nghiệm. Đấu Trường (dautruong) tắt hẳn AuraSkills; Thái Ấp và vùng spawn không cộng kinh nghiệm; chống AFK + chống đặt-phá bật. Không bán tăng tốc cày cho rank donate. Lưu: plugins/AuraSkills/userdata/<uuid>.yml (web đọc)."
  - name: BetonQuest (cốt truyện)
    jar: BetonQuest
    kind: Boss & Dungeon
    purpose: "Cốt truyện có NPC biết nói chuyện (cài 19/10, bản 3.2.0 ghim, GPL): bảng hội thoại bấm chọn câu trả lời, nhiệm vụ nhiều bước, nhật ký. Chương 1 «Điềm Báo» (gói cotruyen/chuong1): Già Làng kể chuyện sao rơi → hạ 20 quái → mang 16 thỏi sắt cho Bác Thợ Rèn → đào 24 quặng ra Mảnh Sao Rơi → đưa Người Gác Cổng (dẫn tới /dungeon, /conghoang) → về Già Làng kết chương (thưởng xu + kinh nghiệm, báo cả server). Mỗi người làm 1 lần. Ý tưởng cho chương sau: chuỗi 'Trái Đất lâm nguy'."
    player:
      - ["Chuột phải NPC", "Mở hội thoại, bấm chọn câu trả lời"]
      - ["/journal", "Nhật ký nhiệm vụ (sách, gõ /bj cũng được)"]
      - ["/backpack", "Balô nhiệm vụ: đồ nhiệm vụ (Mảnh Sao Rơi, nhật ký) lỡ vứt thì nằm ở đây"]
    admin:
      - ["/bq reload", "Nạp lại nhiệm vụ sau khi sửa file (trang Cài đặt tự gọi)"]
      - ["/bq tag <tên> list", "Xem người chơi đang ở bước nào (tag cotruyen>c1_b1 … cotruyen>c1_xong; lữ khách: cotruyen>lk_<mã>_nghe|qua|xong)"]
      - ["/bq tag <tên> del <tag>", "Xoá một bước (cho làm lại). Tag phải ghi kèm tên gói: cotruyen>c1_b1. Mục tiêu đang chạy: /bq objective <tên> del cotruyen>c1_sanquai"]
      - ["/bq objective <tên> list", "Xem mục tiêu đang chạy của người chơi"]
    settings: "Trang Cài đặt: Bang Hội Chiến > Cốt truyện (kiểu bảng hội thoại, số lượng, thưởng). Lời thoại: plugins/BetonQuest/QuestPackages/cotruyen/ (repo: modes/banghoi/server/plugins/BetonQuest/QuestPackages/cotruyen/)"
    notes: "Chỉ ở Bang Hội Chiến. NPC là Citizens, tìm theo TÊN (byName): đặt đúng tên Già Làng / Bác Thợ Rèn / Người Gác Cổng. Tự cập nhật của plugin đã tắt (itzg ghim bản). Kiểu bảng 'dialog' cần Java 1.21.6+; Bedrock qua Geyser hiện thành form: lỗi thì đổi sang 'Rương bấm chọn' trên Cài đặt."
