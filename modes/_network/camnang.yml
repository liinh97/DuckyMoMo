# Cẩm nang sử dụng: trang Cài đặt > "Cẩm nang" (panel đọc file này mỗi lần mở, không cần build lại).
# Mỗi plugin:
#   name      tên hiển thị
#   jar       đoạn đầu tên file .jar trong data/<server>/plugins (để trang tự đánh dấu đang cài ở server nào)
#   kind      loại (nhóm trên trang): Đăng nhập & kết nối, Quản lý, Chat & hiển thị, Kinh tế & buôn bán, Thị trấn & chiến tranh,
#             PvP & chống hack, Rank donate, Bản đồ & thế giới, Practice, Hệ thống
#   purpose   dùng để làm gì
#   player    lệnh cho người chơi: [lệnh, ý nghĩa]
#   admin     lệnh cho admin/mod: [lệnh, ý nghĩa]
#   settings  chỉnh ở đâu (trang Cài đặt / file)
#   notes     lưu ý
# Thêm plugin mới: thêm một mục ở đây. Plugin đang cài mà chưa có mục sẽ hiện ở cuối trang "Chưa có trong cẩm nang".

guide:
  - title: Việc admin hay làm
    items:
      - ["Thợ Rèn /thoren (set đồ trao đổi)", "ThoRen.java, config tho-ren (Cài đặt › Shop › Thợ Rèn). 7 set: chuỗi chính (23/10, thang 7 bậc của chủ server, bậc 5–7 Huyền Thoại/Thần Thoại/Thần Thánh từ boss làm sau) Tân Thủ (+0..+9) → Chiến Binh (cb_*, +0..+7, requires tanthu) → Tinh Anh (ta_*, +0..+5, requires chienbinh) → Cao Cấp (cc_*, +0..+5, requires tinhanh); mỗi món có an = mảnh ấn (cb/ta/cc_an_khoi: mũ+giày, _than: giáp+quần, _binh: kiếm; khoá \"an\" trong cost); mảnh ấn rơi trong dungeon theo tho-ren.dungeon-drops (tầng 1–3 Chiến Ấn, 4–6 Linh Ấn, 7–10 Kim Ấn, dungeon khác theo cấp; mọi con chỉ có tỉ lệ (quái thường 3%, phó trùm 〖〗 15%, trùm 『』 30%, không con nào chắc chắn), vào thẳng túi người hạ; DungeonGate.dungeonOf), set nghề +0..+4 Thợ Mỏ (tm_*, cúp), Ngư Phủ (np_*, cần câu; Vảy Cá Hiếm vaycahiem rơi khi câu cá tho-ren.fish-drop.chance %), Du Hiệp (dh_*, cung; cung KHÔNG gắn phù phép riêng chuột phải vì chuột phải = kéo cung). Mỗi món tag bộ (bo) = tên set + \"Đồ set\". QUẦY ĐỔI (config tho-ren.quay, NPC: /dmm thorennpc <khoang|sanquai|nguong|kimhoan|thoren|ren_tanthu|ren_chienbinh|ren_tinhanh|ren_caocap|ren_huyenthoai|ren_thanthoai|ren_thanthanh|ren_ulinh|ren_nonggia|ren_thosan|ren_thomo|ren_nguphu|ren_duhiep|laonong> (ren_*: NPC riêng mở thẳng 1 set, open \"set:<mã>\") NPC là người (Citizens, tho-ren.npc-type: citizens; skin: tho-ren.quay.<quầy>.skin = tên người chơi bản quyền, đổi xong /dmm reload hoặc khởi động lại là áp; ID lưu thoren-npc.yml) đứng trong quầy, /dmm thorennpc remove [quầy]): đồ thô -> mảnh (Lão Khoáng, Lão Săn Quái, Ngư Ông) -> tinh thể (Thợ Kim Hoàn, có phí xu) -> set (Thợ Rèn). 13 mảnh + 6 tinh thể trong Thư viện (bộ \"Nguyên liệu Thợ Rèn\", glint); mọi món là out của quầy bị chặn đặt / chế tạo / rèn smithing / nung / đốt / chuột phải. Đổi một chiều. Set Tân Thủ: mũ/áo/quần/giày/kiếm +0..+9, mỗi cấp một món Thư viện đồ (tt_mu_0.., áo giữ mã cũ giap, giap_tan_thu_1.., giap_tan_thu = +4). Rèn +0 bằng nguyên liệu; nâng +N cần món cùng set +N-1 (bị lấy, đồ mới thế đúng ô đang mặc) + cost[N] (xu, mã thư viện, vật liệu game trơn); KHÔNG thất bại (chủ server chốt 23/10). wear[cấp] = % lần trừ độ bền được tính (cấp cao mòn chậm). bonus: mặc >= N món giáp cấp >= from -> % máu, % kháng đẩy lùi, % giảm sát thương (mức cao nhất mỗi set, cộng các set). Lõi Quái (loiquai): quái EliteMobs rơi tinh-luyen.loi-quai.elite-chance %, cả quái dungeon. Thêm set: thêm món vào Thư viện + khai báo tho-ren.sets.<mã>. 23/10 chiều: Huyền Thoại (ht_*, +0..+3, Huyền Ấn rare trong dungeon-drops), Thần Thoại (mt_*, +0..+4, Thần Ấn mt_an_*), Thần Thánh (dv_*, +0..+3, Thánh Ấn dv_an_*): Thần/Thánh Ấn CHƯA rơi ở đâu (chủ server chưa chốt), tinh thể nhat_nguyet / thien_menh ở Kim Hoàn. Set nghề Nông Gia (nn_*, cuốc CE Tiller/Harvester/Planter/GreenThumb; bonus thu-hoach = % gấp đôi nông sản khi phá cây chín, BlockDropItemEvent) + Thợ Săn (ts_*; bonus dem-st = % sát thương lên quái thù địch ban đêm ở thế giới thường); quầy laonong (Lão Nông: bong_lua, cu_qua, mat_ong). Set mùa U Linh (ul_*): tho-ren.sets.<mã>.season {name, from, to (MM-dd), open auto|on|off, boost (x hiệu ứng bộ đúng mùa), damage (% vũ khí set đúng mùa), drop {item, chance} (quái thù địch không từ lồng sinh quái)}; ngoài mùa không rèn được, đồ đã có vẫn dùng. Sinh món: tools/thoren/gen_sets.py + gen_truyen.py."]
      - ["Mô tả đồ dài quá màn hình", "Tooltip do máy người chơi vẽ: server không cuộn / co được, gói tài nguyên (như font) không thêm được chức năng. Chủ server 23/10: giữ mô tả màu mè, bị che cũng được; khuyên người chơi Java cài mod client Scrollable Tooltips (Fabric, modrinth.com/project/mAhc6rKU, có bản 26.1.2 / 26.2, cần Fabric Language Kotlin) để lăn chuột đọc; Bedrock dùng /xemdo (in ra chat). Hướng dẫn cài: sách /huongdan chương Hỗ trợ. Server không ép / kiểm tra mod được."]
      - ["Lệnh admin /dmm", "/dmm = DuckyMoMo (lệnh riêng của plugin DuckyMoMoCore, gõ dài /duckymomo). Gõ /dmm rồi bấm Tab để gợi ý lệnh con, tên phù phép, mã thư viện đồ, tên người chơi; gõ /dmm không kèm gì để xem hướng dẫn"]
      - ["Quyền của role / rank", "Trang Role & rank: chọn role bên trái, bật công tắc quyền (vd Helper: bay; Builder: gamemode). Có thể chọn áp dụng toàn mạng hoặc từng server"]
      - ["Role Builder", "Tạo quyền 1 lần: docker exec -i duckymomo-lobby-1 rcon-cli < tools/builder-role.cmds. Chỉ ở SẢNH: WorldEdit, xây vượt vùng bảo vệ, /gamemode, /tp. Bang Hội Chiến: không WorldEdit, không vượt vùng, không sáng tạo (xây ở sảnh rồi admin dán //schem). Mọi nơi cấm fill/clone/setblock gốc, towny.admin, give/item/eco. Người giữ thêm role cao hơn (vd Manager) thì khoá của role cao hơn thắng"]
      - ["Role Manager (mã quanly, dưới Admin)", "Tạo 1 lần: trang Role > Manager > nút Tạo role + bộ quyền khuyên dùng (hoặc docker exec -i duckymomo-lobby-1 rcon-cli < tools/quanly-role.cmds) (kế thừa Mod; track staff: helper → mod → quanly → admin). Làm hầu hết mọi việc: phạt, CoreProtect rollback, kinh tế (/eco), đồ (/give, /i, đưa đồ thư viện), WorldEdit, fill/clone/setblock, xây vượt vùng bảo vệ, quản trị Towny, sáng tạo, cấp rank donate, web (cài đặt trừ Hệ thống/Chống hack/Role, cấp role tới Mod). CẤM (ghi false): LuckPerms, sửa quyền role, toàn quyền web, /sudo (leo thang quyền), op/deop/stop/reload/whitelist/plugins/execute/gamerule/worldborder/forceload, /dmm reload|decorate|structures (còn lại /dmm dùng được, quyền duckymomo.dmm), xoá log CoreProtect (để mọi thay đổi vẫn tra và khôi phục được)"]
      - ["Cấp role staff", "Người được cấp/gỡ role trên trang Role nhận tin trong game nếu đang online. Bật/tắt quyền của role: mọi người trong role (kể cả role kế thừa) đang online nhận tin; ai vừa MẤT quyền bay/bất tử/tàng hình/tốc độ/đổi chế độ chơi thì panel tắt luôn trạng thái đó (Essentials không tự tắt). Gỡ role cũng vậy. Lệnh Essentials (/fly, /kick, /ban, /tp…) chỉ có ở Bang Hội Chiến và Practice (sảnh không cài Essentials, gõ ở sảnh báo Unknown command). Trang Role & rank: chọn role, gõ tên ở mục Thành viên, hoặc /lp user <tên> parent add helper  (lên tiếp: /lp user <tên> promote staff → mod → admin)"]
      - ["Ủng hộ bằng QR trong game", "/rank mua (hoặc /donate mua): người chơi chọn gói trong menu → QR VietQR hiện trên tấm bản đồ trong tay (10 phút) → bấm [Tôi đã chuyển khoản] trong chat → admin nhận tin như trên web, duyệt ở trang quản trị > Donate. Cần: tài khoản ngân hàng trong site/config/site.yml (donate) + PANEL_SITE_KEY trong .env. Bản đồ QR không vứt/cất rương được, hết hạn tự biến mất"]
      - ["Cấp rank donate", "/rank give <tên> <namtuoc|tutuoc|batuoc|hautuoc|congtuoc> <số tháng>  · xem: /rank check <tên> · gỡ: /rank remove <tên>"]
      - ["Đồ phù phép vượt cấp", "/dmm enchant sharpness 30 (món đang cầm) · /dmm sach sharpness 30 <tên> (tặng sách)"]
      - ["Gói quà /kit (20/10)", "Gói lương thực doan (30/10): 32 bánh mì, mọi người, 1 tiếng nhận 1 lần; nút Gói quà ở /menu › Người chơi. Bang Hội Chiến: module Gói quà (Kits.java, config goi-qua) thay kit Essentials. Sửa trên Cài đặt › Bang Hội Chiến › Người mới › Gói quà: mỗi gói có quà (đồ thường, đồ Thư viện, xu, lệnh), thời gian nhận lại (hoặc một lần), rank được nhận (không chọn = mọi người). Gói «lần đầu» (goi-qua.lan-dau = tinan, Quà tị nạn) tự phát 2 giây sau khi vào lần đầu, tính là đã nhận. 29/10 chủ server: mọi gói nhận lại 3 ngày, mỗi danh phận một gói theo vai, CHỈ đồ tiêu hao (nhận lại vẫn có giá trị; không giường/rương/giáp): tinan (của chủ server: 32 bánh mì, giáp da, rìu + cúp đá), dan (bánh mì, bột xương, hạt lúa, cà rốt, khoai, đuốc), luongdan (bò nướng, than, đuốc, gỗ sồi, bình kinh nghiệm), haokiet (cà rốt vàng, tên, 2 táo vàng, 4 ngọc ender, bình kinh nghiệm), media (bò nướng, pháo hoa, táo vàng, bình kinh nghiệm, đuốc + báo cả server). Người chơi: /kit hoặc /goiqua mở menu. Admin: /goiqua <mã> <tên> phát thẳng, /goiqua lamlai <tên> [mã] xoá lượt đã nhận (để thử lại). Dữ liệu: plugins/DuckyMoMoCore/goiqua.yml. /kit, /kits là tên của Gói quà ở Bang Hội Chiến (có gợi ý Tab); server không bật Gói quà thì plugin trả tên /kit cho plugin khác lúc khởi động (Practice: /kit edit của Duels). Rank ủng hộ chỉ được quà trang trí (luật Mojang)."]
      - ["Reset người chơi (20/10)", "Trang quản trị › Hệ thống › Reset người chơi (Bang Hội Chiến), hoặc console: /choilai admin <tên> [moi] [giurank]. Hai mức: Chơi lại = như /choilai (mất đồ, rương Ender, balo, XP, tiền về khởi đầu, nhà, cấp nghề, thị trấn, giờ chơi; giữ danh phận/rank/danh hiệu/án) nhưng admin làm hộ, không tính lượt, luôn có quà (gói ở ô player-reset.kit), người phải online. Như người mới (moi) = thêm xoá điểm danh, nhiệm vụ, gacha, thành tích, Thăng Cấp, gói quà đã nhận, /caidat, danh phận (giurank: giữ rank ủng hộ/staff/Sứ Giả), AuraSkills, Essentials, file nhân vật; bị đá ra, vào lại tính là lần đầu; offline cũng được. Sao lưu: plugins/DuckyMoMoCore/choilai-backup (7 ngày). Mật khẩu AuthMe giữ nguyên. CHƯA xoá: pet MyPet, cấp nghề uJobs khi offline."]
      - ["/back cho người chơi (20/10)", "Bật/tắt ở Cài đặt › Bang Hội Chiến › Thế giới › Lệnh /back cho người chơi (/back thường và /back về chỗ chết). Plugin đặt essentials.back(.ondeath) cho các nhóm Danh phận, ngữ cảnh banghoi-1; quyền staff đặt riêng thì giữ. Thời gian chờ theo nhóm Dịch chuyển bằng lệnh."]
      - ["Rada người chơi (28/10)", "Thanh định vị của game (chấm chỉ hướng người khác trên thanh kinh nghiệm). PlayRanks.startRadar: chỉ bậc / rank có radar: true trong play-ranks (mặc định Hào Kiệt + helper, mod, quanly, admin; OP luôn thấy) mới thấy, người khác tầm nhận điểm mốc × 0; bot botfarm (IP 10.30.x.x) tầm phát × 0 nên không ai dò ra bot. Modifier tạm, kiểm mỗi 5 giây. Bật/tắt theo bậc: Cài đặt › Người mới › Danh phận (ô \"thấy rada người chơi\"). /danhphan ghi trong Quyền lợi."]
      - ["Định giá xu (21/10)", "Mọi giá quy ra giờ công 1.400 xu (1 giờ chơi chăm, chủ yếu từ /sell). Phí và giá dịch vụ ×3, quà định kỳ và quà một lần ×1,5, tiền nghề theo nghề (Tiều phu ×1, Thợ mỏ ×2, Nông dân/Ngư dân ×3, Thợ săn ×5), Thăng Cấp và Xưởng giữ, Tinh Luyện = 70% giá nguyên liệu. Bảng đầy đủ + máy tính một tuần: docs/dinh-gia-xu.html (artifact SeZHthvXRXHusvgPqknXsh). Script áp dụng tính từ giá gốc nên chạy lại không nhân chồng."]
      - ["Giới hạn bán cho server (21/10)", "Mỗi người bán cho server tối đa 8.000 xu/ngày (mới lại 0 giờ giờ VN): /sell, nút bán ở /cuahang, khung bán ở /warp shop, Rìu Bán của Xưởng, món Tinh Luyện. Vượt thì lần bán bị từ chối (không mất đồ), báo còn bán được bao nhiêu. Bán cho người chơi không tính. Sửa ở Cài đặt › Bang Hội Chiến › Kinh tế. Admin có quyền duckymomo.sell.khonggioihan (op/*) không bị giới hạn: muốn thử phải dùng tài khoản thường. Đã bán hôm nay: data/banghoi-1/plugins/DuckyMoMoCore/banchoserver.yml."]
      - ["Cẩm nang /hd (21/10)", "/hd mở MENU RƯƠNG 18 nhóm (kiểu menu lệnh CherryMC): rê chuột thấy lệnh + mô tả ngắn, bấm mở sách chỉ của chương đó; ô sách = cả cuốn. /hd sach = cả cuốn, /hd <mã chương> = một chương. Bedrock: bảng nút. Sửa nhóm ở modes/_network/huongdan.yml › menu (slot, icon, ten, mo, lenh \"/lệnh|mô tả\", ghi, chuong) rồi ./ops/huongdan.sh; trang Cài đặt › Cẩm nang game chỉ sửa chương (giữ nguyên menu)."]
      - ["Cộng/trừ tiền", "/eco give <tên> <số> · /eco take <tên> <số> · /eco set <tên> <số>  (Bang Hội Chiến)"]
      - ["Phạt", "/mute <tên> <thời gian> · /kick <tên> <lý do> · /tempban <tên> 1d <lý do> · /ban <tên> <lý do> · /unban <tên>"]
      - ["Kiểm tra phá hoại", "/co i (bấm vào block xem ai phá/đặt) · /co rollback u:<tên> t:2h r:30 (khôi phục)"]
      - ["Xem cảnh báo hack", "/grim alerts (bật/tắt) — Mod/Admin tự bật khi vào"]
      - ["Dọn rác ngay", "/dmm clean (Bang Hội Chiến)"]
      - ["Áp dụng lại config DuckyMoMoCore", "/dmm reload — trang Cài đặt tự gọi khi bấm Lưu"]
      - ["Chuyển server", "/server lobby | banghoi-1 | practice-1"]
      - ["Font chữ", "Gói tài nguyên gửi tự động khi vào (không bắt buộc). Mặc định (30/10): font pixel gốc Minecraft đã sửa dấu ngã (tools/fontpack/vn-pixel.py); /caidat bật Font chữ mềm = Be Vietnam Pro. Gửi sớm lúc đang kết nối (proxy, thử 30/10): công tắc \"bat\" trong data/proxy/plugins/duckymomoskin/goi-tai-nguyen.json, sửa xong có hiệu lực ngay. Sửa/làm lại: ./ops/build-font-pack.sh rồi docker compose up -d lobby banghoi-1 practice-1 sangtao-1"]
      - ["Sao lưu ngay", "Mỗi server có dịch vụ sao lưu riêng (restic, chỉ lưu phần thay đổi, mã hoá bằng RESTIC_PASSWORD) mỗi 6 giờ, LUÔN chạy kể cả không ai online (19/10 sửa: trước để PAUSE_IF_NO_PLAYERS true nên server vắng là không sao lưu — bản mới nhất từng bị cũ 15 giờ). Sao lưu ngay: docker compose exec backup-banghoi-1 backup now (backup-lobby, backup-practice-1, backup-sangtao-1). DB MariaDB: backup-db mỗi 6 giờ (db-*.sql.gz). Nơi lưu: BACKUP_DIR trong .env (/mnt/f/DuckyMoMo-backups, ổ F khác ổ chạy server). Xem bản đã có: docker exec duckymomo-backup-banghoi-1-1 restic -r /backups/restic snapshots. NGOÀI MÁY (đám mây): ./ops/saoluu-ngoai.sh (cấu hình rclone: Google Drive / OneDrive / B2 / MEGA…) → dat <remote> → kiemtra → chay; dịch vụ backup-offsite (profile offsite) đẩy mỗi 24 giờ, file bị xoá ở máy nhà còn giữ 30 ngày trên mây (_da-xoa). CẤT RESTIC_PASSWORD ở nơi khác: mất nó thì không mở được bản sao lưu"]
      - ["Cổng VPS (giữ IP thật)", "VPS Vinahost 125.212.218.74 (Viettel TP.HCM) chuyển người chơi về nhà qua WireGuard: Java 25565, Bedrock 19132, vote 8192 (25570/19130 cũ vẫn chạy). Xem trạng thái: docker compose logs relay. playit vẫn chạy làm đường dự phòng"]
      - ["Set Chuyên Cần (điểm danh)", "29/10: set cn_* (mũ/giáp/quần/giày +0..+5, sắt -> kim cương, +5 Tu sửa), đổi ở /thoren (hoặc nút ở /diemdanh -> /thoren set chuyencan) bằng Phiếu Chuyên Cần phieu_dd (SUNFLOWER, nằm trong tho-ren.guard). Phiếu: daily-rewards 1/ngày, mốc 7/14/30: 2/3/5 = 40 phiếu/30 ngày. online-ticket (1 phiếu mỗi 60 phút hoạt động, tối đa 2/ngày) ĐÃ TẮT 29/10 (chủ server: phải điểm danh cả tháng), bật lại = daily-checkin.online-ticket.enabled. Cân bằng: +0 kim cương Bảo vệ III (~Tân Thủ +6), giá 8 phiếu/món = bộ 32 phiếu (~1 tháng); +3 ~ Chiến Binh +0; +5 ~ Chiến Binh +4 + Tu sửa + 30% kn, cả bộ 236 phiếu (~6 tháng). Hiệu ứng bộ mới kn = % kinh nghiệm (ThoRen.onExp). Món sinh bằng tools/gen_chuyencan.py (ghi data thuvien-do.yml, bản cũ .bak-29-10-chuyencan)"]
      - ["Điểm danh hằng ngày", "/diemdanh (Bang Hội Chiến): đếm tổng số ngày (bỏ ngày không mất chuỗi), quà ngày + quà mốc 7/14/30 lặp mỗi 30 lần, gõ sớm thì vào hàng chờ, đủ phút online server TỰ điểm danh (29/10, kiểm mỗi 20 giây); phải online đủ 5 phút. Sửa quà: Cài đặt > Bang Hội Chiến > Thưởng & sự kiện (ô chọn quà: xu, đồ thư viện, đồ thường, lệnh). Dữ liệu: plugins/DuckyMoMoCore/diemdanh.yml"]
      - ["Đường tân thủ /tanthu", "29/10 (người mới vào vài phút rồi thoát): người vào LẦN ĐẦU (hasPlayedBefore=false, kể cả sau /choilai … moi) tự bắt đầu chuỗi newbie-path.steps (config DuckyMoMoCore): hỏi Già Làng (dmm viecnpc … gialang) -> điểm danh -> /rtp -> chặt 8 gỗ -> bàn chế tạo -> đào 16 đá -> /sethome -> hạ 3 quái; mỗi bước thưởng xu, xong hết final-rewards (500 xu + 16 bò nướng). Thanh boss bar vàng hiện bước + tiến độ; /tanthu xem danh sách, /tanthu boqua (bỏ bước, mất thưởng), /tanthu an|hien. Loại bước: feature (mã DailyQuests.feature + gialang/rtp/sethome), break, craft, kill (@hostile). Admin: /tanthu batdau <tên>. Lưu plugins/DuckyMoMoCore/tanthu.yml. Bot không tính. Test: tools/bottest/tt-thu.js"]
      - ["Giới thiệu bạn bè /gioithieu", "29/10: mã = tên người chơi. Người mới (vào lần đầu < window-days 3 ngày) gõ /gioithieu <tên người rủ>: nhận 300 xu ngay; người rủ nhận 1.000 xu khi người mới chơi đủ need-hours 2 giờ (Statistic PLAY_ONE_MINUTE, kiểm mỗi phút; offline thì phát lúc vào). Mốc 5 người: 3.000 xu + danh hiệu [Người Dẫn Đường] (dandat), 10 người: 8.000 xu + [Đại Sứ Làng] (daisu) — danh hiệu trong leaderboard.titles. Chặn: tự giới thiệu, cùng IP (IP lần vào gần nhất), bot, nhập lần 2. /gioithieu (mã + thống kê), /gioithieu top. Config referral, lưu plugins/DuckyMoMoCore/gioithieu.yml. Test: tools/bottest/gt-thu.js"]
      - ["Nhiệm vụ hằng ngày", "/nhiemvu (= /nv, /quests; Bang Hội Chiến): mỗi người 3 nhiệm vụ ngẫu nhiên/ngày (đổi 0h) từ danh sách; xong hết thêm thưởng. Khối tự đặt rồi phá không tính. Sửa danh sách, số lượng, quà: Cài đặt > Bang Hội Chiến > Thưởng & sự kiện. Dữ liệu: nhiemvu.yml. LÀM QUEN TÍNH NĂNG (26/10, cùng /nhiemvu): 23 việc mỗi việc nhận quà 1 lần, làm song song (điểm danh, gacha, mua/bán shop, câu cá, nấu ăn, chợ đen treo/đặt đơn/giao đơn, trade, tinh luyện, Xưởng, Thợ Rèn, bắt pet, vào thị trấn, kho lương, danh phận, Thăng Cấp, vào/vượt dungeon, lệnh săn, kho báu, Đấu Trường); tổng 8.150 xu + 2.000 khi xong hết. Code báo DailyQuests.feature(p, mã) lúc làm thật (chợ đen + trade nghe sự kiện zAuctionHouse/TradePro; bán = /sell có tiền về; thị trấn kiểm Towny mỗi phút; loại thành tích tăng = việc cùng mã). Tên, hướng dẫn: config daily-quests.intro; quà: Cài đặt › Nhiệm vụ hằng ngày (Làm quen: …). Việc dân làng nhờ (28/10, thay Làm quen tính năng): hỏi Già Làng \"Trong làng có ai cần giúp không ạ?\" mở nhánh, 10 NPC (Già Làng, Bác Thợ Rèn, Người Gác Cổng ở /warp kinhdo; Thợ Kim Hoàn, Ngư Ông, Lão Nông, Lão Khoáng, Lão Săn Quái, Thợ Rèn ở /warp trade; Nhà Buôn ở /warp shop) mỗi người giao vài việc trong 25 việc daily-quests.intro (npc:), làm xong quay lại NPC nhận quà; NPC quầy có việc giao / trả thì lần bấm đó nói trong chat, không mở quầy. /nhiemvu chỉ hiện việc đang nhận. Admin: /dmm viecnpc <người> <mã> (BetonQuest cotruyen/vieclang gọi). Người giao + lời thoại: daily-quests.givers."]
      - ["Gacha (/gacha)", "Bang Hội Chiến (Crates.java, config crates, Cài đặt › Thưởng & sự kiện › Gacha; 21/10, THAY HẲN /vongquay, chỉ một lệnh /gacha không tên phụ). Nhiều máy gacha, mỗi máy một VÉ = món Thư viện đồ công dụng Vé gacha (mã nội bộ chia-khoa; tạo vé ở trang Thư viện đồ, gán vé cho máy bằng ô chọn). Quay 1 lần mất 1 vé trong túi; menu 4 hàng phần thưởng ghi tỉ lệ, món hiếm báo cả server. Quà chọn được đồ thường (Vật phẩm) và đồ thư viện (Món thư viện). Mặc định: Gacha Điểm Danh (vé chia_khoa_diemdanh, nằm trong Quà mỗi ngày của /diemdanh) và Gacha Chăm Chỉ (vé chia_khoa_online: chơi thật 60 phút = 1 vé, treo máy không tính, giữ tối đa 5 vé trong túi thì ngừng tích; rank nhanh hơn qua quyền duckymomo.vongquay.nhanh.<%> do Danh phận cấp — giữ tên quyền cũ). Vé /vongquay còn tồn tự đổi thành vé Chăm Chỉ khi vào game. Placeholder %dmmhom_chia%, %dmmhom_con%. Cầm vé bấm chuột phải cũng quay. Admin: /gacha give <người> <mã máy> [số]. Vé KHÔNG bán bằng tiền thật / Vàng (luật Mojang)"]
      - ["Xưởng chế tạo (/xuong)", "Bang Hội Chiến (Workshop). Từ 20/10 món (tên, vật phẩm, phù phép, kỹ năng, độ bền, hạn, mất tác dụng khi công thành) nằm ở Thư viện đồ, công dụng Kỹ năng đặc biệt; Cài đặt › Shop › Xưởng chế tạo chỉ chọn món + giá + bàn chế + món Tinh Luyện cần thêm (config workshop.items.<mã thư viện>). Đồ kỹ năng phát từ boss / phần thưởng cũng chạy kỹ năng. Logic HIỆU ỨNG + ĐỘ BỀN + THỜI HẠN (ý từ Server Tools của UniMC, tự làm lại): menu 54 ô (tối đa 28 món) → bấm món mở bảng chế 3×3 (grid 9 ô «VẬT_LIỆU số»), bấm thành phẩm để chế (trừ xu + nguyên liệu). Độ bền (uses): công cụ mất 1 mỗi khối (kể cả khối phụ của đào vùng/chặt cây), vũ khí 1 mỗi đòn, cung/nỏ 1 mỗi phát, món dùng 1 mỗi lần; -1 = độ bền gốc. Món có độ bền riêng thì không hỏng theo độ bền gốc (Unbreakable ẩn). Hết độ bền / hết hạn (days) là biến mất. 19 hiệu ứng: dao_vung (3×3/5×5, phá bằng Player.breakBlock nên Towny/CoreProtect thấy, bỏ qua rương và lồng quái), chat_cay, tu_nung (quặng/quặng thô → thỏi, mảnh vụn cổ → mảnh netherite), da_nang (tự đổi cuốc/rìu/xẻng), gat_lua (gặt 3×3 + gieo lại bằng hạt trong túi), hut_do, nam_cham (bán kính; không hút đồ người khác vứt, đồ trong 10 khối quanh chỗ có người chết 5 phút), ban_ruong (đánh vào rương có quyền SWITCH Towny: bán theo Essentials worth.yml, cộng quỹ khai hoang như /sell), tui_hu, nuoc, dung_nham, bat_thu (thú hiền, không thú có chủ/pet MyPet/đã đặt tên, phải có quyền xây ở đó), co_le (lồng quái, mặc định TẮT), moc_bay, hut_mau, khien_than (giảm %, phản 1/2 phần giảm), kiem_nhat (chuột phải lướt chém, hồi 4 giây), riu_chien (% chí mạng ×1,5 + chảy máu 3 giây). Phù phép: gốc, enchantio:<tên>, ce:<Tên> (CrazyEnchantments qua CeBridge, giữ dòng mô tả CE trên lore). pvp: (bỏ 22/10, chuyển sang Sách cấm). Admin: /xuong tang <mã> [người]. Dấu PDC xuong_id/xuong_luot/xuong_het/xuong_celo PHÙ PHÉP RIÊNG chuột phải (21/10, SkillEnchants.java; Thư viện đồ › Phù phép, mã dmm:luot|hoi_mau|cau_lua|bay|dich_chuyen|dam_dat|cuong_no|phong_bay|khong_lo|thu_nho|cam_lang|troi|moc_keo|tua_thoi_gian|khien_phep|hoi_mau_dong_doi|chan_dan|soi_sang|hoang_so|hoa_cuu|hoa_da|khieu_khich|danh_dau|ho_den|day_vang|ho_gia|dong_bang|bat_tu|la_chan|giai_khong_che|loc_xoay|tia_sang|phao_kich|set_nay|lien_hoan|rut_bai|tang_toc, lưu dmm-enchants, cấp I–III): Lướt (lực 1 / 1,5 / 2, hồi 4 giây), Hồi máu (1 tim mỗi cấp, hồi 20 giây, đầy máu không dùng), Cầu lửa (sát thương 3 + 2 × cấp, cháy người trúng, không đốt khối, hồi 3 giây); Bay lên (lơ lửng 1 + cấp giây + rơi chậm, hồi 15 giây), Dịch chuyển (2 + 2 × cấp khối về trước theo hướng ngang, bám địa hình lên 1 / xuống 2 khối mỗi bước, dừng trước vách, không xuyên tường, hồi 8 giây), Dậm đất (sát thương và bán kính 2 + cấp, hất tung, hồi 12 giây), Huyết chiến (mất 3 tim, +10 + 10 × cấp % sát thương 8 giây, hồi 30 giây), Phóng bay (gắn trên elytra, chuột phải vào không khí, hồi 10 giây), Khổng lồ (22/10: to 1,5 / 1,75 / 2 lần trong 10 giây, cần chỗ trống phía trên, hồi 40 giây), Thu nhỏ (0,75 / 0,6 / 0,5 lần trong 10 giây, hồi 40 giây; hết giờ ở chỗ chật thì chờ tối đa 10 giây); hai món này dùng chỉ số scale có sẵn của game, modifier tạm (không lưu, thoát game là mất); 22/10 thêm 8 chiêu ý từ LMHT (docs/y-tuong-phu-phep-lmht.md): Câm lặng (nhắm 12 khối, mục tiêu không dùng phù phép riêng + kỹ năng Xưởng 2/3/4 giây, hồi 25), Trói (15 khối, tốc chạy + sức nhảy về 0 1/1,5/2 giây, hồi 14), Móc kéo (14 khối, kéo về mình, hồi 16), Tua thời gian (đặt mốc, 4 giây sau hoặc bấm lại thì quay về + hồi 50/75/100% máu đã mất, mốc bị lấp thì huỷ, hồi 20), Khiên phép (2/4/6 tim vàng 6 giây cho người đang nhìn hoặc mình, hồi 20), Hồi máu đồng đội (nhìn người khác 15 khối, 2/3/4 tim, hồi 12), Chắn đạn (3/4/5 giây chặn đạn bay tới từ phía trước, hồi 20), Soi sáng (người chơi trong 20/25/30 khối Glowing 5 giây, hồi 30); đợt 2 cùng ngày (bỏ ý trùng phù phép riêng / Xưởng / CE, còn 18): Hoảng sợ, Hoá cừu, Ánh mắt hoá đá, Khiêu khích, Đánh dấu tử thần, Hố đen, Đẩy văng, Hộ giá (chỉ đồng đội cùng thị trấn / quốc gia / đồng minh, TownyAllies.java), Đóng băng thời gian, Bất tử, Lá chắn phép, Giải khống chế, Lốc xoáy, Tia sáng, Pháo kích, Sét nảy, Liên hoàn đao, Rút bài (thông số đầu SkillEnchants.java); Tăng tốc (22/10, THỤ ĐỘNG: cầm tay chính / tay phụ là tốc chạy +10/20/30%, modifier tạm, Sách cấm tắt được); chiêu nhắm người khác phải qua đòn thử sát thương thật (Towny/PvP/vùng an toàn chặn thì không có tác dụng); Bay lên / Dịch chuyển / Phóng bay / Thu nhỏ tắt trong vùng vây đang có phiên đánh (từ 22/10 do Sách cấm quyết định, trang Công thành); mọi món cầm tay; bấm rương/cửa vẫn mở như thường (ngồi + bấm thì dùng kỹ năng). Phù phép riêng đợt 3 (28/10, SkillEnchants, gắn ở Thư viện đồ › Phù phép): tang_hinh Tàng hình (lướt + vô hình hẳn 1,5–2,5 giây, đòn đầu +30–60%), nhay_cao Nhảy cao (bật ~5/9/14 khối, không mất máu khi rơi), sung_cao_su Súng cao su (bấm kéo, bấm lại bắn mình xa 8/11/14 khối, đáp đất hất tung + sát thương), phan_cong Phản công (né mọi đòn 2 giây rồi choáng 1 giây quanh 3 khối, +20%/đòn né). Chưa gắn lên món nào; Sách cấm chưa chặn trong công thành (tuỳ chủ server)."]
      - ["Tinh Luyện (/tinhluyen)", "Bang Hội Chiến (27/10: thêm khảm /thoren kham, Thợ Rèn set cao đòi Tinh Luyện, đơn NPC Nhà Buôn ở /warp shop) (Refining.java, config tinh-luyen, Cài đặt › Shop › Tinh Luyện; 19/10). Tên, vật phẩm nền, mô tả, hình riêng của từng món ở Thư viện đồ (công dụng Nguyên liệu Tinh Luyện, mã món = mã thư viện; 20/10); config chỉ giữ công thức + giá bán. Đổi MỘT CHIỀU khối thường → món tinh luyện: Đá (256 đá cuội + 256 đá sâu cuội), Than / Đồng thô / Sắt thô / Đá Đỏ / Lapis / Vàng thô / Kim Cương (64 khối), Lục Bảo / Netherite (32 khối), Địa Linh (64 kiện rơm), Xu Quái 2 (64 Xu Quái). Món là mảnh gốm/hạt vàng gắn dấu PDC dmm_tinhluyen (đổi tên bằng đe không làm giả được); không đặt, chế tạo, rèn, sửa bằng đe được. Xu Quái: quái thù địch người chơi giết rơi 5% (EliteMobs 40%, 1–3 cái), quái từ lồng không rơi. Người chơi: /tinhluyen (menu: bấm = 1, Shift+bấm = tối đa), /tinhluyen ban [tatca], /sell hand|all cũng bán được (giá riêng, ~70% giá trị nguyên liệu, có góp quỹ khai hoang; KHÔNG được thưởng bán ở kinh đô). Admin: /tinhluyen ds (mã món), /tinhluyen give <mã> [số] [người]. SHOP DÂN LÀNG: /tinhluyen give kimcuong 5 → /shopkeeper admin (hoặc mở shop có sẵn) → kéo món vào ô hàng/giá. Đổi tên/mô tả món trong config thì món cũ vẫn dùng được nhưng trade Shopkeepers đã đặt phải đặt lại. XƯỞNG: ô 'Món Tinh Luyện cần thêm' (vd sat:1) ở từng món; mặc định chưa món nào cần (đồ Xưởng chỉ 7 ngày, thêm thì cân nhắc giá)"]
      - ["Treo thưởng (/treothuong)", "Bang Hội Chiến: /treothuong dat <người> <xu> (phí 5% không hoàn), ai hạ được nhận hết; giết liền 5 mạng không chết thì hệ thống tự treo 750 xu (+150/mạng). Không tính tài khoản phụ, cùng IP; không treo lên dân Hoà Bình. Hết 3 ngày trả lại tiền. Khác truy nã (án Hội Bàn Tròn). Dữ liệu treothuong.yml. Sửa: Cài đặt > PvP & combat > Treo thưởng"]
      - ["Khai hoang vùng mới (/khaihoang)", "Bang Hội Chiến: quỹ chung tăng khi bán /sell (100% tiền bán tính vào quỹ, người bán không mất gì) và /khaihoang gop <xu>. Đủ mốc tự chạy lệnh nới viền ChunkyBorder (3 mốc: Bán Đảo Mưa 300k, Thiên Đảo 800k, Đảo Rừng Già + Đảo Núi Lửa 2 triệu). SAU KHI MỞ: sửa Tâm viền/Viền thế giới ở Cài đặt > Thế giới cho khớp (ghi chú từng mốc trong nhóm Khai hoang). Admin cộng quỹ: /khaihoang them <xu>. Hologram ở spawn: %dmmkh_ten% %dmmkh_thanh% %dmmkh_pct%% (%dmmkh_quy% / %dmmkh_can%). Mở mốc thì vùng mới (rtp.zones có requires: <mốc>: Bán Đảo Mưa, Thiên Đảo, Đảo Rừng Già, Đảo Núi Lửa) hiện ở /tpr, có đặc sản riêng (region-specialty), pioneer.count người đầu tiên đặt chân tới nhận pioneer.rewards (mặc định 3000 xu + danh hiệu [Tiên Phong]); lưu tienphong.<mốc> trong khaihoang.yml. Quà danh hiệu dùng loại quà «danhhieu <mã>»"]
      - ["Chợ đen (/choden, gõ tắt /cho)", "Bang Hội Chiến (21/10): MỘT lệnh cho cả chợ giữa người chơi. Bên Đang bán chạy trên zAuctionHouse (người bán treo hàng sẵn giá, bấm là mua; KHÔNG phải đấu giá), bên Đang thu mua là Orders.java (người mua đặt đơn, tiền giữ trước, ai có hàng giao vào lấy tiền). /choden mở trang chung 6 nút. Lệnh con: mua (xem hàng), ban [số món] <giá cả lô> (treo bán món đang cầm, bỏ số món = cả chồng), cuatoi (đồ đang treo), hethan (lấy lại đồ hết hạn), lichsu, nhantien, thumua (xem đơn thu mua), dat <số món> <giá mỗi món> (đặt đơn; số món đứng trước như ban, nhưng giá là giá MỖI MÓN), don (đơn của tôi), nhan, huy <số>, giup. /donhang đã bỏ; /ah ẩn khỏi Tab cho người chơi, gõ /ah trống thì mở trang Chợ đen (Chợ đen gọi /ah nội bộ, nên zAuctionHouse giữ alias ah, bỏ hdv/auction/zauction). Chợ vẫn chỉ mở trong kinh đô / đất hoà bình. Đấu giá thật chưa làm. 22/10: món treo hết hạn TỰ VỀ TÚI người bán (AuctionReturn.java: lúc vào game + mỗi 60 giây, gọi AuctionManager#removeExpiredItem qua reflection, mỗi món cần 1 ô trống; túi đầy thì giữ ở /choden hethan và nhắc 10 phút/lần) — trước đó quá thời gian giữ (Cài đặt ah_expired_keep, 7 ngày) là zAuctionHouse xoá vĩnh viễn."]
      - ["Chợ đen · thu mua (/choden thumua)", "Bang Hội Chiến: cầm món cần mua, /choden dat <số món> <giá mỗi món> (tiền giữ trước + phí 2% không hoàn). Người khác /choden thumua, bấm đơn giao hàng nhận tiền ngay; người mua nhận ở /choden don (chuột trái nhận, chuột phải huỷ). Đơn đóng sau 7 ngày, trả tiền phần chưa giao. Chỉ đồ thường. Admin huỷ đơn bất kỳ: /choden huy <số>. Dữ liệu donhang.yml. Sửa: Cài đặt > Bang Hội Chiến > Shop > Chợ đen (thu mua)"]
      - ["Vũ khí nổ lên người chơi", "Bang Hội Chiến: end crystal, respawn anchor, nổ giường mặc định 0 sát thương lên người chơi (không hất), xe goòng TNT còn 30%. Quái, rồng, phá khối như gốc. Sửa: Cài đặt > Bang Hội Chiến > PvP & combat > Vũ khí nổ (config explosive-pvp)"]
      - ["La bàn sảnh bị dịch chuyển (admin)", "La bàn cũng là gậy dịch chuyển của WorldEdit (gắn theo phiên người chơi). Đã đổi data/lobby/plugins/WorldEdit/config.yml navigation-wand.item = minecraft:stick; ai đã bị gắn thì cầm la bàn gõ //none. Menu sảnh cũng tự chặn WorldEdit khi bấm la bàn (bản 16/10)"]
      - ["Mùa mưa / mùa khô", "/mua (Bang Hội Chiến): mùa đổi theo ngày thật (mặc định 7 ngày/mùa, bắt đầu mùa mưa 12/10/2026). Mùa mưa: lúa, mía, tre lớn nhanh, xương rồng chậm, mưa nhiều; mùa khô: khoai, cà rốt, dưa, bí nhanh, mía chậm, ít mưa. Được mùa: % rơi thêm 1 nông sản khi gặt cây chín. Cá theo mùa (EvenMoreFish) đọc %dmmmua_id% (mua|kho). Thử: /mua dat kho · /mua dat tudong (trả về lịch). Sửa: Cài đặt > Bang Hội Chiến > Thế giới > Mùa mưa / mùa khô; thêm cây, câu gợi ý: plugins/DuckyMoMoCore/config.yml (seasons)"]
      - ["Quảng trường Danh vọng", "/vinhdanh (danhvong, dentvinhdanh): Bang Hội Chiến ghi data/shared/vinhdanh/S<mùa>.json (tạm tính 30 phút/lần; /vinhdanh chot khoá khi đóng mùa, /vinhdanh tam ghi ngay) gồm Bá Chủ (nước, vua, thị trấn, thị trưởng, thành viên + chức vụ), Á Chủ, Chiến Thần, Đại Phú Hộ, Kiến Trúc Sư, Đấu Trường, Pet. Ở SẢNH admin đứng đúng chỗ: /vinhdanh dat <mùa|moinhat> <tieude|bachu|chienthan|phuho|kientrucsu|dautruong|pet> dựng bảng chữ nổi + tượng đầu top 3 (quay mặt về phía admin), /vinhdanh xoa (điểm gần nhất), lammoi; người chơi /vinhdanh tp. Lưu điểm đặt: lobby plugins/DuckyMoMoCore/vinhdanh.yml. Web: mục Vinh danh (api/vinhdanh). Đầu người chơi lấy da từ Mojang theo tên (tên không bản quyền thì đầu mặc định)"]
      - ["Mùa giải 3 tháng", "Mỗi mùa 13 tuần: tuần 1–2 hoà bình (tắt vây thành), 3–12 chiến tranh, 13 đại chiến (điểm lãnh thổ ×2, bình chọn Kiến Trúc Sư), rồi đóng mùa (/bxh dongmua → /bxh traothuong → /vinhdanh chot). Mùa sau làm lại từ đầu với BẢN ĐỒ MỚI; giữ tài khoản, rank donate, đồ trang trí, danh hiệu, Quảng trường Danh vọng. Ngày bắt đầu: leaderboard.season-start (trống = chưa mở mùa)"]
      - ["Tiền cướp khi thắng vây", "Tấn công thắng cướp 120 xu × số ô từ ngân khố thị trấn thua. Thiếu tiền thì bên thắng vẫn nhận đủ, thị trấn thua trả nợ dần 7 ngày (SiegeWar plunder_paid_over_time), không bị phá sản vì một trận. Cài đặt › Chiến tranh › Luật công thành"]
      - ["Bản đồ kho báu", "/khobau (TreasureHunt, config treasure): câu cá fish-chance %, hạ quái mob-chance %, tối đa max-per-day/người/ngày (khobau.yml). Bản đồ (PAPER, PDC dmm_khobau = bậc;world;x;y;z) ghi điểm đất hoang ngẫu nhiên trong vùng /tpr đã mở. Cầm trên tay: thanh hành động lạnh/ấm/nóng. Trong dig-radius khối, Shift để đào: lính canh (PDC linhcanh) xuất hiện, hạ hết trong guard-minutes (đứng trong 40 khối) thì nhận quà (Rewards), không thì trả bản đồ. Bậc broadcast báo cả server. Admin: /khobau give <người>. Lính canh sót lại bị xoá khi chunk nạp lại"]
      - ["Lệnh săn quái", "/lenhsan (tên cũ truyna; WantedBoard, config wanted): mỗi interval-minutes dán lệnh săn một mục trong targets (loài, máu, nhân sát thương, giáp) ở điểm đất hoang của vùng /tpr đã mở, tối đa max-active. Quái chỉ spawn khi có người trong spawn-distance khối, phát sáng, không tự biến mất; hết expire-minutes thì trốn. Người gây nhiều sát thương nhất (Culprit: tính cả pet, tên) nhận rewards, báo cả server. Lệnh không lưu qua khởi động lại (quái sót bị xoá khi chunk nạp)"]
      - ["Hầm Ngục DuckyMoMo", "/hamnguc (hn; HamNguc.java, config ham-nguc, 29/10): dungeon tự dựng bằng code trong thế giới riêng hamnguc (trống, giữ đồ khi chết, plugin tự tạo). Mỗi lượt dựng một bản ở ô riêng (x = ô x 512): phòng 0 an toàn, bước vào phòng là quái ra, hạ hết thì song sắt cửa ra mở; phòng giữa phó trùm, phòng cuối trùm (thanh máu, gọi lính / dậm đất / lao tới). Quái vanilla tên Việt, máu và sát thương theo config (không dùng cấp chiến đấu EliteMobs). Rơi: món +0 của set gắn với hầm (mã đầu trong tho-ren.sets.<set>.pieces.<món>.ids) vào túi người hạ, trùm thì mỗi người quay riêng; drop.mob/mini/boss % x drop-mult. 4 hầm theo chuỗi: hammo (Tân Thủ) -> mo (Chiến Binh) -> thanhco (Tinh Anh) -> vuc (Cao Cấp). Nhóm: /hamnguc moi <tên> (tối đa 4), quái nhiều máu hơn theo party-hp. Không tp vào được bằng /tpa; /spawn, /home trong hầm = rời lượt. Thoát game giữa chừng: vào lại về chỗ cũ (hamnguc.yml back). Admin: /hamnguc admin (xem), xoa (đóng hết), mo <người> <mã> (ghi đã vượt). Lượt vượt lưu hamnguc.yml. /dungeon có nút dẫn sang. /dmm reload đóng mọi lượt đang chạy"]
      - ["Cổng Dungeon", "/dungeon (dg; DungeonGate, config dungeon-gate): đặt trường permission của từng gói EliteMobs = duckymomo.dungeon.<mã> (reflection, đặt lại mỗi phút để /em reload không mất; tắt module thì trả quyền gốc), rồi cấp quyền tạm (PermissionAttachment) cho người qua cổng. Mọi lối vào của EliteMobs (menu /em, NPC, nhóm) đều hỏi quyền này. 6 kiểu: gate (chỉ vào qua Cổng Hoang: Cống Ngầm, Bắc Cực), chain (10 tầng Story Mode; trùm cuối tầng requires rơi CHÌA KHOÁ thật (TRIAL_KEY, PDC dmm_chiatang) cho từng người chưa mở và chưa có chìa; dùng chìa = /dungeon vao hoặc chuột phải: mất chìa, mở VĨNH VIỄN tầng đó cho người dùng (dungeon.yml mo.<uuid>); key-tradeable false (mặc định) = chìa ghi tên người nhận, người khác không dùng được; nhóm: mỗi người cần chìa/đã mở riêng), hidden (lối vào chưa đặt thì server TỰ chọn chỗ đất hoang ngẫu nhiên lúc bật, ghi toạ độ vào log; admin xem chỗ + nút [Tới]: /dungeon ds; đổi: /dungeon datan <mã> tại chỗ đứng hoặc /dungeon datan <mã> ngaunhien; tới trong hidden-radius khối là tìm ra cả mùa; night-only; hạt tím quanh lối vào trong 24 khối), luck (Vé Vận Mệnh AMETHYST_SHARD PDC dmm_vevanmenh rơi luck.mob-chance/fish-chance %, max-per-day; dùng có roll-chance % mở, trượt mất vé; báo cả server khi nhặt), ticket (/dungeon mua <mã> [số], price/vé, tối đa max-tickets), server (/dungeon gop <mã> <xu> tới goal → mở cho cả server open-days ngày, 0 = tới hết mùa). Vé trừ lúc /dungeon vao, cổng mở window-seconds giây, không vào kịp (PlayerJoinDungeonEvent) thì hoàn vé. Chung: requires-frontier (mốc khai hoang), first-rewards (quà lần đầu/người), báo cả server người ĐẦU TIÊN vượt. Điều kiện phụ từng dungeon (kiểm cho từng người trong nhóm EliteMobs /em party; dungeon có điều kiện thì không cấp quyền sẵn, mỗi lần vào đều qua /dungeon vao): min-pet-level (pet đang dẫn, MyPetBridge), party «2-4» (PartyManager.getDungeonEntryMemberIds), days [t2..t7, cn], hours «19-23», seasons [mua, kho], hegemon-only (WarBalance), min-achievements. Mặc định: Hoang Mạc Địa Ngục pet 10+, Chuông Địa Ngục nhóm 2–4, Lâu Đài Hiệp Sĩ T7/CN, Xưởng Hơi Nước 8 thành tích, Đấu Trường Ma nhóm 2–5 + 19–24h, Kẻ Trói Buộc nhóm 3–5 (EliteMobs tối đa 5 người/instance) + pet 20+. Dungeon ẩn có fragments: tìm ra rồi còn ghép N Mảnh Chìa (ECHO_SHARD, PDC dmm_manhchia; rơi fragment.mob-chance/fish-chance %, chỉ cho người đã tìm ra; Thánh Đường Bóng Tối cần 3). Nhóm mở cổng: trưởng nhóm /dungeon vao, cả nhóm được quyền tạm, vé trừ của từng người. Dungeon của tuần (weekly): chọn ngẫu nhiên đầu tuần (khác tuần trước), vượt được thêm weekly.rewards tối đa max-per-week lần/người. Kỷ lục tốc độ: từ lúc vào tới DungeonCompleteEvent, top 5 mỗi dungeon, báo cả server khi phá kỷ lục, web hiện top 3. Kho báu bậc có reveal-hidden % (huyền thoại 40%): kèm mảnh giấy chỉ đường (±40 khối) tới lối vào ẩn chưa tìm ra. Admin: /dungeon cho <mã> <người> [số] (vé / Vé Vận Mệnh / Mảnh Chìa / Chìa khoá tầng), /dungeon datan <mã>, /dungeon mo <mã>. Thành tích dg1 (vượt 1), dg2 (30 lượt, danh hiệu chinhphuc), dga (tìm dungeon ẩn, danh hiệu timan). 18 dungeon (18/10): chain 10 (Đỉnh Vách Đá 10 → Hang Thánh Địa → Mỏ Hoang → Cây Cầu Cổ → Thành Phố Đổ Nát → Cung Điện → Mỏ Đá → Mỏ Sâu → Hoang Mạc Địa Ngục → Chuông Địa Ngục 55), gate 2 (Cống Ngầm, Bắc Cực), hidden 1 (Thánh Đường Bóng Tối), ticket 2 (Lâu Đài Hiệp Sĩ 3000, Xưởng Hơi Nước 5000), server 3 (Pháo Hoa 100k/7 ngày, Đấu Trường Ma 150k/7 ngày, Kẻ Trói Buộc Thế Giới 1 triệu/hết mùa), luck 0 (chưa có → Vé Vận Mệnh không rơi). Web: thẻ Cổng Dungeon (trang chủ: kiểu, điều kiện, quỹ, Dungeon của tuần, kỷ lục top 3), thẻ Dungeon (tài khoản: tầng đã vượt, dungeon ẩn đã tìm, vé). Lưu dungeon.yml, ghi dungeon.json. Cài đặt › Thế giới › Cổng Dungeon"]
      - ["Cổng Hoang", "/conghoang (cong-hoang, rift; WildGates, config wild-gates): khi đã mở mùa (leaderboard.season-start), mỗi interval-days (7) ngày đặt 1 cổng, tối đa max-gates (4)/mùa, đích ưu tiên dungeon ít cổng nhất, ở đất hoang vùng /tpr đã mở, cách spawn thị trấn >= min-town-distance, cách cổng khác >= min-gate-distance; báo «tin đồn» (vùng + hướng, không toạ độ). Ngụy trang ngẫu nhiên hợp địa hình, 14 kiểu: đồng cỏ/núi (vòng đá rêu, tượng đá đổ, vòng nấm, đá tảng), rừng (gốc cây rêu, tượng đổ, vòng nấm, đá tảng), sa mạc (giếng cạn, cột đá đổ, xương hoá thạch), tuyết (cột băng, gò tuyết, đá tảng), đầm lầy (rễ đước, xác thuyền, vòng nấm), biển (xác thuyền), DƯỚI NƯỚC (vòng san hô, cột đá chìm, xác thuyền; đáy sâu 2–24 khối, underwater-chance %), khối của cổng không phá được (lưu để gỡ lại). Độ khó nhận ra theo bậc dungeon (wild-gates.dungeons.<mã>.tier 1–3; tiers.t1–t3): hạt tím particle-range (16/8/4 khối, bậc 3 chỉ ban đêm), dòng nhắc hint-range (6/3/0), dựng structure-percent chi tiết (100/55/25%), tin đồn chi-tiet (vùng + hướng) / vung / mo-ho (chỉ loại địa hình), kho báu chỉ đường sai số treasure-radius (40/80/150). Tin đồn ghép cảnh vật ngụy trang + dấu hiệu riêng của dungeon (dungeons.<mã>.rumor). Đứng ô giữa + Shift để vào. Người tìm ra đầu tiên: grace-minutes phút ưu tiên (chặn TownPreClaimEvent/PreNewTownEvent của người khác trong grace-radius), thành tích + danh hiệu mocong. Chủ cổng = thị trấn có ô đất chứa cổng: dân thị trấn / cùng nước / nước đang chiếm (SiegeWar getTownOccupier) vào miễn phí; người ngoài trả phí /conghoang phi <mã> <xu> (<= max-toll) vào ngân khố thị trấn, hoặc /conghoang dong|mo; người quản lý: vua nước chiếm nếu bị chiếm, không thì thị trưởng. Cổng dẫn vào 1 dungeon trong wild-gates.dungeons qua DungeonGate.passThrough (bỏ qua điều kiện). upkeep-per-day và revolt-hours-less (WarBalance) mặc định 0. Kho báu huyền thoại có thể chỉ đường tới cổng chưa ai tìm. Admin: tao [here], ds, xoa <mã>, datlai. Lưu conghoang.yml, ghi conghoang.json (không có toạ độ). Cài đặt › Thế giới › Cổng Hoang"]
      - ["Chương trình Sứ Giả (/media)", "Bang Hội Chiến (Sứ GiảProgram.java, config media, Cài đặt › Người mới › Chương trình Sứ Giả; trang quản trị › Sứ Giả, quyền duckymomo.web.media; 19/10). Kiểm soát rank Sứ Giả bằng số liệu: người chơi /media dangky <link kênh TikTok/YouTube> → đơn ở trang Sứ Giả (hoặc /media ds) → Duyệt = rank media CÓ HẠN (trial-days 14, LuckPerms parent tạm), Gia hạn (+extend-days 30, cộng từ ngày hết hạn), Gỡ, Từ chối (lệnh: /media duyet|giahan|go|tuchoi <tên> [ngày], /media xem <tên>). Mỗi lần live: /media live [link] (báo cả server kèm link, tối đa 1 lần/60 phút), /media tat; thoát game hoặc kênh không live ~30 phút liền thì tự kết thúc. Mỗi check-minutes (5) phút server tự kiểm: ONLINE THẬT (Activity, không AFK) + KÊNH ĐANG LIVE — TikTok: https://www.tiktok.com/api-live/user/room/?uniqueId=<tên> (không chính thức, status 2 = live, 4 = không; bị chặn/lỗi → tính 'chưa xác minh'), YouTube: cần YOUTUBE_KEY (YouTube Data API v3) trong .env → CFG_YOUTUBE_KEY. Buổi ≥ min-session-minutes (30) mới tính buổi; chỉ tiêu 7 ngày: min-sessions (4) buổi VÀ min-hours (6) giờ (tính cả phút chưa xác minh, trang hiện riêng để admin xem link). Thứ 2 chấm tuần trước; thiếu fail-weeks-alert (2) tuần liền → báo admin online + đỏ trên trang (KHÔNG tự gỡ). Tố cáo: /media baocao <tên> <lý do>. Dữ liệu: plugins/DuckyMoMoCore/media.yml, media.json (trang đọc). Quyền lợi rank media: play-ranks.other-ranks.media"]
      - ["Vàng (tiền ủng hộ)", "20/10. Nạp tiền thật -> Vàng -> mua rank/đồ trang trí. Ví: MariaDB network.vang_vi + vang_log (mọi giao dịch, ref nap:<mã> không cộng 2 lần). Panel: panel/vang.py (cấu hình ở config DuckyMoMoCore Bang Hội Chiến mục vang: ty-gia, nap-toi-thieu, thuong-nap, mon). Tỉ giá/mốc thưởng: Cài đặt › Toàn mạng › Rank donate › Vàng. Giá rank = giá tiền donate-ranks ÷ tỉ giá (tự tính). Người chơi nạp: trang tài khoản (chọn số tiền) hoặc /rank mua (QR trên tay, món đang cầm giấu trong bản đồ, trả lại khi cất). Admin: trang quản trị › Donate · Vàng: Duyệt = cộng Vàng (cả đơn kiểu cũ chọn gói), ô Ví Vàng: xem ví, cộng/trừ tay có lý do. Mua: /vang (bấm 2 lần) hoặc web; trừ Vàng trước rồi chạy lệnh ở sảnh qua RCON, lỗi thì hoàn; tài khoản chưa từng vào server không mua được. Vàng KHÔNG chuyển nhau, KHÔNG đổi ra xu. QR tự vẽ (segno, chuẩn NAPAS, BANK_BIN trong panel/app.py; ngân hàng lạ thêm bin: trong site.yml). Món bán lẻ cấp quyền NGAY bằng lệnh LuckPerms (settemp … Nd accumulate / set), không qua vật phẩm. Thời hạn món: ngay (ngày) hoặc gio (giờ, 29/10; /vang ghi «Thời hạn N giờ», panel/vang.py + DonateQr). TIỆN ÍCH bán lẻ theo giờ (29/10, chủ server: mua lẻ, tính theo giờ; nhóm «Tiện ích», gói 1 giờ cộng dồn, quyền server=banghoi-1): /wb, /trash, /anvil 1 Vàng/giờ; /ec, /feed 2; /fix, /bay 3. Giá + hồi chiêu /feed /fix + /bay: Cài đặt › Bang Hội Chiến › Shop › Tiện ích (khoá tienich_*, path vang.mon.<chỉ số>.gia: thêm / bớt món phía trước trong vang.mon thì chỉ số lệch, sửa lại schema). Hết hạn (test bot 22/10, tools/bottest/vang-hethan*.js): LuckPerms gỡ quyền đúng giờ, nhưng nick / món đội bằng /hat / hạt PlayerParticles còn sót → PerkCleanup.java (lúc vào game + mỗi 30 giây): hết essentials.nick thì nick off, hết essentials.nick.color thì bỏ màu nick, hết essentials.hat thì cất món không đội được theo cách thường vào túi, vừa mất quyền hạt thì ppo <tên> reset; hết hạn lúc offline thì PlayerParticles check-permissions-on-login: true (đã bật ở sảnh + Bang Hội Chiến). Chưa kiểm: tủ skin quá số ô sau khi hết hạn."]
      - ["Menu chính (/menu, Shift+F)", "Bang Hội Chiến (PlayerMenu.java, config player-menu: title, rows, buttons {slot, icon, name, lore, cmd|suggest|proxy|server}). Ở sảnh /menu vẫn là chọn chế độ (lobby-menu). Nút proxy gửi qua kênh duckymomo:cmd tới plugin proxy DuckyMoMoSkin, proxy CHỈ chạy lệnh trong danh sách cho phép (tuskin, wardrobe, skin, skins). Nút server dùng kênh BungeeCord Connect. Sửa nút: sửa config rồi /dmm reload ở banghoi-1."]
      - ["Tủ skin (/tuskin) + đổi skin trên web", "Plugin DuckyMoMoSkin trên PROXY (network-core/core-velocity, ./ops/build-core.sh tạo proxy/plugins/DuckyMoMoSkin.jar, không commit; build dựa trên jar Velocity + SkinsRestorer đang chạy, chép vào network-core/libs). Người chơi lưu tối đa N skin (mặc lại bằng mã SkinsRestorer, không tạo custom skin nên không lọt /skins). N = quyền duckymomo.tuskin.<N> cao nhất, KHÔNG kèm context server; Danh phận cấp theo Cài đặt › Người mới › Danh phận (Tủ skin) và Quyền lợi theo rank khác; duckymomo.tuskin.admin = 50; không có quyền = 1. Thêm / mặc skin trong tủ cần quyền đổi skin (skinsrestorer.player: Hào Kiệt, Sứ Giả, rank ủng hộ, staff), nên 29/10 Tị Nạn / Dân / Lương Dân đặt tủ skin 0. Hạ bậc: ô vượt giới hạn mờ đi, không mặc được (không xoá). Web: trang tài khoản thẻ 👕 Tủ skin (link ảnh / tên bản quyền / tải PNG 64x64 ≤48 KB) -> site /api/skin -> panel /api/web/skin (ảnh lưu data/shared/skins/<sha1>.png, phục vụ công khai /mc/web/skin/<sha1>.png để MineSkin tải) -> proxy cổng 8095 nội bộ, khoá DMM_SKIN_KEY = PANEL_SITE_KEY. Dữ liệu: data/proxy/plugins/duckymomoskin/tuskin.json. Áp dụng thay đổi plugin: docker compose up -d proxy rồi tạo lại relay."]
      - ["Danh phận (/danhphan) + Balo (/balo)", "Bang Hội Chiến (PlayRanks.java + Backpack.java, config play-ranks / backpack, Cài đặt › Người mới › Danh phận; 19/10). Rank CHƠI miễn phí, người chơi BẤM NHẬN trong menu khi đủ yêu cầu: Dân Tị Nạn (nhóm default, mới vào: 1 nhà, 2 món chợ, 2 đơn) → Dân (6 giờ chơi thật + xong chương 1 — BetonQuest c1_ket chạy lp ... permission set duckymomo.cotruyen.c1; 2 nhà, 1 balo 18 ô, 4 món, 3 đơn) → Lương Dân (24 giờ + Thăng Cấp 10; 3 nhà, 1 balo 27 ô, 6 món, 4 đơn) → Hào Kiệt (72 giờ + cấp 25; 4 nhà, 2 balo 36 ô, 8 món, 5 đơn, tủ skin 5 + đổi skin skinsrestorer.player, rada, chờ dịch chuyển 4 giây). Số liệu 29/10; chờ dịch chuyển 3 bậc dưới 5 giây; tủ skin 3 bậc dưới = 0 (chưa được đổi skin nên ô vô nghĩa; /danhphan ghi «Tủ skin: mở khi lên <bậc đầu có tủ skin>»). Số ô mỗi balo: quyền duckymomo.balo.o.<9..54> (cao nhất), chỉnh cả cho rank ủng hộ / staff ở Cài đặt › Người mới › Balo theo rank khác (play-ranks.other-ranks). Rank giảm ô: đồ ở ô khoá vẫn giữ trong file. Tiền tố &8[Tị Nạn] / &7[Dân] / &a[Lương Dân] / &6[Hào Kiệt] (dưới staff; rank donate hiện thứ hai). Lúc bật / dmm reload plugin TỰ ĐỒNG BỘ nhóm LuckPerms dan/luongdan/haokiet + default: tiền tố, weight, quyền essentials.sethome.multiple.dmm<N> (Essentials sethome-multiple dmm1..dmm20), zauctionhouse.max.<N> (zAuctionHouse permissions.auction 1..20), duckymomo.balo.<N> — ngữ cảnh server=banghoi-1. ĐỪNG sửa tay các quyền đó trong LuckPerms (bị ghi đè). Mỗi bậc còn có orders (đơn /donhang, quyền duckymomo.donhang.<N>, mức thấp nhất orders.max-per-player = 2) và spin-faster (% vé gacha online nhanh hơn, quyền giữ tên cũ duckymomo.vongquay.nhanh.<5..50>). RANK KHÁC (play-ranks.other-ranks, Cài đặt › Người mới › Quyền lợi theo rank khác): Sứ Giả (create: plugin tạo nhóm media + tiền tố &c◆ Sứ Giả; card: thẻ trong /danhphan với yêu cầu + cách liên hệ; 29/10 chủ server: nhỉnh hơn Hào Kiệt: 5 nhà, 2 balo 45 ô, 9 món chợ, 6 đơn, 6 ô tủ skin + đổi skin (skinsrestorer.player cấp tay cho nhóm media), rada, chờ dịch chuyển 2 giây, vé gacha nhanh 20%, gói quà media 3 ngày), cấp: /lp user <tên> parent add media; rank ủng hộ & staff: chỉ quyền lợi (29/10 chủ server CHO PHÉP rank ủng hộ có lợi thế chơi: balo, dịch chuyển nhanh, kho pet MyPet…). Admin: /danhphan dat <người> <mã bậc>, /danhphan dongbo. Balo: lưu plugins/DuckyMoMoCore/balo/<uuid>.yml ngay sau mỗi thao tác; không mở khi vừa đánh người (15 giây) hay trong vùng vây giờ đánh; /choilai xoá balo; admin xem: /balo xem <tên> [số]. Mục 'Số món chợ' cũ của zAuctionHouse trên Cài đặt đã bỏ (theo danh phận) 22/10 (chủ server chốt): rank ủng hộ có balo; 29/10 chủ server: balo rank ủng hộ phải hơn danh phận (nạp tiền phải khác): Nam 2×27, Tử 2×36, Bá 3×36, Hầu 3×45, Công 4×54 (Tị Nạn vẫn 0 balo; ô của Tị Nạn 9 vì mọi người kế thừa nhóm default; người nhiều rank lấy số balo và số ô CAO NHẤT). Thời gian chờ dịch chuyển theo rank (TeleportDelay.java): tp-delay mỗi bậc / rank khác (-1 = theo danh phận) → quyền duckymomo.tpdelay.<giây>, người nhiều rank lấy số NHỎ NHẤT; áp cho Essentials /home /spawn /warp /back /tpa (đổi delay của TeleportWarmupEvent qua reflection) và /tpr; mặc định danh phận 5 giây (Hào Kiệt 4, Sứ Giả 2), Nam / Tử / Bá Tước 3 giây, Hầu / Công Tước 2 giây (29/10); Essentials teleport-delay gốc phải > 0 (đang 5)."]
      - ["Thăng Cấp", "/capdo (LevelUp, config level-up, Bang Hội Chiến; làm lại 21/10 theo hướng cày cuốc): cấp riêng của server, max-level 100. Lên cấp N cần ĐỦ: xu = money-base × N^money-exponent (250 × N^0,6, TRẢ khi lên; tổng tới cấp 10 ≈ 6.600, tới 100 ≈ 250.000), TỔNG giờ chơi thật của mùa (Activity) ≥ hours-base × N^hours-exponent (0,04 × N²: cấp 10 = 4 g, 25 = 25 g, 50 = 100 g, 100 = 400 g), TỔNG điểm hạ gục ≥ kill-base × N^kill-exponent (1 × N²: cấp 10 = 100, cấp 100 = 10.000); hạ quái +mob-points (1), hạ người +player-points (10), quái từ lồng không tính, giết lại cùng một người trong player-cooldown-minutes (10) không tính. Điểm thuộc tính: points-per-level (1) mỗi cấp + milestone-points (1) mỗi milestone-every (10) cấp (mốc còn quà milestone-rewards + báo «sự kiện») = 110 ở cấp 100. 4 thuộc tính attribute-max-tier (10) bậc, bậc k tốn k điểm (55 điểm max 1 cái → cấp 100 max đúng 2): Máu (attributes.mau 1 = nửa tim/bậc, MAX_HEALTH), Sức mạnh (sucmanh % sát thương gây ra, cả bắn), Bền bỉ (benbi % sát thương nhận, trừ rơi khỏi thế giới / kill), Nhanh nhẹn (nhanhnhen % tốc chạy, MOVEMENT_SPEED ADD_SCALAR). Modifier tạm (transient, không lưu vào file nhân vật), gắn lại khi vào game / hồi sinh / đổi thế giới; tắt ở Đấu Trường + attribute-off-worlds. Cộng thêm với chỉ số AuraSkills (khác khoá modifier). Tẩy điểm: Shift + bấm, respec-cost xu (10.000; 0 miễn phí, -1 tắt). Đặc quyền (level-up.shop.<mã>.tiers [{level, cost xu, perms, rewards}], mua lần lượt từng bậc): giảm Xưởng 5%/bậc (duckymomo.xuong.giam, .giam.2; cấp 20/20k, 50/80k), bán cho server +1.000/ngày mỗi bậc (duckymomo.sell.them.1..3, sell-limit.extra-per-perk; cấp 15/15k, 35/40k, 60/100k), +10% kinh nghiệm nghề (jobs.boost.all.exp.0.1; cấp 25/30k), +10% kinh nghiệm kỹ năng (auraskills.multiplier.10; cấp 25/30k), +5% bắt pet (duckymomo.pet.batgioi; cấp 30/40k), +15% kinh nghiệm pet (duckymomo.pet.kinhnghiem, PetPerks nghe MyPetExpEvent, mọi nguồn; cấp 20/30k), pet hồi sinh nhanh gấp đôi (duckymomo.pet.hoisinh, PetPerks giảm nửa respawnTime MyPet 2 tick sau khi pet chết; cấp 35/40k), danh hiệu Lão Luyện (cấp 75/80k). Bản cũ (đổi điểm lấy /craft /anvil /hat /disposal, hạt, mèo) đã bỏ: lần đầu chạy bản mới gỡ quyền đã cấp. keep-on-new-season false: leaderboard.season-start đổi → làm lại cấp, thuộc tính, gỡ quyền đặc quyền. Menu: lên cấp, 4 thuộc tính, tẩy điểm, đặc quyền, xếp hạng. Tab: %dmmcap_cap%. Admin: /capdo dat <tên> <cấp> (hạ cấp mà điểm đã cộng vượt thì trả lại hết). Lưu capdo.yml, capdo.json (web). Cài đặt › Kinh tế › Thăng Cấp Màu cấp đổi theo mốc (level-up.level-colors, Cài đặt › Thăng Cấp; mặc định mỗi 10 cấp một màu): %dmmcap_mau% (TAB [Cấp N], bảng bên phải), %dmmcap_mau_s% (thanh chỉ số AuraSkills, mã § vì AuraSkills chèn placeholder như chữ thường), lên mốc đổi màu thì báo người đó. Sức mạnh / Bền bỉ cộng lúc trúng đòn nên không thấy: %dmmcap_hud_s% hiện 3 giây trên thanh chỉ số \"⚔ 7,7 (+0,7 Sức mạnh)\" / \"Bền bỉ đỡ −0,5\"; /capdo ghi dòng Thực tế (máu tối đa hiện tại, đòn 10 thành …, tốc chạy %)."]
      - ["Lữ khách", "/lukhach (lu-khach, wanderers; Wanderers + CitizensBridge + WanderersPapi, config wander-npcs, chỉ Bang Hội Chiến, cần Citizens; lời thoại BetonQuest gói cotruyen/lukhach/): 4 NPC Citizens, mỗi người gắn một dungeon đích của Cổng Hoang (npcs.<mã>.dungeon): cong = Thợ Cống Già (Cống Ngầm), bacuc = Người Kéo Xe Tuần Lộc (Bắc Cực), hiepsi = Hiệp Sĩ Lạc Đàn (Lâu Đài Hiệp Sĩ), hoinuoc = Kỹ Sư Bỏ Trốn (Xưởng Hơi Nước). Đặt ở chỗ đất hoang ngẫu nhiên (WildGates.randomSpot, không dưới nước), mỗi move-hours (72) giờ dời chỗ, báo tin đồn «Ở <vùng> (<hướng>) <rumor>» nếu announce. Lời thoại đọc tình trạng cổng qua PAPI %dmmlk_<mã>_cong|tim|tindon|vung|huong|chu|timboi|ten|npcvung|npchuong% (BetonQuest %ph.…% + variable … forceSync): chưa có cổng (chưa mở mùa) → chỉ kể truyền thuyết; có cổng → chỉ đường bằng tin đồn của cổng / ai tìm ra / thị trấn đang giữ. Đi qua Cổng Hoang (WildGates.use sau passThrough) → console bq tag <tên> add cotruyen>lk_<mã>_qua; về kể → constants.lk_thuong xu (mặc định 1000), tag lk_<mã>_xong, mỗi người 1 lần mỗi lữ khách (chưa làm lại theo mùa). Admin: /lukhach ds | doi <mã|all> | xoa. Lưu lukhach.yml (ID NPC, chỗ, lúc dời), ghi lukhach.json (web: trang chủ thẻ Cốt truyện › Lữ khách, trang tài khoản thẻ Lữ khách). Cài đặt › Cốt truyện › Lữ khách Chuỗi việc lữ khách (28/10, DailyQuests, daily-quests.chains.lk_cong|lk_bacuc|lk_hiepsi|lk_hoinuoc + givers): mỗi người 8 bước khó dần (kill/break/fish/nop/feature; cuối là Warden, Wither, 3 Elder Guardian, vượt 3 dungeon), hỏi \"Ông có việc gì cần giúp không?\" -> /dmm viecnpc <người> lk_<mã>; xong bước gắn tag cotruyen>vl_lk_<mã>_tra để câu mở đầu trả thưởng + giao bước sau. Không cần cổng."]
      - ["Cài đặt cá nhân", "/caidat (settings, tuychon; PlayerSettings, mọi server, player-settings.enabled mặc định bật): menu 19 công tắc, lưu ở LuckPerms meta của người chơi «dmmcaidat.<mã>» = bat|tat (không có = mặc định) nên dùng chung mọi server + proxy; trang tài khoản trên web có thẻ Cài đặt cá nhân bật/tắt được (panel gửi lp user … meta set/unset qua RCON sảnh; plugin nghe UserDataRecalculateEvent để áp lại ngay). Công tắc: chat (bỏ người tắt khỏi người xem chat), msg (/msg /tell /w /m /t /pm /whisper…: chặn gửi tới người tắt), goiten (tiếng ting khi bị nhắc tên), loctuc (người tắt thấy bản gốc: ChatFilter.ORIGINAL + bọc renderer, chạy cả với EssentialsXChat), vaora / tuvong (tin vào-rời, tử vong gửi riêng từng người), donrac (ItemCleaner), sukien (truy nã, kho báu, Cổng Hoang, dungeon), khungnhac (JoinNotes), bangphai / bossbar (tab scoreboard|bossbar on|off <tên> -s), hat (PlayerParticles togglePlayerParticleVisibility), maumob (HoloMobHealth playersEnabled + Database.toggle), tpa / tpahere (chặn /tpa, /tpahere tới người tắt), loimoi (/duel <tên>, /party invite <tên>), nhacvay (còn ≤15 phút tới phiên đánh SiegeWar: báo người có thị trấn bị vây / nước đi vây), nhacngay (mỗi giờ: chưa điểm danh / còn nhiệm vụ), goipet (mặc định tắt: vào game tự /petcall). Staff có duckymomo.caidat.bypass nhắn/TPA/mời được cả người đã tắt. Lệnh nhanh: /caidat <mã> bat|tat"]
      - ["Thái Ấp", "/thaiap (datrieng; ThaiAp, config thai-ap): thế giới phẳng riêng (mặc định thaiap: đá-đất-cỏ ở y 64, đồng bằng, không hang/quặng/công trình, không quái, không PvP, Towny tắt ở thế giới này bằng API). Mua /thaiap mua (prices[0], cạnh sizes[0]), mở rộng /thaiap morong, mời moi/duoi (max-trusted), ghé ghe <tên>, thích thich (1 lần/người/mảnh), top, ten, datspawn. Mảnh xếp lưới 20 mảnh/hàng cách nhau cell khối, viền lối mòn. Bảo vệ: phá/đặt/xô/tương tác/thú/khung tranh/giá giáp chỉ chủ + người được mời (admin vượt), chặn nổ, nước tràn, piston qua ranh. Bếp riêng: món /nauan nấu trong Thái Ấp của mình +kitchen-bonus % thời gian hiệu ứng. MyPet worldgroups: thaiap trong nhóm default. Lưu thaiap.yml, ghi thaiap.json"]
      - ["Quyền riêng từng người (trang Role)", "Trang quản trị › Role & rank › 👤 Quyền riêng từng người (chỉ tài khoản toàn quyền): gõ tên -> xem role + quyền riêng (luckperms_user_permissions, bỏ group./prefix./meta.), cấp quyền (danh mục quyen.yml gợi ý), toàn mạng hoặc 1 server, số ngày (0 = vĩnh viễn, settemp … accumulate), Cấm (= false), gỡ (unset / unsettemp). Gửi lp user <UUID> qua RCON sảnh (UUID vì tên Bedrock có dấu chấm). API: POST /api/roles action user_get | user_set | user_unset (panel/app.py user_perm_action). Lệnh tay tương đương: /lp user <tên> permission set|settemp|unset <quyền> …"]
      - ["Đăng nhập lâu (danh sách)", "Cài đặt › Toàn mạng › Đăng nhập lâu: dnl_nguoi (tên trong game) + dnl_ngay -> DuckyMoMoCore config dang-nhap-lau (sảnh + Bang Hội Chiến). Trong game: BedrockAuthListener.remember ở sảnh, người trong danh sách vào lại từ ĐÚNG IP lần trước (AuthMe getLastIp) và lần đăng nhập trước chưa quá N ngày (getLastLoginTime) thì forceLoginFromProxy, log \"Đăng nhập lâu: tự đăng nhập\". Web: site/app.py long_days (phiên trang tài khoản + quyền quản trị /web + cookie giữ N ngày). Panel (tài khoản admin .env): dnl_panel_gio giờ. Người khác: AuthMe 60 phút, web 7 ngày / 12 giờ. Chỉ thêm người tin cậy (cùng IP là vào được)."]
      - ["Thái Ấp Sáng Tạo (server sangtao-1)", "Server sáng tạo RIÊNG (modes/sangtao), KHÔNG có trong menu sảnh (mode.yml status: closed). Lối vào duy nhất: cổng tím (khung thạch anh tím 4×5 + chữ nổi + hạt) trong thế giới Thái Ấp của Bang Hội Chiến, tự dựng ở chỗ xuất hiện (0, 64, 6); dời cổng: admin đứng chỗ mới gõ /thaiap congsangtao. Người chơi: /thaiap sangtao (tới trước cổng) rồi bước vào; phải có Thái Ấp hoặc được mời xây cùng. Bước vào → ghi vé data/banghoi-1/plugins/DuckyMoMoCore/sangtao-ve.yml (hạn thai-ap.sang-tao.ticket-seconds = 60 giây) → chuyển server. sangtao-1 chạy DuckyMoMoCore ở chế độ BẢN SAO: đọc thaiap.yml của Bang Hội Chiến (mount chỉ đọc /banghoi-dmm, đọc lại mỗi 30 giây) nên mảnh đất cùng số, cùng cỡ, cùng người được mời; mua/mở rộng/mời/đặt tên vẫn làm ở Bang Hội Chiến. Vào bằng /server sangtao-1 không có vé → báo và đưa về sảnh (admin quyền duckymomo.admin vào thẳng được). Túi đồ, tiền tách hẳn (server khác, không Vault/Essentials): không có đường mang đồ sáng tạo về. Chặn ném đồ, kích nổ (TNT, creeper…), triệu hồi wither/rồng, tuần tra/đột kích; tối đa max-entities (40) sinh vật trong 48 khối. Lệnh ở sangtao-1: /thaiap (về mảnh đất), /thaiap ghe <tên>, /thaiap ve (về Bang Hội Chiến). Config: modes/sangtao/server/plugins/DuckyMoMoCore/config.yml (thai-ap.sizes, cell, world PHẢI giống Bang Hội Chiến). Server 2 GB RAM (mem_limit 3g), có sao lưu backup-sangtao-1. Chưa có WorldEdit (để sau)"]
      - ["Lính đánh thuê", "/linhdanhthue (ldt): người KHÔNG thuộc nước nào (không Liên minh Hoà Bình, không tài khoản phụ, >= min-hours giờ) /linhdanhthue dangky <giá>, rút: huy. Vua hoặc chức hire-ranks: /linhdanhthue thue <tên> (lính phải online) → lính nhan|tuchoi → ngân khố nước trả, server giữ fee-percent %. Hợp đồng contract-hours giờ: quyền tạm siegewar.immune.to.war.nausea (vào vùng vây không ốm), ăn kho lương thủ đô nước thuê, không đánh được người nước thuê và ngược lại; không giữ cờ, không điểm Chiến Thần. Module Mercenary, lưu linhdanhthue.yml"]
      - ["Sổ thành tích", "/thanhtich (sothanhtich): 18 mốc chơi một mình (khám phá vùng /tpr, câu cá, loài cá, quái, cấp pet, số pet, thắng Đấu Trường, nấu món, nộp kho lương, giờ chơi), tự đếm, đạt là tự nhận quà (Rewards); mốc có danh hiệu thì báo cả server. Sửa ở achievements.list. Admin xem người khác: /thanhtich <tên>. Lưu thanhtich.yml"]
      - ["Server vắng thì nhẹ đi", "low-population: quy mô = số người có chơi trong 7 ngày (chốt mỗi ngày). Dưới threshold (15): nhiệm vụ hằng ngày × quest-scale (0,6), bắt pet +capture-bonus % (10), phe phòng thủ không ai online thì bên tấn công chỉ ăn absent-defender-attack-percent % (50) điểm giữ cờ. Module LowPop"]
      - ["Cân bằng chiến tranh", "/canbang (bachu): nước đi vây tốn quỹ +war-chest-extra-percent-per-town% mỗi thị trấn (trừ thị trấn đầu) — thu thêm lúc cắm cờ, cộng vào quỹ của cuộc vây; mỗi thuộc địa tốn colony-upkeep-per-day xu/ngày (thiếu ghi nợ, còn nợ thì chặn cắm cờ); tối đa max-colonies thuộc địa (chặn PreInvadeEvent); hạn khởi nghĩa = 72 giờ trừ 12 giờ mỗi thuộc địa khác (tối thiểu 24); bên phòng thủ ít dân (bên kia gấp underdog-ratio) +15% điểm giữ cờ; Bá chủ (>= 30% thị trấn, >= 5): đánh vào được hoàn 30% quỹ và +15% điểm, Bá chủ chỉ hưởng đặc sản 2 vùng. Module WarBalance (SiegeWar qua phản chiếu), lưu canbang.yml, ghi canbang.json"]
      - ["Kho lương công thành", "/kholuong (Bang Hội Chiến): mỗi thị trấn một kho (điểm). Nộp: /kholuong nop (đồ đang cầm, kể cả cá câu và món ăn), noptat (cả túi nhưng BỎ QUA cá câu và món ăn, vì là đồ quý), top (các kho). Lúc có phiên đánh, mỗi 15 giây người trong vùng vây ăn cost-per-player-minute/4 điểm từ kho THỊ TRẤN MÌNH: còn thì được nuôi no (tự hồi máu), cạn thì bị Đói. Kho chỉ giảm khi quân ăn trong trận, trừ khi bật hao hụt (spoil-percent-per-day, mặc định 0). Module SiegeSupply, config siege-supply, lưu kholuong.yml (+ kholuong.json cho web). Cài đặt › PvP & combat › Kho lương"]
      - ["Món ăn ra trận", "/nauan (bep, monan): bếp nấu cá câu (ca:<độ hiếm>) + nông sản thành món có hiệu ứng ngắn (Cơm nắm, Canh chua cá, Cá kho tộ, Lẩu cá, Gỏi cá huyền thoại). Ăn xong chờ cooldown-minutes mới ăn món khác. Món là đồ vật (PDC dmm_mon), nộp kho lương được. Món + hiệu ứng khi ăn (loại, cấp, giây) ở Thư viện đồ, công dụng Món ăn; Cài đặt › PvP & combat › Món ăn ra trận › Các món chỉ chọn món + nguyên liệu (vật phẩm hoặc cá theo độ hiếm), tối đa 7 món. Món ăn thư viện phát từ boss / phần thưởng cũng ăn ra hiệu ứng. Module Dishes, config dishes.list.<mã thư viện>.need"]
      - ["Đặc sản vùng", "/dacsan: vùng = rtp.zones; phe (nước, hoặc thị trấn chưa vào nước) có nhiều thị trấn nhất trong vùng (đếm nhà chính/spawn) là chủ vùng, dân phe đó gặt đặc sản vùng ở BẤT KỲ đâu được mùa thêm % (cộng vào được mùa của /mua). Tính lại mỗi refresh-minutes, ghi dacsan.json cho web. Module RegionSpecialty, config region-specialty.regions"]
      - ["Sự kiện mùa", "Lũ (ngày cuối mùa mưa: ép mưa, lúa/khoai chậm, Thủy tộc dễ bắt) và Hạn hán (ngày 3–4 mùa khô: ép nắng, cây chậm, nộp nông sản kho lương x1,5). Config seasons.events (from-day/to-day, số âm đếm từ cuối). Thử: /mua sukien <lu|han|tudong>. Placeholder %dmmmua_sukien%"]
      - ["Bùa bắt pet", "/buabatpet: cầm tay trái khi quăng dây xích bắt pet: +charm-bonus% (25), mất 1 bùa mỗi lần thử. Có từ giải nhất/nhì/ba thi câu cá (3/2/1, EvenMoreFish COMMAND:buabatpet give {player} N trong competitions/thicau.yml). Admin phát: /buabatpet give <người> [số] (quyền duckymomo.pet.admin)"]
      - ["Câu cá (EvenMoreFish)", "Cá còn dùng để cho pet ăn (chuột phải pet) và nấu món /nauan. /emf (Bang Hội Chiến, gõ tắt /cauca): 24 loại cá Việt (Thường/Hiếm/Quý/Huyền thoại), cá có mùa chỉ câu được mùa đó, cá biển chỉ ở biển. Đồ kho báu gốc (sách phù phép…) vẫn ra như thường. Bán cá: /emf shop. Thi câu tự động T7, CN 20:00 (con dài nhất, 2 người trở lên). Mở tay: /emfa competition start thiCauCuoiTuan 1200 (giây). Quyền người chơi (shop, top, help, journal; không sellall): tools/emf.cmds. Thêm/sửa cá: plugins/EvenMoreFish/rarities/*.yml rồi /emfa reload"]
      - ["Cửa hàng Kinh Đô (/cuahang, NPC ở spawn)", "Chợ server (làm lại 20/10): trang chính 8 danh mục (Khối tự nhiên, Vật liệu xây, Gỗ, Nông nghiệp, Khoáng sản, Đồ từ quái, Trang trí, Danh hiệu). Trong danh mục mỗi món ghi giá mua, giá bán lại (bảng /sell), số đang có. Chuột trái: mua 1 lô · Chuột phải: bán 1 lô · Shift + phải: bán hết (bán qua /sell nên vẫn có thưởng kinh đô). Danh mục chỉ thu mua tự lấy món từ Essentials worth.yml theo mẫu (vd *_LOG). Sửa: Cài đặt > Bang Hội Chiến > Shop > Cửa hàng trang trí: Danh mục cửa hàng (mã, tên, biểu tượng, ô, mô tả, vật liệu thu mua), món bán (cột danh mục), danh hiệu; giá thu mua ở Bảng giá bán /sell. Lưu là nạp ngay. Món bán phải đắt hơn giá /sell (không thì tự bỏ). KHU SHOP KHUNG (/warp shop, 25/10): mỗi món một khung vật phẩm trên tường, chuột trái mua, chuột phải bán, Shift + phải bán hết; 29/10 chủ server: mỗi lần bấm 32 món (decor-shop.frame-lot; món không xếp chồng, Thư viện, danh hiệu vẫn 1), tên khung ghi giá cả lô. Đổi giá / lô xong: /dmm shopkhung capnhat (chỉ khung ở chunk đang tải: forceload quanh 12792 -2641 trước)."]
      - ["Hệ thống (trang quản trị)", "Trang quản trị > Theo dõi > Hệ thống (quyền duckymomo.web.hethong, tính năng hethong trong web-quyen.yml): mỗi server (sảnh, Bang Hội Chiến, Practice) hiện online + tên người chơi, TPS 1/5/15 phút, MSPT, RAM (essentials:gc; sảnh không có Essentials nên không có RAM), chunk, thực thể, thời gian đã chạy; tự làm mới 15 giây. Nút: Lưu thế giới (save-all flush), Dọn rác (dmm clean: giữ đồ quanh chỗ chết, đồ có tên, đất thị trấn; chỉ Bang Hội Chiến), Nạp DuckyMoMoCore, Nạp TAB, Nạp EliteMobs (Bang Hội Chiến). Khởi động lại: chọn 30 giây / 1 / 2 / 5 phút / ngay; có người online thì hỏi xác nhận kèm tên; trong game báo ở các mốc 5 phút, 2 phút, 1 phút, 30, 10, 5…1 giây (chữ + title); hết giờ: save-all flush rồi stop qua RCON, Docker (restart: unless-stopped) tự bật lại. Có nút Huỷ khi đang đếm ngược. Mọi thao tác ghi web-thaotac.jsonl. Proxy không có RCON: khởi động lại proxy phải làm trên máy chủ (docker compose restart proxy)."]
      - ["Boss (trang quản trị)", "Trang quản trị > Boss: tạo boss EliteMobs trên web (tên màu/dải màu, loại quái, cấp, máu ×, sát thương ×, kỹ năng chọn từ danh sách, trang bị, thông báo, bảng vinh danh top sát thương, lệnh khi chết, nút chia mảnh sự kiện cho người tham gia, ĐỒ RƠI chọn từ Thư viện đồ: tỉ lệ %, số lượng, ai nhận: người đánh nhiều nhất / 3 người đầu / mọi người / ngẫu nhiên 1 người). Lưu = em reload; đồ rơi ghi plugins/DuckyMoMoCore/boss-roi.yml, có hiệu lực ngay (module BossDrops, nghe EliteMobDeathEvent). Gọi boss cạnh một người chơi hoặc tại toạ độ (em spawn bossAt). Boss có sẵn của EliteMobs: sửa thẳng file gốc (chỉ ghi mục đã đổi, tự sao lưu bản gốc vào data/panel/boss-goc, có nút Khôi phục) hoặc Chép thành boss mới"]
      - ["Mảnh sự kiện (/doimanh) — ĐÃ BỎ 21/10", "Người dùng bỏ: boss chỉ cần rơi đồ (trang Boss › Đồ rơi). event-fragments.enabled false, lệnh doimanh gỡ khỏi plugin.yml, nhóm Cài đặt gỡ; code FragmentShop.java vẫn còn, muốn bật lại: thêm doimanh vào plugin.yml + enabled true + trả nhóm Cài đặt (git log)."]
      - ["Thanh đếm ngược bảo vệ người mới", "Boss bar của PvPManager (15 phút). Sửa chữ, màu, bật/tắt: Cài đặt > Bang Hội Chiến > PvP & combat ĐÃ TẮT 20/10 cùng bảo vệ người mới (chủ server bỏ tính năng)."]
      - ["Thư viện đồ (mọi vật phẩm đặc biệt)", "Trang quản trị > Thư viện đồ: NƠI DUY NHẤT tạo/sửa vật phẩm đặc biệt (20/10), chia đầu mục (Vũ khí, Công cụ, Giáp & khiên, Món ăn, Bùa & tiêu hao, Nguyên liệu, Tiền vật phẩm, Mảnh sự kiện, Khác). Mỗi món: tên màu, lore, phù phép kể cả vượt cấp, Enchantio, CrazyEnchantments [CE], không thể hỏng, hình riêng (model), XEM ĐỦ MÔ TẢ: /xemdo [tên|trade] (ItemInspect, mọi server; phím F khi rê chuột lên món: menu plugin + ô kết quả trade luôn xem, túi đồ/rương/Ender/balo chỉ khi tooltip > 20 dòng, món ngắn F vẫn đổi tay; chọn trade có món dài: Java nút [Xem đủ], Bedrock in luôn) in nguyên tooltip món ra chat bằng ItemStack#computeTooltipLines của Paper (giống hệt game, kể cả khối \"Khi được mặc\"), chat cuộn được; cách người dùng chọn 21/10 thay vì gộp. TOOLTIP GỌN (21/10: đồ nhiều phù phép bị đẩy ra ngoài màn hình; compact-enchants = 3 phù phép một dòng ở đầu mô tả, tên tự dịch; hide-stats = ẩn khối \"Khi ở ngực…\" và \"Khi được mặc\" của game, thay 1 dòng \"Khi mặc: +6 Giáp\"; trang đếm số dòng; TỰ GỘP cả 2 khi tooltip ước tính > item-library.tooltip-max-lines (Cài đặt › Shop › Thư viện đồ › Tooltip gọn; ĐANG 0 = tắt vì người dùng thấy mất dòng chỉ số do phù phép), lore giữ nguyên), TỐC ĐÁNH (attributes.attack_speed, đòn/giây; dấu PDC thuvien_tocdanh + dòng \"Tốc đánh: x đòn/giây\" cuối mô tả; AttackSpeed.java tự tính vì OCM bỏ hồi đòn: đòn sớm hơn 1/tốc đánh giây thì sát thương × (0,2 + 0,8 × tiến độ²), trống = kiểu 1.8 không giới hạn), CHỈ SỐ GỐC (21/10, attributes: sát thương, giáp, độ cứng giáp, kháng đẩy lùi, máu tối đa, % tốc chạy; số như dòng \"8 Sát thương\" trong game; ô trống = giữ gốc; sát thương gốc theo bảng OldCombatMechanics old-tool-damage; server chép chỉ số gốc của loại đồ rồi ghi đè vì gắn chỉ số riêng là Minecraft bỏ hết chỉ số gốc), và CÔNG DỤNG: Kỹ năng đặc biệt (kỹ năng Xưởng + độ bền + hạn + mất tác dụng khi công thành), Món ăn (hiệu ứng khi ăn), Bùa bắt pet, Nguyên liệu Tinh Luyện, Mảnh sự kiện. Chỗ khác chỉ CHỌN món và giữ thông số riêng: Xưởng (giá, bàn chế), bếp /nauan (nguyên liệu), Tinh Luyện (công thức, giá bán), mảnh (hạn đổi), bùa (% cộng), boss (tỉ lệ rơi, ai nhận), phần thưởng 'Đồ thư viện'. Mã Xưởng/món ăn/Tinh Luyện/mảnh = mã thư viện. Trang hiện 'Đang dùng ở'; món đang dùng không xoá được và không đổi công dụng được. Đồ từ game: cầm tay, /dmm luudo <mã> (giữ nguyên vẹn; trên web vẫn đặt đầu mục + công dụng). Phát: /dmm laydo <mã> [số] [người]; /dmm thuvien liệt kê theo đầu mục. Đồ mẫu: thuvien-mau.yml trong jar (phien), tự thêm món còn thiếu khi tăng phiên. File: plugins/DuckyMoMoCore/thuvien-do.yml (ItemLibrary, dấu PDC thuvien_id) BỘ (20/10): mỗi món gắn được nhiều bộ (vd Tân thủ, Hào Kiệt) ở mục 6 trang Thư viện; danh sách lọc theo bộ; ô chọn đồ thư viện trên Cài đặt tìm được theo tên bộ; trình soạn quà/gói quà có \"+ Thêm cả bộ…\" thêm một lần mọi món của bộ. CHỈNH THEO % (22/10, âm = giảm): attributes.pct_mau (chỉ số % của game), pct_sat_thuong / pct_toc_danh / pct_day_lui (ItemPercent.java tự tính, dấu PDC thuvien_pct_*, dòng '+10% Sát thương' trên đồ); chỉ tính khi món ở đúng ô (vũ khí tay chính, giáp đang mặc), cộng dồn; tốc đánh % trên vũ khí không đặt tốc đánh: dương không đổi, âm lấy tốc đánh gốc game làm mốc; kháng đẩy lùi +100% = không bị đẩy. Ô chọn phù phép hiện tỉ lệ % từng cấp của CE (app.ce_chances đọc Chance-System), sửa ở Cài đặt › Phù phép › Tỉ lệ phù phép CrazyEnchantments (%)."]
      - ["Sách cấm (/sachcam)", "22/10, BanBook.java. Trang quản trị › Thư viện đồ › nút 📕 Sách cấm: mỗi trang là một hoạt động (Công thành = vùng vây lúc đang có phiên đánh; Đấu trường = thế giới arena.world; Hầm ngục = thế giới EliteMobs em_*, kể cả vào qua Cổng Hoang, trừ em_adventurers_guild). Trong trang chọn món thư viện + cách xử lý: Không dùng được (vo-hieu: món TỐI ĐI bằng lớp phủ hồi chiêu của game, món mang nhóm hồi chiêu duckymomocore:sachcam_<hoạt động> và mỗi giây đặt hồi chiêu nhóm đó cho người đang ở hoạt động; KHÔNG CẦM ĐƯỢC: huỷ đổi ô, huỷ đổi tay, đang cầm / mặc thì tự cất vào túi; thêm cho chắc: đánh 0 sát thương, không bắn/ăn/chuột phải, vật tổ không cứu), Không cho mang vào (chặn bước vào vùng vây, /dautruong, dịch chuyển vào dungeon; lỡ ở trong thì như Không dùng được); thêm ô phù phép riêng bị tắt ở hoạt động đó (mọi món). Lưu ở thuvien-do.yml mục sach-cam. Luật đọc theo mã thư viện (PDC thuvien_id) nên đổi là áp ngay cho đồ đã phát; dòng ⛔ cuối mô tả tự cập nhật (vào game, đổi ô cầm, nhặt, đóng túi, khi thư viện đổi; PDC sachcam_lore). Thay ô pvp cũ của đồ Xưởng và danh sách phù phép tắt khi công thành viết cứng (thư viện chưa có sach-cam thì tự suy ra trang Công thành từ luật cũ; web lưu lần đầu thì ghi hẳn). Món Xưởng pvp cũ giờ là Không dùng được (chặt hơn trước: trước chỉ huỷ đòn đánh người + tắt kỹ năng). Món là ngọc ender / khiên… bị cấm thì hồi chiêu không chung nhóm với món thường cùng loại. «tat-hieu-ung» là tên cũ, đọc thành vo-hieu. Người chơi: /sachcam (/luatcam)."]
      - ["Tự sửa sau khi máy khởi động lại", "Tự chạy 2 phút sau khi đăng nhập Windows (tác vụ 'DuckyMoMo tu sua'): sửa cổng chết, thư mục gắn bị treo, playit cho cả Minecraft, Trạm 6, goc6; có người online thì không khởi động lại. Chạy tay: ./ops/tu-sua-sau-khoi-dong.sh (thêm --kiem-tra để chỉ xem). Nhật ký: data/ops/tu-sua.log"]
      - ["Trang trí trên web", "Trang tài khoản > Trang trí: đổi tên (nick, bảng màu theo quyền nick.color/format/rgb, xem trước chat + trên đầu + Tab), hiệu ứng hạt (PlayerParticles, hình động xem trước, chỉ hiện hiệu ứng/kiểu rank có), chọn danh hiệu; mục Pet trang trí chỉ liệt kê loài rank được dùng (gọi pet làm trong game bằng /pet, web không gọi pet). Chạy THAY người chơi bằng /sudo của Essentials (plugin tự kiểm quyền), nên người chơi phải đang online ở Bang Hội Chiến hoặc Practice (danh hiệu: chỉ Bang Hội Chiến). /hat vẫn làm trong game. Danh sách hiệu ứng/kiểu/pet: panel/taikhoan.py (PP_EFFECTS, PP_STYLES, PASSIVE_PETS)"]
      - ["Lệnh hay dùng (trang tài khoản)", "Mục 'Lệnh bạn dùng được' trên web hiện '⭐ Hay dùng' trước (nhóm Người chơi / Staff / Admin, đúng thứ tự trong modes/_network/lenh-hay-dung.yml, sửa không cần build), các lệnh khác thu gọn theo plugin. Mỗi người chỉ thấy lệnh mình dùng được"]
      - ["Donate qua web (QR)", "Trang tài khoản > Ủng hộ server: người chơi chọn bậc + gói (giá đọc từ donate-ranks.tiers.*.prices), web hiện QR VietQR (img.vietqr.io) với số tiền + nội dung 'DMM <TÊN> R<bậc> <tháng>T <mã>', bấm 'Tôi đã chuyển khoản' thì báo admin online trong game + dòng Hoạt động. CHƯA tự cấp: trang quản trị > Donate, kiểm tra tiền về rồi bấm 'Cấp rank' (chạy /rank give) hoặc 'Đã cấp tay' / 'Huỷ'. Số tài khoản: site/config/site.yml mục donate (sửa không cần build). Dữ liệu: data/panel/donate.json"]
      - ["Khảm Tinh Luyện (/thoren kham, 27/10)", "Kham.java, config kham (Cài đặt › Thợ Rèn: bật, tiền tháo, % vỡ; số ô / chỉ số / trần sửa trong config). Ô theo set+cấp: Tinh Anh +3..+5 1, Cao Cấp 1 (+5: 2), Huyền Thoại 3, Thần Thoại 3, Thần Thánh 4; set khác 0. Khảm luôn được (món Tinh Luyện mất), tháo 2.000 xu + 50% vỡ. 9 ngọc (sat, vang, kimcuong, lucbao, lapis=Lưu Ly, dado, dong, than (giáp: giảm st lửa; vũ khí: +% st lên mục tiêu đang cháy vì mọi vũ khí set có ô đã có Lửa), netherite); menu khảm hiện chỉ số đang có cả người; không khảm vào chồng nhiều món, chỉ số khác nhau giữa giáp (tính khi mặc) và vũ khí (khi cầm tay chính); trần cả người: +10% máu, -8% sát thương nhận, +12% sát thương… PHẨM + NĂNG LƯỢNG (27/10): khảm tung phẩm (kham.pham: Thường 60% 80–100%, Tốt 30% 100–120%, Hoàn Mỹ 10% 120–150%, nhân vào chỉ số); năng lượng đầy kham.nang-luong 5000: giáp -1 mỗi lần trúng đòn từ quái/người, không tính ngã/cháy/độc/đói (dồn trong bộ nhớ, ghi vào món mỗi 30 giây / khi mở menu / thoát / tháo giáp, vì đổi dữ liệu món giáp đang mặc làm game phát tiếng mặc giáp), vũ khí -1 mỗi con quái/người hạ được, trùm EliteMobs (tên 『N』) -kham.vukhi-trum 10 (ghi ngay); không đánh nhau thì không hao; 5.000 ≈ 2–3 tuần giáp, 3–4 tuần vũ khí với 2 giờ chơi/ngày; còn 10% nhắc, cạn thì vỡ. Nạp đầy: 1 Tinh Luyện cùng loại (món trơn) + kham.nap-xu 1000. Tháo giữ phẩm + năng lượng (PDC dmm_kham_ngoc trên món Tinh Luyện trả về; Thợ Rèn / đơn nhà buôn lấy món trơn trước). Lưu trên món: PDC dmm_kham = mỗi ô «mã:phẩm:%:năng lượng» (ngọc cũ chỉ «mã» = Thường 100% đầy) + dmm_kham_n. kham.debug: true in log từng đòn (chỉ để gỡ lỗi). HÀO QUANG (27/10): auraTick mỗi kham.hao-quang.chu-ky tick, mỗi ngọc hạt màu gems.<mã>.rgb (màu = loại ngọc) xoay quanh người ở tầng của món (vũ khí cạnh tay phải); KIỂU hạt theo phẩm (pham[].hat, chốt: Thường cham = DUST, Tốt xoay = ENTITY_EFFECT, Hoàn Mỹ xoan-oc = TRAIL xoắn chân -> đầu, mat-do 0,5; còn chuyen-mau, vet, vong-dau để thử); số hạt = hao-quang.so-hat 2 × mat-do × (0,25 + 0,75 × năng lượng), cỡ hao-quang.co 0,85 × năng lượng; gửi cho chính chủ + người trong ban-kinh 32 ô có /caidat hat bật; tàng hình / spectator không phát. Vỡ ngọc (cạn hoặc tháo): bùng DUST màu ngọc + CRIT + tiếng thạch anh vỡ (người quanh nghe). Ngọc vỡ không đụng tới món (bot haoquang.js: kiếm còn nguyên chỉ số). Thợ Rèn nâng cấp / cập nhật theo Thư viện gọi Kham.carry chép ngọc sang món mới (ô thừa trả ngọc về túi). Bot kham.js, kham-nang.js đã thử: khảm, tháo, máu tăng, nâng Cao Cấp +5 -> Huyền Thoại +0 giữ ngọc."]
      - ["Luật chết + Ngọc Hộ Thân (30/10)", "DeathRules.java, config death-rules (enabled, newbie-hours 30, capital-town KinhDo, gear-drop-percent 10). Theo thứ tự: chỗ đã giữ đồ (Đấu Trường…) để nguyên; chơi < 30 giờ (Statistic PLAY_ONE_MINUTE, mọi rank) giữ hết; trong trận công thành đang diễn ra giữ hết; thị trấn của mình / Kinh Đô giữ hết; còn lại (quái, môi trường, bị người giết) rơi hết túi đồ, giáp + tay phụ + món đang cầm mỗi món 10% rơi; kinh nghiệm như game gốc. Balo không rơi. Mã QR nạp tiền trả món giấu trước khi tính. Ngọc Hộ Thân: kham.gems.hothan (không chỉ số) + kham.ho-than {ngoc, that-bai 45, ton [25, 20, 12.5] % năng lượng mỗi lần giữ theo phẩm = 4/5/8 lần}; món có ngọc này không rơi (cả túi lẫn đồ mặc trúng 10%), hết năng lượng vỡ; không nạp lại; khảm hỏng 45% (ngọc vỡ, món nguyên, áp dụng cả ngọc đã tháo). Nguồn: Tinh Luyện hothan = 2 loiquai + 4 netherite + 5000 xu (recipe nhận khoá xu = trừ tiền, Refining.XU). Đánh nhau cũng hao: kham.ho-than.hao-danh 20 (% so với ngọc thường, phần lẻ theo xác suất; 30/10 chủ server). Log: Hộ Thân:/Khảm: khảm hỏng. /chet (không lệnh con, mọi người): menu giải thích luật + tình trạng riêng (giờ chơi / còn bao giờ bảo vệ, chỗ đang đứng có an toàn không, món nào có Ngọc Hộ Thân còn mấy lượt); tin nhắn sau khi chết nhắc /chet. Server tắt death-rules thì /chet báo dùng luật game gốc. Bùa Hộ Mệnh: chưa làm (để sau)."]
      - ["Đơn nhà buôn tuần (NPC Nhà Buôn, 27/10)", "DonBuon.java, config don-buon (Cài đặt › Thợ Rèn: bật, số đơn/tuần, % giá, lượt/đơn; mẫu đơn trong don-buon.pool). Thứ Hai (giờ VN) chọn đơn ngẫu nhiên, báo cả server; giao đủ Tinh Luyện nhận gia% × giá bán Tinh Luyện + quà (vé gacha). Mỗi người mỗi đơn 1 lần/tuần, mỗi đơn luot lượt cả server. Dữ liệu donbuon.yml (xoá giao/dem/tong rồi /dmm reload để làm lại tuần). Mở bằng NPC Nhà Buôn ở khu shop (/warp shop), KHÔNG có lệnh (chủ server 27/10); đặt/gỡ: /dmm donbuonnpc [remove] hoặc console <x> <y> <z> <yaw>."]
      - ["Thợ Rèn đòi Tinh Luyện (27/10)", "Cấp +0 của set cao: Cao Cấp +1 Sắt +1 Vàng, Huyền Thoại +1 Lục Bảo +1 Kim Cương, Thần Thoại +2 Kim Cương, Thần Thánh +1 Netherite (mỗi món; tho-ren.sets.<set>.cost[0])."]
      - ["Giá /sell và Essentials (26/10)", "EssentialsX tra giá theo tên vật liệu BỎ dấu _ (LAPIS_LAZULI -> worth.lapislazuli); bảng giá của mình ghi tên có dấu _ (code đọc tên đó). Trước 26/10 khoảng 690 món có dấu _ không bán được (/sell báo 'không thể bán', vd lưu ly). Cách giữ: worth.yml có thêm khối tên liền ở cuối (tools/shop/worth-essentials.py sinh lại, bang-gia.py tự gọi; trang Cài đặt lưu giá tự chép sang tên liền). Sửa giá thì sửa dòng có dấu _, chạy script, rồi /essentials reload. Không dùng /setworth (chỉ ghi tên liền)."]
      - ["Khối dưới chân NPC (26/10)", "NpcGround: khối ngay dưới chân NPC Citizens (lữ khách đất hoang, NPC chợ…) không phá được (trừ duckymomo.admin), nổ không mất. Ô đất giữa Cổng Hoang cũng giữ như các khối của cổng (WildGates.isGateBlock)."]
      - ["Mở hết map mùa 1 (27/10)", "Chủ server: mở hết, mùa sau dựng map mới. Đã: chunky border remove world (ChunkyBorder không còn viền); Cài đặt › Thế giới border_x/z 29000000 (Áp dụng lại tất cả không thu viền); frontier.enabled false (khai hoang tắt, /khaihoang không còn quỹ; Shared.unlocked coi mọi mốc là đã mở khi tắt: vùng /tpr + dungeon gắn mốc mở hết); rtp.border = vùng thiết kế [11200,-3200,15100,1100] (dịch chuyển ngẫu nhiên không thả xa hơn cho đỡ sinh địa hình mới); towny-map.border [] (bản đồ web không vẽ viền); Chunky tạo sẵn vùng thiết kế. /huongdan: trang Khai hoang thay bằng Bản đồ mùa này. Mùa sau: bật lại frontier + viền nếu cần."]
      - ["Bot (trang quản trị › Bot, 27/10)", "Dịch vụ botfarm (botfarm/, compose, chỉ trong mạng Docker cổng 8090; panel gọi http://botfarm:8090) giữ 20 bot tài khoản offline (Minh_Tuan, HoangLong99, Thu_Trang, Duc_Anh, NamPro2k8, Linh_Chi, Bao_Khang, QuangHuy_VN, Tuan_Kiet, MaiAnh2k9, KhoiNguyen, TrungHieu07, Phuong_Vy, GiaBao_VN, Hai_Dang, AnhThu_x, ThanhDat99, Khanh_Linh, VietHoang, Nhat_Minh). Vào THẲNG server con qua Velocity forwarding (không qua proxy: không tính vào số người ở danh sách server / MOTD), đứng yên (AFK: Activity không tính giờ chơi, LowPop không đếm). Trang Bot: TẠO BOT MỚI (ô tên + server + Tạo bot, 27/10: tên 3–16 ký tự không dấu, không trùng tài khoản từng vào server — panel đọc usercache.json; bot mới làm y bot gốc: quyền duckymomo.vaora.an cấp trước lần vào đầu, Sáng tạo + /god, IP giả riêng, tự đăng ký Sảnh; Xoá được bot tạo thêm sau khi Thoát, 20 bot gốc không xoá; tài khoản game vẫn còn, xoá hẳn: /choilai admin <tên> moi), Vào / Thoát từng bot hoặc tất cả, chọn server (Bang Hội, Sảnh, Practice, Thái Ấp; Sảnh có AuthMe: bot tự /register, /login bằng BOT_PASSWORD trong .env), Về chỗ, Đi tới X Z, Đặt chỗ, lệnh nhanh /spawn /tpaccept /tpdeny; khung chat gộp chat + lệnh member (Activity) với tin bot nhận (nhắn riêng [A -> B], lời mời TPA, bị gọi tên, bị đá, chết); chọn bot rồi gõ để nói thay, gõ /lệnh để bot chạy lệnh (bot dịch chuyển thì tự nhận chỗ mới + vào lại cho khớp toạ độ). Bang Hội Chiến: mỗi bot tự chọn một khu riêng gần điểm warp (chỗ khô ráo, cách bot khác ≥12 ô; chết 2 lần ở một chỗ thì bỏ chỗ đó). Bot gửi gói tick_end 20 lần/giây (không có thì Grim báo TickTimer); trả keep-alive sau 45–60 ms (ping Tab ~52 ms thay vì 0), xếp hàng đúng thứ tự nhận (sai thứ tự Paper ngắt kết nối, log ghi Timed out); mỗi lần xuất hiện được đặt chế độ Sinh tồn + tắt /god (29/10: bot ở phòng ẩn kín, chỉ ra khu an toàn; 27–28/10 từng để Sáng tạo + /god vì bot đứng đất hoang bị quái giết). PHÒNG ẨN + ĐI DẠO (29/10): mọi bot đứng phòng đá kín ~(11150, −41, −3100), xa mọi warp > 500 khối; DuckyMoMoCore bot-hide chặn gói hiện bot trong phòng (tên vẫn ở TAB) → MSPT 26–32 → ~5 ms. Trang Bot: Gom vào phòng ẩn / Trả về chỗ cũ (homeOld), công tắc đi dạo: có người THẬT trong 35 khối quanh spawn / warp trade / warp shop thì 1–2 bot /spawn hoặc /warp tới (người mới tới: trong 30–60 giây), đi lang thang 1,5–4 phút, ghé NPC giả vờ giao dịch (nhìn, vung tay, không mở menu), hết lượt /back về phòng. Bot có grim.exempt (chủ server đồng ý; không có thì Grim kéo lùi mỗi bước + báo admin). Giáp theo tài nguyên: panel bot_gear_sync (cấp ×2 + xu + giờ chơi, bot-giap.json). Pet (29/10): panel bot_pet_sync, ~2/3 bot, loại + tên cố định theo tên bot, cấp theo tài nguyên (chỉ tăng), petadmin create rồi lượt sau petadmin exp/name (bot-pet.json); cấp pet mọi nơi tính theo MyPet CalculationMode Default (7 + ⌊(i−1)·3,5⌋/cấp). 35 bot (29/10 thêm 12: TuanAnh_2k7, minhkhoa09, Bao_Ngoc, HuyHoang_VN, kieutrang, Dat_Pro, QuynhAnh27, longnguyen99, TienDung_, Hieu_Gaming, NgocHan2k8, Phat_Lee), phòng ẩn lưới 7×7. Thay phiên online (trang Bot, /state/rotate.json): mục tiêu 25–31 đổi mỗi 15–50 phút (đêm thấp, tối cao), chỉnh 1 bot / 2–8 phút, đủ thì đổi ca. Hồ sơ bot có dòng Tiến độ (lượt gần nhất / 24 giờ / từ lúc ghi; bot-phattrien.json ls, 60 lượt). Số người ở danh sách server: plugin proxy DuckyMoMoSkin (BotCount) hỏi botfarm mỗi 15 giây, cộng số bot online vào số người; rê chuột vào số người KHÔNG hiện tên ai (27/10 chủ server: ẩn cả người thật lẫn bot). Quyền: duckymomo.web.bot (toàn quyền có sẵn). Trang Bot ghi nhãn \"Ở spawn\" khi bot đứng trong 16 ô quanh spawn (bot mới tạo hết điểm gợi ý thì tự ra khu ngẫu nhiên); bấm tên bot trong khung chat để chọn bot đó mà nói. Bot tự chat với nhau (bật / tắt + khoảng phút ở đầu trang Bot, mặc định tắt, lưu data/botfarm/chat.json): cứ vài phút 2–3 bot cùng server nói một đoạn soạn sẵn trong botfarm/app.js (TALKS: chuyện vặt, mẹo đúng; không hẹn gặp / rủ đi đâu, không nói chuyện nạp tiền), gõ chậm như người, mỗi bot một kiểu gõ (có dấu / không dấu / viết thường), đêm 1–7 giờ im; nút Chat thử cho nói ngay. Dơi tích dần trong hang quanh chỗ bot đứng (27/10: 4.400 con): botfarm 10 phút một lần xoá dơi trong 160 ô quanh mỗi bot, trừ dơi trong 48 ô quanh người thật. Bot nhận địa hình 2 chunk (viewDistance tiny: mặc định 12 làm botfarm phình 4 GB rồi sập 27/10 22:51); DuckyMoMoCore BotView đặt riêng cho bot (IP 10.30.x.x) simulation / view distance 2 (config bot-view.*): 22 bot rải 22 khu từng làm Bang Hội Chiến nạp ~5.600 chunk, MSPT ~45. QUÁI QUANH BOT (29/10, spark: TPS 11–14, ~16.000 thực thể): bot đứng yên làm quái sinh quanh mình, lang thang ra vòng chunk nạp-nhưng-không-chạy (ngoài simulation-distance, cả dưới hang sâu) rồi đông cứng mãi (không tự biến mất). BotView: bot setAffectsSpawning(false) (bản Paper này không chặn được sinh quái), chặn CreatureSpawnEvent NATURAL ở world/nether/end khi không có người THẬT trong 128 khối, và mỗi phút (khi có bot online) gỡ quái thù địch + dơi thường (getRemoveWhenFarAway, không tên, không cưỡi) không có người thật trong 128 khối (đúng luật biến mất của game). Sau sửa: MSPT ~31, TPS 20, ~1.500 thực thể. Đừng dùng Entity#isPersistent để lọc (Bukkit nghĩa là lưu cùng chunk, đúng với mọi quái). 29/10: data/banghoi-1/spigot.yml entity-activation-range.raiders 64 → 48 (KHÔNG có trong repo, máy mới phải sửa tay): hộp rà kích hoạt thực thể của mỗi người chơi (kể cả bot) lấy theo tầm lớn nhất, 64 → 48 làm phần ActivationRange 18,8% → 11,3%, MSPT trung vị ~37 → ~25 ms; cướp làng cách người chơi 48–64 khối chỉ cập nhật thưa (raid vẫn bình thường). Đã cân nhắc và BỎ: per-player-mob-spawns false (farm quái thất thường, giới hạn chung có thể phình vì bot), tick-inactive-villagers false (farm sắt / nông dân dừng khi người chơi đi xa). Trạng thái data/botfarm/bots.json. Nhật ký thao tác: web-thaotac."]
      - ["Bot: tạo quá khứ + tắt dịch vụ không lộ (28/10)", "Nút Tạo quá khứ (trang Bot): mỗi bot đang tự phát triển được giả lập 0–40 giờ đã chơi theo tính cách (40×rand^1.7: nhiều bot ít, vài bot nhiều), áp MỘT lần (bot-phattrien.json quakhu=xong), bot offline chờ tới khi vào Bang Hội Chiến. Botfarm tắt (SIGTERM) cho bot thoát dần từng con 3–15 giây (gracefulStop, compose stop_grace_period 6m) — 28/10 dựng lại botfarm làm 21 bot mất kết nối cùng giây khi có người thật online = lộ bot. KHÔNG dựng lại botfarm khi có người thật, hỏi chủ server trước."]
      - ["Thị trấn không công khai mặc định (28/10)", "Chủ server: thị trấn mới KHÔNG công khai (Towny settings/config.yml town.default_public false, file chỉ ở data/): người ngoài không /t spawn tới điểm hồi sinh thị trấn khác (trước đó 30 xu là tới); thị trưởng muốn mở thì /t toggle public. KinhDo vẫn công khai. 3 thị trấn bot đã tắt công khai (ta town <t> toggle public). 29/10 (chủ server: thêm town để /t list đông, 1 town chỉ 1 bot): tools/bot-town-new.py <Tên>:<vùng rtp>:<bot> … tạo thị trấn 1 bot (chọn đất liền trong vùng /tpr cách thị trấn khác ≥ 200 khối, dời bot tới, /ta town new, nạp quỹ 15.000 xu = ~5 tháng phí 100 xu/ngày, bot về phòng ẩn; tạm tắt thay phiên online khi chạy). Đã tạo 8: XomTre (Duc_Anh), LangMai (NamPro2k8), SuoiBac (Tuan_Kiet), RungTram (KhoiNguyen), DoiCheXanh (Phuong_Vy), HonDaoNho (kieutrang), BenSuong (Minh_Tuan), DongLua (Bao_Khang): 12 thị trấn tất cả, 1 ô đất trống, không công khai. Bán Đảo Mưa, Đảo Rừng Già gần như toàn biển (không đặt được). Gần kinh đô (vòng hoà bình) Towny không cho lập."]
      - ["Thân nhiệt /nhietdo (28/10)", "BodyTemp.java (Bang Hội Chiến, config body-temp). Chủ server: thời tiết khắc nghiệt, mang vật giữ ấm / mát, đá giữ nhiệt, ô cho mùa mưa; chốt giữ 2 mùa mưa/khô + đợt, phạt vừa (không chết), cả thế giới thường. Mỗi giây: môi trường = nhiệt nền (seasons.list.<mùa>.temperature mưa 24 / khô 30; đợt seasons.events.retdam mùa mưa ngày 3–4 nền 4 + ép mưa, nangnong mùa khô ngày 5–6 nền 40 + ép nắng; Seasons.temperature()) + (nhiệt quần xã − 0.8)×biome-scale + đêm −night / nắng +sun (ô che 1/3) + nước −water + ướt (−ướt/10, tối đa −10) + giáp da leather-per-piece/món, dưới mái (getHighestBlockYAt > mắt, cả tán cây) kéo shelter về comfort-mid, lửa (cả lửa bật lửa: trên đất thường tắt sau vài giây, trên đá địa ngục cháy mãi)/lửa trại/lò đang cháy/dung nham/vạc dung nham (magma 0,6; không cộng dồn, lấy nguồn mạnh nhất; đuốc/đèn không tính) trong source-radius +heat-source, đang bốc cháy cũng tính như sát lửa, băng/tuyết −cold-source. Thân nhiệt đuổi theo body-rate/giây, đi xa mức dễ chịu thì nhân 1 + accel × lệch/10° (càng lạnh càng tụt nhanh; quay về thì tốc độ thường), lưu PDC người chơi. Ướt: dầm mưa không mái/ô +rain-wet %/s, xuống nước +25, khô dần (nhanh cạnh lửa). Ngưỡng: < cold lạnh (đóng băng màn hình setFreezeTicks < 140 nên game không tự gây sát thương, Slowness, đói nhanh), < freezing rét cóng (+mất damage máu mỗi damage-every giây, dừng ở min-health), > hot nóng (Weakness, đói nhanh), > scorching nóng bỏng (+Slowness, mất máu). Thanh boss hiện khi gần/ngoài ngưỡng hoặc ướt ≥ 30%. Đá Ôn Linh: công thức không theo hình 4 Đá hoặc Đá trơn + 4 đá lửa + 1 sắt, gốc FLINT (PDC daonlinh = nhiệt đá, item_model đổi magma_block/packed_ice/smooth_stone theo nhiệt; không dùng làm đá lửa trong công thức khác), cạnh lửa nóng tới stone-hot, cạnh băng lạnh tới stone-cold, ngoài ra nguội về môi trường (stone-hold-seconds); trong túi thì kéo môi trường về dễ chịu (stone-strength, không vượt comfort-mid ±2). Ô lá: Lá Nhỏ Giọt (BIG_DRIPLEAF) cầm tay bất kỳ: không ướt khi mưa, đỡ nắng; thêm công thức 3 lá cây + 2 que ra «Ô Lá» (PDC ola, tên + mô tả + lấp lánh, không đặt xuống được). Ăn: súp ấm +food-warm, dưa hấu/quả mọng/nước/mật ong mát. KHU AN TOÀN (29/10): đất thị trấn (safe-towns, Towny getTown) + trong safe-warp-radius (48) khối quanh mỗi warp Essentials (đọc plugins/Essentials/warps lúc bật): thân nhiệt + ướt đứng yên, không phạt, thanh xanh «Khu an toàn». Miễn: bot botfarm (BotView.isBot), giờ chơi < newbie-hours, creative/spectator, thế giới ngoài worlds. Admin: /nhietdo cho <người> [độ], /nhietdo dat <người> <độ>. Cài đặt › Bang Hội Chiến › Thế giới › Thân nhiệt (khoá tn_*, cả nhiệt nền mùa và ngày đợt Rét đậm / Nắng nóng)."]
      - ["Thông báo đẩy về điện thoại (PWA, 29/10)", "Trang quản trị › Theo dõi › Thông báo (/thongbao, quyền hethong; ngoài: https://app.goc6.io.vn/mc/caidat/thongbao). Giống app goc6: Web Push VAPID (panel/thongbao.py + sw.js + manifest.webmanifest, pywebpush). iPhone (iOS 16.4+): Safari › Chia sẻ › Thêm vào Màn hình chính, mở app DuckyMoMo, vào Thông báo bấm Bật. Mỗi máy tự chọn: vaora (người THẬT vào / rời network qua proxy, bỏ bot + staff helper/mod/quanly/admin/builder; lần đầu vào ghi rõ, ra kèm số phút), chat (chat người thật), suco (server không phản hồi 2 phút liền / hoạt động lại, TPS Bang Hội < 15 suốt ~3 phút (30 phút báo 1 lần), botfarm rớt ≥ 8 bot trong 1 phút). Đọc data/activity/activity.jsonl (3 giây), kiểm server 60 giây. Lưu: data/panel/push-vapid.pem (khoá riêng, không commit), push-subs.json (máy đăng ký), push-log.json (50 thông báo gần nhất hiện trên trang). sw.js / manifest / icon công khai (không đăng nhập)."]
      - ["Ẩn giáp /angiap (28/10)", "ArmorHide.java (Bang Hội Chiến, config armor-hide {enabled, combat-seconds 15}): bật/tắt; người KHÁC thấy skin, không thấy giáp (Player#sendEquipmentChange gửi ô giáp trống tới người đang thấy mình, gửi lại mỗi giây + khi giáp đổi + khi có người mới thấy), giáp vẫn bảo vệ; gửi cả cho chính người đó (chủ server 28/10: ẩn hết) nên F5 và ô giáp trong túi đồ trông trống, /caidat cảnh báo. Chủ server chốt: bật là lúc nào cũng ẩn (cả PvP, đất hoang), CHỈ khi công thành (SiegeWarHook.battleActive + trong vùng vây) giáp hiện. Không cần plugin / mod / resource pack. Bedrock (Geyser) chưa kiểm chứng. Đang ẩn thì SAU TÊN trên đầu (TAB tagsuffix groups.yml, %dmmgiap_tren%; 30/10 chuyển từ dòng dưới tên vì Bedrock không thấy dòng dưới tên kiểu mới) hiện SET Thợ Rèn bậc cao nhất đang mặc (tho-ren.sets.<id>.bac: 1 nghề, 2 Tân Thủ, 3 Chuyên Cần, 4 Chiến Binh, 5 U Linh, 6 Tinh Anh, 7 Cao Cấp, 8 Huyền Thoại, 9 Thần Thoại, 10 Thần Thánh; cùng bậc thì nhiều món hơn), vd '[Thần Thánh +0]' (cấp = món thấp nhất; ThoRen.wornSet; chủ server: tên món không nói lên gì vì ai cũng có đồ kim cương) để PvP vẫn biết sức đối thủ. Trạng thái = công tắc 'angiap' ở /caidat (PlayerSettings meta LuckPerms, cũng có ở trang cài đặt web), /angiap đổi cùng công tắc."]
      - ["Ẩn giáp: món sắp hỏng không ẩn (30/10)", "armor-hide.warn-percent (10): món giáp còn ≤ 10% độ bền (Damageable, bỏ qua đồ không mòn) thì không ẩn, cả trong túi đồ của mình lẫn với người khác (ArmorHidePackets.SHOW: bit ô 1 mũ 2 áo 4 quần 8 giày, kiểm mỗi giây); lần đầu hiện thì nhắc trong chat sửa bằng đe / phù phép Sửa chữa; sửa xong tự ẩn lại. Lý do (chủ server): ẩn giáp thì trong túi đồ không thấy đồ để biết mà sửa. 0 = tắt. Chỉ chạy khi có PacketEvents (cách cũ không đổi)."]
      - ["Tài khoản tin cậy giữ đăng nhập 24 giờ (28/10)", "AuthTrust.java (sảnh, config lobby/plugins/DuckyMoMoCore/config.yml auth-trust {enabled, hours 24, players [Itrap]}): người trong danh sách vào lại CÙNG IP trong vòng 24 giờ kể từ lần đăng nhập trước thì AuthMe tự đăng nhập (forceLogin qua reflection). Mọi người khác vẫn sessions.timeout 60 phút (chủ server chốt; KHÔNG đổi timeout chung). Thêm tên: sửa players rồi khởi động lại sảnh."]
      - ["Quyền staff lấy đồ người khác (28/10)", "Itrap: essentials.invsee.modify (lấy đồ khi /invsee), essentials.enderchest + .others + .modify (/ec <tên>), duckymomo.balo.xem (quyền riêng mới: /balo xem <tên> [số] không cần duckymomo.admin; Backpack.java). Túi admin (nhóm admin có *) có essentials.invsee.preventmodify nên staff xem được nhưng không lấy được — cố ý."]
      - ["Nút Thị trấn cho bot (trang Bot, 28/10)", "Nút Thị trấn ở từng bot (cả khi offline): chọn thị trấn đang có để vào / đổi, hoặc rời (ta town <cũ> kick + ta town <mới> add qua bot_profile_save chỉ với mục thitran). Bot đang là thị trưởng thì nên đổi trong game. Đã sửa lỗi: lưu hồ sơ thiếu mục nghe từng làm bot mất nghề (jobs fireall)."]
      - ["Bot nhận thêm đất (28/10)", "tools/bot-claim.py <thị trấn> <thị trưởng> <số ô>: tp thị trưởng tới ô liền kề (ngẫu nhiên) cho bot tự /t claim, xong về nhà. Luật đất theo dân hoạt động (town-rules.land-per-active-resident) trừ đất của dân ở thị trấn < 3 ngày, nên bot mới vào phải được tặng suất trước: ta givebonus <thị trấn> <số> (suất tính cả ô gốc; phần admin tặng không bị luật trừ). Đã: LamPhong 4 ô, VongNguyet 5 ô, DoiGio 3 ô. Mỗi thị trấn chỉ thị trưởng đứng trong nhà; dân khác đứng khu ngẫu nhiên ngoài thế giới."]
      - ["Nhà bot trong thị trấn (28/10)", "tools/bot-nha.py <thị trấn> <thị trưởng> [thành viên…]: ô homeblock 16×16 chia lưới 2×2 nhà 5×5 (tối đa 4 bot), đo mặt đất bằng marker trên heightmap (đừng dùng /place: nhà lơ lửng trên map này), gỗ / mái / đồ đạc / màu giường ngẫu nhiên, đèn lồng trong nhà; tp bot vào rồi botfarm sethome (chỗ đứng mặc định trong nhà). Đã dựng cả 3: LamPhong (Linh_Chi, bachu_vn, Thu_Trang ~12260,-2140), VongNguyet (MaiAnh2k9, GiaBao_VN, NamVN123, QuangHuy_VN ~12744,-1289), DoiGio (ThanhDat99, HoangLong99, Lt_Nhung ~12407,-1609)."]
      - ["Bot TẠO MỚI tự có đủ tính năng (28/10)", "Tạo bot ở trang Bot: panel tự bật Tự phát triển (tính cách ngẫu nhiên), xếp hàng Tạo quá khứ (áp khi bot vào Bang Hội Chiến), cấp quyền mở chợ duckymomo.peace.admin ở lần treo bán đầu (chủ server đã đồng ý cho bot; LuckPerms cần bot đã vào game). Tự trả lời TPA, tpa rồi tự huỷ, tự chat là cài đặt chung nên tự áp. Thị trấn KHÔNG tự vào (thêm ở Hồ sơ bot nếu muốn)."]
      - ["Bot: thị trấn, chợ, làm lại quá khứ (28/10)", "Thị trấn bot (lập bằng tools tạm trong container panel, giãn thời gian như người): LamPhong (thị trưởng Linh_Chi; bachu_vn, Thu_Trang), VongNguyet (MaiAnh2k9; GiaBao_VN, NamVN123, QuangHuy_VN), DoiGio (ThanhDat99; HoangLong99, Lt_Nhung). Thị trưởng tự /t new + /confirm (Towny hỏi xác nhận), trả 3.000 xu, nạp quỹ 1.500–3.000; thành viên thêm bằng ta town <t> add. Bot đứng trong vòng kinh đô không lập được. Chợ đen: _bot_market treo 1–3 món theo tính cách, giá 1,2–2,2 lần /sell, cần quyền duckymomo.peace.admin (chủ server đồng ý 28/10, đã cấp cho 23 bot; bot mới tạo thì cấp tay). Đặt đồ lên tay bằng minecraft:item (item trần bị Essentials chiếm). bot_dev_past(reset=True) làm lại quá khứ từ đầu (đã hạ Duc_Anh, HoangLong99, NamPro2k8, Thu_Trang, Minh_Tuan). Cấp nghề bot tự nhớ (nghe_lv) vì Jobs ghi DB theo chu kỳ."]
      - ["Bot tự phát triển (trang Bot, 28/10)", "Nút Tự phát triển ở từng bot (+ Tự phát triển tất cả / Tắt). Bật thì bot được gán NGẪU NHIÊN tính cách (Thợ mỏ, Nông dân, Chiến binh, Ngư dân, Tiều phu, Thương nhân, Lai rai: nghề Jobs, 2 kỹ năng chính, xu/giờ, điểm hạ gục/giờ, thành tích hay làm) + chăm 30–100% + độ đều điểm danh + hệ số may + thói quen tiêu xu. Luồng nền panel (bot_dev_loop, 5 phút/lần) xét từng bot tới lượt riêng 25–70 phút, CHỈ khi bot online ở Bang Hội Chiến: cộng giờ chơi, xu (có tăng có giảm: tiêu thường ngày có lúc hơn số vừa kiếm, thỉnh thoảng mua món lớn 10–45% số dư, thương nhân hay vớ mối lớn), điểm hạ gục, nghề (chậm dần), kỹ năng, điểm danh (có ngày quên), thành tích (bộ đếm mô phỏng so với mục tiêu config), Thăng Cấp khi đủ xu/giờ/điểm (trừ xu như thật), danh phận khi đủ giờ + cấp. Áp qua Hồ sơ bot (lệnh admin). Trạng thái data/panel/bot-phattrien.json (không trong git); nhãn tính cách dưới tên bot, rê chuột xem lần cập nhật gần nhất."]
      - ["Bot tpa người chơi rồi tự huỷ (trang Bot, 28/10)", "Ô Bot thỉnh thoảng tpa người chơi rồi tự huỷ (botfarm /state/tpa-gia.json, mặc định tắt): cả server ~1 lần / 40–90 phút (đêm 1–7 giờ im), chọn bot đang ở Bang Hội Chiến + người THẬT trong danh sách Tab (không phải bot), một người tối đa 1 lần / 3 giờ, một bot 1 lần / 4 giờ; /tpa rồi 3–15 giây /tpacancel. Người kia lỡ nhận: Essentials teleport-delay 5 giây, bot nhảy + /tpacancel là huỷ (dodgeTeleport). Đếm giới hạn nằm trong bộ nhớ botfarm (dựng lại thì đếm lại)."]
      - ["Bot tự trả lời TPA (trang Bot, 28/10)", "Ô Bot tự trả lời TPA (botfarm /state/tpa.json, mặc định tắt). Có /tpa tới bot: bot KHÔNG BAO GIỜ nhận (chủ server: nhận thì lộ bot); sau 4–25 giây /tpdeny hoặc lơ cho hết hạn theo tỉ lệ riêng (state[bot].tpa.tuchoi 40–90% từ chối, còn lại lơ). Bạn vẫn bấm tay được trước khi bot tự trả lời."]
      - ["Bot chết giả + hoạt động giả theo giờ chơi (trang Bot, 30/10)", "Chết giả: botfarm (chetCfg, /state/chet-gia.json, nút trang Bot: Bot thỉnh thoảng chết giả / Chết thử; action chetcfg, chetnow) ~1 lần / 35–80 phút ở Bang Hội Chiến khi có người thật online, đêm 1–7 giờ im, một bot ≤ 1 lần / 6 giờ; gọi core /dmm chetgia <bot> (BotFake.java: tin tử vong translatable như thật, gửi người bật tuvong; có người thật trong 96 khối quanh bot thì thôi), sau đó bot than 1 câu hợp kiểu chết (70%), 35% bot khác đáp. Hệ số giả: config bot-gia.muc (giờ chơi < 1 giờ ×1, < 4 giờ ×0,5, < 12 giờ ×0,2, từ 12 giờ = 0: thôi giả); /dmm botgia trả hệ số cả server (người mới nhất online; không ai = 1) + từng người. Áp cho: bot tự chat, chết giả, bot trả lời câu đố (cả server), tpa giả và đi dạo (theo người bị nhắm). Chat thử / Đi dạo thử / Chết thử bỏ qua hệ số."]
      - ["Botfarm quá tải CPU (30/10)", "Triệu chứng: trang Bot báo \"Dịch vụ bot không trả lời (timed out)\", số online ở danh sách server lúc có lúc không cộng bot (proxy BotCount hỏi /bots mỗi 15 giây, quá hạn thì cộng 0). Đo (kill -USR1 1 trong container + CPU profile): Node một luồng 50–98% CPU, ~14% gói player_info (mineflayer quét mọi thực thể + dựng tên hiển thị cho từng người × mỗi bot), ~8% vật lý bot đứng yên. Sửa trong botfarm/app.js: lightPlayerInfo (giữ tên/uuid/ping/listed, tên hiển thị lưu thô giải mã khi cần), physicsEnabled false mặc định, bật khi đi dạo / né TPA, sau dịch chuyển đặt onGround = true. Có hiệu lực khi dựng lại botfarm. Proxy BotCount: hỏi lỗi thì giữ số bot lần trước tối đa 2 phút, quá hạn 8 giây (có hiệu lực khi khởi động lại proxy + relay)."]
      - ["Bot thay phiên theo phiên chơi + hiện vào/ra (30/10)", "Chủ server: bot thoát im lặng sợ bị nghi. Trước: đủ mục tiêu thì 10–20 phút đổi ca một bot (mỗi bot online ~5,5 giờ liền, ~4 lượt/giờ, không tin). Giờ (botfarm/app.js): mỗi lượt vào bot có phiên ngẫu nhiên 50–240 phút (lệch ngắn, trung bình ~2 giờ); hết phiên thì thoát, 1–6 phút sau bot nghỉ lâu nhất vào thay; ~22 bot online -> ~11 ra + 11 vào mỗi giờ. Lượt ra/vào theo phiên gỡ quyền duckymomo.vaora.an trước để hiện [+]/[-] như người thật, vào xong 30 giây cấp lại (mặc định im: dựng lại botfarm, bị đá… không hiện hàng loạt). Thoát: 45% bot chào (không câu gắn giờ giấc), bot vừa nói chuyện cùng trong 45 phút đáp 75% (không có thì 30% một bot bất kỳ đáp); đêm 1–7 giờ không chào."]
      - ["Bot mua đồ /ah (30/10)", "BotAh.java (API zAuctionHouse: AuctionManager.purchaseItem như người thật bấm mua; build-core.sh chép jar vào network-core/libs), config bot-ah. Mỗi 20–60 phút (× hệ số bot-gia của người bán; đêm 1–7 nghỉ) xét món đang treo của người THẬT đang online, treo ≥ 15 phút, tiền vault. Định giá: Tinh Luyện = giá bán Tinh Luyện; đồ thường trơn = Essentials worth.yml × số lượng; đồ set / thư viện / phù phép / có tên / shulker: không mua. Mua khi 0,5 × giá trị ≤ giá ≤ 1,5 × giá trị, giá trị ≥ 50, giá ≤ 5.000. Hạn mức chống lách giới hạn bán cho server: mỗi người bán 2 món + 3.000 xu/ngày, cả server 15.000 xu/ngày (botah.yml, ngày giờ VN). Bot thiếu tiền được nạp đủ. Đồ mua nằm trong mục đã mua của bot (zAH xoá sau 1 tuần). /dmm botah: tình trạng; /dmm botah thu: mua thử ngay (bỏ hẹn giờ + hệ số). Log: Bot mua /ah:."]
      - ["Hồ sơ bot (trang Bot, 28/10)", "Nút Hồ sơ ở từng bot: đặt xu (eco set), Thăng Cấp (capdo dat), điểm hạ gục (capdo diem), giờ chơi thật (hoatdong them, tính chênh lệch), danh phận (danhphan dat, bot phải online ở Bang Hội Chiến), nghề Jobs Reborn + cấp (jobs fireall/employ/level set), cấp 6 kỹ năng AuraSkills (skills skill setlevel, bot phải online), số ngày điểm danh (diemdanh dat), thành tích đã đạt (thanhtich dat, lặng: không quà xu, không báo server), thị trấn (ta town <cũ> kick + ta town <mới> add). Chỉ mục đổi mới chạy lệnh (RCON vào banghoi-1). Bot phải từng vào Bang Hội Chiến một lần. Mục đích: số liệu giống người chơi thật để bot không lộ trên bảng xếp hạng, /bal, Tab."]
      - ["Chạy lệnh từ trang Hoạt động", "Trang quản trị > Hoạt động người chơi, ô gửi tin: gõ bắt đầu bằng / (vd /fly Itrap) là chạy như console trên server đang chọn (phải chọn một server, không chạy cho cả mạng), phản hồi hiện ngay dưới ô. Chỉ tài khoản toàn quyền; lệnh stop/reload/op/ban/lp… hỏi xác nhận. Mỗi lệnh ghi vào dòng Hoạt động (loại Admin) + nhật ký web."]
      - ["Đăng nhập web bằng tài khoản game", "Trang web có nút Đăng nhập (taikhoan.html): người chơi xem rank, hạn rank, tiền, giờ chơi, điểm danh, nhiệm vụ, vé quay, vote, thị trấn, lệnh mình dùng được. CHỈ đăng nhập bằng mã 6 số từ /web (dùng 1 lần, 1 giờ), web không nhận mật khẩu. Staff mở trang quản trị NGAY TRÊN TRANG WEB, chỉ thấy phần có quyền (modes/_network/web-quyen.yml; cấp quyền ở trang Role > Trang quản trị web); quyền quản trị 12 giờ sau khi nhập mã, hết thì /web lại. Sai 5 lần khoá tên 15 phút; mỗi lần đăng nhập web báo vào game cho chủ tài khoản. Có thẻ Chơi lại từ đầu (/choilai): hiện số lần còn, ngày phải chờ, có quà không; bấm nút thì server hỏi xác nhận TRONG GAME (phải online ở Bang Hội Chiến). Nhật ký đăng nhập + thao tác: data/panel/web-thaotac.jsonl"]
      - ["Trước khi khởi động lại (BẮT BUỘC)", "1) Kiểm ai online bằng lệnh RIÊNG (không gộp với lệnh restart): for s in lobby banghoi-1 practice-1; do docker compose exec -T $s rcon-cli minecraft:list; done (hoặc trang Hệ thống). Có người thì DỪNG, báo trước trong game (/broadcast) rồi chờ. 2) Khởi động lại đúng server cần: docker compose restart banghoi-1 (đổi jar/biến môi trường mới cần docker compose up -d <server>). 3) Xem log tới dòng Done: docker logs -f duckymomo-banghoi-1-1. Lobby/practice phải thấy DuckyMoMoCore bật (không NoClassDefFound). 4) Có khởi động lại / tạo lại PROXY thì PHẢI tạo lại relay: docker compose --profile tunnel up -d --force-recreate relay, rồi docker exec duckymomo-relay-1 wg show phải có latest handshake. 5) DuckyMoMo, tram6, goc6 luôn phải chạy"]
      - ["Mở Mùa 1 (khi mở server cho người chơi)", "Cài đặt › Bang Hội Chiến › Bảng xếp hạng: Ngày bắt đầu mùa (leaderboard.season-start, yyyy-mm-dd). Đặt ngày thì: Cổng Hoang tự đặt cổng (4 cổng, 7 ngày thêm 1), tuần mùa bắt đầu đếm (Kiến Trúc Sư tuần 12/13, tuần nhân đôi 13), Thăng Cấp làm lại nếu keep-on-new-season tắt, kỹ năng AuraSkills làm lại khi người chơi vào (aura-skills.reset-each-season). Trước đó: đặt Quảng trường Danh vọng ở sảnh (/vinhdanh dat), NPC chương 1 (/npc create Già Làng, Bác Thợ Rèn, Người Gác Cổng), NPC cửa hàng (/dmm shopnpc), NPC /tpr (/dmm rtpnpc), kiểm tra TEST-CHECKLIST. Hết mùa: /bxh dongmua → 3 ngày khiếu nại → /bxh traothuong → /vinhdanh chot"]
      - ["Người chơi báo mất đồ / bị phá nhà", "1) Hỏi GIỜ, CHỖ (toạ độ F3), tên nghi phạm. 2) Đứng ở chỗ đó: /co i rồi bấm khối/rương xem ai đặt, phá, lấy. Hoặc /co lookup u:<tên> t:2h r:20 (Vd: /co lookup u:Ga t:3h r:15 a:container). 3) Hoàn tác: /co rollback u:<tên> t:2h r:20 (thử /co rollback ... #preview trước). Lỡ tay: /co restore với cùng tham số. 4) Chết rơi đồ do lỗi server: chỉ trả nếu log xác nhận (data/banghoi-1/logs/latest.log); dùng /dmm laydo từ thư viện đồ hoặc /give, ghi lại vào nhật ký. 5) Bị lừa ngoài /trade: không trả (luật đã ghi trong cẩm nang)"]
      - ["Nghi hack / bị kick nhầm", "/grim alerts bật cảnh báo. Xem lịch sử: docker logs duckymomo-banghoi-1-1 | grep -i grim. Người bị kick nhầm (lag, Bedrock): kiểm ping (/ping <tên> nếu có, hoặc TAB), không phạt khi chỉ có 1 cảnh báo lẻ. X-ray: /co lookup u:<tên> a:-block b:diamond_ore t:1d xem tỉ lệ đào kim cương"]
      - ["Phát quà / bồi thường nhanh", "Tiền: /eco give <tên> <xu> (Vd: /eco give Linh 500). Bùa bắt pet: /buabatpet give <tên> [số]. Vé gacha: /gacha give <tên> <mã máy> [số]. Bản đồ kho báu: /khobau give <tên>. Đồ trong thư viện: /dmm laydo <mã> (Tab gợi ý). Sách vượt cấp: /dmm sach <phù phép> <cấp> <tên>. Ghi lại lý do trong Discord staff để tránh phát trùng"]
      - ["Sửa cẩm nang trong game (/huongdan)", "Trang quản trị › Cẩm nang game (sửa, lưu là chép sang 3 server, có hiệu lực ngay) hoặc sửa modes/_network/huongdan.yml rồi ./ops/huongdan.sh. Plugin TỰ ngắt dòng và sang trang (13 dòng/trang); trang dài bị cắt sang trang sau không tiêu đề nên chia trang khoảng 12 dòng. Mục lục chỉ 1 trang: tối đa ~11 chương, tên ≤ 17 chữ. Không đổi mã batdau / banghoi / practice (chương mở mặc định). Số liệu (giá, phí, lịch) GHI TAY: đổi ở Cài đặt thì sửa luôn cẩm nang. Màu: &0 &1 &2 &4 &5 &6 &8, tránh &e &f &a (nền giấy khó đọc)"]
      - ["Hội đồng Hoà Bình & Tổ chức (admin)", "Không có lệnh admin riêng: tự chạy theo phiếu. Dữ liệu plugins/DuckyMoMoCore/hoidong.yml (đại diện, bầu cử, kiến nghị K1, K2…) và tochuc.yml (tổ chức, quỹ, giấy phép, sự kiện S1, S2…). Sửa tay CHỈ khi server tắt (plugin giữ dữ liệu trong bộ nhớ, lưu đè). Giấy phép = nhóm LuckPerms giayphep-thuonghoi / giayphep-sukien (server=banghoi-1); thu hồi khẩn cấp: /lp user <tên> parent remove giayphep-thuonghoi server=banghoi-1, rồi cho Hội Bàn Tròn ra kiến nghị THUHOI để dữ liệu khớp. Cài đặt: council.* (nhiệm kỳ 30 ngày, bầu 2 ngày, tối đa 2 nhiệm kỳ, kiến nghị 3 ngày, ≥3 dân hoạt động mới có phiếu), organizations.* (3 người, 300 xu/tuần, 3 suất Thương Hội, 2 suất Sự kiện, rao 60 phút/lần, điểm dịch chuyển sự kiện 24 giờ)"]
      - ["Việt hoá plugin (tools/vi)", "Đã Việt hoá: Essentials, Towny, SiegeWar, QuickShop, EvenMoreFish, Duels, zAuctionHouse, Shopkeepers, TradePro, CrazyEnchantments (cả 105 phù phép), SimplePets, GrimAC, Sonar, AuraSkills, BetonQuest, zMenu, OldCombatMechanics, uJobs… Plugin cập nhật mà lòi tiếng Anh: chạy trong image panel (có ruamel): docker run --rm -u $(id -u):$(id -g) -e PANEL_PASSWORD=x -v $PWD/tools:/t:ro -v <thư mục file>:/f --entrypoint python3 duckymomo-panel /t/vi/yamlvi.py dump /f/messages.yml → dịch → apply /f/messages.yml <bandich.json> (tự kiểm biến {x} %x% <x>; --no-angle nếu <x> chỉ là cú pháp lệnh). Bản dịch có sẵn ở tools/vi/bandich/*.json (apply lại được). Riêng: essentials.py, towny.py, quickshop.py, evenmorefish.py, crazyenchantments.py, auraskills-vi.py. Sau khi sửa: lệnh reload của plugin (Vd: ah admin reload, tradepro reload) hoặc khởi động lại; file do trang Cài đặt quản lý chỉ sửa trong data/, không chép vào repo. Giữ nguyên tên lệnh tiếng Anh (/t, /ah…)"]
      - ["Bảo mật & chống hack (rà 19/10)", "ĐANG CÓ: Sonar ở proxy (chống bot dồn kết nối), AuthMe bcrypt + captcha sau 3 lần sai + cấm IP 30 phút sau 10 lần sai + kick khi sai, phiên tự đăng nhập chỉ 60 phút cùng IP (CGNAT 4G/quán net dùng chung IP: đừng để dài), AuthMeVelocity chặn đổi server/lệnh/chat trước khi đăng nhập, Velocity modern forwarding (server con không mở cổng ra ngoài, không giả tên được), Bedrock xác thực Xbox qua Floodgate (tên có dấu chấm, Java không giả được), GrimAC (Bang Hội Chiến, Practice), anti-xray Paper, giới hạn gói tin/sách/tên đồ của Paper, server Sáng Tạo lọc đồ tự chế (chỉ số, phù phép vượt cấp, trứng có dữ liệu, thuốc tự chế, đồ > 8 KB → đổi bản trơn, ghi log). Không ai là OP (admin dùng LuckPerms nhóm admin). WEB: đăng nhập chỉ bằng mã /web (6 số SecureRandom, 1 lần, hết hạn 60 phút), sai 5 lần/tên hoặc 20 lần/IP trong 15 phút thì khoá 15 phút, IP thật lấy từ CF-Connecting-IP (trước 19/10 mọi người chung IP 172.20.0.1); mọi thao tác lấy tên từ phiên phía server, giá donate do server tính, CSRF chặn bằng Origin/Sec-Fetch-Site, cookie HttpOnly + SameSite, panel chỉ qua Trạm 6 (đăng nhập) + Basic auth, /quantri kiểm quyền LuckPerms từng lần. Mật khẩu .env 32–64 ký tự, chưa từng commit. KHI BỊ TẤN CÔNG: bot dồn vào → /sonar verbose, xem docker logs duckymomo-proxy-1; dò mật khẩu 1 tài khoản → /authme password <tên> <mk mới> rồi báo chủ tài khoản; nghi tài khoản bị chiếm → /co lookup u:<tên> t:1d, /lp user <tên> parent info, /ban; web bị spam đăng nhập → xem data/panel/web-thaotac.jsonl (cột ip). Xem thêm docs/HANDOFF.md mục rà bảo mật 19/10"]
  - title: Người chơi mới cần biết
    items:
      - ["Đăng ký / đăng nhập", "Lần đầu: /register <mật khẩu> <mật khẩu> · lần sau: /login <mật khẩu>"]
      - ["Chọn chế độ", "Bấm la bàn ở sảnh hoặc /menu (điện thoại: hiện bảng nút bấm)"]
      - ["Cẩm nang trong game", "/huongdan — sửa nội dung: modes/_network/huongdan.yml rồi ./ops/huongdan.sh (có hiệu lực ngay)"]
      - ["Bang Hội Chiến", "/warp để đi các địa danh · /tpr <khu> tìm đất hoang · /t new <tên> lập thị trấn (cần 3 giờ chơi thật, 3.000 xu) · /jobs xem nghề · /cuahang hoặc /sell <tên món> bán đồ · /choden chợ đen (dùng ở đâu cũng được) · /trade <tên> đổi đồ an toàn"]
      - ["Không thích đánh nhau", "Vào thị trấn trong Liên minh Hoà Bình (/hoabinh): không bị vây, không PvP; đổi lại không đánh trận. Thị trưởng hoà bình bầu Hội đồng (/hoidong), dân lập Thương Hội / Tổ chức Sự kiện (/tochuc)"]
      - ["Mỗi ngày nên làm", "/diemdanh (xu + vé Gacha Điểm Danh + quà mốc 7/14/30 ngày) · /gacha (quay bằng vé; vé Chăm Chỉ mỗi 60 phút chơi thật) · /nhiemvu (3 nhiệm vụ) · /vote (150 xu/lượt)"]
      - ["Lên cấp, kỹ năng, cốt truyện", "/capdo (thăng cấp, cộng điểm thuộc tính, mua đặc quyền bằng xu) · /skills (6 kỹ năng nghề, tối đa cấp 20) · tìm Già Làng ở spawn (chương 1) · /lukhach · /dungeon · /thanhtich"]
      - ["Lưu ý quan trọng", "Thoát game lúc giao tranh = chết rơi đồ · đồ dưới đất dọn mỗi 10 phút · hết quỹ thị trấn thì tan · tối đa 2 tài khoản (khai /taikhoanphu) · /choilai mất hết (phải dỡ shop, rút hàng Chợ đen trước) · đừng đưa mã /web cho ai"]
      - ["Rank donate", "/rank xem các bậc, giá, cách mua (22/10: tước có thêm balo + chờ dịch chuyển; câu \"chỉ trang trí / không bán sức mạnh\" đã bỏ khỏi web và game. 29/10 chủ server cho phép pay-to-win; quyền lợi: balo Nam 2×27 · Tử 2×36 · Bá 3×36 · Hầu 3×45 · Công 4×54, dịch chuyển Nam/Tử/Bá 3 giây · Hầu/Công 2 giây, đổi skin + tủ 3/5/8/12/20 skin (Công thêm /skin url), kho pet chiến đấu MyPet 1–5, pet trang trí Tử mèo · Bá +13 loài · Hầu + loài hiếm · Công mọi pet kể cả loài quái, hạt 1/2/3/6, chat/nick màu, /hat, /disposal (/trash); tiện ích 29/10 (quyền server=banghoi-1): Nam /wb, Tử /anvil, Bá /ec (Backpack chặn /ec khi vừa đánh người 15 giây / trong vùng vây giờ đánh, như balo), Hầu /feed (Essentials command-cooldowns feed 600 giây); riêng Công Tước (chủ server chọn 29/10): /bay (TownFly.java: bay trong đất thị trấn MÌNH, quyền duckymomo.bay, tự tắt khi ra khỏi thị trấn / vừa đánh người town-fly.combat-seconds / trong vùng vây giờ đánh / không phải sinh tồn, lần rơi khi bị tắt không mất máu; chỉ tắt bay do module bật, /fly Essentials của staff không đụng) và /fix (essentials.repair, chỉ món đang cầm, hồi chiêu 3600 giây repair + fix; TownFly chặn đồ có mã Thư viện đồ: set Thợ Rèn, đồ đặc biệt); mô tả ở Cài đặt › Toàn mạng › Rank donate (tierN_perks, chữ) phải khớp quyền thật ở trang Role). /rank mua hiện QR trên bản đồ trong tay"]
  - title: Địa chỉ vào server
    items:
      - ["Máy tính (Java)", "mc.goc6.io.vn (không cần cổng) — bản 1.13 tới mới nhất"]
      - ["Điện thoại (Bedrock)", "mc.goc6.io.vn cổng 19132 (mặc định)"]
      - ["playit (đã bỏ 19/10)", "Chủ server bỏ playit: mọi người vào qua cổng VPS (giữ IP thật). Container playit + playit-watchdog đã xoá, tunnel/compose.yaml đã gỡ. Muốn dùng lại: lấy tunnel/ từ git (trước commit bỏ playit) và TẮT phiên đăng nhập AuthMe (playit làm mọi người chung 1 IP)."]

plugins:
  # ---------------------------------------------------------------- Đăng nhập & kết nối
  - name: Velocity (proxy)
    jar: "-"
    kind: Đăng nhập & kết nối
    purpose: Cổng vào chung của cả network, chuyển người chơi giữa lobby, Bang Hội Chiến, practice. Không phải plugin, là phần mềm proxy.
    player:
      - ["/server <tên>", "Chuyển sang server khác (lobby, banghoi-1, practice-1)"]
    admin:
      - ["/glist", "Ai đang ở server nào"]
      - ["/send <tên> <server>", "Đưa người chơi sang server khác"]
    settings: "proxy/config/velocity.toml"
  - name: AuthMe
    jar: AuthMe
    kind: Đăng nhập & kết nối
    purpose: Đăng ký / đăng nhập bằng mật khẩu (server chạy offline mode). Chưa đăng nhập thì không rời sảnh được. Người chơi Bedrock tự đăng nhập.
    player:
      - ["/register <mk> <mk>", "Đăng ký lần đầu"]
      - ["/login <mk>", "Đăng nhập"]
      - ["/changepassword <mk cũ> <mk mới>", "Đổi mật khẩu"]
      - ["/logout", "Đăng xuất"]
    admin:
      - ["/authme unregister <tên>", "Xoá đăng ký (người chơi quên mật khẩu)"]
      - ["/authme password <tên> <mk>", "Đặt lại mật khẩu cho người chơi"]
      - ["/authme reload", "Nạp lại cấu hình"]
    settings: "lobby/plugins/AuthMe/config.yml"
    notes: "19/10: phiên tự đăng nhập rút từ 1 ngày xuống 60 phút (chung IP 4G/quán net → người khác gõ đúng tên trong thời hạn là vào), sai 3 lần phải /captcha <mã>, sai 10 lần cấm IP 30 phút, cấm mật khẩu dễ (123456, matkhau…, danh sách unsafePasswords). Người chơi quên mật khẩu: /authme password <tên> <mk mới>. Lưu ý: protectInventory (ẩn túi đồ trước khi đăng nhập) đang tự tắt vì sảnh chưa có PacketEvents — sảnh không có đồ giá trị nên chấp nhận"
  - name: Geyser + Floodgate
    jar: floodgate
    kind: Đăng nhập & kết nối
    purpose: Cho người chơi Bedrock (điện thoại, console) vào server Java. Floodgate ở các server con để nhận ra người Bedrock (menu nút bấm, chống hack).
    player:
      - ["(không cần lệnh)", "Điện thoại vào địa chỉ Bedrock ở trên; tên có dấu chấm đầu, ví dụ .griim7833"]
    admin:
      - ["/geyser reload", "Nạp lại Geyser (trên proxy)"]
    settings: "proxy/plugins/Geyser-Velocity, */plugins/floodgate/config.yml"
    notes: "NetherNet (bật 19/10, BẮT BUỘC từ Bedrock 26.60 ngày 27/10/2026, RakNet bị bỏ): Geyser transport both, webrtc-port 19133 (UDP), signaling builtin TCP 19132, advertise-addresses = IP VPS 125.212.218.74 (đổi VPS thì sửa ở proxy/plugins/Geyser-Velocity/config.yml rồi tạo lại proxy + relay). VPS mở bằng ./ops/nethernet.sh vps. Người chơi vẫn nhập mc.goc6.io.vn cổng 19132; lần đầu hiện hỏi tin tưởng máy chủ (chưa có HTTPS). Lỗi điện thoại không vào được: xem docker logs duckymomo-proxy-1 | grep -i -E 'nethernet|webrtc|signal', kiểm VPS iptables -t nat -S MC_RELAY và relay ip rule (pref 304, 305)"
  - name: SkinsRestorer
    jar: SkinsRestorer
    kind: Đăng nhập & kết nối
    purpose: "Hiện skin cho người chơi offline mode (tự lấy skin theo tên tài khoản Mojang; trùng tên người khác thì mặc skin người đó, đổi bằng /skin). Menu /skins: 93 skin gợi ý + skin riêng của server. Skin theo rank (18/10): perSkinPermissions BẬT (proxy/config/plugins/skinsrestorer/config.yml, đã đồng ý luật: chỉ bán skin server tự làm, không bắt trả tiền để dùng skin của chính mình). Nhóm default có skinsrestorer.skin.* + skinsrestorer.ownskin (mọi skin thường miễn phí); skin độc quyền: CÁCH NHANH trong game: /rank skin them <bậc> <tên> <link .png> (sửa LuckPerms ngay: default false, bậc đó true, bậc cao kế thừa) rồi bấm nút [Bấm để tạo skin] (chạy /sr createcustom ở proxy); bỏ khoá: /rank skin xoa <tên>; xem: /rank skin. Hoặc Cài đặt › Rank donate › Bậc N: skin độc quyền (donate-ranks.tiers[].skins), sảnh (skin-sync: true) đồng bộ lúc khởi động. /rank đọc danh sách thẳng từ LuckPerms. Người thiếu bậc thấy ô khoá trong /skins. Đổi skin chờ 30 giây (skinsrestorer.bypasscooldown để bỏ)."
    player:
      - ["/skin set <tên Mojang>", "Đổi skin theo tên"]
      - ["/skin clear", "Bỏ skin"]
      - ["/skins", "Mở kho skin (menu chọn skin)"]
      - ["/skin url <link .png>", "Đổi skin bằng ảnh (minecraftskins.com, namemc.com, planetminecraft.com, novaskin.me)"]
      - ["/skin update", "Lấy lại skin mới nhất của tài khoản Mojang (sau khi đổi trên minecraft.net)"]
    admin:
      - ["/sr reload", "Nạp lại"]
      - ["/sr createcustom <tên> <link .png>", "Tạo skin riêng của server (hiện ở mục custom của /skins); gán cho rank ở Cài đặt › Rank donate"]
    notes: "Cài ở proxy VÀ mọi server con (cùng bản 15.12.6, link ghim trong PLUGINS của từng compose). Thiếu ở server con thì /skins chỉ báo 'Opening the skins menu' mà không mở menu (menu là kho đồ, chỉ server con mở được). Server con tự nhận chế độ proxy (proxyMode AUTO)."
  - name: Sonar (chống bot)
    jar: Sonar
    kind: Đăng nhập & kết nối
    purpose: Chống nhồi bot ở proxy. Xếp hàng người mới vào, tối đa 20 người/IP; khi phát hiện người mới vào dồn dập (bị tấn công) thì bắt người mới qua bài kiểm tra rơi/va chạm (đạt thì bị kick 1 lần, vào lại là xong). Bedrock không bị kiểm tra. Không chặn được DDoS làm nghẽn mạng (cần giấu IP nhà bằng playit hoặc VPS).
    admin:
      - ["/sonar stats", "Số người đang chờ, đã xác minh, bị chặn"]
      - ["/sonar verbose", "Bật/tắt dòng theo dõi tấn công trên thanh hành động"]
      - ["/sonar notify", "Bật/tắt thông báo khi bị tấn công"]
      - ["/sonar blacklist remove <IP>", "Gỡ chặn IP bị nhầm"]
      - ["/sonar verified remove <IP>", "Bắt một IP kiểm tra lại"]
      - ["/sonar reload", "Nạp lại cấu hình"]
    settings: proxy/plugins/sonar/config.yml (chép vào data/proxy khi proxy khởi động lại)
    notes: "Lệnh /sonar gõ ở console proxy (proxy chưa có LuckPerms nên trong game chưa ai có quyền sonar.*). Danh sách đã xác minh lưu trong RAM, khởi động lại proxy thì mất (không sao vì chỉ kiểm tra khi bị tấn công)."
  - name: ViaVersion + ViaBackwards + ViaRewind
    jar: ViaVersion
    kind: Đăng nhập & kết nối
    purpose: Cho client nhiều phiên bản vào (1.13 tới mới nhất). Bản 1.12 trở xuống bị proxy chặn (đã chốt).
    admin:
      - ["/viaver list", "Ai đang dùng phiên bản nào"]

  # ---------------------------------------------------------------- Quản lý
  - name: LuckPerms
    jar: LuckPerms
    kind: Quản lý
    purpose: "Quyền và nhóm (role, rank donate), dùng chung toàn network (lưu MariaDB, đồng bộ Redis). Cài cả ở PROXY (18/10, LuckPerms-Velocity 5.5.71, proxy/config/plugins/luckperms/config.yml, server context \"proxy\") để plugin proxy (SkinsRestorer) đọc quyền rank. LƯU Ý mc-proxy: thêm plugin vào PLUGINS hoặc thêm biến CFG_ thì phải \"docker compose up -d proxy\" (restart không nhận biến mới); file trong proxy/config có ${CFG_...} chỉ được điền khi chép sang data/proxy, mà file đích đã có và mới hơn thì KHÔNG chép lại → lỡ chép thiếu biến thì xoá file trong data/proxy/plugins/... rồi up -d --force-recreate proxy."
    admin:
      - ["/lp user <tên> info", "Xem nhóm, quyền của người chơi"]
      - ["/lp user <tên> parent add <nhóm>", "Thêm vào nhóm (helper, mod, admin, builder)"]
      - ["/lp user <tên> parent remove <nhóm>", "Bỏ khỏi nhóm"]
      - ["/lp user <tên> promote staff", "Thăng chức Helper → Mod → Admin"]
      - ["/lp user <tên> demote staff", "Giáng chức"]
      - ["/lp editor", "Mở trình sửa quyền trên web"]
    settings: "Rank donate: dùng /rank (DuckyMoMoCore), không cấp tay bằng lp. Danh sách quyền rank: tools/donate-ranks.cmds"
    notes: "Role: Dân (mặc định), Builder, Helper, Mod, Admin. Rank donate: 5 tước vị, track donate. 29/10: nhóm default bị tắt bukkit.command.plugins + bukkit.command.version (ẩn /pl, /plugins, /version, /about với người chơi; admin bật lại riêng)."
  - name: DuckyMoMoCore
    jar: DuckyMoMoCore
    kind: Quản lý
    purpose: "Plugin riêng của DuckyMoMo: menu chọn chế độ, rank donate, thông báo vào/ra, lọc chat (từ tục, spam, chặn quảng cáo tên miền/IP: chat-filter.ads, cho phép goc6.io.vn), chat có prefix ở sảnh, rơi khỏi đảo về spawn, dọn rác, dịch chuyển ngẫu nhiên /tpr (NPC ở spawn), luật chiến tranh (PvP đất hoang bật/tắt, giờ chơi thật tối thiểu để được phong quân hàm, tài khoản phụ), giờ chơi thật, luật đất đai Towny (lập thị trấn/quốc gia, vòng spawn, chờ đổi thị trấn, đất theo dân hoạt động, quốc gia cần 2 thị trấn mới cắm cờ), chơi lại /choilai, Hội đồng Hoà Bình, tổ chức và giấy phép, Hội Bàn Tròn và án, bảng xếp hạng và danh hiệu, cửa hàng trang trí, Liên minh Hoà Bình (/hoabinh: đất lan liền kề, giá tăng dần, phí bảo hộ, /ah chỉ trong đất hoà bình, /sell ở kinh đô +10% (21/10, trước 20%), shop rương miễn thuế, báo vây thành cho dân hoà bình, vùng vây trên bản đồ web), chống đặt-phá lấy tiền nghề, ranh giới thị trấn trên bản đồ web, menu nút bấm cho Bedrock."
    player:
      - ["/menu", "Mở menu chọn chế độ (ở sảnh)"]
      - ["/huongdan [chương] · /hd", "Cẩm nang trong game (sách; điện thoại: bảng nút). Chương: batdau, luat, banghoi, thitran, congthanh, kinhte, khampha, pet, hangngay, practice, hotro. Vd: /hd pet (máy tính: báo số trang của chương)"]
      - ["/rank", "Xem các bậc rank donate, giá, rank của mình"]
      - ["/web · /dangnhapweb", "Lấy mã 6 số đăng nhập trang web (dùng 1 lần, hết hạn sau 1 giờ: web-login.code-minutes, Cài đặt › Đăng nhập trang web). Đây là cách đăng nhập web duy nhất, không có mật khẩu web"]
      - ["/hoatdong · /giochoi", "Bang Hội Chiến: xem giờ chơi thật (không tính AFK) và có phải dân hoạt động không"]
      - ["/taikhoanphu khai <chính> · xacnhan <phụ>", "Bang Hội Chiến: tự khai tài khoản phụ (tối đa 2 tài khoản/người); tài khoản phụ không nhận quân hàm, không đánh trận"]
      - ["/choilai · /choilai xacnhan", "Bang Hội Chiến: chơi lại từ đầu (mất đồ, tiền, nhà, nghề, thị trấn; giữ rank, danh hiệu, án). 7 ngày/lần, 3 lần/mùa, quà tân thủ chỉ lần đầu. Phải dỡ shop rương, rút hàng Chợ đen (/choden cuatoi) trước"]
      - ["/hoabinh · vao · roi · danhsach", "Bang Hội Chiến: Liên minh Hoà Bình (thị trưởng đưa thị trấn vào/ra; vào chờ 2 ngày mới hoà bình, rời 14 ngày mới vào lại; thị trấn cách đất liên minh tối đa peace-alliance.join-max-distance = 8 ô thì vào được, vào rồi (cùng quốc gia, Towny bỏ giới hạn 5 ô) /t claim nối đất sang; hoà bình chỉ bật khi đất nối liền tới kinh đô + đủ ngày chờ, /hoabinh danhsach ghi 'chờ nối đất'. 21/10: trước đây bắt phải chạm đất ngay nên không ai vào được vì Towny cấm đất cách thị trấn khác dưới 5 ô)"]
      - ["/hoidong · ungcu · bau <tên> · phieu <mã> co|khong · baimien · deuoi <thị trấn> <lý do>", "Hội đồng Hoà Bình: dân hoà bình ứng cử, thị trưởng (thị trấn >= 3 dân hoạt động) bầu đại diện và bỏ phiếu kiến nghị"]
      - ["/tochuc lap thuonghoi|sukien <tên> · moi · vao · roi · gop <tiền> · xinphep · danhsach", "Tổ chức của dân hoà bình; đủ 3 người xin giấy phép, Hội đồng Hoà Bình duyệt, phí 300 xu/tuần từ quỹ"]
      - ["/quangcao <nội dung>", "Thương Hội có giấy phép rao hàng toàn server, 1 lần mỗi giờ"]
      - ["/sukien · den <mã> · tao <phút> <tên> · thuong <người> <tiền> · dautruong · ket", "Xem và tới sự kiện; Tổ chức Sự kiện có giấy phép tạo sự kiện, trao thưởng từ quỹ, mở đấu trường (đánh không mất đồ)"]
      - ["/bantron · xu <mã> <mức> · lichsu · vu <mã> · toi · datban · chon <thị trấn> · suthan <tên> · khangan <mã> <bằng chứng> · kiennghi ...", "Hội Bàn Tròn: lịch họp, vụ án giết dân hoà bình, bỏ phiếu tại chỗ (phải đứng gần bàn tròn), kháng án, kiến nghị trừ điểm / thu hồi giấy phép. /an = /bantron"]
      - ["/bxh [chienthan|phuho|kientruc|quocgia <tên>]", "Bảng xếp hạng mùa: Bá Chủ, Chiến Thần, Đại Phú Hộ, Kiến Trúc Sư"]
      - ["/binhchon dangky · xem <thị trấn> · <thị trấn>", "Giải Kiến Trúc Sư: thị trưởng đăng ký từ tuần 12 của mùa (leaderboard.register-week, thị trấn phải đặt điểm về), người chơi (>= 5 giờ, không phải acc phụ, không bầu thị trấn mình) bỏ 1 phiếu trong tuần 13 (vote-week). Vd: /binhchon xem HaNoi · /binhchon HaNoi"]
      - ["/danhhieu · chon <mã> · tat", "Danh hiệu (giữ qua các mùa): giành bằng bảng xếp hạng hoặc mua ở /cuahang"]
      - ["/danhphan · /balo [số]", "Bang Hội Chiến: danh phận (rank chơi miễn phí, bấm nhận khi đủ giờ chơi thật / cấp / cốt truyện) và balo cá nhân 27 ô theo danh phận. Admin: /danhphan dat <người> <mã> · dongbo, /balo xem <tên> [số]"]
      - ["/tinhluyen · ban [tatca] · ds", "Bang Hội Chiến: Tinh Luyện, đổi một chiều 64 khối (than, sắt thô, kim cương…) thành món tinh luyện để trade ở shop dân làng, làm nguyên liệu Xưởng, bán cho server. Admin: /tinhluyen give <mã> [số] [người]"]
      - ["/cuahang (hoặc /shop)", "30/10: /shop là lệnh tắt của /cuahang (data/banghoi-1/commands.yml aliases, thay alias shop của QuickShop; shop rương vẫn /qs); member không có rank thì có dòng bấm tới /warp shop. Cửa hàng Kinh Đô: vật liệu cơ bản (đất, đá, cát, kính… 64 cái), đồ trang trí, danh hiệu, trả bằng xu. Mọi người bấm NPC ở khu shop tại spawn; rank ủng hộ gõ /cuahang nhưng chỉ khi đứng trong kinh đô"]
      - ["/tpr [khu] · /rtp", "Bang Hội Chiến: dịch chuyển ngẫu nhiên tới đất hoang (không menu thì mở menu chọn khu; NPC dân làng ở spawn cũng mở menu này). Khu: taybac, lao, trungbo, nambo, thailan, myanmar, namtq, ngaunhien"]
      - ["/tpr chỉ thả chỗ lập được thị trấn (30/10)", "rtp.town-ready (mặc định true): ngoài vòng town-rules.reserved-spawn-radius quanh kinh đô và đủ xa thị trấn khác theo đúng Towny (TownySettings min_plot_distance_from_town_plot 5 ô, max(min_distance_between_homeblocks 10, min_distance_from_town_homeblock 5) ô từ ô trung tâm; kiểm trước khi nạp chunk, mỗi lượt bốc 40 toạ độ). Lý do: town-buffer 32 khối nhỏ hơn khoảng cách Towny nên /rtp hay thả chỗ /t new báo \"quá gần thị trấn khác\" (cogainamay thử ~20 lần); ước tính lúc đó chỉ 19% (Bắc Sơn Lĩnh) / 10% (Rừng Lam) chỗ lập được vì 11 thị trấn bot nằm gần kinh đô. Vòng kinh đô (town-rules.reserved-spawn-radius 300): 30/10 chủ server chốt là ĐẤT CẤM lập thị trấn (luật PeaceAlliance \"sát đất Liên minh\" chặn nhau với khoảng cách Towny ≥ 5 ô nên vốn không lập được); TownRules chặn /t new|create trong vòng ngay ở lệnh với câu dễ hiểu + gợi ý /tpr (admin bypass vẫn lập được)."]
      - ["Cửa hàng Kinh Đô: Shift + trái mua cả chồng (30/10)", "DecorShop.buyStack: Shift + chuột trái trên món vật liệu thường = mua đủ 64 món (ceil(64 / số món mỗi gói) gói, giá nhân theo), bớt lại cho vừa chỗ trống trong túi và số tiền đang có (không rơi đồ ra đất). Danh hiệu, món Thư viện, món không xếp chồng: Shift vẫn mua 1 gói. Lore món có dòng Shift + Chuột trái kèm giá."]
      - ["Màu tiền tố rank ủng hộ (30/10)", "Chủ server: Tử Tước trùng màu Dân (cả khung). 5 tước dùng màu hex riêng + ⚜: Nam đồng &#9C6B3C/&#E3A869, Tử bạc &#6F8FAF/&#C9DDF0, Bá tím &#7D55C7/&#C6A2FF, Hầu hồng ngọc &#C2416F/&#FF9AC1, Công khung đỏ chữ vàng &#B22222/&#FFD27A (sửa ở Cài đặt › Rank ủng hộ, tier0..4_prefix, ghi LuckPerms). Màu thường gần hết đã trùng danh phận / staff nên phải dùng hex. EssentialsX chat + TAB đọc được &#RRGGBB; core từ 30/10 đọc hex ở ChatFormat (chat sảnh), DonateRanks (dòng vào/ra), PlayRanks, Tip, InfoMenu. Chỉ áp màu SAU khi mọi server chạy bản core mới (bản cũ hiện nguyên chữ &#…)."]
    admin:
      - ["/rank give <tên> <bậc> <tháng>", "Cấp rank donate (gia hạn cộng dồn)"]
      - ["/rank check <tên>", "Xem rank và hạn"]
      - ["/rank remove <tên>", "Gỡ rank donate"]
      - ["/dmm clean", "Dọn rác ngay"]
      - ["/dmm enchant <phù phép> <cấp>", "Phù phép VƯỢT CẤP món đang cầm (vd sharpness 30, efficiency 20; cấp 0 = gỡ; tối đa over-enchant.max-level = 50)"]
      - ["/dmm sach <phù phép> <cấp> [người]", "Tạo sách vượt cấp tặng người chơi đang online; người chơi ghép bằng đe giữ nguyên cấp. Chỉ làm phần thưởng / hàng trong game, KHÔNG bán lấy tiền thật"]
      - ["/dmm reload", "Nạp lại config"]
      - ["/hoatdong <tên>", "Xem giờ chơi thật của người khác"]
      - ["EliteMobs: cấp chiến đấu + elite ngoài đất hoang (28/10)", "EliteMobs 10 tính sức mạnh theo CẤP CHIẾN ĐẤU (trung bình kỹ năng vũ khí + giáp, luyện bằng hạ elite), đồ kim cương không tăng cấp (đo thử: full kim cương / netherite vẫn cấp 1). Người mới (TyninWorld) bỏ sau 2 phút vì dungeon thấp nhất ~cấp 10 mà không có chỗ luyện. Đã: bật doNaturalEliteMobSpawning (3% quái tự nhiên thành elite, chủ server giảm từ 5%, cấp theo người chơi gần đó, KHÔNG dùng theo khoảng cách vì /tpr thả xa); /dungeon ghi Cấp chiến đấu bạn / cần (placeholder %elitemobs_player_combat_level%, DungeonGate.combatLevel); /hd trang CẤP CHIẾN ĐẤU; dịch [EM] Enter $dungeon! + 28 tên quái elite sang tên vi_vn chính thức (Bộ Xương, Người Ender… bản trước ở scratchpad phiên). File data/.../EliteMobs/MobCombatSettings.yml + translations/vietnamese.csv KHÔNG trong git. Elite rơi xu (Vault, currencyShowerTierMultiplier 0.3 — chủ server giảm từ 0.6 ngày 28/10): theo dõi lạm phát."]
      - ["Kinh đô KinhDo mở cửa (28/10)", "Chủ server cho người mới /t join KinhDo làm dân hoà bình. Đã: /ta town KinhDo toggle open + set perm resident build off, destroy off (dân chỉ switch, itemuse trên đất chung; đất kinh đô rộng hơn vùng WorldGuard spawn nên KHÔNG được bật lại build/destroy cho dân). Thị trưởng NPC2. Lưu ở data/.../Towny (không trong git)."]
      - ["/dmm hoabinh setup", "Lập Liên minh Hoà Bình lần đầu: đứng giữa spawn, tạo kinh đô KinhDo (thị trưởng NPC), quốc gia LienMinhHoaBinh, bật hoà bình"]
      - ["/bxh dongmua · traothuong · hologram", "Đóng mùa (khoá điểm, 3 ngày khiếu nại ở Hội Bàn Tròn), trao danh hiệu; hologram = hướng dẫn tạo hologram bảng xếp hạng. Dòng riêng cho từng người xem: %dmm_toi_chienthan% (vd 12 điểm (#3)), %dmm_toi_bachu% (quốc gia của mình + hạng). Hologram đã có thì thêm: /dh line add bxh_chienthan 1 &7Bạn: &f%dmm_toi_chienthan% · /dh line add bxh_bachu 1 &7Quốc gia bạn: &f%dmm_toi_bachu%"]
      - ["/dmm shopnpc [remove]", "Đặt NPC Cửa hàng Kinh Đô (dân làng + chữ nổi) tại chỗ đứng ở khu shop spawn; đặt lại thì NPC cũ bị xoá"]
      - ["/setjail nhatu", "Essentials: đặt nhà tù kinh đô (Hội Bàn Tròn phạt tù dùng tên này)"]
      - ["/dmm hoabinh claim <bán kính ô>", "Kinh đô chiếm đất quanh nhà chính (1 ô = 16 block; spawn hiện cần khoảng 14)"]
      - ["/dmm phu add <phụ> <chính> | remove <phụ> | list", "Ghi tài khoản phụ (Bang Hội Chiến): không được phong quân hàm, không gây sát thương trong vùng vây lúc có phiên. Lưu ở plugins/DuckyMoMoCore/taikhoanphu.yml"]
      - ["/dmm choilaiweb <tên>", "Chỉ console/RCON (nút Chơi lại từ đầu trên trang web): người chơi phải online ở Bang Hội Chiến, server mở bước xác nhận /choilai trong game; web không tự xoá gì"]
      - ["/dmm webma <tên> <mã>", "Chỉ console/RCON (trang web tự gọi để kiểm tra mã /web). Người chơi gõ thì luôn báo sai"]
      - ["/dmm thorennpc trungbay | chiduong", "30/10: Tủ Trưng Bày (chỉ xem đồ cấp cao nhất các set, sửa danh sách ở tho-ren.quay.trungbay.sets) và Lái Buôn Chỉ Đường (dân làng, menu điểm đến tho-ren.quay.chiduong.di, bấm = /warp). Đứng chỗ muốn đặt rồi gõ; gỡ: /dmm thorennpc remove <quầy>"]
      - ["/dmm bangtranh <tên> | xoa <tên> | capnhat", "30/10: treo ảnh lên tường bằng bản đồ trong khung phát sáng (BangTranh.java). Ảnh plugins/DuckyMoMoCore/bangtranh/<tên>.png, cạnh bội số 128 (bản mẫu modes/banghoi/server/plugins/DuckyMoMoCore/bangtranh/). Nhìn vào khối tường = góc dưới-trái, bảng mọc sang phải + lên. Bảng hướng dẫn người mới: huongdan (7x4), vẽ lại bằng python3 tools/bangtranh/ve-bang.py <client.jar> rồi chép vào 2 chỗ trên + /dmm bangtranh capnhat. Mã bản đồ lưu bangtranh.yml."]
      - ["/dmm minigame [xaotron|dienchu|daonguoc|toan|dayso|gonhanh|caudo]", "30/10 Đố vui trong chat (kho từ: words + ~750 tên vật phẩm tiếng Việt ngắn; toán, dãy số tự sinh; không lặp recent-memory câu). Bot (chat-games.bot-answer): chance 50% một câu có bot trả lời, muộn 20-55 giây, 30% đoán sai trước, người thật đúng trước thì bot im (ChatGames.java, config chat-games ở Bang Hội): tự ra câu mỗi interval-minutes phút khi có người thật online; ai gõ đúng đầu tiên trong timeout giây nhận reward-min..reward-max xu; đáp án không dấu cũng được, bot không tính. Thêm từ / câu / câu đố: chat-games.words, phrases, riddles (q + a[]). Lệnh này ra câu ngay."]
      - ["Chữ giữa màn hình, ngủ qua đêm, lệnh sai (30/10)", "ScreenNotify.java: chữ to ngắn + dòng phụ khi dịch chuyển xa (Tới nơi! + toạ độ, chỉ world chính / spawn), điểm danh, +1 vé gacha, lên cấp, lên danh phận, xong nhiệm vụ, thắng đố vui, vote; người chơi tắt ở /caidat › Chữ giữa màn hình (chugiua). SleepVote.java (config sleep): bot không tính khi ngủ, gamerule players_sleeping_percentage = sleep.percent (50), báo Đang ngủ để bỏ qua đêm [x/y]. Guide.java: gõ lệnh không có thì hiện Không có lệnh /x + nút [/huongdan]."]
      - ["Thi câu cá mỗi tối (30/10)", "Khu câu cá: /warp cauca (12532 64 -2480, trong đất Kinh Đô; WorldGuard vùng khucauca 12500,40,-2512 → 12564,120,-2448: không PvP / phá đặt khối / quái, cho đặt thuyền; menu › Máy chủ › Khu vực tiện ích và NPC Lái Buôn Chỉ Đường có nút tới). EvenMoreFish competitions/ (Bang Hội, bản mẫu modes/banghoi/server/plugins/EvenMoreFish/competitions): 20:30 T2/T5 thiCauNhieu (nhiều cá nhất), T3/T6 thiCauSuThi (đủ 3 cá Quý trước, giờ thi chỉ ra cá Quý), T4 thiCauTong (tổng chiều dài), 20:00 T7/CN thiCauCuoiTuan (cá dài nhất). 15 phút, thưởng 800/400/250 + 50 tham gia (cuối tuần 1500/750/450). Mở tay: /emfa competition start <id> <giây>. Sửa xong: /emfa reload."]
      - ["/pp (menu hiệu ứng hạt, 30/10)", "ParticleMenu.java: /pp hoặc /pp gui mở menu tiếng Việt thay menu gốc PlayerParticles: nhóm Vết chân (feet, move, trail), Vòng đầu (halo, overhead), Quanh thân (orbit, rings, spiral…), Cánh (wings, batman), Theo hành động (swords, blockbreak, fishing…) -> chọn kiểu -> chọn 21 loại hạt (trái tim, lửa, hoa anh đào…) = /pp add <hạt> <kiểu>. Gỡ: nút Gỡ hết (pp reset). Quyền do PlayerParticles kiểm: rank Tử Tước+ (playerparticles.style.* effect.*), hoặc món hat1 Cửa hàng Vàng. Các lệnh /pp khác giữ nguyên. Nút ở /menu › Người chơi."]
      - ["/dmm npcsanh <chế độ> | xoa <chế độ> (sảnh)", "30/10 LobbyNpcs.java: NPC chọn chế độ ở sảnh = thực thể Mannequin có skin (skinId SkinsRestorer recommendations.json, config lobby-npcs.modes ở lobby/plugins/DuckyMoMoCore/config.yml: banghoi knight, practice boy-fighting-sport, sangtao girl-wizzard, pokemon boy-axolotl), chữ nổi tên chế độ, phiên bản, gói tài nguyên, hỗ trợ Bedrock, số online (proxy PlayerCount mỗi 5 giây; closed = Sắp mở, beta = Thử nghiệm), hạt lửa linh hồn dưới chân. Bấm NPC = vào server (closed không vào, beta cần quyền). Đứng chỗ muốn rồi gõ, NPC quay theo hướng nhìn. Lưu npc-sanh.yml; NPC lưu vào thế giới, bản cũ tự dọn khi vùng nạp."]
      - ["Mật khẩu đăng ký (AuthMe sảnh, 30/10 tạm nới)", "Chủ server: vắng người thì bỏ mật khẩu khó. lobby/plugins/AuthMe/config.yml (bản mẫu) + data: allowedPasswordCharacters [!-~]* (cũ bắt chữ + số), minPasswordLength 4 (cũ 6), unsafePasswords chỉ còn help (danh sách cũ trong git trước commit 30/10). Câu báo lỗi messages_vn.yml đã sửa theo. Đông thì trả lại rồi /authme reload ở sảnh."]
      - ["GrimAC chỉ báo, không kéo (30/10)", "Chủ server chốt: Grim không kéo người chơi về (setback) nữa vì người dùng bản game khác server (ViaVersion) bị giật mỗi lần trúng đòn. data/banghoi-1/plugins/GrimAC/config.yml (không có bản mẫu): Simulation + Knockback immediate-setback-threshold -1, max-advantage -1; NoSlow, Explosion, TimerA, VehicleTimer setbackvl -1; Phase giữ setbackvl 1 (chống xuyên tường, hiếm báo nhầm). Grim vẫn báo admin (Grim » ... failed) + ghi log, punishments.yml chỉ alert/log, không kick. Xem cảnh báo, ai bị báo liên tục (Reach, Killaura, Fly...) thì admin tự xử. Trả lại chặn: chép bản cũ grim.bak (scratchpad phiên 30/10) hoặc đặt lại các số trên rồi /grim reload."]
      - ["/dmm dante dat|lua|goi|huy|manh <đàn>", "30/10 Đàn tế gọi boss (TeBoss.java, config te-boss ở Bang Hội): hammo (linhhon: hạ quái trong radius góp linh hồn), mohoang (levat: bấm đàn khi cầm vật phẩm trong items), huvuc (an: cầm 8 Mảnh Ấn Triệu Hồi rơi 2% từ quái thù địch), trotan (lua: thắp 4 lửa trại trong 60 giây, đặt lửa bằng /dmm dante lua <đàn> <1-4>). Đủ thì boss vanilla tăng máu xuất hiện, báo cả server; thưởng top1-3 theo sát thương + all cho người góp; nghỉ cooldown-minutes. Đặt đàn: nhìn vào khối /dmm dante dat <đàn>; KHÔNG đặt trong thị trấn tắt quái / vùng cấm quái. Thử: goi, đặt lại: huy, tặng mảnh: manh <người> <số>. Dữ liệu teboss.yml. Menu: /menu › Máy chủ › Dungeon & boss (Dungeon, Hầm Ngục tạm đóng, đàn tế)."]
      - ["/dmm rtpnpc [remove]", "Đặt NPC dịch chuyển ngẫu nhiên (dân làng + chữ nổi) tại chỗ đang đứng; đặt lại thì NPC cũ bị xoá; remove = xoá"]
      - ["/dmm decorate | structures start|pause|status", "Trang trí map / đặt công trình (dùng khi làm map mới)"]
    settings: "Trang Cài đặt: Toàn mạng (Chat, Rank donate, Sảnh), Bang Hội Chiến (Hệ thống; Thế giới: /tpr thời gian chờ, phí; Chiến tranh > Giai đoạn mùa và PvP). Danh sách khu /tpr: modes/banghoi/server/plugins/DuckyMoMoCore/config.yml mục rtp.zones"
