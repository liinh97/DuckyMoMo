# Tên và mô tả tiếng Việt cho phù phép CrazyEnchantments (CE). Khoá = tên trong plugins/CrazyEnchantments/Enchantments.yml.
# Dùng ở: trang quản trị > Thư viện đồ (ô chọn phù phép) và trang Cài đặt > Phù phép (bật/tắt CE).
# "Có cơ hội" = mỗi đòn/lần kích hoạt có tỉ lệ (tăng theo cấp, xem Chance-System trong Enchantments.yml).
# Phần tử thứ 3 (22/10, phù phép KHÔNG có tỉ lệ = luôn có tác dụng): tác dụng từng cấp, đọc từ code CrazyEnchantments 26.1.2
# (CrazyManager.getEnchantmentPotions: cấp thuốc = cấp phù phép ± 1; thuốc kiểu 1.8 của OldCombatMechanics: Sức mạnh +130%/cấp, Yếu -0,5).
# "Đồng minh": CE dựa vào plugin phe/nhóm; với Towny CHƯA kiểm chứng CE có nhận thị trấn/quốc gia là đồng minh hay không.
