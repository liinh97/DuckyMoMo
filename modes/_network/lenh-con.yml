# Lệnh ghi tay cho mục "Tất cả lệnh" của trang Cẩm nang (panel /camnang), gộp chung với danh sách server tự xuất:
#  - lệnh của proxy Velocity (dùng được ở mọi server, công cụ xuất lệnh không chạy trên proxy)
#  - lệnh con hay dùng của plugin lớn (danh sách tự xuất chỉ có lệnh gốc như /t, /co)
# Mỗi lệnh: [lệnh (không có /), mô tả, ai dùng được]. "ai" để trống = tự suy từ quyền như lệnh thường thì không làm được,
# nên ghi rõ: Mọi người / Thị trưởng / Vua / Từ helper / Từ mod / Chỉ admin / Console.
# Quyền thật xem trang Role (LuckPerms); quyền trong Towny theo hạng trong thị trấn (townyperms.yml).
# Plugin cập nhật đổi lệnh thì sửa ở đây.
groups:
  - plugin: Velocity (proxy)
    servers: [proxy]
    commands:
      - ["server", "Xem danh sách server / chuyển server (/server banghoi-1)", Mọi người]
      - ["glist", "Ai đang online ở từng server", Chỉ admin]
      - ["glist all", "Liệt kê tên người chơi theo server", Chỉ admin]
      - ["send <người|all|current> <server>", "Chuyển người chơi sang server khác", Chỉ admin]
      - ["velocity version", "Xem phiên bản proxy", Mọi người]
      - ["velocity plugins", "Danh sách plugin proxy", Chỉ admin]
      - ["velocity reload", "Nạp lại velocity.toml", Chỉ admin]
      - ["velocity dump", "Xuất thông tin gỡ lỗi", Chỉ admin]
      - ["shutdown", "Tắt proxy (dùng docker compose thay vì lệnh này)", Console]
  - plugin: SkinsRestorer (proxy)
    servers: [proxy]
    commands:
      - ["skin <tên>", "Lấy skin của một tài khoản Minecraft bản quyền", Mọi người]
      - ["skin set <tên|url>", "Đặt skin theo tên hoặc link ảnh", Mọi người]
      - ["skin url <link>", "Đặt skin từ link ảnh .png", Mọi người]
      - ["skin clear", "Bỏ skin, về mặc định", Mọi người]
      - ["skin update", "Cập nhật lại skin", Mọi người]
      - ["skins", "Menu chọn skin", Mọi người]
      - ["skin set <skin> <người>", "Đặt skin cho người khác", Chỉ admin]
      - ["sr reload", "Nạp lại cấu hình SkinsRestorer", Chỉ admin]
      - ["sr status", "Kiểm tra kết nối tới máy chủ skin", Chỉ admin]
      - ["sr drop <người|skin>", "Xoá dữ liệu skin đã lưu", Chỉ admin]
  - plugin: Sonar (proxy)
    servers: [proxy]
    commands:
      - ["sonar stats", "Thống kê chống bot (đang chờ, đã xác minh, bị chặn)", Console]
      - ["sonar verbose", "Theo dõi tấn công trên thanh hành động", Console]
      - ["sonar notify", "Bật/tắt thông báo khi bị tấn công", Console]
      - ["sonar blacklist remove <IP>", "Gỡ chặn IP", Console]
      - ["sonar verified remove <IP>", "Bắt IP kiểm tra lại", Console]
      - ["sonar reload", "Nạp lại cấu hình Sonar", Console]
  - plugin: Geyser (proxy)
    servers: [proxy]
    commands:
