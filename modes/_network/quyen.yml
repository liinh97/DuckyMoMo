# Danh mục quyền hay dùng cho trang Role (panel /role): tick để cấp cho role, bỏ tick để gỡ (lệnh lp group … permission).
# Thêm quyền: thêm một dòng [quyền, mô tả] hoặc [quyền, mô tả, giải thích chi tiết (hiện khi bấm nút i; \n = xuống dòng)]. Quyền không có trong danh mục vẫn thêm được ở ô "Thêm quyền khác" trên trang.
# Lưu ý: role cao KẾ THỪA role thấp (mod kế thừa helper, admin có tất cả '*'); quyền kế thừa hiện "(từ helper)".
# server mặc định khi tick: global = toàn mạng (sảnh, Bang Hội Chiến, practice).
groups:
  - title: Di chuyển
    perms:
      - [essentials.fly, "Bay (/fly)", "Cho gõ /fly để bật/tắt bay ở chế độ Sinh tồn.\nChỉ có ở Bang Hội Chiến và Practice (sảnh không cài Essentials).\nMất quyền này thì đang bay sẽ bị tắt bay ngay (trang Role tự gửi lệnh)."]
      - [essentials.gamemode, "Đổi chế độ chơi (/gamemode) — cần thêm quyền từng chế độ bên dưới", "Cho dùng lệnh /gamemode (/gm, /gmc…). Chỉ quyền này thì CHƯA đổi được chế độ nào: phải bật thêm từng chế độ bên dưới.\nVí dụ Builder: bật quyền này + Sáng tạo + Sinh tồn."]
      - [essentials.gamemode.creative, "  … chế độ Sáng tạo", "Được chuyển sang Sáng tạo (bay, đồ vô hạn). Cần cả quyền /gamemode ở trên.\nỞ Bang Hội Chiến nên cẩn thận: đồ lấy ở Sáng tạo mang sang Sinh tồn được."]
      - [essentials.gamemode.survival, "  … chế độ Sinh tồn", "Được chuyển về Sinh tồn. Cần cả quyền /gamemode ở trên."]
      - [essentials.gamemode.spectator, "  … chế độ Quan sát", "Được chuyển sang Quan sát (đi xuyên tường, vô hình). Hay dùng để theo dõi người nghi hack."]
      - [essentials.gamemode.adventure, "  … chế độ Phiêu lưu", "Được chuyển sang Phiêu lưu (không đặt/phá khối)."]
      - [essentials.speed, "Đổi tốc độ đi / bay (/speed)", "Cho gõ /speed <1-10> đổi tốc độ đi hoặc bay của chính mình. Mất quyền thì tốc độ trả về 1."]
      - [essentials.tp, "Dịch chuyển tới người khác (/tp)", "Cho gõ /tp <người> dịch chuyển thẳng tới người khác, KHÔNG cần họ đồng ý (khác /tpa của người chơi thường)."]
      - [essentials.tphere, "Kéo người khác tới mình (/tphere)", "Cho gõ /tphere <người> kéo người khác tới chỗ mình, không cần họ đồng ý."]
      - [essentials.back, "Quay lại chỗ cũ (/back)", "Cho gõ /back quay lại chỗ đứng trước lần dịch chuyển gần nhất (hoặc chỗ chết)."]
      - [essentials.top, "Lên mặt đất (/top)", "Cho gõ /top: dịch chuyển lên khối cao nhất ngay trên đầu (thoát hang)."]
      - [essentials.jump, "Nhảy tới chỗ đang nhìn (/jump)", "Cho gõ /jump: dịch chuyển tới khối đang nhìn."]
      - [essentials.teleport.timer.bypass, "Dịch chuyển ngay, không phải đứng chờ 3 giây", "Làm gì: /home, /spawn, /warp, /back, /tpa, /tpr đi ngay, không đếm ngược.\nMặc định: chỉ Admin (có qua *). Thời gian chờ chỉnh ở Cài đặt › Bang Hội Chiến › Thế giới › Dịch chuyển bằng lệnh."]
      - [essentials.teleport.timer.move, "Được di chuyển trong lúc chờ dịch chuyển", "Làm gì: đang đếm ngược mà bước đi thì KHÔNG bị huỷ (vẫn phải chờ đủ giây). Chỉ áp dụng lệnh Essentials, không áp dụng /tpr."]
      - [essentials.teleport.cooldown.bypass, "Không phải nghỉ giữa hai lần dịch chuyển", "Làm gì: bỏ qua \"Phải chờ giữa hai lần dịch chuyển\" (teleport-cooldown, hiện đang 0 = không giới hạn)."]
      - [duckymomo.rtp.bypass, "/tpr không phải chờ 5 phút giữa hai lần", "Làm gì: dùng /tpr liên tục, không bị thời gian chờ (mặc định 300 giây) và không phải đứng chờ 3 giây."]
      - [duckymomo.rtp.free, "/tpr miễn phí", "Làm gì: không bị trừ phí /tpr (hiện phí đang 0 nên chưa có tác dụng)."]
  - title: Quản lý người chơi
    perms:
      - [essentials.kick, "Kick (/kick)", "Cho gõ /kick <người> [lý do]: đá người chơi ra khỏi server, họ vào lại được ngay."]
      - [essentials.mute, "Cấm chat (/mute)", "Cho gõ /mute <người> [thời gian] [lý do]: cấm chat (vd /mute abc 30m spam). Không ghi thời gian = cấm tới khi gỡ."]
      - [essentials.tempban, "Ban có thời hạn (/tempban)", "Cho gõ /tempban <người> <thời gian> [lý do]: cấm vào server có thời hạn (vd 3d, 12h)."]
      - [essentials.ban, "Ban vĩnh viễn (/ban)", "Cho gõ /ban <người> [lý do]: cấm vào server vĩnh viễn tới khi /unban."]
      - [essentials.unban, "Gỡ ban (/unban)", "Cho gõ /unban <người>: gỡ cấm (cả vĩnh viễn lẫn có thời hạn)."]
      - [essentials.seen, "Xem lần cuối online, IP (/seen)", "Cho gõ /seen <người>: lần cuối online, đang ở đâu. Staff thấy cả IP (dùng để soi tài khoản phụ)."]
      - [essentials.invsee, "Xem túi đồ người khác (/invsee)", "Cho gõ /invsee <người>: mở túi đồ của người khác (xem và lấy/bỏ đồ được). Hay dùng điều tra đồ bất thường."]
      - [essentials.enderchest.others, "Xem rương ender người khác", "Cho mở rương ender của người khác (/ec <người>). Cần thêm quyền essentials.enderchest để gõ lệnh."]
      - [essentials.vanish, "Tàng hình (/vanish)", "Cho gõ /vanish: tàng hình với người chơi thường, không hiện trong danh sách Tab. Mất quyền thì tự hiện lại."]
      - [essentials.socialspy, "Đọc tin nhắn riêng của mọi người (/socialspy)", "Cho gõ /socialspy: đọc được mọi tin nhắn riêng (/msg) của người khác. Chỉ nên cho người đáng tin."]
      - [essentials.heal, "Hồi máu (/heal)", "Cho gõ /heal [người]: hồi đầy máu, hết lửa và hiệu ứng xấu. Ở Bang Hội Chiến là lợi thế PvP, đừng cho rank donate."]
      - [essentials.feed, "Hồi đói (/feed)", "Cho gõ /feed [người]: hồi đầy thanh đói."]
  - title: Voice chat (Simple Voice Chat)
    perms:
      - [voicechat.speak, "Nói trong voice (mặc định ai cũng có; đặt FALSE cho người bị phạt = cấm nói)", "Mặc định ai cũng có. Đặt CẤM (false) cho một role/người = không nói được trong voice (dùng để phạt).\nVoice chat chưa bật trên server."]
      - [voicechat.listen, "Nghe voice (mặc định ai cũng có)", "Mặc định ai cũng có. Cấm thì không nghe được ai."]
      - [voicechat.groups, "Vào nhóm voice (mặc định ai cũng có)", "Mặc định ai cũng có. Cho tạo/vào nhóm voice riêng (nói chuyện với nhau ở xa)."]
      - [voicechat.admin, "Kiểm tra kết nối voice của người khác (/voicechat test)", "Cho gõ /voicechat test <người>: kiểm tra người đó đã kết nối voice chưa."]
  - title: Xây dựng và bảo vệ
    perms:
      - [worldedit.*, "WorldEdit đầy đủ (//set, //copy, //paste…)", "Toàn bộ WorldEdit: chọn vùng bằng rìu gỗ, //set, //copy, //paste, //undo… Sửa được hàng triệu khối một lúc.\nChỉ cho Builder/Admin. CoreProtect vẫn ghi lại nên khôi phục được."]
      - [worldguard.region.bypass.*, "Xây/phá trong vùng bảo vệ (khu spawn…)", "Bỏ qua mọi vùng bảo vệ WorldGuard: xây, phá, mở rương trong khu spawn và các vùng đã khoá."]
      - [worldguard.region.info.*, "Xem thông tin vùng bảo vệ (/rg info)", "Cho gõ /rg info xem vùng bảo vệ đang đứng: tên, chủ, luật (cờ)."]
      - [towny.admin, "Quản trị Towny (sửa thị trấn, xây trong mọi thị trấn)", "Quyền quản trị Towny: /ta, sửa/xoá thị trấn bất kỳ, xây trong mọi thị trấn, bỏ qua luật đất đai.\nRất mạnh ở Bang Hội Chiến, chỉ cho người tin cậy."]
      - [essentials.give, "Lấy đồ (/give)", "Cho gõ /give <người> <đồ> [số]: tạo đồ từ không khí đưa cho người khác. Ảnh hưởng kinh tế, chỉ admin.\nCũng mở được nút \"Đưa\" ở Thư viện đồ trên web."]
      - [essentials.item, "Lấy đồ (/i)", "Cho gõ /i <đồ> [số]: tạo đồ cho chính mình. Ảnh hưởng kinh tế, chỉ admin."]
  - title: Soi phá hoại (CoreProtect)
    perms:
      - [coreprotect.inspect, "Soi block (/co i)", "Cho gõ /co i: bật chế độ soi, bấm vào khối để xem ai đặt/phá, ai mở rương, lúc nào."]
      - [coreprotect.lookup, "Tra lịch sử (/co lookup)", "Cho gõ /co lookup (/co l): tra lịch sử theo người/thời gian/bán kính, vd /co l u:abc t:2h r:20. Xem được cả chat cũ."]
      - [coreprotect.rollback, "Khôi phục phá hoại (/co rollback)", "Cho gõ /co rollback: khôi phục khối bị phá/đồ bị lấy trong vùng, vd /co rb u:abc t:3h r:30.\nSai có thể hoàn tác bằng /co restore."]
      - [coreprotect.restore, "Hoàn tác khôi phục (/co restore)", "Cho gõ /co restore: làm ngược lại lần rollback (khi khôi phục nhầm)."]
  - title: Chống hack
    perms:
      - [grim.alerts, "Nhận cảnh báo hack (GrimAC)", "Nhận tin cảnh báo trong chat khi GrimAC nghi ai đó dùng hack (bay, đánh xa…). Gõ /grim alerts để bật/tắt."]
      - [grim.alerts.enable-on-join, "Tự bật cảnh báo khi vào", "Vào game là tự bật cảnh báo hack (khỏi gõ /grim alerts mỗi lần). Cần cả quyền nhận cảnh báo."]
      - [pvpmanager.admin, "Quản trị PvP (tắt PvP toàn server, gỡ cờ giao tranh…)", "Quản trị PvPManager: tắt/bật PvP toàn server, gỡ trạng thái đang giao tranh, bỏ bảo hộ người mới của người khác."]
  - title: Chat và trang trí
    perms:
      - [essentials.chat.color, "Chat có màu", "Chat được dùng mã màu &a, &c… (16 màu cơ bản)."]
      - [essentials.chat.format, "Chat chữ đậm/nghiêng", "Chat được dùng &l đậm, &o nghiêng, &n gạch chân…"]
      - [essentials.nick, "Đổi tên hiển thị (/nick)", "Cho gõ /nick <tên>: đổi tên hiển thị trong chat và Tab (tên thật vẫn giữ, có dấu ~ phía trước).\nMuốn tên có màu cần thêm quyền \"Nick có màu\"."]
      - [essentials.hat, "Đội đồ lên đầu (/hat)", "Cho gõ /hat: đội món đang cầm lên đầu (trang trí, vd đội khối kính, hoa)."]
      - [duckymomo.chat.bypass, "Không bị chống spam chat", "Không bị bộ lọc chống spam/lặp tin của DuckyMoMoCore chặn (vẫn bị lọc từ cấm)."]
  - title: Kinh tế và quản trị
    perms:
      - [essentials.eco, "Sửa tiền người chơi (/eco)", "Cho gõ /eco give|take|set <người> <tiền>: cộng/trừ/đặt tiền. Ảnh hưởng thẳng kinh tế, chỉ admin."]
      - [duckymomo.rank.admin, "Cấp/gỡ rank donate (/rank give)", "Cho gõ /rank give|remove|check trong game: cấp/gỡ/xem rank donate (sau khi nhận tiền thật).\nCũng mở trang Donate trên web."]
      - [duckymomo.admin, "Lệnh /dmm (dọn rác, đồ vượt cấp, reload…)", "Mọi lệnh /dmm của DuckyMoMoCore: dọn rác, nạp lại cấu hình, đồ vượt cấp, đặt NPC, khai hoang, liên minh hoà bình…\nGần như quyền admin của plugin riêng, chỉ cho Admin."]
      - [shopkeeper.admin, "Tạo/sửa dân làng bán hàng", "Tạo/sửa/xoá dân làng bán hàng của server (/shopkeeper admin). Người chơi thường đang bị tắt quyền tự mở shop dân làng."]
      - [crazyenchantments.admin, "Phát sách phù phép CrazyEnchantments", "Lệnh quản trị CrazyEnchantments: /ce give, /ce add (phát sách, thêm phù phép đặc biệt vào đồ)."]
  - title: Quyền lợi rank donate (CHỈ trang trí — luật Mojang)
    donate: true
    perms:
      - [duckymomo.rank.join, "Dòng chào khi vào server", "Khi vào server hiện dòng chào riêng có tên rank."]
      - [duckymomo.rank.join.special, "Tiếng chuông cho cả server khi vào", "Khi vào server cả server nghe tiếng chuông (rank cao nhất)."]
      - [essentials.nick.color, "Nick có màu", "Tên /nick được có màu. Cần thêm quyền /nick (essentials.nick)."]
      - [essentials.nick.format, "Nick đậm/nghiêng", "Tên /nick được đậm/nghiêng. Cần thêm quyền /nick."]
      - [essentials.chat.rgb, "Chat màu tuỳ chọn (hex)", "Chat dùng được màu tuỳ chọn dạng &#rrggbb (hàng triệu màu)."]
      - [essentials.nick.rgb, "Nick màu tuỳ chọn (hex)", "Tên /nick dùng được màu tuỳ chọn dạng &#rrggbb."]
      - [playerparticles.effect.*, "Dùng mọi hiệu ứng hạt (/pp)", "Dùng mọi loại hạt của /pp (lửa, tim, nốt nhạc…). Số hiệu ứng cùng lúc do quyền \"Tối đa N\" quyết định."]
      - [playerparticles.style.*, "Dùng mọi kiểu bay của hiệu ứng", "Dùng mọi kiểu chuyển động của hạt (xoay vòng, cánh, quầng…)."]
      - [playerparticles.particles.max.1, "Tối đa 1 hiệu ứng cùng lúc", "Bật cùng lúc tối đa 1 hiệu ứng. Rank cao hơn bật quyền max lớn hơn (lấy số lớn nhất)."]
      - [playerparticles.particles.max.2, "Tối đa 2 hiệu ứng", "Bật cùng lúc tối đa 2 hiệu ứng."]
      - [playerparticles.particles.max.3, "Tối đa 3 hiệu ứng", "Bật cùng lúc tối đa 3 hiệu ứng."]
      - [playerparticles.particles.max.6, "Tối đa 6 hiệu ứng", "Bật cùng lúc tối đa 6 hiệu ứng."]
      - [pet.type.passive, "Mọi pet hiền (/pet)", "Được gọi mọi pet hiền (/pet). Pet chỉ đi theo trang trí, không đánh, không cưỡi, không bay."]
      - [pet.type.cat.*, "Pet mèo"]
      - [pet.type.wolf.*, "Pet sói"]
      - [pet.type.parrot.*, "Pet vẹt"]
      - [pet.type.fox.*, "Pet cáo"]
      - [pet.type.axolotl.*, "Pet kỳ giông"]
      - [pet.type.panda.*, "Pet gấu trúc"]
      - [pet.type.allay.*, "Pet allay"]
      - [pet.type.happy_ghast.*, "Pet ghast vui vẻ"]
  - title: Trang quản trị web (staff đăng nhập bằng tài khoản game, xem web-quyen.yml)
    perms:
      - [duckymomo.web.thuvien, "Thư viện đồ: tạo, sửa, xoá (essentials.enchant cũng mở được)", "Trang quản trị › Thư viện đồ: tạo, sửa, xoá món đồ mẫu (đồ thưởng, đồ bán trong cửa hàng).\nKhông đưa đồ cho ai được, việc đó là quyền \"đưa đồ\" bên dưới.\nAi có essentials.enchant cũng mở được."]
      - [duckymomo.web.thuvien.dua, "Thư viện đồ: đưa đồ cho người chơi (essentials.give cũng mở được)", "Thư viện đồ › nút Đưa: tạo món đồ trong thư viện vào túi người chơi đang online. Ảnh hưởng kinh tế.\nAi có essentials.give cũng mở được."]
      - [duckymomo.web.boss, "Tạo, sửa boss", "Trang quản trị › Boss: tạo boss mới, sửa boss EliteMobs có sẵn (máu, sát thương, đồ rơi), khôi phục bản gốc."]
      - [duckymomo.web.hoatdong, "Xem chat/lệnh, gửi thông báo vào game", "Trang quản trị › Hoạt động người chơi: đọc chat, lệnh người chơi đã gõ, vào/ra; gửi thông báo vào game (tên người gửi được ghi lại)."]
      - [duckymomo.web.role, "Cấp/gỡ role chức vụ cấp dưới mình", "Trang Role: THÊM người chơi vào / GỠ người chơi khỏi role chức vụ CẤP DƯỚI mình (weight nhỏ hơn role chức vụ cao nhất của mình).\nVí dụ Manager (90) xếp người vào Mod, Helper, Builder; Mod (70) xếp được Helper, Builder.\nKHÔNG sửa được quyền của role (đó là quyền \"Sửa quyền role chức vụ\")."]
      - [duckymomo.web.role.quyen, "Sửa quyền role chức vụ cấp dưới (chỉ quyền mình có; không * hay quyền web)", "Trang Role › phần Quyền: bật/tắt công tắc quyền của role chức vụ CẤP DƯỚI mình và nhóm Dân (mọi người chơi).\nChỉ bật được quyền chính mình đang có; không bao giờ cấp được * hay quyền trang quản trị.\nKhông thêm/gỡ người (đó là quyền \"Thêm/gỡ người vào role\")."]
      - [duckymomo.web.rank, "Cấp/gỡ rank donate", "Trang Role: THÊM người chơi vào rank donate (chọn số tháng) / GỠ rank của người chơi.\nDùng khi cấp tay; người chơi chuyển khoản qua web thì duyệt ở trang Donate."]
      - [duckymomo.web.rank.quyen, "Sửa quyền rank donate (chỉ quyền mình có; không * hay quyền web)", "Trang Role › phần Quyền của rank donate: bật/tắt quyền lợi từng rank (chỉ đồ trang trí, luật Mojang).\nChỉ bật được quyền chính mình đang có."]
      - [duckymomo.web.camnang, "Đọc cẩm nang admin (helper, builder đã có sẵn)", "Trang quản trị › Cẩm nang admin: đọc công dụng plugin và danh sách mọi lệnh (chỉ đọc). Helper, Builder có sẵn."]
