# Danh mục quyền hay dùng cho trang Role (panel /role): tick để cấp cho role, bỏ tick để gỡ (lệnh lp group … permission).
# Thêm quyền: thêm một dòng [quyền, mô tả] hoặc [quyền, mô tả, giải thích chi tiết (hiện khi bấm nút i; \n = xuống dòng)]. Quyền không có trong danh mục vẫn thêm được ở ô "Thêm quyền khác" trên trang.
# Lưu ý: role cao KẾ THỪA role thấp (mod kế thừa helper, admin có tất cả '*'); quyền kế thừa hiện "(từ helper)".
# server mặc định khi tick: global = toàn mạng (sảnh, Bang Hội Chiến, practice).
groups:
  - title: Di chuyển
    perms:
      - [essentials.fly, "Bay (/fly)", "Làm gì: Bật/tắt bay ở chế độ Sinh tồn.\nCách dùng: /fly\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Mất quyền thì đang bay sẽ bị tắt bay ngay (trang Role tự gửi lệnh)."]
      - [essentials.gamemode, "Đổi chế độ chơi (/gamemode) — cần thêm quyền từng chế độ bên dưới", "Làm gì: Cho dùng lệnh đổi chế độ chơi.\nCách dùng: /gamemode <chế độ> (gọi tắt /gm, /gmc, /gms)\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nVí dụ: Builder: bật quyền này + Sáng tạo + Sinh tồn.\nLưu ý: Chỉ quyền này thì CHƯA đổi được chế độ nào: bật thêm từng chế độ bên dưới."]
      - [essentials.gamemode.creative, "  … chế độ Sáng tạo", "Làm gì: Được chuyển sang Sáng tạo (bay, đồ vô hạn).\nCách dùng: /gmc\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Cần cả quyền /gamemode. Đồ lấy ở Sáng tạo mang sang Sinh tồn được, cẩn thận ở Bang Hội Chiến."]
      - [essentials.gamemode.survival, "  … chế độ Sinh tồn", "Làm gì: Được chuyển về Sinh tồn.\nCách dùng: /gms\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Cần cả quyền /gamemode."]
      - [essentials.gamemode.spectator, "  … chế độ Quan sát", "Làm gì: Được chuyển sang Quan sát (đi xuyên tường, vô hình).\nCách dùng: /gmsp\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Cần cả quyền /gamemode. Hay dùng theo dõi người nghi hack."]
      - [essentials.gamemode.adventure, "  … chế độ Phiêu lưu", "Làm gì: Được chuyển sang Phiêu lưu (không đặt/phá khối).\nCách dùng: /gma\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Cần cả quyền /gamemode."]
      - [essentials.speed, "Đổi tốc độ đi / bay (/speed)", "Làm gì: Đổi tốc độ đi hoặc bay của mình.\nCách dùng: /speed <1-10>\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Mất quyền thì tốc độ trả về 1."]
      - [essentials.tp, "Dịch chuyển tới người khác (/tp)", "Làm gì: Dịch chuyển thẳng tới người khác, KHÔNG cần họ đồng ý.\nCách dùng: /tp <người>\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Khác /tpa của người chơi thường (phải chờ người kia đồng ý)."]
      - [essentials.tphere, "Kéo người khác tới mình (/tphere)", "Làm gì: Kéo người khác tới chỗ mình, không cần họ đồng ý.\nCách dùng: /tphere <người>\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)"]
      - [essentials.back, "Quay lại chỗ cũ (/back)", "Làm gì: Quay lại chỗ đứng trước lần dịch chuyển gần nhất, hoặc chỗ vừa chết.\nCách dùng: /back\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)"]
      - [essentials.top, "Lên mặt đất (/top)", "Làm gì: Lên khối cao nhất ngay trên đầu (thoát hang).\nCách dùng: /top\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)"]
      - [essentials.jump, "Nhảy tới chỗ đang nhìn (/jump)", "Làm gì: Dịch chuyển tới khối đang nhìn.\nCách dùng: /jump\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)"]
      - [essentials.teleport.timer.bypass, "Dịch chuyển ngay, không phải đứng chờ 3 giây", "Làm gì: Dịch chuyển ngay, không đếm ngược 3 giây.\nCó ở: Bang Hội Chiến (/home, /spawn, /warp, /back, /tpa, /tpr)\nLưu ý: Admin có sẵn qua *. Số giây chờ chỉnh ở Cài đặt › Bang Hội Chiến › Thế giới › Dịch chuyển bằng lệnh."]
      - [essentials.teleport.timer.move, "Được di chuyển trong lúc chờ dịch chuyển", "Làm gì: Đang đếm ngược mà bước đi thì KHÔNG bị huỷ (vẫn phải chờ đủ giây).\nCó ở: Bang Hội Chiến (lệnh Essentials; /tpr không áp dụng)"]
      - [essentials.teleport.cooldown.bypass, "Không phải nghỉ giữa hai lần dịch chuyển", "Làm gì: Bỏ qua thời gian nghỉ giữa hai lần dịch chuyển.\nCó ở: Bang Hội Chiến\nLưu ý: Thời gian nghỉ hiện đang 0 (không giới hạn) nên chưa có tác dụng."]
      - [duckymomo.rtp.bypass, "/tpr không phải chờ 5 phút giữa hai lần", "Làm gì: Dùng /tpr liên tục: không chờ 5 phút giữa hai lần, không đứng chờ 3 giây.\nCách dùng: /tpr\nCó ở: Bang Hội Chiến"]
      - [duckymomo.rtp.free, "/tpr miễn phí", "Làm gì: Không bị trừ phí /tpr.\nCách dùng: /tpr\nCó ở: Bang Hội Chiến\nLưu ý: Phí đang 0 nên chưa có tác dụng."]
  - title: Quản lý người chơi
    perms:
      - [essentials.kick, "Kick (/kick)", "Làm gì: Đá người chơi ra khỏi server (họ vào lại được ngay).\nCách dùng: /kick <người> [lý do]\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)"]
      - [essentials.mute, "Cấm chat (/mute)", "Làm gì: Cấm chat.\nCách dùng: /mute <người> [thời gian] [lý do]\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nVí dụ: /mute abc 30m spam. Không ghi thời gian = cấm tới khi gỡ."]
      - [essentials.tempban, "Ban có thời hạn (/tempban)", "Làm gì: Cấm vào server có thời hạn.\nCách dùng: /tempban <người> <thời gian> [lý do]\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nVí dụ: /tempban abc 3d hack"]
      - [essentials.ban, "Ban vĩnh viễn (/ban)", "Làm gì: Cấm vào server vĩnh viễn (tới khi gỡ).\nCách dùng: /ban <người> [lý do]\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)"]
      - [essentials.unban, "Gỡ ban (/unban)", "Làm gì: Gỡ cấm (cả vĩnh viễn lẫn có thời hạn).\nCách dùng: /unban <người>\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)"]
      - [essentials.seen, "Xem lần cuối online, IP (/seen)", "Làm gì: Xem lần cuối online, đang ở đâu; staff thấy cả IP.\nCách dùng: /seen <người>\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Dùng để soi tài khoản phụ (cùng IP)."]
      - [essentials.invsee, "Xem túi đồ người khác (/invsee)", "Làm gì: Mở túi đồ của người khác (xem, lấy, bỏ đồ).\nCách dùng: /invsee <người>\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Hay dùng điều tra đồ bất thường."]
      - [essentials.enderchest.others, "Xem rương ender người khác", "Làm gì: Mở rương ender của người khác.\nCách dùng: /ec <người>\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Cần thêm quyền essentials.enderchest để gõ lệnh."]
      - [essentials.vanish, "Tàng hình (/vanish)", "Làm gì: Tàng hình với người chơi thường, không hiện trong danh sách Tab.\nCách dùng: /vanish (gọi tắt /v)\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Mất quyền thì tự hiện lại."]
      - [essentials.socialspy, "Đọc tin nhắn riêng của mọi người (/socialspy)", "Làm gì: Đọc được mọi tin nhắn riêng (/msg) của người khác.\nCách dùng: /socialspy\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Chỉ cho người đáng tin."]
      - [essentials.heal, "Hồi máu (/heal)", "Làm gì: Hồi đầy máu, hết lửa và hiệu ứng xấu.\nCách dùng: /heal [người]\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Lợi thế PvP: không cho rank donate."]
      - [essentials.feed, "Hồi đói (/feed)", "Làm gì: Hồi đầy thanh đói.\nCách dùng: /feed [người]\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)"]
  - title: Voice chat (Simple Voice Chat)
    perms:
      - [voicechat.speak, "Nói trong voice (mặc định ai cũng có; đặt FALSE cho người bị phạt = cấm nói)", "Làm gì: Được nói trong voice chat.\nCó ở: Mọi server (khi bật voice chat)\nLưu ý: Mặc định ai cũng có. Đặt CẤM cho một role/người = không nói được (dùng để phạt). Voice chat chưa bật."]
      - [voicechat.listen, "Nghe voice (mặc định ai cũng có)", "Làm gì: Được nghe voice chat.\nCó ở: Mọi server (khi bật voice chat)\nLưu ý: Mặc định ai cũng có. Voice chat chưa bật."]
      - [voicechat.groups, "Vào nhóm voice (mặc định ai cũng có)", "Làm gì: Tạo/vào nhóm voice riêng (nói chuyện với nhau ở xa).\nCó ở: Mọi server (khi bật voice chat)\nLưu ý: Mặc định ai cũng có. Voice chat chưa bật."]
      - [voicechat.admin, "Kiểm tra kết nối voice của người khác (/voicechat test)", "Làm gì: Kiểm tra người khác đã kết nối voice chưa.\nCách dùng: /voicechat test <người>\nCó ở: Mọi server (khi bật voice chat)"]
  - title: Xây dựng và bảo vệ
    perms:
      - [worldedit.*, "WorldEdit đầy đủ (//set, //copy, //paste…)", "Làm gì: Toàn bộ WorldEdit: chọn vùng bằng rìu gỗ, đặt/sao chép/dán hàng triệu khối một lúc.\nCách dùng: //wand, //set <khối>, //copy, //paste, //undo\nCó ở: Sảnh, Bang Hội Chiến\nLưu ý: Chỉ cho Builder/Admin. CoreProtect vẫn ghi lại nên khôi phục được."]
      - [worldguard.region.bypass.*, "Xây/phá trong vùng bảo vệ (khu spawn…)", "Làm gì: Xây, phá, mở rương trong mọi vùng bảo vệ (khu spawn, vùng đã khoá).\nCó ở: Bang Hội Chiến"]
      - [worldguard.region.info.*, "Xem thông tin vùng bảo vệ (/rg info)", "Làm gì: Xem vùng bảo vệ đang đứng: tên, chủ, luật (cờ).\nCách dùng: /rg info\nCó ở: Bang Hội Chiến"]
      - [towny.admin, "Quản trị Towny (sửa thị trấn, xây trong mọi thị trấn)", "Làm gì: Quản trị Towny: sửa/xoá thị trấn bất kỳ, xây trong mọi thị trấn, bỏ qua luật đất đai.\nCách dùng: /ta …\nCó ở: Bang Hội Chiến\nLưu ý: Rất mạnh, chỉ cho người tin cậy."]
      - [essentials.give, "Lấy đồ (/give)", "Làm gì: Tạo đồ từ không khí đưa cho người khác.\nCách dùng: /give <người> <đồ> [số]\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Ảnh hưởng kinh tế, chỉ admin. Cũng mở nút Đưa ở Thư viện đồ trên web."]
      - [essentials.item, "Lấy đồ (/i)", "Làm gì: Tạo đồ cho chính mình.\nCách dùng: /i <đồ> [số]\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Ảnh hưởng kinh tế, chỉ admin."]
  - title: Soi phá hoại (CoreProtect)
    perms:
      - [coreprotect.inspect, "Soi block (/co i)", "Làm gì: Bật chế độ soi: bấm vào khối xem ai đặt/phá, ai mở rương, lúc nào.\nCách dùng: /co i\nCó ở: Bang Hội Chiến"]
      - [coreprotect.lookup, "Tra lịch sử (/co lookup)", "Làm gì: Tra lịch sử theo người, thời gian, bán kính; xem được cả chat cũ.\nCách dùng: /co l u:<người> t:<thời gian> r:<bán kính>\nCó ở: Bang Hội Chiến\nVí dụ: /co l u:abc t:2h r:20"]
      - [coreprotect.rollback, "Khôi phục phá hoại (/co rollback)", "Làm gì: Khôi phục khối bị phá, đồ bị lấy trong vùng.\nCách dùng: /co rb u:<người> t:<thời gian> r:<bán kính>\nCó ở: Bang Hội Chiến\nLưu ý: Khôi phục nhầm thì /co restore để làm ngược lại."]
      - [coreprotect.restore, "Hoàn tác khôi phục (/co restore)", "Làm gì: Làm ngược lại lần khôi phục (khi rollback nhầm).\nCách dùng: /co restore …\nCó ở: Bang Hội Chiến"]
  - title: Chống hack
    perms:
      - [grim.alerts, "Nhận cảnh báo hack (GrimAC)", "Làm gì: Nhận tin cảnh báo khi GrimAC nghi ai đó hack (bay, đánh xa…).\nCách dùng: /grim alerts (bật/tắt)\nCó ở: Bang Hội Chiến, Practice"]
      - [grim.alerts.enable-on-join, "Tự bật cảnh báo khi vào", "Làm gì: Vào game là tự bật cảnh báo hack.\nCó ở: Bang Hội Chiến, Practice\nLưu ý: Cần cả quyền nhận cảnh báo."]
      - [pvpmanager.admin, "Quản trị PvP (tắt PvP toàn server, gỡ cờ giao tranh…)", "Làm gì: Quản trị PvP: tắt/bật PvP toàn server, gỡ cờ giao tranh, bỏ bảo hộ người mới của người khác.\nCách dùng: /pvpglobal, /untag <người>, /pvpo <người>\nCó ở: Bang Hội Chiến"]
  - title: Chat và trang trí
    perms:
      - [essentials.chat.color, "Chat có màu", "Làm gì: Chat được dùng 16 màu cơ bản.\nCách dùng: Gõ &a, &c… trước chữ\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)"]
      - [essentials.chat.format, "Chat chữ đậm/nghiêng", "Làm gì: Chat được chữ đậm, nghiêng, gạch chân.\nCách dùng: Gõ &o (nghiêng), &n (gạch chân) trước chữ. Không dùng chữ đậm: với font tiếng Việt của server chữ đậm bị nhòe\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)"]
      - [essentials.nick, "Đổi tên hiển thị (/nick)", "Làm gì: Đổi tên hiển thị trong chat và Tab (tên thật giữ nguyên, có dấu ~ phía trước).\nCách dùng: /nick <tên>, /nick off\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Tên có màu cần thêm quyền \"Nick có màu\"."]
      - [essentials.hat, "Đội đồ lên đầu (/hat)", "Làm gì: Đội món đang cầm lên đầu (trang trí).\nCách dùng: /hat\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)"]
      - [duckymomo.chat.bypass, "Không bị chống spam chat", "Làm gì: Không bị chống spam/lặp tin chặn.\nCó ở: Mọi server\nLưu ý: Vẫn bị lọc từ cấm."]
  - title: Kinh tế và quản trị
    perms:
      - [essentials.eco, "Sửa tiền người chơi (/eco)", "Làm gì: Cộng, trừ, đặt tiền của người chơi.\nCách dùng: /eco give|take|set <người> <tiền>\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Ảnh hưởng thẳng kinh tế, chỉ admin."]
      - [duckymomo.rank.admin, "Cấp/gỡ rank donate (/rank give)", "Làm gì: Cấp, gỡ, xem rank donate (sau khi nhận tiền thật); mở trang Donate trên web.\nCách dùng: /rank give <người> <bậc> <tháng>, /rank remove <người>, /rank check <người>\nCó ở: Mọi server"]
      - [duckymomo.dmm, "Lệnh /dmm (trừ reload, decorate, structures)", "Làm gì: /dmm đồ vượt cấp, sách, thư viện đồ, dọn rác, đặt NPC, tài khoản phụ, liên minh hoà bình…\nCách dùng: /dmm …\nCó ở: Mọi server\nLưu ý: Manager có sẵn. Nạp lại cấu hình, tự trang trí / đặt công trình khắp map cần duckymomo.admin."]
      - [duckymomo.admin, "Admin DuckyMoMoCore (mọi /dmm + lệnh admin)", "Làm gì: Mọi lệnh /dmm kể cả reload, decorate, structures; lệnh con admin của các hệ (dungeon, đấu trường, rank chơi, rương…).\nCách dùng: /dmm …\nCó ở: Mọi server\nLưu ý: Gần như quyền admin của plugin riêng, chỉ cho Admin."]
      - [shopkeeper.admin, "Tạo/sửa dân làng bán hàng", "Làm gì: Tạo, sửa, xoá dân làng bán hàng của server.\nCách dùng: /shopkeeper admin\nCó ở: Bang Hội Chiến\nLưu ý: Người chơi thường đang bị tắt quyền tự mở shop dân làng."]
      - [crazyenchantments.admin, "Phát sách phù phép CrazyEnchantments", "Làm gì: Phát sách, thêm phù phép đặc biệt vào đồ.\nCách dùng: /ce give <người> <phù phép> <cấp>, /ce add <phù phép> <cấp>\nCó ở: Bang Hội Chiến"]
  - title: Quyền lợi rank donate (CHỈ trang trí — luật Mojang)
    donate: true
    perms:
      - [duckymomo.rank.join, "Dòng chào khi vào server", "Làm gì: Vào server hiện dòng chào riêng có tên rank.\nCó ở: Mọi server"]
      - [duckymomo.rank.join.special, "Tiếng chuông cho cả server khi vào", "Làm gì: Vào server cả server nghe tiếng chuông.\nCó ở: Mọi server\nLưu ý: Dành cho rank cao nhất."]
      - [essentials.nick.color, "Nick có màu", "Làm gì: Tên /nick được có màu.\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Cần thêm quyền /nick (essentials.nick)."]
      - [essentials.nick.format, "Nick đậm/nghiêng", "Làm gì: Tên /nick được đậm, nghiêng.\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)\nLưu ý: Cần thêm quyền /nick."]
      - [essentials.chat.rgb, "Chat màu tuỳ chọn (hex)", "Làm gì: Chat dùng được màu tuỳ chọn (hàng triệu màu).\nCách dùng: Gõ &#rrggbb trước chữ, vd &#ff8800\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)"]
      - [essentials.nick.rgb, "Nick màu tuỳ chọn (hex)", "Làm gì: Tên /nick dùng được màu tuỳ chọn.\nCách dùng: /nick &#ff8800Tên\nCó ở: Bang Hội Chiến, Practice (sảnh không cài Essentials)"]
      - [playerparticles.effect.*, "Dùng mọi hiệu ứng hạt (/pp)", "Làm gì: Dùng mọi loại hạt (lửa, tim, nốt nhạc…).\nCách dùng: /pp\nCó ở: Mọi server\nLưu ý: Số hiệu ứng bật cùng lúc do quyền \"Tối đa N\" quyết định."]
      - [playerparticles.style.*, "Dùng mọi kiểu bay của hiệu ứng", "Làm gì: Dùng mọi kiểu chuyển động của hạt (xoay vòng, cánh, quầng…).\nCách dùng: /pp\nCó ở: Mọi server"]
      - [playerparticles.particles.max.1, "Tối đa 1 hiệu ứng cùng lúc", "Làm gì: Bật cùng lúc tối đa 1 hiệu ứng.\nCó ở: Mọi server\nLưu ý: Rank cao bật quyền max lớn hơn; có nhiều quyền max thì lấy số lớn nhất."]
      - [playerparticles.particles.max.2, "Tối đa 2 hiệu ứng", "Làm gì: Bật cùng lúc tối đa 2 hiệu ứng.\nCó ở: Mọi server"]
      - [playerparticles.particles.max.3, "Tối đa 3 hiệu ứng", "Làm gì: Bật cùng lúc tối đa 3 hiệu ứng.\nCó ở: Mọi server"]
      - [playerparticles.particles.max.6, "Tối đa 6 hiệu ứng", "Làm gì: Bật cùng lúc tối đa 6 hiệu ứng.\nCó ở: Mọi server"]
      - [duckymomo.caidat.bypass, "Nhắn riêng / TPA / mời được cả người đã tắt", "Làm gì: Người chơi tắt Tin nhắn riêng, TPA hay Lời mời trong /caidat vẫn nhận được từ người có quyền này.\nCó ở: Mọi server\nLưu ý: Chỉ cấp cho staff cần liên lạc với người chơi."]
      - [skinsrestorer.player, "Được đổi skin (/skin, /skins, tủ skin, đổi trên web)", "Làm gì: Cho đổi skin: /skin <tên>, menu /skins, tủ skin /tuskin (thêm, mặc) và đổi skin trên trang tài khoản.\nCó ở: Mọi server (kiểm ở proxy)\nLưu ý: 23/10 chủ server chốt chỉ rank được bật quyền này mới đổi skin (SkinsRestorer KHÔNG tự cấp cho mọi người nữa). Không có quyền: vẫn tự có skin theo tên tài khoản khi vào game, chỉ không đổi được. Muốn ai cũng đổi được: bật ở nhóm Dân (mặc định)."]
      - [skinsrestorer.bypasscooldown, "Đổi skin không phải chờ 30 giây", "Làm gì: Đổi skin liên tục, bỏ thời gian chờ 30 giây giữa hai lần.\nCách dùng: /skin set <tên>, /skins\nCó ở: Mọi server (kiểm ở proxy)"]
      - [skinsrestorer.command.set.url, "Đổi skin bằng link ảnh (/skin url)", "Làm gì: Dùng /skin url <link ảnh .png>.\nCó ở: Mọi server\nLưu ý: Cần cả quyền Được đổi skin."]
      - [pet.type.passive, "Mọi pet hiền (/pet)", "Làm gì: Gọi mọi pet hiền đi theo (trang trí).\nCách dùng: /pet hoặc /pets\nCó ở: Sảnh, Bang Hội Chiến\nLưu ý: Pet không đánh, không cưỡi, không bay."]
      - [pet.type.cat.*, "Pet mèo", "Làm gì: được gọi pet mèo đi theo (trang trí).\nCách dùng: /pet hoặc /pets\nCó ở: Sảnh, Bang Hội Chiến"]
      - [pet.type.wolf.*, "Pet sói", "Làm gì: được gọi pet sói đi theo (trang trí).\nCách dùng: /pet hoặc /pets\nCó ở: Sảnh, Bang Hội Chiến"]
      - [pet.type.parrot.*, "Pet vẹt", "Làm gì: được gọi pet vẹt đi theo (trang trí).\nCách dùng: /pet hoặc /pets\nCó ở: Sảnh, Bang Hội Chiến"]
      - [pet.type.fox.*, "Pet cáo", "Làm gì: được gọi pet cáo đi theo (trang trí).\nCách dùng: /pet hoặc /pets\nCó ở: Sảnh, Bang Hội Chiến"]
      - [pet.type.axolotl.*, "Pet kỳ giông", "Làm gì: được gọi pet kỳ giông đi theo (trang trí).\nCách dùng: /pet hoặc /pets\nCó ở: Sảnh, Bang Hội Chiến"]
      - [pet.type.panda.*, "Pet gấu trúc", "Làm gì: được gọi pet gấu trúc đi theo (trang trí).\nCách dùng: /pet hoặc /pets\nCó ở: Sảnh, Bang Hội Chiến"]
      - [pet.type.allay.*, "Pet allay", "Làm gì: được gọi pet allay đi theo (trang trí).\nCách dùng: /pet hoặc /pets\nCó ở: Sảnh, Bang Hội Chiến"]
      - [pet.type.happy_ghast.*, "Pet ghast vui vẻ", "Làm gì: được gọi pet ghast vui vẻ đi theo (trang trí).\nCách dùng: /pet hoặc /pets\nCó ở: Sảnh, Bang Hội Chiến"]
  - title: Trang quản trị web (staff đăng nhập bằng tài khoản game, xem web-quyen.yml)
    perms:
      - [duckymomo.web.thuvien, "Thư viện đồ: tạo, sửa, xoá (essentials.enchant cũng mở được)", "Làm gì: Tạo, sửa, xoá món đồ mẫu trong Thư viện đồ (đồ thưởng, đồ bán ở cửa hàng).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web)\nLưu ý: Không đưa đồ cho ai được (đó là quyền \"đưa đồ\"). Ai có essentials.enchant cũng mở được."]
      - [duckymomo.web.thuvien.dua, "Thư viện đồ: đưa đồ cho người chơi (essentials.give cũng mở được)", "Làm gì: Bấm nút Đưa: tạo món đồ thư viện vào túi người chơi đang online.\nCó ở: Trang quản trị web (đăng nhập bằng mã /web)\nLưu ý: Ảnh hưởng kinh tế. Ai có essentials.give cũng mở được."]
      - [duckymomo.web.boss, "Tạo, sửa boss", "Làm gì: Tạo boss mới, sửa boss EliteMobs có sẵn (máu, sát thương, đồ rơi), khôi phục bản gốc.\nCó ở: Trang quản trị web (đăng nhập bằng mã /web)"]
      - [duckymomo.web.hoatdong, "Xem chat/lệnh, gửi thông báo vào game", "Làm gì: Đọc chat, lệnh người chơi đã gõ, vào/ra; gửi thông báo vào game.\nCó ở: Trang quản trị web (đăng nhập bằng mã /web)\nLưu ý: Tên người gửi thông báo được ghi lại."]
      - [duckymomo.web.hethong, "Trang Hệ thống: xem TPS/RAM, lưu, dọn rác, nạp plugin, khởi động lại server", "Làm gì: Xem tình trạng từng server; bấm lưu thế giới, dọn rác, nạp lại plugin; khởi động lại server (có đếm ngược báo trong game, có người online phải xác nhận).\nCó ở: Trang quản trị web\nLưu ý: Chỉ nên cấp cho quản lý tin cậy (khởi động lại làm người chơi bị ngắt)."]
      - [duckymomo.web.media, "Trang Sứ Giả: duyệt / gia hạn / gỡ rank Sứ Giả (người livestream)", "Làm gì: Xem đơn đăng ký Sứ Giả, số buổi và giờ livestream 7 ngày (server tự kiểm online thật + kênh đang live), tố cáo; bấm duyệt (rank có hạn), gia hạn, gỡ, từ chối.\nCó ở: Trang quản trị web"]
      - [duckymomo.web.role, "Cấp/gỡ role chức vụ cấp dưới mình", "Làm gì: THÊM người chơi vào / GỠ người chơi khỏi role chức vụ CẤP DƯỚI mình.\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Role & rank\nVí dụ: Manager (weight 90) xếp người vào Mod, Helper, Builder; Mod (70) xếp được Helper, Builder.\nLưu ý: KHÔNG sửa quyền của role (đó là quyền \"Sửa quyền role chức vụ\")."]
      - [duckymomo.web.role.quyen, "Sửa quyền role chức vụ cấp dưới (chỉ quyền mình có; không * hay quyền web)", "Làm gì: Bật/tắt quyền của role chức vụ CẤP DƯỚI mình và nhóm Dân (mọi người chơi).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Role & rank › phần Quyền\nLưu ý: Chỉ bật được quyền chính mình đang có; không bao giờ cấp được * hay quyền trang quản trị. Không thêm/gỡ người."]
      - [duckymomo.web.rank, "Cấp/gỡ rank donate", "Làm gì: THÊM người chơi vào rank donate (chọn số tháng) / GỠ rank của người chơi.\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Role & rank\nLưu ý: Dùng khi cấp tay; người chuyển khoản qua web thì duyệt ở trang Donate."]
      - [duckymomo.web.rank.quyen, "Sửa quyền rank donate (chỉ quyền mình có; không * hay quyền web)", "Làm gì: Bật/tắt quyền lợi của từng rank donate.\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Role & rank › phần Quyền\nLưu ý: Chỉ đồ trang trí (luật Mojang). Chỉ bật được quyền chính mình đang có."]
      - [duckymomo.web.camnang, "Đọc cẩm nang admin (helper, builder đã có sẵn)", "Làm gì: Đọc cẩm nang plugin và danh sách mọi lệnh (chỉ đọc).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cẩm nang admin\nLưu ý: Helper, Builder có sẵn."]
      - [duckymomo.web.huongdan, "Sửa cẩm nang trong game", "Làm gì: Sửa nội dung sách /huongdan người chơi đọc trong game.\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cẩm nang trong game"]
      - [duckymomo.web.donate, "Duyệt donate (duckymomo.rank.admin cũng mở được)", "Làm gì: Xem yêu cầu người chơi báo đã chuyển khoản, bấm cấp rank hoặc huỷ.\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Donate\nLưu ý: Ai có duckymomo.rank.admin cũng mở được."]
      - [duckymomo.web.caidat.*, "Sửa MỌI loại trong trang Cài đặt", "Làm gì: Mở MỌI loại trên trang Cài đặt.\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Trừ nút \"Áp dụng lại tất cả\" (chỉ toàn quyền). Muốn giới hạn: tắt quyền này, bật từng loại bên dưới."]
      - [duckymomo.web.caidat.chat, "Cài đặt: chỉ loại Chat", "Làm gì: Xem và sửa các mục thuộc loại \"Chat\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.chientranh, "Cài đặt: chỉ loại Chiến tranh", "Làm gì: Xem và sửa các mục thuộc loại \"Chiến tranh\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.chonghack, "Cài đặt: chỉ loại Chống hack", "Làm gì: Xem và sửa các mục thuộc loại \"Chống hack\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.hienthi, "Cài đặt: chỉ loại Hiển thị", "Làm gì: Xem và sửa các mục thuộc loại \"Hiển thị\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.hethong, "Cài đặt: chỉ loại Hệ thống", "Làm gì: Xem và sửa các mục thuộc loại \"Hệ thống\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.kinhte, "Cài đặt: chỉ loại Kinh tế", "Làm gì: Xem và sửa các mục thuộc loại \"Kinh tế\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.nghe, "Cài đặt: chỉ loại Nghề", "Làm gì: Xem và sửa các mục thuộc loại \"Nghề\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.nguoimoi, "Cài đặt: chỉ loại Người mới", "Làm gì: Xem và sửa các mục thuộc loại \"Người mới\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.phuphep, "Cài đặt: chỉ loại Phù phép", "Làm gì: Xem và sửa các mục thuộc loại \"Phù phép\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.pvpcombat, "Cài đặt: chỉ loại PvP & combat", "Làm gì: Xem và sửa các mục thuộc loại \"PvP & combat\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.rankdonate, "Cài đặt: chỉ loại Rank donate", "Làm gì: Xem và sửa các mục thuộc loại \"Rank donate\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.role, "Cài đặt: chỉ loại Role", "Làm gì: Xem và sửa các mục thuộc loại \"Role\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.shop, "Cài đặt: chỉ loại Shop", "Làm gì: Xem và sửa các mục thuộc loại \"Shop\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.sanh, "Cài đặt: chỉ loại Sảnh", "Làm gì: Xem và sửa các mục thuộc loại \"Sảnh\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.thuongsukien, "Cài đặt: chỉ loại Thưởng & sự kiện", "Làm gì: Xem và sửa các mục thuộc loại \"Thưởng & sự kiện\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.thegioi, "Cài đặt: chỉ loại Thế giới", "Làm gì: Xem và sửa các mục thuộc loại \"Thế giới\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.caidat.thitran, "Cài đặt: chỉ loại Thị trấn", "Làm gì: Xem và sửa các mục thuộc loại \"Thị trấn\" (lưu là áp dụng ngay vào server).\nCó ở: Trang quản trị web (đăng nhập bằng mã /web) › Cài đặt\nLưu ý: Các loại khác vẫn bị ẩn."]
      - [duckymomo.web.toanquyen, "Toàn quyền trang quản trị (như admin)", "Làm gì: Toàn quyền trang quản trị như Admin: mọi trang, mọi role (kể cả Admin, Manager), cấp được mọi quyền.\nCó ở: Trang quản trị web (đăng nhập bằng mã /web)\nLưu ý: Role có * (Admin) tự có quyền này."]
