# Trang "Toàn mạng" của trang Cài đặt: cài đặt dùng chung lobby + Bang Hội Chiến + practice (panel/ đọc file này).
# Thư mục bắt đầu bằng "_" nên menu chọn chế độ ở lobby bỏ qua. Định dạng: xem modes/banghoi/settings.schema.yml.
# Mỗi nhóm có category (loại): trang Cài đặt có thanh chọn loại, chỉ hiện các nhóm của loại đang chọn.
# Mục có "servers": ghi cùng giá trị vào file của từng server trong danh sách, lệnh nạp lại chạy trên từng server.
title: Toàn mạng
server: lobby

# default (tuỳ chọn): giá trị khuyên dùng cho mục chưa từng lưu; trang Cài đặt điền sẵn thành "thay đổi chưa lưu", bấm Lưu là ghi.
groups:
  - title: Lọc chat
    category: Chat
    description: Che từ tục (thay bằng ***) và chống spam ở lobby, Bang Hội Chiến, practice. Admin (op) không bị chống spam.
    apply: [dmm reload]
    settings:
      - { key: chat_filter_enabled, label: Bật lọc chat, type: select, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: chat-filter.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: chat_words_accented, label: Từ cấm (khớp đúng dạng CÓ DẤU), type: lines, style: tags, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: chat-filter.words-accented,
          note: "Mỗi thẻ một từ/cụm từ. Dùng cho từ mà bỏ dấu sẽ trùng từ thường (lồn/lớn, cặc/các, buồi/buổi, đéo/đeo)." }
      - { key: chat_words_plain, label: Từ cấm (khớp cả khi gõ KHÔNG DẤU), type: lines, style: tags, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: chat-filter.words-plain,
          note: "Mỗi thẻ một từ. Chỉ dùng cho từ không trùng từ thường khi bỏ dấu (đm, vcl, dcm...)." }
      - { key: chat_min_interval, label: Khoảng cách tối thiểu giữa 2 tin (giây), type: number, min: 0, max: 30, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: chat-filter.min-interval-seconds }
      - { key: chat_repeat_seconds, label: Không cho gửi lặp lại cùng câu trong (giây), type: int, min: 0, max: 3600, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: chat-filter.repeat-seconds }
      - { key: chat_caps_ratio, label: Tỉ lệ chữ hoa để tự hạ thành chữ thường (0-1), type: number, min: 0, max: 1, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: chat-filter.caps-ratio,
          note: "0.7 = câu có từ 70% chữ hoa trở lên (và từ 8 chữ cái) bị đổi về chữ thường. 1 = tắt." }
      - { key: chat_too_fast_msg, label: Tin báo khi chat quá nhanh, type: text, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: chat-filter.too-fast-message }
      - { key: chat_repeat_msg, label: Tin báo khi gửi lặp, type: text, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: chat-filter.repeat-message }

  - title: Tên hiển thị và định dạng chat (Essentials)
    category: Chat
    description: "Bang Hội Chiến + Practice (sảnh dùng DuckyMoMoCore, không có Essentials). Chat bị lặp [Mod] [Công Tước] hai lần: tắt 'Gắn prefix vào tên hiển thị' (định dạng chat đã có {PREFIX}). Lưu là nạp lại Essentials ngay."
    apply: [essentials reload]
    settings:
      - { key: ess_chat_format, label: Định dạng chat, type: text, servers: [banghoi-1, practice-1], file: plugins/Essentials/config.yml, path: chat.format, default: "{PREFIX}{DISPLAYNAME}{SUFFIX}&7: &f{MESSAGE}",
          note: "{PREFIX} = role + rank (LuckPerms), {DISPLAYNAME} = tên (hoặc tên đã đổi), {SUFFIX} = danh hiệu, {MESSAGE} = nội dung. Gợi ý: {PREFIX}{DISPLAYNAME}{SUFFIX}&7: &f{MESSAGE}" }
      - { key: ess_add_prefix_suffix, label: Gắn prefix/suffix vào tên hiển thị, type: select, servers: [banghoi-1, practice-1], file: plugins/Essentials/config.yml, path: add-prefix-suffix, default: false,
          options: [ { value: false, label: "Tắt (khuyên dùng: định dạng chat đã có {PREFIX})" }, { value: true, label: "Bật (role/rank sẽ hiện 2 lần nếu định dạng có {PREFIX})" } ] }
      - { key: ess_nick_max, label: Tên hiển thị (/nick) dài tối đa, type: int, min: 3, max: 32, servers: [banghoi-1, practice-1], file: plugins/Essentials/config.yml, path: max-nick-length, default: 16 }
      - { key: ess_nick_ignore_colors, label: Không tính mã màu vào độ dài tên, type: select, servers: [banghoi-1, practice-1], file: plugins/Essentials/config.yml, path: ignore-colors-in-max-nick-length, default: true,
          options: [ { value: true, label: "Bật (khuyên dùng: &6Tên chỉ tính 3 chữ)" }, { value: false, label: "Tắt (mặc định Essentials: mã màu cũng tính)" } ] }
      - { key: ess_nick_prefix, label: Ký tự đứng trước tên đã đổi, type: text, servers: [banghoi-1, practice-1], file: plugins/Essentials/config.yml, path: nickname-prefix, default: "~",
          note: "Mặc định ~ để người khác biết đây là tên đã đổi (chống giả làm admin). Để trống = không có." }

  - title: Thông báo vào/ra server
    category: Chat
    description: "Mã màu &a, &e... {prefix} = role + rank, {player} = tên, {tier} = tên bậc donate, {tiercolor} = màu bậc."
    apply: [dmm reload]
    settings:
      - { key: join_message, label: Dòng khi có người vào, type: text, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.join-message }
      - { key: quit_message, label: Dòng khi có người ra, type: text, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.quit-message }
      - { key: rank_join_message, label: Dòng chào thêm cho người có rank donate, type: text, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.rank-join-message }

  - title: Rank donate (tước vị)
    info: "Là gì: quyền lợi TRANG TRÍ người chơi nhận khi ủng hộ (luật Mojang cấm bán lợi thế chơi).\nSửa ở đây: tên, prefix, chữ giá, chữ quyền lợi hiện trong /rank và trên web.\nQuyền lợi thật: trang Role › rank › Quyền.\nCấp rank: /rank give, hoặc trang Role / Donate."
    category: Rank donate
    description: "Chỉ trang trí (luật Mojang). Admin cấp: /rank give <tên> <bậc> <số tháng>. Người chơi xem: /rank. Quyền lợi cụ thể của từng bậc nằm trong LuckPerms (tools/donate-ranks.cmds); ô Quyền lợi dưới đây chỉ là chữ hiện trong /rank."
    apply: [dmm reload]
    settings:
      - { key: donate_how_to_buy, info: "Là gì: dòng chữ cuối /rank chỉ cách ủng hộ (vd chuyển khoản trên web, nhắn admin).\nLưu ý: chỉ là chữ, không tự xử lý thanh toán.", label: Hướng dẫn mua (hiện trong /rank), type: text, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.how-to-buy }
      - { key: tier0_name, label: "Bậc 1 (namtuoc): tên hiển thị", type: text, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.tiers.0.name }
      - { key: tier0_prefix, info: "Là gì: chữ hiện trước tên trong chat và Tab, dùng mã màu &.\nLưu ý: người có cả role chức vụ và rank thấy cả hai, role chức vụ đứng trước.", label: "Bậc 1 (namtuoc): prefix trong chat/Tab", type: text,
          commands: ["lp group namtuoc meta removeprefix 5", "lp group namtuoc meta setprefix 5 \"{value} \""],
          note: "Ví dụ &a[Nam Tước]. Ghi vào LuckPerms (dùng chung toàn mạng), có hiệu lực ngay." }
      - { key: tier0_prices, info: "Là gì: các gói giá hiện trong /rank, trang web và QR /rank mua.\nCách ghi: mỗi gói \"<số> tháng <giá>\" hoặc \"1 năm <giá>\", vd 3 tháng 50k.\nLưu ý: số tháng và số tiền chuyển khoản đọc từ chính chữ này, ghi sai dạng là sai tiền. Duyệt ở trang Donate cấp đúng số tháng của gói; cấp tay: /rank give <tên> <bậc> <số tháng>.", label: "Bậc 1 (namtuoc): giá các gói", type: list, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.tiers.0.prices,
          note: "Cách nhau dấu phẩy, ví dụ: 1 tháng 20k, 3 tháng 50k, 6 tháng 90k, 1 năm 160k" }
      - { key: tier0_perks, info: "Là gì: CHỮ mô tả quyền lợi, hiện trong /rank và trên web.\nLưu ý: quyền lợi THẬT (hạt, pet, màu chat…) bật ở trang Role › rank đó › Quyền. Chỉ sửa chữ mà không bật quyền thì người mua không có.", label: "Bậc 1 (namtuoc): quyền lợi (chữ hiện trong /rank)", type: list, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.tiers.0.perks }
      - { key: tier0_skins, info: "Là gì: tên các skin độc quyền của bậc này trong menu /skins (người không đủ bậc thấy ô bị khoá).\nCách nhanh hơn (không cần trang này): trong game gõ /rank skin them <bậc> <tên> <link ảnh .png> rồi bấm nút tạo skin.\nHoặc: /sr createcustom <tên> <link ảnh skin .png> (tên viết thường, không dấu), rồi ghi tên đó vào đây.\nBậc cao tự có skin của bậc dưới (kế thừa). Skin thường (theo tên tài khoản, gợi ý, link ảnh) vẫn miễn phí cho mọi người.\nLuật SkinsRestorer: chỉ bán skin server tự làm/cung cấp; không bắt trả tiền để dùng skin của chính tài khoản họ.\nLưu xong: khởi động lại sảnh (đồng bộ quyền vào LuckPerms).", label: "Bậc 1 (namtuoc): skin độc quyền", type: list, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.tiers.0.skins }
      - { key: tier1_name, label: "Bậc 2 (tutuoc): tên hiển thị", type: text, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.tiers.1.name }
      - { key: tier1_prefix, info: "Là gì: chữ hiện trước tên trong chat và Tab, dùng mã màu &.\nLưu ý: người có cả role chức vụ và rank thấy cả hai, role chức vụ đứng trước.", label: "Bậc 2 (tutuoc): prefix trong chat/Tab", type: text,
          commands: ["lp group tutuoc meta removeprefix 6", "lp group tutuoc meta setprefix 6 \"{value} \""],
          note: "Ví dụ &b[Tử Tước]. Ghi vào LuckPerms (dùng chung toàn mạng), có hiệu lực ngay." }
      - { key: tier1_prices, info: "Là gì: các gói giá hiện trong /rank, trang web và QR /rank mua.\nCách ghi: mỗi gói \"<số> tháng <giá>\" hoặc \"1 năm <giá>\", vd 3 tháng 50k.\nLưu ý: số tháng và số tiền chuyển khoản đọc từ chính chữ này, ghi sai dạng là sai tiền. Duyệt ở trang Donate cấp đúng số tháng của gói; cấp tay: /rank give <tên> <bậc> <số tháng>.", label: "Bậc 2 (tutuoc): giá các gói", type: list, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.tiers.1.prices,
          note: "Cách nhau dấu phẩy, ví dụ: 1 tháng 20k, 3 tháng 50k, 6 tháng 90k, 1 năm 160k" }
      - { key: tier1_perks, info: "Là gì: CHỮ mô tả quyền lợi, hiện trong /rank và trên web.\nLưu ý: quyền lợi THẬT (hạt, pet, màu chat…) bật ở trang Role › rank đó › Quyền. Chỉ sửa chữ mà không bật quyền thì người mua không có.", label: "Bậc 2 (tutuoc): quyền lợi (chữ hiện trong /rank)", type: list, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.tiers.1.perks }
