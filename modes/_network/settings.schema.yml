      - { key: tier3_skins, info: "Là gì: tên các skin độc quyền của bậc này trong menu /skins (người không đủ bậc thấy ô bị khoá).\nCách nhanh hơn (không cần trang này): trong game gõ /rank skin them <bậc> <tên> <link ảnh .png> rồi bấm nút tạo skin.\nHoặc: /sr createcustom <tên> <link ảnh skin .png> (tên viết thường, không dấu), rồi ghi tên đó vào đây.\nBậc cao tự có skin của bậc dưới (kế thừa). Skin thường (theo tên tài khoản, gợi ý, link ảnh) vẫn miễn phí cho mọi người.\nLuật SkinsRestorer: chỉ bán skin server tự làm/cung cấp; không bắt trả tiền để dùng skin của chính tài khoản họ.\nLưu xong: khởi động lại sảnh (đồng bộ quyền vào LuckPerms).", label: "Bậc 4 (hautuoc): skin độc quyền", type: list, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.tiers.3.skins }
      - { key: tier4_name, label: "Bậc 5 (congtuoc): tên hiển thị", type: text, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.tiers.4.name }
      - { key: tier4_prefix, info: "Là gì: chữ hiện trước tên trong chat và Tab, dùng mã màu &.\nLưu ý: người có cả role chức vụ và rank thấy cả hai, role chức vụ đứng trước.", label: "Bậc 5 (congtuoc): prefix trong chat/Tab", type: text,
          commands: ["lp group congtuoc meta removeprefix 9", "lp group congtuoc meta setprefix 9 \"{value} \""],
          note: "Ví dụ &6[Công Tước]. Ghi vào LuckPerms (dùng chung toàn mạng), có hiệu lực ngay." }
      - { key: tier4_prices, info: "Là gì: các gói giá hiện trong /rank, trang web và QR /rank mua.\nCách ghi: mỗi gói \"<số> tháng <giá>\" hoặc \"1 năm <giá>\", vd 3 tháng 50k.\nLưu ý: số tháng và số tiền chuyển khoản đọc từ chính chữ này, ghi sai dạng là sai tiền. Duyệt ở trang Donate cấp đúng số tháng của gói; cấp tay: /rank give <tên> <bậc> <số tháng>.", label: "Bậc 5 (congtuoc): giá các gói", type: list, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.tiers.4.prices,
          note: "Cách nhau dấu phẩy, ví dụ: 1 tháng 20k, 3 tháng 50k, 6 tháng 90k, 1 năm 160k" }
      - { key: tier4_perks, info: "Là gì: CHỮ mô tả quyền lợi, hiện trong /rank và trên web.\nLưu ý: quyền lợi THẬT (hạt, pet, màu chat…) bật ở trang Role › rank đó › Quyền. Chỉ sửa chữ mà không bật quyền thì người mua không có.", label: "Bậc 5 (congtuoc): quyền lợi (chữ hiện trong /rank)", type: list, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.tiers.4.perks }
      - { key: tier4_skins, info: "Là gì: tên các skin độc quyền của bậc này trong menu /skins (người không đủ bậc thấy ô bị khoá).\nCách nhanh hơn (không cần trang này): trong game gõ /rank skin them <bậc> <tên> <link ảnh .png> rồi bấm nút tạo skin.\nHoặc: /sr createcustom <tên> <link ảnh skin .png> (tên viết thường, không dấu), rồi ghi tên đó vào đây.\nBậc cao tự có skin của bậc dưới (kế thừa). Skin thường (theo tên tài khoản, gợi ý, link ảnh) vẫn miễn phí cho mọi người.\nLuật SkinsRestorer: chỉ bán skin server tự làm/cung cấp; không bắt trả tiền để dùng skin của chính tài khoản họ.\nLưu xong: khởi động lại sảnh (đồng bộ quyền vào LuckPerms).", label: "Bậc 5 (congtuoc): skin độc quyền", type: list, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-ranks.tiers.4.skins }

  - title: Ủng hộ bằng QR trong game (/rank mua)
    category: Rank donate
    description: "Người chơi gõ /rank mua, chọn gói → mã VietQR hiện trên tấm bản đồ trong tay → bấm [Tôi đã chuyển khoản] → admin duyệt ở trang quản trị > Donate (chung hàng chờ với trang web). Tài khoản ngân hàng lấy từ site/config/site.yml (donate). Giá các gói lấy từ nhóm Rank donate ở trên."
    apply: [dmm reload]
    settings:
      - { key: dqr_on, label: Bật QR trong game, type: select, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-qr.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: "Tắt (chỉ hiện hướng dẫn mua)" } ] }
      - { key: dqr_minutes, label: Mã QR hết hạn sau (phút), type: int, min: 1, max: 60, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-qr.minutes }
      - { key: dqr_web, label: Link trang tài khoản (khi không tạo được QR), type: text, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-qr.web }

  - title: Đăng nhập (AuthMe)
    category: Sảnh
    description: "Phiên đăng nhập: đăng nhập rồi thì vào lại từ cùng IP trong thời hạn khỏi gõ mật khẩu."
    info: "Phiên hết khi quá hạn hoặc khi IP người chơi đổi (đổi mạng, dùng 4G…).\nChỉ an toàn khi server thấy IP thật của người chơi: mọi người vào qua cổng VPS (playit đã bỏ 19/10). Nếu sau này mở lại đường vào chung một IP (như playit) thì PHẢI tắt, không người khác đặt trùng tên sẽ vào được tài khoản.\nNgười có Minecraft bản quyền còn có thể gõ /premium để lần sau vào thẳng, không cần mật khẩu (proxy hỏi Mojang).\nLưu xong: có hiệu lực ngay (authme reload)."
    apply: [authme reload]
    settings:
      - { key: authme_session_on, label: Bật phiên đăng nhập, type: select, servers: [lobby], file: plugins/AuthMe/config.yml, path: settings.sessions.enabled, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: authme_session_min, label: Thời hạn phiên (phút), type: int, min: 1, max: 43200, servers: [lobby], file: plugins/AuthMe/config.yml, path: settings.sessions.timeout, note: "Đề xuất 60. 4G/quán net nhiều người chung 1 IP: phiên càng dài, người khác cùng mạng gõ đúng tên càng dễ vào ké (cả admin)" }

  - title: Giới hạn đăng ký tài khoản
    category: Sảnh
    description: "Mỗi IP chỉ được đăng ký số tài khoản này trong 24 giờ và trong 30 ngày (chống tạo tài khoản ảo lấy quà tân thủ, nuôi bot). IP trong danh sách miễn thì không bị giới hạn."
    info: "Không dùng giới hạn của AuthMe vì nó tính tổng vĩnh viễn, khoá cả quán net / 4G dùng chung IP.\nDanh sách miễn: mỗi dòng 1 IP, ví dụ 171.255.251.82. Kết thúc bằng dấu chấm (171.255.251.) = miễn cả dải, dùng khi mạng nhà hay đổi IP (cẩn thận: cả dải có thể gồm người lạ cùng nhà mạng).\nXem IP của ai: log sảnh dòng \"Chặn đăng ký: <tên> từ <IP>\" hoặc /authme getip <tên>.\nLưu xong: có hiệu lực ngay (dmm reload ở sảnh)."
    apply: [dmm reload]
    settings:
      - { key: reg_per_ip_day, label: Số tài khoản mỗi IP trong 24 giờ, type: int, min: 0, max: 50, servers: [lobby], file: plugins/DuckyMoMoCore/config.yml, path: register-limit.per-ip-per-day, note: "0 = không giới hạn" }
      - { key: reg_per_ip_month, label: Số tài khoản mỗi IP trong 30 ngày, type: int, min: 0, max: 200, servers: [lobby], file: plugins/DuckyMoMoCore/config.yml, path: register-limit.per-ip-per-30-days, note: "Chặn tạo dần mỗi ngày 2 cái thành vài chục cái/tháng. 0 = không giới hạn" }
      - { key: reg_whitelist, label: IP miễn giới hạn (mỗi dòng 1 IP), type: lines, servers: [lobby], file: plugins/DuckyMoMoCore/config.yml, path: register-limit.whitelist }

  - title: Đăng nhập trang web (mã /web)
    category: Sảnh
    description: "Thời hạn mã 6 số người chơi lấy bằng /web trong game để đăng nhập trang web."
    info: "Mã dùng 1 lần; sai 5 lần thì tên đó bị khoá đăng nhập web 15 phút, 20 lần từ cùng IP cũng khoá 15 phút, nên mã sống lâu vẫn không dò ra được.\nLưu xong: có hiệu lực ngay (dmm reload ở mọi server; mã đang chờ bị huỷ, người chơi gõ /web lại)."
    apply: [dmm reload]
    settings:
      - { key: web_code_min, label: Mã /web hết hạn sau (phút), type: int, min: 1, max: 1440, servers: [lobby, banghoi-1, practice-1, sangtao-1], file: plugins/DuckyMoMoCore/config.yml, path: web-login.code-minutes, note: "Mặc định 60" }

  - title: Sảnh (lobby)
    category: Sảnh
    apply: [dmm reload]
    settings:
      - { key: lobby_void_y, label: Rơi thấp hơn độ cao này thì về spawn, type: int, min: -64, max: 300, servers: [lobby], file: plugins/DuckyMoMoCore/config.yml, path: void-teleport.below-y,
          note: "Đảo Sakura thấp nhất khoảng y 20-50. Spawn ở y 89." }
      - { key: lobby_spawn_on_join, label: Mỗi lần vào đều đứng ở spawn, type: select, servers: [lobby], file: plugins/DuckyMoMoCore/config.yml, path: void-teleport.spawn-on-join,
          options: [ { value: true, label: Có }, { value: false, label: "Không (vào lại chỗ thoát lần trước)" } ] }

  - title: Hiệu ứng hạt (PlayerParticles)
    category: Rank donate
    description: "Có hiệu lực sau khi khởi động lại lobby và Bang Hội Chiến (lệnh pp reload của plugin không chạy được qua RCON). Tốc độ áp dụng cho cả server theo từng kiểu, người chơi không tự chỉnh riêng được (PlayerParticles không hỗ trợ)."
    settings:
      - { key: pp_toggle_on_combat, label: Ẩn hiệu ứng khi đang đánh nhau, type: select, servers: [lobby, banghoi-1], file: plugins/PlayerParticles/config.yml, path: toggle-on-combat,
          options: [ { value: true, label: "Có (nên bật: hạt làm lộ vị trí trong chiến tranh)" }, { value: false, label: Không } ] }
      - { key: pp_max_default, label: Số hiệu ứng cho người KHÔNG có rank, type: int, min: 0, max: 10, servers: [lobby, banghoi-1], file: plugins/PlayerParticles/config.yml, path: max-particles,
          note: "0 = chỉ người có rank (Tử Tước trở lên) mới dùng được /pp." }
      - { key: pp_speed_orbit, label: "Tốc độ kiểu Bay quanh", type: select, servers: [lobby, banghoi-1], file: plugins/PlayerParticles/styles/orbit.yml, path: steps,
          info: "Là gì: các quả cầu hạt bay vòng quanh người.\nTrong file: steps = số bước cho một vòng (ít bước = quay nhanh).",
          options: [ { value: 180, label: "Chậm" }, { value: 120, label: "Vừa (mặc định)" }, { value: 70, label: "Nhanh" } ] }
      - { key: pp_speed_spin, label: "Tốc độ kiểu Xoay trên đầu", type: select, servers: [lobby, banghoi-1], file: plugins/PlayerParticles/styles/spin.yml, path: particles-per-rotation,
          info: "Là gì: một điểm hạt xoay tròn trên đầu.\nTrong file: particles-per-rotation (ít = xoay nhanh).",
          options: [ { value: 45, label: "Chậm" }, { value: 30, label: "Vừa (mặc định)" }, { value: 18, label: "Nhanh" } ] }
      - { key: pp_speed_quadhelix, label: "Tốc độ kiểu Xoắn 4 dải", type: select, servers: [lobby, banghoi-1], file: plugins/PlayerParticles/styles/quadhelix.yml, path: steps-x,
          info: "Là gì: 4 dải hạt xoắn quanh người lên xuống.\nTrong file: steps-x (ít = nhanh).",
          options: [ { value: 120, label: "Chậm" }, { value: 80, label: "Vừa (mặc định)" }, { value: 50, label: "Nhanh" } ] }
      - { key: pp_speed_twins, label: "Tốc độ kiểu Song sinh", type: select, servers: [lobby, banghoi-1], file: plugins/PlayerParticles/styles/twins.yml, path: horizontal-steps,
          info: "Là gì: 2 quả cầu hạt bay vòng quanh, lên xuống.\nTrong file: horizontal-steps (ít = nhanh).",
          options: [ { value: 90, label: "Chậm" }, { value: 60, label: "Vừa (mặc định)" }, { value: 35, label: "Nhanh" } ] }
      - { key: pp_speed_whirl, label: "Tốc độ kiểu Cuộn xoáy", type: select, servers: [lobby, banghoi-1], file: plugins/PlayerParticles/styles/whirl.yml, path: speed-multiplier,
          info: "Là gì: các tia hạt cuộn xoáy dưới chân.\nTrong file: speed-multiplier (lớn = nhanh).",
          options: [ { value: 0.6, label: "Chậm" }, { value: 1, label: "Vừa (mặc định)" }, { value: 1.8, label: "Nhanh" } ] }
      - { key: pp_speed_vortex, label: "Tốc độ kiểu Lốc xoáy", type: select, servers: [lobby, banghoi-1], file: plugins/PlayerParticles/styles/vortex.yml, path: step-amount,
          info: "Là gì: hạt xoáy thành cơn lốc quanh người.\nTrong file: step-amount (ít = nhanh).",
          options: [ { value: 100, label: "Chậm" }, { value: 70, label: "Vừa (mặc định)" }, { value: 40, label: "Nhanh" } ] }
      - { key: pp_speed_pulse, label: "Tốc độ kiểu Sóng toả", type: select, servers: [lobby, banghoi-1], file: plugins/PlayerParticles/styles/pulse.yml, path: delay,
          info: "Là gì: vòng hạt toả ra từ chân theo nhịp.\nTrong file: delay = số tick giữa hai nhịp (ít = dồn dập).",
          options: [ { value: 25, label: "Chậm" }, { value: 15, label: "Vừa (mặc định)" }, { value: 8, label: "Nhanh" } ] }
      - { key: pp_speed_wings, label: "Tốc độ kiểu Đôi cánh", type: select, servers: [lobby, banghoi-1], file: plugins/PlayerParticles/styles/wings.yml, path: spawn-delay,
          info: "Là gì: đôi cánh hạt sau lưng, vẽ lại theo nhịp.\nTrong file: spawn-delay = số tick giữa hai lần vẽ (ít = nhanh, tốn tài nguyên hơn).",
          options: [ { value: 5, label: "Chậm" }, { value: 3, label: "Vừa (mặc định)" }, { value: 2, label: "Nhanh" } ] }
      - { key: pp_speed_celebration, label: "Tốc độ kiểu Pháo hoa", type: select, servers: [lobby, banghoi-1], file: plugins/PlayerParticles/styles/celebration.yml, path: spawn-frequency,
          info: "Là gì: pháo hoa hạt bắn lên quanh người.\nTrong file: spawn-frequency = số tick giữa hai lần bắn (ít = dày).",
          options: [ { value: 25, label: "Thưa" }, { value: 15, label: "Vừa (mặc định)" }, { value: 8, label: "Dày" } ] }
      - { key: pp_ticks_per_particle, label: "Mật độ chung mọi hiệu ứng", type: select, servers: [lobby, banghoi-1], file: plugins/PlayerParticles/config.yml, path: ticks-per-particle,
          info: "Là gì: cứ bao nhiêu tick thì vẽ hạt một lần, áp dụng MỌI hiệu ứng.\nLưu ý: thưa hơn thì hiệu ứng chạy chậm, ít hạt hơn, nhẹ máy hơn khi đông người.",
          options: [ { value: 1, label: "Dày (mặc định, mỗi tick)" }, { value: 2, label: "Vừa (2 tick)" }, { value: 3, label: "Thưa (3 tick)" } ] }

  - title: Role chức vụ - prefix
    info: "Là gì: role staff (Admin, Manager, Mod, Helper, Builder) và Dân.\nSửa ở đây: chỉ prefix.\nThêm người, bật quyền: trang Role & rank."
    category: Role
    description: "Prefix hiện trước tên trong chat và Tab (mã màu &a, &c...). Cấp / gỡ role cho người chơi: trang Role (link trên thanh đầu). Quyền của từng role: lệnh /lp trong game (xem cẩm nang LuckPerms)."
    settings:
      - { key: role_default_prefix, info: "Là gì: chữ hiện trước tên người chơi thường. Để trống = không có gì.\nMã màu: &a xanh lá, &c đỏ, &e vàng (không dùng chữ đậm: font tiếng Việt bị nhòe)…\nKhi lưu: ghi vào LuckPerms, cả mạng thấy ngay.", label: "Dân (mặc định): prefix", type: text,
          commands: ["lp group default meta removeprefix 0", "lp group default meta setprefix 0 \"{value} \""] }
      - { key: role_builder_prefix, label: "Builder: prefix", type: text,
          commands: ["lp group builder meta removeprefix 40", "lp group builder meta setprefix 40 \"{value} \""] }
      - { key: role_helper_prefix, label: "Helper: prefix", type: text,
          commands: ["lp group helper meta removeprefix 50", "lp group helper meta setprefix 50 \"{value} \""] }
      - { key: role_mod_prefix, label: "Mod: prefix", type: text,
          commands: ["lp group mod meta removeprefix 70", "lp group mod meta setprefix 70 \"{value} \""] }
      - { key: role_quanly_prefix, label: "Manager: prefix", type: text,
          commands: ["lp group quanly meta clear prefix", "lp group quanly meta setprefix 90 \"{value} \""] }
      - { key: role_admin_prefix, info: "Khi lưu: xoá mọi prefix cũ của role trong LuckPerms rồi đặt cái mới (tránh hiện hai prefix).", label: "Admin: prefix", type: text,
          commands: ["lp group admin meta removeprefix 100", "lp group admin meta setprefix 100 \"{value} \""] }
