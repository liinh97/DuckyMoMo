  - title: Ủng hộ bằng QR trong game (/rank mua)
    category: Rank donate
    description: "Người chơi gõ /rank mua, chọn gói → mã VietQR hiện trên tấm bản đồ trong tay → bấm [Tôi đã chuyển khoản] → admin duyệt ở trang quản trị > Donate (chung hàng chờ với trang web). Tài khoản ngân hàng lấy từ site/config/site.yml (donate). Giá các gói lấy từ nhóm Rank donate ở trên."
    apply: [dmm reload]
    settings:
      - { key: dqr_on, label: Bật QR trong game, type: select, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-qr.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: "Tắt (chỉ hiện hướng dẫn mua)" } ] }
      - { key: dqr_minutes, label: Mã QR hết hạn sau (phút), type: int, min: 1, max: 60, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-qr.minutes }
      - { key: dqr_web, label: Link trang tài khoản (khi không tạo được QR), type: text, servers: [lobby, banghoi-1, practice-1], file: plugins/DuckyMoMoCore/config.yml, path: donate-qr.web }

  - title: Sảnh (lobby)
    category: Sảnh
    apply: [dmm reload]
    settings:
      - { key: lobby_void_y, label: Rơi thấp hơn độ cao này thì về spawn, type: int, min: -64, max: 300, servers: [lobby], file: plugins/DuckyMoMoCore/config.yml, path: void-teleport.below-y,
          note: "Đảo Sakura thấp nhất khoảng y 20-50. Spawn ở y 89." }
      - { key: lobby_spawn_on_join, label: Mỗi lần vào đều đứng ở spawn, type: select, servers: [lobby], file: plugins/DuckyMoMoCore/config.yml, path: void-teleport.spawn-on-join,
          options: [ { value: true, label: Có }, { value: false, label: "Không (vào lại chỗ thoát lần trước)" } ] }

  - title: Hiệu ứng hạt (PlayerParticles)
    category: Rank donate
    description: "Có hiệu lực sau khi khởi động lại lobby và Bang Hội Chiến (lệnh pp reload của plugin không chạy được qua RCON)."
    settings:
      - { key: pp_toggle_on_combat, label: Ẩn hiệu ứng khi đang đánh nhau, type: select, servers: [lobby, banghoi-1], file: plugins/PlayerParticles/config.yml, path: toggle-on-combat,
          options: [ { value: true, label: "Có (nên bật: hạt làm lộ vị trí trong chiến tranh)" }, { value: false, label: Không } ] }
      - { key: pp_max_default, label: Số hiệu ứng cho người KHÔNG có rank, type: int, min: 0, max: 10, servers: [lobby, banghoi-1], file: plugins/PlayerParticles/config.yml, path: max-particles,
          note: "0 = chỉ người có rank (Tử Tước trở lên) mới dùng được /pp." }

  - title: Role chức vụ - prefix
    info: "Là gì: role staff (Admin, Manager, Mod, Helper, Builder) và Dân.\nSửa ở đây: chỉ prefix.\nThêm người, bật quyền: trang Role & rank."
    category: Role
    description: "Prefix hiện trước tên trong chat và Tab (mã màu &a, &c, &l đậm...). Cấp / gỡ role cho người chơi: trang Role (link trên thanh đầu). Quyền của từng role: lệnh /lp trong game (xem cẩm nang LuckPerms)."
    settings:
      - { key: role_default_prefix, info: "Là gì: chữ hiện trước tên người chơi thường. Để trống = không có gì.\nMã màu: &a xanh lá, &c đỏ, &e vàng, &l đậm…\nKhi lưu: ghi vào LuckPerms, cả mạng thấy ngay.", label: "Dân (mặc định): prefix", type: text,
          commands: ["lp group default meta removeprefix 0", "lp group default meta setprefix 0 \"{value} \""] }
      - { key: role_builder_prefix, label: "Builder: prefix", type: text,
          commands: ["lp group builder meta removeprefix 40", "lp group builder meta setprefix 40 \"{value} \""] }
      - { key: role_helper_prefix, label: "Helper: prefix", type: text,
          commands: ["lp group helper meta removeprefix 50", "lp group helper meta setprefix 50 \"{value} \""] }
      - { key: role_mod_prefix, label: "Mod: prefix", type: text,
          commands: ["lp group mod meta removeprefix 70", "lp group mod meta setprefix 70 \"{value} \""] }
      - { key: role_quanly_prefix, label: "Manager: prefix", type: text,
          commands: ["lp group quanly meta clear prefix", "lp group quanly meta setprefix 90 \"{value} \""] }
      - { key: role_admin_prefix, info: "Khi lưu: xoá mọi prefix cũ của role trong LuckPerms rồi đặt cái mới (tránh hiện hai prefix).", label: "Admin: prefix", type: text,
          commands: ["lp group admin meta removeprefix 100", "lp group admin meta setprefix 100 \"{value} \""] }
