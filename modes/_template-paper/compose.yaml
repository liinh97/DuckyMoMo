# Khuôn mẫu chế độ Paper. Dùng ./ops/new-mode.sh <id> để tạo chế độ mới từ khuôn này.
services:
  __MODE_ID__-1:
    image: itzg/minecraft-server
    profiles: ["__MODE_ID__"]     # đang thử: chỉ chạy khi --profile __MODE_ID__. Bỏ dòng này khi mở chính thức
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: ${MC_VERSION:-LATEST}
      MEMORY: 3G
      TZ: Asia/Ho_Chi_Minh
      ONLINE_MODE: "FALSE"
      MODRINTH_PROJECTS: |
        luckperms
      CFG_SERVER_NAME: __MODE_ID__-1
      CFG_VELOCITY_SECRET: ${VELOCITY_SECRET}
      CFG_DB_USER: ${DB_USER}
      CFG_DB_PASSWORD: ${DB_PASSWORD}
      CFG_REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 4g
    volumes:
      - ../../data/__MODE_ID__-1:/data
      - ./server/config:/config:ro
      - ./server/plugins:/plugins:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Sao lưu thế giới + dữ liệu plugin của __MODE_ID__-1 bằng restic (chỉ lưu phần thay đổi).
  # Dùng RCON tạm dừng ghi khi sao lưu; mật khẩu RCON tự đọc từ data/.rcon-cli.env. Xem docs/backup.md.
  backup-__MODE_ID__-1:
    image: itzg/mc-backup
    profiles: ["__MODE_ID__"]
    restart: unless-stopped
    hostname: backup-__MODE_ID__-1       # restic phân biệt bản sao lưu theo hostname, phải cố định
    environment:
      TZ: Asia/Ho_Chi_Minh
      BACKUP_METHOD: restic
      BACKUP_NAME: __MODE_ID__-1
      RCON_HOST: __MODE_ID__-1
      BACKUP_INTERVAL: 1h
      PAUSE_IF_NO_PLAYERS: "true"   # không ai chơi thì không sao lưu lại
      INITIAL_DELAY: 5m
      RESTIC_REPOSITORY: /backups/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Chưa đặt RESTIC_PASSWORD trong .env}
      RESTIC_RETRY_LOCK: 5m         # nhiều service dùng chung một kho
      PRUNE_RESTIC_RETENTION: --keep-hourly 24 --keep-daily 14 --keep-weekly 8
    volumes:
      - ../../data/__MODE_ID__-1:/data:ro
      - ../../backups:/backups
    depends_on:
      __MODE_ID__-1:
        condition: service_started
