services:
  banghoi-1:
    image: itzg/minecraft-server
    restart: unless-stopped
    stop_grace_period: 1m        # cho server đủ thời gian lưu thế giới khi tắt (mặc định Docker chỉ chờ 10 giây)
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: ${MC_VERSION:-26.2}
      # 11/10/2026: máy lên 64 GB, WSL 40 GB. Bật bộ tham số GC của Aikar (khuyên dùng cho Paper, ít khựng hơn).
      # Aikar giữ sẵn cả heap (Xms = Xmx = MEMORY, AlwaysPreTouch) nên container luôn dùng ~MEMORY + 1-1,5 GB.
      # Map rộng, nhiều người bay khắp nơi tốn chunk: 6G đủ cho vài chục người. Đông hơn thì tăng (và mem_limit).
      MEMORY: 6G
      MAX_PLAYERS: 100        # tối đa người trong server này (theo RAM 6G; muốn hơn thì tăng MEMORY). Mặc định Minecraft là 20; proxy hiện 500 cho cả mạng
      USE_AIKAR_FLAGS: "true"
      SYNC_CHUNK_WRITES: "FALSE"   # 19/10: ghi chunk không chờ ổ đĩa (Paper tự ghi an toàn), bớt khựng khi lưu
      TZ: Asia/Ho_Chi_Minh
      RCON_PASSWORD: ${RCON_PASSWORD:?Chưa đặt RCON_PASSWORD trong .env (chạy lại ./ops/init.sh)}   # dùng chung với dịch vụ sao lưu, trang Cài đặt
      ONLINE_MODE: "FALSE"
      # Gói font tiếng Việt (ops/build-font-pack.sh ghi FONT_PACK_URL/SHA1 vào .env). Không bắt buộc: từ chối vẫn chơi được.
      # 20/10: server.properties KHÔNG gửi gói nữa; DuckyMoMoCore gửi theo lựa chọn từng người (/caidat › Font tiếng Việt)
      RESOURCE_PACK: ""
      RESOURCE_PACK_SHA1: ""
      CFG_FONT_PACK_URL: ${FONT_PACK_URL:-}
      CFG_FONT_PACK_SHA1: ${FONT_PACK_SHA1:-}
      CFG_ITEM_PACK_URL: ${ITEM_PACK_URL:-}
      CFG_ITEM_PACK_SHA1: ${ITEM_PACK_SHA1:-}
      RESOURCE_PACK_ENFORCE: "FALSE"
      RESOURCE_PACK_PROMPT: '{"text":"Tải font tiếng Việt dễ đọc (khoảng 60 KB)? Bấm Có để chữ có dấu rõ hơn.","color":"gold"}'
      MOTD: "Bang Hoi Chien"
      DIFFICULTY: normal
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      # Plugin tải tự động từ Modrinth. Plugin không có trên Modrinth: đặt .jar vào ./server/plugins
      # viaversion/viabackwards/viarewind: cho client nhiều phiên bản vào (cài trên server Paper, không cài ở proxy).
      #   viaversion: client mới hơn server, viabackwards: client cũ hơn, viarewind: 1.7-1.8
      # Lưu ý: dòng bắt đầu bằng # BÊN TRONG khối '|' không phải comment, image itzg sẽ đọc thành tên plugin.
      # towny: thị trấn/quốc gia; vaultunlocked: lớp nối kinh tế; coreprotect: ghi lại phá/đặt để khôi phục;
      # worldguard: bảo vệ spawn/chợ; chunkyborder: viền thế giới hình chữ nhật (vùng mùa). Thiết kế: docs/banghoi-design.md
      # Trade (12/10): quickshop-hikari = cửa hàng rương của người chơi; zauctionhouse = chợ đấu giá /ah;
      #   tradepro = trao đổi trực tiếp /trade <tên> (hai bên cùng xác nhận). zauctionhouse cần zmenu + placeholderapi.
      # 12/10: grimac = chống hack (chỉ có bản ALPHA cho 26.2, ghim id bản 2.3.74; có bản chính thức thì bỏ ":id");
      #   pvpmanager = gắn cờ đánh nhau, thoát game khi đang đánh thì chết + rơi đồ (CombatLogX chưa có 26.2);
      #   (21/10: bỏ ujobs, nghề dùng Jobs Reborn ở SPIGET_RESOURCES bên dưới: mỗi người chọn 1 nghề);
      #   squaremap = bản đồ web (cổng 8080 trong container, mở ra máy ở SQUAREMAP_PORT, Trạm 6 /mc/map);
      #   tab-was-taken (TAB) = bảng bên phải, boss bar, đầu/cuối danh sách Tab, prefix trong Tab.
      #   playerparticles (/pp hiệu ứng hạt), simplepets (/pet): quyền lợi trang trí của rank donate (tools/donate-ranks.cmds).
      #   enchantio = phù phép mới kiểu gốc (sách ra từ rương/câu cá/dân làng -> hàng để đổi bán); chọn phù phép ở plugins/Enchantio/.
      #   crazyenchantments (BETA cho 26.x, ghim id) = 105 phù phép kiểu factions + sách tỉ lệ thành công, cuộn giấy, thợ rèn;
      #     shop /ce chỉ bán Thường/Hiếm bằng tiền, Huyền thoại/Thần thoại admin phát (người dùng chọn hướng C 12/10).
      #   Shopkeepers 2.28.1 (dev.bukkit, link ghim ở PLUGINS) = dân làng NPC bán hàng (/shopkeeper); shopkeepers-addon = bán bằng tiền + menu tìm shop.
      #   discordsrv = chat game <-> Discord (token bot, kênh: DISCORD_BOT_TOKEN, DISCORD_CHANNEL_ID trong .env; trống thì plugin tự tắt).
      #   elitemobs (14/10, GPL, MagmaGuy) = dungeon cày đồ/tiền + boss tuỳ chỉnh + sự kiện boss; dungeon tải trong game /em setup
      #     (cần mã tài khoản Nightbreak của chủ server). Tắt quái elite tự sinh ở world chính (xem docs/HANDOFF.md).
      #   evenmorefish (15/10, GPL, miễn phí) = câu cá kiểu mới: 24 loại cá Việt theo mùa mưa/khô (%dmmmua_id% của DuckyMoMoCore), độ dài, nhật ký,
      #     bán cá /emf shop, thi câu cuối tuần. Giữ đồ kho báu gốc (only-fish). Config: server/plugins/EvenMoreFish/. Không cần resource pack (Bedrock chơi được).
      # simple-voice-chat (15/10): voice theo khoảng cách cho người chơi Java có cài mod; cấu hình ở plugins/voicechat/, đi qua proxy (UDP 24454).
      # betonquest (19/10, GPL, ghim bản 3.2.0) = cốt truyện + hội thoại NPC + nhiệm vụ nhiều bước; NPC là Citizens (link ghim ở PLUGINS).
      #   Nhiệm vụ: server/plugins/BetonQuest/QuestPackages/ (mỗi chương một thư mục). Tắt tự cập nhật trong config.yml (itzg quản lý jar).
      # auraskills (19/10, GPL, ghim bản 2.4.0) = kỹ năng nghề /skills ở «mức cơ bản»: 6 kỹ năng (trồng, đốn gỗ, đào mỏ, câu cá, đào đất, pha chế),
      #   trần 20, chỉ số chiến đấu rất nhỏ (tổng +1 tim, +2% sát thương), khả năng mana bậc 1; config server/plugins/AuraSkills/; reset mỗi mùa (DuckyMoMoCore).
      MODRINTH_PROJECTS: |
        luckperms
        worldedit
        chunky
        viaversion
        viabackwards
        viarewind
        decentholograms
        towny
        vaultunlocked
        coreprotect
        worldguard
        chunkyborder
        quickshop-hikari
        placeholderapi
        zmenu
        zauctionhouse
        tradepro
        grimac:nKI7MWZj
        pvpmanager
        squaremap
        tab-was-taken
        discordsrv
        playerparticles
        simplepets
        enchantio
        crazyenchantments:QUo33hOY
        shopkeepers-addon
        elitemobs
        evenmorefish
        simple-voice-chat
        mypet:mkMAIOff
        packetevents:m78nFxYg
        holomobhealth:2uTDD4QT
        holomobhealth-packetevents:ZobuhUo8
        betonquest:Sfp4oOVr
        auraskills:9rSJ3THD
      # Plugin không có (hoặc chưa có bản 26.2) trên Modrinth: ghim link tải cụ thể. Nâng cấp: thay link.
      #   Shopkeepers 2.28.1 (dev.bukkit / forgecdn, Spigot ghi đã thử 26.2), SiegeWar 3.7.0 (GitHub), OldCombatMechanics 2.7.0 (GitHub, combat kiểu 1.8),
      #   EssentialsX bản dev #1832 (bản chính thức 2.22.0 mới tới 26.1.2): lõi + Chat + Spawn
      #   Citizens 2.0.44 build 4265 (Jenkins chính chủ, có nms v26_2; không có trên Modrinth): NPC cho cốt truyện BetonQuest
      # Spigot (qua Spiget, luôn lấy bản mới nhất): CMILib 87610 (thư viện bắt buộc của Jobs), Jobs Reborn 4216 (nghề, 21/10 thay uJobs:
      #   mỗi người chọn 1 nghề; 5.2.6.7 ghi hỗ trợ 26.2). Cấu hình: server/plugins/Jobs/ (sinh bằng tools/jobs/chuyen-ujobs.py).
      SPIGET_RESOURCES: "87610,4216"
      # 24/10: link GitHub (SiegeWar 3.7.0, OldCombatMechanics 2.7.0) BỎ khỏi PLUGINS: sau khi máy khởi động lại, mc-image-helper kiểm tra
      # GitHub bị ngắt kết nối (PrematureCloseException) -> server không lên. Bỏ khỏi danh sách thì mc-image-helper XOÁ jar nó từng tải,
      # nên jar được tải tay (curl) vào data/<server>/plugins; máy mới cũng tải tay: github.com/TownyAdvanced/SiegeWar/releases/download/3.7.0/SiegeWar-3.7.0.jar,
      # github.com/kernitus/BukkitOldCombatMechanics/releases/download/v2.7.0/OldCombatMechanics.jar
      PLUGINS: |
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        https://cdn.modrinth.com/data/TsLS8Py5/versions/ziIzW16f/SkinsRestorer.jar
        https://mediafilez.forgecdn.net/files/8983/363/Shopkeepers-2.28.1.jar
        https://ci.ender.zone/job/EssentialsX/1832/artifact/jars/EssentialsX-2.22.1-dev%2B27-e70bdb8.jar
        https://ci.ender.zone/job/EssentialsX/1832/artifact/jars/EssentialsXChat-2.22.1-dev%2B27-e70bdb8.jar
        https://ci.ender.zone/job/EssentialsX/1832/artifact/jars/EssentialsXSpawn-2.22.1-dev%2B27-e70bdb8.jar
        https://cdn.modrinth.com/data/YbRigZrU/versions/tlCVriD3/nuvotifier-bukkit-3.3.6-dist.jar
        https://ci.citizensnpcs.co/job/Citizens2/4265/artifact/dist/target/Citizens-2.0.44-b4265.jar
      CFG_SERVER_NAME: banghoi-1
      CFG_YOUTUBE_KEY: ${YOUTUBE_KEY:-}   # Media: khoá YouTube Data API v3 (kiểm kênh YouTube có đang live), trống = không kiểm
      # /rank mua (QR ủng hộ trong game): plugin hỏi panel tạo yêu cầu donate, cùng khoá với trang web
      PANEL_URL: http://panel:8080
      PANEL_SITE_KEY: ${PANEL_SITE_KEY:-}
      CFG_DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      CFG_DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-000000000000000000}
      CFG_VELOCITY_SECRET: ${VELOCITY_SECRET}
      CFG_DB_USER: ${DB_USER}
      CFG_DB_PASSWORD: ${DB_PASSWORD}
      CFG_REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${SQUAREMAP_PORT:-8890}:8080"   # bản đồ web squaremap (chỉ máy nhà; Trạm 6 chuyển tiếp)
    mem_limit: 10g             # heap 6G + bộ nhớ ngoài heap khi nạp nhiều chunk (trang trí map dùng ~7,5 GB)
    volumes:
      - ../../data/banghoi-1:/data
      - ../../data/proxy/plugins/floodgate/key.pem:/run/floodgate/key.pem:ro
      - ../../data/shared:/shared            # dùng chung giữa các server: vinh danh mùa (vinhdanh/S<mùa>.json) cho sảnh + web   # khoá Floodgate chung với proxy (plugins/floodgate/config.yml: key-file-name)
      - ./server/config:/config:ro
      - ./server/plugins:/plugins:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Sao lưu thế giới + plugin của banghoi-1 (itzg/mc-backup + restic: tạm dừng ghi qua RCON, chỉ lưu phần thay đổi, xoá bản quá hạn).
  # Sao lưu ngay: docker compose exec backup-banghoi-1 backup now. Khôi phục: README.md, mục "Sao lưu và khôi phục".
  backup-banghoi-1:
    image: itzg/mc-backup
    restart: unless-stopped
    environment:
      RCON_HOST: banghoi-1
      RCON_PASSWORD: ${RCON_PASSWORD}
      BACKUP_NAME: banghoi-1
      BACKUP_INTERVAL: ${BACKUP_INTERVAL_THEGIOI:-1h}   # 25/10: 6h -> 1h (world người chơi xây; restic chỉ lưu phần đổi, ~2 giây/lần)
      # restic: kho sao lưu khử trùng lặp, lần đầu ~ cỡ world, các lần sau chỉ phần thay đổi (map 1:1000 nặng 17+ GB,
      # nén tar.gz mỗi lần sẽ đầy ổ). Mất RESTIC_PASSWORD là KHÔNG khôi phục được: cất thêm một bản ngoài máy.
      BACKUP_METHOD: restic
      RESTIC_REPOSITORY: /backups/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Chưa đặt RESTIC_PASSWORD trong .env (chạy lại ./ops/init.sh)}
      RESTIC_HOSTNAME: banghoi-1
      PRUNE_RESTIC_RETENTION: "--keep-within ${BACKUP_KEEP_DAYS:-7}d --keep-daily 30"
      # Không sao lưu file tải lại được (*.jar), log, cache, và các world cũ đã cất bằng ops/doi-map-banghoi.sh
      EXCLUDES: "*.jar,cache,logs,*.tmp,world-*"   # world-* = các world cũ đã cất (world_nether, world_the_end dùng dấu gạch dưới nên vẫn được sao lưu)
      PAUSE_IF_NO_PLAYERS: "false"     # 19/10: LUÔN sao lưu theo giờ (trước bật "true": không ai online là chờ mãi → mất cả ngày cấu hình). restic chỉ lưu phần đổi nên nhẹ
      INITIAL_DELAY: 5m
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ../../data/banghoi-1:/data:ro
      # BACKUP_DIR trong .env phải là đường dẫn tuyệt đối (ví dụ /mnt/f/DuckyMoMo-backups); bỏ trống = backups/ trong repo
      - ${BACKUP_DIR:-../../backups}/banghoi-1:/backups
    depends_on:
      - banghoi-1
