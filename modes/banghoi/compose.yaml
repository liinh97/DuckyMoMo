services:
  banghoi-1:
    image: itzg/minecraft-server
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: ${MC_VERSION:-LATEST}
      MEMORY: 4G
      TZ: Asia/Ho_Chi_Minh
      ONLINE_MODE: "FALSE"
      MOTD: "Bang Hoi Chien"
      DIFFICULTY: normal
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      # Plugin tải tự động từ Modrinth. Plugin không có trên Modrinth: đặt .jar vào ./server/plugins
      MODRINTH_PROJECTS: |
        luckperms
        worldedit
        chunky
      CFG_SERVER_NAME: banghoi-1
      CFG_VELOCITY_SECRET: ${VELOCITY_SECRET}
      CFG_DB_USER: ${DB_USER}
      CFG_DB_PASSWORD: ${DB_PASSWORD}
      CFG_REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 5g
    volumes:
      - ../../data/banghoi-1:/data
      - ./server/config:/config:ro
      - ./server/plugins:/plugins:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Sao lưu thế giới + dữ liệu plugin của banghoi-1 bằng restic (chỉ lưu phần thay đổi).
  # Dùng RCON tạm dừng ghi khi sao lưu; mật khẩu RCON tự đọc từ data/.rcon-cli.env. Xem docs/backup.md.
  backup-banghoi-1:
    image: itzg/mc-backup
    restart: unless-stopped
    hostname: backup-banghoi-1       # restic phân biệt bản sao lưu theo hostname, phải cố định
    environment:
      TZ: Asia/Ho_Chi_Minh
      BACKUP_METHOD: restic
      BACKUP_NAME: banghoi-1
      RCON_HOST: banghoi-1
      BACKUP_INTERVAL: 1h
      PAUSE_IF_NO_PLAYERS: "true"   # không ai chơi thì không sao lưu lại
      INITIAL_DELAY: 5m
      RESTIC_REPOSITORY: /backups/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Chưa đặt RESTIC_PASSWORD trong .env}
      RESTIC_RETRY_LOCK: 5m         # nhiều service dùng chung một kho
      PRUNE_RESTIC_RETENTION: --keep-hourly 24 --keep-daily 14 --keep-weekly 8
    volumes:
      - ../../data/banghoi-1:/data:ro
      - ../../backups:/backups
    depends_on:
      banghoi-1:
        condition: service_started
