# -----------------------------------
# AuraSkills global message file
#
# This file defines formats and styles
# common across all languages
# -----------------------------------

abilities:
  alchemist:
    lore: "<green>(+{duration})"
action_bar:
  # DuckyMoMo 19/10: dòng chỉ số trên thanh máu "❤ [20/20] | ⚔ [Cấp 5] | ✦ [20/20]" (⚔ = cấp Thăng Cấp, PlaceholderAPI %dmmcap_cap%; ✦ = mana).
  # File này có trong repo (modes/banghoi/server/plugins/AuraSkills/messages/global.yml), áp: /skills reload.
  idle: "{{action_bar.hp_display}} <dark_gray>| %dmmcap_mau_mm%⚔ [Cấp %dmmcap_cap%] <dark_gray>| {{action_bar.mana_display}}%dmmcap_hud_mm%"
  hp_display: "<red>❤ [{hp}/{max_hp}]"
  mana_display: "<aqua>✦ [{mana}/{max_mana}]"
  xp: "{{action_bar.hp_display}}  <gold>{xp_gained} {skill} {{units.xp}} <gray>({current_xp}/{level_xp} {{units.xp}})  {{action_bar.mana_display}}"
  maxed: "{{action_bar.hp_display}}  <gold>{xp_gained} {skill} {{units.xp}} <gray>({{ui.maxed}})  {{action_bar.mana_display}}"
  ability: "{message}"
  boss_bar_xp: "<aqua>Kỹ năng <dark_gray>· <gold>{xp_gained} {skill} {{units.xp}} <gray>({percent}%)"
  boss_bar_maxed: "<aqua>Kỹ năng <dark_gray>· <gold>{xp_gained} {skill} {{units.xp}} <gray>({{ui.maxed}})"
  boss_bar_income: "<aqua>Kỹ năng <dark_gray>· <gold>{xp_gained} {skill} {{units.xp}} <gray>({percent}%) <green>(+{income} xu)"
  boss_bar_income_maxed: "<aqua>Kỹ năng <dark_gray>· <gold>{xp_gained} {skill} {{units.xp}} <gray>({{ui.maxed}}) <green>(+{income} xu)"
acf:
  core:
    info_message: "{message}"
    help_format: "<aqua>{commandprefix}{command} <green>{parameters} <yellow>{separator} {description}"
    help_detailed_command_format: "<aqua>{command} <green>{parameters} <yellow>{separator} {description}"
    help_detailed_parameter_format: "<green>{syntaxorname}: <yellow>{description}"
commands:
  armor:
    modifier:
      add:
        lore: "<gray>{stat}: {color}+{value}"
        lore_subtract: "<gray>{stat}: {color}-{value}"
        lore_add_percent: "<gray>{stat}: {color}+{value}%"
        lore_subtract_percent: "<gray>{stat}: {color}-{value}%"
        lore_multiply: "<gray>{stat}: {color}{value}x"
      list:
        entry: "  {color}{stat}<white> - {value}"
    multiplier:
      list:
        entry: "  <aqua>{target}<white> - {value}"
    requirement:
      list:
        entry: "  <dark_aqua>{skill} <white>- <aqua>{level}"
      entry: "<aqua>{skill} {level}<gray>, "
  item:
    modifier:
      add:
        lore: "<gray>{stat}: {color}+{value}"
        lore_subtract: "<gray>{stat}: {color}-{value}"
        lore_add_percent: "<gray>{stat}: {color}+{value}%"
        lore_subtract_percent: "<gray>{stat}: {color}-{value}%"
        lore_multiply: "<gray>{stat}: {color}{value}x"
      list:
        entry: "  {color}{stat}<white> - {value}"
    multiplier:
      list:
        entry: "  <aqua>{target}<white> - {value}"
    requirement:
      list:
        entry: "  <dark_aqua>{skill} <white>- <aqua>{level}"
      entry: "<aqua>{skill} {level}<gray>, "
  preset:
    load:
      appended_entry: "<aqua>(+) <white>{file}"
      merged_entry: "<yellow>(*) <white>{file}"
      replaced_entry: "<red>(±) <white>{file}"
      deleted_entry: "<dark_red>(-) <white>{file}"
  top:
    power_entry: "<white>{rank}. <aqua>{player} <white>- {level}"
    skill_entry: "<white>{rank}. <aqua>{player} <white>- {level}"
    average_entry: "<white>{rank}. <aqua>{player} <white>- {level}"
leveler_format:
  title: "<green>{{leveler.level_up}}"
  subtitle: "<gold>{old} ➜ {new}"
  chat: |-
    <dark_aqua><strikethrough>----------------------------------------
    <reset> <dark_aqua>{{leveler.skill_level_up}} <aqua>{skill} <dark_gray>{old}➜<dark_aqua>{new}
    
    <aqua> {{leveler.rewards}}:{stat_level}{ability_unlock}{ability_level_up}{mana_ability_unlock}{mana_ability_level_up}{money_reward}<reset>
    <dark_aqua><strikethrough>----------------------------------------
  stat_level: "\n  {color}+{num}{symbol} {stat}"
  ability_unlock: "\n  <green>{{leveler.ability_unlock}} <gold>{ability}\n      <white>{desc}"
  ability_level_up: "\n  <green>{{leveler.ability_level_up}} <gold>{ability} <dark_gray>{previous}→<gold>{level}\n      <white>{desc}"
  mana_ability_unlock: "\n  <light_purple>{{leveler.mana_ability_unlock}} <blue>{mana_ability}\n      <white>{desc}"
  mana_ability_level_up: "\n  <light_purple>{{leveler.mana_ability_level_up}} <blue>{mana_ability} <dark_gray>{previous}→<gold>{level}\n      <white>{desc}"
  money_reward: "\n  <green>{amount} xu"
  desc_upgrade_value: "<dark_gray>{current}→<white>{next}"
  desc_wrap: "<white>      "
rewards:
  item:
    default_menu_message: "\n  {display_name}"
    default_menu_message_multiple: "\n  {display_name} {amount}x"
    default_chat_message: "\n  {display_name}"
    default_chat_message_multiple: "\n  {display_name} {amount}x"
stats:
  strength:
    color: "<dark_red>"
    symbol: "➽"
  health:
    color: "<red>"
    symbol: "❤"
  regeneration:
    color: "<gold>"
    symbol: "❥"
  luck:
    color: "<dark_green>"
    symbol: "☘"
  wisdom:
    color: "<blue>"
    symbol: "✿"
  toughness:
    color: "<dark_purple>"
    symbol: "✦"
  crit_chance:
    color: "<green>"
    symbol: "⌘"
  crit_damage:
    color: "<dark_aqua>"
    symbol: "★"
  speed:
    color: "<white>"
    symbol: "➤"
file_version: 3
