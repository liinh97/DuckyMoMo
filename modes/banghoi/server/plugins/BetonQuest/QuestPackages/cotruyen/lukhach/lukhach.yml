        actions: lk_hoinuoc_danghe
      dau_don:
        text: 'Người ta đồn thế này: %ph.dmmlk_hoinuoc_tindon% Tìm được cổng thì đứng giữa rồi ngồi xuống (Shift). Đi qua rồi quay lại kể ta nghe.'
        conditions: lk_hoinuoc_cocong
        actions: lk_hoinuoc_danghe
      dau_chua:
        text: Cánh cổng dẫn tới Xưởng Hơi Nước chưa mở ra. Khi nó mở, cả vùng sẽ xôn xao tin đồn (/conghoang). Lúc ấy hãy đi tìm, rồi quay lại kể ta nghe. Mà ta thì chẳng ở yên một chỗ đâu.
        actions: lk_hoinuoc_danghe
      chao_lai:
        text: Lại là cháu à? Đã tìm ra đường tới đó chưa?
        conditions: lk_hoinuoc_nghe,!lk_hoinuoc_qua
        pointers: hoi_dau,hoi_lai,di
      tra:
        text: Cháu xuống tận xưởng rồi? Lò hơi còn cháy không?
        conditions: lk_hoinuoc_qua,!lk_hoinuoc_xong
        pointers: ke
      camon:
        text: Đúng như ta sợ… Cầm lấy, và đừng bao giờ vặn cái van đỏ.
        actions: lk_hoinuoc_tra
      xong:
        text: Ta vẫn giữ cái cờ lê. Biết đâu một ngày cần đến.
        conditions: lk_hoinuoc_xong
    player_options:
      hoi:
        text: Có chuyện gì vậy?
        pointers: ke1
      hoi_lai:
        text: Kể lại chuyện hôm trước đi.
        pointers: ke1
      hoi_dau:
        text: Nơi đó ở đâu?
        pointers: dau_chu,dau_tim,dau_don,dau_chua
      ke:
        text: Lò vẫn cháy, máy vẫn chạy, và chẳng còn bóng người nào điều khiển chúng.
        pointers: camon
      di:
        text: Tôi đi đây.
