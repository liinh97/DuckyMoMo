# Cốt truyện DuckyMoMo (BetonQuest). Mỗi chương một thư mục con (chuong1/, chuong2/…), cùng một gói "cotruyen".
# NPC là Citizens, gọi theo ID (23/10: byName không nhận NPC). Admin đứng chỗ muốn đặt rồi gõ đúng tên, ví dụ
#   /npc create Già Làng      /npc create Bác Thợ Rèn      /npc create Người Gác Cổng
#   (thêm /npc lookclose để NPC quay mặt theo người chơi; /npc skin <tên người chơi> để đổi skin)
# rồi xem ID (/npc select, /npc list) và ghi ID vào npcs dưới đây. Đặt lại NPC (ID mới) thì sửa số. Nạp lại: /bq reload.
# Số lượng và phần thưởng nằm ở constants (sửa trên trang Cài đặt › Cốt truyện).

# Phiên bản cú pháp gói (BetonQuest 3.2.0). Thiếu dòng này thì plugin tự ghi thêm và lưu đè cả gói.
package:
  version: "3.2.0-QUEST-2"

npcs:
  gia_lang: 'citizens 22'      # 23/10: theo tên (byName) không nhận NPC -> dùng ID Citizens (/npc select xem ID; đặt lại NPC thì sửa số)
  tho_ren: 'citizens 23'
  gac_cong: 'citizens 24'

npc_conversations:
  gia_lang: gia_lang
  tho_ren: tho_ren
  gac_cong: gac_cong

constants:
  # Chương 1: số lượng
  c1_so_quai: 20
  c1_so_sat: 16
  c1_so_quang: 24
  # Chương 1: thưởng (xu) từng bước và thưởng kết chương
  c1_thuong_b1: 450
  c1_thuong_b2: 450
  c1_thuong_b3: 600
  c1_thuong_b4: 450
  c1_thuong_ket: 2250
  c1_thuong_kn: 200
  # Lữ khách (lukhach/): thưởng (xu) khi đi qua Cổng Hoang rồi về kể, mỗi lữ khách 1 lần
  lk_thuong: 1500
