  Help:
  - '&2&nPhù phép CrazyEnchantments'
  - '&b/ce - &9Mở menu.'
  - '&b/tinker - &9Mở menu Thợ Tái Chế.'
  - '&b/blacksmith - &9Mở menu Thợ Rèn.'
  - '&b/gkitz [kit] [người chơi] - &9Mở menu GKit hoặc nhận GKit.'
  - '&b/gkitz reset <kit> [người chơi] - &9Làm mới thời gian chờ GKit.'
  - '&b/ce help - &9Xem mọi lệnh phù phép.'
  - '&b/ce debug - &9Kiểm tra nhanh một số lỗi.'
  - '&b/ce info [phù phép] - &9Xem thông tin phù phép.'
  - '&b/ce reload - &9Nạp lại cấu hình.'
  - '&b/ce remove <phù phép> - &9Gỡ phù phép khỏi món trên tay.'
  - '&b/ce add <phù phép> [cấp] - &9Thêm phù phép cho món trên tay.'
  - '&b/ce scroll <black/white/transmog> [số lượng] [người chơi] - &9Đưa cuộn giấy.'
  - '&b/ce crystal [số lượng] [người chơi] - &9Đưa Pha Lê Bảo Hộ.'
  - '&b/ce scrambler [số lượng] [người chơi] - &9Đưa Đá Xáo Trộn.'
  - '&b/ce dust <success/destroy/mystery> [số lượng] [người chơi] [phần trăm] - &9Đưa bụi.'
  - '&b/ce book <phù phép> [cấp/thấp-cao] [số lượng] [người chơi] - &9Đưa sách phù phép.'
  - '&b/ce lostbook <nhóm> [số lượng] [người chơi] - &9Đưa sách thất lạc.'
  - '&b/ce spawn <phù phép/nhóm> [(level:#/min-max)/world:<world>/x:#/y:#/z:#] - &9Thả sách phù phép tại toạ độ.'
