      - '&5▍ &fGiữ món đồ khi bạn chết'
      - '&8▍ &7Đồ có pha lê không rơi ra khi chết'
      - '&7&m                              '
      - '&eKéo thả&7: &flên món đồ'
    GUIName: '&5Pha Lê &bBảo Hộ'
    GUILore:
      - '&5▍ &fGiữ món đồ khi bạn chết'
      - '&8▍ &7Đồ có pha lê không rơi ra khi chết'
      - '&7&m                              '
      - '&8• &7Giá: &e1.500 xu'
      - '&7&m                              '
      - '&a➜ Bấm để mua'
  BlackSmith: #Options for the Black Smith
    InGUI: true #In the GUI.
    Slot: 24 #Slot it is in.
    Item: 'ANVIL' #Item that shows in the GUI
    # Item model settings
    Model:
      # minecraft, or nexo, or oraxen
      Namespace: ""
      # diamond_helmet
      Key: ""
    Glowing: false #If it has a glowing effect.
    Name: '&7Thợ &bRèn'             #Name of the Item in the GUI
    Lore: #Lore on the item.
      - '&b▍ &fGhép 2 sách, hoặc gộp phù phép 2 món đồ'
      - '&7&m                              '
      - '&a➜ Bấm để mở'
    GUIName: '&8Thợ Rèn'         #Name of the Black Smith's GUI
    Results:
      # Item customization
      Item:
        Type: "BARRIER"
        # Item model settings
        Model:
          # minecraft, or nexo, or oraxen
          Namespace: ""
          # diamond_helmet
          Key: ""
      None: '&cChưa có kết quả' #Name of the item when there are no results in the Black Smith
      Not-Found-Lore:
        - '&8▍ &7Chưa ghép được gì'
        - '&7&m                              '
        - '&8• &7Đặt 2 sách cùng phù phép, cùng cấp'
        - '&8• &7Hoặc 2 món đồ để gộp phù phép'
      Found: '&8• &7Giá: &e%cost% cấp kinh nghiệm' #The lore at the bottom of the item
    Transaction: #Options for the pricing
      Currency: XP_Level
      Costs: #Cost options
        Power-Up: 5 #When an enchantment levels up 1 on an item
        Add-Enchantment: 3 #When it adds an enchantment to the item from another item
        Book-Upgrade: 5 #Leveling up the power of a book
  Tinker: #Settings for Info item in the GUI
    InGUI: true #Toggle whether it is in the /CE GUI or not
    Slot: 22 #Slot it is in
    Item: 'NETHER_STAR' #Item it is
    # Item model settings
    Model:
      # minecraft, or nexo, or oraxen
      Namespace: ""
      # diamond_helmet
      Key: ""
    Glowing: false #If it has a glowing effect.
    Name: '&7Thợ &bTái &9Chế'        #Name of the Item
    Lore: #Lore of the item
      - '&9▍ &fĐổi sách, đồ phù phép lấy kinh nghiệm'
      - '&7&m                              '
      - '&a➜ Bấm để mở'
  Info: #Settings for Info item in the GUI
    InGUI: true #Toggle whether it is in the /CE GUI or not
