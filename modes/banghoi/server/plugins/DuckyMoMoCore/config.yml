# Mùa mưa / mùa khô (/mua). Đổi theo NGÀY THẬT giờ Việt Nam: start-date = ngày bắt đầu mùa đầu tiên trong order, mỗi mùa days-per-season ngày, lặp vòng.
# growth: hệ số lớn của cây theo khối mọc ra (WHEAT lúa mì, CARROTS, POTATOES, BEETROOTS, SUGAR_CANE, BAMBOO, CACTUS, MELON/PUMPKIN = quả,
#   MELON_STEM/PUMPKIN_STEM = dây, COCOA, KELP, SWEET_BERRY_BUSH). 0.5 = chậm một nửa, 1.5 = nhanh thêm ~50% (cây có tuổi). Không ghi = như gốc.
# harvest-bonus: % rơi thêm 1 nông sản khi gặt cây ĐÃ CHÍN (WHEAT, CARROTS, POTATOES, BEETROOTS, COCOA).
# rain-start-chance / rain-stop-chance: % mỗi 5 phút đổ mưa (khi đang tạnh) / tạnh (khi đang mưa), cộng với thời tiết gốc.
# Cá theo mùa: EvenMoreFish đọc %dmmmua_id% (plugins/EvenMoreFish/rarities/*.yml, requirements.placeholder). Đổi id mùa thì sửa cả ở đó.
# Admin thử: /mua dat kho · /mua dat tudong (trả về theo lịch).
seasons:
  enabled: true
  start-date: "2026-10-12"
  days-per-season: 7
  worlds: [world]
  join-message: true
  order: [mua, kho]
  list:
    mua:
      name: "&b⛆ Mùa mưa"
      subtitle: "&7Lúa, mía, tre lớn nhanh · cá linh, cá lóc về đồng"
      rain-start-chance: 25
      rain-stop-chance: 5
      temperature: 24          # nhiệt nền cho Thân nhiệt (body-temp), độ
      growth: {WHEAT: 1.4, SUGAR_CANE: 1.5, BAMBOO: 1.5, KELP: 1.3, MELON_STEM: 1.2, CACTUS: 0.5, POTATOES: 0.8, BEETROOTS: 0.8}
      harvest-bonus: {WHEAT: 25}
      hints:
        - "&b≈ Cá mùa này: &fcá linh, cá lóc đồng, cá rô phi, tôm càng, cua đồng, cá chình, cá tra dầu (huyền thoại)"
        - "&7Câu cá: &f/emf &7(nhật ký cá, bán cá: &f/emf shop&7)"
    kho:
      name: "&6☀ Mùa khô"
      subtitle: "&7Khoai, cà rốt, dưa, bí được mùa · cá cơm, cá kèo, mực ra khơi"
      rain-start-chance: 0
      rain-stop-chance: 50
      temperature: 30
      growth: {POTATOES: 1.4, CARROTS: 1.4, BEETROOTS: 1.3, MELON: 1.3, PUMPKIN: 1.3, COCOA: 1.3, CACTUS: 1.5, WHEAT: 0.8, SUGAR_CANE: 0.6, BAMBOO: 0.7}
      harvest-bonus: {POTATOES: 25, CARROTS: 25, BEETROOTS: 25}
      hints:
        - "&6≈ Cá mùa này: &fcá bống, cá kèo, cá hô (huyền thoại); ngoài biển: cá cơm, mực ống, cá mú"
        - "&7Câu cá: &f/emf &7(nhật ký cá, bán cá: &f/emf shop&7)"
  # Sự kiện trong mùa: from-day/to-day = ngày thứ mấy của mùa (số âm đếm từ cuối, -1 = ngày cuối). /mua sukien <id|tudong> để thử.
  events:
    lu:
      season: mua
      from-day: -1
      to-day: -1
      name: "&9≋ Lũ cuối mùa"
      subtitle: "&7Mưa suốt ngày · Thủy tộc dễ bắt · lúa ngập chậm lớn"
      rain: "on"
      growth: {WHEAT: 0.5, POTATOES: 0.7, CARROTS: 0.7, BEETROOTS: 0.7, KELP: 1.5, SUGAR_CANE: 1.3}   # nhân với mùa mưa: lúa 1,4×0,5 = chậm 30%
      capture-bonus: {thuytoc: 15}
    han:
      season: kho
      from-day: 3
      to-day: 4
      name: "&6✹ Hạn hán"
      subtitle: "&7Không mưa · cây lớn chậm · lương thực quý (kho lương x1,5)"
      rain: "off"
      growth: {WHEAT: 0.7, POTATOES: 0.7, CARROTS: 0.7, BEETROOTS: 0.7, MELON: 0.7, PUMPKIN: 0.7, SUGAR_CANE: 0.5, CACTUS: 1.3}
      supply-multiplier: 1.5
      capture-bonus: {bay: 5, nhay: 10}
    # 28/10 Thân nhiệt: đợt rét / nóng (temperature = nhiệt nền thay cho mùa trong những ngày này)
    retdam:
      season: mua
      from-day: 3
      to-day: 4
      name: "&b❄ Rét đậm"
      subtitle: "&7Mưa lạnh · ở ngoài lâu bị rét: vào nhà, lửa trại, Đá Ôn Linh hơ nóng (/nhietdo)"
      rain: "on"
      temperature: 4
    nangnong:
      season: kho
      from-day: 5
      to-day: 6
      name: "&c☀ Nắng nóng"
      subtitle: "&7Trời như đổ lửa · tìm bóng râm, cầm ô lá, Đá Ôn Linh ướp lạnh (/nhietdo)"
      rain: "off"
      temperature: 40

# Bản đồ kho báu (/khobau): rơi khi câu cá / hạ quái; cầm để dò nóng-lạnh, tới nơi Shift để đào, hạ lính canh để mở rương.
treasure:
  enabled: true
  fish-chance: 3          # % mỗi con cá câu được
  mob-chance: 0.5         # % mỗi quái thù địch bị hạ
  max-per-day: 5          # tối đa bản đồ mỗi người mỗi ngày (từ câu cá + quái)
  dig-radius: 4           # đứng trong ngần này khối quanh chỗ kho báu mới đào được
  guard-minutes: 5        # phải hạ hết lính canh trong ngần này phút (đứng trong 40 khối), không thì trả lại bản đồ
  tiers:
    thuong: {name: "&fKho báu thường", weight: 70, guards: 2, guard-types: [ZOMBIE, SKELETON], guard-health: 1.5, rewards: [xu 450, "vat IRON_INGOT 8"]}
    hiem: {name: "&bKho báu hiếm", weight: 25, guards: 3, guard-types: [VINDICATOR, SKELETON, SPIDER], guard-health: 2, rewards: [xu 1500, "vat DIAMOND 2", "vat GOLDEN_APPLE 1"]}
    huyenthoai: {name: "&6Kho báu huyền thoại", weight: 5, guards: 4, guard-types: [WITHER_SKELETON, VINDICATOR, EVOKER], guard-health: 3, broadcast: true, reveal-hidden: 40, rewards: [xu 7500, "vat DIAMOND 6", "vat ENCHANTED_GOLDEN_APPLE 1", "lenh buabatpet give {player} 2"]}

# Lệnh săn quái (/lenhsan, tên cũ /truyna): mỗi interval-minutes phút dán lệnh săn một quái mạnh ở vùng /tpr đã mở; ai gây nhiều sát thương nhất nhận thưởng.
wanted:
