    - {label: "Đĩa nhạc Cat (trang trí)", weight: 2, rare: true, rewards: ["vat MUSIC_DISC_CAT 1"]}

# Mảnh sự kiện + đổi quà (/doimanh). Mảnh là ĐỒ VẬT (trao đổi, bán được), có dấu ẩn nên không làm giả được.
# Phần thưởng "manh <loại> <số>" (điểm danh, nhiệm vụ, vòng quay…) bị giới hạn daily-cap mảnh/người/ngày.
# Boss/dungeon/admin phát bằng: /doimanh give <người> <loại> <số> (không tính giới hạn). until: hạn đổi yyyy-MM-dd (trống = không hạn).
# Loại = mã thư viện đồ (công dụng "Mảnh sự kiện"): tên, vật phẩm, mô tả sửa ở trang Thư viện đồ.
event-fragments:
  enabled: true
  daily-cap: 20
  types:
    lamnguy: {until: ""}
  shop:
    - {label: "5000 xu", cost: {lamnguy: 25}, limit: 0, rewards: ["xu 5000"]}
    - {label: "16 kim cương", cost: {lamnguy: 40}, limit: 0, rewards: ["vat DIAMOND 16"]}
    - {label: "Đĩa nhạc Pigstep (trang trí)", cost: {lamnguy: 20}, limit: 1, rewards: ["vat MUSIC_DISC_PIGSTEP 1"]}

# Mùa mưa / mùa khô (/mua). Đổi theo NGÀY THẬT giờ Việt Nam: start-date = ngày bắt đầu mùa đầu tiên trong order, mỗi mùa days-per-season ngày, lặp vòng.
# growth: hệ số lớn của cây theo khối mọc ra (WHEAT lúa mì, CARROTS, POTATOES, BEETROOTS, SUGAR_CANE, BAMBOO, CACTUS, MELON/PUMPKIN = quả,
#   MELON_STEM/PUMPKIN_STEM = dây, COCOA, KELP, SWEET_BERRY_BUSH). 0.5 = chậm một nửa, 1.5 = nhanh thêm ~50% (cây có tuổi). Không ghi = như gốc.
# harvest-bonus: % rơi thêm 1 nông sản khi gặt cây ĐÃ CHÍN (WHEAT, CARROTS, POTATOES, BEETROOTS, COCOA).
# rain-start-chance / rain-stop-chance: % mỗi 5 phút đổ mưa (khi đang tạnh) / tạnh (khi đang mưa), cộng với thời tiết gốc.
# Cá theo mùa: EvenMoreFish đọc %dmmmua_id% (plugins/EvenMoreFish/rarities/*.yml, requirements.placeholder). Đổi id mùa thì sửa cả ở đó.
# Admin thử: /mua dat kho · /mua dat tudong (trả về theo lịch).
seasons:
  enabled: true
  start-date: "2026-10-12"
  days-per-season: 7
  worlds: [world]
  join-message: true
  order: [mua, kho]
  list:
    mua:
      name: "&b☔ Mùa mưa"
      subtitle: "&7Lúa, mía, tre lớn nhanh · cá linh, cá lóc về đồng"
      rain-start-chance: 25
      rain-stop-chance: 5
      growth: {WHEAT: 1.4, SUGAR_CANE: 1.5, BAMBOO: 1.5, KELP: 1.3, MELON_STEM: 1.2, CACTUS: 0.5, POTATOES: 0.8, BEETROOTS: 0.8}
      harvest-bonus: {WHEAT: 25}
      hints:
        - "&b≈ Cá mùa này: &fcá linh, cá lóc đồng, cá rô phi, tôm càng, cua đồng, cá chình, cá tra dầu (huyền thoại)"
        - "&7Câu cá: &f/emf &7(nhật ký cá, bán cá: &f/emf shop&7)"
    kho:
      name: "&6☀ Mùa khô"
      subtitle: "&7Khoai, cà rốt, dưa, bí được mùa · cá cơm, cá kèo, mực ra khơi"
      rain-start-chance: 0
      rain-stop-chance: 50
      growth: {POTATOES: 1.4, CARROTS: 1.4, BEETROOTS: 1.3, MELON: 1.3, PUMPKIN: 1.3, COCOA: 1.3, CACTUS: 1.5, WHEAT: 0.8, SUGAR_CANE: 0.6, BAMBOO: 0.7}
      harvest-bonus: {POTATOES: 25, CARROTS: 25, BEETROOTS: 25}
      hints:
        - "&6≈ Cá mùa này: &fcá bống, cá kèo, cá hô (huyền thoại); ngoài biển: cá cơm, mực ống, cá mú"
        - "&7Câu cá: &f/emf &7(nhật ký cá, bán cá: &f/emf shop&7)"
  # Sự kiện trong mùa: from-day/to-day = ngày thứ mấy của mùa (số âm đếm từ cuối, -1 = ngày cuối). /mua sukien <id|tudong> để thử.
  events:
    lu:
      season: mua
      from-day: -1
      to-day: -1
      name: "&9🌊 Lũ cuối mùa"
      subtitle: "&7Mưa suốt ngày · Thủy tộc dễ bắt · lúa ngập chậm lớn"
      rain: "on"
      growth: {WHEAT: 0.5, POTATOES: 0.7, CARROTS: 0.7, BEETROOTS: 0.7, KELP: 1.5, SUGAR_CANE: 1.3}   # nhân với mùa mưa: lúa 1,4×0,5 = chậm 30%
      capture-bonus: {thuytoc: 15}
    han:
      season: kho
      from-day: 3
      to-day: 4
      name: "&6🔥 Hạn hán"
      subtitle: "&7Không mưa · cây lớn chậm · lương thực quý (kho lương x1,5)"
      rain: "off"
      growth: {WHEAT: 0.7, POTATOES: 0.7, CARROTS: 0.7, BEETROOTS: 0.7, MELON: 0.7, PUMPKIN: 0.7, SUGAR_CANE: 0.5, CACTUS: 1.3}
      supply-multiplier: 1.5
      capture-bonus: {bay: 5, nhay: 10}

# Bản đồ kho báu (/khobau): rơi khi câu cá / hạ quái; cầm để dò nóng-lạnh, tới nơi Shift để đào, hạ lính canh để mở rương.
treasure:
  enabled: true
  fish-chance: 3          # % mỗi con cá câu được
  mob-chance: 0.5         # % mỗi quái thù địch bị hạ
  max-per-day: 5          # tối đa bản đồ mỗi người mỗi ngày (từ câu cá + quái)
  dig-radius: 4           # đứng trong ngần này khối quanh chỗ kho báu mới đào được
  guard-minutes: 5        # phải hạ hết lính canh trong ngần này phút (đứng trong 40 khối), không thì trả lại bản đồ
  tiers:
    thuong: {name: "&fKho báu thường", weight: 70, guards: 2, guard-types: [ZOMBIE, SKELETON], guard-health: 1.5, rewards: ["xu 300", "vat IRON_INGOT 8"]}
    hiem: {name: "&bKho báu hiếm", weight: 25, guards: 3, guard-types: [VINDICATOR, SKELETON, SPIDER], guard-health: 2, rewards: ["xu 1000", "vat DIAMOND 2", "vat GOLDEN_APPLE 1"]}
    huyenthoai: {name: "&6Kho báu huyền thoại", weight: 5, guards: 4, guard-types: [WITHER_SKELETON, VINDICATOR, EVOKER], guard-health: 3, broadcast: true, reveal-hidden: 40, rewards: ["xu 5000", "vat DIAMOND 6", "vat ENCHANTED_GOLDEN_APPLE 1", "lenh buabatpet give {player} 2"]}

# Lệnh săn quái (/lenhsan, tên cũ /truyna): mỗi interval-minutes phút dán lệnh săn một quái mạnh ở vùng /tpr đã mở; ai gây nhiều sát thương nhất nhận thưởng.
wanted:
  enabled: true
  interval-minutes: 45
  expire-minutes: 60
  max-active: 2
  spawn-distance: 64      # quái chỉ xuất hiện khi có người tới gần ngần này khối
  targets:
    - {name: "Đồ Tể Rừng Già", type: VINDICATOR, health: 120, damage: 1.5, armor: iron, rewards: ["xu 1500", "vat EMERALD 8"]}
    - {name: "Xác Sống Đầu Đàn", type: ZOMBIE, health: 150, damage: 2, armor: diamond, rewards: ["xu 1500", "vat IRON_INGOT 16"]}
    - {name: "Cung Thủ Bóng Đêm", type: SKELETON, health: 100, damage: 2, armor: iron, rewards: ["xu 1500", "vat ARROW 64"]}
    - {name: "Phù Thuỷ Đầm Lầy", type: WITCH, health: 120, damage: 1, armor: none, rewards: ["xu 1500", "vat EXPERIENCE_BOTTLE 16"]}
    - {name: "Kỵ Sĩ Địa Ngục", type: WITHER_SKELETON, health: 200, damage: 1.5, armor: netherite, rewards: ["xu 3000", "vat DIAMOND 3", "lenh buabatpet give {player} 1"]}
    - {name: "Kẻ Tàn Phá", type: RAVAGER, health: 250, damage: 1.2, armor: none, rewards: ["xu 4000", "vat DIAMOND 4"]}

# Thái Ấp (/thaiap): đất riêng an toàn trong thế giới phẳng riêng (không PvP, không quái, không quặng). sizes: cạnh theo cấp, prices: giá mua + mở rộng.
thai-ap:
  enabled: true
  world: thaiap
  sizes: [50, 70, 90]
  prices: [5000, 8000, 15000]
  cell: 110               # khoảng cách tâm các mảnh (phần thừa là đường đi chung)
  max-trusted: 5          # số người được mời cùng xây
  kitchen-bonus: 50       # % kéo dài hiệu ứng món /nauan nấu trong Thái Ấp của mình
  # Thái Ấp Sáng Tạo (19/10): cổng ở chỗ xuất hiện của thế giới Thái Ấp (admin dời: /thaiap congsangtao) chuyển sang server sáng tạo riêng.
  # Chỉ ai có Thái Ấp hoặc được mời xây cùng mới qua được; vé ghi ở plugins/DuckyMoMoCore/sangtao-ve.yml (server sangtao-1 đọc qua mount chỉ đọc).
  sang-tao:
    enabled: true
    server: sangtao-1        # tên server trong velocity.toml
    ticket-seconds: 60       # vé có hạn: không vào kịp thì bước lại vào cổng

# Lính đánh thuê (/linhdanhthue): người không thuộc nước nào đăng ký kèm giá, vua/tướng thuê bằng ngân khố nước (Trang Cài đặt > Chiến tranh)
mercenary:
  enabled: true
  min-hours: 5                 # phải chơi ít nhất ngần này giờ thật
  contract-hours: 48           # mỗi hợp đồng kéo dài (giờ)
  fee-percent: 10              # server giữ % giá thuê (rút tiền khỏi kinh tế)
  min-price: 100
  max-price: 100000
  hire-ranks: [general, colonel, co-king]   # ngoài vua, chức nước nào được thuê lính

# Server vắng thì tự nhẹ đi: quy mô = số người có chơi trong 7 ngày (chốt mỗi ngày). Dưới threshold thì nhiệm vụ dễ hơn, bắt pet dễ hơn,
# phe phòng thủ vắng hết thì bên tấn công chỉ ăn một phần điểm giữ cờ.
low-population:
