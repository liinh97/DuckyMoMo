# Thăng Cấp (/capdo; làm lại 21/10 theo hướng cày cuốc): cấp riêng của server. Lên cấp cần xu (trả khi lên), tổng giờ chơi thật của mùa,
# tổng điểm hạ gục (quái +mob-points, người +player-points), đều tăng dần theo cấp. Mỗi cấp được điểm thuộc tính (Máu, Sức mạnh, Bền bỉ,
# Nhanh nhẹn; tắt trong Đấu Trường). Đặc quyền mua bằng xu + đủ cấp. keep-on-new-season: false = mùa mới làm lại từ cấp 0.
# Trang Cài đặt › Kinh tế › Thăng Cấp.
level-up:
  enabled: true
  max-level: 100
  # Lên cấp N: trả money-base × N^money-exponent xu; TỔNG giờ chơi thật của mùa ≥ hours-base × N^hours-exponent;
  # TỔNG điểm hạ gục ≥ kill-base × N^kill-exponent. Mặc định: cấp 10 = 4 giờ, 25 = 25 giờ, 50 = 100 giờ, 100 = 400 giờ.
  money-base: 250
  money-exponent: 0.6
  hours-base: 0.04
  hours-exponent: 2
  kill-base: 1
  kill-exponent: 2
  mob-points: 1
  player-points: 10
  player-cooldown-minutes: 10   # giết lại cùng một người trong ngần này phút không tính điểm
  # Điểm thuộc tính: mỗi cấp + mỗi mốc (milestone-every cấp) thêm milestone-points; mốc còn có quà milestone-rewards.
  points-per-level: 1
  milestone-every: 10
  milestone-points: 1
  milestone-rewards: ["xu 5000", "vat EXPERIENCE_BOTTLE 16"]
  # 4 thuộc tính, mỗi cái attribute-max-tier bậc, bậc k tốn k điểm (10 bậc = 55 điểm; cấp 100 có 110 điểm = max 2 thuộc tính).
  # Mỗi bậc: mau = máu (1 = nửa tim), sucmanh = % sát thương gây ra, benbi = % sát thương nhận giảm, nhanhnhen = % tốc chạy.
  attribute-max-tier: 10
  attributes: {mau: 1, sucmanh: 1, benbi: 1, nhanhnhen: 1}
  attribute-off-worlds: []      # thế giới tắt thuộc tính (Đấu Trường luôn tắt)
  respec-cost: 10000            # xu tẩy điểm (0 = miễn phí, -1 = không cho)
  keep-on-new-season: false
  # màu cấp theo mốc "cấp:mã màu" (mã & 0-9 a-f, &l đậm): hiện ở TAB, thanh chỉ số, bảng bên phải, menu (27/10)
  level-colors: "0:&f, 10:&a, 20:&b, 30:&9, 40:&d, 50:&6, 60:&c, 70:&5, 80:&4, 90:&e, 100:&e&l"
  # Đặc quyền: mua bằng XU, cần đủ cấp, mua lần lượt từng bậc. Không trùng rank ủng hộ / danh phận.
  shop:
    giamxuong:
      name: "Giảm giá Xưởng"
      icon: SMITHING_TABLE
      description: ["Chế đồ ở /xuong rẻ hơn 5% mỗi bậc (tối đa 10%)"]
      tiers:
        - {level: 20, cost: 20000, perms: [duckymomo.xuong.giam]}
        - {level: 50, cost: 80000, perms: [duckymomo.xuong.giam.2]}
    banthem:
      name: "Bán cho server nhiều hơn"
      icon: HOPPER
      description: ["+1.000 xu giới hạn bán cho server mỗi ngày, mỗi bậc"]
      tiers:
        - {level: 15, cost: 15000, perms: [duckymomo.sell.them.1]}
        - {level: 35, cost: 40000, perms: [duckymomo.sell.them.2]}
        - {level: 60, cost: 100000, perms: [duckymomo.sell.them.3]}
    nghe:
      name: "+10% kinh nghiệm nghề"
      icon: IRON_PICKAXE
      description: ["Nghề (/jobs) lên cấp nhanh hơn 10%"]
      tiers:
        - {level: 25, cost: 30000, perms: [jobs.boost.all.exp.0.1]}
    kynang:
      name: "+10% kinh nghiệm kỹ năng"
      icon: ENCHANTED_BOOK
      description: ["Kỹ năng (/skills) lên cấp nhanh hơn 10%"]
      tiers:
        - {level: 25, cost: 30000, perms: [auraskills.multiplier.10]}
    batpet:
      name: "+5% tỉ lệ bắt pet"
      icon: LEAD
      description: ["Mỗi lần quăng dây xích bắt pet dễ hơn 5%"]
      tiers:
        - {level: 30, cost: 40000, perms: [duckymomo.pet.batgioi]}
    petkinhnghiem:
      name: "+15% kinh nghiệm pet"
      icon: BONE
      description: ["Pet (MyPet) lên cấp nhanh hơn 15%, mọi nguồn"]
      tiers:
        - {level: 20, cost: 30000, perms: [duckymomo.pet.kinhnghiem]}
    pethoisinh:
      name: "Pet hồi sinh nhanh"
      icon: TOTEM_OF_UNDYING
      description: ["Pet chết thì hồi sinh nhanh gấp đôi"]
      tiers:
        - {level: 35, cost: 40000, perms: [duckymomo.pet.hoisinh]}
    laoluyen:
      name: "Danh hiệu Lão Luyện"
      icon: NAME_TAG
      description: ["Danh hiệu riêng cho người cấp cao"]
      tiers:
        - {level: 75, cost: 80000, rewards: ["danhhieu laoluyen"]}

# Cổng Hoang (/conghoang): cổng dungeon ngụy trang xuất hiện dần trên bản đồ. Chỉ tự đặt khi đã mở mùa (leaderboard.season-start).
# Trang Cài đặt > Thế giới > Cổng Hoang. Thị trấn có ô đất chứa cổng là chủ; chiếm được thị trấn là có cổng.
wild-gates:
  enabled: true
  max-gates: 4             # tối đa cổng mỗi mùa (= số dungeon đích thì mỗi cổng một nơi khác nhau)
  interval-days: 7         # mỗi ngần này ngày thêm 1 cổng
  min-town-distance: 300   # cổng cách điểm spawn thị trấn gần nhất ít nhất ngần này khối
  min-gate-distance: 800   # các cổng cách nhau
  grace-minutes: 30        # người tìm ra được ưu tiên lập/mở rộng thị trấn quanh cổng trong ngần này phút
  grace-radius: 64         # bán kính ưu tiên (khối)
  max-toll: 30000          # phí qua cổng tối đa chủ cổng được đặt
  upkeep-per-day: 0        # xu/ngày trừ ngân khố thị trấn giữ cổng (0 = không)
  revolt-hours-less: 0     # thị trấn giữ cổng bị chiếm thì được khởi nghĩa sớm hơn ngần này giờ (0 = không)
  # Bậc ngụy trang: dungeon càng khó, cổng càng khó nhận ra. particle-range: hạt tím thấy trong (khối); night-only: hạt chỉ hiện ban đêm;
  # hint-range: dòng nhắc "luồng khí lạ" khi đứng gần (0 = không); rumor: chi-tiet (vùng + hướng) | vung (chỉ vùng) | mo-ho (chỉ loại địa hình);
  # treasure-radius: kho báu huyền thoại chỉ đường sai số (khối, 0 = không chỉ); structure-percent: dựng bao nhiêu % chi tiết ngụy trang.
  tiers:
    t1: {particle-range: 16, night-only: false, hint-range: 6, rumor: chi-tiet, treasure-radius: 40, structure-percent: 100}
    t2: {particle-range: 8, night-only: false, hint-range: 3, rumor: vung, treasure-radius: 80, structure-percent: 55}
    t3: {particle-range: 4, night-only: true, hint-range: 0, rumor: mo-ho, treasure-radius: 150, structure-percent: 25}
  underwater-chance: 30    # % mỗi lần thử chọn chỗ được phép đặt cổng dưới đáy nước (biển, sông sâu 2–24 khối)
  # Cổng dẫn tới (ngẫu nhiên, ưu tiên gói đã cài): bậc theo độ khó dungeon + dấu hiệu riêng đưa vào tin đồn
  dungeons:
    sewers_minidungeon: {tier: 1, rumor: "dưới đất bốc lên mùi ẩm mốc và tiếng nước nhỏ giọt"}
    north_pole_minidungeon: {tier: 2, rumor: "giữa trời nắng mà gió lạnh buốt, thoảng tiếng chuông xe tuần lộc"}
    knights_castle_lair: {tier: 2, rumor: "đêm nào cũng nghe tiếng giáp sắt va nhau"}
    steamworks_lair: {tier: 3, rumor: "có tiếng máy hơi nước rít lên từ lòng đất"}

# Cổng Dungeon (/dungeon): khoá từng dungeon EliteMobs, mở theo 5 kiểu. Mã = tên file gói EliteMobs (bỏ .yml).
# Trang Cài đặt > Thế giới > Cổng Dungeon. Dungeon chưa cài thì hiện "chưa cài", cài sau là tự dùng được.
#  chain: chuỗi chìa khoá (requires = phải vượt dungeon trước) · hidden: ẩn (admin đứng tại chỗ gõ /dungeon datan <mã>)
#  luck: Vé Vận Mệnh rơi hiếm · ticket: vé cá nhân mua bằng xu · server: cả server góp quỹ mở (open-days 0 = tới hết mùa)
#  gate: chỉ vào được qua Cổng Hoang (/conghoang). Chưa có dungeon kiểu luck nào thì Vé Vận Mệnh không rơi.
# Kỹ năng nghề AuraSkills (/skills): làm lại từ cấp 0 mỗi mùa (khi leaderboard.season-start đổi). AuraSkills chỉ xoá được người đang online,
# nên DuckyMoMoCore xoá lúc từng người vào game lần đầu trong mùa mới (kynang-mua.yml). Cấu hình kỹ năng: plugins/AuraSkills/.
aura-skills:
  reset-each-season: true

# Lữ khách (/lukhach, cần Citizens + BetonQuest): mỗi lữ khách kể chuyện về một nơi phía sau Cổng Hoang (dungeon: mã trong wild-gates.dungeons).
# NPC Citizens đứng ở đất hoang ngẫu nhiên (luật chọn chỗ của Cổng Hoang), mỗi move-hours giờ dời đi chỗ khác, báo tin đồn (vùng + hướng).
# Tên NPC phải trùng tên trong BetonQuest (plugins/BetonQuest/QuestPackages/cotruyen/lukhach/), đổi tên thì sửa cả hai chỗ.
# skin: tên một người chơi bản quyền để mượn skin (trống = mặc định). Admin: /lukhach ds | doi <mã|all> | xoa.
wander-npcs:
  enabled: true
  move-hours: 72
  announce: true
  npcs:
    cong: {dungeon: sewers_minidungeon, name: "Thợ Cống Già", skin: "", rumor: "có một ông già người ướt sũng, cứ lẩm bẩm về những đường cống dưới lòng đất"}
    bacuc: {dungeon: north_pole_minidungeon, name: "Người Kéo Xe Tuần Lộc", skin: "", rumor: "có một người mặc áo lông dày giữa trời nắng, run cầm cập"}
    hiepsi: {dungeon: knights_castle_lair, name: "Hiệp Sĩ Lạc Đàn", skin: "", rumor: "có một hiệp sĩ giáp sứt mẻ ngồi một mình bên đống lửa"}
    hoinuoc: {dungeon: steamworks_lair, name: "Kỹ Sư Bỏ Trốn", skin: "", rumor: "có một người mặt đầy muội than, tay ôm chặt chiếc cờ lê"}

dungeon-gate:
  enabled: true
  key-tradeable: false     # Chìa khoá tầng (trùm cuối rơi) có cho người khác dùng không: false = ghi tên người nhận, chỉ người đó dùng được
  window-seconds: 120      # mở cổng xong có ngần này giây để chọn độ khó và vào; không vào thì hoàn vé
  hidden-radius: 4         # tới gần lối vào ẩn trong ngần này khối là tìm ra
  auto-ready: true         # 23/10: nhóm /em party: tự bấm [SẴN SÀNG] hộ mọi người khi trưởng nhóm chọn độ khó
  auto-start: true         # 23/10: vào instance là tự /em start (không phải ở phòng chờ gõ lệnh)
  luck:
    mob-chance: 0.05       # % mỗi quái thù địch bị hạ rơi Vé Vận Mệnh (0.05% ≈ 1/2000)
    fish-chance: 0.3       # % mỗi con cá câu được
    max-per-day: 1         # tối đa vé/người/ngày
  fragment:                # Mảnh Chìa: chỉ rơi cho người đã tìm ra dungeon ẩn có fragments mà chưa ghép đủ
    mob-chance: 1          # % mỗi quái bị hạ
    fish-chance: 3         # % mỗi con cá
    max-per-day: 3
  weekly:                  # Dungeon của tuần: mỗi tuần chọn ngẫu nhiên 1 dungeon (kiểu trong types, đã cài), vượt được thêm quà
    enabled: true
    types: [chain, ticket, server]
    rewards:
      - xu 2250
    max-per-week: 3        # tối đa lần nhận quà tuần / người
  # Điều kiện phụ (tuỳ dungeon, kiểm từng người trong nhóm /em party): min-pet-level, party: "2-4", days: [t2..t7, cn],
  # hours: "19-23" (giờ VN), seasons: [mua, kho], hegemon-only: true, min-achievements. Dungeon ẩn: fragments: <số Mảnh Chìa>.
  dungeons:
    the_climb_dungeon: {name: "Đỉnh Vách Đá", type: chain, level: "10", first-rewards: [xu 750]}
    the_cave_sanctum: {name: "Hang Thánh Địa", type: chain, level: "15", requires: the_climb_dungeon, first-rewards: [xu 1200]}
    the_mines_dungeon: {name: "Mỏ Hoang", type: chain, level: "20", requires: the_cave_sanctum, first-rewards: [xu 1500]}
    the_bridge_sanctum: {name: "Cây Cầu Cổ", type: chain, level: "25", requires: the_mines_dungeon, first-rewards: [xu 1800]}
    the_city_dungeon: {name: "Thành Phố Đổ Nát", type: chain, level: "30", requires: the_bridge_sanctum, first-rewards: [xu 2250]}
    the_palace_sanctum: {name: "Cung Điện", type: chain, level: "35", requires: the_city_dungeon, first-rewards: [xu 3000]}
    the_quarry_dungeon: {name: "Mỏ Đá", type: chain, level: "40", requires: the_palace_sanctum, first-rewards: [xu 3750]}
    the_deep_mines_dungeon: {name: "Mỏ Sâu", type: chain, level: "45", requires: the_quarry_dungeon, first-rewards: [xu 4500]}
    the_nether_wastes_dungeon: {name: "Hoang Mạc Địa Ngục", type: chain, level: "50", requires: the_deep_mines_dungeon, min-pet-level: 10, first-rewards: [xu 6000]}
    the_nether_bell_sanctum: {name: "Chuông Địa Ngục", type: chain, level: "55", requires: the_nether_wastes_dungeon, party: "2-4", first-rewards: [xu 9000]}
    sewers_minidungeon: {name: "Cống Ngầm", type: gate, level: "25", first-rewards: [xu 3000]}
    dark_cathedral_lair: {name: "Thánh Đường Bóng Tối", type: hidden, level: "15", night-only: true, fragments: 3, hint: "chỉ hiện ra lúc nửa đêm", first-rewards: [xu 4500]}
    north_pole_minidungeon: {name: "Bắc Cực", type: gate, level: "55", first-rewards: [xu 6000]}
    knights_castle_lair: {name: "Lâu Đài Hiệp Sĩ", type: ticket, level: "95", price: 4500, max-tickets: 5, days: [t7, cn]}
    steamworks_lair: {name: "Xưởng Hơi Nước", type: ticket, level: "140", price: 7500, max-tickets: 5, min-achievements: 8}
    fireworks_lair: {name: "Lễ Hội Pháo Hoa", type: server, level: "20", goal: 300000, open-days: 7}
    hallosseum_lair: {name: "Đấu Trường Ma", type: server, level: "30", goal: 450000, open-days: 7, party: "2-5", hours: "19-23"}
    binder_of_worlds_sanctum: {name: "Kẻ Trói Buộc Thế Giới", type: server, level: "100", goal: 3000000, open-days: 0, party: "3-5", min-pet-level: 20, first-rewards: [xu 30000]}

# Cân bằng chiến tranh (/canbang): chống "nước to nuốt hết". Trang Cài đặt > Chiến tranh > Cân bằng chiến tranh
war-balance:
  enabled: true
  war-chest-extra-percent-per-town: 10   # quỹ chiến tranh tăng % cho mỗi thị trấn (trừ thị trấn đầu) nước đi vây đang có
  colony-upkeep-per-day: 150.0           # mỗi thuộc địa tốn ngần này xu/ngày từ ngân khố nước chiếm (thiếu thì ghi nợ, còn nợ không cắm cờ vây được)
  max-colonies: 3                        # tối đa thuộc địa mỗi nước (0 = không giới hạn)
  revolt-hours-base: 72                  # thuộc địa được khởi nghĩa sau ngần này giờ
  revolt-hours-less-per-colony: 12       # bớt ngần này giờ cho mỗi thuộc địa khác của nước chiếm
  revolt-hours-min: 24
  underdog-ratio: 2                      # bên tấn công đông dân gấp ngần này lần bên phòng thủ thì bên phòng thủ được cộng điểm
  underdog-points-percent: 15            # % điểm giữ cờ cộng thêm cho bên phòng thủ yếu (vừa phải)
  hegemon-percent: 30                    # nước nắm từ ngần này % thị trấn cả server là Bá chủ
  hegemon-min-towns: 5
  hegemon-warchest-discount: 30          # đánh vào Bá chủ: hoàn lại % quỹ chiến tranh
  hegemon-points-percent: 15             # đánh vào Bá chủ: % điểm giữ cờ cộng thêm
  hegemon-max-regions: 2                 # Bá chủ chỉ hưởng đặc sản tối đa ngần này vùng

# Kho lương công thành (/kholuong): thị trấn nộp lương, lúc có phiên đánh quân trong vùng vây ăn từ kho thị trấn mình
siege-supply:
  enabled: true
  max-per-town: 5000                   # kho tối đa (điểm)
  cost-per-player-minute: 2            # mỗi người đang đánh trong vùng vây ăn bao nhiêu điểm/phút (kho cạn thì bị Đói)
  spoil-percent-per-day: 0             # kho hao hụt % mỗi ngày (lương để lâu hư); 0 = không hao
