# "ngay" ngày thì tự đăng nhập, người khác vẫn theo phiên AuthMe) lẫn web (trang tài khoản + quyền quản trị /web giữ "ngay" ngày).
# Chỉ thêm người tin cậy. Sửa ở Cài đặt › Toàn mạng › Đăng nhập lâu.
