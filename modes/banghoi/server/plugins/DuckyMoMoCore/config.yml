       gom: ["Xu, đồ hiếm, mảnh sự kiện", "Xem tỉ lệ từng phần thưởng trong menu"], bam: "Bấm để quay", cmd: vongquay}
    - {slot: 13, icon: EXPERIENCE_BOTTLE, name: "&e⬆ &fThăng Cấp", sub: "cấp %dmmcap_cap%", lore: ["Lên cấp bằng xu, giờ chơi và điểm hạ gục"],
