    - {name: "Xác Sống Đầu Đàn", type: ZOMBIE, health: 150, damage: 2, armor: diamond, rewards: [xu 2250, "vat IRON_INGOT 16"]}
    - {name: "Cung Thủ Bóng Đêm", type: SKELETON, health: 100, damage: 2, armor: iron, rewards: [xu 2250, "vat ARROW 64"]}
    - {name: "Phù Thuỷ Đầm Lầy", type: WITCH, health: 120, damage: 1, armor: none, rewards: [xu 2250, "vat EXPERIENCE_BOTTLE 16"]}
    - {name: "Kỵ Sĩ Địa Ngục", type: WITHER_SKELETON, health: 200, damage: 1.5, armor: netherite, rewards: [xu 4500, "vat DIAMOND 3", "lenh buabatpet give {player} 1"]}
    - {name: "Kẻ Tàn Phá", type: RAVAGER, health: 250, damage: 1.2, armor: none, rewards: [xu 6000, "vat DIAMOND 4"]}

# Thái Ấp (/thaiap): đất riêng an toàn trong thế giới phẳng riêng (không PvP, không quái, không quặng). sizes: cạnh theo cấp, prices: giá mua + mở rộng.
thai-ap:
  enabled: true
  world: thaiap
  sizes: [50, 70, 90]
  prices:
    - 15000
    - 24000
    - 45000
  cell: 110               # khoảng cách tâm các mảnh (phần thừa là đường đi chung)
  max-trusted: 5          # số người được mời cùng xây
  kitchen-bonus: 50       # % kéo dài hiệu ứng món /nauan nấu trong Thái Ấp của mình
  # Thái Ấp Sáng Tạo (19/10): cổng ở chỗ xuất hiện của thế giới Thái Ấp (admin dời: /thaiap congsangtao) chuyển sang server sáng tạo riêng.
  # Chỉ ai có Thái Ấp hoặc được mời xây cùng mới qua được; vé ghi ở plugins/DuckyMoMoCore/sangtao-ve.yml (server sangtao-1 đọc qua mount chỉ đọc).
  sang-tao:
    enabled: true
    server: sangtao-1        # tên server trong velocity.toml
    ticket-seconds: 60       # vé có hạn: không vào kịp thì bước lại vào cổng

# Lính đánh thuê (/linhdanhthue): người không thuộc nước nào đăng ký kèm giá, vua/tướng thuê bằng ngân khố nước (Trang Cài đặt > Chiến tranh)
mercenary:
  enabled: true
  min-hours: 5                 # phải chơi ít nhất ngần này giờ thật
  contract-hours: 48           # mỗi hợp đồng kéo dài (giờ)
  fee-percent: 10              # server giữ % giá thuê (rút tiền khỏi kinh tế)
  min-price: 300.0
  max-price: 300000.0
  hire-ranks: [general, colonel, co-king]   # ngoài vua, chức nước nào được thuê lính

# Server vắng thì tự nhẹ đi: quy mô = số người có chơi trong 7 ngày (chốt mỗi ngày). Dưới threshold thì nhiệm vụ dễ hơn, bắt pet dễ hơn,
# phe phòng thủ vắng hết thì bên tấn công chỉ ăn một phần điểm giữ cờ.
