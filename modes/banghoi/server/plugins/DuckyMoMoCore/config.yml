# Giới hạn tiền bán đồ cho server mỗi người mỗi ngày (21/10, chống lạm phát: farm tự động chạy AFK in tiền). Tính /sell, nút bán ở /cuahang,
# Rìu Bán của Xưởng, món Tinh Luyện; bán cho người chơi (/choden, shop rương, /trade) không tính. Mới lại lúc 0 giờ (giờ VN).
# Quyền duckymomo.sell.khonggioihan thì không bị giới hạn. Đã bán hôm nay: plugins/DuckyMoMoCore/banchoserver.yml.
sell-limit:
  enabled: true
  daily: 8000
  extra-per-perk: 1000   # đặc quyền Thăng Cấp duckymomo.sell.them.<n>: +n × số này

# Khai hoang vùng mới (/khaihoang, ý từ "Khai mở thứ nguyên" của UniMC). Quỹ chung tăng khi người chơi bán /sell (sell-percent % tiền bán,
# người bán KHÔNG mất gì) và khi góp /khaihoang gop <xu> (tiền bị rút). Đủ mốc thì chạy commands (console) theo thứ tự goals.
# Mốc mặc định nới viền ChunkyBorder (mùa 1 hiện: tâm 12500 -2000, bán kính 1300 x 1200). SAU KHI MỞ: sửa 4 ô viền ở Cài đặt > Thế giới cho khớp
# (không thì "Áp dụng lại tất cả" thu viền về cũ). Dữ liệu: khaihoang.yml. Hologram: %dmmkh_ten%, %dmmkh_quy%, %dmmkh_can%, %dmmkh_pct%, %dmmkh_thanh%.
frontier:
  enabled: false   # 27/10: chủ server mở hết map (bỏ viền mùa), tắt khai hoang để mốc không thu viền lại; mùa sau dựng map mới
  sell-percent: 100
  min-donate: 10
  pioneer:                             # Người Tiên Phong: N người đầu tiên đặt chân tới vùng vừa mở (vùng rtp.zones có requires)
    count: 10
    rewards:
      - xu 3000
      - danhhieu tienphong
  goals:
    - id: malaysia
      name: "&eMở Bán Đảo Mưa"
      need: 900000.0
      message: "Viền phía nam đã nới xuống tới Bán Đảo Mưa."
      commands: ["chunky world world", "chunky shape rectangle", "chunky center 12500 -1650", "chunky radius 1300 1550", "chunky border add world"]
    - id: philippines
      name: "&bMở Thiên Đảo"
      need: 2400000.0
      message: "Viền phía đông đã nới ra Thiên Đảo."
      commands: ["chunky world world", "chunky shape rectangle", "chunky center 13150 -1650", "chunky radius 1950 1550", "chunky border add world"]
    - id: indonesia
      name: "&dMở Đảo Rừng Già và Đảo Núi Lửa"
      need: 6000000.0
      message: "Viền phía nam đã nới tới Đảo Núi Lửa."
      commands: ["chunky world world", "chunky shape rectangle", "chunky center 13150 -1050", "chunky radius 1950 2150", "chunky border add world"]

# Chợ đen (thu mua) (/donhang, ý từ UniMC "Orders"): người mua đặt đơn, tiền (số lượng x đơn giá) bị giữ trước + phí fee-percent % (không hoàn,
# rút tiền khỏi kinh tế). Người giao nhận tiền ngay, hàng nằm trong kho đơn chờ người mua nhận. Hết days ngày: đóng, trả tiền phần chưa giao.
# Chỉ đồ "trơn" (không tên, không phù phép, không hỏng). blacklist: vật không cho đặt. Lưu: donhang.yml
orders:
  enabled: true
  max-per-player: 2        # 19/10: mức thấp nhất (Tị Nạn); rank cấp thêm qua quyền duckymomo.donhang.<N> (Danh phận / rank khác)
  max-amount: 6400
  min-price: 0.01
  max-price: 100000
  fee-percent: 2
  days: 7
  blacklist: [BEDROCK, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, STRUCTURE_BLOCK, JIGSAW, LIGHT, SPAWNER, TRIAL_SPAWNER, END_PORTAL_FRAME, DEBUG_STICK, KNOWLEDGE_BOOK]

# Vũ khí nổ lên NGƯỜI CHƠI (ý từ TDSMP: cấm crystal/anchor, giảm xe goòng TNT). Hệ số sát thương: 0 = không gây sát thương, 0.3 = còn 30%, 1 = như gốc.
# Chỉ áp cho người bị trúng là người chơi; quái, rồng Ender, phá khối như gốc. TNT khối thường không đổi.
explosive-pvp:
  enabled: true
  end-crystal: 0
  respawn-anchor: 0
  bed: 0
  tnt-minecart: 0.3
# Giờ chơi thật (không tính AFK): plugins/DuckyMoMoCore/hoatdong.yml. /hoatdong xem giờ. Chốt 14/10 (docs/banghoi-luat-mua1.md mục 11D).
# Dân hoạt động = chơi thật >= active-hours-per-week giờ trong 7 ngày VÀ ở thị trấn >= new-member-days ngày.
active-play:
  enabled: true
  active-hours-per-week: 3
  new-member-days: 3

# Luật đất đai Towny (mục 11E). spawn = toạ độ kinh đô; reserved-nation = tên quốc gia Liên minh Hoà Bình (đợt 2, trống = không ai lấn được vòng spawn).
town-rules:
  enabled: true
  town-min-hours: 3
  nation-min-active-residents: 3
  siege-min-towns: 2
  join-cooldown-days: 3
  land-per-active-resident: true
  reserved-spawn-radius: 300
  reserved-nation: ""        # bỏ qua khi peace-alliance bật (dùng peace-alliance.nation)
  world: world
  spawn: [12699, -2523]

# Chơi lại từ đầu /choilai (mục 11F). Đổi season khi sang mùa mới để đếm lại số lần và quà.
player-reset:
  enabled: true
  cooldown-days: 7
  max-per-season: 3
  season: "1"
  gift-first-only: true
  starting-money: 500.0
  kit: tanthu
  backup-days: 7

# Liên minh Hoà Bình (docs/banghoi-luat-mua1.md mục 10–11A). Lập lần đầu: admin đứng giữa spawn gõ /dmm hoabinh setup,
# rồi /dmm hoabinh claim <bán kính ô>. SiegeWar phải có peaceful_towns.allow_peaceful_capitals: true (kinh đô hoà bình).
peace-alliance:
  enabled: true
  nation: LienMinhHoaBinh
  capital: KinhDo
  join-wait-days: 2
  join-max-distance: 8   # 21/10: thị trấn cách đất liên minh tối đa bao nhiêu ô (16 block) thì được /hoabinh vao; vào rồi chiếm đất nối liền mới bật hoà bình
  rejoin-cooldown-days: 14
  plot-base-price: 75.0
  plot-price-per-plot: 1.5
  protection-fee-per-plot: 1.5
  sell-bonus-percent: 10.0
  shop-tax-inside: 0
  shop-tax-outside: 0.05
  auction-only-in-peace: false   # 21/10: Chợ đen "phi chính phủ", mở ở mọi nơi
  jobs-join-only-in-peace: true   # 21/10: vào nghề (Jobs) chỉ trong đất liên minh; dân hoà bình ở đâu cũng được
  economy-only-in-peace: true   # 21/10: lệnh mua bán với server chỉ trong đất liên minh / vòng spawn; dân hoà bình ở đâu cũng được
  economy-commands: [sell, esell, emf shop, evenmorefish shop, ce, crazyenchantments, xuong, chetao, servertools, tinhluyen, tl, nguyenlieu]
  auction-commands: [zauctionhouse, ah, hdv, auction, zauction]
  siege-warn-days-before: 2
  siege-remind-minutes: [60, 10]

# Hội đồng Hoà Bình (mục 11A-13): thị trưởng thị trấn hoà bình có >= min-active-residents dân hoạt động có phiếu.
