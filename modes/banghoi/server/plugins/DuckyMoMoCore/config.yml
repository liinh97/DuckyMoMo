      - xu 750
      - vat GOLDEN_APPLE 2
      - do phieu_dd 2
    14:
      - xu 1500
      - vat DIAMOND 3
      - do phieu_dd 3
    30:
      - xu 4500
      - vat DIAMOND 8
      - do phieu_dd 5
  # Phiếu online (29/10, set Chuyên Cần): mỗi every-minutes phút ĐANG HOẠT ĐỘNG trong ngày (đứng im quá idle-minutes không tính, bot không tính)
  # nhận 1 item, tối đa max-per-day. TẮT (29/10, chủ server: phải điểm danh cả tháng mới đủ bộ): chỉ còn 1 phiếu/ngày + mốc 7/14/30 (2/3/5)
  # = 40 phiếu/30 ngày; bộ +0 = 4 x 8 = 32 phiếu (~ngày 27), cả bộ +5 = 236 phiếu (~6 tháng). Tắt thì /diemdanh chỉ ẩn dòng phiếu online, nút [Đổi set Chuyên Cần] vẫn hiện.
  online-ticket:
