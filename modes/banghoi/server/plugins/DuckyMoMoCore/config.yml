# Thưởng vote server (Votifier/AzuVotifier). Vote vào từ VPS: cổng 8192 → relay (socat) → banghoi-1:8192.
# Lượt vote của người chưa từng vào server bị bỏ qua. Dữ liệu: plugins/DuckyMoMoCore/vote.yml
vote:
  enabled: true
  money-per-vote: 100
  streak-days: 7          # vote đủ N ngày liên tiếp (ít nhất 1 trang mỗi ngày) thì thưởng thêm
  streak-bonus: 500
  party-every: 30         # cứ M lượt vote toàn server: vote party, ai đang online cũng nhận party-money
  party-money: 200
  broadcast: true
  sites:                  # link hiện ở /vote và trang web; url trống = ẩn. Thêm trang: copy một mục
    trang1:
      name: "Trang vote 1"
      url: ""

# Điểm danh hằng ngày (/diemdanh): đếm TỔNG số ngày (bỏ ngày không mất chuỗi). Lưu: diemdanh.yml
# Quà, mỗi dòng một món: xu <số> | do <mã thư viện đồ> [số] | vat <VẬT_LIỆU> [số] | lenh <lệnh, {player}> | manh <loại> <số>
daily-checkin:
  enabled: true
  min-online-minutes: 5       # phải online đủ trong phiên mới điểm danh được (chống tài khoản phụ)
  remind-on-join: true
  broadcast-milestone: true
  cycle-days: 30              # mốc lặp lại sau mỗi 30 lần điểm danh (0 = không lặp)
  daily-rewards:
    - "xu 100"
  milestones:
    7: ["xu 500", "vat GOLDEN_APPLE 2"]
    14: ["xu 1000", "vat DIAMOND 3"]
    30: ["xu 3000", "vat DIAMOND 8"]

# Nhiệm vụ hằng ngày (/nhiemvu): mỗi người mỗi ngày per-day nhiệm vụ ngẫu nhiên từ pool. Lưu: nhiemvu.yml
# type: break (phá khối) | place (đặt khối) | kill (giết mob) | fish (câu cá) | harvest (thu hoạch cây chín)
# targets: tên vật liệu/mob, *_ORE, OAK_*, * (tất cả), @HOSTILE (mọi quái thù địch). Khối người chơi tự đặt không tính khi phá.
daily-quests:
  enabled: true
  per-day: 3
  complete-all-rewards: ["xu 300"]
  pool:
    dao_da: {name: "Đào 128 khối đá", type: break, targets: [STONE, COBBLESTONE, DEEPSLATE, COBBLED_DEEPSLATE, ANDESITE, DIORITE, GRANITE, TUFF], amount: 128, rewards: ["xu 100"]}
    dao_quang: {name: "Đào 16 quặng", type: break, targets: ["*_ORE"], amount: 16, rewards: ["xu 150"]}
    chat_go: {name: "Chặt 64 khúc gỗ", type: break, targets: ["*_LOG", "*_STEM"], amount: 64, rewards: ["xu 100"]}
    san_quai: {name: "Săn 20 quái vật", type: kill, targets: ["@HOSTILE"], amount: 20, rewards: ["xu 150"]}
    xay_dung: {name: "Đặt 200 khối", type: place, targets: ["*"], amount: 200, rewards: ["xu 100"]}
    cau_ca: {name: "Câu 10 con cá", type: fish, targets: ["*"], amount: 10, rewards: ["xu 100"]}
    thu_hoach: {name: "Thu hoạch 64 nông sản", type: harvest, targets: [WHEAT, CARROTS, POTATOES, BEETROOTS, NETHER_WART, COCOA], amount: 64, rewards: ["xu 100"]}

# Vòng quay miễn phí (/vongquay): mỗi minutes-per-key phút CHƠI THẬT (không tính treo máy) được 1 vé, giữ tối đa max-keys.
# Vé không bán, không trao đổi. Tỉ lệ = weight / tổng weight (hiện trong menu). rare: báo cả server. Lưu: vongquay.yml
# Placeholder: %dmmvq_ve% (số vé), %dmmvq_con% (phút tới vé tiếp theo). Đừng đặt đồ quá mạnh (lệch chiến tranh).
lucky-spin:
  enabled: true
  minutes-per-key: 60
  max-keys: 5
  prizes:
    - {label: "200 xu", weight: 28, rare: false, rewards: ["xu 200"]}
    - {label: "500 xu", weight: 14, rare: false, rewards: ["xu 500"]}
    - {label: "16 thỏi sắt", weight: 14, rare: false, rewards: ["vat IRON_INGOT 16"]}
    - {label: "16 bánh mì", weight: 12, rare: false, rewards: ["vat BREAD 16"]}
    - {label: "8 ngọc lục bảo", weight: 10, rare: false, rewards: ["vat EMERALD 8"]}
    - {label: "2 táo vàng", weight: 8, rare: false, rewards: ["vat GOLDEN_APPLE 2"]}
    - {label: "5 kim cương", weight: 6, rare: false, rewards: ["vat DIAMOND 5"]}
    - {label: "2000 xu", weight: 4, rare: true, rewards: ["xu 2000"]}
    - {label: "1 khối kim cương", weight: 2, rare: true, rewards: ["vat DIAMOND_BLOCK 1"]}
    - {label: "Đĩa nhạc Cat (trang trí)", weight: 2, rare: true, rewards: ["vat MUSIC_DISC_CAT 1"]}

# Mảnh sự kiện + đổi quà (/doimanh). Mảnh là ĐỒ VẬT (trao đổi, bán được), có dấu ẩn nên không làm giả được.
# Phần thưởng "manh <loại> <số>" (điểm danh, nhiệm vụ, vòng quay…) bị giới hạn daily-cap mảnh/người/ngày.
# Boss/dungeon/admin phát bằng: /doimanh give <người> <loại> <số> (không tính giới hạn). until: hạn đổi yyyy-MM-dd (trống = không hạn).
event-fragments:
  enabled: true
  daily-cap: 20
  types:
    lamnguy:
      name: "&c&lMảnh Lâm Nguy"
      material: AMETHYST_SHARD
      lore: ["&7Rơi từ sự kiện Trái Đất lâm nguy", "&7Đổi quà: &f/doimanh"]
      until: ""
  shop:
    - {label: "5000 xu", cost: {lamnguy: 25}, limit: 0, rewards: ["xu 5000"]}
    - {label: "16 kim cương", cost: {lamnguy: 40}, limit: 0, rewards: ["vat DIAMOND 16"]}
    - {label: "Đĩa nhạc Pigstep (trang trí)", cost: {lamnguy: 20}, limit: 1, rewards: ["vat MUSIC_DISC_PIGSTEP 1"]}

# Mùa mưa / mùa khô (/mua). Đổi theo NGÀY THẬT giờ Việt Nam: start-date = ngày bắt đầu mùa đầu tiên trong order, mỗi mùa days-per-season ngày, lặp vòng.
# growth: hệ số lớn của cây theo khối mọc ra (WHEAT lúa mì, CARROTS, POTATOES, BEETROOTS, SUGAR_CANE, BAMBOO, CACTUS, MELON/PUMPKIN = quả,
#   MELON_STEM/PUMPKIN_STEM = dây, COCOA, KELP, SWEET_BERRY_BUSH). 0.5 = chậm một nửa, 1.5 = nhanh thêm ~50% (cây có tuổi). Không ghi = như gốc.
# harvest-bonus: % rơi thêm 1 nông sản khi gặt cây ĐÃ CHÍN (WHEAT, CARROTS, POTATOES, BEETROOTS, COCOA).
# rain-start-chance / rain-stop-chance: % mỗi 5 phút đổ mưa (khi đang tạnh) / tạnh (khi đang mưa), cộng với thời tiết gốc.
# Cá theo mùa: EvenMoreFish đọc %dmmmua_id% (plugins/EvenMoreFish/rarities/*.yml, requirements.placeholder). Đổi id mùa thì sửa cả ở đó.
# Admin thử: /mua dat kho · /mua dat tudong (trả về theo lịch).
seasons:
  enabled: true
  start-date: "2026-10-12"
  days-per-season: 7
  worlds: [world]
  join-message: true
  order: [mua, kho]
  list:
    mua:
      name: "&b☔ Mùa mưa"
      subtitle: "&7Lúa, mía, tre lớn nhanh · cá linh, cá lóc về đồng"
      rain-start-chance: 25
      rain-stop-chance: 5
      growth: {WHEAT: 1.4, SUGAR_CANE: 1.5, BAMBOO: 1.5, KELP: 1.3, MELON_STEM: 1.2, CACTUS: 0.5, POTATOES: 0.8, BEETROOTS: 0.8}
      harvest-bonus: {WHEAT: 25}
      hints:
        - "&b≈ Cá mùa này: &fcá linh, cá lóc đồng, cá rô phi, tôm càng, cá chình, cá tra dầu (huyền thoại)"
        - "&7Câu cá: &f/emf &7(nhật ký cá, bán cá: &f/emf shop&7)"
    kho:
      name: "&6☀ Mùa khô"
      subtitle: "&7Khoai, cà rốt, dưa, bí được mùa · cá cơm, cá kèo, mực ra khơi"
      rain-start-chance: 0
      rain-stop-chance: 50
      growth: {POTATOES: 1.4, CARROTS: 1.4, BEETROOTS: 1.3, MELON: 1.3, PUMPKIN: 1.3, COCOA: 1.3, CACTUS: 1.5, WHEAT: 0.8, SUGAR_CANE: 0.6, BAMBOO: 0.7}
      harvest-bonus: {POTATOES: 25, CARROTS: 25, BEETROOTS: 25}
      hints:
        - "&6≈ Cá mùa này: &fcá cơm, cá bống, cá kèo, mực ống, cá mú, cá hô (huyền thoại)"
        - "&7Câu cá: &f/emf &7(nhật ký cá, bán cá: &f/emf shop&7)"
