web-login:
  code-minutes: 60

# Tinh Luyện (/tinhluyen, 19/10): đổi MỘT CHIỀU lượng lớn khối thường → món tinh luyện (đồ có dấu riêng, đổi tên bằng đe không giả được).
# Dùng: hàng trao đổi ở shop dân làng (admin lấy món: /tinhluyen give <mã> [số], kéo vào trình sửa Shopkeepers), nguyên liệu Xưởng
# (workshop.items.<mã>.tinh-luyen: {sat: 1}), bán cho server (/sell hand|all hoặc /tinhluyen ban). Không đổi ngược: rút khoáng sản khỏi kinh tế.
# recipe: VẬT_LIỆU (đồ trơn) hoặc mã món khác: số. sell: giá bán 1 món (đặt ~70% giá trị nguyên liệu theo worth.yml để không lời vô hạn;
# đá cuội không có giá /sell + máy tạo đá vô hạn nên Tinh Luyện Đá để rất thấp). Mã món = mã thư viện đồ (công dụng "Nguyên liệu Tinh Luyện"):
# tên, vật phẩm nền (mảnh gốm / hạt vàng: không đặt được, không có giá trong worth.yml), mô tả, model (hình riêng trong gói tài nguyên,
# tools/itempack/gen.py) sửa ở trang Thư viện đồ. Đổi tên/mô tả thì món CŨ vẫn dùng được (nhận theo mã), nhưng shop Shopkeepers đã đặt phải đặt lại món mới.
tinh-luyen:
  enabled: true
  xu-quai:
    item: xuquai            # mã món rơi từ quái
    chance: 5               # % mỗi con quái thù địch người chơi giết (quái từ lồng quái không rơi)
    elite-chance: 40        # % quái EliteMobs (tinh nhuệ, boss)
    elite-max: 3            # quái EliteMobs rơi 1..elite-max
  loi-quai:                 # 23/10: Lõi Quái, chỉ quái EliteMobs (tinh nhuệ, quái dungeon) rơi; nguyên liệu Thợ Rèn
    item: loiquai
    elite-chance: 15
  items:
    xuquai: {sell: 4}
    xuquai2: {recipe: {xuquai: 64}, sell: 180}
    loiquai: {sell: 60}
    vaycahiem: {sell: 40}
    da: {recipe: {COBBLESTONE: 256, COBBLED_DEEPSLATE: 256}, sell: 7}
    than: {recipe: {COAL_BLOCK: 64}, sell: 1200}
    dong: {recipe: {RAW_COPPER_BLOCK: 64}, sell: 600}
    sat: {recipe: {RAW_IRON_BLOCK: 64}, sell: 3200}
    dado: {recipe: {REDSTONE_BLOCK: 64}, sell: 400}
    lapis: {recipe: {LAPIS_BLOCK: 64}, sell: 1200}
    vang: {recipe: {RAW_GOLD_BLOCK: 64}, sell: 6400}
    kimcuong: {recipe: {DIAMOND_BLOCK: 64}, sell: 48000}
    lucbao: {recipe: {EMERALD_BLOCK: 32}, sell: 8000}
    netherite: {recipe: {NETHERITE_BLOCK: 32}, sell: 262000}
    dialinh: {recipe: {HAY_BLOCK: 64}, sell: 270}

# Đơn nhà buôn mỗi tuần (NPC Nhà Buôn ở khu shop, đặt bằng /dmm donbuonnpc; 27/10, DonBuon.java): thứ Hai chọn per-week đơn ngẫu nhiên từ pool; giao đủ món Tinh Luyện trong "can"
# nhận gia % giá bán Tinh Luyện (tinh-luyen.items.<mã>.sell) bằng xu + quà "qua" (dạng như mọi quà: xu, do <mã> <số>…). Mỗi người mỗi đơn 1 lần/tuần,
# mỗi đơn tối đa luot lượt cả server (0 = không giới hạn). gia 120 = lời 20% so với bán thẳng (/tinhluyen ban trả ~70% giá nguyên liệu).
don-buon:
  enabled: true
  per-week: 3
  gia: 120
  luot: 10
  announce: true
  pool:
    - {can: {sat: 2}, qua: [do chia_khoa_diemdanh 1]}
    - {can: {dong: 3, than: 1}, qua: [do chia_khoa_diemdanh 1]}
    - {can: {than: 2, lapis: 1}, qua: [do chia_khoa_diemdanh 1]}
    - {can: {dado: 3, lapis: 1}, qua: [do chia_khoa_diemdanh 1]}
    - {can: {sat: 1, vang: 1}, qua: [do chia_khoa_diemdanh 2]}
    - {can: {vang: 2}, qua: [do chia_khoa_diemdanh 2]}
    - {can: {lucbao: 1, sat: 1}, qua: [do chia_khoa_diemdanh 2]}
    - {can: {dialinh: 8, dong: 1}, qua: [do chia_khoa_diemdanh 1]}
    - {can: {kimcuong: 1}, qua: [do chia_khoa_diemdanh 3]}
    - {can: {sat: 2, dong: 2, than: 2}, qua: [do chia_khoa_diemdanh 2]}

# Khảm Tinh Luyện (/thoren kham, 27/10): khảm món Tinh Luyện vào ô của đồ set để thêm chỉ số (Kham.java). Món bị lấy đi; tháo tốn thao-xu,
# thao-vo % vỡ ngọc. slots.<set>: số ô (một số cho mọi cấp, hoặc danh sách theo cấp +0, +1…); set không ghi = 0 ô.
# gems.<mã Tinh Luyện>: giap = chỉ số khi khảm vào mũ/áo/quần/giày (tính khi mặc), vukhi = khi khảm vào vũ khí (tính khi cầm tay chính).
# Chỉ số: mau, day-lui, giam-st, lua, st, st-chay, toc-danh, toc-chay, kinh-nghiem, hoi-mau, hut-mau, dot, cham-mon (tính riêng từng món).
# Cân 27/10: một ngọc = 64 khối (576 thỏi/viên) nên mỗi ngọc đáng kể nhưng có trần cả người (cap) để không phá PvP: tối đa +10% máu,
# -8% sát thương nhận (cộng thêm hiệu ứng bộ của set), +12% sát thương. Đầy ô Huyền Thoại (5 món × 3 = 15 ngọc) mới chạm trần.
kham:
  enabled: true
  thao-xu: 2000
  thao-vo: 50
  # Phẩm + năng lượng (27/10): khảm ra phẩm ngẫu nhiên (ti-le), % hiệu năng trong min..max nhân vào chỉ số gốc ở gems. Năng lượng đầy nang-luong:
  # giáp -1 mỗi lần người mặc trúng đòn từ quái / người (cận chiến, tên, nổ; ngã, cháy, độc, đói không tính), vũ khí -1 mỗi con quái / người
  # hạ được (trùm EliteMobs: vukhi-trum); không đánh nhau thì không hao. Còn canh-bao % thì nhắc, cạn thì ngọc vỡ. Nạp đầy: 1 Tinh Luyện cùng loại
  # + nap-xu. Tháo ra giữ phẩm + năng lượng. 5.000 ≈ 2–3 tuần (giáp) / 3–4 tuần (vũ khí) với người chơi 2 giờ/ngày.
  nang-luong: 5000
  vukhi-trum: 10
  # Hào quang (27/10): mỗi ngọc một hạt màu rgb xoay quanh người (tầng của món; vũ khí ở tay phải), người khác cũng thấy (tắt được
  # bằng /caidat "Hiệu ứng hạt người khác"). Màu = loại ngọc; KIỂU hạt = phẩm (pham[].hat, ghép bằng +: cham = chấm màu, chuyen-mau = chấm
  # đổi từ màu ngọc sang trắng, xoay = hạt xoáy kiểu thuốc, vet = vệt sáng có đuôi, xoan-oc = vệt xoắn ốc chân -> đầu, vong-dau = vòng sáng
  # trên đầu); pham[].mat-do = hệ số số hạt của phẩm (mặc định 1). Chủ server chốt 27/10: Thường cham, Tốt xoay, Hoàn Mỹ xoan-oc × 0,5.
  # Năng lượng cạn dần thì thưa, nhỏ dần. chu-ky: tick.
  hao-quang: {enabled: true, chu-ky: 4, ban-kinh: 32, so-hat: 2, co: 0.85}   # so-hat, co: lúc đầy năng lượng (27/10: bằng mức chủ server ưng)
  nap-xu: 1000
  canh-bao: 10
  pham:
    - {name: "Thường", color: "&7", ti-le: 60, min: 80, max: 100, hat: cham}
    - {name: "Tốt", color: "&a", ti-le: 30, min: 100, max: 120, hat: xoay}
    - {name: "Hoàn Mỹ", color: "&6", ti-le: 10, min: 120, max: 150, hat: xoan-oc, mat-do: 0.5}
  slots:
    tinhanh: [0, 0, 0, 1, 1, 1]
    caocap: [1, 1, 1, 1, 1, 2]
    huyenthoai: 3
    thanthoai: 3
    thanthanh: 4
  gems:
    sat: {name: "Sắt", color: "&7", rgb: "#F2F2F2", giap: {mau: 2}, vukhi: {st: 2}}
    vang: {name: "Vàng", color: "&e", rgb: "#FFD23F", giap: {day-lui: 3}, vukhi: {toc-danh: 3}}
    kimcuong: {name: "Kim Cương", color: "&b", rgb: "#00E5FF", giap: {giam-st: 1.5}, vukhi: {st: 3}}
    lucbao: {name: "Lục Bảo", color: "&a", rgb: "#2EE06A", giap: {kinh-nghiem: 5}, vukhi: {kinh-nghiem: 8}}
    lapis: {name: "Lưu Ly", color: "&9", rgb: "#2F5BFF", giap: {hoi-mau: 6}, vukhi: {hut-mau: 1.5}}
    dado: {name: "Đá Đỏ", color: "&c", rgb: "#FF2E2E", giap: {toc-chay: 1.5}, vukhi: {toc-danh: 4}}
    dong: {name: "Đồng", color: "&6", rgb: "#E07B39", giap: {cham-mon: 15}, vukhi: {cham-mon: 20}}
    than: {name: "Than", color: "&8", rgb: "#3B3B3B", giap: {lua: 8}, vukhi: {st-chay: 6}}   # vũ khí set có ô đều sẵn Lửa: Than tăng sát thương lên mục tiêu đang cháy
    netherite: {name: "Netherite", color: "&5", rgb: "#8A3FD1", giap: {giam-st: 2.5}, vukhi: {st: 4.5}}
  cap: {mau: 10, day-lui: 15, giam-st: 8, lua: 30, st: 12, toc-danh: 10, toc-chay: 6, kinh-nghiem: 25, hoi-mau: 24, hut-mau: 4, dot: 30, st-chay: 18, cham-mon: 50}

# Danh phận (/danhphan, 19/10): rank CHƠI miễn phí, đủ yêu cầu thì bấm nhận trong menu. Sửa ở Cài đặt › Người mới › Danh phận.
# Mỗi bậc: group (nhóm LuckPerms; bậc đầu PHẢI là default), name, prefix (tiền tố chat/Tab, priority càng cao càng ưu tiên, dưới staff),
# hours (giờ chơi thật, /hoatdong), level (Thăng Cấp), perm + perm-text (quyền cần có, vd xong chương 1 cốt truyện), homes (số nhà /sethome),
# balo (số balo /balo), ah (số món treo chợ /ah), icon. Lúc bật / dmm reload plugin TỰ ĐỒNG BỘ nhóm LuckPerms (tiền tố, weight, quyền
# essentials.sethome.multiple.dmm<N> / zauctionhouse.max.<N> / duckymomo.balo.<N> theo server). Essentials sethome-multiple có sẵn dmm1..dmm20,
# zAuctionHouse permissions.auction có zauctionhouse.max.1..20 (số lớn hơn 20 thì thêm vào 2 file đó).
play-ranks:
  enabled: true
  back: true            # /back cho người chơi mọi bậc (Cài đặt › Thế giới › Dịch chuyển bằng lệnh)
  back-ondeath: true    # /back về chỗ vừa chết
  server: banghoi-1
  announce: true
  tiers:
    tinan: {group: default, name: "Dân Tị Nạn", prefix: "&8[Tị Nạn] ", priority: 0, hours: 0, level: 0, homes: 1, balo: 0, balo-slots: 9, ah: 2, orders: 2, tu-skin: 0, icon: DEAD_BUSH, tp-delay: 5}
    dan: {group: dan, name: "Dân", prefix: "&7[Dân] ", priority: 1, hours: 6, level: 0, perm: duckymomo.cotruyen.c1, perm-text: "Xong chương 1 cốt truyện (Già Làng)", homes: 2, balo: 1, balo-slots: 18, ah: 4, orders: 3, tu-skin: 0, icon: WHEAT, tp-delay: 5}
    luongdan: {group: luongdan, name: "Lương Dân", prefix: "&a[Lương Dân] ", priority: 2, hours: 24, level: 10, homes: 3, balo: 1, balo-slots: 27, ah: 6, orders: 4, tu-skin: 0, icon: IRON_HOE, tp-delay: 5}
    haokiet: {group: haokiet, name: "Hào Kiệt", prefix: "&6[Hào Kiệt] ", priority: 3, hours: 72, level: 25, homes: 4, balo: 2, balo-slots: 36, ah: 8, orders: 5, tu-skin: 5, icon: GOLDEN_HELMET, tp-delay: 4, radar: true}
  # radar: true = thấy rada người chơi (chấm chỉ hướng người khác trên thanh kinh nghiệm); bậc / rank khác không thấy, bot không bao giờ hiện (28/10).
  # Rank KHÁC: quyền lợi homes (nhà) · balo · balo-slots (9..54) · ah (món chợ) · orders (đơn /donhang) · spin-faster (% vé vòng quay nhanh hơn,
  # 5..50) · kit (kit Essentials). 0 / "" = không cấp (theo danh phận). Người có nhiều rank lấy mức cao nhất. Cài đặt › Người mới › Quyền lợi theo rank.
  # create: true = plugin tạo nhóm + tiền tố (vd Sứ Giả); false = nhóm có sẵn (ủng hộ, staff), chỉ đụng quyền lợi, giữ tiền tố của họ.
  # card: true = hiện thẻ trong /danhphan (info = yêu cầu đăng ký, contact = bấm vào thì hiện). Cấp rank Sứ Giả: /lp user <tên> parent add media
  # Rank ủng hộ (5 tước) có balo từ 22/10 (chủ server chốt): Nam 1 · Tử 2 · Bá 2 · Hầu 3 · Công 4 balo, mỗi balo 9 ô.
  other-ranks:
    media:
      create: true
      name: "Sứ Giả"
      prefix: "&c◆ Sứ Giả &r"
      priority: 20
      icon: SPYGLASS
      card: true
      info: ["Livestream TikTok/YouTube về server ít nhất 4 buổi mỗi tuần", "Livestream đều đặn, nội dung lành mạnh", "Tương tác và quảng bá server", "Muốn gắn bó lâu dài", "Nội dung: công thành, xây dựng, sinh tồn"]
      contact: "&7Gửi link kênh cho admin: nhắn &f/msg Linh &7trong game hoặc qua Discord/Zalo của server."
      homes: 5
      balo: 2
      balo-slots: 45
      ah: 9
      orders: 6
      tu-skin: 6
      spin-faster: 20
      kit: media
      tp-delay: 2
      radar: true
    namtuoc: {homes: 0, balo: 2, balo-slots: 27, ah: 0, orders: 0, tu-skin: 3, spin-faster: 0, kit: "", tp-delay: 3}
    tutuoc: {homes: 0, balo: 2, balo-slots: 36, ah: 0, orders: 0, tu-skin: 5, spin-faster: 0, kit: "", tp-delay: 3}
    batuoc: {homes: 0, balo: 3, balo-slots: 36, ah: 0, orders: 0, tu-skin: 8, spin-faster: 0, kit: "", tp-delay: 3}
    hautuoc: {homes: 0, balo: 3, balo-slots: 45, ah: 0, orders: 0, tu-skin: 12, spin-faster: 0, kit: "", tp-delay: 2}
    congtuoc: {homes: 0, balo: 4, balo-slots: 54, ah: 0, orders: 0, tu-skin: 20, spin-faster: 0, kit: "", tp-delay: 2}
    builder: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 0, spin-faster: 0, kit: "", tp-delay: -1}
    helper: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 0, spin-faster: 0, kit: "", tp-delay: -1, radar: true}
    mod: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 0, spin-faster: 0, kit: "", tp-delay: -1, radar: true}
    quanly: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 0, spin-faster: 0, kit: "", tp-delay: -1, radar: true}
    admin: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 0, spin-faster: 0, kit: "", tp-delay: -1, radar: true}

# Balo cá nhân (/balo): số balo và số ô mỗi balo theo danh phận (play-ranks.tiers.*.balo / balo-slots) và rank khác (play-ranks.other-ranks). Không mở khi vừa đánh người (combat-seconds) hay trong vùng vây đang đánh.
backpack:
  enabled: true
  default-slots: 9         # số ô khi người chơi không có quyền duckymomo.balo.o.<N> nào
  combat-seconds: 15
  max: 9

# Chương trình Sứ Giả (/media, 19/10): kiểm soát rank Sứ Giả bằng số liệu. Quyền lợi rank media: play-ranks.other-ranks.media.
# Người chơi: /media dangky <link kênh TikTok/YouTube> → admin duyệt (trang quản trị › Sứ Giả hoặc /media duyet <tên> [ngày]) = rank media CÓ HẠN
# (trial-days), gia hạn /media giahan <tên> [ngày]. Mỗi lần live: /media live [link] → báo cả server; mỗi check-minutes phút server tự kiểm
# người đó ONLINE THẬT (không AFK) + kênh ĐANG LIVE (TikTok: trang api-live không chính thức; YouTube: cần youtube-key, Google Cloud ›
# YouTube Data API v3). Không kiểm được (TikTok chặn/lỗi) thì tính "chưa xác minh" để admin xem link. Chỉ tiêu 7 ngày: min-sessions buổi
# (mỗi buổi ≥ min-session-minutes phút) VÀ min-hours giờ. Thứ 2 chấm tuần trước; thiếu fail-weeks-alert tuần liền → báo admin (không tự gỡ).
media:
  enabled: true
  group: media
  trial-days: 14
  extend-days: 30
  min-sessions: 4
  min-session-minutes: 30
  min-hours: 6
  check-minutes: 5
  tiktok-check: true
  youtube-key: "${CFG_YOUTUBE_KEY}"   # BÍ MẬT: đặt YOUTUBE_KEY=... trong .env (không ghi thẳng vào đây), trống = YouTube tính "chưa xác minh"
  announce-cooldown-minutes: 60   # báo "đang live" cho cả server tối đa 1 lần mỗi ngần này phút / người
  fail-weeks-alert: 2

# Gói tài nguyên theo lựa chọn từng người (/caidat › Font chữ mềm). URL/SHA1 do ./ops/build-font-pack.sh ghi vào .env -> compose -> CFG_*.
# 30/10: mặc định TẮT = gói items (font pixel gốc Minecraft đã sửa dấu ngã + hình vật phẩm); bật = Be Vietnam Pro + hình vật phẩm.
resource-pack:
  font-url: "${CFG_FONT_PACK_URL}"
  font-sha1: "${CFG_FONT_PACK_SHA1}"
  item-url: "${CFG_ITEM_PACK_URL}"
  item-sha1: "${CFG_ITEM_PACK_SHA1}"
  font-prompt: "&6Tải font chữ mềm Be Vietnam Pro (khoảng 130 KB)? Không thích: /caidat tắt Font chữ mềm."
  item-prompt: "&6Tải gói của server (sửa dấu tiếng Việt + hình vật phẩm, khoảng 80 KB)?"

# Menu chính cho người chơi (20/10): /menu hoặc Shift + F. Mỗi nút: slot (0..rows*9-1), icon, name, lore, và MỘT trong:
#   cmd (chạy lệnh thay người chơi, không cần /), suggest (điền sẵn vào ô chat), proxy (lệnh của proxy: tuskin, skin), server (chuyển server).
# Sảnh không có menu này (ở sảnh /menu = chọn chế độ). Không dùng mã chữ đậm: font tiếng Việt bị nhòe.
player-menu:
  enabled: true
  title: "&0✦ Menu Bang Hội Chiến"
  rows: 5
  shift-f: true
  filler: GRAY_STAINED_GLASS_PANE
  # Mỗi nút: name (ký hiệu + tên), sub (phụ đề), lore (mô tả), gom (danh sách "Gồm"), bam (dòng bấm); dùng được %placeholder%.
  # Hàng 2 vàng = việc hằng ngày, hàng 3 xanh lá = kinh tế, hàng 4 xanh dương = thế giới, hàng 5 tím = cá nhân.
