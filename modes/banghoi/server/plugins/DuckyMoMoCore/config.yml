# Dịch chuyển ngẫu nhiên /tpr (alias /rtp, /ngaunhien): menu chọn khu (Java: rương, Bedrock: form) hoặc /tpr <khu>.
# Chỉ thả xuống đất hoang Towny (cách thị trấn >= town-buffer block), không xuống nước/dung nham/ngọn cây, ngoài vùng exclude.
# NPC ở spawn: admin đứng tại chỗ muốn đặt rồi gõ /dmm rtpnpc (đặt lại = xoá cái cũ), xoá: /dmm rtpnpc remove.
# Toạ độ khu: map 1:1000, x = kinh độ x 119,47, z = -vĩ độ x 119,47. radius 0 = cả vùng mùa (border).
rtp:
  enabled: true
  world: world
  cooldown-seconds: 300         # trang Cài đặt sửa được; người có duckymomo.rtp.bypass không phải chờ
  warmup-seconds: 3             # đứng yên N giây rồi mới đi (di chuyển/bị đánh = huỷ); 0 = đi ngay; staff có essentials.teleport.timer.bypass đi ngay
  cost: 0                       # phí mỗi lần (0 = miễn phí); duckymomo.rtp.free không mất phí
  max-attempts: 30
  town-buffer: 32
  border: [11200, -3200, 15100, 1100]       # 27/10 mở hết map: khung /rtp = vùng thiết kế (hết 4 vùng khai hoang), không thả xa hơn cho đỡ sinh địa hình mới (giật); thả cách khung >= 16 block
  exclude:
    - [12556, -2623, 12801, -2298]           # khu spawn (công trình GlassCup + vùng WorldGuard spawn)
  blocked-biomes: [ocean, river, beach]
  npc:
    name: "&6Dịch chuyển ngẫu nhiên"
    lines: ["&7Bấm vào để chọn khu", "&8(PC: chuột phải · Điện thoại: chạm)"]
  zones:
    - {id: taybac, name: "&aBắc Sơn Lĩnh", icon: MOSSY_COBBLESTONE, center-x: 12365, center-z: -2569, radius: 230, description: "Núi rừng, gần kinh đô"}
    - {id: lao, name: "&aRừng Lam", icon: JUNGLE_SAPLING, center-x: 12305, center-z: -2330, radius: 230, description: "Rừng núi"}
    - {id: trungbo, name: "&eCao Nguyên Gió", icon: COCOA_BEANS, center-x: 12843, center-z: -1732, radius: 230, description: "Cao nguyên, ven biển phía đông"}
    - {id: nambo, name: "&eChâu Thổ Phù Sa", icon: WHEAT, center-x: 12604, center-z: -1374, radius: 230, description: "Đồng bằng, hợp làm ruộng"}
    - {id: thailan, name: "&6Đồng Kim", icon: GOLD_BLOCK, center-x: 12007, center-z: -1792, radius: 230, description: "Đồng bằng ven sông lớn"}
    - {id: myanmar, name: "&6Tây Mộc Vực", icon: BAMBOO, center-x: 11529, center-z: -2389, radius: 230, description: "Xa kinh đô nhất về phía tây"}
    - {id: namtq, name: "&cHồng Nguyên", icon: RED_SAND, center-x: 13142, center-z: -2808, radius: 230, description: "Phía bắc vùng mùa"}
    # vùng mở bằng khai hoang (requires: id mốc frontier.goals): chỉ hiện ở /tpr, có đặc sản, Người Tiên Phong khi mốc đã mở
    # 27/10: mở hết map, bỏ requires 4 vùng dưới (khai hoang đã tắt)
    - {id: malai, name: "&eBán Đảo Mưa", icon: JUNGLE_LOG, center-x: 12250, center-z: -350, radius: 230, description: "Rừng mưa nhiệt đới, eo biển"}
