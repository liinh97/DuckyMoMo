# Thăng Cấp (/capdo; ý từ Prestige của UniMC): cấp riêng của server. Lên cấp N cần: xu (trả khi lên) = money-base × N^money-exponent,
# giờ chơi thật của mùa >= hours-per-level × N, điểm hạ gục >= kill-points-per-level × N (quái +mob-points, người +player-points).
# Mỗi cấp +points-per-level điểm đổi đặc quyền (CHỈ tiện ích / trang trí). keep-on-new-season: false = mùa mới làm lại từ cấp 0.
# Trang Cài đặt › Kinh tế › Thăng Cấp.
level-up:
  enabled: true
  max-level: 100
  money-base: 500
  money-exponent: 1.25
  hours-per-level: 0.5
  kill-points-per-level: 20
  mob-points: 1
  player-points: 10
  player-cooldown-minutes: 10   # giết lại cùng một người trong ngần này phút không tính điểm
  points-per-level: 1
  milestone-every: 10
  milestone-rewards: ["xu 5000", "vat EXPERIENCE_BOTTLE 16"]
  keep-on-new-season: false
  shop:
    craft: {name: "Bàn chế tạo mang theo (/craft)", icon: CRAFTING_TABLE, cost: 3, perms: [essentials.workbench], description: ["Mở bàn chế tạo ở bất cứ đâu"]}
    disposal: {name: "Thùng rác (/disposal)", icon: CAULDRON, cost: 2, perms: [essentials.disposal], description: ["Vứt đồ không cần nhanh gọn"]}
    anvil: {name: "Đe mang theo (/anvil)", icon: ANVIL, cost: 5, perms: [essentials.anvil], description: ["Mở đe ở bất cứ đâu"]}
    hat: {name: "Đội đồ lên đầu (/hat)", icon: LEATHER_HELMET, cost: 3, perms: [essentials.hat], description: ["Đội khối / đồ bất kỳ lên đầu (trang trí)"]}
    hat2: {name: "Thêm 1 hiệu ứng hạt", icon: BLAZE_POWDER, cost: 6, perms: [playerparticles.particles.max.2], description: ["Bật cùng lúc 2 hiệu ứng hạt (/pp)"]}
    meo: {name: "Pet mèo trang trí", icon: COD, cost: 5, perms: ["pet.type.cat.*"], description: ["Gọi mèo đi theo (/pet), chỉ trang trí"]}
    giamxuong: {name: "Giảm 5% giá Xưởng", icon: SMITHING_TABLE, cost: 8, perms: [duckymomo.xuong.giam], description: ["Chế đồ ở /xuong rẻ hơn 5%"]}
    laoluyen: {name: "Danh hiệu Lão Luyện", icon: NAME_TAG, cost: 15, rewards: ["danhhieu laoluyen"], description: ["Danh hiệu riêng cho người cấp cao"]}

# Cổng Hoang (/conghoang): cổng dungeon ngụy trang xuất hiện dần trên bản đồ. Chỉ tự đặt khi đã mở mùa (leaderboard.season-start).
# Trang Cài đặt > Thế giới > Cổng Hoang. Thị trấn có ô đất chứa cổng là chủ; chiếm được thị trấn là có cổng.
wild-gates:
  enabled: true
  max-gates: 4             # tối đa cổng mỗi mùa (= số dungeon đích thì mỗi cổng một nơi khác nhau)
  interval-days: 7         # mỗi ngần này ngày thêm 1 cổng
  min-town-distance: 300   # cổng cách điểm spawn thị trấn gần nhất ít nhất ngần này khối
  min-gate-distance: 800   # các cổng cách nhau
  grace-minutes: 30        # người tìm ra được ưu tiên lập/mở rộng thị trấn quanh cổng trong ngần này phút
  grace-radius: 64         # bán kính ưu tiên (khối)
  max-toll: 10000          # phí qua cổng tối đa chủ cổng được đặt
  upkeep-per-day: 0        # xu/ngày trừ ngân khố thị trấn giữ cổng (0 = không)
  revolt-hours-less: 0     # thị trấn giữ cổng bị chiếm thì được khởi nghĩa sớm hơn ngần này giờ (0 = không)
  # Bậc ngụy trang: dungeon càng khó, cổng càng khó nhận ra. particle-range: hạt tím thấy trong (khối); night-only: hạt chỉ hiện ban đêm;
  # hint-range: dòng nhắc "luồng khí lạ" khi đứng gần (0 = không); rumor: chi-tiet (vùng + hướng) | vung (chỉ vùng) | mo-ho (chỉ loại địa hình);
  # treasure-radius: kho báu huyền thoại chỉ đường sai số (khối, 0 = không chỉ); structure-percent: dựng bao nhiêu % chi tiết ngụy trang.
  tiers:
    t1: {particle-range: 16, night-only: false, hint-range: 6, rumor: chi-tiet, treasure-radius: 40, structure-percent: 100}
    t2: {particle-range: 8, night-only: false, hint-range: 3, rumor: vung, treasure-radius: 80, structure-percent: 55}
    t3: {particle-range: 4, night-only: true, hint-range: 0, rumor: mo-ho, treasure-radius: 150, structure-percent: 25}
  underwater-chance: 30    # % mỗi lần thử chọn chỗ được phép đặt cổng dưới đáy nước (biển, sông sâu 2–24 khối)
  # Cổng dẫn tới (ngẫu nhiên, ưu tiên gói đã cài): bậc theo độ khó dungeon + dấu hiệu riêng đưa vào tin đồn
  dungeons:
    sewers_minidungeon: {tier: 1, rumor: "dưới đất bốc lên mùi ẩm mốc và tiếng nước nhỏ giọt"}
    north_pole_minidungeon: {tier: 2, rumor: "giữa trời nắng mà gió lạnh buốt, thoảng tiếng chuông xe tuần lộc"}
    knights_castle_lair: {tier: 2, rumor: "đêm nào cũng nghe tiếng giáp sắt va nhau"}
    steamworks_lair: {tier: 3, rumor: "có tiếng máy hơi nước rít lên từ lòng đất"}

# Cổng Dungeon (/dungeon): khoá từng dungeon EliteMobs, mở theo 5 kiểu. Mã = tên file gói EliteMobs (bỏ .yml).
# Trang Cài đặt > Thế giới > Cổng Dungeon. Dungeon chưa cài thì hiện "chưa cài", cài sau là tự dùng được.
#  chain: chuỗi chìa khoá (requires = phải vượt dungeon trước) · hidden: ẩn (admin đứng tại chỗ gõ /dungeon datan <mã>)
#  luck: Vé Vận Mệnh rơi hiếm · ticket: vé cá nhân mua bằng xu · server: cả server góp quỹ mở (open-days 0 = tới hết mùa)
#  gate: chỉ vào được qua Cổng Hoang (/conghoang). Chưa có dungeon kiểu luck nào thì Vé Vận Mệnh không rơi.
# Kỹ năng nghề AuraSkills (/skills): làm lại từ cấp 0 mỗi mùa (khi leaderboard.season-start đổi). AuraSkills chỉ xoá được người đang online,
# nên DuckyMoMoCore xoá lúc từng người vào game lần đầu trong mùa mới (kynang-mua.yml). Cấu hình kỹ năng: plugins/AuraSkills/.
aura-skills:
  reset-each-season: true

# Lữ khách (/lukhach, cần Citizens + BetonQuest): mỗi lữ khách kể chuyện về một nơi phía sau Cổng Hoang (dungeon: mã trong wild-gates.dungeons).
# NPC Citizens đứng ở đất hoang ngẫu nhiên (luật chọn chỗ của Cổng Hoang), mỗi move-hours giờ dời đi chỗ khác, báo tin đồn (vùng + hướng).
# Tên NPC phải trùng tên trong BetonQuest (plugins/BetonQuest/QuestPackages/cotruyen/lukhach/), đổi tên thì sửa cả hai chỗ.
# skin: tên một người chơi bản quyền để mượn skin (trống = mặc định). Admin: /lukhach ds | doi <mã|all> | xoa.
wander-npcs:
  enabled: true
  move-hours: 72
  announce: true
  npcs:
    cong: {dungeon: sewers_minidungeon, name: "Thợ Cống Già", skin: "", rumor: "có một ông già người ướt sũng, cứ lẩm bẩm về những đường cống dưới lòng đất"}
    bacuc: {dungeon: north_pole_minidungeon, name: "Người Kéo Xe Tuần Lộc", skin: "", rumor: "có một người mặc áo lông dày giữa trời nắng, run cầm cập"}
    hiepsi: {dungeon: knights_castle_lair, name: "Hiệp Sĩ Lạc Đàn", skin: "", rumor: "có một hiệp sĩ giáp sứt mẻ ngồi một mình bên đống lửa"}
    hoinuoc: {dungeon: steamworks_lair, name: "Kỹ Sư Bỏ Trốn", skin: "", rumor: "có một người mặt đầy muội than, tay ôm chặt chiếc cờ lê"}

dungeon-gate:
  enabled: true
  key-tradeable: false     # Chìa khoá tầng (trùm cuối rơi) có cho người khác dùng không: false = ghi tên người nhận, chỉ người đó dùng được
  window-seconds: 120      # mở cổng xong có ngần này giây để chọn độ khó và vào; không vào thì hoàn vé
  hidden-radius: 4         # tới gần lối vào ẩn trong ngần này khối là tìm ra
  luck:
    mob-chance: 0.05       # % mỗi quái thù địch bị hạ rơi Vé Vận Mệnh (0.05% ≈ 1/2000)
    fish-chance: 0.3       # % mỗi con cá câu được
    max-per-day: 1         # tối đa vé/người/ngày
  fragment:                # Mảnh Chìa: chỉ rơi cho người đã tìm ra dungeon ẩn có fragments mà chưa ghép đủ
    mob-chance: 1          # % mỗi quái bị hạ
    fish-chance: 3         # % mỗi con cá
    max-per-day: 3
  weekly:                  # Dungeon của tuần: mỗi tuần chọn ngẫu nhiên 1 dungeon (kiểu trong types, đã cài), vượt được thêm quà
    enabled: true
    types: [chain, ticket, server]
    rewards: ["xu 1500"]
    max-per-week: 3        # tối đa lần nhận quà tuần / người
  # Điều kiện phụ (tuỳ dungeon, kiểm từng người trong nhóm /em party): min-pet-level, party: "2-4", days: [t2..t7, cn],
  # hours: "19-23" (giờ VN), seasons: [mua, kho], hegemon-only: true, min-achievements. Dungeon ẩn: fragments: <số Mảnh Chìa>.
  dungeons:
    the_climb_dungeon: {name: "Đỉnh Vách Đá", type: chain, level: "10", first-rewards: ["xu 500"]}
    the_cave_sanctum: {name: "Hang Thánh Địa", type: chain, level: "15", requires: the_climb_dungeon, first-rewards: ["xu 800"]}
    the_mines_dungeon: {name: "Mỏ Hoang", type: chain, level: "20", requires: the_cave_sanctum, first-rewards: ["xu 1000"]}
    the_bridge_sanctum: {name: "Cây Cầu Cổ", type: chain, level: "25", requires: the_mines_dungeon, first-rewards: ["xu 1200"]}
    the_city_dungeon: {name: "Thành Phố Đổ Nát", type: chain, level: "30", requires: the_bridge_sanctum, first-rewards: ["xu 1500"]}
    the_palace_sanctum: {name: "Cung Điện", type: chain, level: "35", requires: the_city_dungeon, first-rewards: ["xu 2000"]}
    the_quarry_dungeon: {name: "Mỏ Đá", type: chain, level: "40", requires: the_palace_sanctum, first-rewards: ["xu 2500"]}
    the_deep_mines_dungeon: {name: "Mỏ Sâu", type: chain, level: "45", requires: the_quarry_dungeon, first-rewards: ["xu 3000"]}
    the_nether_wastes_dungeon: {name: "Hoang Mạc Địa Ngục", type: chain, level: "50", requires: the_deep_mines_dungeon, min-pet-level: 10, first-rewards: ["xu 4000"]}
    the_nether_bell_sanctum: {name: "Chuông Địa Ngục", type: chain, level: "55", requires: the_nether_wastes_dungeon, party: "2-4", first-rewards: ["xu 6000"]}
    sewers_minidungeon: {name: "Cống Ngầm", type: gate, level: "25", first-rewards: ["xu 2000"]}
    dark_cathedral_lair: {name: "Thánh Đường Bóng Tối", type: hidden, level: "15", night-only: true, fragments: 3, hint: "chỉ hiện ra lúc nửa đêm", first-rewards: ["xu 3000"]}
    north_pole_minidungeon: {name: "Bắc Cực", type: gate, level: "55", first-rewards: ["xu 4000"]}
    knights_castle_lair: {name: "Lâu Đài Hiệp Sĩ", type: ticket, level: "95", price: 3000, max-tickets: 5, days: [t7, cn]}
    steamworks_lair: {name: "Xưởng Hơi Nước", type: ticket, level: "140", price: 5000, max-tickets: 5, min-achievements: 8}
    fireworks_lair: {name: "Lễ Hội Pháo Hoa", type: server, level: "20", goal: 100000, open-days: 7}
    hallosseum_lair: {name: "Đấu Trường Ma", type: server, level: "30", goal: 150000, open-days: 7, party: "2-5", hours: "19-23"}
    binder_of_worlds_sanctum: {name: "Kẻ Trói Buộc Thế Giới", type: server, level: "100", goal: 1000000, open-days: 0, party: "3-6", min-pet-level: 20, first-rewards: ["xu 20000"]}

# Cân bằng chiến tranh (/canbang): chống "nước to nuốt hết". Trang Cài đặt > Chiến tranh > Cân bằng chiến tranh
war-balance:
  enabled: true
  war-chest-extra-percent-per-town: 10   # quỹ chiến tranh tăng % cho mỗi thị trấn (trừ thị trấn đầu) nước đi vây đang có
  colony-upkeep-per-day: 50              # mỗi thuộc địa tốn ngần này xu/ngày từ ngân khố nước chiếm (thiếu thì ghi nợ, còn nợ không cắm cờ vây được)
  max-colonies: 3                        # tối đa thuộc địa mỗi nước (0 = không giới hạn)
  revolt-hours-base: 72                  # thuộc địa được khởi nghĩa sau ngần này giờ
  revolt-hours-less-per-colony: 12       # bớt ngần này giờ cho mỗi thuộc địa khác của nước chiếm
  revolt-hours-min: 24
  underdog-ratio: 2                      # bên tấn công đông dân gấp ngần này lần bên phòng thủ thì bên phòng thủ được cộng điểm
  underdog-points-percent: 15            # % điểm giữ cờ cộng thêm cho bên phòng thủ yếu (vừa phải)
  hegemon-percent: 30                    # nước nắm từ ngần này % thị trấn cả server là Bá chủ
  hegemon-min-towns: 5
  hegemon-warchest-discount: 30          # đánh vào Bá chủ: hoàn lại % quỹ chiến tranh
  hegemon-points-percent: 15             # đánh vào Bá chủ: % điểm giữ cờ cộng thêm
  hegemon-max-regions: 2                 # Bá chủ chỉ hưởng đặc sản tối đa ngần này vùng

# Kho lương công thành (/kholuong): thị trấn nộp lương, lúc có phiên đánh quân trong vùng vây ăn từ kho thị trấn mình
siege-supply:
  enabled: true
  max-per-town: 5000                   # kho tối đa (điểm)
  cost-per-player-minute: 2            # mỗi người đang đánh trong vùng vây ăn bao nhiêu điểm/phút (kho cạn thì bị Đói)
  spoil-percent-per-day: 0             # kho hao hụt % mỗi ngày (lương để lâu hư); 0 = không hao
  dish-points: 15                      # mỗi món ăn ra trận (/nauan)
  fish: {Common: 2, Rare: 5, Epic: 12, Legendary: 40}   # cá câu (EvenMoreFish) theo độ hiếm
  points:                              # nông sản, đồ ăn thường (điểm mỗi cái)
    WHEAT: 1
    HAY_BLOCK: 9
    BREAD: 3
    POTATO: 1
    BAKED_POTATO: 2
    CARROT: 1
    GOLDEN_CARROT: 4
    BEETROOT: 1
    BEETROOT_SOUP: 4
    MELON_SLICE: 0.5
    PUMPKIN: 2
    PUMPKIN_PIE: 5
    APPLE: 2
    SWEET_BERRIES: 0.5
    COCOA_BEANS: 1
    COOKIE: 1
    MUSHROOM_STEW: 4
    RABBIT_STEW: 6
    COOKED_BEEF: 4
    COOKED_PORKCHOP: 4
    COOKED_MUTTON: 3
    COOKED_CHICKEN: 3
    COOKED_RABBIT: 3
    COOKED_COD: 2
    COOKED_SALMON: 3
    DRIED_KELP: 0.5

# Món ăn ra trận (/nauan): cá câu + nông sản -> món có hiệu ứng ngắn. "ca:<độ hiếm>" = cá câu EvenMoreFish.
# list.<mã thư viện>: need (nguyên liệu). Món + hiệu ứng khi ăn ("TÊN cấp giây", cấp 0 = I) ở trang Thư viện đồ (công dụng "Món ăn").
dishes:
  enabled: true
  cooldown-minutes: 20                 # ăn 1 món rồi phải chờ ngần này phút mới ăn món khác
  list:
    com_nam: {need: {WHEAT: 6}}
    canh_chua: {need: {"ca:common": 2, BEETROOT: 2, WHEAT: 2}}
    ca_kho: {need: {"ca:rare": 1, SUGAR_CANE: 2, WHEAT: 3}}
    lau_ca: {need: {"ca:epic": 1, POTATO: 3, CARROT: 3, BROWN_MUSHROOM: 1}}
    goi_ca: {need: {"ca:legendary": 1, CARROT: 3, BEETROOT: 3}}

# Đặc sản vùng (/dacsan): vùng = rtp.zones. Phe (nước, hoặc thị trấn chưa vào nước) có nhiều thị trấn nhất trong vùng thì dân phe đó gặt
# đặc sản (WHEAT, CARROTS, POTATOES, BEETROOTS, COCOA) ở bất kỳ đâu được mùa thêm %.
region-specialty:
  enabled: true
  refresh-minutes: 10
  regions:
    taybac: {label: "khoai núi", crops: {POTATOES: 25}}
    lao: {label: "rau củ vùng núi", crops: {CARROTS: 25}}
    trungbo: {label: "ca cao Tây Nguyên", crops: {COCOA: 30}}
    nambo: {label: "vựa lúa", crops: {WHEAT: 30}}
    thailan: {label: "lúa Thái, ca cao", crops: {WHEAT: 20, COCOA: 10}}
    myanmar: {label: "củ dền", crops: {BEETROOTS: 25}}
    namtq: {label: "khoai, củ", crops: {POTATOES: 15, BEETROOTS: 15}}
    malai: {label: "ca cao, cà rốt", crops: {COCOA: 20, CARROTS: 15}}
    philippines: {label: "lúa bậc thang", crops: {WHEAT: 25}}
    borneo: {label: "ca cao rừng già", crops: {COCOA: 30}}
    java: {label: "lúa, khoai núi lửa", crops: {WHEAT: 20, POTATOES: 20}}

# Ủng hộ bằng QR ngay trong game (/rank mua): chọn gói -> panel tạo yêu cầu (chung hàng chờ trang quản trị > Donate) -> QR VietQR vẽ trên tấm bản đồ,
# hết hạn sau minutes phút. Cần PANEL_URL + PANEL_SITE_KEY (compose) và tài khoản ngân hàng trong site/config/site.yml (donate). Thiếu thì chỉ hiện link web.
donate-qr:
  enabled: true
  minutes: 10
  web: "https://app.goc6.io.vn/mc/web/taikhoan.html"

# Pet chiến đấu MyPet (PetCombat): trang Cài đặt > PvP & combat > Pet chiến đấu
pet-fish:
  enabled: true
  daily-exp-cap: 300                   # kinh nghiệm tối đa mỗi người/ngày từ cho pet ăn cá (chống máy câu tự động)
  rarity:                              # food = điểm no (tối đa 100), exp = kinh nghiệm, heal = % máu tối đa hồi lại
    Common: {food: 15, exp: 3, heal: 10}
    Rare: {food: 30, exp: 10, heal: 25}
    Epic: {food: 50, exp: 30, heal: 50}
    Legendary: {food: 100, exp: 100, heal: 100}

pet-capture:
  enabled: true
  chance-percent: 30                   # xác suất bắt mặc định (%) mỗi lần quăng dây xích vào con yếu máu
  attempts-per-mob: 3                  # mỗi con chỉ thử được ngần này lần, hết thì con vật hoảng, không bắt được nữa
  cooldown-seconds: 2                  # chờ giữa 2 lần thử của một người
  charm-bonus: 25                      # Bùa bắt pet (/buabatpet) cầm tay trái: +% mỗi lần thử, mất 1 bùa
  charm-item: bua_bat_pet              # mã thư viện đồ của bùa (công dụng Bùa bắt pet); /buabatpet give phát món này
  group-chance:                        # riêng từng nhóm loài (mã nhóm trong tools/mypet/sinh-cay-ky-nang.py)
    giasuc: 50
    thuytoc: 40
    cuoi: 35
    xacsong: 35
    thusan: 25
    cungthu: 25
    nhay: 25
    bay: 20
    thulon: 15
    phuthuy: 10
  season-bonus:                        # cộng thêm % bắt trong mùa (mã mùa trong seasons.order, mã nhóm như group-chance)
    mua: {thuytoc: 15, nhay: 10}
    kho: {bay: 10, thusan: 5}

pet-combat:
  enabled: true
  player-damage-reduce-percent: 50   # pet đánh người chơi bị giảm bao nhiêu % sát thương (0 = không giảm, 100 = không đau)
  siege-pet-chance: 30               # % phiên công thành cho pet tham chiến (bốc thăm cố định theo giờ phiên, báo trước)
  seed: mua1                          # đổi chuỗi này là bốc thăm lại toàn bộ lịch
  announce-minutes: [60, 10]          # báo cả server trước phiên (phút)
  siege-no-fly: true                  # lúc có phiên đánh, trong vùng vây: không bay bằng pet (bị đẩy xuống, Rơi chậm)
  siege-no-fly-height: 3              # pet cưỡi cao hơn ngần này khối so với mặt đất thì tính là bay
  siege-weather:                       # lúc có phiên đánh, trong vùng vây: trời đất ảnh hưởng trận, pet có đất diễn
    enabled: true
    pet-range: 24                      # pet phải ở trong ngần này khối quanh chủ mới tính
    night-darkness: true               # đêm: không có pet mắt đêm ở gần thì bị Bóng tối; có thì được Nhìn đêm
    night-pet-bonus: 20                # % sát thương thêm cho pet mắt đêm ban đêm
    night-eyes: [Bat, Phantom, Cat, Ocelot, Fox, Wolf, Spider, CaveSpider, Enderman, Endermite, Vex, Warden]
    rain-slowness: true                # mưa: người đi bộ bị Chậm (cưỡi pet thì không)
    rain-water-bonus: 20               # % sát thương thêm cho pet nước khi mưa
    rain-fire-malus: 25                # % sát thương bị giảm của pet lửa khi mưa
    water-pets: [Axolotl, Cod, Salmon, Pufferfish, TropicalFish, Squid, GlowSquid, Dolphin, Guardian, ElderGuardian, Tadpole, Frog, Turtle, Drowned]
    heat-season: kho                   # mùa nắng gắt (ban ngày, không mưa)
    heat-hunger: true                  # nắng gắt: ai không dẫn pet lửa thì bị Đói
    heat-bonus: 15                     # % sát thương thêm cho pet lửa lúc nắng gắt
    fire-pets: [Blaze, MagmaCube, Strider, WitherSkeleton, Hoglin, Zoglin, Piglin, PiglinBrute, ZombifiedPiglin, Ghast]

# Đấu Trường /dautruong (Arena): trang Cài đặt > PvP & combat > Đấu Trường
arena:
  enabled: true
  world: dautruong                  # thế giới trống riêng, plugin tự tạo; dán map bằng WorldEdit
  countdown-seconds: 5
  fight-seconds: 180                # hết giờ: đội còn nhiều % máu hơn thắng
  pet-damage-reduce-percent: 50     # trong sân: pet đánh người bị giảm bao nhiêu %
  fee-percent: 5                    # server thu % tổng tiền cược
  max-stake: 10000
  win-reward: 50                    # thưởng mỗi trận thắng (không tính giao hữu cùng IP)
  daily-reward-cap: 5               # số trận được thưởng mỗi ngày
  pet-exp-win: 30                     # kinh nghiệm cho pet đang dẫn khi thắng (chung giới hạn trận thưởng/ngày)
  elo-k: 32

# Tiêu đề khung nhắc lúc vào game (gom hướng dẫn, mùa, công thành, điểm danh… thành một khung)
join-notes-title: "Bang Hội Chiến"

# Đăng nhập trang web bằng mã /web (19/10: 5 → 60 phút). Sửa ở Cài đặt › Đăng nhập trang web (ghi cả 4 server).
web-login:
  code-minutes: 60

# Tinh Luyện (/tinhluyen, 19/10): đổi MỘT CHIỀU lượng lớn khối thường → món tinh luyện (đồ có dấu riêng, đổi tên bằng đe không giả được).
# Dùng: hàng trao đổi ở shop dân làng (admin lấy món: /tinhluyen give <mã> [số], kéo vào trình sửa Shopkeepers), nguyên liệu Xưởng
# (workshop.items.<mã>.tinh-luyen: {sat: 1}), bán cho server (/sell hand|all hoặc /tinhluyen ban). Không đổi ngược: rút khoáng sản khỏi kinh tế.
# recipe: VẬT_LIỆU (đồ trơn) hoặc mã món khác: số. sell: giá bán 1 món (đặt ~70% giá trị nguyên liệu theo worth.yml để không lời vô hạn;
# đá cuội không có giá /sell + máy tạo đá vô hạn nên Tinh Luyện Đá để rất thấp). Mã món = mã thư viện đồ (công dụng "Nguyên liệu Tinh Luyện"):
# tên, vật phẩm nền (mảnh gốm / hạt vàng: không đặt được, không có giá trong worth.yml), mô tả, model (hình riêng trong gói tài nguyên,
# tools/itempack/gen.py) sửa ở trang Thư viện đồ. Đổi tên/mô tả thì món CŨ vẫn dùng được (nhận theo mã), nhưng shop Shopkeepers đã đặt phải đặt lại món mới.
tinh-luyen:
  enabled: true
  xu-quai:
    item: xuquai            # mã món rơi từ quái
    chance: 5               # % mỗi con quái thù địch người chơi giết (quái từ lồng quái không rơi)
    elite-chance: 40        # % quái EliteMobs (tinh nhuệ, boss)
    elite-max: 3            # quái EliteMobs rơi 1..elite-max
  items:
    xuquai:     {sell: 2}
    xuquai2:    {recipe: {xuquai: 64}, sell: 100}
    da:         {recipe: {COBBLESTONE: 256, COBBLED_DEEPSLATE: 256}, sell: 30}
    than:       {recipe: {COAL_BLOCK: 64}, sell: 400}
    dong:       {recipe: {RAW_COPPER_BLOCK: 64}, sell: 400}
    sat:        {recipe: {RAW_IRON_BLOCK: 64}, sell: 1600}
    dado:       {recipe: {REDSTONE_BLOCK: 64}, sell: 200}
    lapis:      {recipe: {LAPIS_BLOCK: 64}, sell: 400}
    vang:       {recipe: {RAW_GOLD_BLOCK: 64}, sell: 2400}
    kimcuong:   {recipe: {DIAMOND_BLOCK: 64}, sell: 24000}
    lucbao:     {recipe: {EMERALD_BLOCK: 32}, sell: 4000}
    netherite:  {recipe: {NETHERITE_BLOCK: 32}, sell: 125000}
    dialinh:    {recipe: {HAY_BLOCK: 64}, sell: 300}

# Danh phận (/danhphan, 19/10): rank CHƠI miễn phí, đủ yêu cầu thì bấm nhận trong menu. Sửa ở Cài đặt › Người mới › Danh phận.
# Mỗi bậc: group (nhóm LuckPerms; bậc đầu PHẢI là default), name, prefix (tiền tố chat/Tab, priority càng cao càng ưu tiên, dưới staff),
# hours (giờ chơi thật, /hoatdong), level (Thăng Cấp), perm + perm-text (quyền cần có, vd xong chương 1 cốt truyện), homes (số nhà /sethome),
# balo (số balo /balo), ah (số món treo chợ /ah), icon. Lúc bật / dmm reload plugin TỰ ĐỒNG BỘ nhóm LuckPerms (tiền tố, weight, quyền
# essentials.sethome.multiple.dmm<N> / zauctionhouse.max.<N> / duckymomo.balo.<N> theo server). Essentials sethome-multiple có sẵn dmm1..dmm20,
# zAuctionHouse permissions.auction có zauctionhouse.max.1..20 (số lớn hơn 20 thì thêm vào 2 file đó).
play-ranks:
  enabled: true
  back: true            # /back cho người chơi mọi bậc (Cài đặt › Thế giới › Dịch chuyển bằng lệnh)
  back-ondeath: true    # /back về chỗ vừa chết
  server: banghoi-1
  announce: true
  tiers:
    tinan:    {group: default, name: "Dân Tị Nạn", prefix: "&8[Tị Nạn] ", priority: 0, hours: 0, level: 0, homes: 1, balo: 0, balo-slots: 27, ah: 2, orders: 2, tu-skin: 1, icon: DEAD_BUSH}
    dan:      {group: dan, name: "Dân", prefix: "&7[Dân] ", priority: 1, hours: 6, level: 0, perm: duckymomo.cotruyen.c1,
               perm-text: "Xong chương 1 cốt truyện (Già Làng)", homes: 2, balo: 1, balo-slots: 27, ah: 4, orders: 3, tu-skin: 2, icon: WHEAT}
    luongdan: {group: luongdan, name: "Lương Dân", prefix: "&a[Lương Dân] ", priority: 2, hours: 24, level: 10, homes: 3, balo: 2, balo-slots: 36, ah: 6, orders: 4, tu-skin: 3, icon: IRON_HOE}
    haokiet:  {group: haokiet, name: "Hào Kiệt", prefix: "&6[Hào Kiệt] ", priority: 3, hours: 72, level: 25, homes: 5, balo: 3, balo-slots: 45, ah: 8, orders: 5, tu-skin: 5, icon: GOLDEN_HELMET}
  # Rank KHÁC: quyền lợi homes (nhà) · balo · balo-slots (9..54) · ah (món chợ) · orders (đơn /donhang) · spin-faster (% vé vòng quay nhanh hơn,
  # 5..50) · kit (kit Essentials). 0 / "" = không cấp (theo danh phận). Người có nhiều rank lấy mức cao nhất. Cài đặt › Người mới › Quyền lợi theo rank.
  # create: true = plugin tạo nhóm + tiền tố (vd Sứ Giả); false = nhóm có sẵn (ủng hộ, staff), chỉ đụng quyền lợi, giữ tiền tố của họ.
  # card: true = hiện thẻ trong /danhphan (info = yêu cầu đăng ký, contact = bấm vào thì hiện). Cấp rank Sứ Giả: /lp user <tên> parent add media
  # RANK ỦNG HỘ (mua bằng tiền): mọi quyền lợi trên là LỢI THẾ CHƠI → trái luật Mojang (không pay-to-win), để 0.
  other-ranks:
    media:
      create: true
      name: "Sứ Giả"
      prefix: "&c◆ Sứ Giả &r"
      priority: 20
      icon: SPYGLASS
      card: true
      info: ["Livestream TikTok/YouTube về server ít nhất 4 buổi mỗi tuần", "Livestream đều đặn, nội dung lành mạnh",
             "Tương tác và quảng bá server", "Muốn gắn bó lâu dài", "Nội dung: công thành, xây dựng, sinh tồn"]
      contact: "&7Gửi link kênh cho admin: nhắn &f/msg Linh &7trong game hoặc qua Discord/Zalo của server."
      homes: 5
      balo: 5
      balo-slots: 27
      ah: 5
      orders: 5
      tu-skin: 5
      spin-faster: 20
      kit: media
    namtuoc: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 3, spin-faster: 0, kit: ""}
    tutuoc: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 5, spin-faster: 0, kit: ""}
    batuoc: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 8, spin-faster: 0, kit: ""}
    hautuoc: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 12, spin-faster: 0, kit: ""}
    congtuoc: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 20, spin-faster: 0, kit: ""}
    builder: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 0, spin-faster: 0, kit: ""}
    helper: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 0, spin-faster: 0, kit: ""}
    mod: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 0, spin-faster: 0, kit: ""}
    quanly: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 0, spin-faster: 0, kit: ""}
    admin: {homes: 0, balo: 0, balo-slots: 0, ah: 0, orders: 0, tu-skin: 0, spin-faster: 0, kit: ""}

# Balo cá nhân (/balo): số balo và số ô mỗi balo theo danh phận (play-ranks.tiers.*.balo / balo-slots) và rank khác (play-ranks.other-ranks). Không mở khi vừa đánh người (combat-seconds) hay trong vùng vây đang đánh.
backpack:
  enabled: true
  default-slots: 27        # số ô khi người chơi không có quyền duckymomo.balo.o.<N> nào
  combat-seconds: 15
  max: 9

# Chương trình Sứ Giả (/media, 19/10): kiểm soát rank Sứ Giả bằng số liệu. Quyền lợi rank media: play-ranks.other-ranks.media.
# Người chơi: /media dangky <link kênh TikTok/YouTube> → admin duyệt (trang quản trị › Sứ Giả hoặc /media duyet <tên> [ngày]) = rank media CÓ HẠN
# (trial-days), gia hạn /media giahan <tên> [ngày]. Mỗi lần live: /media live [link] → báo cả server; mỗi check-minutes phút server tự kiểm
# người đó ONLINE THẬT (không AFK) + kênh ĐANG LIVE (TikTok: trang api-live không chính thức; YouTube: cần youtube-key, Google Cloud ›
# YouTube Data API v3). Không kiểm được (TikTok chặn/lỗi) thì tính "chưa xác minh" để admin xem link. Chỉ tiêu 7 ngày: min-sessions buổi
# (mỗi buổi ≥ min-session-minutes phút) VÀ min-hours giờ. Thứ 2 chấm tuần trước; thiếu fail-weeks-alert tuần liền → báo admin (không tự gỡ).
media:
  enabled: true
  group: media
  trial-days: 14
  extend-days: 30
  min-sessions: 4
  min-session-minutes: 30
  min-hours: 6
  check-minutes: 5
  tiktok-check: true
  youtube-key: "${CFG_YOUTUBE_KEY}"   # BÍ MẬT: đặt YOUTUBE_KEY=... trong .env (không ghi thẳng vào đây), trống = YouTube tính "chưa xác minh"
  announce-cooldown-minutes: 60   # báo "đang live" cho cả server tối đa 1 lần mỗi ngần này phút / người
  fail-weeks-alert: 2

# Gói tài nguyên theo lựa chọn từng người (/caidat › Font tiếng Việt, 20/10). URL/SHA1 do ./ops/build-font-pack.sh ghi vào .env
# -> compose -> CFG_*. Bật = gói font tiếng Việt + hình vật phẩm; tắt = chỉ hình vật phẩm (font gốc). Không bắt buộc tải.
resource-pack:
  font-url: "${CFG_FONT_PACK_URL}"
  font-sha1: "${CFG_FONT_PACK_SHA1}"
  item-url: "${CFG_ITEM_PACK_URL}"
  item-sha1: "${CFG_ITEM_PACK_SHA1}"
  font-prompt: "&6Tải font tiếng Việt dễ đọc (khoảng 70 KB)? Bấm Có để chữ có dấu rõ hơn. Không thích: /caidat tắt Font tiếng Việt."
  item-prompt: "&6Tải hình vật phẩm riêng của server (khoảng 12 KB)?"

# Menu chính cho người chơi (20/10): /menu hoặc Shift + F. Mỗi nút: slot (0..rows*9-1), icon, name, lore, và MỘT trong:
#   cmd (chạy lệnh thay người chơi, không cần /), suggest (điền sẵn vào ô chat), proxy (lệnh của proxy: tuskin, skin), server (chuyển server).
# Sảnh không có menu này (ở sảnh /menu = chọn chế độ). Không dùng mã chữ đậm: font tiếng Việt bị nhòe.
player-menu:
  enabled: true
  title: "&0✦ Menu Bang Hội Chiến"
  rows: 5
  shift-f: true
  filler: GRAY_STAINED_GLASS_PANE
