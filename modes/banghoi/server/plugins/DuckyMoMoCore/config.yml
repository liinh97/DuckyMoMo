  ngay: 30
  nguoi: [Linh]

# World spawn riêng (24/10): world trống chỉ chứa công trình spawn (đảo Nhật, schematic IQBUILDERS) + các khu dịch vụ; cổng sang world sinh
# tồn. /dmm spawnmoi dan (dán schematic tại paste), /dmm spawnmoi diemxuathien (đặt điểm xuất hiện theo spawn).
spawn-world:
  enabled: false   # 24/10: đảo spawn đã dán vào world chính (main-paste), không cần world "spawn" riêng nữa
  name: spawn
  schematic: japan-spawn-iqbuilders.schem
  paste: {x: 0, y: 80, z: 0}
  spawn: {x: 0.5, y: 100, z: 0.5, yaw: 180}
  # 24/10: spawn mới ĐẶT Ở WORLD CHÍNH (thay spawn cũ, tâm 12699 -2465): /dmm spawnmoi danchinh. Mặt đất quanh y 67, mặt đảo ~ điểm dán - 11.
  main-paste: {x: 12690, y: 79, z: -2429, center-x: 12699, center-z: -2465, clear-radius: 128, clear-from-y: 67}

# Ẩn giáp /angiap (28/10): người khác thấy skin, không thấy giáp (giáp vẫn bảo vệ). Chỉ ẩn ở vòng kinh đô / đất hoà bình / thị trấn
# của chính mình và không đang giao tranh (combat-seconds sau khi đánh / bị người đánh). Lưu người bật: angiap.yml
# Thân nhiệt /nhietdo (28/10): nhiệt môi trường = nhiệt nền của mùa / đợt (seasons ... temperature) + vùng đất + đêm/nắng + ướt
# + giáp da + mái che + lửa/băng gần; thân nhiệt đuổi dần theo. Không chết vì nhiệt: mất máu dừng ở min-health.
body-temp:
  enabled: true
  worlds: [world]
  newbie-hours: 2          # giờ chơi đầu tiên được miễn
  safe-towns: true         # đất thị trấn (cả Kinh Đô): thân nhiệt + ướt giữ nguyên (29/10)
  safe-warp-radius: 48     # trong ngần này khối quanh mỗi warp Essentials cũng vậy (0 = tắt)
  comfort-mid: 22          # nhiệt dễ chịu (mái che kéo về đây)
  cold: 10                 # dưới: lạnh (màn hình băng, chậm, đói nhanh)
  freezing: 2              # dưới: rét cóng (chậm hơn, mất máu)
  hot: 35                  # trên: nóng (yếu sức, đói nhanh)
  scorching: 43            # trên: nóng bỏng (thêm chậm, mất máu)
  damage: 1                # máu mất mỗi damage-every giây khi rét cóng / nóng bỏng
  damage-every: 4
  min-health: 2            # không trừ máu dưới mức này (2 = 1 tim)
  body-rate: 0.004         # thân nhiệt đuổi theo môi trường mỗi giây (0.004 ≈ 4 phút; 28/10 chủ server: chậm thêm nửa)
  accel: 1                 # càng xa mức dễ chịu càng tụt / tăng nhanh: mỗi 10° xa thêm ×(1 + accel); quay về thì tốc độ thường
  biome-scale: 15          # (nhiệt quần xã − 0.8) × số này: tuyết ≈ −12..−20, sa mạc ≈ +18
  night: 6
  sun: 4
  water: 8
  rain-wet: 0.5              # % ướt mỗi giây dầm mưa (không mái / không ô)
  water-wet: 5            # % ướt mỗi giây dưới nước
  dry-rate: 0.25            # % khô mỗi giây
  dry-fire: 1.5              # % khô mỗi giây cạnh lửa
  leather-per-piece: 3
  shelter: 0.5             # dưới mái: kéo 50% về comfort-mid
  source-radius: 3
  heat-source: 18          # lửa / lửa trại / lò đang cháy / dung nham gần
  cold-source: 10          # băng / tuyết gần
  stone-hot: 70            # Đá Ôn Linh hơ cạnh lửa nóng tới
  stone-cold: -10          # ướp cạnh băng lạnh tới
  stone-heat-rate: 0.01    # đá nóng lên / lạnh đi mỗi giây cạnh lửa / băng (0.01 ≈ 2 phút)
  stone-hold-seconds: 300  # đá nguội về nhiệt xung quanh (hằng số thời gian, 5 phút)
  stone-strength: 0.6
  food-warm: 8
  food-cool: 5
  tip-minutes: 5

# Phòng ẩn bot (29/10): bot botfarm đứng trong vùng này thì không ai thấy (tên vẫn ở TAB). Đặt xa mọi warp / spawn > 128 khối
# (tầm theo dõi người chơi) để bot ra / vào phòng thì client tự tạo / xoá. Cần packetevents. Botfarm: /state/wander.json room.
