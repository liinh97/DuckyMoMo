# Vàng (20/10): tiền ủng hộ. Nạp tiền thật -> admin duyệt ở trang quản trị › Donate -> cộng Vàng (ví chung toàn mạng, MariaDB network.vang_vi).
# Người chơi tiêu Vàng: /vang (trong game) hoặc trang tài khoản. KHÔNG chuyển cho nhau, KHÔNG đổi ra xu (luật Mojang: chỉ trang trí).
# Rank ủng hộ tự có trong cửa hàng: giá tiền thật ở donate-ranks ('1 tháng 20k') quy ra Vàng theo ty-gia.
# Panel đọc mục này (tỉ giá, mốc thưởng: Cài đặt › Toàn mạng › Rank donate). Món lẻ: ma (duy nhất), ten, mo-ta, gia (Vàng), ngay (0 = vĩnh viễn),
# nhom, lenh (chạy ở sảnh qua RCON, {player} = tên). Quyền có hạn: "lp user {player} permission settemp <quyền> true <N>d accumulate".
vang:
  ty-gia: 1000             # bao nhiêu đồng = 1 Vàng
  nap-toi-thieu: 10000     # nạp ít nhất (đồng)
  thuong-nap:              # "từ số tiền:% thưởng thêm" (lấy mốc cao nhất đạt được)
    - "200000:10"
    - "500000:20"
  mon:
    - {ma: mu, nhom: "Trang trí", ten: "Đội mũ bất kỳ (/hat)", mo-ta: "Đội khối trên tay lên đầu. 30 ngày", gia: 15, ngay: 30, lenh: ["lp user {player} permission settemp essentials.hat true 30d accumulate"]}
    - {ma: chatmau, nhom: "Tên & chat", ten: "Chat có màu", mo-ta: "Dùng mã màu &a, &e… trong chat. 30 ngày", gia: 15, ngay: 30, lenh: ["lp user {player} permission settemp essentials.chat.color true 30d accumulate"]}
    - {ma: nick, nhom: "Tên & chat", ten: "Đổi biệt danh (/nick)", mo-ta: "Đặt tên hiển thị khác. 30 ngày", gia: 25, ngay: 30, lenh: ["lp user {player} permission settemp essentials.nick true 30d accumulate"]}
    - {ma: nickmau, nhom: "Tên & chat", ten: "Biệt danh có màu", mo-ta: "Đổi biệt danh và tô màu cho nó. 30 ngày", gia: 35, ngay: 30, lenh: ["lp user {player} permission settemp essentials.nick true 30d accumulate", "lp user {player} permission settemp essentials.nick.color true 30d accumulate"]}
    - {ma: hat1, nhom: "Trang trí", ten: "1 hiệu ứng hạt (/pp)", mo-ta: "Hạt bay quanh người, chọn kiểu tuỳ thích. 30 ngày", gia: 30, ngay: 30, lenh: ["lp user {player} permission settemp playerparticles.particles.max.1 true 30d accumulate", "lp user {player} permission settemp playerparticles.effect.* true 30d accumulate", "lp user {player} permission settemp playerparticles.style.* true 30d accumulate"]}
    - {ma: pet_meo, nhom: "Pet trang trí", ten: "Pet mèo (/pet)", mo-ta: "Mèo trang trí đi theo, không đánh nhau. Vĩnh viễn", gia: 40, ngay: 0, lenh: ["lp user {player} permission set pet.type.cat.* true"]}
    - {ma: pet_cho, nhom: "Pet trang trí", ten: "Pet chó (/pet)", mo-ta: "Chó trang trí đi theo, không đánh nhau. Vĩnh viễn", gia: 40, ngay: 0, lenh: ["lp user {player} permission set pet.type.wolf.* true"]}
    - {ma: pet_vet, nhom: "Pet trang trí", ten: "Pet vẹt (/pet)", mo-ta: "Vẹt trang trí đậu vai. Vĩnh viễn", gia: 50, ngay: 0, lenh: ["lp user {player} permission set pet.type.parrot.* true"]}
    - {ma: tuskin10, nhom: "Trang trí", ten: "Tủ skin 10 ô (/tuskin)", mo-ta: "Lưu tới 10 skin để đổi nhanh. 30 ngày", gia: 20, ngay: 30, lenh: ["lp user {player} permission settemp duckymomo.tuskin.10 true 30d accumulate"]}
    - {ma: wb, nhom: "Tiện ích", ten: "Bàn chế tạo mang theo (/wb) · 1 giờ", mo-ta: "Mở bàn chế tạo ở bất cứ đâu. 1 giờ, mua thêm cộng dồn.", gia: 1, gio: 1, lenh: ["lp user {player} permission settemp essentials.workbench true 1h accumulate server=banghoi-1"]}
    - {ma: trash, nhom: "Tiện ích", ten: "Thùng rác (/trash) · 1 giờ", mo-ta: "Vứt đồ không cần. 1 giờ, mua thêm cộng dồn.", gia: 1, gio: 1, lenh: ["lp user {player} permission settemp essentials.disposal true 1h accumulate server=banghoi-1"]}
    - {ma: anvil, nhom: "Tiện ích", ten: "Đe mang theo (/anvil) · 1 giờ", mo-ta: "Mở đe ở bất cứ đâu (vẫn tốn kinh nghiệm). 1 giờ, mua thêm cộng dồn.", gia: 1, gio: 1, lenh: ["lp user {player} permission settemp essentials.anvil true 1h accumulate server=banghoi-1"]}
    - {ma: ec, nhom: "Tiện ích", ten: "Rương Ender mang theo (/ec) · 1 giờ", mo-ta: "Mở rương Ender ở bất cứ đâu; không mở khi vừa đánh người hay trong vùng vây giờ đánh. 1 giờ, mua thêm cộng dồn.", gia: 2, gio: 1, lenh: ["lp user {player} permission settemp essentials.enderchest true 1h accumulate server=banghoi-1"]}
    - {ma: feed, nhom: "Tiện ích", ten: "No bụng (/feed) · 1 giờ", mo-ta: "Đầy thanh đói ngay, 10 phút một lần. 1 giờ, mua thêm cộng dồn.", gia: 2, gio: 1, lenh: ["lp user {player} permission settemp essentials.feed true 1h accumulate server=banghoi-1"]}
    - {ma: fix, nhom: "Tiện ích", ten: "Sửa đồ (/fix) · 1 giờ", mo-ta: "Sửa món đang cầm về đầy độ bền, 1 giờ một lần; không sửa đồ set Thợ Rèn / đồ đặc biệt. 1 giờ, mua thêm cộng dồn.", gia: 3, gio: 1, lenh: ["lp user {player} permission settemp essentials.repair true 1h accumulate server=banghoi-1"]}
    - {ma: bay, nhom: "Tiện ích", ten: "Bay trong thị trấn (/bay) · 1 giờ", mo-ta: "Bay trong đất thị trấn của mình; tự tắt khi ra khỏi thị trấn, giao tranh, công thành. 1 giờ, mua thêm cộng dồn.", gia: 3, gio: 1, lenh: ["lp user {player} permission settemp duckymomo.bay true 1h accumulate server=banghoi-1"]}

# Thư viện đồ: món có tooltip ước tính dài hơn tooltip-max-lines dòng thì tự gộp phù phép (3 cái/dòng) và khối chỉ số của game
# (1 dòng "Khi mặc: +6 Giáp") để không bị đẩy ra ngoài màn hình. Tên, lore, phù phép CE giữ nguyên. 0 = tắt (hiện như game gốc).
# Hành quyết (Execute) của CrazyEnchantments (22/10, CeExecuteTamer.java): CE gốc cho Sức mạnh IV (+520% kiểu 1.8) MỖI đòn trúng.
# Ở đây: chỉ khi kẻ địch còn <= max-hp-percent % máu, và chỉ Sức mạnh cấp amplifier + 1 (0 = Sức mạnh I = +130%). enabled false = để như CE.
ce-execute:
  enabled: true
  max-hp-percent: 30
  amplifier: 0
item-library:
  tooltip-max-lines: 0

