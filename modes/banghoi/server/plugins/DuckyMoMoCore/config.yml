# DuckyMoMoCore ở banghoi-1: trang trí map Trái Đất (cây, cỏ, công trình). Lệnh: /dmm decorate start|pause|status
lobby-menu:
  enabled: false
decorate:
  enabled: true
  world: world
  # Biên cho /dmm structures (và /dmm decorate nếu chạy): vùng mùa 1 Đông Nam Á, trùng viền ChunkyBorder.
  min-x: 11200
  max-x: 13800
  min-z: -3200
  max-z: -800
  tree-density: 1.0
  structure-spacing-chunks: 24   # vùng mùa 1 nhỏ: ~384 block giữa các điểm công trình mặt đất
  structure-chance: 0.7
  exclude: {x: 12699, z: -2465, radius: 190}   # khu spawn Hà Nội: công trình GlassCup x 12599..12799, z -2620..-2310
  # Từ 12/10 map dùng cách B (WorldPainter populate: Minecraft tự trồng cây/cỏ/hoa/động vật khi nạp chunk) nên
  # KHÔNG chạy /dmm decorate nữa. Cấu hình dưới đây chỉ còn để tham khảo (lượt 2 trồng rừng thủ công trên map cũ).
  plants: false
  patch-noise: true
  tick-budget-ms: 15
  max-chunks-loading: 8
  auto-resume: false

# Dọn rác: xoá vật phẩm rơi trên đất + mũi tên cắm đất định kỳ, báo trước trong chat. Dọn ngay: /dmm clean
# Không xoá: vật phẩm rơi chưa đủ min-age-seconds (đồ rơi khi chết còn kịp nhặt), vật phẩm đã đổi tên, đinh ba.
item-cleaner:
  enabled: true
  interval-minutes: 10
  warn-seconds: [60, 30, 10, 5, 3, 2, 1]
  min-age-seconds: 30
  arrows: true
  warn-message: "&c[⚠] &7Dọn vật phẩm dưới đất sau &e{s}s&7."
  done-message: "&c[⚠] &7Đã dọn sạch &e{n} &7vật phẩm!"
  # Giữ đồ rơi khi chết: không dọn đồ trong bán kính death-protect-radius quanh chỗ chết trong death-protect-minutes phút (0 = tắt)
  death-protect-minutes: 10
  death-protect-radius: 8
  # Không dọn trong giờ phiên đánh công thành (theo lịch battle_session_scheduler của SiegeWar)
  pause-during-battle: true
  battle-skip-message: "&7[♻] Đang giờ công thành, bỏ qua lượt dọn rác."
  # Không dọn đồ trong đất thị trấn Towny (cẩn thận: máy farm trong thị trấn có thể để đồ tồn đọng gây lag)
  skip-towns: false
  # Vùng không dọn, mỗi dòng "x1 z1 x2 z2" (mọi world)
  exclude-areas: []

# Chống "đặt rồi phá" lấy tiền nghề (uJobs): block trong danh sách do người chơi đặt, phá lại thì không được tiền.
# Phải khớp các block có tiền ở plugins/UJobs/jobs.yml (miner, lumberjack, digger). Dạng: tên đúng, *_LOG (đuôi), STONE* (đầu).
job-guard:
  enabled: true
  materials: ["*_LOG", "*_STEM", "*_ORE", "ANCIENT_DEBRIS", "STONE", "DEEPSLATE", "NETHERRACK", "BLACKSTONE", "GILDED_BLACKSTONE",
              "BASALT", "SMOOTH_BASALT", "END_STONE", "DIORITE", "ANDESITE", "GRANITE", "TUFF", "CALCITE", "SANDSTONE",
              "AMETHYST_BLOCK", "AMETHYST_CLUSTER", "SAND", "RED_SAND", "GRAVEL", "CLAY", "MUD", "MYCELIUM", "SOUL_SAND", "SOUL_SOIL",
              "DIRT", "GRASS_BLOCK", "PODZOL", "COARSE_DIRT", "ROOTED_DIRT", "MELON", "PUMPKIN"]

# Lọc chat (chung lobby/banghoi/practice, giữ giống nhau ở cả 3 file config.yml): che từ tục bằng ***, chống spam.
#   words-accented: khớp đúng dạng CÓ DẤU (từ mà bỏ dấu sẽ trùng từ thường: lồn/lớn, cặc/các, buồi/buổi, đéo/đeo, đĩ/đi).
#   words-plain: khớp sau khi bỏ dấu (bắt cả kiểu gõ không dấu), chỉ dùng cho từ không trùng từ thường.
#   Quyền duckymomo.chat.bypass (op): không bị chống spam.
chat-filter:
  enabled: true
  words-accented: [lồn, cặc, buồi, đéo, đĩ, đụ, đụ má, đụ mẹ, mẹ mày, má mày, con mẹ mày, óc chó, chó má, thằng chó, con chó,
                   ngu như chó, lìn, cứt]
  words-plain: [dm, dmm, dmmm, dcm, dkm, dcmm, dcmn, dit, dit me, dit ma, djt, vcl, vkl, vcc, vklm, vl, vloz, vlon, clm, clmm, cmm,
                cmn, cmnr, ccmm, dmcs, dmvl, cl, cc, loz, l0n, lon me, cak, cac lon, du ma, du me, ditconme, dcmvl, dmml, fuck,
                fucking, shit, bitch, dick, pussy, motherfucker]
  min-interval-seconds: 1.5
  repeat-seconds: 30
  caps-ratio: 0.7
  too-fast-message: "&cChat chậm lại một chút!"
  repeat-message: "&cĐừng gửi lặp lại cùng một câu!"

# Ranh giới thị trấn Towny trên bản đồ web squaremap (lớp "Thị trấn", màu theo quốc gia, rê chuột xem thông tin)
towny-map:
  enabled: true
  world: world
  interval-seconds: 60
  # Viền mùa vẽ lên bản đồ (minX, minZ, maxX, maxZ), khớp ChunkyBorder/settings.yml (tâm 12500,-2000, bán kính 1300x1200)
  border: [11200, -3200, 13800, -800]
  border-label: "Viền mùa 1"

# Rank donate (tước vị) + thông báo vào/ra server. Giữ GIỐNG NHAU ở lobby/banghoi/practice.
# Nhóm LuckPerms: tools/donate-ranks.cmds (bậc cao kế thừa bậc thấp). CHỈ quyền trang trí (luật Mojang).
# Admin cấp: /rank give <tên> <bậc> <1|3|6|12> (1 tháng = 30 ngày, gia hạn cộng dồn). /rank remove, /rank check.
# prices: giá ĐỀ XUẤT (12/10/2026), sửa theo ý chủ server.
donate-ranks:
  enabled: true
  how-to-buy: "&7Mua rank: nhắn admin qua Discord/Zalo, chuyển khoản ghi &fTÊN NHÂN VẬT + GÓI&7. Admin cấp trong ngày."
  join-message: "&8[&a+&8] {prefix}&f{player}"
  quit-message: "&8[&c-&8] {prefix}&f{player}"
  rank-join-message: "&e✦ {tiercolor}{tier} &f{player} &evừa giá lâm!"
  tiers:
    - group: namtuoc
      name: Nam Tước
      color: "&a"
      perks: [prefix, chat màu, /hat, chào khi vào server]
      prices: [1 tháng 20k, 3 tháng 50k, 6 tháng 90k, 1 năm 160k]
    - group: tutuoc
      name: Tử Tước
      color: "&b"
      perks: [/nick, 1 hiệu ứng hạt (/pp)]
      prices: [1 tháng 40k, 3 tháng 100k, 6 tháng 180k, 1 năm 320k]
    - group: batuoc
      name: Bá Tước
      color: "&9"
      perks: [nick có màu, 2 hiệu ứng hạt, 1 pet (/pet)]
      prices: [1 tháng 70k, 3 tháng 180k, 6 tháng 320k, 1 năm 560k]
    - group: hautuoc
      name: Hầu Tước
      color: "&d"
      perks: [chat đậm/nghiêng, 3 hiệu ứng hạt, pet hiếm]
      prices: [1 tháng 100k, 3 tháng 260k, 6 tháng 460k, 1 năm 800k]
    - group: congtuoc
      name: Công Tước
      color: "&6"
      perks: [chat/nick màu tuỳ chọn (hex), 6 hiệu ứng hạt, mọi pet, chuông khi vào server]
      prices: [1 tháng 150k, 3 tháng 390k, 6 tháng 690k, 1 năm 1.200k]

# Cẩm nang trong game (/huongdan): nội dung plugins/DuckyMoMoCore/huongdan.yml (bản gốc modes/_network/huongdan.yml, chép bằng ./ops/huongdan.sh)
guide:
  default-chapter: banghoi
  join-hint: "&6✦ &fGõ &e/huongdan &fđể xem cách chơi Bang Hội Chiến (bấm vào đây)."

# Đồ / sách phù phép vượt cấp (vd Sắc bén XXX): CHỈ admin tạo bằng /dmm enchant <phù phép> <cấp> (món đang cầm)
# và /dmm sach <phù phép> <cấp> [người]. Đe: ghép sách vượt cấp vào đồ giữ nguyên cấp. Làm phần thưởng / hàng hiếm
# trong game, KHÔNG bán lấy tiền thật (luật Mojang).
over-enchant:
  enabled: true
  max-level: 50

# Dịch chuyển ngẫu nhiên /tpr (alias /rtp, /ngaunhien): menu chọn khu (Java: rương, Bedrock: form) hoặc /tpr <khu>.
# Chỉ thả xuống đất hoang Towny (cách thị trấn >= town-buffer block), không xuống nước/dung nham/ngọn cây, ngoài vùng exclude.
# NPC ở spawn: admin đứng tại chỗ muốn đặt rồi gõ /dmm rtpnpc (đặt lại = xoá cái cũ), xoá: /dmm rtpnpc remove.
# Toạ độ khu: map 1:1000, x = kinh độ x 119,47, z = -vĩ độ x 119,47. radius 0 = cả vùng mùa (border).
rtp:
  enabled: true
  world: world
  cooldown-seconds: 300         # trang Cài đặt sửa được; người có duckymomo.rtp.bypass không phải chờ
  cost: 0                       # phí mỗi lần (0 = miễn phí); duckymomo.rtp.free không mất phí
  max-attempts: 15
  town-buffer: 32
  border: [11200, -3200, 13800, -800]       # viền mùa 1 (tâm 12500/-2000, 1300x1200), thả cách viền >= 16 block
  exclude:
    - [12556, -2623, 12801, -2298]           # khu spawn (công trình GlassCup + vùng WorldGuard spawn)
  blocked-biomes: [ocean, river, beach]
  npc:
    name: "&6&lDịch chuyển ngẫu nhiên"
    lines: ["&7Bấm vào để chọn khu", "&8(PC: chuột phải · Điện thoại: chạm)"]
  zones:
    - { id: taybac,    name: "&aTây Bắc Việt Nam",       icon: MOSSY_COBBLESTONE, center-x: 12365, center-z: -2569, radius: 230, description: "Núi rừng, gần spawn" }
    - { id: lao,       name: "&aLào",                    icon: JUNGLE_SAPLING,    center-x: 12305, center-z: -2330, radius: 230, description: "Rừng núi" }
    - { id: trungbo,   name: "&eTrung Bộ, Tây Nguyên",   icon: COCOA_BEANS,      center-x: 12843, center-z: -1732, radius: 230, description: "Cao nguyên, ven biển miền Trung" }
    - { id: nambo,     name: "&eNam Bộ, Campuchia",      icon: WHEAT,             center-x: 12604, center-z: -1374, radius: 230, description: "Đồng bằng, hợp làm ruộng" }
    - { id: thailan,   name: "&6Thái Lan",               icon: GOLD_BLOCK,        center-x: 12007, center-z: -1792, radius: 230, description: "Đồng bằng sông Chao Phraya" }
    - { id: myanmar,   name: "&6Myanmar",                icon: BAMBOO,            center-x: 11529, center-z: -2389, radius: 230, description: "Xa spawn nhất về phía tây" }
    - { id: namtq,     name: "&cNam Trung Quốc",         icon: RED_SAND,          center-x: 13142, center-z: -2808, radius: 230, description: "Phía bắc vùng mùa" }
    - { id: ngaunhien, name: "&dNgẫu nhiên toàn vùng",   icon: ENDER_PEARL,       center-x: 0,     center-z: 0,     radius: 0,   description: "Bất kỳ đâu trong vùng mùa 1" }

# Luật chiến tranh (docs/banghoi-luat-mua1.md). Trang Cài đặt > Chiến tranh.
# wild-pvp: true (mặc định) = PvP đất hoang như thường, không phụ thuộc lịch công thành; false = ngoài đất thị trấn chỉ đánh được trong vùng vây lúc có phiên.
# Quân hàm trong military-ranks chỉ phong được cho người đã chơi >= min-rank-hours giờ ở server này và không phải tài khoản phụ.
# Tài khoản phụ: /dmm phu add <phụ> <chính> (lưu ở plugins/DuckyMoMoCore/taikhoanphu.yml): không nhận quân hàm, không đánh trận.
pvp-rules:
  enabled: true
  wild-pvp: true
  min-rank-hours: 5
  military-ranks: [guard, private, sergeant, lieutenant, captain, major, colonel, general]
