# Điểm danh hằng ngày (/diemdanh): đếm TỔNG số ngày (bỏ ngày không mất chuỗi). Lưu: diemdanh.yml
# Quà, mỗi dòng một món: xu <số> | do <mã thư viện đồ> [số] | vat <VẬT_LIỆU> [số] | lenh <lệnh, {player}> | manh <loại> <số>

# Gói quà /kit (Kits.java, 20/10): thay kit của Essentials. Sửa trên trang Cài đặt › Người mới › Gói quà.
#   cho: giây chờ trước khi nhận lại (-1 = chỉ một lần, 0 = không chờ). rank: nhóm LuckPerms được nhận (trống = mọi người);
#   nhóm Danh phận (default = Tị Nạn, dan, luongdan, haokiet) chỉ tính bậc HIỆN TẠI, mỗi bậc một gói riêng.
#   qua: dạng Rewards (vat VẬT_LIỆU số, do <mã thư viện> [số], xu <số>, lenh <lệnh {player}>, manh <loại> <số>).
#   lan-dau: gói tự phát khi vào Bang Hội Chiến lần đầu. Rank ủng hộ (mua bằng tiền) KHÔNG được có gói đồ chơi game (luật Mojang).
goi-qua:
  enabled: true
  lan-dau: tinan
  goi:
    tinan:
      ten: '&8Quà tị nạn'
      icon: BREAD
      cho: 259200
      rank:
        - default
      qua:
        - vat BREAD 32
        - vat LEATHER_HELMET 1
        - vat LEATHER_CHESTPLATE 1
        - vat LEATHER_LEGGINGS 1
        - vat LEATHER_BOOTS 1
        - vat STONE_AXE 1
        - vat STONE_PICKAXE 1
    dan:
      ten: '&7Quà Dân'
      icon: WHEAT
      cho: 259200
      rank:
        - dan
      qua:
        - vat BREAD 32
        - vat BONE_MEAL 32
        - vat WHEAT_SEEDS 32
        - vat CARROT 16
        - vat POTATO 16
        - vat TORCH 64
    luongdan:
      ten: '&aQuà Lương Dân'
      icon: IRON_HOE
      cho: 259200
      rank:
        - luongdan
      qua:
        - vat COOKED_BEEF 32
        - vat COAL 32
        - vat TORCH 64
        - vat OAK_LOG 32
        - vat EXPERIENCE_BOTTLE 8
    haokiet:
      ten: '&6Quà Hào Kiệt'
      icon: GOLDEN_HELMET
      cho: 259200
      rank:
        - haokiet
      qua:
        - vat GOLDEN_CARROT 32
        - vat ARROW 64
        - vat GOLDEN_APPLE 2
        - vat ENDER_PEARL 4
        - vat EXPERIENCE_BOTTLE 16
    media:
      ten: '&cQuà Sứ Giả'
      icon: BEACON
      cho: 259200
      rank:
        - media
      qua:
        - vat COOKED_BEEF 32
        - vat FIREWORK_ROCKET 32
        - vat GOLDEN_APPLE 2
        - vat EXPERIENCE_BOTTLE 16
        - vat TORCH 64
        - lenh broadcast &c◆ Sứ Giả &f{player} &7vừa nhận gói quà Sứ Giả!
daily-checkin:
  enabled: true
