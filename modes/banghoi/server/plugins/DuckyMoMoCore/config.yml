# Ủng hộ bằng QR ngay trong game (/rank mua): chọn gói -> panel tạo yêu cầu (chung hàng chờ trang quản trị > Donate) -> QR VietQR vẽ trên tấm bản đồ,
# hết hạn sau minutes phút. Cần PANEL_URL + PANEL_SITE_KEY (compose) và tài khoản ngân hàng trong site/config/site.yml (donate). Thiếu thì chỉ hiện link web.
donate-qr:
  enabled: true
  minutes: 10
  web: "https://app.goc6.io.vn/mc/web/taikhoan.html"

# Pet chiến đấu MyPet (PetCombat): trang Cài đặt > PvP & combat > Pet chiến đấu
pet-fish:
  enabled: true
  daily-exp-cap: 300                   # kinh nghiệm tối đa mỗi người/ngày từ cho pet ăn cá (chống máy câu tự động)
  rarity:                              # food = điểm no (tối đa 100), exp = kinh nghiệm, heal = % máu tối đa hồi lại
    Common: {food: 15, exp: 3, heal: 10}
    Rare: {food: 30, exp: 10, heal: 25}
    Epic: {food: 50, exp: 30, heal: 50}
    Legendary: {food: 100, exp: 100, heal: 100}

pet-capture:
  enabled: true
  chance-percent: 30                   # xác suất bắt mặc định (%) mỗi lần quăng dây xích vào con yếu máu
  attempts-per-mob: 3                  # mỗi con chỉ thử được ngần này lần, hết thì con vật hoảng, không bắt được nữa
  cooldown-seconds: 2                  # chờ giữa 2 lần thử của một người
  charm-bonus: 25                      # Bùa bắt pet (/buabatpet) cầm tay trái: +% mỗi lần thử, mất 1 bùa
  group-chance:                        # riêng từng nhóm loài (mã nhóm trong tools/mypet/sinh-cay-ky-nang.py)
    giasuc: 50
    thuytoc: 40
    cuoi: 35
    xacsong: 35
    thusan: 25
    cungthu: 25
    nhay: 25
    bay: 20
    thulon: 15
    phuthuy: 10
  season-bonus:                        # cộng thêm % bắt trong mùa (mã mùa trong seasons.order, mã nhóm như group-chance)
    mua: {thuytoc: 15, nhay: 10}
    kho: {bay: 10, thusan: 5}

pet-combat:
  enabled: true
  player-damage-reduce-percent: 50   # pet đánh người chơi bị giảm bao nhiêu % sát thương (0 = không giảm, 100 = không đau)
  siege-pet-chance: 30               # % phiên công thành cho pet tham chiến (bốc thăm cố định theo giờ phiên, báo trước)
  seed: mua1                          # đổi chuỗi này là bốc thăm lại toàn bộ lịch
  announce-minutes: [60, 10]          # báo cả server trước phiên (phút)
  siege-no-fly: true                  # lúc có phiên đánh, trong vùng vây: không bay bằng pet (bị đẩy xuống, Rơi chậm)
  siege-no-fly-height: 3              # pet cưỡi cao hơn ngần này khối so với mặt đất thì tính là bay
  siege-weather:                       # lúc có phiên đánh, trong vùng vây: trời đất ảnh hưởng trận, pet có đất diễn
    enabled: true
    pet-range: 24                      # pet phải ở trong ngần này khối quanh chủ mới tính
    night-darkness: true               # đêm: không có pet mắt đêm ở gần thì bị Bóng tối; có thì được Nhìn đêm
    night-pet-bonus: 20                # % sát thương thêm cho pet mắt đêm ban đêm
    night-eyes: [Bat, Phantom, Cat, Ocelot, Fox, Wolf, Spider, CaveSpider, Enderman, Endermite, Vex, Warden]
    rain-slowness: true                # mưa: người đi bộ bị Chậm (cưỡi pet thì không)
    rain-water-bonus: 20               # % sát thương thêm cho pet nước khi mưa
    rain-fire-malus: 25                # % sát thương bị giảm của pet lửa khi mưa
    water-pets: [Axolotl, Cod, Salmon, Pufferfish, TropicalFish, Squid, GlowSquid, Dolphin, Guardian, ElderGuardian, Tadpole, Frog, Turtle, Drowned]
    heat-season: kho                   # mùa nắng gắt (ban ngày, không mưa)
    heat-hunger: true                  # nắng gắt: ai không dẫn pet lửa thì bị Đói
    heat-bonus: 15                     # % sát thương thêm cho pet lửa lúc nắng gắt
    fire-pets: [Blaze, MagmaCube, Strider, WitherSkeleton, Hoglin, Zoglin, Piglin, PiglinBrute, ZombifiedPiglin, Ghast]

# Đấu Trường /dautruong (Arena): trang Cài đặt > PvP & combat > Đấu Trường
arena:
  enabled: true
  world: dautruong                  # thế giới trống riêng, plugin tự tạo; dán map bằng WorldEdit
  countdown-seconds: 5
  fight-seconds: 180                # hết giờ: đội còn nhiều % máu hơn thắng
  pet-damage-reduce-percent: 50     # trong sân: pet đánh người bị giảm bao nhiêu %
  fee-percent: 5                    # server thu % tổng tiền cược
  max-stake: 10000
  win-reward: 50                    # thưởng mỗi trận thắng (không tính giao hữu cùng IP)
  daily-reward-cap: 5               # số trận được thưởng mỗi ngày
  pet-exp-win: 30                     # kinh nghiệm cho pet đang dẫn khi thắng (chung giới hạn trận thưởng/ngày)
  elo-k: 32

# Tiêu đề khung nhắc lúc vào game (gom hướng dẫn, mùa, công thành, điểm danh… thành một khung)
join-notes-title: "Bang Hội Chiến"
