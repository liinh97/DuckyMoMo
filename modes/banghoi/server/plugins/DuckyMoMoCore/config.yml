  remind-on-join: true
  broadcast-milestone: true
  cycle-days: 30              # mốc lặp lại sau mỗi 30 lần điểm danh (0 = không lặp)
  daily-rewards:
    - xu 150
    - do chia_khoa_diemdanh 1
    - do phieu_dd 1           # 29/10: Phiếu Chuyên Cần, đổi set Chuyên Cần ở Thợ Rèn
