  items:
    - {material: LANTERN, amount: 8, price: 40}
    - {material: SEA_LANTERN, amount: 8, price: 80}
    - {material: GLOWSTONE, amount: 16, price: 60}
    - {material: PRISMARINE_BRICKS, amount: 32, price: 60}
    - {material: PURPUR_BLOCK, amount: 32, price: 80}
    - {material: WHITE_GLAZED_TERRACOTTA, amount: 16, price: 40}
