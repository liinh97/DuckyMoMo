# Cẩm nang trong game (/huongdan, /hd). Sửa trên trang Cài đặt > "Cẩm nang game" (tự chép, có hiệu lực ngay), hoặc sửa file này rồi chạy ./ops/huongdan.sh (chép sang lobby, banghoi, practice,
# có hiệu lực ngay, không cần khởi động lại). Plugin: DuckyMoMoCore (Guide.java).
# - Mỗi trang sách khoảng 12 dòng x 19 ký tự (dòng cuối tự thêm "« Mục lục"). Xuống dòng bằng \n hoặc khối "|-".
# - Mã màu: &0 đen, &1 xanh đậm, &2 xanh lá đậm, &4 đỏ đậm, &5 tím, &6 vàng cam, &8 xám, &l đậm, &r bỏ định dạng.
#   Nền sách màu giấy: tránh &e/&f/&a (khó đọc).
# - Người chơi điện thoại (Bedrock) thấy cả chương trong một bảng.
# - SỐ LIỆU (phí thị trấn, lịch công thành, giá...) ghi tay: đổi trên trang Cài đặt thì sửa luôn ở đây.
title: "&6Cẩm nang DuckyMoMo"
author: "DuckyMoMo"
toc-title: "&6&lCẨM NANG\n&8DuckyMoMo Network\n&8/huongdan để mở lại\n\n"
toc-footer: "\n&8Bấm tên chương\n&8để mở."

chapters:
  - id: batdau
    name: Bắt đầu
    pages:
      - |-
        &6&lChào mừng!
        &0DuckyMoMo có nhiều
        chế độ chơi, vào từ
        &lsảnh&r&0 (đảo hoa anh
        đào).

        &1Lần đầu vào:
        &0/register <mk> <mk>
        &1Lần sau:
        &0/login <mk>
      - |-
        &6&lChọn chế độ
        &0Bấm &lla bàn&r&0 trên tay
        hoặc gõ &1/menu&0.

        &0Đổi chế độ bất cứ
        lúc nào:
        &1/server lobby
        &1/server banghoi-1
        &1/server practice-1
      - |-
        &6&lLệnh chung
        &1/msg <tên> <tin>
        &0nhắn riêng
        &1/r <tin> &0trả lời
        &1/huongdan &0cẩm nang
        &1/rank &0rank donate
        &1/changepassword
        &0đổi mật khẩu

        &0Điện thoại: bấm la
        bàn hiện bảng nút.
  - id: luat
    name: Luật server
    pages:
      - |-
        &4&lLUẬT
        &01. Không hack, không
        x-ray, không auto-
        click.
        2. Không chửi bới,
        quấy rối, phân biệt.
        Từ tục bị che &8***&0.
        3. Không spam, không
        quảng cáo server
        khác.
      - |-
        &4&lLUẬT (tiếp)
        &04. Không lợi dụng
        lỗi game: thấy lỗi
        thì báo admin.
        5. Đánh nhau theo luật
        công thành. Thoát
        game khi đang đánh
        = chết, rơi đồ.

        &8Vi phạm: mute, kick,
        &8ban tuỳ mức độ.
      - |-
        &4&lLUẬT (tiếp)
        &06. Map là Trái Đất
        nhưng lãnh thổ trong
        game &lkhông&r&0 liên quan
        chủ quyền thật. Cấm
        tên, chat kích động
        biên giới, biển đảo,
        dân tộc.
        7. Tối đa 2 tài khoản.
        Acc phụ phải khai với
        admin, không được
        đánh trận.
  - id: banghoi
    name: Bang Hội Chiến
    pages:
      - |-
        &6&lBANG HỘI CHIẾN
        &0Lập thị trấn, gom
        thành quốc gia, chiếm
        đất và &lcông thành&r&0
        nước khác.

        &0Bản đồ là &lTrái Đất
        &l1:1000&r&0. Mùa 1: &lĐông
        &lNam Á&r&0 (có viền,
        hết mùa mở vùng mới).
      - |-
        &6&lMới vào
        &0Có &l15 phút&r&0 bảo vệ:
        không ai đánh được.
        &1/newbie disable &0tắt
        sớm.

        &1/warp &0đi địa danh
        (Hà Nội, Sài Gòn,
        Bangkok...)
        &1/sethome &0đặt nhà
        &1/home &0về nhà
      - |-
        &6&lMới vào (tiếp)
        &1/spawn &0về spawn
        &1/tpa <tên> &0xin tới
        chỗ bạn
        &1/tpaccept &0đồng ý

        &0Khu spawn an toàn:
        không PvP, không phá.
        Bảng bên phải: tiền,
        thị trấn. &1/sb &0ẩn.
      - |-
        &6&lĐi tìm đất
        &0Muốn lập thị trấn xa
        spawn? Bấm &lNPC dân
        &llàng&r&0 ở spawn hoặc gõ
        &1/tpr&0, chọn khu (Tây
        Bắc, Lào, Thái Lan...).

        &0Được đưa tới đất hoang
        ngẫu nhiên trong khu.
        &1/tpr <khu> &0đi thẳng.
        &8Có thời gian chờ giữa
        &8hai lần dùng.
      - |-
        &6&lGiờ chơi thật
        &1/hoatdong &0xem giờ.
        &0Chỉ tính lúc bạn thật
        sự chơi, đứng AFK
        không tính.
        &03 giờ: lập thị trấn.
        &05 giờ: nhận quân hàm.
        &0Chơi 3 giờ/tuần mới
        là &ldân hoạt động&r&0,
        thị trấn mới được
        thêm đất nhờ bạn.
      - |-
        &2&lLiên minh Hoà Bình
        &0Thị trấn trong liên
        minh không bị vây,
        không bị chiếm, đất
        luôn tắt PvP.
        &0Đổi lại: không quân
        hàm, không đánh trận,
        chỉ được tự vệ.
        &1/hoabinh &0xem thêm.
        &8Chợ &1/ah &8chỉ mở trong
        &8đất hoà bình.
      - |-
        &2&lHoà bình (tiếp)
        &0Thị trấn phải chạm
        đất liên minh mới vào
        được. Vào chờ 2 ngày.
        &0Rời: mất ngay, 14
        ngày mới vào lại.
        &0Có công thành gần nhà
        sẽ báo trước: hãy di
        tản khỏi vùng vây.
        &8Bán đồ ở kinh đô
        &8được thêm 20%.
      - |-
        &5&lDungeon & Boss
        &0Dungeon: nơi cày đồ,
        cày tiền, đi theo
        nhóm. Gõ &1/em&0.
        &0Sắp có sự kiện &l"Trái
        &lĐất lâm nguy"&r&0: boss
        xuất hiện, các bang
        hội chung tay đánh,
        chia thưởng theo
        công sức.
      - |-
        &4&lHội Bàn Tròn
        &0Giết dân hoà bình
        trong/gần đất hoà
        bình = vụ án: bồi
        thường, cấm vào đất
        hoà bình và cấm công
        thành tới khi xử.
        &0Thủ lĩnh các quốc gia
        mạnh nhất họp tại
        chỗ để xử. &1/bantron
      - |-
        &6&lBảng xếp hạng
        &1/bxh&0: Bá Chủ (quốc
        gia), Chiến Thần, Đại
        Phú Hộ, Kiến Trúc Sư.
        &0Thưởng là &ldanh hiệu
        &r&0giữ mãi: &1/danhhieu
        &0NPC cửa hàng ở spawn
        bán vật liệu, đồ trang
        trí, danh hiệu bằng xu.
        &8Không bán sức mạnh.
      - |-
        &6&lChơi lại từ đầu
        &1/choilai&0: mất hết đồ,
        tiền, nhà, nghề, thị
        trấn. Giữ rank, danh
        hiệu, án phạt.
        &07 ngày/lần, 3 lần/mùa.
        &0Quà tân thủ chỉ lần
        đầu. Dỡ shop rương,
        rút hàng &1/ah &0trước.
        &8Tối đa 2 tài khoản:
        &8khai bằng &1/taikhoanphu
      - |-
        &6&lKiếm tiền
        &0Bắt đầu với &l200 xu&r&0.

        &2Nghề (tự động):
        &0đào quặng, chặt cây,
        săn quái, trồng, câu
        cá đều có tiền.
        &1/jobs &0xem cấp nghề.
        &8Phá lại block tự đặt
        &8không có tiền.
      - |-
        &6&lBán đồ
        &1/sell hand &0bán đồ
        đang cầm
        &1/sell all &0bán hết
        &1/worth &0xem giá

        &0Biển &l[Sell]&r&0 ở spawn:
        bấm để bán.
        &8Đá cuội, đất, cát
        &8không bán được.
      - |-
        &6&lBuôn bán
        &2Cửa hàng rương:
        &0cầm đồ, bấm trái vào
        rương, gõ giá.
        &2Chợ đấu giá:
        &1/ah &0xem, &1/ah sell
        &1<giá> &0bán đồ đang
        cầm (tối đa 5 món).
        &2Đổi trực tiếp:
        &1/trade <tên>
      - |-
        &6&lPhù phép hiếm
        &0Có phù phép mới, chỉ
        tìm được sách trong
        &lrương công trình&r&0,
        khi &lcâu cá&r&0 hoặc đổi
        với &ldân làng&r&0:
        &2Telepathy, Smelting,
        &2Tunnelling (đào 3x3),
        &2Replanting, Volley...
        &0Ghép bằng &lđe&r&0. Hiếm
        nên bán được giá cao!
      - |-
        &6&lShop phù phép /ce
        &0Mua sách phù phép
        lạ: &2Thường 300 xu&0,
        &1Hiếm 800 xu&0. Kéo sách
        thả vào đồ để ghép.
        &4Sách ghi tỉ lệ thành
        &4công và tỉ lệ vỡ đồ!
        &0Cuộn &lgiấy trắng&r&0 giữ
        đồ khi ghép hỏng.
        &1/blacksmith &0gộp sách
        &1/ce info &0xem công dụng
      - |-
        &6&lThị trấn
        &1/t new <tên>
        &0lập thị trấn (&l500
        &lxu&r&0), nhà bạn được
        bảo vệ.
        &1/t claim &0mua thêm ô
        đất 16x16 (&l25 xu&r&0)
        &1/t add <tên> &0mời dân
        &1/t deposit <tiền>
        &0nộp quỹ thị trấn
      - |-
        &6&lThị trấn (tiếp)
        &0Phí duy trì &l10 xu
        &lmỗi ngày&r&0, trừ vào
        quỹ. Hết quỹ thì
        thị trấn tan!
        &1/t spawn &0về thị trấn
        &1/t &0thông tin
        &1/res &0thông tin bạn
        &1/plot claim &0nhận lô
        đất trong thị trấn
      - |-
        &6&lQuốc gia
        &0Gom nhiều thị trấn:
        &1/n new <tên>
        &0(&l1000 xu&r&0, thị trấn
        bạn là thủ đô)
        &1/n add <thị trấn>
        &1/n ally add <nước>
        &0kết đồng minh
        &0Phí &l100 xu/ngày&r&0.
        &4Chỉ quốc gia mới
        &4công thành được.
      - |-
        &6&lCông thành (1)
        &0Muốn đánh thị trấn
        địch: cắm &lbanner màu
        &0(không trắng) sát rìa
        thị trấn đó.

        &0Quốc gia trả &lquỹ
        &lchiến tranh&r&0 20 xu
        mỗi ô đất của thị
        trấn bị vây.
      - |-
        &6&lCông thành (2)
        &0Đánh theo &lphiên&r&0:
        &lTối thứ 7 và CN
        &l20:00 và 21:00
        &0(mỗi phiên 1 giờ,
        4 phiên mỗi cuộc vây).
        Trong phiên, quanh cờ
        bật PvP.
        &1/sw &0xem cuộc vây.
      - |-
        &6&lCông thành (3)
        &0Ghi điểm: giữ khu
        vực quanh cờ và hạ
        lính địch.
        Hết các phiên, bên
        nhiều điểm thắng:
        lấy quỹ, cướp tiền
        hoặc chiếm thị trấn.
        &2Chết trong vùng vây
        &2không rơi đồ.
      - |-
        &6&lCông thành (4)
        &0Thị trấn vừa bị vây
        được &lmiễn vây 7 ngày
        &0(thủ đô 14 ngày),
        thị trấn mới lập cũng
        được 7 ngày.
        Thị trấn không bị
        phá hay trộm khi chủ
        offline.
      - |-
        &6&lĐánh nhau
        &0Bị đánh thì bị &lgắn
        &lcờ giao tranh&r&0 15
        giây: &4thoát game lúc
        &4này là chết, rơi đồ.
        &0Đang giao tranh không
        dịch chuyển được.
        &0Combat kiểu &l1.8&r&0:
        bấm nhanh, không hồi
        chiêu.
      - |-
        &6&lMẹo
        &0Đồ rơi dưới đất bị
        &ldọn mỗi 10 phút&r&0
        (có báo trước).
        &0Đồ đổi tên bằng đe
        không bị dọn.
        &0Có &lbản đồ web&r&0 của
        cả vùng mùa 1, xem
        ranh giới thị trấn.
  - id: practice
    name: Practice (luyện PvP)
    pages:
      - |-
        &6&lPRACTICE
        &0Đấu 1v1 với bộ đồ có
        sẵn, không mất đồ.
        Combat kiểu &l1.8&r&0.

        &2Bộ đồ: &0NoDebuff,
        Gapple, Classic,
        Archer, Boxing, Combo,
        Sumo.
      - |-
        &6&lTìm trận
        &1/queue &0vào hàng chờ,
        tự ghép người
        &1/queue leave &0rời

        &1/duel <tên> &0thách
        đấu bạn bè
        &1/duel accept <tên>
        &1/duel deny <tên>
      - |-
        &6&lKhác
        &1/spectate <tên>
        &0xem người khác đấu
        &1/duel stats &0thành
        tích của bạn
        &1/duel top &0bảng xếp
        hạng
        &1/kit edit <bộ> &0sắp
        lại vị trí đồ
  - id: rank
    name: Rank donate
    pages:
      - |-
        &6&lRANK DONATE
        &0Ủng hộ server, nhận
        &ltước vị&r&0: chỉ để
        &ltrang trí&r&0, không
        mua được lợi thế.

        &2Nam Tước &1Tử Tước
        &1Bá Tước &5Hầu Tước
        &6&lCông Tước
      - |-
        &6&lQuyền lợi
        &0prefix màu, chat
        màu, &1/hat&0, &1/nick&0,
        hiệu ứng hạt &1/pp&0,
        pet &1/pet&0 (không cưỡi
        được), chào khi vào
        server.

        &1/rank &0xem giá, quyền
        lợi từng bậc, cách mua.
      - |-
        &2&lVOTE MIỄN PHÍ
        &0Ủng hộ server mà
        không tốn tiền: gõ
        &1/vote&0, bấm link,
        nhập đúng tên.
        &0Mỗi lượt &6100 xu&0,
        7 ngày liền thêm
        &6500 xu&0, mỗi 30
        lượt cả server có
        &dVote Party&0.
      - |-
        &2&lĐIỂM DANH
        &0Mỗi ngày gõ
        &1/diemdanh &0(online
        đủ 5 phút) nhận xu.
        &0Đủ &67, 14, 30 ngày
        &0có quà mốc. Bỏ một
        ngày &lkhông mất&r&0 chuỗi.
        &1/diemdanh xem &0xem
        tiến độ.
      - |-
        &2&lNHIỆM VỤ NGÀY
        &0Gõ &1/nhiemvu&0: mỗi
        ngày 3 nhiệm vụ
        (đào, chặt, săn, xây,
        câu, thu hoạch).
        &0Xong mỗi cái nhận
        xu, xong hết &6thêm
        &6thưởng&0. Đổi lúc 0h.
        &8Khối tự đặt rồi phá
        &8không được tính.
      - |-
        &6&lVÒNG QUAY
        &0Chơi thật mỗi &l60
        &lphút&r&0 được 1 vé
        (treo máy không tính,
        giữ tối đa 5 vé).
        &1/vongquay &0để quay,
        menu ghi rõ &ltỉ lệ
        &ltừng món&r&0. Vé miễn
        phí, không bán.
      - |-
        &2&lMÙA MƯA, MÙA KHÔ
        &0Mỗi mùa &l7 ngày&r&0,
        xen kẽ nhau. &1/mua
        &0xem còn mấy ngày.
        &3☔ Mưa&0: lúa, mía,
        tre lớn nhanh.
        &6☀ Khô&0: khoai, cà
        rốt, dưa, bí lớn
        nhanh, ít mưa.
        &0Đúng mùa gặt cây
        chín còn &lrơi thêm&r&0.
      - |-
        &2&lSÀN THU MUA
        &0Cần nhiều gỗ, đá…?
        Cầm 1 món làm mẫu,
        &1/donhang tao 1000 1
        &0(1000 món, 1 xu/món).
        Tiền được giữ trước.
        &0Người khác &1/donhang
        &0bấm đơn để giao,
        nhận tiền ngay.
        &1/donhang cuatoi &0nhận
        hàng hoặc huỷ đơn.
      - |-
        &8&lXƯỞNG & TREO THƯỞNG
        &1/xuong &0chế đồ đặc
        biệt dùng 7 ngày: Túi
        Hư, xô nước vô tận,
        dây hút đồ, cung máu.
        &1/treothuong &0treo
        tiền lên đầu người
        khác, ai hạ được là
        nhận. &1/khaihoang
        &0góp quỹ mở vùng
        đất mới.
      - |-
        &3&lCÂU CÁ
        &0Có &l24 loại cá Việt
        &0(cá linh, cá lóc,
        cá kèo, cá anh vũ…),
        nhiều con &lchỉ có
        &ltheo mùa&r&0. Cá biển
        câu ở biển.
        &1/emf &0menu câu cá,
        &1/emf shop &0bán cá.
        &0Thi câu &lT7, CN
        &l20h&r&0, có thưởng xu.
      - |-
        &5&lMẢNH SỰ KIỆN
        &0Sự kiện, boss, mốc
        điểm danh… cho &5mảnh
        &5sự kiện&0 (đồ thật,
        trao đổi được).
        &1/doimanh &0đổi mảnh
        lấy quà. Mỗi sự kiện
        có &lhạn đổi&r&0, nhớ
        đổi trước khi hết.
  - id: pokemon
    name: Pokémon (sắp mở)
    pages:
      - |-
        &6&lPOKÉMON
        &0Bắt, nuôi và đấu
        Pokémon. Cần cài
        modpack riêng.

        &8Chế độ này chưa mở.
        &8Theo dõi thông báo
        &8trên server.
  - id: hotro
    name: Cần giúp đỡ
    pages:
      - |-
        &6&lCẦN GIÚP?
