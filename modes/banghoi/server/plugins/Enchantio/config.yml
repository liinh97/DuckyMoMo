# Enchantio (Bang Hội Chiến, 12/10/2026): phù phép mới kiểu gốc, làm hàng đổi bán (/ah, /trade, cửa hàng rương).
# - KHÔNG ra từ bàn phù phép: chỉ rương công trình, câu cá, dân làng (#tradeable #on_random_loot #treasure) -> sách hiếm, có giá.
# - TẮT (phá luật chiến tranh): soulbound (giữ đồ khi chết), homecoming (vật tổ -> về nhà, trốn trận),
#   cloaking (ngồi yên tàng hình, phục kích), ward (tự đỡ đòn).
# - Giới hạn: executioner tối đa cấp 2, volley tối đa cấp 2; tunnelling chỉ đào đá tự nhiên + quặng (không gạch/bê tông).
# - Đổi danh sách phù phép (registry) phải KHỞI ĐỘNG LẠI server, không reload được.
