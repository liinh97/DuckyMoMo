# Configuration for the confirmation Sell GUI, shown when /emf shop is used, after clicking a sell button.

title: <#006F86>Câu cá - Bán cá (xác nhận)
layout:
- iiiiiiiii
- iiiiiiiii
- iiiiiiiii
- '   s a   '
filler: light_blue_stained_glass_pane
# The character to use for the slots where players can place fish.
deposit-character: i

sell-item:
  item:
    material: GOLD_INGOT
    displayname: <gold>Xác nhận bán
    lore:
    - <dark_gray>Cửa hàng cá
    - ''
    - <gray>Bán cá ở đây để
    - <gray>kiếm thêm tiền.
    - ''
    - <yellow>» (Chuột trái) bán cá.
    - <gray>» (Chuột phải) huỷ.
  character: s
  click-action:
    left: sell-shop-confirm
    right: full-exit

sell-all-item:
  item:
    material: COD_BUCKET
    displayname: <gold>Xác nhận bán hết
    lore:
    - <dark_gray>Túi đồ
    - ''
    - <gray>Bấm nút này để bán
    - <gray>cá trong túi đồ để
    - <gray>kiếm thêm tiền.
    - ''
    - <yellow>» (Chuột trái) bán cá.
    - <gray>» (Chuột phải) huỷ.
  character: a
  click-action:
    left: sell-inventory-confirm
    right: full-exit

# ATTENTION ATTENTION ATTENTION
# DO NOT EDIT THIS VALUE OR THINGS WILL BREAK!!!
version: 1
