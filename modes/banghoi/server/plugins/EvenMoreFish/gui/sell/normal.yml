# Configuration for the normal Sell GUI, shown when /emf shop is used, before clicking a sell button.

title: <#006F86>Câu cá - Bán cá
layout:
- iiiiiiiii
- iiiiiiiii
- iiiiiiiii
- '   s a   '
filler: light_blue_stained_glass_pane
# The character to use for the slots where players can place fish.
deposit-character: i

sell-item:
  item:
    material: GOLD_INGOT
    displayname: <bold><gold>Bán
    lore:
    - <dark_gray>Cửa hàng cá
    - ''
    - <gray>Bấm nút này để bán hết
    - <gray>cá trong menu cửa hàng.
    - ''
    - <yellow>» (Chuột trái) bán cá.
    - <gray>» (Chuột phải) huỷ.
  character: s
  click-action:
    left: sell-shop
    right: full-exit

sell-all-item:
  item:
    material: COD_BUCKET
    displayname: <bold><gold>Bán hết
    lore:
    - <dark_gray>Túi đồ
    - ''
    - <gray>Bấm nút này để bán hết
    - <gray>cá trong túi đồ.
    - ''
    - <yellow>» (Chuột trái) bán cá.
    - <gray>» (Chuột phải) huỷ.
  character: a
  click-action:
    left: sell-inventory
    right: full-exit

# ATTENTION ATTENTION ATTENTION
# DO NOT EDIT THIS VALUE OR THINGS WILL BREAK!!!
version: 1
