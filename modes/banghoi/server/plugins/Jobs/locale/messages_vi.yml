      info: Change the player exp for job.
      args: '[playername] [jobname] set/add/take [amount](rand_[min]-[max]) (-s) (-sa)'
    error:
      nojob: '&cThis player must first join a job.'
    output:
      target: '&eYour exp was changed for %jobfullname% &eand now you at &6%level%lvl &eand with &6%exp%exp.'
  level:
    help:
      info: Change the player's level in a job.
      args: '[playername] [jobname] set/add/take [amount]'
    error:
      nojob: '&cThis player must first join a job.'
    output:
      target: '&eYour level was changed for %jobfullname% &eand now you at &6%level%lvl &eand with &6%exp%exp.'
  demote:
    help:
      info: Demote the player X levels in a job.
      args: '[playername] [jobname] [levels]'
    output:
      target: You have been demoted %levelslost% levels in %jobfullname%.
  deluser:
    help:
      info: Delete a player from the jobs database.
      args: '[playername]'
    output:
      target: You have been removed from the jobs database.
    confirmationNeed: '&cAre you sure you want to delete &e[playername]&c from the database? This cannot be reversed! Type the command again within&6 [time] seconds &cto confirm!'
  grantxp:
    help:
      info: Grants the player X experience in a job.
      args: '[playername] [jobname] [xp]'
    output:
      target: You have been granted %xpgained% experience in %jobfullname%.
  removexp:
    help:
      info: Remove X experience from the player in a job.
      args: '[playername] [jobname] [xp]'
    output:
      target: You have lost %xplost% experience in %jobfullname%.
  signupdate:
    help:
      info: Manually updates a sign by its name
      args: '[jobname]'
  bp:
    help:
      info: Shows block protections around you in 10 block radius
      args: ''
    output:
      found: '&eFound &6%amount% &eprotected blocks around you'
      notFound: '&eNo protected blocks found around you'
  reload:
    help:
      info: Reload configurations.
  toggle:
    help:
      info: Bật/tắt dòng báo tiền nghề trên thanh hành động hoặc thanh trên cùng.
      args: actionbar/bossbar
    output:
      turnedoff: '&4This feature is turned off!'
      paid:
        main: '&aBạn nhận được:'
        money: '&e[amount] xu'
        exp: '&7[exp] kinh nghiệm nghề'
        points: '&6[points] points'
        ACmoney: '&e+[amount] xu '
        ACexp: '&7+[exp] kn '
        ACpoints: ''
      Rapid: '&7[type]&a: &7Rapid'
      Batched: '&7[type]&a: &fBatched'
      'Off': '&7[type]&a: &6Off'
  howmuch:
    help:
      info: Check potential payment by target entity or block
      args: ''
  version:
    output:
      payment: '&e[job] &f[action] &7[target] [exp] [money] [points]'
      nopayment: '&7Can''t find any payments ([target])'
      jobsVersion: '&eJobs: &6[version]'
      jobsVersionNew: '&e-> [newVersion]'
      dbType: ' &7[db]'
      newServer: '&eServer: &6[version]'
      Economy: '&eEconomy: &6[provider] '
      newVault: '&eVault: &6[version] '
      CMILib: '&eCMILib: &6[version] '
      cmilVersionNew: '&e-> [newVersion]'
    help:
      info: Plugin version information
      args: ''
  limit:
    help:
      info: Shows payment limits for jobs
      args: '[playername]'
    output:
      moneytime: '{gcp}Time left until money limit resets: {gcs}[time]'
      moneyLimit: '{gcp}Money limit: {gcs}[current]{gcp}/{gcs}[total]'
      exptime: '{gcp}Time left until Exp limit resets: {gcs}[time]'
      expLimit: '{gcp}Exp limit: {gcs}[current]{gcp}/{gcs}[total]'
      pointstime: '{gcp}Time left until Point limit resets: {gcs}[time]'
      pointsLimit: '{gcp}Point limit: {gcs}[current]{gcp}/{gcs}[total]'
      reachedmoneylimit: '{gcw}Bạn đã chạm giới hạn tiền nghề trong khoảng này!'
      reachedmoneylimit2: '{gcp}You can check your limit with {gcs}/jobs limit {gcp}command'
      reachedmoneylimit3: '{gcp}Money earned is now reduced exponentially... But you still earn a little!'
      reachedexplimit: '{gcw}You have reached exp limit in given time!'
      reachedexplimit2: '{gcp}You can check your limit with {gcs}/jobs limit {gcp}command'
      reachedpointslimit: '{gcw}You have reached point limit in given time!'
      reachedpointslimit2: '{gcp}You can check your limit with {gcs}/jobs limit {gcp}command'
      notenabled: '{gcp}Money limit is not enabled'
  resetexploreregion:
    help:
      info: Resets region data of Explorering
      args: world [worldname]
    output:
      notenabled: '{gcp}Not enabled.'
      invalidname: '{gcp}Invalid world name'
      reseted: '{gcp}Exploring region data has been reset for: {gcs}[worldname]'
  resetlimit:
    help:
      info: Resets a player's payment limits
      args: '[playername]'
    output:
      reseted: '{gcp}Payment limits have been reset for: {gcs}[playerdisplayname]'
  resetquest:
    help:
      info: Resets a player's quest
      args: '[playername] [jobname]'
    output:
      reseted: '{gcp}Quest has been reset for: {gcs}[playerdisplayname]'
      noQuests: '{gcp}Can''t find any quests'
  resetquesttotal:
    help:
      info: Resets a player's done quest counter
      args: '[playername]/all'
    output:
      reseted: '{gcp}Done quests have been reset for: {gcs}[playerdisplayname]'
  skipquest:
    help:
      info: Skip defined quest and get new one
      args: '[jobname] [questname] (playerName)'
    confirmationNeed: '{gcw}Are you sure you want to skip {gcs}[questName] {gcw}quest? Type the command again within {gcs}[time] seconds {gcw}to confirm!'
    output:
      questSkipForCost: '{gcp}You skipped the quest and paid: {gcs}[amount]'
