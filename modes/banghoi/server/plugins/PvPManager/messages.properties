# You can customize these messages to your language, change colors, etc
# You can disable any message by deleting everything after the equals (=)
# Example: Newbie_Protection = (leave this empty)
# You may also use Hex color codes such as &#FFFFFF in MC 1.16+
# There are some variables you can use in this file that work in all messages
# such as {prefix} and some that only work where they make sense such as {player}, {time} and {money}
#
# You can prefix any message with !actionbar or !chat to control where it appears
# - !actionbar = Message shows above hotbar (recommended for frequent spam messages)
# - !chat = Message shows in chat (default if no prefix)
# Example: Item_Cooldown = !actionbar {prefix} &cYou can't use this yet! Available in &e{time}

Prefix = &#992222&lPvP &#FF5555\u27a4

# PvP Toggle
PvP_Disabled = {prefix} &a\u0110\u00e3 t\u1eaft PvP! B\u1ea1n \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7
PvP_Enabled = {prefix} &c\u0110\u00e3 b\u1eadt PvP! B\u1ea1n c\u00f3 th\u1ec3 \u0111\u00e1nh v\u00e0 b\u1ecb \u0111\u00e1nh
Attack_Denied_You = !actionbar {prefix} &#c9453eB\u1ea1n \u0111ang \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 PvP!
Attack_Denied_Other = !actionbar {prefix} &f{player} &#c9453e\u0111ang \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 PvP!
PvP_Force_Enabled_WorldGuard = {prefix} &6Khu n\u00e0y b\u1eadt PvP, b\u1ea3o v\u1ec7 PvP c\u1ee7a b\u1ea1n b\u1ecb t\u1eaft
PvP_Disabled_Fee = {prefix} &aYou paid a &#FFD700{money} &afee for having PvP disabled
PvP_Disabled_Fee_Not_Enough = {prefix} &6PvP protection disabled - insufficient funds for the fee

# Combat Tag
Tagged_Attacker = {prefix} &7B\u1ea1n \u0111\u00e3 \u0111\u00e1nh &f{player}&7! \u0110\u1eebng tho\u00e1t game!
Tagged_Defender = {prefix} &7B\u1ecb &f{player} &7t\u1ea5n c\u00f4ng! \u0110\u1eebng tho\u00e1t game!
Out_Of_Combat = {prefix} &a\u0110\u00e3 h\u1ebft giao tranh
Out_Of_Combat_ActionBar = &a\u0110\u00e3 h\u1ebft giao tranh
Duel_Mode_Protection = !actionbar {prefix} &#c9453eNg\u01b0\u1eddi n\u00e0y \u0111ang \u0111\u00e1nh v\u1edbi ng\u01b0\u1eddi kh\u00e1c!
Command_Denied_InCombat = {prefix} &cKh\u00f4ng d\u00f9ng l\u1ec7nh n\u00e0y khi \u0111ang giao tranh!
Block_Place_Blocked_InCombat = !actionbar {prefix} &cKh\u00f4ng \u0111\u1eb7t kh\u1ed1i khi \u0111ang giao tranh!
Block_Break_Blocked_InCombat = !actionbar {prefix} &cKh\u00f4ng ph\u00e1 kh\u1ed1i khi \u0111ang giao tranh!
Eating_Blocked_InCombat = !actionbar {prefix} &cKh\u00f4ng \u0103n \u0111\u01b0\u1ee3c khi \u0111ang giao tranh!
Elytra_Blocked_InCombat = !actionbar {prefix} &cKh\u00f4ng d\u00f9ng c\u00e1nh khi \u0111ang giao tranh!
Firework_Blocked_InCombat = !actionbar {prefix} &cKh\u00f4ng d\u00f9ng ph\u00e1o hoa khi \u0111ang bay trong giao tranh!
Firework_Power_Limited_InCombat = !actionbar {prefix} &cKh\u00f4ng d\u00f9ng ph\u00e1o hoa c\u1ea5p &f{power} &ckhi \u0111ang giao tranh!
EnderPearl_Blocked_InCombat = {prefix} &cKh\u00f4ng d\u00f9ng ng\u1ecdc ender khi \u0111ang giao tranh!
ChorusFruit_Blocked_InCombat = {prefix} &cKh\u00f4ng \u0103n qu\u1ea3 chorus khi \u0111ang giao tranh!
Interact_Blocked_InCombat = !actionbar {prefix} &cKh\u00f4ng b\u1ea5m chu\u1ed9t ph\u1ea3i khi \u0111ang giao tranh!
Teleport_Blocked_InCombat = {prefix} &cKh\u00f4ng d\u1ecbch chuy\u1ec3n khi \u0111ang giao tranh!
Totem_Blocked_InCombat = {prefix} &cKh\u00f4ng d\u00f9ng v\u1eadt t\u1ed5 khi \u0111ang giao tranh!
Inventory_Blocked_InCombat = !actionbar {prefix} &cKh\u00f4ng m\u1edf r\u01b0\u01a1ng khi \u0111ang giao tranh!
Pushback_Warning = {prefix} &#c9453e\u0110ang giao tranh, kh\u00f4ng ch\u1ea1y v\u00e0o khu an to\u00e0n \u0111\u01b0\u1ee3c!

# Newbie Protection
Newbie_Protection = {prefix} &aCh\u00e0o m\u1eebng! B\u1ea1n \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 kh\u1ecfi PvP trong &e{time}
Newbie_Protection_End = {prefix} &6H\u1ebft b\u1ea3o v\u1ec7 ng\u01b0\u1eddi m\u1edbi! B\u1ea1n c\u00f3 th\u1ec3 b\u1ecb t\u1ea5n c\u00f4ng!
Newbie_Protection_Removed = {prefix} &aB\u1ea1n \u0111\u00e3 t\u1eaft b\u1ea3o v\u1ec7 ng\u01b0\u1eddi m\u1edbi! C\u1ea9n th\u1eadn
Newbie_Protection_On_Hit = {prefix} &#c9453eB\u1ea1n \u0111ang \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 PvP! Mu\u1ed1n \u0111\u00e1nh nhau th\u00ec t\u1eaft b\u1eb1ng &f/newbie disable
Newbie_Protection_Attacker = !actionbar {prefix} &f{player} &#c9453e\u0111ang \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 ng\u01b0\u1eddi m\u1edbi!
Newbie_Time_Check = {prefix} &7B\u1ea1n c\u00f2n \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 PvP &e{time}
Newbie_Time_Check_Other = {prefix} &f{player} &7c\u00f2n \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 PvP &e{time}
Newbie_Command_Blocked = {prefix} &cKh\u00f4ng d\u00f9ng l\u1ec7nh n\u00e0y khi \u0111ang \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 ng\u01b0\u1eddi m\u1edbi!
Newbie_Pickup_Items_Blocked = !actionbar {prefix} &cKh\u00f4ng nh\u1eb7t \u0111\u1ed3 khi \u0111ang \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 ng\u01b0\u1eddi m\u1edbi!
Newbie_Force_Removed_WorldGuard = {prefix} &6B\u1ea1n v\u00e0o khu PvP n\u00ean m\u1ea5t b\u1ea3o v\u1ec7 ng\u01b0\u1eddi m\u1edbi

# Respawn Protection
Respawn_Protection = !actionbar {prefix} &#c9453eB\u1ea1n \u0111ang \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 sau khi h\u1ed3i sinh!
Respawn_Protection_Other = !actionbar {prefix} &f{player} &#c9453ev\u1eeba h\u1ed3i sinh, \u0111ang \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7!

# World Protection
World_Protection = !actionbar {prefix} &#c9453eTh\u1ebf gi\u1edbi n\u00e0y t\u1eaft PvP!

# AFK Protection
AFK_Protection = !actionbar {prefix} &#c9453eNg\u01b0\u1eddi n\u00e0y \u0111ang AFK, kh\u00f4ng \u0111\u00e1nh \u0111\u01b0\u1ee3c

# Global Protection
Global_Protection = !actionbar {prefix} &#c9453ePvP \u0111ang t\u1eaft to\u00e0n server

# Player Kills
Money_Reward = {prefix} &aYou got &#FFD700{money} &acoins for killing player &f{victim}&a!
Money_Penalty = {prefix} &cYou lost &#FFD700{money} &ccoins for getting killed!
Money_Steal = {prefix} &f{player} &cstole &#FFD700{money} &ccoins from you!
Exp_Won = {prefix} &aYou got &e{exp} &aexperience for killing &f{victim}&a!
Exp_Stolen = {prefix} &f{player} &6stole &e{exp} &6experience from you!

# Kill Abuse
Kill_Abuse_Warning = {prefix} &cGi\u1ebft ng\u01b0\u1eddi n\u00e0y th\u00eam l\u1ea7n n\u1eefa s\u1ebd b\u1ecb ph\u1ea1t! D\u1eebng l\u1ea1i.

# Item Cooldown
Item_Cooldown = !actionbar {prefix} &cCh\u01b0a d\u00f9ng \u0111\u01b0\u1ee3c! C\u00f2n &e{time}

