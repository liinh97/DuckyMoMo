#----------------------------------------------
# DO NOT TOUCH THESE UNLESS YOU KNOW WHAT YOU'RE DOING!
debug: false
config-version: 1.9
#----------------------------------------------

# You can edit from here:

playerShops:
  # List a player's shop in the GUI as soon as they place a shopkeeper, instead
  # of only after they run /setshop. Existing shops are listed on next startup.
  autoRegister:
    enabled: true
    # Name shown until the owner customises it with /setshop.
    # %player% is replaced with the owner's name; use \n for extra lines.
    defaultName: "Shop của %player%"
  # Allow teleporting to player shops
  teleport:
    enabled: true
    # Warmup/countdown to teleport in seconds. Set to 0 to disable.
    warmup: 5
    # How many blocks away from the shopkeeper the player lands. The spot right
    # in front of the shopkeeper is tried first, so the player arrives facing
    # the shop. If it is blocked, other directions at the same distance are
    # tried, then closer rings, and finally the shopkeeper's own block.
    # Whole number between 1 and 8; anything else is clamped with a warning.
    distance: 2
    allowMovement: false
  # Blacklist items that cannot be sold in player shops
  itemBlacklist:
    - BEDROCK

adminShops:
  # Allow teleporting to admin shops
  teleport:
    enabled: true
    # Warmup/countdown to teleport in seconds. Set to 0 to disable.
    warmup: 5
    # How many blocks away from the shopkeeper the player lands. The spot right
    # in front of the shopkeeper is tried first, so the player arrives facing
    # the shop. If it is blocked, other directions at the same distance are
    # tried, then closer rings, and finally the shopkeeper's own block.
    # Whole number between 1 and 8; anything else is clamped with a warning.
    distance: 2
    # Allow the player to move during countdown/warmup
    allowMovement: false
  # Allow remote open admin shops
  remote: false
  filler:
    # The item to use as a filler in the admin shop GUI
    material: GRAY_STAINED_GLASS_PANE

# How often should the shops refresh? (in seconds) keep it above 30 seconds to avoid lag.
refresh-rate: 60

economy:
  # Enable economy support
  enabled: true
  # Set the price limit for trades
  selling-price-limit: 100000000.00

  # Prevent players from buying/selling multiple stacks at once by shift-clicking
  # (bulk trading). When true, a shift-click only performs a single trade.
  # Players with the 'shopkeepersaddon.bulktrade.bypass' permission are exempt.
  disable-bulk-trading: false

  # Daily earnings limit for selling to admin shops
  daily-earning-limit:
    enabled: true
    limit: 1500.0

  # Price formatting options
  price-format:
    # Format pattern using DecimalFormat syntax:
    # 0 = prints digit if provided, 0 otherwise
    # # = prints digit if provided, nothing otherwise
    # . = decimal separator position
    # , = thousands grouping separator position
    pattern: '#,##0.00'

    # Swap decimal and grouping separators for European format
    # true: 1.000.000,00 (European) | false: 1,000,000.00 (Western)
    european-format: false

    # Custom separators (optional - overrides european-format if both are set)
    # decimal-separator: '.'
    # grouping-separator: ','

    # Currency symbol and position
    currency-symbol: ' xu'
    symbol-before: false  # true: $100 | false: 100$  (DuckyMoMo: '100 xu')

  # Currency Item:
  sell-item:
    name: "Giá: §f%symbol%%price%"
    material: GOLD_NUGGET
    glow: true
    lore:
      - "§bBấm để sửa"
    custom-model-data: 0

  buy-item:
    name: "Bạn nhận: §f%symbol%%price%"
    material: GOLD_NUGGET
    glow: true
    lore:
      - "§bBấm để sửa"
    custom-model-data: 0

# Use '§' for color codes

