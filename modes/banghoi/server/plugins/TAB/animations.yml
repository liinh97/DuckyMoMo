  change-interval: 8000
  texts:
    - '&eKINH TẾ &8●&7○○'
    - '&aTHỊ TRẤN &7○&8●&7○'
    - '&cCHIẾN TRANH &7○○&8●'
SbDong1:
  change-interval: 8000
  texts:
    - '&#7CFC9A⛃ &a%vault_eco_balance_formatted% &2xu'
    - '%condition:tt_ten%'
    - '&#C77DFF⚜ &#E0B0FF%condition:tt_quocgia%'
SbDong2:
  change-interval: 8000
  texts:
    - '&#FFCC33❖ &e%dmmhom_chia% &fvé gacha &7· &e%dmmhom_con%'
    - '%condition:tt_dan%'
    - '&#FF6B6B⚔ &f%dmmtoi_giet%&7/&f%dmmtoi_chet% &7· &fKDA &e%dmmtoi_kda%'
SbDong3:
  change-interval: 8000
  texts:
    - '%dmmmua_ten% &7%dmmmua_con%n'
    - '%condition:tt_kho%'
    - '&#9AE6B4✦ &fThăng Cấp %dmmcap_mau%%dmmcap_cap%'
