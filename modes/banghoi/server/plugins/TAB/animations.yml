# Boss bar trên cùng (config.yml bossbar MeoChoi): mẹo xoay vòng mỗi 8 giây
MeoChoi:
  change-interval: 8000
  texts:
    - "&e✦ &fGõ &e/warp &fđể tới các địa danh mùa 1 &e✦"
    - "&e✦ &fLập thị trấn: &e/t new <tên> &f(500 xu) &e✦"
    - "&e✦ &fChợ đấu giá: &e/ah &f• Đổi đồ: &e/trade <tên> &e✦"
    - "&e✦ &fKiếm tiền: đào, chặt, săn quái tự có tiền &e/jobs &e✦"
    - "&e✦ &fBán đồ cho server: &e/sell hand &fhoặc biển ở spawn &e✦"
    - "&c✦ &fĐang đánh nhau mà thoát game sẽ chết và rơi đồ &c✦"
    - "&e✦ &fCông thành: tối thứ 7, Chủ nhật 20:00 và 21:00 &e✦"
    - "&e✦ &fBản đồ thế giới online: Trạm 6 &e✦"
    - "&5✦ &fDungeon cày đồ hiếm: &d/dungeon &f(trùm cuối rơi Chìa khoá tầng sau) &5✦"
    - "&5✦ &fCổng Hoang giấu trên bản đồ: thấy &dhạt tím&f thì Shift &7(/conghoang) &5✦"
    - "&6✦ &fChơi một mình: &e/khobau &f• &e/truyna &f• &e/thanhtich &6✦"
    - "&a✦ &fĐất riêng an toàn để xây, trồng trọt: &e/thaiap &a✦"

