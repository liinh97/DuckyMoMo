Player:
  tabprefix: "&0[&7Player&0] &3"
  tagprefix: "&2Player &3"

# 30/10 chủ server: Tab chi chít, chữ đè sang cột bên -> danh phận thành ký hiệu màu, cấp chỉ còn số (nhóm LuckPerms của Danh phận).
