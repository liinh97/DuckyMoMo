default:
  tabprefix: "&7◇ &f"
dan:
  tabprefix: "&b◆ &f"
luongdan:
  tabprefix: "&a✦ &f"
haokiet:
  tabprefix: "&e♛ &f"

 # default settings for all groups, all groups will take properties from this section unless player's primary group overrides a specific setting
_DEFAULT_:
  # &f sau tiền tố: tên trắng, không ăn màu tiền tố (27/10: "[Tị Nạn] Itrap" tên xám theo &8 của tiền tố)
  tabprefix: "%luckperms-prefix%&f"
  tagprefix: "%luckperms-prefix%&f"
  customtabname: "%player%"
  tabsuffix: "%luckperms-suffix%"   # 30/10 chủ server: Tab gọn, không hiện cấp (cấp xem ở bảng bên phải / dưới tên)
  tagsuffix: "%luckperms-suffix%%dmmgiap_tren%"   # 30/10: ẩn giáp thì hiện tên set sau tên (cả Bedrock thấy, dòng dưới tên Bedrock không có)

