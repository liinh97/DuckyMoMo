aliases:
- tradepro
trade-command-compatible-mode: false
excess-chest:
  enabled: true
  title: '&7Túi đồ của bạn đã đầy!'
trade-logs: false
database:
  enabled: false
  host: localhost
  port: 3306
  database: tradepro
  username: root
  password: ''
  table_prefix: tradepro_
web-panel:
  enabled: false
  port: 8080
allow-same-ip-trade: true
permissions:
  required: false
  send: tradeplus.send
  accept: tradeplus.accept
requestcooldownseconds: 20
allow-trade-in-creative: false
allow-shift-right-click: true
blocked:
  blacklist:
  - bedrock
  - monster_egg
  named-items: false
  lore:
  - EXAMPLE_BLOCKED_LORE
  regex: ''
action: crouchrightclick
ranges:
  sameworld: 10.0
  crossworld: 0.0
  allowcrossworld: false
  blocked-worlds:
  - ThisWorldDoesntExistButItsBlocked
  - NeitherDoesThisOneButItIsToo
antiscam:
  countdown: 10
  cancelonchange: true
  preventchangeonaccept: true
  discrepancy-detection: true
end-display:
  enabled: true
  timer: 0
spectate:
  enabled: true
  broadcast: true
extras:
  type:
    prefix: '&6!!&6> '
    empty: '&eGõ số %EXTRA% muốn đưa, hoặc gõ ''cancel'' để thôi.'
    valid: '&aBấm ô kết quả (bên phải) để xác nhận.'
    invalid: '&cSố không hợp lệ!'
    maximum: '&cBạn chỉ có %BALANCE% %EXTRA%'
  economy:
    enabled: true
    name: xu
    material: gold_ingot
    display: '&6⛃ &fBạn đưa: &e%AMOUNT% xu'
    theirdisplay: '&6⛃ &fHọ đưa: &e%AMOUNT% xu'
    lore:
    - '&6▍ &fĐưa thêm xu vào trao đổi'
    - '&8• &7Bạn đang có: &e%BALANCE% xu'
    - '&8&m                              '
    - '&a➜ Bấm để sửa số xu'
    customModelData: 0
    increment: 10.0
    taxpercent: 0
    mode: anvil
  experience:
    enabled: true
    name: điểm kinh nghiệm
    material: experience_bottle
    display: '&a✦ &fBạn đưa: &a%AMOUNT% XP &8(%LEVELS% cấp)'
