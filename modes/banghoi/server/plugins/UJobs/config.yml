# players with these gamemodes will not gain exp/money from jobs
ignored_gamemodes:
- SPECTATOR
  #- CREATIVE

# materials that will not count when mined with a tool with silk touch.
silktouch_blacklist:
- COAL_ORE
- DEEPSLATE_COAL_ORE
- IRON_ORE
- DEEPSLATE_IRON_ORE
- COPPER_ORE
- DEEPSLATE_COPPER_ORE
- GOLD_ORE
- DEEPSLATE_GOLD_ORE
- REDSTONE_ORE
