- EMERALD_ORE
- DEEPSLATE_EMERALD_ORE
- LAPIS_ORE
- DEEPSLATE_LAPIS_ORE
- DIAMOND_ORE
- DEEPSLATE_DIAMOND_ORE
- NETHER_GOLD_ORE
- NETHER_QUARTZ_ORE
- GILDED_BLACKSTONE
- AMETHYST_CLUSTER

