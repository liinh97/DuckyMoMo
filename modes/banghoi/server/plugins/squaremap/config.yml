# squaremap của Bang Hội Chiến (12/10/2026). Xem trong Trạm 6: /mc/map (cổng SQUAREMAP_PORT trên máy, chỉ 127.0.0.1).
# - visibility-limits: CHỈ vẽ vùng mùa 1 (khớp viền ChunkyBorder 11200..13800 x -3200..-800). Map Trái Đất có sẵn mọi chunk,
#   vẽ hết rất lâu và tốn đĩa. Đổi mùa thì sửa vùng này rồi /map resetmap world + /map fullrender world.
# - player-tracker: TẮT, server chiến tranh, hiện vị trí người chơi trên web là lộ quân.
# - Ranh giới thị trấn/quốc gia: lớp "Thị trấn" do DuckyMoMoCore vẽ (towny-map trong DuckyMoMoCore/config.yml), tự đăng ký lại sau /squaremap reload.
# - Giao diện tiếng Việt: locale/lang-vi.yml. Ô "Người chơi" ẩn (show-controls: false) vì đã tắt theo dõi người chơi.
#   Lớp viền có sẵn TẮT (squaremap 1.3.15 giữ tên tiếng Anh "World Border", reload còn tạo lớp trùng): DuckyMoMoCore
#   vẽ "Viền mùa 1" (towny-map.border trong DuckyMoMoCore/config.yml). Đổi mùa: sửa cả visibility-limits và towny-map.border.
config-version: 2
settings:
    language-file: lang-vi.yml
    debug-mode: false
    update-checker: true
    web-address: http://localhost:8080
    web-directory:
        path: web
        auto-update: true
    image-quality:
        compress-images:
            enabled: false
            value: 0.0
    internal-webserver:
        enabled: true
        bind: 0.0.0.0
        port: 8080
        flush-json-immediately: false
    ui:
        coordinates:
            enabled: true
        link:
            enabled: true
        sidebar:
            pinned: unpinned
    commands:
        main-command-label: squaremap
        main-command-aliases:
        - map
    render-progress-logging:
        enabled: true
        interval-seconds: 1
world-settings:
    minecraft:the_nether:
        map:
            enabled: false
    minecraft:the_end:
        map:
            enabled: false
    default:
        map:
            enabled: true
            display-name: Trái Đất - Mùa 1
            order: 0
            icon: ''
            max-render-threads: -1
            iterate-up: false
            max-height: -1
            biomes:
                enabled: true
                blend-biomes: 3
            glass:
                clear: true
            lava:
                checkerboard: true
            water:
                clear-depth: true
                checkerboard: false
            zoom:
                maximum: 3
                default: 3
                extra: 2
            background-render:
                enabled: true
                max-chunks-per-interval: 1024
                interval-seconds: 15
                max-render-threads: -1
            markers:
                update-interval-seconds: 5
                spawn-icon:
                    enabled: true
                    show-controls: true
                    default-hidden: false
                    layer-priority: 0
                    z-index: 0
                world-border:
                    enabled: false
                    show-controls: false
                    default-hidden: false
                    layer-priority: 1
                    z-index: 1
            visibility-limits:
            -   type: rectangle
                enabled: true
                min-x: 11200
                min-z: -3200
                max-x: 13800
                max-z: -800
        player-tracker:
            enabled: false
            update-interval-seconds: 1
            show-controls: false
            default-hidden: false
            layer-priority: 2
            z-index: 2
            nameplate:
                enabled: true
                show-head: true
                heads-url: https://mc-heads.net/avatar/{uuid}/16
                show-armor: true
                show-health: true
            hide:
                invisible: true
                spectators: true
                map-invisibility-equipment: true
            use-display-names: false
