################################################################################################################################
#
#   zAuctionHouse V4 - Xác nhận mua MỘT món (DuckyMoMo, 21/10)
#
#   Plugin LUÔN mở màn này khi người mua bấm một món trong chợ (không có tuỳ chọn tắt). Để đỡ phiền, gần như cả màn là nút Mua:
#   món hiện ở ô trên cùng giữa (slot 4) để xem, cột phải (8, 17, 26) là Quay lại, mọi ô còn lại (kể cả ô giữa 13, đúng chỗ vừa bấm)
#   đều là Mua -> bấm thêm một lần ở gần như bất cứ đâu là mua.
#   Hộp shulker: nút xem bên trong đè lên ô 17 (chỉ hiện khi món là hộp shulker).
#
################################################################################################################################

name: "#0c1719Mua món này? &8· bấm ô xanh để mua"
size: 27

items:
  confirm:
    type: ZAUCTIONHOUSE_CONFIRM_PURCHASE
    item:
      material: LIME_STAINED_GLASS_PANE
      name: "&a✔ &fMua món này"
      lore:
      - "&a▍ &fTrả tiền và nhận món"
      - "&8&m                              "
      - "&a➜ Bấm để mua"
    slots:
    - 0-3
    - 5-7
    - 9-16
    - 18-25

  deny:
    type: BACK
    item:
      material: RED_STAINED_GLASS_PANE
      name: "&c✘ &fQuay lại"
      lore:
      - "&c▍ &fKhông mua nữa"
      - "&8&m                              "
      - "&a➜ Bấm để quay lại chợ"
    slots:
    - 8
    - 17
    - 26

  show:
    type: ZAUCTIONHOUSE_SHOW
    slot: 4

  shulker:
    type: ZAUCTIONHOUSE_SHULKER_OPEN
    slot: 17
    item:
      material: SHULKER_BOX
      name: "&d▣ &fXem trong hộp shulker"
      lore:
      - "&d▍ &fXem đồ chứa bên trong trước khi quyết định"
      - "&8&m                              "
      - "&a➜ Bấm để xem"
