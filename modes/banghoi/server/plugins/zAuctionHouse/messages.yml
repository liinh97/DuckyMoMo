# Header for option list display.
# Available placeholders: none
option-list-header: "<primary>Tuỳ chọn của bạn:"

# Format for each option entry.
# Available placeholders:
#   %option% - Option name
#   %value%  - Current value
option-list-entry: "<gray>  %option% <dark_gray>> <white>%value%"

# Admin command descriptions
command-description-auction-admin-option: "Manage player options"
command-description-auction-admin-option-set: "Set a player option"
command-description-auction-admin-option-list: "List player options"
command-description-auction-admin-option-reset: "Reset a player's options to defaults"

# Shown when admin sets an option for a player.
# Available placeholders:
#   %option% - Option name
#   %value%  - New value
#   %player% - Target player name
admin-option-set: "<success>Set option <white>%option%<success> to <white>%value%<success> for <white>%player%<success>."

# Shown when admin resets all options for a player.
# Available placeholders:
#   %player% - Target player name
admin-option-reset: "<success>All options for <white>%player%<success> have been reset to defaults."

# Header for admin option list.
# Available placeholders:
#   %player% - Target player name
admin-option-list-header: "<primary>Options for <white>%player%<primary>:"

