#   %seller%   - Name of the seller
#   %items%    - Item description
#   %price%    - Purchase price
#   %category% - Item category
broadcast-purchase: "#e6fff3<white>%buyer% <#e6fff3>vừa mua %items% <#e6fff3>giá <#92bed8>%price%<#e6fff3>."

#=============================================================================
# OPTION MESSAGES
