  # ---- Phù phép: CrazyEnchantments (shop /ce, ce reload) + Enchantio (cần khởi động lại) ----
  - title: Shop phù phép /ce - giá sách
    category: Shop
    description: "Shop /ce bán sách ngẫu nhiên theo độ hiếm. Đổi giá thì sửa luôn dòng mô tả (shop chỉ hiện mô tả, không tự hiện giá). Huyền thoại / Thần thoại mặc định KHÔNG bán (admin phát: /ce book <phù phép> <cấp> 1 <người>)."
