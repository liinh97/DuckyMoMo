  - title: Danh phận (/danhphan) — rank chơi miễn phí
    category: Người mới
    description: "Rank kiếm bằng cách chơi: Dân Tị Nạn (mới vào) → Dân → Lương Dân → Hào Kiệt. Đủ yêu cầu thì người chơi bấm nhận trong /danhphan. Mỗi bậc có tiền tố riêng và quyền lợi: số nhà, số balo, số món treo chợ."
    info: "Yêu cầu: giờ chơi THẬT (không tính AFK, /hoatdong) + cấp Thăng Cấp (/capdo); riêng Dân còn cần xong chương 1 cốt truyện (Già Làng).\nQuyền lợi áp ở Bang Hội Chiến: nhà /sethome (1–20), balo /balo (0–9) và số ô mỗi balo (9–54), món treo Chợ đen (1–20; Thương Hội vẫn 15). Balo cho rank ủng hộ / staff: nhóm \"Balo theo rank khác\" ngay dưới.\nLưu xong: có hiệu lực ngay (dmm reload): plugin tự sửa nhóm LuckPerms (tiền tố, quyền), không cần gõ lệnh lp. Người đã nhận bậc giữ bậc khi đổi số.\nTiền tố: mã màu & (vd &a[Lương Dân] ), nhớ để 1 dấu cách cuối. Admin đặt bậc tay: /danhphan dat <người> <mã>."
    apply: [dmm reload]
    settings:
      - { key: dp_on, label: Bật Danh phận, type: select, file: plugins/DuckyMoMoCore/config.yml, path: play-ranks.enabled, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: dp_announce, label: Báo cả server khi có người lên bậc, type: select, file: plugins/DuckyMoMoCore/config.yml, path: play-ranks.announce, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: dp_tinan_name, label: "Dân Tị Nạn (mới vào): tên", type: text, file: plugins/DuckyMoMoCore/config.yml, path: play-ranks.tiers.tinan.name }
      - { key: dp_tinan_prefix, label: "Dân Tị Nạn (mới vào): tiền tố (mã màu &)", type: text, file: plugins/DuckyMoMoCore/config.yml, path: play-ranks.tiers.tinan.prefix }
      - { key: dp_tinan_homes, label: "Dân Tị Nạn (mới vào): số nhà /sethome", type: int, min: 1, max: 20, file: plugins/DuckyMoMoCore/config.yml, path: play-ranks.tiers.tinan.homes }
      - { key: dp_tinan_balo, label: "Dân Tị Nạn (mới vào): số balo /balo", type: int, min: 0, max: 9, file: plugins/DuckyMoMoCore/config.yml, path: play-ranks.tiers.tinan.balo }
      - { key: dp_tinan_slots, label: "Dân Tị Nạn (mới vào): số ô mỗi balo", type: select, options: [ { value: 9, label: "9 ô (1 hàng)" }, { value: 18, label: "18 ô" }, { value: 27, label: "27 ô" }, { value: 36, label: "36 ô" }, { value: 45, label: "45 ô" }, { value: 54, label: "54 ô (6 hàng)" } ], file: plugins/DuckyMoMoCore/config.yml, path: play-ranks.tiers.tinan.balo-slots }
      - { key: dp_tinan_ah, label: "Dân Tị Nạn (mới vào): số món treo Chợ đen (bên Đang bán)", type: int, min: 1, max: 20, file: plugins/DuckyMoMoCore/config.yml, path: play-ranks.tiers.tinan.ah }
      - { key: dp_tinan_orders, label: "Dân Tị Nạn (mới vào): số đơn thu mua Chợ đen", type: int, min: 0, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: play-ranks.tiers.tinan.orders }
      - { key: dp_tinan_tuskin, label: "Dân Tị Nạn (mới vào): số skin lưu trong tủ /tuskin", type: int, min: 0, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: play-ranks.tiers.tinan.tu-skin }
