        options:
          - { value: ["10:5 [alert]", "1:1 [log]", "20:10 [webhook]", "20:10 [proxy]"], label: "Chỉ báo admin (không kick)" }
          - { value: ["10:5 [alert]", "1:1 [log]", "20:10 [webhook]", "20:10 [proxy]", "60:0 kick %player% Hệ thống chống hack: nghi dùng hack (%check_name%). Nếu bị nhầm, báo admin."], label: "Báo + kick khi đủ 60 vi phạm" }
