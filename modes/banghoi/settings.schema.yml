# Định nghĩa trang Cài đặt cho chế độ Bang Hội Chiến (panel/ đọc file này).
# Giá trị đang dùng nằm ở settings.yml (cùng thư mục), trang Cài đặt ghi vào đó khi bấm Lưu.
#
# Mỗi mục:
#   key      tên trong settings.yml
#   type     text | times | int | number | select | list (phẩy) | lines (mỗi dòng 1 mục) | info
#   servers  (tuỳ chọn) ghi vào file của nhiều server, vd [lobby, banghoi-1, practice-1]; mặc định = server của trang
#   path     có thể chứa chỉ số danh sách: donate-ranks.tiers.0.prices
#   file     file cấu hình plugin, tính từ data/<server>/  (bỏ trống = chỉ lưu, không ghi vào plugin)
#   path     đường dẫn trong file YAML, nối bằng dấu chấm
#   commands lệnh RCON chạy khi giá trị đổi ({value}, {double} = giá trị x2, {tên_mục} = giá trị của mục khác)
#   note     ghi chú hiện dưới ô nhập
# Mỗi nhóm: category = loại (thanh chọn loại trên trang Cài đặt); apply = lệnh RCON chạy sau khi có mục trong nhóm đổi (nạp lại cấu hình plugin).
title: Bang Hội Chiến
server: banghoi-1

groups:
  - title: Lịch công thành
    category: Chiến tranh
    description: Giờ bắt đầu các phiên chiến (giờ Việt Nam). Mỗi phiên PvP bật quanh cờ vây thành.
    apply: [swa reload]
    settings:
      - { key: siege_monday,    label: Thứ 2,    type: times, file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.start_times.monday }
      - { key: siege_tuesday,   label: Thứ 3,    type: times, file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.start_times.tuesday }
      - { key: siege_wednesday, label: Thứ 4,    type: times, file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.start_times.wednesday }
      - { key: siege_thursday,  label: Thứ 5,    type: times, file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.start_times.thursday }
      - { key: siege_friday,    label: Thứ 6,    type: times, file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.start_times.friday }
      - { key: siege_saturday,  label: Thứ 7,    type: times, file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.start_times.saturday }
      - { key: siege_sunday,    label: Chủ nhật, type: times, file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.start_times.sunday }
      - { key: siege_session_minutes, label: Độ dài mỗi phiên (phút), type: int, min: 10, max: 240,
          file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.session_duration_minutes }
      - { key: siege_sessions_per_siege, label: Số phiên mỗi cuộc vây, type: int, min: 1, max: 20,
          file: plugins/SiegeWar/config.yml, path: war.siege.times.duration_battle_sessions,
          note: "Cuộc vây kết thúc sau ngần này phiên. Đổi giá trị chỉ ảnh hưởng cuộc vây bắt đầu sau đó." }
      - { key: siege_weeks, label: Tuần có công thành, type: select,
          file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.allowed_siege_battle_session_weeks,
          options: [ { value: weekly, label: Mọi tuần }, { value: odd-weeks-only, label: Chỉ tuần lẻ }, { value: even-weeks-only, label: Chỉ tuần chẵn } ] }

  - title: Luật công thành
    category: Chiến tranh
    apply: [swa reload]
    settings:
      - { key: siege_max_attacks, label: Số cuộc vây tấn công tối đa mỗi quốc gia, type: int, min: 1, max: 10,
          file: plugins/SiegeWar/config.yml, path: war.siege.quantities.max_active_siege_attacks_per_nation }
      - { key: siege_warchest_per_plot, label: Quỹ chiến tranh (tiền / ô đất của thị trấn bị vây), type: number, min: 0,
          file: plugins/SiegeWar/config.yml, path: war.siege.money.warchest_cost_per_plot }
      - { key: siege_immunity_hours, label: Miễn vây sau một cuộc vây (giờ), type: int, min: 0,
          file: plugins/SiegeWar/config.yml, path: war.siege.times.siege_immunity_post_siege_hours,
          note: "Thủ đô được gấp đôi." }
      - { key: siege_immunity_new_town_hours, label: Miễn vây cho thị trấn mới lập (giờ), type: int, min: 0,
          file: plugins/SiegeWar/config.yml, path: war.siege.times.siege_immunity_time_new_town_hours }

  - title: Thị trấn và quốc gia
    category: Thị trấn
    apply: [ta reload config]
    settings:
      - { key: towny_price_new_town,   label: Phí lập thị trấn,   type: number, min: 0, file: plugins/Towny/settings/config.yml, path: economy.new_expand.price_new_town }
      - { key: towny_price_new_nation, label: Phí lập quốc gia,   type: number, min: 0, file: plugins/Towny/settings/config.yml, path: economy.new_expand.price_new_nation }
      - { key: towny_price_claim,      label: Giá mua 1 ô đất,     type: number, min: 0, file: plugins/Towny/settings/config.yml, path: economy.new_expand.price_claim_townblock }
      - { key: towny_town_upkeep,      label: Phí duy trì thị trấn mỗi ngày,  type: number, min: 0, file: plugins/Towny/settings/config.yml, path: economy.daily_taxes.price_town_upkeep }
      - { key: towny_nation_upkeep,    label: Phí duy trì quốc gia mỗi ngày,  type: number, min: 0, file: plugins/Towny/settings/config.yml, path: economy.daily_taxes.price_nation_upkeep }

  - title: Kinh tế
    category: Kinh tế
    description: Tiền dùng riêng trong Bang Hội Chiến. Nguồn tiền khởi đầu là /sell (bán đồ cho server theo bảng giá Essentials/worth.yml).
    apply: [essentials reload]
    settings:
      - { key: eco_starting_balance, label: Tiền khởi đầu cho người mới, type: int, min: 0, max: 1000000,
          file: plugins/Essentials/config.yml, path: starting-balance,
          note: "Chỉ áp dụng cho người vào lần đầu sau khi đổi. Lập thị trấn tốn phí ở nhóm Thị trấn và quốc gia." }
      - key: eco_per_player_locale
        label: Tin nhắn EssentialsX theo ngôn ngữ máy người chơi
        type: select
        file: plugins/Essentials/config.yml
        path: per-player-locale
        options: [ { value: true, label: "Có (máy để tiếng Việt thì thấy tiếng Việt)" }, { value: false, label: Không (tiếng Anh) } ]

  - title: Combat
    category: PvP & combat
    apply: [ocm reload]
    settings:
      - key: combat_mode
        label: Kiểu combat
        type: select
        file: plugins/OldCombatMechanics/config.yml
        path: worlds.__default__
        options:
          - { value: [old],      label: "1.8 (cũ), bắt buộc mọi người" }
          - { value: [new],      label: "Mới (1.9+), bắt buộc mọi người" }
          - { value: [old, new], label: "Mặc định 1.8, người chơi tự đổi được (/ocm mode)" }
          - { value: [new, old], label: "Mặc định mới, người chơi tự đổi được (/ocm mode)" }
        note: "Cho tự đổi thì người chơi có thể chọn kiểu có lợi cho mình."

  - title: Thế giới
    category: Thế giới
    settings:
      # Viền hình chữ nhật bằng ChunkyBorder (viền vanilla chỉ vuông). Map Trái Đất 1:1000 (từ 11/10/2026): 21504 x 10752; 1:2000: 10752 x 5376.
      # Mỗi mùa một vùng (cách 3, 12/10/2026): viền chữ nhật quanh vùng của mùa. Mùa 1: Đông Nam Á lục địa + Nam Trung Quốc,
      # tâm (12500, -2000), bán kính 1300 x 1200 (x 11200..13800, z -3200..-800). Cả Trái Đất: tâm 0 0, bán kính 21504 x 10752.
      - { key: border_center_x, label: Tâm viền, toạ độ X, type: int, min: -29000000, max: 29000000,
          commands: ["worldborder set 59999968", "chunky world world", "chunky shape rectangle", "chunky center {border_center_x} {border_center_z}",
                     "chunky radius {border_x} {border_z}", "chunky border add world"],
          note: "Mùa 1 (Đông Nam Á): 12500. Cả Trái Đất: 0. 1 độ kinh ≈ 119,5 block." }
      - { key: border_center_z, label: Tâm viền, toạ độ Z, type: int, min: -29000000, max: 29000000,
          commands: ["worldborder set 59999968", "chunky world world", "chunky shape rectangle", "chunky center {border_center_x} {border_center_z}",
                     "chunky radius {border_x} {border_z}", "chunky border add world"],
          note: "Mùa 1: -2000. Cả Trái Đất: 0. Z = -vĩ độ x 119,5." }
      - { key: border_x, label: Viền thế giới, bán kính Đông–Tây (block), type: int, min: 500, max: 29000000,
          commands: ["worldborder set 59999968", "chunky world world", "chunky shape rectangle", "chunky center {border_center_x} {border_center_z}",
                     "chunky radius {border_x} {border_z}", "chunky border add world"],
          note: "Áp dụng ngay. Mùa 1: 1300. Cả Trái Đất 1:1000: 21504." }
      - { key: border_z, label: Viền thế giới, bán kính Bắc–Nam (block), type: int, min: 500, max: 29000000,
          commands: ["worldborder set 59999968", "chunky world world", "chunky shape rectangle", "chunky center {border_center_x} {border_center_z}",
                     "chunky radius {border_x} {border_z}", "chunky border add world"],
          note: "Mùa 1: 1200. Cả Trái Đất 1:1000: 10752." }
      - { key: spawn_x, label: Điểm spawn, toạ độ X, type: int, min: -29000000, max: 29000000,
          commands: ["execute in minecraft:overworld run forceload add {spawn_x} {spawn_z}",
                     "execute in minecraft:overworld positioned {spawn_x} 0 {spawn_z} positioned over motion_blocking_no_leaves run setworldspawn ~ ~ ~",
                     "execute in minecraft:overworld run forceload remove {spawn_x} {spawn_z}"],
          note: "Độ cao tự lấy theo mặt đất. Map Trái Đất 1:1000: 1 độ kinh/vĩ ≈ 119,5 block (Hà Nội ≈ 12646, -2512)." }
      - { key: spawn_z, label: Điểm spawn, toạ độ Z, type: int, min: -29000000, max: 29000000,
          commands: ["execute in minecraft:overworld run forceload add {spawn_x} {spawn_z}",
                     "execute in minecraft:overworld positioned {spawn_x} 0 {spawn_z} positioned over motion_blocking_no_leaves run setworldspawn ~ ~ ~",
                     "execute in minecraft:overworld run forceload remove {spawn_x} {spawn_z}"] }
      - key: map_type
        label: Loại map
        type: select
        options: [ { value: natural, label: Map tự nhiên }, { value: earth, label: "Map Trái Đất tự tạo (tools/earthmap)" } ]
        note: "Chỉ ghi lại; áp dụng khi mở mùa mới (đổi giữa mùa người chơi mất thành)."
      - { key: map_url, label: Link tải map (nếu dùng map tải sẵn), type: text, note: "Map tải về: kiểm tra giấy phép trước khi dùng." }
      - key: reset_each_season
        label: Reset thế giới mỗi mùa
        type: select
        options: [ { value: true, label: Có }, { value: false, label: Không } ]
        note: "Chỉ ghi lại; dùng khi mở mùa mới."

  - title: Chống thoát game khi đánh nhau (PvPManager)
    category: PvP & combat
    description: Bị đánh thì gắn cờ giao tranh; thoát game lúc đó thì chết và rơi đồ. Người mới được bảo vệ khỏi PvP một thời gian.
    apply: [pmr reload]
    settings:
      - { key: pvp_tag_seconds, label: Thời gian gắn cờ giao tranh (giây), type: int, min: 5, max: 120, file: plugins/PvPManager/config.yml, path: Combat Tag.Time }
      - { key: pvp_kill_on_logout, label: Thoát game khi đang giao tranh thì chết, type: select, file: plugins/PvPManager/config.yml, path: Combat Log Punishments.Kill on Logout.Enabled,
          options: [ { value: true, label: "Có (rơi đồ)" }, { value: false, label: Không } ] }
      - { key: pvp_block_teleport, label: Cấm dịch chuyển (/spawn, /home, /warp...) khi đang giao tranh, type: select, file: plugins/PvPManager/config.yml, path: Combat Tag.Actions Blocked.Teleport,
          options: [ { value: true, label: Cấm }, { value: false, label: Cho phép } ] }
      - { key: pvp_newbie_enabled, label: Bảo vệ người mới, type: select, file: plugins/PvPManager/config.yml, path: Newbie Protection.Enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: pvp_newbie_seconds, label: Thời gian bảo vệ người mới (giây), type: int, min: 0, max: 86400, file: plugins/PvPManager/config.yml, path: Newbie Protection.Time,
          note: "900 = 15 phút. Người mới tự tắt được bằng /newbie disable." }

  - title: Dọn rác
    category: Hệ thống
    description: Xoá vật phẩm rơi dưới đất định kỳ, báo trước trong chat. Admin dọn ngay bằng /dmm clean.
    apply: [dmm reload]
    settings:
      - { key: cleaner_enabled, label: Bật dọn rác, type: select, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: cleaner_interval, label: Dọn mỗi (phút), type: int, min: 1, max: 120, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.interval-minutes }
      - { key: cleaner_warn, label: Báo trước ở các mốc (giây), type: list, items: int, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.warn-seconds,
          note: "Ví dụ: 60, 30, 10, 5, 3, 2, 1" }
      - { key: cleaner_min_age, label: Không xoá vật phẩm vừa rơi dưới (giây), type: int, min: 0, max: 600, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.min-age-seconds,
          note: "Để đồ rơi khi chết còn kịp nhặt. Vật phẩm đã đổi tên bằng đe không bao giờ bị xoá." }
      - { key: cleaner_arrows, label: Xoá cả mũi tên cắm đất, type: select, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.arrows,
          options: [ { value: true, label: Có }, { value: false, label: Không } ] }
      - { key: cleaner_warn_msg, label: "Tin báo trước ({s} = số giây)", type: text, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.warn-message }
      - { key: cleaner_done_msg, label: "Tin sau khi dọn ({n} = số vật phẩm)", type: text, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.done-message }

  - title: Bảng giá bán cho server (/sell)
    category: Kinh tế
    description: Giá bán MỘT vật phẩm bằng /sell. Biển thu mua ở spawn ghi giá riêng (tools/spawn-signs.py), đổi giá ở đây nên đổi cả biển. Vật phẩm khác sửa trong worth.yml.
    apply: [essentials reload]
    settings:
      - { key: worth_diamond, label: "Kim cương", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.diamond }
      - { key: worth_emerald, label: "Ngọc lục bảo", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.emerald }
      - { key: worth_gold_ingot, label: "Thỏi vàng", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.gold_ingot }
      - { key: worth_iron_ingot, label: "Thỏi sắt", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.iron_ingot }
      - { key: worth_copper_ingot, label: "Thỏi đồng", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.copper_ingot }
      - { key: worth_coal, label: "Than", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.coal }
      - { key: worth_wheat, label: "Lúa mì", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.wheat }
      - { key: worth_carrot, label: "Cà rốt", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.carrot }
      - { key: worth_potato, label: "Khoai tây", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.potato }
      - { key: worth_sugar_cane, label: "Mía", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.sugar_cane }
      - { key: worth_oak_log, label: "Gỗ sồi (và các loại gỗ khác: sửa worth.yml)", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.oak_log }
      - { key: worth_rotten_flesh, label: "Thịt thối", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.rotten_flesh }
      - { key: worth_bone, label: "Xương", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.bone }
      - { key: worth_string, label: "Tơ nhện", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.string }
      - { key: worth_gunpowder, label: "Thuốc súng", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.gunpowder }
      - { key: worth_ender_pearl, label: "Ngọc ender", type: number, min: 0, max: 100000, file: plugins/Essentials/worth.yml, path: worth.ender_pearl }

  - title: Bảng bên phải, boss bar, danh sách Tab
    category: Hiển thị
    description: "Mã màu &a, &e, &l (đậm)... Biến: %player%, %online%, %ping%, %luckperms-prefix%, %vault_eco_balance_formatted%, %townyadvanced_town_unformatted%."
    apply: [tab reload]
    settings:
      - { key: tab_bossbar_tips, label: Boss bar trên cùng (mỗi dòng 1 mẹo, xoay vòng), type: lines, file: plugins/TAB/animations.yml, path: MeoChoi.texts }
      - { key: tab_bossbar_interval, label: Đổi mẹo mỗi (mili giây), type: int, min: 1000, max: 600000, file: plugins/TAB/animations.yml, path: MeoChoi.change-interval,
          note: "8000 = 8 giây." }
      - { key: tab_bossbar_enabled, label: Hiện boss bar, type: select, file: plugins/TAB/config.yml, path: bossbar.enabled,
          options: [ { value: true, label: Có }, { value: false, label: Không } ] }
      - { key: tab_sb_enabled, label: Hiện bảng bên phải, type: select, file: plugins/TAB/config.yml, path: scoreboard.enabled,
          options: [ { value: true, label: Có }, { value: false, label: Không } ] }
      - { key: tab_sb_title, label: Tiêu đề bảng bên phải, type: text, file: plugins/TAB/config.yml, path: scoreboard.scoreboards.banghoi.title }
      - { key: tab_sb_lines, label: Các dòng bảng bên phải (tối đa 15), type: lines, file: plugins/TAB/config.yml, path: scoreboard.scoreboards.banghoi.lines,
          note: "Dòng trống: gõ một dấu cách không được (bị bỏ), dùng &r làm dòng trống." }
      - { key: tab_header, label: Đầu danh sách Tab (mỗi dòng 1 dòng), type: lines, file: plugins/TAB/config.yml, path: header-footer.designs.default.header }
      - { key: tab_footer, label: Cuối danh sách Tab, type: lines, file: plugins/TAB/config.yml, path: header-footer.designs.default.footer }

  # ---- Nghề (uJobs): mức tiền mỗi hành động, sinh từ plugins/UJobs/jobs.yml (12/10/2026). Thêm/bớt hành động: sửa jobs.yml.

  - title: "Nghề: Thợ săn"
    category: Nghề
    description: "Tiền mỗi lần làm (xu). Đã áp dụng hệ số 12/10: quặng x5, đá/đất x2, quái x2.5, gỗ x3, nông sản x5, chăn nuôi x3, câu cá x0.5 (treo máy), giết người x0. Phá lại block tự đặt không được tiền; đào quặng bằng Mềm Mại không được tiền."
    apply: [jobs reload]
    settings:
      - { key: job_hunter_kill_zombie, label: "Giết zombie", type: number, min: 0, max: 100000, file: plugins/UJobs/jobs.yml, path: jobs.hunter.actions.kill.zombie.money }
      - { key: job_hunter_kill_skeleton, label: "Giết bộ xương", type: number, min: 0, max: 100000, file: plugins/UJobs/jobs.yml, path: jobs.hunter.actions.kill.skeleton.money }
      - { key: job_hunter_kill_spider, label: "Giết nhện", type: number, min: 0, max: 100000, file: plugins/UJobs/jobs.yml, path: jobs.hunter.actions.kill.spider.money }
      - { key: job_hunter_kill_creeper, label: "Giết creeper", type: number, min: 0, max: 100000, file: plugins/UJobs/jobs.yml, path: jobs.hunter.actions.kill.creeper.money }
