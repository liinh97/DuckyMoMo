  - title: Cổng Hoang (/conghoang)
    category: Thế giới
    description: "Cổng dungeon ngụy trang như cảnh vật, xuất hiện dần trên bản đồ. Ai tìm ra được ưu tiên lập thị trấn; thị trấn giữ cổng thu phí người ngoài, chiếm được thị trấn là có cổng."
    info: "Là gì: điểm chiến lược trên bản đồ, đáng tranh giành và công thành.\nChỉ tự đặt cổng khi đã mở mùa (leaderboard.season-start có ngày). Admin: /conghoang tao (ngẫu nhiên) hoặc /conghoang tao here (tại chỗ đứng), /conghoang ds (toạ độ mọi cổng), /conghoang xoa <mã>, /conghoang datlai (gỡ hết, đếm lại).\nNgụy trang theo biome: vòng đá rêu, giếng sa thạch, cột băng, gốc cây rêu, rễ đước. Dungeon càng khó, cổng càng khó nhận ra: bậc của từng dungeon (tier 1–3) và dấu hiệu riêng trong tin đồn sửa ở wild-gates.dungeons. Vào: đứng ô giữa, ngồi xuống (Shift).\nCổng dẫn tới đâu: wild-gates.dungeons (mã gói EliteMobs, bỏ qua điều kiện của dungeon đó).\nLưu xong: có hiệu lực ngay (dmm reload)."
    apply: [dmm reload]
    settings:
      - { key: wg_on, label: Bật Cổng Hoang, type: select, file: plugins/DuckyMoMoCore/config.yml, path: wild-gates.enabled, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: wg_max, label: "Số cổng tối đa mỗi mùa", type: int, min: 0, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: wild-gates.max-gates }
      - { key: wg_days, label: "Mỗi bao nhiêu ngày thêm 1 cổng", type: int, min: 1, max: 90, file: plugins/DuckyMoMoCore/config.yml, path: wild-gates.interval-days }
      - { key: wg_town, label: "Cổng cách thị trấn gần nhất ít nhất (khối)", type: int, min: 0, max: 5000, file: plugins/DuckyMoMoCore/config.yml, path: wild-gates.min-town-distance }
      - { key: wg_gap, label: "Các cổng cách nhau ít nhất (khối)", type: int, min: 0, max: 10000, file: plugins/DuckyMoMoCore/config.yml, path: wild-gates.min-gate-distance }
      - { key: wg_grace, label: "Người tìm ra được ưu tiên lập thị trấn (phút)", type: int, min: 0, max: 1440, file: plugins/DuckyMoMoCore/config.yml, path: wild-gates.grace-minutes }
      - { key: wg_grace_r, label: "Bán kính ưu tiên (khối)", type: int, min: 16, max: 512, file: plugins/DuckyMoMoCore/config.yml, path: wild-gates.grace-radius }
      - { key: wg_t1_part, label: "Bậc 1 (dễ): hạt tím thấy trong (khối)", type: int, min: 0, max: 64, file: plugins/DuckyMoMoCore/config.yml, path: wild-gates.tiers.t1.particle-range }
