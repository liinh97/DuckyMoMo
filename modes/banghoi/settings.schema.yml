      - { key: emf_rare_gia, label: "Cá Hiếm: giá bán mỗi cm (xu)", type: number, min: 0, file: plugins/EvenMoreFish/rarities/rare.yml, path: worth-multiplier }
      - { key: emf_epic_w, label: "Cá Quý: trọng số (càng lớn càng hay cắn)", type: number, min: 0, file: plugins/EvenMoreFish/rarities/epic.yml, path: weight }
      - { key: emf_epic_gia, label: "Cá Quý: giá bán mỗi cm (xu)", type: number, min: 0, file: plugins/EvenMoreFish/rarities/epic.yml, path: worth-multiplier }
      - { key: emf_legendary_w, label: "Cá Huyền thoại: trọng số (càng lớn càng hay cắn)", type: number, min: 0, file: plugins/EvenMoreFish/rarities/legendary.yml, path: weight }
