  - title: Treo thưởng (/treothuong)
    category: PvP & combat
    description: "Người chơi bỏ tiền treo thưởng lên đầu người khác, ai hạ được nhận hết; hết hạn trả lại tiền. Hệ thống tự treo người có chuỗi giết dài (tiền hệ thống tạo thêm). Không tính giết tài khoản phụ, cùng IP; không treo lên dân Liên minh Hoà Bình."
    apply: [dmm reload]
    settings:
      - { key: tt_on, label: Bật treo thưởng, type: select, file: plugins/DuckyMoMoCore/config.yml, path: bounty.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: tt_min, label: Treo ít nhất (xu), type: number, min: 1, file: plugins/DuckyMoMoCore/config.yml, path: bounty.min }
      - { key: tt_max, label: Tổng treo tối đa lên một người (xu), type: number, min: 1, file: plugins/DuckyMoMoCore/config.yml, path: bounty.max-total }
      - { key: tt_fee, label: Phí treo (%), type: number, min: 0, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: bounty.fee-percent }
      - { key: tt_days, label: Hết hạn sau (ngày), type: int, min: 1, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: bounty.days }
      - { key: tt_streak, label: Hệ thống tự treo khi giết liền (mạng), type: int, min: 2, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: bounty.streak.kills }
      - { key: tt_streak_xu, label: "Hệ thống treo lần đầu (xu, 0 = tắt)", type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: bounty.streak.reward }
      - { key: tt_streak_them, label: Mỗi mạng thêm sau đó (xu), type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: bounty.streak.per-kill }

  - title: Pet chiến đấu (MyPet)
    category: PvP & combat
    info: "Là gì: pet bắt bằng dây xích (MyPet), đánh quái và người chơi. Lúc bắt mọi loài như nhau; lớn lên theo hệ người chơi chọn + bản tính loài (10 nhóm loài, đặc tính riêng). Bảng nhóm loài: trang web mục Pet; sửa bằng tools/mypet/sinh-cay-ky-nang.py (không sửa trên trang này).\nGiảm sát thương: pet đánh người chơi bị giảm %, áp dụng mọi nơi.\nCông thành: mỗi phiên bốc thăm có cho pet tham chiến không; phiên không cho thì pet không gây sát thương cho người chơi trong vùng vây.\nNgười chơi xem: /lichcongthanh, có báo trước khi phiên bắt đầu."
    description: "Người chơi biết trước phiên nào có pet: /lichcongthanh, tin báo trước 60 và 10 phút, tin lúc vào game."
    apply: [dmm reload]
    settings:
      - { key: petc_reduce, label: Pet đánh người chơi bị giảm (%), type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.player-damage-reduce-percent,
          info: "Là gì: pet gây sát thương lên NGƯỜI CHƠI bị giảm ngần này %. Đánh quái không bị giảm.\nVí dụ: 50 = pet đánh người chỉ còn một nửa; 100 = pet không làm người chơi mất máu.", note: "0 = không giảm." }
      - { key: petc_chance, label: Phiên công thành cho pet tham chiến (%), type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.siege-pet-chance,
          info: "Là gì: tỉ lệ phiên công thành được bốc thăm CHO pet tham chiến.\nCách bốc: cố định theo giờ bắt đầu từng phiên nên biết trước và báo trước được.\n0 = không bao giờ, 100 = luôn cho." }
      - { key: petc_seed, label: Mã bốc thăm, type: text, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.seed,
          info: "Là gì: chuỗi dùng để bốc thăm. Đổi chuỗi này = bốc thăm lại toàn bộ lịch (vd mỗi mùa một mã).\nLưu ý: đổi gần giờ công thành thì phiên đã báo có thể đổi kết quả." }
      - { key: petc_announce, label: Báo trước phiên (phút), type: list, items: int, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.announce-minutes,
          note: "Cách nhau dấu phẩy, ví dụ: 60, 10" }
      - { key: petc_nofly, label: Cấm bay bằng pet lúc công thành, type: select, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.siege-no-fly,
          options: [ { value: true, label: "Bật (mặc định)" }, { value: false, label: Tắt } ],
          info: "Là gì: lúc ĐANG có phiên đánh, trong vùng vây, người cưỡi pet bay (loài bay chọn hệ Thú Cưỡi) lên cao quá mức dưới thì bị đẩy xuống khỏi pet, được Rơi chậm 6 giây nên không mất máu.\nVẫn được: cưỡi chạy dưới đất, nhảy, bơi.\nNgoài vùng vây hoặc ngoài giờ đánh: bay bình thường.\nLưu xong: có hiệu lực ngay (dmm reload)." }
      - { key: petc_nofly_h, label: Tính là bay khi cao hơn mặt đất (khối), type: int, min: 2, max: 20, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.siege-no-fly-height,
          info: "Là gì: pet cưỡi cao hơn ngần này khối so với mặt đất thì tính là đang bay.\nGợi ý: 3. Nhảy thường cao khoảng 2 khối (ngựa nhảy cao tới khoảng 3-4), đặt thấp quá thì nhảy cũng bị đẩy xuống." }
      - { key: sw_on, label: "Thời tiết công thành", type: select, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.siege-weather.enabled,
          options: [ { value: true, label: "Bật (mặc định)" }, { value: false, label: Tắt } ],
          info: "Là gì: lúc ĐANG có phiên đánh, trong vùng vây, trời đất ảnh hưởng trận và cho pet đất diễn:\nĐêm: ai không có pet mắt đêm ở gần thì bị Bóng tối (tầm nhìn giảm); có thì được Nhìn đêm, pet mắt đêm đánh mạnh hơn.\nMưa: người đi bộ bị Chậm (đường lầy), cưỡi pet thì không; pet nước mạnh hơn, pet lửa yếu đi. Mùa mưa thì hay mưa hơn (/mua).\nNắng gắt (mùa khô, ban ngày, không mưa): ai không dẫn pet lửa thì mau đói; pet lửa mạnh hơn.\nĐêm/ngày theo giờ trong game (1 ngày = 20 phút), không theo giờ thật.\nLưu xong: có hiệu lực ngay (dmm reload)." }
      - { key: sw_range, label: "Thời tiết: pet phải ở gần chủ (khối)", type: number, min: 4, max: 64, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.siege-weather.pet-range }
      - { key: sw_night, label: "Đêm: Bóng tối cho ai không có pet mắt đêm", type: select, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.siege-weather.night-darkness,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: sw_night_bonus, label: "Đêm: pet mắt đêm đánh mạnh hơn (%)", type: number, min: 0, max: 200, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.siege-weather.night-pet-bonus }
      - { key: sw_eyes, label: "Loài pet mắt đêm", type: list, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.siege-weather.night-eyes,
          note: "Tên loài MyPet tiếng Anh, vd Bat, Cat, Fox, Wolf, Spider (bảng tên Việt ở trang chủ mục Pet)." }
      - { key: sw_rain, label: "Mưa: người đi bộ bị Chậm", type: select, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.siege-weather.rain-slowness,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
