# Định nghĩa trang Cài đặt cho chế độ Bang Hội Chiến (panel/ đọc file này).
# Giá trị đang dùng nằm ở settings.yml (cùng thư mục), trang Cài đặt ghi vào đó khi bấm Lưu.
#
# Mỗi mục:
#   key      tên trong settings.yml
#   type     text | times | int | number | select | list (phẩy) | lines (mỗi dòng 1 mục) | info
#   servers  (tuỳ chọn) ghi vào file của nhiều server, vd [lobby, banghoi-1, practice-1]; mặc định = server của trang
#   path     có thể chứa chỉ số danh sách: donate-ranks.tiers.0.prices
#   file     file cấu hình plugin, tính từ data/<server>/  (bỏ trống = chỉ lưu, không ghi vào plugin)
#   path     đường dẫn trong file YAML, nối bằng dấu chấm
#   commands lệnh RCON chạy khi giá trị đổi ({value}, {double} = giá trị x2, {tên_mục} = giá trị của mục khác)
#   note     ghi chú ngắn hiện dưới ô nhập
#   info     giải thích chi tiết, hiện khi bấm nút i cạnh tên mục (nhóm cũng có info: cạnh tiêu đề nhóm)
# Mỗi nhóm: category = loại (thanh chọn loại trên trang Cài đặt); apply = lệnh RCON chạy sau khi có mục trong nhóm đổi (nạp lại cấu hình plugin).
title: Bang Hội Chiến
server: banghoi-1

groups:
  - title: Lịch công thành
    category: Chiến tranh
    description: Giờ bắt đầu các phiên chiến (giờ Việt Nam). Mỗi phiên PvP bật quanh cờ vây thành.
    apply: [swa reload]
    settings:
      - { key: siege_monday,    label: Thứ 2,    type: times, file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.start_times.monday }
      - { key: siege_tuesday,   label: Thứ 3,    type: times, file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.start_times.tuesday }
      - { key: siege_wednesday, label: Thứ 4,    type: times, file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.start_times.wednesday }
      - { key: siege_thursday,  label: Thứ 5,    type: times, file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.start_times.thursday }
      - { key: siege_friday,    label: Thứ 6,    type: times, file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.start_times.friday }
      - { key: siege_saturday,  label: Thứ 7,    type: times, file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.start_times.saturday }
      - { key: siege_sunday,    label: Chủ nhật, type: times, file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.start_times.sunday }
      - { key: siege_session_minutes, label: Độ dài mỗi phiên (phút), type: int, min: 10, max: 240,
          file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.session_duration_minutes }
      - { key: siege_sessions_per_siege, label: Số phiên mỗi cuộc vây, type: int, min: 1, max: 20,
          file: plugins/SiegeWar/config.yml, path: war.siege.times.duration_battle_sessions,
          note: "Cuộc vây kết thúc sau ngần này phiên. Đổi giá trị chỉ ảnh hưởng cuộc vây bắt đầu sau đó." }
      - { key: siege_weeks, label: Tuần có công thành, type: select,
          file: plugins/SiegeWar/config.yml, path: battle_session_scheduler.allowed_siege_battle_session_weeks,
          options: [ { value: weekly, label: Mọi tuần }, { value: odd-weeks-only, label: Chỉ tuần lẻ }, { value: even-weeks-only, label: Chỉ tuần chẵn } ] }

  - title: Giai đoạn mùa và PvP
    category: Chiến tranh
    description: "Luật mùa 1 (docs/banghoi-luat-mua1.md): 2 tuần đầu hoà bình = tắt vây thành, từ tuần 3 bật. PvP đất hoang là cài đặt riêng, mặc định bật, không phụ thuộc lịch công thành."
    apply: [swa reload, dmm reload]
    settings:
      - { key: siege_enabled, label: Cho phép vây thành, type: select, file: plugins/SiegeWar/config.yml, path: war.siege.switches.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt (thời kỳ hoà bình) } ],
          note: "Tắt thì không ai cắm cờ vây được. Bật lại đầu tuần 3 của mùa." }
      - { key: pvp_wild, label: PvP ở đất hoang, type: select, file: plugins/DuckyMoMoCore/config.yml, path: pvp-rules.wild-pvp,
          options: [ { value: true, label: "Bật (mặc định): đánh ở đất hoang, chết rơi đồ" }, { value: false, label: "Tắt: chỉ đánh trong vùng công thành lúc có phiên" } ],
          note: "Trong thị trấn vẫn theo cài đặt của từng thị trấn (/t toggle pvp). Spawn luôn tắt." }
      - { key: siege_subvert, label: Quốc gia thu phục thị trấn hoà bình (không cần đánh), type: select, file: plugins/SiegeWar/config.yml, path: peaceful_towns.subvert_enabled,
          options: [ { value: false, label: "Tắt (chốt 14/10): thị trấn hoà bình không bao giờ bị chiếm" }, { value: true, label: "Bật (mặc định SiegeWar)" } ],
          note: "Bật thì quốc gia có thị trấn lớn nhất trong bán kính 1.200 block chiếm được thị trấn hoà bình bằng một lệnh." }
      - { key: war_min_rank_hours, label: Giờ chơi tối thiểu để được phong quân hàm, type: number, min: 0, max: 200, file: plugins/DuckyMoMoCore/config.yml, path: pvp-rules.min-rank-hours,
          note: "Tính giờ chơi ở Bang Hội Chiến. Chống dùng tài khoản phụ làm quân. Tài khoản phụ (admin ghi bằng /dmm phu) không bao giờ được phong." }

  - title: Đất đai và người chơi thật
    info: "Giờ chơi thật: chỉ tính lúc thật sự chơi (di chuyển, đào, đánh…), đứng AFK không tính. Người chơi xem bằng /hoatdong.\nMục đích: chống lập thị trấn ảo bằng tài khoản phụ hoặc người bỏ chơi."
    category: Thị trấn
    description: "Chốt 14/10 (docs/banghoi-luat-mua1.md mục 11D, 11E). Giờ chơi thật không tính lúc đứng yên/AFK; người chơi xem bằng /hoatdong. Dân hoạt động = đủ giờ chơi thật trong 7 ngày và đã ở thị trấn đủ số ngày."
    apply: [dmm reload]
    settings:
      - { key: act_week_hours, info: "Là gì: số giờ chơi THẬT trong 7 ngày gần nhất để được tính là dân hoạt động (đứng AFK không tính).\nTác dụng: chỉ dân hoạt động mới mang lại đất cho thị trấn và được tính khi lập quốc gia.", label: Dân hoạt động - giờ chơi thật trong 7 ngày, type: number, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: active-play.active-hours-per-week }
      - { key: act_new_member_days, label: Dân mới vào thị trấn - số ngày chưa được tính, type: int, min: 0, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: active-play.new-member-days,
          note: "Trong thời gian này chưa mang lại đất, chưa được phong quân hàm." }
      - { key: town_min_hours, label: Giờ chơi thật tối thiểu để lập thị trấn, type: number, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: town-rules.town-min-hours }
      - { key: nation_min_active, label: Số dân hoạt động tối thiểu để lập quốc gia, type: int, min: 1, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: town-rules.nation-min-active-residents }
      - { key: siege_min_towns, label: Số thị trấn tối thiểu của quốc gia để cắm cờ vây, type: int, min: 1, max: 20, file: plugins/DuckyMoMoCore/config.yml, path: town-rules.siege-min-towns,
          note: "Chỉ áp dụng khi đi chinh phục; phòng thủ, khởi nghĩa thì không cần." }
      - { key: town_join_cooldown, label: Rời thị trấn bao nhiêu ngày mới vào thị trấn khác, type: int, min: 0, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: town-rules.join-cooldown-days }
      - { key: land_by_active, info: "Có: số ô đất tối đa của thị trấn tính theo dân HOẠT ĐỘNG (dân bỏ chơi không giữ đất).\nLưu ý: đất đã chiếm không bị lấy lại, chỉ không mua thêm được khi vượt giới hạn.", label: Đất chỉ tính dân hoạt động, type: select, file: plugins/DuckyMoMoCore/config.yml, path: town-rules.land-per-active-resident,
          options: [ { value: true, label: "Có: dân không hoạt động không mang lại ô đất" }, { value: false, label: "Không: tính mọi dân" } ],
          note: "Đất đã chiếm không bị lấy lại, chỉ không mua thêm được khi vượt giới hạn." }
      - { key: spawn_reserved_radius, info: "Là gì: bán kính quanh kinh đô (spawn) chỉ dành cho Liên minh Hoà Bình.\nTác dụng: thị trấn thường không lập, không chiếm đất trong vòng này.", label: Vòng quanh kinh đô dành cho Liên minh Hoà Bình (block), type: int, min: 0, max: 2000, file: plugins/DuckyMoMoCore/config.yml, path: town-rules.reserved-spawn-radius }
      - { key: max_accounts, info: "Là gì: một người được giữ tối đa mấy tài khoản.\nTài khoản phụ: khai bằng /taikhoanphu hoặc admin ghi bằng /dmm phu; không được phong quân hàm, không gây sát thương trong vùng vây lúc có phiên.", label: Số tài khoản tối đa mỗi người, type: int, min: 1, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: pvp-rules.max-accounts,
          note: "Tạm 2 để kéo người chơi, đông thì đổi về 1. Người chơi khai bằng /taikhoanphu." }

  - title: Boss & Dungeon (EliteMobs)
    category: Thế giới
    description: "Dungeon cày đồ/tiền, boss tuỳ chỉnh, sự kiện boss. Tải dungeon trong game: /em setup (cần mã tài khoản Nightbreak). Quái elite tự sinh đang TẮT để không lệch cán cân chiến tranh."
    apply: [em reload]
    settings:
      - { key: em_natural, label: Quái elite tự sinh ngoài thế giới, type: select, file: plugins/EliteMobs/MobCombatSettings.yml, path: doNaturalEliteMobSpawning,
          options: [ { value: false, label: "Tắt (chỉ có trong dungeon, sự kiện, boss)" }, { value: true, label: "Bật (quái elite sinh khắp nơi)" } ] }
      - { key: em_natural_pct, label: "Tỉ lệ quái thành elite khi bật (0,05 = 5%)", type: number, min: 0, max: 1, file: plugins/EliteMobs/MobCombatSettings.yml, path: eliteMobsSpawnPercentage }
      - { key: em_dmg_player, label: Sát thương elite gây cho người chơi (hệ số), type: number, min: 0.1, max: 10, file: plugins/EliteMobs/MobCombatSettings.yml, path: damageToPlayerMultiplierV2 }
      - { key: em_dmg_elite, label: Sát thương người chơi gây cho elite (hệ số), type: number, min: 0.1, max: 10, file: plugins/EliteMobs/MobCombatSettings.yml, path: damageToEliteMobMultiplierV2 }
      - { key: em_vault, label: Tiền rơi từ elite/dungeon, type: select, file: plugins/EliteMobs/EconomySettings.yml, path: useVault,
          options: [ { value: true, label: "Xu chung của server" }, { value: false, label: "Elite Coins riêng (chỉ tiêu ở shop EliteMobs)" } ],
          note: "Dùng xu chung dễ lạm phát (tác giả plugin cảnh báo): hạ hệ số tiền rơi bên dưới nếu thấy giá cả tăng." }
      - { key: em_coin_mult, label: Hệ số tiền rơi, type: number, min: 0, max: 5, file: plugins/EliteMobs/EconomySettings.yml, path: currencyShowerTierMultiplier,
          note: "0,3 = 30% lượng mặc định của EliteMobs." }

  - title: Điểm danh hằng ngày
    category: Thưởng & sự kiện
    description: "/diemdanh: mỗi ngày nhận quà ngày; chạm mốc (đếm TỔNG số ngày đã điểm danh, bỏ ngày không mất chuỗi) nhận thêm quà mốc. Quà chọn từ xu, Thư viện đồ, đồ thường, lệnh."
    apply: [dmm reload]
    settings:
      - { key: dd_on, label: Bật điểm danh, type: select, file: plugins/DuckyMoMoCore/config.yml, path: daily-checkin.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: dd_min, label: Phải online đủ (phút) mới điểm danh được, type: int, min: 0, max: 120, file: plugins/DuckyMoMoCore/config.yml, path: daily-checkin.min-online-minutes,
          note: "Chống tạo tài khoản phụ vào điểm danh lấy quà rồi thoát." }
      - { key: dd_daily, label: Quà mỗi ngày, type: rewards, file: plugins/DuckyMoMoCore/config.yml, path: daily-checkin.daily-rewards }
      - { key: dd_miles, label: Quà mốc (ngày thứ … được thêm), type: milestones, file: plugins/DuckyMoMoCore/config.yml, path: daily-checkin.milestones }
      - { key: dd_cycle, label: Chu kỳ mốc (ngày), type: int, min: 0, max: 365, file: plugins/DuckyMoMoCore/config.yml, path: daily-checkin.cycle-days,
          note: "30 = mốc lặp lại sau mỗi 30 lần điểm danh (lần 37 nhận quà mốc 7). 0 = mốc chỉ nhận một lần." }
      - { key: dd_remind, label: Nhắc khi vào game nếu chưa điểm danh, type: select, file: plugins/DuckyMoMoCore/config.yml, path: daily-checkin.remind-on-join,
          options: [ { value: true, label: Có }, { value: false, label: Không } ] }
      - { key: dd_bc, label: Báo cả server khi có người chạm mốc, type: select, file: plugins/DuckyMoMoCore/config.yml, path: daily-checkin.broadcast-milestone,
          options: [ { value: true, label: Có }, { value: false, label: Không } ] }

  - title: Nhiệm vụ hằng ngày
    category: Thưởng & sự kiện
    description: "/nhiemvu: mỗi người mỗi ngày nhận vài nhiệm vụ ngẫu nhiên (cố định trong ngày, đổi lúc 0 giờ) từ danh sách dưới. Khối người chơi tự đặt rồi phá không được tính."
    apply: [dmm reload]
    settings:
      - { key: nv_on, label: Bật nhiệm vụ hằng ngày, type: select, file: plugins/DuckyMoMoCore/config.yml, path: daily-quests.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: nv_per_day, label: Số nhiệm vụ mỗi ngày, type: int, min: 1, max: 10, file: plugins/DuckyMoMoCore/config.yml, path: daily-quests.per-day }
      - { key: nv_bonus, label: Thưởng thêm khi xong hết trong ngày, type: rewards, file: plugins/DuckyMoMoCore/config.yml, path: daily-quests.complete-all-rewards }
      - { key: nv_pool, label: Danh sách nhiệm vụ, type: quests, file: plugins/DuckyMoMoCore/config.yml, path: daily-quests.pool,
          note: "Mục tiêu: tên vật liệu/mob tiếng Anh, cách nhau dấu phẩy. *_ORE = mọi quặng, *_LOG = mọi khúc gỗ, * = tất cả, @HOSTILE = mọi quái thù địch." }

  - title: Vòng quay miễn phí
    category: Thưởng & sự kiện
    description: "/vongquay: chơi thật (không tính treo máy) đủ số phút thì được 1 vé quay. Vé miễn phí, KHÔNG bán, không trao đổi (luật Mojang, không pay-to-win). Menu trong game hiện tỉ lệ từng phần thưởng."
    apply: [dmm reload]
    settings:
      - { key: vq_on, label: Bật vòng quay, type: select, file: plugins/DuckyMoMoCore/config.yml, path: lucky-spin.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: vq_minutes, label: Số phút chơi thật cho 1 vé, type: int, min: 5, max: 1440, file: plugins/DuckyMoMoCore/config.yml, path: lucky-spin.minutes-per-key }
      - { key: vq_max, label: Giữ tối đa bao nhiêu vé, type: int, min: 1, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: lucky-spin.max-keys,
          note: "Đầy vé thì ngừng tích, để người chơi quay đều thay vì để dành." }
      - { key: vq_prizes, label: Phần thưởng và tỉ lệ, type: spin, file: plugins/DuckyMoMoCore/config.yml, path: lucky-spin.prizes,
          note: "Trọng số càng lớn càng dễ trúng; % tự tính. Chỉ nên đặt tài nguyên, xu, đồ trang trí: đồ quá mạnh làm lệch chiến tranh." }

  - title: Mảnh sự kiện & đổi quà
    category: Thưởng & sự kiện
    description: "Mảnh là đồ vật (trao đổi, bán được), có dấu ẩn nên không làm giả được. /doimanh mở cửa hàng đổi quà. Phát từ phần thưởng (loại Mảnh sự kiện, có giới hạn mỗi ngày) hoặc admin/boss: /doimanh give <người> <loại> <số>."
    apply: [dmm reload]
    settings:
      - { key: fm_on, label: Bật mảnh sự kiện, type: select, file: plugins/DuckyMoMoCore/config.yml, path: event-fragments.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: fm_cap, label: Mỗi người nhận tối đa (mảnh/ngày) từ phần thưởng, type: int, min: 0, max: 10000, file: plugins/DuckyMoMoCore/config.yml, path: event-fragments.daily-cap,
          note: "Chống tài khoản phụ cày mảnh. 0 = không giới hạn. Mảnh từ /doimanh give (boss, admin) không tính." }
      - { key: fm_types, label: Các loại mảnh, type: fragtypes, file: plugins/DuckyMoMoCore/config.yml, path: event-fragments.types,
          note: "Hạn đổi: hết ngày đó thì cửa hàng không nhận loại mảnh này nữa (để trống = không hạn)." }
      - { key: fm_shop, label: Cửa hàng đổi mảnh, type: fragshop, file: plugins/DuckyMoMoCore/config.yml, path: event-fragments.shop,
          note: "Giá: mã loại mảnh + số, nhiều loại cách dấu phẩy (vd lamnguy 40). Chỉ nên đặt tài nguyên, xu, đồ trang trí." }

  - title: Liên minh Hoà Bình
    info: "Là gì: một quốc gia duy nhất do server quản lý, thủ đô ở kinh đô (spawn).\nQuyền lợi: thị trấn vào liên minh không bị vây (sau thời gian chờ).\nĐổi lại: trả phí bảo hộ, không đánh ai.\nLưu ý: vùng vây vẫn có thể trùm lên đất hoà bình, dân được báo trước để di tản."
    category: Thị trấn
    description: "Quốc gia duy nhất được hoà bình, do server quản lý, thủ đô là kinh đô ở spawn. Thị trưởng vào/rời bằng /hoabinh. Lập lần đầu: admin đứng giữa spawn gõ /dmm hoabinh setup rồi /dmm hoabinh claim 14."
    apply: [dmm reload]
    settings:
      - { key: peace_join_wait, label: Vào liên minh chờ bao nhiêu ngày mới hoà bình, type: int, min: 0, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: peace-alliance.join-wait-days,
          note: "Trong lúc chờ vẫn có thể bị vây." }
      - { key: peace_rejoin, label: Rời liên minh bao nhiêu ngày mới vào lại, type: int, min: 0, max: 90, file: plugins/DuckyMoMoCore/config.yml, path: peace-alliance.rejoin-cooldown-days }
      - { key: peace_plot_base, label: Giá mua ô đất hoà bình - giá gốc, type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: peace-alliance.plot-base-price }
      - { key: peace_plot_step, info: "Là gì: giá ô đất hoà bình tăng dần khi liên minh càng rộng, để đất hoà bình không lan quá nhanh.\nCông thức: giá 1 ô = giá gốc + số này × tổng ô liên minh đang có.\nVí dụ: giá gốc 100, số này 2, đang có 50 ô → 100 + 2×50 = 200.", label: Giá mua ô đất hoà bình - cộng thêm mỗi ô liên minh đang có, type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: peace-alliance.plot-price-per-plot,
          note: "Giá 1 ô = giá gốc + số này × tổng ô của các thị trấn hoà bình (không tính kinh đô)." }
      - { key: peace_fee, label: Phí bảo hộ mỗi ô mỗi ngày, type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: peace-alliance.protection-fee-per-plot,
          note: "Cộng vào phí duy trì thị trấn của Towny." }
      - { key: peace_sell_bonus, label: Bán cho server (/sell) trong kinh đô được thêm (%), type: number, min: 0, max: 200, file: plugins/DuckyMoMoCore/config.yml, path: peace-alliance.sell-bonus-percent }
      - { key: peace_tax_inside, info: "Là gì: thuế shop rương (QuickShop) đặt trong đất hoà bình.\nCách ghi: số từ 0 đến 1, vd 0.02 = 2%.\nGợi ý: để thấp hơn bên ngoài nếu muốn kéo buôn bán về kinh đô.", label: Thuế shop rương trong đất hoà bình (0,05 = 5%), type: number, min: 0, max: 1, file: plugins/DuckyMoMoCore/config.yml, path: peace-alliance.shop-tax-inside }
      - { key: peace_tax_outside, info: "Là gì: thuế shop rương ngoài đất hoà bình.\nCách ghi: số từ 0 đến 1, vd 0.05 = 5%.", label: Thuế shop rương ngoài đất hoà bình (0,05 = 5%), type: number, min: 0, max: 1, file: plugins/DuckyMoMoCore/config.yml, path: peace-alliance.shop-tax-outside }
      - { key: peace_auction_only, label: Chợ đấu giá /ah chỉ mở trong đất hoà bình, type: select, file: plugins/DuckyMoMoCore/config.yml, path: peace-alliance.auction-only-in-peace,
          options: [ { value: true, label: Có }, { value: false, label: "Không (mở ở mọi nơi)" } ] }
      - { key: peace_warn_days, label: Báo dân hoà bình di tản trước ngày công thành (ngày), type: number, min: 0, max: 7, file: plugins/DuckyMoMoCore/config.yml, path: peace-alliance.siege-warn-days-before }
      - { key: peace_remind, label: Nhắc trước mỗi phiên công thành (phút), type: list, items: int, file: plugins/DuckyMoMoCore/config.yml, path: peace-alliance.siege-remind-minutes,
          note: "Ví dụ: 60, 10" }

  - title: Hội đồng Hoà Bình
    category: Thị trấn
    description: "Thị trưởng các thị trấn hoà bình bầu đại diện, bỏ phiếu duyệt giấy phép, đuổi thị trấn làm tay sai, bãi nhiệm (/hoidong)."
    apply: [dmm reload]
    settings:
      - { key: council_min_active, label: "Thị trấn cần bao nhiêu dân hoạt động mới có phiếu", type: int, min: 0, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: council.min-active-residents }
      - { key: council_term, label: "Nhiệm kỳ đại diện (ngày)", type: int, min: 1, max: 365, file: plugins/DuckyMoMoCore/config.yml, path: council.term-days }
      - { key: council_election, label: "Bầu cử kéo dài (ngày, ở cuối nhiệm kỳ)", type: int, min: 1, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: council.election-days }
      - { key: council_max_terms, label: "Tối đa số nhiệm kỳ liền", type: int, min: 1, max: 10, file: plugins/DuckyMoMoCore/config.yml, path: council.max-terms }
      - { key: council_motion_days, label: "Hạn bỏ phiếu kiến nghị (ngày)", type: int, min: 1, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: council.motion-days }

  - title: Tổ chức và giấy phép
    category: Thị trấn
    description: "Dân hoà bình lập tổ chức, xin giấy phép Thương Hội / Tổ chức Sự kiện (/tochuc). Hội đồng Hoà Bình duyệt."
    apply: [dmm reload]
    settings:
      - { key: org_min_members, label: "Số thành viên tối thiểu để xin giấy phép", type: int, min: 1, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: organizations.min-members }
      - { key: org_weekly_fee, label: "Phí giấy phép mỗi tuần (xu, trừ vào quỹ tổ chức)", type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: organizations.weekly-fee }
      - { key: org_slots_trade, label: "Số suất Thương Hội", type: int, min: 0, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: organizations.slots.thuonghoi }
      - { key: org_slots_event, label: "Số suất Tổ chức Sự kiện", type: int, min: 0, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: organizations.slots.sukien }
      - { key: org_ad_cooldown, label: "Thương Hội rao hàng /quangcao cách nhau (phút)", type: int, min: 0, max: 1440, file: plugins/DuckyMoMoCore/config.yml, path: organizations.ad-cooldown-minutes }
      - { key: org_event_hours, label: "Điểm dịch chuyển sự kiện giữ trong (giờ)", type: int, min: 1, max: 168, file: plugins/DuckyMoMoCore/config.yml, path: organizations.event-teleport-hours }

  - title: Bảng xếp hạng mùa
    info: "Bá Chủ: quốc gia, điểm lãnh thổ + công thành.\nChiến Thần: cá nhân, hạ người có quân hàm, chiếm cờ.\nĐại Phú Hộ: tiền.\nKiến Trúc Sư: bình chọn công trình.\nChụp điểm: điểm lãnh thổ chụp mỗi tuần vào ngày/giờ đặt bên dưới."
    category: Chiến tranh
    description: "Bá Chủ, Chiến Thần, Đại Phú Hộ, Kiến Trúc Sư (/bxh). Đóng mùa: /bxh dongmua, sau 3 ngày khiếu nại: /bxh traothuong. Đổi mã mùa = xoá điểm (giữ danh hiệu)."
    apply: [dmm reload]
    settings:
      - { key: lb_season, info: "Là gì: mã mùa đang chạy, vd mua1.\nLưu ý: ĐỔI MÃ = điểm xếp hạng về 0 cho mùa mới (danh hiệu đã trao vẫn giữ). Chỉ đổi khi mở mùa mới.", label: "Mã mùa", type: text, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.season }
      - { key: lb_season_start, label: "Ngày bắt đầu mùa (yyyy-mm-dd)", type: text, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.season-start,
          note: "Trống = chưa mở mùa (không tính tuần đại chiến, đăng ký Kiến Trúc Sư)." }
      - { key: lb_double_week, info: "Là gì: tuần thứ mấy của mùa (tính từ ngày bắt đầu) là tuần đại chiến.\nTác dụng: điểm lãnh thổ nhân đôi trong tuần đó.", label: "Tuần đại chiến (điểm lãnh thổ ×2)", type: int, min: 0, max: 52, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.double-week }
      - { key: lb_register_week, label: "Kiến Trúc Sư: tuần mở đăng ký", type: int, min: 0, max: 52, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.register-week }
      - { key: lb_vote_week, label: "Kiến Trúc Sư: tuần bình chọn", type: int, min: 0, max: 52, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.vote-week }
      - { key: lb_snapshot_day, label: "Ngày chụp điểm lãnh thổ hằng tuần", type: select, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.snapshot-day,
          options: [ { value: MONDAY, label: Thứ 2 }, { value: TUESDAY, label: Thứ 3 }, { value: WEDNESDAY, label: Thứ 4 }, { value: THURSDAY, label: Thứ 5 }, { value: FRIDAY, label: Thứ 6 }, { value: SATURDAY, label: Thứ 7 }, { value: SUNDAY, label: Chủ nhật } ] }
      - { key: lb_snapshot_time, label: "Giờ chụp điểm (HH:mm)", type: text, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.snapshot-time }
      - { key: lb_pts_town, label: "Điểm mỗi thị trấn kiểm soát mỗi tuần", type: int, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.points.town }
      - { key: lb_plots_per_point, info: "Là gì: điểm lãnh thổ Bá Chủ, chụp mỗi tuần: quốc gia được 1 điểm cho mỗi ngần này ô đất đang giữ (cộng thêm điểm theo số thị trấn).", label: "Bao nhiêu ô đất được 1 điểm", type: int, min: 1, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.plots-per-point }
      - { key: lb_pts_attack, label: "Điểm tấn công thắng", type: int, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.points.attack-win }
      - { key: lb_pts_defend, label: "Điểm phòng thủ thắng", type: int, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.points.defend-win }
      - { key: lb_pts_revolt, label: "Điểm khởi nghĩa thắng", type: int, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.points.revolt-win }
      - { key: lb_pts_kill, label: "Chiến Thần: điểm mỗi lần hạ người có quân hàm", type: int, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.points.kill }
      - { key: lb_pts_banner, label: "Chiến Thần: điểm chiếm cờ", type: int, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.points.banner }
      - { key: lb_kill_cap, info: "Là gì: chống cày điểm Chiến Thần.\nTác dụng: hạ đi hạ lại cùng một người trong một phiên công thành chỉ tính tối đa ngần này lần.", label: "Hạ cùng một người tối đa mấy lần mỗi phiên", type: int, min: 1, max: 20, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.kill-cap }
      - { key: lb_title_hours, label: "Danh hiệu: giờ chơi thật tối thiểu trong mùa", type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.title-min-hours }
      - { key: lb_title_week, label: "Danh hiệu cả quốc gia: phải là thành viên trước tuần", type: int, min: 0, max: 52, file: plugins/DuckyMoMoCore/config.yml, path: leaderboard.title-member-before-week }

  - title: Án và Hội Bàn Tròn
    info: "Mở án: giết dân hoà bình thì tự mở án.\nXử án: Hội Bàn Tròn (vua các quốc gia top Bá Chủ) họp TRỰC TIẾP tại chỗ trong đất hoà bình vào giờ họp, bỏ phiếu mức phạt: bồi thường, truy nã, tù, lưu đày.\nLưu ý: không có án thì không họp. Admin chỉ quan sát."
    category: Chiến tranh
    description: "Giết dân hoà bình trong đất hoà bình + dải đệm thì mở án; Hội Bàn Tròn họp tại chỗ để xử (/bantron). Không có việc thì không họp. Nhà tù: admin gõ /setjail nhatu ở nhà tù kinh đô."
    apply: [dmm reload]
    settings:
      - { key: jus_buffer, info: "Là gì: dải đệm quanh đất hoà bình.\nTác dụng: giết dân hoà bình trong đất hoà bình HOẶC trong dải này là tự mở án cho Hội Bàn Tròn xử.", label: "Dải đệm quanh đất hoà bình (block)", type: int, min: 0, max: 1000, file: plugins/DuckyMoMoCore/config.yml, path: justice.buffer-blocks }
      - { key: jus_self_defense, info: "Là gì: luật tự vệ.\nTác dụng: nạn nhân (dân hoà bình) đánh trước trong ngần này giây thì không mở án.", label: "Tự vệ: nạn nhân đánh trước trong (giây)", type: int, min: 0, max: 600, file: plugins/DuckyMoMoCore/config.yml, path: justice.self-defense-seconds }
      - { key: jus_floor, label: "Mức sàn: tiền bồi thường (xu)", type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: justice.floor-fine,
          note: "Chưa cân kinh tế nên để chỉnh ở đây." }
      - { key: jus_repeat, label: "Tái phạm: mức sàn nhân", type: number, min: 1, file: plugins/DuckyMoMoCore/config.yml, path: justice.repeat-multiplier }
      - { key: jus_heavy, info: "Là gì: mức phạt nặng.\nCông thức: bồi thường = mức sàn × số này (Hội Bàn Tròn chọn mức khi bỏ phiếu).", label: "Phạt nặng: tổng bồi thường gấp", type: number, min: 1, file: plugins/DuckyMoMoCore/config.yml, path: justice.heavy-multiplier }
      - { key: jus_bounty_days, label: "Truy nã (ngày)", type: int, min: 1, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: justice.bounty-days }
      - { key: jus_jail, label: "Tù (phút, chỉ tính lúc online)", type: int, min: 1, max: 1440, file: plugins/DuckyMoMoCore/config.yml, path: justice.jail-minutes }
      - { key: jus_exile, label: "Lưu đày: cấm vào đất hoà bình (ngày)", type: int, min: 1, max: 90, file: plugins/DuckyMoMoCore/config.yml, path: justice.exile-days }
      - { key: jus_exile_spawn, label: "Nơi đưa người bị cấm ra (x y z)", type: text, file: plugins/DuckyMoMoCore/config.yml, path: justice.exile-spawn,
          note: "Trống = ngoài vòng kinh đô về phía đông." }
      - { key: jus_rt_day, label: "Hội Bàn Tròn họp ngày", type: select, file: plugins/DuckyMoMoCore/config.yml, path: justice.roundtable.day,
          options: [ { value: MONDAY, label: Thứ 2 }, { value: TUESDAY, label: Thứ 3 }, { value: WEDNESDAY, label: Thứ 4 }, { value: THURSDAY, label: Thứ 5 }, { value: FRIDAY, label: Thứ 6 }, { value: SATURDAY, label: Thứ 7 }, { value: SUNDAY, label: Chủ nhật } ] }
      - { key: jus_rt_time, label: "Giờ họp (HH:mm)", type: text, file: plugins/DuckyMoMoCore/config.yml, path: justice.roundtable.time }
      - { key: jus_rt_seats, info: "Là gì: số quốc gia đứng đầu bảng Bá Chủ được ghế ở Hội Bàn Tròn (đại diện là vua quốc gia đó).", label: "Số ghế quốc gia (top Bá Chủ)", type: int, min: 1, max: 20, file: plugins/DuckyMoMoCore/config.yml, path: justice.roundtable.seats }
      - { key: jus_rt_min, info: "Là gì: số ghế phải có mặt tại chỗ thì mới họp.\nThiếu ghế: án dời sang lần họp sau.", label: "Số ghế tối thiểu để họp", type: int, min: 1, max: 20, file: plugins/DuckyMoMoCore/config.yml, path: justice.roundtable.min-seats }
      - { key: jus_rt_radius, label: "Phải đứng cách bàn tròn tối đa (block)", type: int, min: 2, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: justice.roundtable.table-radius }
      - { key: jus_rt_notp_radius, label: "Cấm dịch chuyển tới gần nơi họp (block)", type: int, min: 0, max: 2000, file: plugins/DuckyMoMoCore/config.yml, path: justice.roundtable.no-teleport-radius }
      - { key: jus_rt_notp_min, label: "Cấm dịch chuyển từ trước giờ họp (phút)", type: int, min: 0, max: 1440, file: plugins/DuckyMoMoCore/config.yml, path: justice.roundtable.no-teleport-minutes }
      - { key: jus_rt_deadline, label: "Đại diện chọn nơi họp trước (giờ)", type: int, min: 0, max: 168, file: plugins/DuckyMoMoCore/config.yml, path: justice.roundtable.choose-deadline-hours }
      - { key: jus_rt_item, label: "Mỗi việc chờ phiếu tối đa (phút)", type: int, min: 1, max: 120, file: plugins/DuckyMoMoCore/config.yml, path: justice.roundtable.item-minutes }

  - title: Cửa hàng trang trí (/cuahang)
    category: Shop
    description: "Bán vật liệu cơ bản, đồ trang trí và danh hiệu bằng xu trong game, không bán gì tăng sức mạnh. Mọi người mua ở NPC tại spawn; rank ủng hộ mở /cuahang khi đứng trong kinh đô. Bán được cả đồ trong Thư viện đồ."
    apply: [dmm reload]
    settings:
      - { key: decor_enabled, label: "Bật cửa hàng", type: select, file: plugins/DuckyMoMoCore/config.yml, path: decor-shop.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: decor_materials, label: "Vật liệu cơ bản", type: shopitems, file: plugins/DuckyMoMoCore/config.yml, path: decor-shop.materials,
          note: "Giá mỗi cái phải CAO hơn giá thu mua /sell, không thì món tự bị bỏ (chống mua rồi bán lại lấy lời)." }
      - { key: decor_items, label: "Đồ trang trí", type: shopitems, file: plugins/DuckyMoMoCore/config.yml, path: decor-shop.items,
          note: "Số lượng = số món mỗi lần bấm mua; giá = giá cả lô." }
      - { key: decor_titles, label: "Danh hiệu bán bằng xu", type: shoptitles, file: plugins/DuckyMoMoCore/config.yml, path: decor-shop.titles,
          note: "Người chơi chọn hiển thị bằng /danhhieu." }

  - title: Chơi lại từ đầu (/choilai)
    category: Hệ thống
    description: "Người chơi tự chơi lại: mất đồ, tiền, nhà, nghề, thị trấn, giờ chơi thật; giữ rank, danh hiệu, án. Phải dỡ shop rương và rút hàng đấu giá trước. Sao lưu dữ liệu 7 ngày ở plugins/DuckyMoMoCore/choilai-backup."
    apply: [dmm reload]
    settings:
      - { key: reset_enabled, label: Bật /choilai, type: select, file: plugins/DuckyMoMoCore/config.yml, path: player-reset.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: reset_cooldown, label: Mỗi lần cách nhau (ngày), type: int, min: 0, max: 90, file: plugins/DuckyMoMoCore/config.yml, path: player-reset.cooldown-days }
      - { key: reset_max, label: Tối đa số lần mỗi mùa, type: int, min: 0, max: 20, file: plugins/DuckyMoMoCore/config.yml, path: player-reset.max-per-season }
      - { key: reset_gift_first, label: Quà tân thủ và tiền khởi đầu, type: select, file: plugins/DuckyMoMoCore/config.yml, path: player-reset.gift-first-only,
          options: [ { value: true, label: "Chỉ lần chơi lại đầu tiên trong mùa" }, { value: false, label: "Lần nào cũng có" } ] }
      - { key: reset_money, label: Tiền khởi đầu khi chơi lại, type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: player-reset.starting-money }
      - { key: reset_kit, label: Bộ quà tân thủ (kit Essentials), type: text, file: plugins/DuckyMoMoCore/config.yml, path: player-reset.kit }
      - { key: reset_season, label: Mã mùa (đổi khi sang mùa mới để đếm lại), type: text, file: plugins/DuckyMoMoCore/config.yml, path: player-reset.season }

  - title: Luật công thành
    category: Chiến tranh
    apply: [swa reload]
    settings:
      - { key: siege_max_attacks, label: Số cuộc vây tấn công tối đa mỗi quốc gia, type: int, min: 1, max: 10,
          file: plugins/SiegeWar/config.yml, path: war.siege.quantities.max_active_siege_attacks_per_nation }
      - { key: siege_warchest_per_plot, info: "Là gì: tiền cọc bên tấn công phải đặt khi cắm cờ vây.\nCông thức: số này × số ô đất của thị trấn bị vây.\nKết quả: thắng thì lấy lại kèm chiến lợi phẩm, thua thì mất cho bên thủ.", label: Quỹ chiến tranh (tiền / ô đất của thị trấn bị vây), type: number, min: 0,
          file: plugins/SiegeWar/config.yml, path: war.siege.money.warchest_cost_per_plot }
      - { key: siege_immunity_hours, info: "Là gì: thời gian miễn vây sau khi một cuộc vây kết thúc.\nLưu ý: thủ đô được gấp đôi.", label: Miễn vây sau một cuộc vây (giờ), type: int, min: 0,
          file: plugins/SiegeWar/config.yml, path: war.siege.times.siege_immunity_post_siege_hours,
          note: "Thủ đô được gấp đôi." }
      - { key: siege_immunity_new_town_hours, label: Miễn vây cho thị trấn mới lập (giờ), type: int, min: 0,
          file: plugins/SiegeWar/config.yml, path: war.siege.times.siege_immunity_time_new_town_hours }

  - title: Thị trấn và quốc gia
    category: Thị trấn
    apply: [ta reload config]
    settings:
      - { key: towny_price_new_town,   label: Phí lập thị trấn,   type: number, min: 0, file: plugins/Towny/settings/config.yml, path: economy.new_expand.price_new_town }
      - { key: towny_price_new_nation, label: Phí lập quốc gia,   type: number, min: 0, file: plugins/Towny/settings/config.yml, path: economy.new_expand.price_new_nation }
      - { key: towny_price_claim,      label: Giá mua 1 ô đất,     type: number, min: 0, file: plugins/Towny/settings/config.yml, path: economy.new_expand.price_claim_townblock }
      - { key: towny_homeblock_distance, label: Khoảng cách tối thiểu giữa nhà chính hai thị trấn (ô), type: int, min: 0, max: 100, file: plugins/Towny/settings/config.yml, path: claiming.distance_rules.min_distance_between_homeblocks,
          note: "1 ô = 16 block. 10 ô = 160 block (chốt 14/10)." }
      - { key: towny_town_upkeep, info: "Là gì: phí thị trấn trả mỗi ngày mới (giờ Towny, xem /towny time), trừ từ ngân khố.\nLưu ý: hết tiền trả thì thị trấn bị giải tán.",      label: Phí duy trì thị trấn mỗi ngày,  type: number, min: 0, file: plugins/Towny/settings/config.yml, path: economy.daily_taxes.price_town_upkeep }
      - { key: towny_nation_upkeep,    label: Phí duy trì quốc gia mỗi ngày,  type: number, min: 0, file: plugins/Towny/settings/config.yml, path: economy.daily_taxes.price_nation_upkeep }

  - title: Kinh tế
    category: Kinh tế
    description: Tiền dùng riêng trong Bang Hội Chiến. Nguồn tiền khởi đầu là /sell (bán đồ cho server theo bảng giá Essentials/worth.yml).
    apply: [essentials reload]
    settings:
      - { key: eco_starting_balance, label: Tiền khởi đầu cho người mới, type: int, min: 0, max: 1000000,
          file: plugins/Essentials/config.yml, path: starting-balance,
          note: "Chỉ áp dụng cho người vào lần đầu sau khi đổi. Lập thị trấn tốn phí ở nhóm Thị trấn và quốc gia." }
      - key: eco_per_player_locale
        label: Tin nhắn EssentialsX theo ngôn ngữ máy người chơi
        type: select
        file: plugins/Essentials/config.yml
        path: per-player-locale
        options: [ { value: true, label: "Có (máy để tiếng Việt thì thấy tiếng Việt)" }, { value: false, label: Không (tiếng Anh) } ]

  - title: Combat
    category: PvP & combat
    apply: [ocm reload]
    settings:
      - key: combat_mode
        label: Kiểu combat
        type: select
        file: plugins/OldCombatMechanics/config.yml
        path: worlds.__default__
        options:
          - { value: [old],      label: "1.8 (cũ), bắt buộc mọi người" }
          - { value: [new],      label: "Mới (1.9+), bắt buộc mọi người" }
          - { value: [old, new], label: "Mặc định 1.8, người chơi tự đổi được (/ocm mode)" }
          - { value: [new, old], label: "Mặc định mới, người chơi tự đổi được (/ocm mode)" }
        note: "Cho tự đổi thì người chơi có thể chọn kiểu có lợi cho mình."

  - title: Thế giới
    category: Thế giới
    settings:
      # Viền hình chữ nhật bằng ChunkyBorder (viền vanilla chỉ vuông). Map Trái Đất 1:1000 (từ 11/10/2026): 21504 x 10752; 1:2000: 10752 x 5376.
      # Mỗi mùa một vùng (cách 3, 12/10/2026): viền chữ nhật quanh vùng của mùa. Mùa 1: Đông Nam Á lục địa + Nam Trung Quốc,
      # tâm (12500, -2000), bán kính 1300 x 1200 (x 11200..13800, z -3200..-800). Cả Trái Đất: tâm 0 0, bán kính 21504 x 10752.
      - { key: border_center_x, label: Tâm viền, toạ độ X, type: int, min: -29000000, max: 29000000,
          commands: ["worldborder set 59999968", "chunky world world", "chunky shape rectangle", "chunky center {border_center_x} {border_center_z}",
                     "chunky radius {border_x} {border_z}", "chunky border add world"],
          note: "Mùa 1 (Đông Nam Á): 12500. Cả Trái Đất: 0. 1 độ kinh ≈ 119,5 block." }
      - { key: border_center_z, label: Tâm viền, toạ độ Z, type: int, min: -29000000, max: 29000000,
          commands: ["worldborder set 59999968", "chunky world world", "chunky shape rectangle", "chunky center {border_center_x} {border_center_z}",
                     "chunky radius {border_x} {border_z}", "chunky border add world"],
          note: "Mùa 1: -2000. Cả Trái Đất: 0. Z = -vĩ độ x 119,5." }
      - { key: border_x, label: Viền thế giới, bán kính Đông–Tây (block), type: int, min: 500, max: 29000000,
          commands: ["worldborder set 59999968", "chunky world world", "chunky shape rectangle", "chunky center {border_center_x} {border_center_z}",
                     "chunky radius {border_x} {border_z}", "chunky border add world"],
          note: "Áp dụng ngay. Mùa 1: 1300. Cả Trái Đất 1:1000: 21504." }
      - { key: border_z, label: Viền thế giới, bán kính Bắc–Nam (block), type: int, min: 500, max: 29000000,
          commands: ["worldborder set 59999968", "chunky world world", "chunky shape rectangle", "chunky center {border_center_x} {border_center_z}",
                     "chunky radius {border_x} {border_z}", "chunky border add world"],
          note: "Mùa 1: 1200. Cả Trái Đất 1:1000: 10752." }
      - { key: spawn_x, label: Điểm spawn, toạ độ X, type: int, min: -29000000, max: 29000000,
          commands: ["execute in minecraft:overworld run forceload add {spawn_x} {spawn_z}",
                     "execute in minecraft:overworld positioned {spawn_x} 0 {spawn_z} positioned over motion_blocking_no_leaves run setworldspawn ~ ~ ~",
                     "execute in minecraft:overworld run forceload remove {spawn_x} {spawn_z}"],
          note: "Độ cao tự lấy theo mặt đất. Map Trái Đất 1:1000: 1 độ kinh/vĩ ≈ 119,5 block (Hà Nội ≈ 12646, -2512)." }
      - { key: spawn_z, label: Điểm spawn, toạ độ Z, type: int, min: -29000000, max: 29000000,
          commands: ["execute in minecraft:overworld run forceload add {spawn_x} {spawn_z}",
                     "execute in minecraft:overworld positioned {spawn_x} 0 {spawn_z} positioned over motion_blocking_no_leaves run setworldspawn ~ ~ ~",
                     "execute in minecraft:overworld run forceload remove {spawn_x} {spawn_z}"] }
      - key: map_type
        label: Loại map
        type: select
        options: [ { value: natural, label: Map tự nhiên }, { value: earth, label: "Map Trái Đất tự tạo (tools/earthmap)" } ]
        note: "Chỉ ghi lại; áp dụng khi mở mùa mới (đổi giữa mùa người chơi mất thành)."
      - { key: map_url, label: Link tải map (nếu dùng map tải sẵn), type: text, note: "Map tải về: kiểm tra giấy phép trước khi dùng." }
      - key: reset_each_season
        label: Reset thế giới mỗi mùa
        type: select
        options: [ { value: true, label: Có }, { value: false, label: Không } ]
        note: "Chỉ ghi lại; dùng khi mở mùa mới."

  - title: Khai hoang vùng mới (/khaihoang)
    category: Thế giới
    description: "Cả server góp chung một quỹ: bán đồ bằng /sell (tính % tiền bán, người bán không mất gì) và góp thẳng /khaihoang gop <xu>. Đủ mốc thì tự nới viền bản đồ (lệnh trong plugins/DuckyMoMoCore/config.yml, frontier.goals). SAU KHI MỞ MỐC: sửa 4 ô Tâm viền / Viền thế giới ở nhóm Thế giới cho khớp, không thì Áp dụng lại tất cả sẽ thu viền về cũ."
    apply: [dmm reload]
    settings:
      - { key: kh_on, label: Bật khai hoang, type: select, file: plugins/DuckyMoMoCore/config.yml, path: frontier.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: kh_sell, label: "% tiền bán /sell tính vào quỹ", type: number, min: 0, max: 1000, file: plugins/DuckyMoMoCore/config.yml, path: frontier.sell-percent,
          note: "Chỉ để đếm, người bán vẫn nhận đủ tiền. 100 = bán 1 xu thì quỹ +1." }
      - { key: kh_g1, label: "Mốc 1: Mã Lai + Singapore (xu)", type: number, min: 1, file: plugins/DuckyMoMoCore/config.yml, path: frontier.goals.0.need,
          note: "Sau khi mở: Tâm viền 12500 / -1650, bán kính 1300 x 1550." }
      - { key: kh_g2, label: "Mốc 2: Philippines (xu)", type: number, min: 1, file: plugins/DuckyMoMoCore/config.yml, path: frontier.goals.1.need,
          note: "Sau khi mở: Tâm viền 13150 / -1650, bán kính 1950 x 1550." }
      - { key: kh_g3, label: "Mốc 3: Borneo + Java (xu)", type: number, min: 1, file: plugins/DuckyMoMoCore/config.yml, path: frontier.goals.2.need,
          note: "Sau khi mở: Tâm viền 13150 / -1050, bán kính 1950 x 2150." }

  - title: Treo thưởng (/treothuong)
    category: PvP & combat
    description: "Người chơi bỏ tiền treo thưởng lên đầu người khác, ai hạ được nhận hết; hết hạn trả lại tiền. Hệ thống tự treo người có chuỗi giết dài (tiền hệ thống tạo thêm). Không tính giết tài khoản phụ, cùng IP; không treo lên dân Liên minh Hoà Bình."
    apply: [dmm reload]
    settings:
      - { key: tt_on, label: Bật treo thưởng, type: select, file: plugins/DuckyMoMoCore/config.yml, path: bounty.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: tt_min, label: Treo ít nhất (xu), type: number, min: 1, file: plugins/DuckyMoMoCore/config.yml, path: bounty.min }
      - { key: tt_max, label: Tổng treo tối đa lên một người (xu), type: number, min: 1, file: plugins/DuckyMoMoCore/config.yml, path: bounty.max-total }
      - { key: tt_fee, label: Phí treo (%), type: number, min: 0, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: bounty.fee-percent }
      - { key: tt_days, label: Hết hạn sau (ngày), type: int, min: 1, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: bounty.days }
      - { key: tt_streak, label: Hệ thống tự treo khi giết liền (mạng), type: int, min: 2, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: bounty.streak.kills }
      - { key: tt_streak_xu, label: "Hệ thống treo lần đầu (xu, 0 = tắt)", type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: bounty.streak.reward }
      - { key: tt_streak_them, label: Mỗi mạng thêm sau đó (xu), type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: bounty.streak.per-kill }

  - title: Pet chiến đấu (MyPet)
    category: PvP & combat
    info: "Là gì: pet bắt bằng dây xích (MyPet), đánh quái và người chơi. Lúc bắt mọi loài như nhau; lớn lên theo hệ người chơi chọn + bản tính loài (10 nhóm loài, đặc tính riêng). Bảng nhóm loài: trang web mục Pet; sửa bằng tools/mypet/sinh-cay-ky-nang.py (không sửa trên trang này).\nGiảm sát thương: pet đánh người chơi bị giảm %, áp dụng mọi nơi.\nCông thành: mỗi phiên bốc thăm có cho pet tham chiến không; phiên không cho thì pet không gây sát thương cho người chơi trong vùng vây.\nNgười chơi xem: /lichcongthanh, có báo trước khi phiên bắt đầu."
    description: "Người chơi biết trước phiên nào có pet: /lichcongthanh, tin báo trước 60 và 10 phút, tin lúc vào game."
    apply: [dmm reload]
    settings:
      - { key: petc_reduce, label: Pet đánh người chơi bị giảm (%), type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.player-damage-reduce-percent,
          info: "Là gì: pet gây sát thương lên NGƯỜI CHƠI bị giảm ngần này %. Đánh quái không bị giảm.\nVí dụ: 50 = pet đánh người chỉ còn một nửa; 100 = pet không làm người chơi mất máu.", note: "0 = không giảm." }
      - { key: petc_chance, label: Phiên công thành cho pet tham chiến (%), type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.siege-pet-chance,
          info: "Là gì: tỉ lệ phiên công thành được bốc thăm CHO pet tham chiến.\nCách bốc: cố định theo giờ bắt đầu từng phiên nên biết trước và báo trước được.\n0 = không bao giờ, 100 = luôn cho." }
      - { key: petc_seed, label: Mã bốc thăm, type: text, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.seed,
          info: "Là gì: chuỗi dùng để bốc thăm. Đổi chuỗi này = bốc thăm lại toàn bộ lịch (vd mỗi mùa một mã).\nLưu ý: đổi gần giờ công thành thì phiên đã báo có thể đổi kết quả." }
      - { key: petc_announce, label: Báo trước phiên (phút), type: list, items: int, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.announce-minutes,
          note: "Cách nhau dấu phẩy, ví dụ: 60, 10" }
      - { key: petc_nofly, label: Cấm bay bằng pet lúc công thành, type: select, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.siege-no-fly,
          options: [ { value: true, label: "Bật (mặc định)" }, { value: false, label: Tắt } ],
          info: "Là gì: lúc ĐANG có phiên đánh, trong vùng vây, người cưỡi pet bay (loài bay chọn hệ Thú Cưỡi) lên cao quá mức dưới thì bị đẩy xuống khỏi pet, được Rơi chậm 6 giây nên không mất máu.\nVẫn được: cưỡi chạy dưới đất, nhảy, bơi.\nNgoài vùng vây hoặc ngoài giờ đánh: bay bình thường.\nLưu xong: có hiệu lực ngay (dmm reload)." }
      - { key: petc_nofly_h, label: Tính là bay khi cao hơn mặt đất (khối), type: int, min: 2, max: 20, file: plugins/DuckyMoMoCore/config.yml, path: pet-combat.siege-no-fly-height,
          info: "Là gì: pet cưỡi cao hơn ngần này khối so với mặt đất thì tính là đang bay.\nGợi ý: 3. Nhảy thường cao khoảng 2 khối (ngựa nhảy cao tới khoảng 3-4), đặt thấp quá thì nhảy cũng bị đẩy xuống." }
      - { key: petc_slots_default, label: "Số pet giữ được: Dân (mọi người chơi)", type: int, min: 1, max: 20, servers: [banghoi-1],
          info: "Là gì: tổng số pet chiến đấu một người được giữ (1 con đang dẫn + số còn lại cất trong kho /petstore, đổi bằng /petswitch). Mỗi lúc vẫn chỉ gọi ra 1 con.\nRank: người có rank cao lấy số LỚN NHẤT trong rank của mình, các bậc dưới và nhóm Dân, nên đặt rank cao lớn hơn hoặc bằng rank thấp.\nKhi lưu: gỡ mức cũ rồi cấp quyền MyPet.petstorage.limit.<số - 1> cho nhóm này ở Bang Hội Chiến.",
          commands: [ "lp group default permission unset MyPet.petstorage.limit.1 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.2 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.3 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.4 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.5 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.6 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.7 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.8 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.9 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.10 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.11 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.12 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.13 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.14 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.15 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.16 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.17 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.18 server=banghoi-1", "lp group default permission unset MyPet.petstorage.limit.19 server=banghoi-1", "lp group default permission set MyPet.petstorage.limit.{minus1} true server=banghoi-1" ] }
      - { key: petc_slots_namtuoc, label: "Số pet giữ được: Nam Tước", type: int, min: 1, max: 20, servers: [banghoi-1],
          info: "Là gì: tổng số pet chiến đấu một người được giữ (1 con đang dẫn + số còn lại cất trong kho /petstore, đổi bằng /petswitch). Mỗi lúc vẫn chỉ gọi ra 1 con.\nRank: người có rank cao lấy số LỚN NHẤT trong rank của mình, các bậc dưới và nhóm Dân, nên đặt rank cao lớn hơn hoặc bằng rank thấp.\nKhi lưu: gỡ mức cũ rồi cấp quyền MyPet.petstorage.limit.<số - 1> cho nhóm này ở Bang Hội Chiến.",
