      - { key: wg_t1_hint, label: "Bậc 1 (dễ): dòng nhắc khi đứng gần (khối, 0 = không)", type: int, min: 0, max: 32, file: plugins/DuckyMoMoCore/config.yml, path: wild-gates.tiers.t1.hint-range }
