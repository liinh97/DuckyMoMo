  - title: Xưởng chế tạo (/xuong)
    category: Shop
    description: "Đồ đặc biệt theo logic HIỆU ỨNG + ĐỘ BỀN + THỜI HẠN, chế bằng xu + nguyên liệu xếp trên bàn chế 3×3. Hết độ bền hoặc hết hạn là biến mất (rút tiền và tài nguyên khỏi kinh tế)."
    info: "Mỗi món: tên, vật phẩm, hiệu ứng (chọn trong danh sách) + chỉ số, độ bền (số khối đào / đòn đánh / lần dùng; -1 = độ bền gốc của Minecraft), thời hạn (ngày), giá xu, 9 ô nguyên liệu bàn chế 3×3, phù phép.\nPhù phép ghi dạng: efficiency:4, sharpness:3 (gốc), enchantio:telepathy:1 (Enchantio), ce:Blast:1 (CrazyEnchantments).\n\"Mất tác dụng khi công thành\": món không có tác dụng trong vùng vây khi đang đánh (nên bật cho món đánh nhau, đào hầm, móc bay, dung nham).\nMón đã chế giữ độ bền / hạn lúc chế; đổi hiệu ứng thì món cũ cũng đổi theo (theo mã món).\nCờ Lê (lấy lồng quái) ảnh hưởng kinh tế: mặc định tắt.\nLưu xong: có hiệu lực ngay (dmm reload)."
    apply: [dmm reload]
    settings:
      - { key: xw_on, label: Bật Xưởng chế tạo, type: select, file: plugins/DuckyMoMoCore/config.yml, path: workshop.enabled, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: xw_items, label: Các món, type: workshop, file: plugins/DuckyMoMoCore/config.yml, path: workshop.items,
          note: "Chọn món từ Thư viện đồ (công dụng Kỹ năng đặc biệt: tên, phù phép, kỹ năng, độ bền, hạn sửa ở đó). Ở đây chỉ đặt giá, bàn chế 3×3 và món Tinh Luyện cần thêm." }

