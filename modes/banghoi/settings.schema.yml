  - title: Thanh máu quái và thú (HoloMobHealth)
    category: Hiển thị
    info: "Là gì: chữ hiện trên đầu quái/thú: tên, máu còn lại, % máu. Chỉ gửi cho người chơi (không thêm thực thể vào server).\nBoss EliteMobs: có thanh máu riêng của EliteMobs (đỉnh màn hình + vạch máu), không chỉnh ở đây.\nDùng khi bắt pet: đánh tới khi % máu thấp rồi quăng dây xích (/petcapturehelper xem điều kiện)."
    apply: [hmh reload]
    settings:
      - { key: hmh_dynamic, label: Khi nào hiện thanh máu, type: select, file: plugins/HoloMobHealth/config.yml, path: Options.DynamicHealthDisplay.Use,
          options: [ { value: true, label: "Chỉ khi bị đánh (gọn, khuyên dùng)" }, { value: false, label: "Luôn hiện với mọi con trong tầm" } ] }
      - { key: hmh_timeout, label: Giữ thanh máu sau khi bị đánh (giây), type: int, min: 1, max: 60, file: plugins/HoloMobHealth/config.yml, path: Options.DynamicHealthDisplay.Timeout }
      - { key: hmh_range, label: Tầm tính quái quanh người chơi (block), type: int, min: 5, max: 64, file: plugins/HoloMobHealth/config.yml, path: Options.Range.Distance,
          note: "Nhỏ hơn thì nhẹ server hơn. Đổi tầm cần khởi động lại Bang Hội Chiến." }
      - { key: hmh_text, label: Chữ hiển thị, type: text, file: plugins/HoloMobHealth/config.yml, path: Display.Text.0,
          info: "Mã: {Mob_Type_Or_Name} tên, {Health_0} máu, {MaxHealth_0} máu tối đa, {PercentageHealth_0} %, {DynamicColor} màu theo máu (xanh/vàng/đỏ), {ScaledSymbols} hàng trái tim." }
      - { key: hmh_damage, label: Số sát thương bay lên khi đánh, type: select, file: plugins/HoloMobHealth/config.yml, path: DamageIndicator.Enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }

  - title: Bảng bên phải, boss bar, danh sách Tab
    category: Hiển thị
    description: "Mã màu &a, &e, &l (đậm)... Biến: %player%, %online%, %ping%, %luckperms-prefix%, %vault_eco_balance_formatted%, %townyadvanced_town_unformatted%."
    apply: [tab reload]
    settings:
      - { key: tab_bossbar_tips, label: Boss bar trên cùng (mỗi dòng 1 mẹo, xoay vòng), type: lines, file: plugins/TAB/animations.yml, path: MeoChoi.texts }
      - { key: tab_bossbar_interval, label: Đổi mẹo mỗi (mili giây), type: int, min: 1000, max: 600000, file: plugins/TAB/animations.yml, path: MeoChoi.change-interval,
          note: "8000 = 8 giây." }
      - { key: tab_bossbar_enabled, label: Hiện boss bar, type: select, file: plugins/TAB/config.yml, path: bossbar.enabled,
          options: [ { value: true, label: Có }, { value: false, label: Không } ] }
      - { key: tab_sb_enabled, label: Hiện bảng bên phải, type: select, file: plugins/TAB/config.yml, path: scoreboard.enabled,
          options: [ { value: true, label: Có }, { value: false, label: Không } ] }
      - { key: tab_sb_title, label: Tiêu đề bảng bên phải, type: text, file: plugins/TAB/config.yml, path: scoreboard.scoreboards.banghoi.title }
      - { key: tab_sb_lines, label: Các dòng bảng bên phải (tối đa 15), type: lines, file: plugins/TAB/config.yml, path: scoreboard.scoreboards.banghoi.lines,
          note: "Dòng trống: gõ một dấu cách không được (bị bỏ), dùng &r làm dòng trống. Bảng có 2 trang tự đổi mỗi 8 giây: các dòng %animation:SbTieuDe%, %animation:SbDong1..4% lấy nội dung từng trang trong plugins/TAB/animations.yml. Có sẵn: %dmmmua_ten%, %dmmmua_con% (mùa), %dmmtoi_giet%, %dmmtoi_chet%, %dmmtoi_kda%." }
      - { key: tab_header, label: Đầu danh sách Tab (mỗi dòng 1 dòng), type: lines, file: plugins/TAB/config.yml, path: header-footer.designs.default.header }
      - { key: tab_footer, label: Cuối danh sách Tab, type: lines, file: plugins/TAB/config.yml, path: header-footer.designs.default.footer }

