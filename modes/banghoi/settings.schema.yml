  # ---- Shop của người chơi: cửa hàng rương (QuickShop), chợ đấu giá (zAuctionHouse), đổi đồ (TradePro) ----
  - title: Cửa hàng rương của người chơi (QuickShop)
    category: Shop
    description: "Người chơi cầm đồ bấm chuột trái vào rương để mở cửa hàng; bán được cả khi chủ offline. Thuế trừ vào tiền người bán mỗi giao dịch."
    apply: [qs reload]
    settings:
      - { key: qs_tax_rate, label: "Thuế mỗi giao dịch (0.05 = 5%)", type: number, min: 0, max: 1, file: plugins/QuickShop-Hikari/config.yml, path: shop-tax.basic.rate }
      - { key: qs_create_cost, label: Phí mở một cửa hàng (xu), type: number, min: 0, max: 1000000, file: plugins/QuickShop-Hikari/config.yml, path: shop.cost }
      - { key: qs_price_fee_on, label: Thu phí khi đổi giá, type: select, file: plugins/QuickShop-Hikari/config.yml, path: shop.price-change-requires-fee, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: qs_price_fee, label: Phí đổi giá (xu), type: number, min: 0, max: 1000000, file: plugins/QuickShop-Hikari/config.yml, path: shop.fee-for-price-change }
      - { key: qs_limits_on, label: Giới hạn số cửa hàng mỗi người, type: select, file: plugins/QuickShop-Hikari/config.yml, path: limits.use, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: qs_limits_default, label: Số cửa hàng tối đa mỗi người, type: int, min: 1, max: 1000, file: plugins/QuickShop-Hikari/config.yml, path: limits.default }
      - { key: qs_ongoing_on, label: Thu phí duy trì cửa hàng định kỳ, type: select, file: plugins/QuickShop-Hikari/config.yml, path: shop.ongoing-fee.enable, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ],
          note: "Chống mở cửa hàng rồi bỏ hoang." }
      - { key: qs_ongoing_cost, label: Phí duy trì mỗi cửa hàng mỗi lần thu (xu), type: number, min: 0, max: 100000, file: plugins/QuickShop-Hikari/config.yml, path: shop.ongoing-fee.cost-per-shop }
      - { key: qs_ongoing_ticks, label: Thu phí duy trì mỗi (tick; 72000 = 1 giờ), type: int, min: 1200, max: 10000000, file: plugins/QuickShop-Hikari/config.yml, path: shop.ongoing-fee.ticks }
      - { key: qs_restrict_on, label: Giới hạn giá mua/bán, type: select, file: plugins/QuickShop-Hikari/price-restriction.yml, path: enable, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: qs_sell_min, label: Giá bán thấp nhất (xu), type: number, min: 0, file: plugins/QuickShop-Hikari/price-restriction.yml, path: global.selling.min }
      - { key: qs_sell_max, label: Giá bán cao nhất (xu), type: number, min: 0, file: plugins/QuickShop-Hikari/price-restriction.yml, path: global.selling.max }

  - title: Chợ đấu giá /ah (zAuctionHouse)
    category: Shop
    description: "Người chơi đăng bán đồ đang cầm bằng /ah sell <giá>, người khác mua trong /ah."
    apply: [zauctionhouse admin reload]
    settings:
      - key: ah_max_listings
        label: Số món mỗi người được đăng cùng lúc
        type: select
        options: [ { value: 5, label: "5 món" }, { value: 10, label: "10 món" }, { value: 15, label: "15 món" } ]
        commands: ["lp group default permission unset zauctionhouse.max.5", "lp group default permission unset zauctionhouse.max.10",
                   "lp group default permission unset zauctionhouse.max.15", "lp group default permission set zauctionhouse.max.{value} true"]
        note: "Đặt quyền trong LuckPerms (dùng chung toàn mạng), có hiệu lực ngay."
      - { key: ah_expire, label: "Thời gian đăng bán (giây; 172800 = 2 ngày)", type: int, min: 600, max: 31536000, file: plugins/zAuctionHouse/config.yml, path: expiration.auction.default-expiration,
          note: "Hết hạn chưa ai mua thì món đồ vào mục hết hạn, người bán vào /ah lấy lại." }
      - { key: ah_expired_keep, label: "Giữ đồ hết hạn chờ lấy lại (giây; 604800 = 7 ngày)", type: int, min: 3600, max: 31536000, file: plugins/zAuctionHouse/config.yml, path: expiration.expire.default-expiration }
      - { key: ah_min_price, label: Giá đăng bán thấp nhất (xu), type: number, min: 0, file: plugins/zAuctionHouse/economies.yml, path: economies.0.min-prices.auction }
      - { key: ah_max_price, label: Giá đăng bán cao nhất (xu), type: number, min: 1, file: plugins/zAuctionHouse/economies.yml, path: economies.0.max-prices }
      - { key: ah_tax_on, label: Thu thuế khi bán, type: select, file: plugins/zAuctionHouse/economies.yml, path: economies.0.tax.enabled, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: ah_tax, label: Thuế (% giá bán), type: number, min: 0, max: 100, file: plugins/zAuctionHouse/economies.yml, path: economies.0.tax.amount }
      - { key: ah_bc_sell, label: Thông báo cả server khi có người đăng bán, type: select, file: plugins/zAuctionHouse/config.yml, path: broadcast.sell.enable, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: ah_bc_buy, label: Thông báo cả server khi có người mua, type: select, file: plugins/zAuctionHouse/config.yml, path: broadcast.purchase.enable, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }

  - title: Đổi đồ trực tiếp /trade (TradePro)
    category: Shop
    description: "Hai người đứng gần nhau, /trade <tên>, cùng bấm đồng ý mới đổi."
    apply: [tradepro reload]
    settings:
      - { key: tp_range, label: Khoảng cách tối đa giữa hai người (block), type: number, min: 1, max: 1000, file: plugins/TradePro/config.yml, path: ranges.sameworld }
      - { key: tp_cooldown, label: Chờ giữa hai lời mời (giây), type: int, min: 0, max: 600, file: plugins/TradePro/config.yml, path: requestcooldownseconds }
      - { key: tp_countdown, label: Đếm ngược trước khi đổi (giây; chống lừa đảo), type: int, min: 0, max: 60, file: plugins/TradePro/config.yml, path: antiscam.countdown }
      - { key: tp_money_on, label: Cho đổi kèm tiền, type: select, file: plugins/TradePro/config.yml, path: extras.economy.enabled, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: tp_money_tax, label: Thuế phần tiền khi đổi (%), type: number, min: 0, max: 100, file: plugins/TradePro/config.yml, path: extras.economy.taxpercent }
      - { key: tp_xp_on, label: Cho đổi kèm kinh nghiệm, type: select, file: plugins/TradePro/config.yml, path: extras.experience.enabled, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: tp_same_ip, label: Cho hai tài khoản cùng mạng (cùng IP) đổi đồ, type: select, file: plugins/TradePro/config.yml, path: allow-same-ip-trade,
          options: [ { value: true, label: "Cho phép (chơi cùng nhà, quán net)" }, { value: false, label: "Chặn (chống chuyển đồ sang nick phụ)" } ] }

  - title: Đồ phù phép vượt cấp (chỉ admin tạo)
    category: Phù phép
    description: "Lệnh admin: /dmm enchant <phù phép> <cấp> (món đang cầm), /dmm sach <phù phép> <cấp> [người] (tặng sách). Ghép sách vượt cấp vào đồ bằng đe giữ nguyên cấp. KHÔNG bán lấy tiền thật."
    apply: [dmm reload]
    settings:
      - { key: over_enchant_on, label: Bật lệnh tạo đồ vượt cấp, type: select, file: plugins/DuckyMoMoCore/config.yml, path: over-enchant.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: over_enchant_max, label: Cấp tối đa được tạo, type: int, min: 1, max: 255, file: plugins/DuckyMoMoCore/config.yml, path: over-enchant.max-level,
          note: "Vd 30 = tạo được tới Sắc bén XXX. Tối đa của game là 255." }

  - title: Dân làng bán hàng (Shopkeepers)
    category: Shop
    description: "Admin tạo NPC bằng /shopkeeper admin rồi chuột phải (cúi) vào NPC để sửa đồ bán và giá."
    apply: [shopkeeper reload, shopkeepersaddon reload]
    settings:
      - key: sk_player_shops
        label: Người chơi tự mở shop dân làng
        type: select
        options: [ { value: false, label: "Không (chỉ admin; người chơi dùng cửa hàng rương)" }, { value: true, label: "Cho phép" } ]
        commands: ["lp group default permission set shopkeeper.player {value}"]
        note: "Đặt quyền trong LuckPerms, có hiệu lực ngay."
      - { key: sk_daily_limit_on, label: Giới hạn tiền kiếm được mỗi ngày khi bán cho shop admin, type: select, file: plugins/ShopkeepersAddon/config.yml, path: economy.daily-earning-limit.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: sk_daily_limit, label: Mức giới hạn mỗi ngày (xu), type: number, min: 0, max: 100000000, file: plugins/ShopkeepersAddon/config.yml, path: economy.daily-earning-limit.limit }
      - { key: sk_tax, label: "Thuế shop người chơi (0-100 %)", type: int, min: 0, max: 100, file: plugins/Shopkeepers/config.yml, path: tax-rate }
      - { key: sk_max_shops, label: "Số shop tối đa mỗi người (-1 = không giới hạn)", type: int, min: -1, max: 1000, file: plugins/Shopkeepers/config.yml, path: max-shops-per-player }
      - { key: sk_towny, label: Shop người chơi chỉ được đặt trong thị trấn (ô đất thương mại), type: select, file: plugins/Shopkeepers/config.yml, path: enable-towny-restrictions,
          options: [ { value: true, label: Có }, { value: false, label: Không } ] }

  - title: Quà tân thủ và chào người mới
    category: Người mới
    description: "Người chơi vào Bang Hội Chiến LẦN ĐẦU tự nhận kit quà (một lần duy nhất) và cả server thấy dòng chào. Tiền khởi đầu: loại Kinh tế."
    apply: [essentials reload]
    settings:
      - { key: newbie_kit_items, label: "Đồ trong kit quà (mỗi dòng: tên_đồ số_lượng)", type: lines, file: plugins/Essentials/kits.yml, path: kits.tanthu.items,
          note: "Tên đồ tiếng Anh kiểu Minecraft: stone_sword 1, bread 16, iron_pickaxe 1 efficiency:2... Dòng bắt đầu bằng / là lệnh chạy khi phát ({USERNAME} = tên người chơi)." }
      - { key: newbie_kit_on, label: Phát kit quà khi vào lần đầu, type: select, file: plugins/Essentials/config.yml, path: newbies.kit,
          options: [ { value: tanthu, label: "Có (kit tanthu)" }, { value: "", label: Không phát } ] }
      - { key: newbie_announce, label: "Dòng chào cả server ({DISPLAYNAME} = tên; để trống = tắt)", type: text, file: plugins/Essentials/config.yml, path: newbies.announce-format }
