  - title: Chương trình Sứ Giả (/media) — kiểm soát rank livestream
    category: Người mới
    description: "Server tự kiểm người có rank Sứ Giả có livestream đủ không: chỉ tính lúc người đó ONLINE THẬT trong server và kênh ĐANG LIVE. Duyệt đơn, xem số liệu ở trang quản trị › Sứ Giả."
    info: "Người chơi: /media dangky <link kênh> → admin duyệt (rank có hạn = thử việc) → mỗi lần live gõ /media live (cả server được báo, kèm link) → xong /media tat.\nTikTok: server tự đọc trạng thái live (cách không chính thức, có thể bị TikTok chặn → tính 'chưa xác minh', admin bấm link xem). YouTube: cần khoá YouTube Data API v3 đặt YOUTUBE_KEY=... trong .env (bí mật, không ghi ở đây) rồi khởi động lại Bang Hội Chiến.\nThiếu chỉ tiêu nhiều tuần liền: chỉ BÁO admin, không tự gỡ (admin gỡ ở trang Sứ Giả).\nQuyền lợi rank Sứ Giả: nhóm 'Quyền lợi theo rank khác'.\nLưu xong: có hiệu lực ngay (dmm reload)."
    apply: [dmm reload]
    settings:
      - { key: md_on, label: Bật chương trình Sứ Giả, type: select, file: plugins/DuckyMoMoCore/config.yml, path: media.enabled, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: md_sessions, label: "Chỉ tiêu: số buổi live trong 7 ngày", type: int, min: 0, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: media.min-sessions }
      - { key: md_session_min, label: "Một buổi phải dài ít nhất (phút)", type: int, min: 5, max: 600, file: plugins/DuckyMoMoCore/config.yml, path: media.min-session-minutes }
      - { key: md_hours, label: "Chỉ tiêu: tổng giờ live trong 7 ngày", type: number, min: 0, max: 168, file: plugins/DuckyMoMoCore/config.yml, path: media.min-hours }
      - { key: md_trial, label: "Thử việc khi duyệt (ngày)", type: int, min: 1, max: 365, file: plugins/DuckyMoMoCore/config.yml, path: media.trial-days }
      - { key: md_extend, label: "Gia hạn mỗi lần (ngày)", type: int, min: 1, max: 365, file: plugins/DuckyMoMoCore/config.yml, path: media.extend-days }
      - { key: md_check, label: "Kiểm trạng thái mỗi (phút)", type: int, min: 1, max: 60, file: plugins/DuckyMoMoCore/config.yml, path: media.check-minutes }
      - { key: md_tiktok, label: "Tự kiểm TikTok có đang live", type: select, file: plugins/DuckyMoMoCore/config.yml, path: media.tiktok-check, options: [ { value: true, label: Bật }, { value: false, label: "Tắt (mọi buổi TikTok tính chưa xác minh)" } ] }
      - { key: md_fail, label: "Báo admin khi thiếu chỉ tiêu bao nhiêu tuần liền", type: int, min: 1, max: 10, file: plugins/DuckyMoMoCore/config.yml, path: media.fail-weeks-alert }
      - { key: md_cooldown, label: "Báo 'đang live' cho cả server tối đa 1 lần mỗi (phút)", type: int, min: 0, max: 1440, file: plugins/DuckyMoMoCore/config.yml, path: media.announce-cooldown-minutes }

  - title: Quyền lợi theo rank khác (Sứ Giả, ủng hộ, staff)
    category: Người mới
    description: "Quyền lợi cho rank KHÔNG phải danh phận: số nhà, balo, ô mỗi balo, món treo Chợ đen, đơn thu mua Chợ đen, vé gacha online nhanh hơn, gói quà /kit. 0 = không cấp (theo danh phận). Người nhiều rank lấy mức cao nhất."
    info: "Rank Sứ Giả: miễn phí, admin xét duyệt người livestream về server; hiện thẻ trong /danhphan (yêu cầu + cách liên hệ). Cấp: /lp user <tên> parent add media (gỡ: parent remove media). Plugin tự tạo nhóm media + tiền tố.\nGói quà /kit media: plugins/Essentials/kits/media.yml (3 ngày 1 lần), đổi đồ bằng /createkit media 259200.\n⚠ Rank ỦNG HỘ (mua bằng tiền): mọi quyền lợi ở đây là LỢI THẾ KHI CHƠI, trái luật Mojang và luật server (không pay-to-win). Để 0.\nGiảm ô balo: đồ ở ô khoá không mất.\nLưu xong: có hiệu lực ngay (dmm reload, plugin tự sửa quyền LuckPerms)."
