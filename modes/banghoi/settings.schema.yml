  - title: Bắt pet theo xác suất (MyPet)
    category: PvP & combat
    description: "Mỗi lần quăng dây xích vào con yếu máu chỉ có xác suất bắt được; trượt nhiều lần con vật hoảng, phải tìm con khác. Người chơi xem tỉ lệ: /bxhpet tyle."
    info: "Là gì: làm pet hiếm hơn. Đánh con vật còn ≤ 10% máu bằng dây xích = 1 lần thử, quay xác suất của nhóm loài đó.\nTrượt: khói + thông báo; mỗi con chỉ thử được số lần ở dưới, hết thì con vật hoảng (không bắt được con đó nữa).\nThú phải tự thuần hoá (sói, mèo, ngựa, lừa, la, lạc đà, vẹt, Sniffer): không quay xác suất, con mình đã thuần hoá thì bắt luôn.\nNhóm loài theo cây kỹ năng (trang chủ mục Pet có bảng loài nào thuộc nhóm nào).\nLưu ý: tài khoản có quyền * (admin) luôn bắt trúng.\nLưu xong: có hiệu lực ngay (dmm reload)."
    apply: [dmm reload]
    settings:
      - { key: petcap_on, label: Bắt pet theo xác suất, type: select, file: plugins/DuckyMoMoCore/config.yml, path: pet-capture.enabled,
          options: [ { value: true, label: "Bật (mặc định)" }, { value: false, label: "Tắt: đánh yếu máu là bắt được ngay" } ],
          info: "Tắt: quay về như MyPet gốc, phát nào đủ điều kiện cũng bắt được.\nLưu ý: tắt thì cũng phải bỏ dòng Permission:duckymomo.pet.batduoc trong plugins/MyPet/pet-config.yml, nếu không sẽ KHÔNG ai bắt được (trừ thú đã thuần hoá cũng không)." }
      - { key: petcap_chance, label: Xác suất bắt mặc định (%), type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-capture.chance-percent,
          info: "Là gì: dùng cho loài không thuộc nhóm nào ở dưới (hiếm, vd loài mới của bản Minecraft sau)." }
      - { key: petcap_attempts, label: Số lần thử mỗi con, type: int, min: 1, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: pet-capture.attempts-per-mob,
          info: "Là gì: mỗi con vật chỉ thử bắt được ngần này lần (cộng dồn mọi người chơi), hết thì con đó hoảng sợ, không bắt được nữa.\nVí dụ: 3 lần, xác suất 20% → bắt được một con cụ thể khoảng 49%." }
      - { key: petcap_cooldown, label: Chờ giữa 2 lần thử (giây), type: number, min: 0, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: pet-capture.cooldown-seconds,
          info: "Là gì: chống bấm liên tục. Trong lúc chờ, đánh bằng dây xích không tính lần thử." }
      - { key: petcap_giasuc, label: "Xác suất bắt: Gia súc (%)", type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-capture.group-chance.giasuc }
      - { key: petcap_thuytoc, label: "Xác suất bắt: Thủy tộc (%)", type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-capture.group-chance.thuytoc }
      - { key: petcap_cuoi, label: "Xác suất bắt: Thú cưỡi (%)", type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-capture.group-chance.cuoi }
      - { key: petcap_xacsong, label: "Xác suất bắt: Xác sống (%)", type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-capture.group-chance.xacsong }
      - { key: petcap_thusan, label: "Xác suất bắt: Thú săn (%)", type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-capture.group-chance.thusan }
      - { key: petcap_cungthu, label: "Xác suất bắt: Cung thủ (%)", type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-capture.group-chance.cungthu }
      - { key: petcap_nhay, label: "Xác suất bắt: Quái nhầy & nổ (%)", type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-capture.group-chance.nhay }
      - { key: petcap_bay, label: "Xác suất bắt: Loài bay (%)", type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-capture.group-chance.bay }
      - { key: petcap_thulon, label: "Xác suất bắt: Thú lớn (%)", type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-capture.group-chance.thulon }
      - { key: petcap_phuthuy, label: "Xác suất bắt: Phù thủy (%)", type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: pet-capture.group-chance.phuthuy }

  - title: Pet chiến đấu - lên cấp, hồi sinh, đói (MyPet)
    category: PvP & combat
    description: "Đổi xong phải KHỞI ĐỘNG LẠI Bang Hội Chiến (MyPet không có lệnh nạp lại cấu hình)."
    info: "Là gì: các con số của plugin MyPet (pet bắt bằng dây xích).\nLưu ý: lưu xong chưa có hiệu lực ngay; cần khởi động lại Bang Hội Chiến lúc vắng người."
    settings:
      - { key: mypet_exp, label: Tốc độ lên cấp (nhân kinh nghiệm), type: number, min: 0.1, max: 10, file: plugins/MyPet/config.yml, path: MyPet.Exp.Modifier.Global,
          info: "Là gì: kinh nghiệm pet nhận được nhân với số này. 1 = mặc định, 2 = lên cấp nhanh gấp đôi." }
      - { key: mypet_levelcap, label: Cấp tối đa của pet, type: int, min: 10, max: 1000, file: plugins/MyPet/config.yml, path: MyPet.Exp.LevelCap }
      - { key: mypet_exp_loss, label: Mất kinh nghiệm khi pet chết (%), type: int, min: 0, max: 100, file: plugins/MyPet/config.yml, path: MyPet.Exp.Loss.Percent,
          info: "Là gì: pet chết mất bao nhiêu % kinh nghiệm của cấp hiện tại (không tụt cấp)." }
      - { key: mypet_respawn_factor, label: Thời gian hồi sinh - giây theo cấp, type: int, min: 0, max: 600, file: plugins/MyPet/config.yml, path: MyPet.Respawn.Time.Default.Factor,
          info: "Công thức: chờ hồi sinh = số này × cấp của pet + số giây cố định (ô dưới).\nVí dụ: 5 giây/cấp, pet cấp 20 chờ 100 giây." }
      - { key: mypet_respawn_fixed, label: Thời gian hồi sinh - giây cố định, type: int, min: 0, max: 3600, file: plugins/MyPet/config.yml, path: MyPet.Respawn.Time.Default.Fixed }
      - { key: mypet_respawn_cost_fixed, label: Hồi sinh ngay (/petrespawn) - tiền cố định, type: number, min: 0, file: plugins/MyPet/config.yml, path: MyPet.Respawn.EconomyCost.Fixed,
          info: "Là gì: trả tiền để hồi sinh pet ngay thay vì chờ. Tổng = cố định + hệ số × số giây còn phải chờ." }
      - { key: mypet_respawn_cost_factor, label: Hồi sinh ngay - tiền mỗi giây còn chờ, type: number, min: 0, file: plugins/MyPet/config.yml, path: MyPet.Respawn.EconomyCost.Factor }
      - { key: mypet_hunger, label: Pet bị đói, type: select, file: plugins/MyPet/config.yml, path: MyPet.HungerSystem.Active,
          options: [ { value: true, label: "Bật: phải cho ăn (đồ ăn trong túi tự cho)" }, { value: false, label: Tắt } ] }
      - { key: mypet_hunger_time, label: Mất 1 điểm no sau (giây), type: int, min: 5, max: 3600, file: plugins/MyPet/config.yml, path: MyPet.HungerSystem.Time }
      - { key: mypet_ride_hunger, label: Cưỡi pet - mất điểm no mỗi khối đi, type: number, min: 0, max: 1, file: plugins/MyPet/config.yml, path: MyPet.Skill.Ride.HungerPerMeter,
          info: "Là gì: cưỡi pet đi 1 khối thì pet mất ngần này điểm no (mặc định 0.01 = 100 khối mất 1 điểm). Đói thì pet chạy và bay chậm hơn.\nQuan trọng: giới hạn quãng bay của loài bay CHỈ tính khi số này lớn hơn 0 và đang bật Pet bị đói. Đặt 0 hoặc tắt đói = loài bay bay KHÔNG giới hạn." }
      - { key: mypet_switch_fee, label: Phí đổi hướng kỹ năng (% tiền đang có), type: int, min: 0, max: 100, file: plugins/MyPet/config.yml, path: MyPet.Skilltree.SwitchFee.Percent }
      - { key: mypet_leash_consume, label: Mất dây xích khi bắt pet, type: select, file: plugins/MyPet/config.yml, path: MyPet.Leash.Consume,
          options: [ { value: false, label: "Không (mặc định)" }, { value: true, label: Có } ] }

  - title: Đấu Trường (người + pet)
    category: PvP & combat
    info: "Là gì: /dautruong, người + pet MyPet đấu 1v1 hoặc 2v2 trong thế giới riêng.\nĐồ: đồ của mình, chết trong sân không rơi đồ, bị loại thì chuyển sang xem.\nCược: hai bên cùng mức (hàng chờ ghép theo mức cược), server thu phí %, đội thắng chia phần còn lại; hoà/huỷ trả lại.\nGiao hữu: đối thủ cùng IP thì không cược, không điểm, không thưởng.\nSân: admin /dautruong admin den, dán map, /dautruong admin dat <sân> a1|a2|b1|b2|xem."
    apply: [dmm reload]
    settings:
      - { key: arena_fight, label: Thời gian mỗi trận (giây), type: int, min: 30, max: 900, file: plugins/DuckyMoMoCore/config.yml, path: arena.fight-seconds, note: "Hết giờ: đội còn nhiều % máu hơn thắng." }
      - { key: arena_pet_reduce, label: Trong sân - pet đánh người bị giảm (%), type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: arena.pet-damage-reduce-percent,
          info: "Là gì: mức giảm sát thương pet lên người chơi RIÊNG trong Đấu Trường (ngoài thế giới dùng mức ở nhóm Pet chiến đấu)." }
      - { key: arena_fee, label: Phí cược server thu (%), type: number, min: 0, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: arena.fee-percent }
      - { key: arena_max_stake, label: Cược tối đa mỗi người (xu), type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: arena.max-stake }
      - { key: arena_reward, label: Thưởng mỗi trận thắng (xu), type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: arena.win-reward }
      - { key: arena_cap, label: Số trận được thưởng mỗi ngày, type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: arena.daily-reward-cap }
      - { key: arena_pet_exp, label: Kinh nghiệm cho pet khi thắng, type: number, min: 0, max: 10000, file: plugins/DuckyMoMoCore/config.yml, path: arena.pet-exp-win,
          info: "Là gì: thắng trận thì pet đang dẫn được cộng ngần này kinh nghiệm.\nGiới hạn: chỉ những trận còn được thưởng xu (chung số trận được thưởng mỗi ngày); trận giao hữu (cùng IP) không có.\nGợi ý: lên cấp 10 cần khoảng 150 kinh nghiệm, cấp 30 khoảng 770, cấp 50 khoảng 3.200.\n0 = tắt." }
      - { key: arena_countdown, label: Đếm ngược trước khi đánh (giây), type: int, min: 1, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: arena.countdown-seconds }

  - title: Vũ khí nổ (crystal, anchor, giường, xe goòng TNT)
    category: PvP & combat
    description: "Sát thương của vũ khí nổ lên NGƯỜI CHƠI. 0 = cấm (không gây sát thương, không hất), 0.3 = còn 30%, 1 = như gốc. Quái, rồng Ender, phá khối không đổi. Crystal/anchor/nổ giường giết người trong 1 giây, đè hết lối chơi khác khi công thành."
    apply: [dmm reload]
    settings:
      - { key: boom_on, label: Áp dụng luật vũ khí nổ, type: select, file: plugins/DuckyMoMoCore/config.yml, path: explosive-pvp.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt (như gốc) } ] }
      - { key: boom_crystal, label: "End crystal: hệ số sát thương", type: number, min: 0, max: 1, file: plugins/DuckyMoMoCore/config.yml, path: explosive-pvp.end-crystal }
      - { key: boom_anchor, label: "Respawn anchor: hệ số sát thương", type: number, min: 0, max: 1, file: plugins/DuckyMoMoCore/config.yml, path: explosive-pvp.respawn-anchor }
      - { key: boom_bed, label: "Nổ giường (Nether, End): hệ số sát thương", type: number, min: 0, max: 1, file: plugins/DuckyMoMoCore/config.yml, path: explosive-pvp.bed }
      - { key: boom_tntcart, label: "Xe goòng TNT: hệ số sát thương", type: number, min: 0, max: 1, file: plugins/DuckyMoMoCore/config.yml, path: explosive-pvp.tnt-minecart }

  - title: Chống thoát game khi đánh nhau (PvPManager)
    info: "Cờ giao tranh: đang đánh nhau mà thoát game để né chết thì vẫn chết và rơi đồ.\nBảo vệ người mới: người mới không bị đánh vài phút đầu."
    category: PvP & combat
    description: Bị đánh thì gắn cờ giao tranh; thoát game lúc đó thì chết và rơi đồ. Người mới được bảo vệ khỏi PvP một thời gian.
    apply: [pmr reload]
    settings:
      - { key: pvp_tag_seconds, info: "Là gì: bị đánh hoặc đánh người khác thì bị \"gắn cờ\" ngần này giây.\nTrong lúc gắn cờ: thoát game thì chết rơi đồ (nếu bật), không dịch chuyển được (nếu cấm).", label: Thời gian gắn cờ giao tranh (giây), type: int, min: 5, max: 120, file: plugins/PvPManager/config.yml, path: Combat Tag.Time }
      - { key: pvp_kill_on_logout, label: Thoát game khi đang giao tranh thì chết, type: select, file: plugins/PvPManager/config.yml, path: Combat Log Punishments.Kill on Logout.Enabled,
          options: [ { value: true, label: "Có (rơi đồ)" }, { value: false, label: Không } ] }
      - { key: pvp_block_teleport, label: Cấm dịch chuyển (/spawn, /home, /warp...) khi đang giao tranh, type: select, file: plugins/PvPManager/config.yml, path: Combat Tag.Actions Blocked.Teleport,
          options: [ { value: true, label: Cấm }, { value: false, label: Cho phép } ] }
      - { key: pvp_newbie_enabled, info: "Là gì: người mới vào lần đầu không bị người khác đánh trong thời gian bảo vệ (và cũng không đánh được ai).\nLưu ý: người mới tự bỏ sớm bằng /newbie disable.", label: Bảo vệ người mới, type: select, file: plugins/PvPManager/config.yml, path: Newbie Protection.Enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: pvp_newbie_seconds, label: Thời gian bảo vệ người mới (giây), type: int, min: 0, max: 86400, file: plugins/PvPManager/config.yml, path: Newbie Protection.Time,
          note: "900 = 15 phút. Người mới tự tắt được bằng /newbie disable." }
      - { key: pvp_newbie_bar, label: Thanh đếm ngược bảo vệ người mới (boss bar), type: select, file: plugins/PvPManager/config.yml, path: Newbie Protection.Boss Bar.Enabled,
          options: [ { value: true, label: Hiện }, { value: false, label: Ẩn } ] }
      - { key: pvp_newbie_bar_text, label: Chữ trên thanh, type: text, file: plugins/PvPManager/config.yml, path: Newbie Protection.Boss Bar.Message,
          note: "<time> = thời gian còn lại (phút:giây). Mã màu &." }
      - { key: pvp_newbie_bar_color, label: Màu thanh, type: select, file: plugins/PvPManager/config.yml, path: Newbie Protection.Boss Bar.BarColor,
          options: [ { value: GREEN, label: Xanh lá }, { value: YELLOW, label: Vàng }, { value: BLUE, label: Xanh dương }, { value: PINK, label: Hồng },
                     { value: PURPLE, label: Tím }, { value: RED, label: Đỏ }, { value: WHITE, label: Trắng } ] }

  - title: Dọn rác
    info: "Là gì: định kỳ xoá vật phẩm nằm dưới đất để giảm lag, có đếm ngược trong chat.\nKhông xoá: đồ đã đổi tên bằng đe, đồ quanh chỗ người chơi vừa chết, vùng loại trừ."
    category: Hệ thống
    description: Xoá vật phẩm rơi dưới đất định kỳ, báo trước trong chat. Admin dọn ngay bằng /dmm clean.
    apply: [dmm reload]
    settings:
      - { key: cleaner_enabled, label: Bật dọn rác, type: select, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: cleaner_interval, label: Dọn mỗi (phút), type: int, min: 1, max: 120, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.interval-minutes }
      - { key: cleaner_warn, label: Báo trước ở các mốc (giây), type: list, items: int, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.warn-seconds,
          note: "Ví dụ: 60, 30, 10, 5, 3, 2, 1" }
      - { key: cleaner_min_age, info: "Là gì: vật phẩm mới rơi chưa đủ ngần này giây thì lượt dọn bỏ qua.\nTác dụng: kịp nhặt đồ vừa vứt, vừa đào ra.", label: Không xoá vật phẩm vừa rơi dưới (giây), type: int, min: 0, max: 600, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.min-age-seconds,
          note: "Để đồ rơi khi chết còn kịp nhặt. Vật phẩm đã đổi tên bằng đe không bao giờ bị xoá." }
      - { key: cleaner_arrows, label: Xoá cả mũi tên cắm đất, type: select, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.arrows,
          options: [ { value: true, label: Có }, { value: false, label: Không } ] }
      - { key: cleaner_death_minutes, label: Giữ đồ rơi khi chết (phút), type: int, min: 0, max: 60, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.death-protect-minutes,
          note: "Đồ trong bán kính 8 block quanh chỗ chết không bị dọn trong chừng này phút, bất kể lượt dọn rơi vào lúc nào. 0 = tắt." }
      - { key: cleaner_pause_battle, info: "Có: trong giờ phiên công thành (theo lịch) không dọn, để đồ rơi khi đánh nhau còn nhặt được.", label: Không dọn trong giờ công thành, type: select, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.pause-during-battle,
          options: [ { value: true, label: Có }, { value: false, label: Không } ],
          note: "Theo lịch phiên đánh ở nhóm Lịch công thành (kể cả tuần không có cuộc vây nào)." }
      - { key: cleaner_skip_towns, label: Không dọn trong đất thị trấn, type: select, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.skip-towns,
          options: [ { value: false, label: Không (dọn cả thị trấn) }, { value: true, label: Có (chỉ dọn đất hoang) } ],
          note: "Bật thì máy farm trong thị trấn có thể để đồ tồn đọng, gây lag." }
      - { key: cleaner_exclude, label: Vùng không dọn, type: lines, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.exclude-areas,
          note: "Mỗi dòng: x1 z1 x2 z2 (hai góc đối nhau). Ví dụ khu spawn: 12556 -2623 12801 -2298" }
      - { key: cleaner_warn_msg, label: "Tin báo trước ({s} = số giây)", type: text, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.warn-message }
      - { key: cleaner_done_msg, label: "Tin sau khi dọn ({n} = số vật phẩm)", type: text, file: plugins/DuckyMoMoCore/config.yml, path: item-cleaner.done-message }

  - title: Dịch chuyển ngẫu nhiên (/tpr)
    category: Thế giới
    description: "Người chơi gõ /tpr hoặc bấm NPC ở spawn để tới một chỗ đất hoang ngẫu nhiên trong khu đã chọn. Danh sách khu sửa ở plugins/DuckyMoMoCore/config.yml (rtp.zones)."
    apply: [dmm reload]
    settings:
      - { key: rtp_enabled, label: Bật /tpr, type: select, file: plugins/DuckyMoMoCore/config.yml, path: rtp.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: rtp_cooldown, label: Thời gian chờ giữa hai lần (giây), type: int, min: 0, max: 86400, file: plugins/DuckyMoMoCore/config.yml, path: rtp.cooldown-seconds,
          note: "300 = 5 phút. Admin (quyền duckymomo.rtp.bypass) không phải chờ." }
      - { key: rtp_cost, label: Phí mỗi lần (0 = miễn phí), type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: rtp.cost,
          note: "Trừ tiền sau khi tìm được chỗ; dịch chuyển hỏng thì trả lại." }
      - { key: rtp_warmup, info: "Là gì: đứng yên ngần này giây rồi mới dịch chuyển; đếm ngược hiện trên thanh hành động.\nTác dụng: chống dùng /tpr chạy trốn khi đang đánh nhau.\nBỏ qua: staff có essentials.teleport.timer.bypass hoặc duckymomo.rtp.bypass.", label: Đứng yên bao lâu trước khi đi (giây), type: int, min: 0, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: rtp.warmup-seconds,
          note: "3 = như các server khác. Di chuyển hoặc bị đánh trong lúc chờ là huỷ. 0 = đi ngay." }

  - title: Dịch chuyển bằng lệnh (/home, /spawn, /warp, /tpa, /back)
    category: Thế giới
    description: "Thời gian chờ của mọi lệnh dịch chuyển EssentialsX ở Bang Hội Chiến. /tpr có ô chờ riêng ở nhóm trên."
    apply: [essentials reload]
    settings:
      - { key: tele_delay, info: "Áp dụng: /home, /spawn, /warp, /back, /tpa (đếm khi người kia /tpaccept), /tpahere.\nBỏ qua: essentials.teleport.timer.bypass (Admin có sẵn qua *).\nĐi lại khi chờ: quyền essentials.teleport.timer.move.", label: Đứng yên bao lâu trước khi đi (giây), type: int, min: 0, max: 30, file: plugins/Essentials/config.yml, path: teleport-delay,
          note: "3 = như các server khác. Di chuyển hoặc bị đánh trong lúc chờ là huỷ. 0 = đi ngay." }
      - { key: tele_cooldown, info: "Là gì: sau một lần /home, /tp… phải chờ ngần này giây mới dịch chuyển tiếp.\nBỏ qua: essentials.teleport.cooldown.bypass.", label: Phải chờ giữa hai lần dịch chuyển (giây), type: int, min: 0, max: 3600, file: plugins/Essentials/config.yml, path: teleport-cooldown,
          note: "0 = không giới hạn." }
      - { key: tele_invuln, label: Bất tử sau khi dịch chuyển (giây), type: int, min: 0, max: 30, file: plugins/Essentials/config.yml, path: teleport-invulnerability,
          note: "Trong thời gian này không bị đánh và cũng không đánh được người khác." }

  - title: Mùa mưa / mùa khô (/mua)
    category: Thế giới
    description: "Mùa đổi theo ngày thật (giờ Việt Nam), mỗi mùa vài ngày, lặp vòng mưa → khô. Mỗi mùa có cây lớn nhanh/chậm, được mùa (rơi thêm khi gặt), mưa nhiều/ít, cá riêng (EvenMoreFish). Hệ số cây: 1 = như gốc, 0.5 = chậm một nửa, 1.4 = nhanh hơn ~40%. Chỉnh thêm cây, % được mùa, câu gợi ý: plugins/DuckyMoMoCore/config.yml (seasons). Admin thử trong game: /mua dat kho, /mua dat tudong."
    apply: [dmm reload]
    settings:
      - { key: mua_on, label: Bật mùa, type: select, file: plugins/DuckyMoMoCore/config.yml, path: seasons.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: mua_start, label: Ngày bắt đầu mùa mưa đầu tiên (yyyy-MM-dd), type: text, file: plugins/DuckyMoMoCore/config.yml, path: seasons.start-date,
          note: "Từ ngày này: mùa mưa, rồi mùa khô, rồi lặp lại. Đổi ngày là đổi mùa hiện tại ngay." }
      - { key: mua_days, label: Số ngày mỗi mùa, type: int, min: 1, max: 60, file: plugins/DuckyMoMoCore/config.yml, path: seasons.days-per-season,
          note: "Một mùa server 10 tuần: 7 ngày = 5 vòng mưa/khô." }
      - { key: mua_join, label: Báo mùa khi vào game, type: select, file: plugins/DuckyMoMoCore/config.yml, path: seasons.join-message,
          options: [ { value: true, label: Có }, { value: false, label: Không } ] }
      - { key: mua_mua_rain, label: "Mùa mưa: % đổ mưa mỗi 5 phút (khi đang tạnh)", type: number, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.mua.rain-start-chance }
      - { key: mua_kho_stop, label: "Mùa khô: % tạnh mưa mỗi 5 phút (khi đang mưa)", type: number, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.kho.rain-stop-chance }
      - { key: mua_mua_wheat, label: "Mùa mưa: Lúa mì", type: number, min: 0, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.mua.growth.WHEAT }
      - { key: mua_mua_sugar_cane, label: "Mùa mưa: Mía", type: number, min: 0, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.mua.growth.SUGAR_CANE }
      - { key: mua_mua_potatoes, label: "Mùa mưa: Khoai tây", type: number, min: 0, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.mua.growth.POTATOES }
      - { key: mua_mua_carrots, label: "Mùa mưa: Cà rốt", type: number, min: 0, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.mua.growth.CARROTS }
      - { key: mua_mua_melon, label: "Mùa mưa: Dưa hấu (quả)", type: number, min: 0, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.mua.growth.MELON }
      - { key: mua_mua_pumpkin, label: "Mùa mưa: Bí ngô (quả)", type: number, min: 0, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.mua.growth.PUMPKIN }
      - { key: mua_mua_cactus, label: "Mùa mưa: Xương rồng", type: number, min: 0, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.mua.growth.CACTUS }
      - { key: mua_kho_wheat, label: "Mùa khô: Lúa mì", type: number, min: 0, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.kho.growth.WHEAT }
      - { key: mua_kho_sugar_cane, label: "Mùa khô: Mía", type: number, min: 0, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.kho.growth.SUGAR_CANE }
      - { key: mua_kho_potatoes, label: "Mùa khô: Khoai tây", type: number, min: 0, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.kho.growth.POTATOES }
      - { key: mua_kho_carrots, label: "Mùa khô: Cà rốt", type: number, min: 0, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.kho.growth.CARROTS }
      - { key: mua_kho_melon, label: "Mùa khô: Dưa hấu (quả)", type: number, min: 0, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.kho.growth.MELON }
      - { key: mua_kho_pumpkin, label: "Mùa khô: Bí ngô (quả)", type: number, min: 0, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.kho.growth.PUMPKIN }
      - { key: mua_kho_cactus, label: "Mùa khô: Xương rồng", type: number, min: 0, max: 5, file: plugins/DuckyMoMoCore/config.yml, path: seasons.list.kho.growth.CACTUS }

  - title: Sàn thu mua (/donhang)
    category: Shop
    description: "Người chơi đặt đơn \"cần N món, giá P/món\": tiền bị giữ trước, người khác giao hàng nhận tiền ngay, hàng chờ người mua nhận cả khi offline. Phí đăng đơn không hoàn (rút tiền khỏi kinh tế). Chỉ nhận đồ thường (không tên riêng, không phù phép). Vật cấm đặt: plugins/DuckyMoMoCore/config.yml (orders.blacklist)."
    apply: [dmm reload]
    settings:
      - { key: dh_on, label: Bật sàn thu mua, type: select, file: plugins/DuckyMoMoCore/config.yml, path: orders.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: dh_max, label: Số đơn mở tối đa mỗi người, type: int, min: 1, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: orders.max-per-player }
      - { key: dh_amount, label: Số lượng tối đa một đơn, type: int, min: 1, max: 100000, file: plugins/DuckyMoMoCore/config.yml, path: orders.max-amount }
      - { key: dh_fee, label: Phí đăng đơn (%), type: number, min: 0, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: orders.fee-percent,
          note: "Tính trên tổng tiền đơn, trả khi đăng, không hoàn khi huỷ." }
      - { key: dh_days, label: Đơn tự đóng sau (ngày), type: int, min: 1, max: 60, file: plugins/DuckyMoMoCore/config.yml, path: orders.days }
      - { key: dh_minprice, label: Đơn giá thấp nhất, type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: orders.min-price }
      - { key: dh_maxprice, label: Đơn giá cao nhất, type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: orders.max-price }

  - title: Xưởng chế tạo (/xuong)
    category: Shop
