      - { key: kh_g2, label: "Mốc 2: Philippines (xu)", type: number, min: 1, file: plugins/DuckyMoMoCore/config.yml, path: frontier.goals.1.need,
          note: "Sau khi mở: Tâm viền 13150 / -1650, bán kính 1950 x 1550." }
      - { key: kh_g3, label: "Mốc 3: Borneo + Java (xu)", type: number, min: 1, file: plugins/DuckyMoMoCore/config.yml, path: frontier.goals.2.need,
          note: "Sau khi mở: Tâm viền 13150 / -1050, bán kính 1950 x 2150." }
      - { key: kh_pioneer, label: "Người Tiên Phong: số người đầu tiên được thưởng mỗi vùng mới", type: int, min: 0, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: frontier.pioneer.count,
          info: "Là gì: khi mốc khai hoang mở, vùng mới hiện ở /tpr (Mã Lai, Philippines, Borneo, Java) kèm đặc sản riêng. Ngần này người ĐẦU TIÊN đặt chân tới vùng đó nhận quà ở dưới, cả server được báo.\n0 = tắt." }
      - { key: kh_pioneer_rw, label: "Người Tiên Phong: quà", type: rewards, file: plugins/DuckyMoMoCore/config.yml, path: frontier.pioneer.rewards,
