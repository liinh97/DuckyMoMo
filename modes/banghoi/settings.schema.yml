  - title: Chống hack - cài đặt chung
    category: Chống hack
    apply: [grim reload]
    settings:
      - { key: grim_forget_seconds, label: Quên vi phạm sau (giây) - nhóm Di chuyển, type: int, min: 30, max: 86400, servers: [banghoi-1, practice-1], file: plugins/GrimAC/punishments.yml, path: Punishments.Simulation.remove-violations-after,
          note: "Số vi phạm chỉ cộng dồn trong khoảng này. Mặc định 300 (5 phút)." }
      - { key: grim_forget_combat, label: Quên vi phạm sau (giây) - nhóm Đánh xa, type: int, min: 30, max: 86400, servers: [banghoi-1, practice-1], file: plugins/GrimAC/punishments.yml, path: Punishments.Reach.remove-violations-after }
      - { key: grim_block_reach, info: "Có: cú đánh xa quá mức có thể (hack Reach) bị huỷ ngay, kể cả khi chưa đủ vi phạm để kick.\nLưu ý: ít khi bắt nhầm.", label: Chặn luôn cú đánh không thể xảy ra (quá xa), type: select, servers: [banghoi-1, practice-1], file: plugins/GrimAC/config.yml, path: Reach.block-impossible-hits,
          options: [ { value: true, label: Có }, { value: false, label: Không } ] }
      - { key: grim_experimental, info: "Là gì: các kiểm tra GrimAC đang thử nghiệm, dễ bắt nhầm.\nGợi ý: chỉ bật khi muốn thử và đang để \"Chỉ báo admin\".", label: Bật các kiểm tra thử nghiệm, type: select, servers: [banghoi-1, practice-1], file: plugins/GrimAC/config.yml, path: experimental-checks,
          options: [ { value: false, label: "Không (nên để tắt, dễ bắt nhầm)" }, { value: true, label: Có } ] }
      - { key: grim_alert_console, label: Ghi cảnh báo vào log server, type: select, servers: [banghoi-1, practice-1], file: plugins/GrimAC/config.yml, path: alerts.print-to-console,
          options: [ { value: true, label: "Có (xem ở trang Log)" }, { value: false, label: Không } ] }
      - { key: grim_forge_kick, label: Chặn bản Forge bị cấm (client hack giả Forge), type: select, servers: [banghoi-1, practice-1], file: plugins/GrimAC/config.yml, path: client-brand.disconnect-blacklisted-forge-versions,
