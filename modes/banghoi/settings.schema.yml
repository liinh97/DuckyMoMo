  # ---- Chống hack (GrimAC, bản alpha 2.3.74): ghi cho cả banghoi-1 và practice-1 ----
  - title: Chống hack - cách xử lý từng nhóm kiểm tra
    info: "Là gì: GrimAC chia kiểm tra thành nhóm; mỗi nhóm chọn chỉ báo, hay báo + kick khi đủ số vi phạm.\nLưu ý: bản 26.2 còn ALPHA, dễ bắt nhầm người ping cao / chơi điện thoại.\nGợi ý: để \"Chỉ báo admin\" vài tuần, xem cảnh báo rồi mới bật kick."
    category: Chống hack
    description: "GrimAC bản ALPHA cho 26.2, có thể bắt nhầm (nhất là người ping cao, người chơi điện thoại). Nên để Chỉ báo admin vài tuần, xem cảnh báo (Mod/Admin thấy trong game) rồi mới bật kick. Số vi phạm tự quên sau thời gian ở nhóm dưới."
    apply: [grim reload]
    settings:
      - key: grim_simulation
        info: "Vi phạm: mỗi lần kiểm tra thấy bất thường = 1 vi phạm.\nChỉ báo admin: Mod/Admin thấy tin trong game, không ai bị kick.\nKick khi đủ N: vi phạm cộng dồn trong khoảng \"Quên vi phạm sau\" (nhóm cài đặt chung).\nKick sớm: ngưỡng thấp hơn, bắt nhanh hơn nhưng dễ bắt nhầm người lag.\nLưu ý: các nhóm khác bên dưới chọn giống hệt."
        label: "Di chuyển (bay, tốc độ, Timer, NoFall)"
        type: select
        servers: [banghoi-1, practice-1]
        file: plugins/GrimAC/punishments.yml
        path: Punishments.Simulation.commands
        options:
          - { value: ["100:40 [alert]", "1:1 [log]", "100:100 [webhook]", "100:100 [proxy]"], label: "Chỉ báo admin (không kick)" }
          - { value: ["100:40 [alert]", "1:1 [log]", "100:100 [webhook]", "100:100 [proxy]", "300:0 kick %player% Hệ thống chống hack: nghi dùng hack (%check_name%). Nếu bị nhầm, báo admin."], label: "Báo + kick khi đủ 300 vi phạm" }
          - { value: ["100:40 [alert]", "1:1 [log]", "100:100 [webhook]", "100:100 [proxy]", "150:0 kick %player% Hệ thống chống hack: nghi dùng hack (%check_name%). Nếu bị nhầm, báo admin."], label: "Báo + kick sớm khi đủ 150 vi phạm (dễ nhầm hơn)" }
      - key: grim_knockback
        label: "Chống đẩy lùi (Velocity/AntiKB)"
        type: select
        servers: [banghoi-1, practice-1]
        file: plugins/GrimAC/punishments.yml
        path: Punishments.Knockback.commands
        options:
          - { value: ["5:5 [alert]", "1:1 [log]", "20:20 [webhook]", "20:20 [proxy]"], label: "Chỉ báo admin (không kick)" }
          - { value: ["5:5 [alert]", "1:1 [log]", "20:20 [webhook]", "20:20 [proxy]", "40:0 kick %player% Hệ thống chống hack: nghi dùng hack (%check_name%). Nếu bị nhầm, báo admin."], label: "Báo + kick khi đủ 40 vi phạm" }
          - { value: ["5:5 [alert]", "1:1 [log]", "20:20 [webhook]", "20:20 [proxy]", "20:0 kick %player% Hệ thống chống hack: nghi dùng hack (%check_name%). Nếu bị nhầm, báo admin."], label: "Báo + kick sớm khi đủ 20 vi phạm (dễ nhầm hơn)" }
      - key: grim_post
        label: "Gói tin bất thường (Post)"
        type: select
        servers: [banghoi-1, practice-1]
        file: plugins/GrimAC/punishments.yml
        path: Punishments.Post.commands
        options:
          - { value: ["20:20 [alert]", "1:1 [log]", "40:40 [webhook]", "40:40 [proxy]"], label: "Chỉ báo admin (không kick)" }
          - { value: ["20:20 [alert]", "1:1 [log]", "40:40 [webhook]", "40:40 [proxy]", "80:0 kick %player% Hệ thống chống hack: nghi dùng hack (%check_name%). Nếu bị nhầm, báo admin."], label: "Báo + kick khi đủ 80 vi phạm" }
          - { value: ["20:20 [alert]", "1:1 [log]", "40:40 [webhook]", "40:40 [proxy]", "40:0 kick %player% Hệ thống chống hack: nghi dùng hack (%check_name%). Nếu bị nhầm, báo admin."], label: "Báo + kick sớm khi đủ 40 vi phạm (dễ nhầm hơn)" }
      - key: grim_badpackets
        label: "Gói tin sai / làm crash (BadPackets)"
        type: select
        servers: [banghoi-1, practice-1]
        file: plugins/GrimAC/punishments.yml
        path: Punishments.BadPackets.commands
        options:
          - { value: ["20:20 [alert]", "1:1 [log]", "40:40 [webhook]", "40:40 [proxy]"], label: "Chỉ báo admin (không kick)" }
          - { value: ["20:20 [alert]", "1:1 [log]", "40:40 [webhook]", "40:40 [proxy]", "80:0 kick %player% Hệ thống chống hack: nghi dùng hack (%check_name%). Nếu bị nhầm, báo admin."], label: "Báo + kick khi đủ 80 vi phạm" }
          - { value: ["20:20 [alert]", "1:1 [log]", "40:40 [webhook]", "40:40 [proxy]", "40:0 kick %player% Hệ thống chống hack: nghi dùng hack (%check_name%). Nếu bị nhầm, báo admin."], label: "Báo + kick sớm khi đủ 40 vi phạm (dễ nhầm hơn)" }
      - key: grim_reach
        label: "Đánh xa (Reach)"
        type: select
        servers: [banghoi-1, practice-1]
        file: plugins/GrimAC/punishments.yml
        path: Punishments.Reach.commands
        options:
          - { value: ["1:1 [alert]", "1:1 [log]", "1:1 [webhook]", "1:1 [proxy]"], label: "Chỉ báo admin (không kick)" }
          - { value: ["1:1 [alert]", "1:1 [log]", "1:1 [webhook]", "1:1 [proxy]", "15:0 kick %player% Hệ thống chống hack: nghi dùng hack (%check_name%). Nếu bị nhầm, báo admin."], label: "Báo + kick khi đủ 15 vi phạm" }
          - { value: ["1:1 [alert]", "1:1 [log]", "1:1 [webhook]", "1:1 [proxy]", "7:0 kick %player% Hệ thống chống hack: nghi dùng hack (%check_name%). Nếu bị nhầm, báo admin."], label: "Báo + kick sớm khi đủ 7 vi phạm (dễ nhầm hơn)" }
      - key: grim_hitboxes
        label: "Hitbox to"
        type: select
        servers: [banghoi-1, practice-1]
        file: plugins/GrimAC/punishments.yml
        path: Punishments.Hitboxes.commands
        options:
          - { value: ["5:3 [alert]", "1:1 [log]", "5:3 [webhook]", "5:3 [proxy]"], label: "Chỉ báo admin (không kick)" }
          - { value: ["5:3 [alert]", "1:1 [log]", "5:3 [webhook]", "5:3 [proxy]", "20:0 kick %player% Hệ thống chống hack: nghi dùng hack (%check_name%). Nếu bị nhầm, báo admin."], label: "Báo + kick khi đủ 20 vi phạm" }
