  - title: Đồ phù phép vượt cấp (chỉ admin tạo)
    category: Phù phép
    description: "Lệnh admin: /dmm enchant <phù phép> <cấp> (món đang cầm), /dmm sach <phù phép> <cấp> [người] (tặng sách). Ghép sách vượt cấp vào đồ bằng đe giữ nguyên cấp. KHÔNG bán lấy tiền thật."
    apply: [dmm reload]
    settings:
      - { key: over_enchant_on, label: Bật lệnh tạo đồ vượt cấp, type: select, file: plugins/DuckyMoMoCore/config.yml, path: over-enchant.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: over_enchant_max, label: Cấp tối đa được tạo, type: int, min: 1, max: 255, file: plugins/DuckyMoMoCore/config.yml, path: over-enchant.max-level,
          note: "Vd 30 = tạo được tới Sắc bén XXX. Tối đa của game là 255." }

  - title: Dân làng bán hàng (Shopkeepers)
    category: Shop
    description: "Admin tạo NPC bằng /shopkeeper admin rồi chuột phải (cúi) vào NPC để sửa đồ bán và giá."
    apply: [shopkeeper reload, shopkeepersaddon reload]
    settings:
      - key: sk_player_shops
        label: Người chơi tự mở shop dân làng
        type: select
        options: [ { value: false, label: "Không (chỉ admin; người chơi dùng cửa hàng rương)" }, { value: true, label: "Cho phép" } ]
        commands: ["lp group default permission set shopkeeper.player {value}"]
        note: "Đặt quyền trong LuckPerms, có hiệu lực ngay."
      - { key: sk_daily_limit_on, label: Giới hạn tiền kiếm được mỗi ngày khi bán cho shop admin, type: select, file: plugins/ShopkeepersAddon/config.yml, path: economy.daily-earning-limit.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: sk_daily_limit, label: Mức giới hạn mỗi ngày (xu), type: number, min: 0, max: 100000000, file: plugins/ShopkeepersAddon/config.yml, path: economy.daily-earning-limit.limit }
      - { key: sk_tax, label: "Thuế shop người chơi (0-100 %)", type: int, min: 0, max: 100, file: plugins/Shopkeepers/config.yml, path: tax-rate }
      - { key: sk_max_shops, label: "Số shop tối đa mỗi người (-1 = không giới hạn)", type: int, min: -1, max: 1000, file: plugins/Shopkeepers/config.yml, path: max-shops-per-player }
      - { key: sk_towny, label: Shop người chơi chỉ được đặt trong thị trấn (ô đất thương mại), type: select, file: plugins/Shopkeepers/config.yml, path: enable-towny-restrictions,
          options: [ { value: true, label: Có }, { value: false, label: Không } ] }

  - title: Gói quà (/kit)
    category: Người mới
    description: "Mỗi gói: quà (đồ thường, đồ trong Thư viện đồ, xu, lệnh), bao lâu nhận lại, rank nào được nhận. Người chơi gõ /kit mở menu bấm nhận. Gói «lần đầu» tự phát khi vào Bang Hội Chiến lần đầu (không cần rank)."
    info: "Rank ủng hộ (mua bằng tiền thật) KHÔNG được có gói đồ chơi game: luật Mojang cấm pay-to-win (chỉ đồ trang trí).\nMỗi bậc Danh phận (Tị Nạn, Dân, Lương Dân, Hào Kiệt) chỉ nhận gói của ĐÚNG bậc hiện tại; muốn bậc cao nhận cả gói bậc thấp thì tick thêm. Admin có quyền * KHÔNG tự nhận mọi gói (xét nhóm thật).\nÔ «gói quà» ở mục Rank (Sứ Giả, ủng hộ, staff) cũng cho rank đó nhận gói có mã tương ứng.\nThử lại: /kit lamlai <tên> [mã] xoá lượt đã nhận; /kit <mã> <tên> phát thẳng.\nLưu xong: có hiệu lực ngay (dmm reload)."
    apply: [dmm reload]
    settings:
      - { key: goiqua_on, label: Bật gói quà, type: select, file: plugins/DuckyMoMoCore/config.yml, path: goi-qua.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: goiqua_landau, label: "Gói tự phát khi vào lần đầu (mã gói; trống = không phát)", type: text, file: plugins/DuckyMoMoCore/config.yml, path: goi-qua.lan-dau,
          note: "Mặc định tanthu. Phát 2 giây sau khi vào, một lần duy nhất." }
      - { key: goiqua_list, label: Các gói quà, type: kits, file: plugins/DuckyMoMoCore/config.yml, path: goi-qua.goi }

  - title: Chào người mới
    category: Người mới
    description: "Người chơi vào Bang Hội Chiến LẦN ĐẦU: cả server thấy dòng chào. Quà lần đầu: nhóm Gói quà ở trên. Tiền khởi đầu: loại Kinh tế."
    apply: [essentials reload]
    settings:
      - { key: newbie_announce, label: "Dòng chào cả server ({DISPLAYNAME} = tên; để trống = tắt)", type: text, file: plugins/Essentials/config.yml, path: newbies.announce-format }

  - title: Cốt truyện (NPC + nhiệm vụ BetonQuest)
    category: Cốt truyện
    description: "Chương 1 «Điềm Báo»: Già Làng → săn quái → mang sắt cho Bác Thợ Rèn → đào quặng ra Mảnh Sao Rơi → Người Gác Cổng → kết chương. Mỗi người làm được 1 lần."
    info: "Là gì: cốt truyện có NPC nói chuyện (bảng hội thoại, bấm chọn câu trả lời), nhiệm vụ nhiều bước, nhật ký /journal.\nNPC: Citizens. Admin đứng chỗ muốn đặt rồi gõ ĐÚNG tên: /npc create Già Làng, /npc create Bác Thợ Rèn, /npc create Người Gác Cổng (thêm /npc lookclose cho NPC quay mặt theo người chơi, /npc skin <tên> đổi skin). BetonQuest tìm NPC theo tên, không cần số ID.\nNội dung lời thoại: plugins/BetonQuest/QuestPackages/cotruyen/ (trong repo: modes/banghoi/server/plugins/BetonQuest/QuestPackages/cotruyen/).\nThử lại từ đầu cho một người: /bq tag <tên> del cotruyen>c1_b1 (và các tag cotruyen>c1_… khác; xem bằng /bq tag <tên> list), /bq objective <tên> del cotruyen>c1_sanquai.\nLưu xong: có hiệu lực ngay (bq reload)."
    apply: [bq reload]
    settings:
      - { key: bq_io, label: Kiểu bảng hội thoại, type: select, file: plugins/BetonQuest/config.yml, path: conversation.default_io,
          options: [ { value: dialog, label: "Bảng hội thoại (khuyên dùng; Bedrock hiện thành form)" }, { value: chest, label: "Rương bấm chọn (chắc chắn chạy mọi máy)" },
                     { value: "menu,tellraw", label: "Chữ trên màn hình, cuộn chuột chọn (chỉ Java)" }, { value: tellraw, label: "Trong khung chat, bấm số" } ],
          note: "Người chơi Bedrock hoặc Java bản cũ thấy lỗi thì đổi sang Rương bấm chọn." }
      - { key: bq_c1_quai, label: "Chương 1: số quái phải hạ", type: int, min: 1, max: 500, file: plugins/BetonQuest/QuestPackages/cotruyen/package.yml, path: constants.c1_so_quai }
      - { key: bq_c1_sat, label: "Chương 1: số thỏi sắt mang cho Thợ Rèn", type: int, min: 1, max: 640, file: plugins/BetonQuest/QuestPackages/cotruyen/package.yml, path: constants.c1_so_sat }
      - { key: bq_c1_quang, label: "Chương 1: số quặng phải đào", type: int, min: 1, max: 640, file: plugins/BetonQuest/QuestPackages/cotruyen/package.yml, path: constants.c1_so_quang,
          note: "Quặng tự đặt rồi đào lại không tính." }
      - { key: bq_c1_t1, label: "Chương 1: thưởng bước 1 (xu)", type: int, min: 0, max: 1000000, file: plugins/BetonQuest/QuestPackages/cotruyen/package.yml, path: constants.c1_thuong_b1 }
      - { key: bq_c1_t2, label: "Chương 1: thưởng bước 2 (xu)", type: int, min: 0, max: 1000000, file: plugins/BetonQuest/QuestPackages/cotruyen/package.yml, path: constants.c1_thuong_b2 }
      - { key: bq_c1_t3, label: "Chương 1: thưởng bước 3 (xu)", type: int, min: 0, max: 1000000, file: plugins/BetonQuest/QuestPackages/cotruyen/package.yml, path: constants.c1_thuong_b3 }
      - { key: bq_c1_t4, label: "Chương 1: thưởng bước 4 (xu)", type: int, min: 0, max: 1000000, file: plugins/BetonQuest/QuestPackages/cotruyen/package.yml, path: constants.c1_thuong_b4 }
      - { key: bq_c1_tket, label: "Chương 1: thưởng kết chương (xu)", type: int, min: 0, max: 1000000, file: plugins/BetonQuest/QuestPackages/cotruyen/package.yml, path: constants.c1_thuong_ket }
      - { key: bq_c1_kn, label: "Chương 1: điểm kinh nghiệm khi kết chương", type: int, min: 0, max: 100000, file: plugins/BetonQuest/QuestPackages/cotruyen/package.yml, path: constants.c1_thuong_kn }

  - title: Lữ khách (/lukhach)
    category: Cốt truyện
    description: "4 NPC lang thang ngoài đất hoang, mỗi người kể về một nơi phía sau Cổng Hoang (Cống Ngầm, Bắc Cực, Lâu Đài Hiệp Sĩ, Xưởng Hơi Nước), chỉ đường tới cổng, đi qua cổng rồi về kể thì được thưởng."
    info: "Là gì: NPC Citizens do DuckyMoMoCore tự đặt ở chỗ đất hoang ngẫu nhiên (luật chọn chỗ của Cổng Hoang: vùng /tpr đã mở, xa thị trấn), cứ mấy giờ lại dời đi chỗ khác và báo tin đồn (vùng + hướng, không toạ độ).\nChưa mở mùa (chưa có Cổng Hoang): lữ khách chỉ kể truyền thuyết, nói cổng chưa mở. Có cổng: chỉ đường theo tin đồn của cổng; cổng đã có người tìm ra thì nói ai tìm, ở đâu; thị trấn giữ cổng thì nói tên thị trấn.\nĐi qua Cổng Hoang dẫn tới nơi đó (kể cả trước khi gặp lữ khách) rồi về kể: nhận thưởng, mỗi lữ khách 1 lần.\nTên NPC, skin, câu tin đồn: wander-npcs.npcs trong plugins/DuckyMoMoCore/config.yml; lời thoại: plugins/BetonQuest/QuestPackages/cotruyen/lukhach/ (đổi tên thì sửa cả hai).\nAdmin: /lukhach ds (chỗ đứng + nút [Tới]), /lukhach doi <mã|all> (dời ngay), /lukhach xoa (xoá NPC).\nLưu xong: có hiệu lực ngay (dmm reload, bq reload)."
    apply: [dmm reload, bq reload]
    settings:
      - { key: lk_on, label: Bật lữ khách, type: select, file: plugins/DuckyMoMoCore/config.yml, path: wander-npcs.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: "Tắt (NPC đã đặt vẫn đứng đó: /lukhach xoa trước khi tắt)" } ] }
      - { key: lk_move, label: "Mấy giờ dời chỗ một lần", type: int, min: 1, max: 720, file: plugins/DuckyMoMoCore/config.yml, path: wander-npcs.move-hours }
      - { key: lk_announce, label: Báo tin đồn khi lữ khách dời chỗ, type: select, file: plugins/DuckyMoMoCore/config.yml, path: wander-npcs.announce,
          options: [ { value: true, label: Có }, { value: false, label: "Không (chỉ xem bằng /lukhach)" } ] }
      - { key: lk_thuong, label: "Thưởng khi về kể (xu, mỗi lữ khách)", type: int, min: 0, max: 1000000, file: plugins/BetonQuest/QuestPackages/cotruyen/package.yml, path: constants.lk_thuong }

  - title: Kỹ năng nghề (AuraSkills /skills)
    category: Nghề
    description: "6 kỹ năng nghề ở mức cơ bản: Trồng trọt, Đốn gỗ, Đào mỏ, Câu cá, Đào đất, Pha chế. Có trần cấp, chỉ số chiến đấu rất nhỏ, khả năng mana bậc 1, mốc thưởng xu, làm lại mỗi mùa."
    info: "Là gì: làm việc nào thì kỹ năng đó lên cấp (đào quặng → Đào mỏ…), menu /skills. Mỗi kỹ năng có khả năng nội tại (rơi thêm đồ, thêm kinh nghiệm, cây lớn nhanh, thuốc kéo dài…) tối đa bậc 4, và một khả năng mana (chuột phải cầm cuốc/rìu/xẻng/cuốc đất rồi đào: đào nhanh, đốn cả cây, xúc đất, tự gieo) chỉ bậc 1, hồi chiêu dài: đồ Xưởng vẫn mạnh hơn.\nChỉ số chiến đấu: cả 6 kỹ năng max cộng lại chỉ +1 tim và +2% sát thương (cố định trong plugins/AuraSkills/rewards/, không chỉnh ở đây). Đấu Trường tắt hẳn AuraSkills (không cộng gì). Thái Ấp và vùng spawn không cộng kinh nghiệm.\nĐÃ TẮT: kỹ năng Chiến đấu, Bắn cung, Phòng thủ, Nhanh nhẹn, Phù phép; mọi khả năng đánh nhau; chí mạng; bảng đồ rơi riêng (để EvenMoreFish, kho báu lo); ra tiền theo kinh nghiệm (uJobs lo).\nHạ trần cấp: ai đã vượt trần vẫn giữ cấp tới khi làm lại mùa sau.\nLưu xong: có hiệu lực ngay (skills reload)."
    apply: [skills reload]
    settings:
      - { key: as_cap, label: "Trần cấp mỗi kỹ năng", type: int, min: 5, max: 100, targets: [ { file: plugins/AuraSkills/skills.yml, path: "skills.auraskills/farming.options.max_level" }, { file: plugins/AuraSkills/skills.yml, path: "skills.auraskills/foraging.options.max_level" }, { file: plugins/AuraSkills/skills.yml, path: "skills.auraskills/mining.options.max_level" }, { file: plugins/AuraSkills/skills.yml, path: "skills.auraskills/fishing.options.max_level" }, { file: plugins/AuraSkills/skills.yml, path: "skills.auraskills/excavation.options.max_level" }, { file: plugins/AuraSkills/skills.yml, path: "skills.auraskills/alchemy.options.max_level" } ],
          note: "Mặc định 20. Nâng dần theo mùa thì người chơi lâu có thêm mục tiêu." }
      - { key: as_mana_unlock, label: "Cấp mở khả năng mana", type: int, min: 1, max: 100, targets: [ { file: plugins/AuraSkills/mana_abilities.yml, path: "mana_abilities.auraskills/replenish.unlock" }, { file: plugins/AuraSkills/mana_abilities.yml, path: "mana_abilities.auraskills/treecapitator.unlock" }, { file: plugins/AuraSkills/mana_abilities.yml, path: "mana_abilities.auraskills/speed_mine.unlock" }, { file: plugins/AuraSkills/mana_abilities.yml, path: "mana_abilities.auraskills/terraform.unlock" } ] }
      - { key: as_mana_cd, label: "Khả năng mana: hồi chiêu (giây)", type: int, min: 10, max: 3600, targets: [ { file: plugins/AuraSkills/mana_abilities.yml, path: "mana_abilities.auraskills/replenish.base_cooldown" }, { file: plugins/AuraSkills/mana_abilities.yml, path: "mana_abilities.auraskills/treecapitator.base_cooldown" }, { file: plugins/AuraSkills/mana_abilities.yml, path: "mana_abilities.auraskills/speed_mine.base_cooldown" }, { file: plugins/AuraSkills/mana_abilities.yml, path: "mana_abilities.auraskills/terraform.base_cooldown" } ] }
      - { key: as_mana_dur, label: "Khả năng mana: hiệu lực (giây)", type: number, min: 1, max: 60, targets: [ { file: plugins/AuraSkills/mana_abilities.yml, path: "mana_abilities.auraskills/replenish.base_value" }, { file: plugins/AuraSkills/mana_abilities.yml, path: "mana_abilities.auraskills/treecapitator.base_value" }, { file: plugins/AuraSkills/mana_abilities.yml, path: "mana_abilities.auraskills/speed_mine.base_value" }, { file: plugins/AuraSkills/mana_abilities.yml, path: "mana_abilities.auraskills/terraform.base_value" } ] }
