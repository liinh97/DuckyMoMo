  - title: Thái Ấp (/thaiap)
    category: Thế giới
    description: "Đất riêng mua bằng xu trong thế giới phẳng riêng: không PvP, không bị vây, không quái, không quặng. Để xây, làm nông, nuôi pet một mình."
    info: "Là gì: chỗ cho người không thích đóng góp vào thị trấn/nước mà vẫn muốn có nhà riêng.\nKhông có quặng/hang (đất phẳng) nên không thành chỗ cày tài nguyên an toàn thay cho thế giới chính.\nCó: mời bạn xây cùng, tham quan, thích và bảng xếp hạng Thái Ấp đẹp, bếp riêng (món /nauan nấu trong Thái Ấp của mình kéo dài hiệu ứng).\nCạnh và giá theo cấp: thai-ap.sizes / thai-ap.prices trong plugins/DuckyMoMoCore/config.yml (cùng số phần tử).\nĐổi cạnh khi đã có người mua: chỉ tăng, không giảm (mảnh cũ có thể chồng lên đường đi).\nLưu xong: có hiệu lực ngay (dmm reload)."
    apply: [dmm reload]
    settings:
      - { key: tap_on, label: Bật Thái Ấp, type: select, file: plugins/DuckyMoMoCore/config.yml, path: thai-ap.enabled, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: tap_prices, label: "Giá: mua, mở rộng lần 1, lần 2 (xu)", type: list, items: int, file: plugins/DuckyMoMoCore/config.yml, path: thai-ap.prices, note: "Cách nhau dấu phẩy, vd 5000, 8000, 15000" }
      - { key: tap_trust, label: Số người được mời cùng xây, type: int, min: 0, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: thai-ap.max-trusted }
      - { key: tap_kitchen, label: "Bếp Thái Ấp: kéo dài hiệu ứng món ăn (%)", type: number, min: 0, max: 500, file: plugins/DuckyMoMoCore/config.yml, path: thai-ap.kitchen-bonus }

  - title: Sự kiện mùa (Lũ, Hạn hán)
    category: Thế giới
    description: "Vài ngày đặc biệt trong mùa: Lũ cuối mùa mưa (mưa suốt, Thủy tộc dễ bắt), Hạn hán giữa mùa khô (không mưa, cây chậm, lương thực quý)."
    info: "Là gì: sự kiện theo ngày của mùa (/mua). Ngày thứ mấy của mùa: 1 = ngày đầu; số âm đếm từ cuối (-1 = ngày cuối).\nLũ: ép mưa, lúa/khoai/cà rốt/củ dền lớn chậm, tảo bẹ và mía nhanh, bắt Thủy tộc dễ hơn.\nHạn hán: ép nắng, cây lớn chậm, nộp nông sản vào kho lương được nhân điểm.\nThử ngay: /mua sukien lu (hoặc han), trả về lịch: /mua sukien tudong.\nSửa sâu hơn (cây nào, % nào): seasons.events trong plugins/DuckyMoMoCore/config.yml.\nLưu xong: có hiệu lực ngay (dmm reload)."
    apply: [dmm reload]
    settings:
      - { key: ev_lu_from, label: "Lũ: từ ngày thứ (của mùa mưa)", type: int, min: -30, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: seasons.events.lu.from-day }
      - { key: ev_lu_to, label: "Lũ: tới ngày thứ", type: int, min: -30, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: seasons.events.lu.to-day }
      - { key: ev_lu_cap, label: "Lũ: bắt Thủy tộc dễ hơn (%)", type: int, min: -100, max: 100, file: plugins/DuckyMoMoCore/config.yml, path: seasons.events.lu.capture-bonus.thuytoc }
      - { key: ev_han_from, label: "Hạn hán: từ ngày thứ (của mùa khô)", type: int, min: -30, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: seasons.events.han.from-day }
      - { key: ev_han_to, label: "Hạn hán: tới ngày thứ", type: int, min: -30, max: 30, file: plugins/DuckyMoMoCore/config.yml, path: seasons.events.han.to-day }
      - { key: ev_han_supply, label: "Hạn hán: nhân điểm nông sản nộp kho lương", type: number, min: 0.1, max: 10, file: plugins/DuckyMoMoCore/config.yml, path: seasons.events.han.supply-multiplier }

  - title: Đặc sản vùng (/dacsan)
    category: Thế giới
    description: "Phe có nhiều thị trấn nhất trong một vùng (vùng của /rtp) thì dân phe đó gặt đặc sản vùng ở đâu cũng được mùa thêm %."
    info: "Là gì: lý do kinh tế để chiếm đất. Phe = nước, hoặc thị trấn chưa vào nước. Đếm theo nhà chính/spawn của thị trấn. Hoà nhau = vùng chưa có chủ.\nĐặc sản mặc định: Tây Bắc khoai, Lào cà rốt, Trung Bộ ca cao, Nam Bộ lúa, Thái Lan lúa + ca cao, Myanmar củ dền, Nam Trung Quốc khoai + củ dền.\nĐổi đặc sản: region-specialty.regions trong plugins/DuckyMoMoCore/config.yml (chỉ cây WHEAT, CARROTS, POTATOES, BEETROOTS, COCOA).\nNgười chơi xem: /dacsan, trang chủ web mục Mùa.\nLưu xong: có hiệu lực ngay (dmm reload)."
    apply: [dmm reload]
    settings:
      - { key: rs_on, label: Bật đặc sản vùng, type: select, file: plugins/DuckyMoMoCore/config.yml, path: region-specialty.enabled, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: rs_refresh, label: Tính lại chủ vùng mỗi (phút), type: int, min: 1, max: 1440, file: plugins/DuckyMoMoCore/config.yml, path: region-specialty.refresh-minutes }

  - title: Chợ đen · thu mua (/choden thumua)
    category: Shop
    description: "Người chơi đặt đơn \"cần N món, giá P/món\": tiền bị giữ trước, người khác giao hàng nhận tiền ngay, hàng chờ người mua nhận cả khi offline. Phí đăng đơn không hoàn (rút tiền khỏi kinh tế). Chỉ nhận đồ thường (không tên riêng, không phù phép). Vật cấm đặt: plugins/DuckyMoMoCore/config.yml (orders.blacklist)."
    apply: [dmm reload]
    settings:
      - { key: dh_on, label: Bật Chợ đen (thu mua), type: select, file: plugins/DuckyMoMoCore/config.yml, path: orders.enabled,
          options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: dh_max, label: "Số đơn mở tối đa mỗi người (khi không có rank nào cấp thêm; rank: Người mới › Danh phận / Quyền lợi theo rank)", type: int, min: 1, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: orders.max-per-player }
      - { key: dh_amount, label: Số lượng tối đa một đơn, type: int, min: 1, max: 100000, file: plugins/DuckyMoMoCore/config.yml, path: orders.max-amount }
      - { key: dh_fee, label: Phí đăng đơn (%), type: number, min: 0, max: 50, file: plugins/DuckyMoMoCore/config.yml, path: orders.fee-percent,
          note: "Tính trên tổng tiền đơn, trả khi đăng, không hoàn khi huỷ." }
      - { key: dh_days, label: Đơn tự đóng sau (ngày), type: int, min: 1, max: 60, file: plugins/DuckyMoMoCore/config.yml, path: orders.days }
      - { key: dh_minprice, label: Đơn giá thấp nhất, type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: orders.min-price }
      - { key: dh_maxprice, label: Đơn giá cao nhất, type: number, min: 0, file: plugins/DuckyMoMoCore/config.yml, path: orders.max-price }

  - title: Thăng Cấp (/capdo)
    category: Kinh tế
    description: "Cấp riêng của server, cày cuốc: lên cấp cần xu (trả khi lên), giờ chơi thật và điểm hạ gục, càng lên càng lâu. Mỗi cấp được điểm thuộc tính (Máu, Sức mạnh, Bền bỉ, Nhanh nhẹn); đặc quyền mua bằng xu khi đủ cấp."
    info: "Lên cấp N cần: xu = Xu gốc × N^Số mũ (trả khi lên, rút tiền khỏi kinh tế); TỔNG giờ chơi thật của mùa ≥ hệ số × N^số mũ; TỔNG điểm hạ gục ≥ hệ số × N^số mũ.\nMặc định: giờ chơi cấp 10 = 4 g, 25 = 25 g, 50 = 100 g, 100 = 400 g; xu cấp 1 = 250, cấp 100 ≈ 4.000 (tổng tới cấp 10 ≈ 6.600, tới 100 ≈ 250.000); điểm hạ gục cấp 10 = 100, 100 = 10.000.\nĐiểm hạ gục: hạ quái + Điểm quái, hạ người + Điểm người (quái từ lồng không tính; giết lại cùng một người trong thời gian chờ không tính).\nĐiểm thuộc tính: mỗi cấp + mỗi mốc. 4 thuộc tính, bậc k tốn k điểm: mặc định cấp 100 có 110 điểm = max đúng 2 thuộc tính (mỗi cái 55). Tắt trong Đấu Trường. Tẩy điểm trong /capdo.\nĐặc quyền: mua bằng xu, cần đủ cấp, cấp quyền LuckPerms vĩnh viễn (mùa mới làm lại thì gỡ). Thêm đặc quyền khác: level-up.shop trong plugins/DuckyMoMoCore/config.yml.\nCấp hiện cạnh tên trên Tab (%dmmcap_cap%).\nLưu xong: có hiệu lực ngay (dmm reload)."
    apply: [dmm reload]
    settings:
      - { key: lvu_on, label: Bật Thăng Cấp, type: select, file: plugins/DuckyMoMoCore/config.yml, path: level-up.enabled, options: [ { value: true, label: Bật }, { value: false, label: Tắt } ] }
      - { key: lvu_keep, label: Sang mùa mới (đổi map), type: select, file: plugins/DuckyMoMoCore/config.yml, path: level-up.keep-on-new-season, options: [ { value: false, label: "Làm lại từ cấp 0 (mặc định)" }, { value: true, label: "Giữ cấp, thuộc tính và đặc quyền" } ] }
      - { key: lvu_max, label: "Cấp tối đa", type: int, min: 1, max: 1000, file: plugins/DuckyMoMoCore/config.yml, path: level-up.max-level }
      - { key: lvu_money, label: "Xu gốc (cấp 1)", type: number, min: 0, max: 100000000, file: plugins/DuckyMoMoCore/config.yml, path: level-up.money-base }
      - { key: lvu_exp, label: "Số mũ tăng xu theo cấp", type: number, min: 0, max: 3, file: plugins/DuckyMoMoCore/config.yml, path: level-up.money-exponent, note: "0,6 = cấp sau đắt hơn chút ít (mặc định); 1 = tăng đều" }
