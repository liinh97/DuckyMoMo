services:
  pokemon-1:
    image: itzg/minecraft-server
    profiles: ["pokemon"]          # mặc định KHÔNG chạy. Bật: docker compose --profile pokemon up -d
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: ${POKEMON_MC_VERSION:-1.21.1}   # phải đúng phiên bản Cobblemon hỗ trợ
      MEMORY: 8G
      TZ: Asia/Ho_Chi_Minh
      ONLINE_MODE: "FALSE"
      # Mod tải tự động từ Modrinth
      MODRINTH_PROJECTS: |
        fabric-api
        cobblemon
        fabricproxy-lite
        luckperms
      CFG_VELOCITY_SECRET: ${VELOCITY_SECRET}
    mem_limit: 10g
    volumes:
      - ../../data/pokemon-1:/data
      - ./server/config:/config:ro    # -> /data/config (FabricProxy-Lite.toml…)
    depends_on:
      mariadb:
        condition: service_healthy

  # Sao lưu thế giới + dữ liệu plugin của pokemon-1 bằng restic (chỉ lưu phần thay đổi).
  # Dùng RCON tạm dừng ghi khi sao lưu; mật khẩu RCON tự đọc từ data/.rcon-cli.env. Xem docs/backup.md.
  backup-pokemon-1:
    image: itzg/mc-backup
    profiles: ["pokemon"]
    restart: unless-stopped
    hostname: backup-pokemon-1       # restic phân biệt bản sao lưu theo hostname, phải cố định
    environment:
      TZ: Asia/Ho_Chi_Minh
      BACKUP_METHOD: restic
      BACKUP_NAME: pokemon-1
      RCON_HOST: pokemon-1
      BACKUP_INTERVAL: 1h
      PAUSE_IF_NO_PLAYERS: "true"   # không ai chơi thì không sao lưu lại
      INITIAL_DELAY: 5m
      RESTIC_REPOSITORY: /backups/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Chưa đặt RESTIC_PASSWORD trong .env}
      RESTIC_RETRY_LOCK: 5m         # nhiều service dùng chung một kho
      PRUNE_RESTIC_RETENTION: --keep-hourly 24 --keep-daily 14 --keep-weekly 8
    volumes:
      - ../../data/pokemon-1:/data:ro
      - ../../backups:/backups
    depends_on:
      pokemon-1:
        condition: service_started
