# Cẩm nang trong game (/huongdan, /hd). Sửa trên trang Cài đặt > "Cẩm nang game" (tự chép, có hiệu lực ngay), hoặc sửa file này rồi chạy ./ops/huongdan.sh (chép sang lobby, banghoi, practice,
# có hiệu lực ngay, không cần khởi động lại). Plugin: DuckyMoMoCore (Guide.java).
# - Plugin TỰ NGẮT DÒNG theo bề rộng chữ và TỰ SANG TRANG khi quá 13 dòng (dòng cuối tự thêm "« Mục lục"). Xuống dòng bằng \n hoặc khối "|-".
#   Nên giữ mỗi trang nguồn khoảng 12 dòng ngắn để không bị cắt giữa chừng (trang tiếp theo không có tiêu đề).
# - MỤC LỤC chỉ có 1 trang (14 dòng): toc-title + mỗi chương 1 dòng + toc-footer. Tối đa khoảng 11 chương, tên chương ngắn (≤ 17 chữ).
# - Mã chương batdau / banghoi / practice là chương mở mặc định ở sảnh / Bang Hội Chiến / Practice (guide.default-chapter): đừng đổi mã.
# - Mã màu: &0 đen, &1 xanh đậm, &2 xanh lá đậm, &4 đỏ đậm, &5 tím, &6 vàng cam, &8 xám, &l đậm, &r bỏ định dạng.
#   Nền sách màu giấy: tránh &e/&f/&a (khó đọc).
# - Người chơi điện thoại (Bedrock) thấy cả chương trong một bảng.
# - SỐ LIỆU (phí thị trấn, lịch công thành, giá...) ghi tay: đổi trên trang Cài đặt thì sửa luôn ở đây.
#   Đối chiếu 19/10: Towny 500/25/1000 xu, phí 10/100 xu/ngày; hoà bình chờ 2 ngày, rời 14 ngày; Hội đồng nhiệm kỳ 30 ngày;
#   tổ chức 3 người, 100 xu/tuần; Kiến Trúc Sư đăng ký tuần 12, bình chọn tuần 13; bắt pet gốc 30%, bùa +25%; Thái Ấp 5.000/8.000/15.000.
title: "&6Cẩm nang DuckyMoMo"
author: "DuckyMoMo"
toc-title: "&6&lCẨM NANG &r&8(/hd)\n"
toc-footer: "&8Bấm tên chương"

chapters:
- id: batdau
  name: Bắt đầu
  pages:
  - |-
    &6&lChào mừng!
    &0DuckyMoMo có nhiều chế độ chơi, vào từ &lsảnh&r&0 (đảo hoa anh đào).

    &1Lần đầu vào:
    &0/register <mk> <mk>
    &8Vd: /register meo123 meo123
    &1Lần sau:
    &0/login <mk>
  - |-
    &6&lChào mừng! (tiếp)
    &0Vào lại trong &l1 giờ&r&0 từ cùng mạng thì khỏi /login; quá 1 giờ hoặc đổi mạng phải /login lại.
    &0Sai mật khẩu 3 lần: gõ &1/captcha <mã>&0 theo mã hiện trong chat. Sai 10 lần: chờ 30 phút.
  - |-
    &6&lMật khẩu
    &4Lưu ý: &0mật khẩu ít nhất 6 ký tự, không dùng 123456, matkhau…, không giống tài khoản khác, không đưa cho ai.
    &0Đổi: &1/changepassword <cũ> <mới>
  - |-
    &6&lChọn chế độ
    &0Bấm &lla bàn&r&0 trên tay hoặc gõ &1/menu&0.

    &2Bang Hội Chiến&0: sinh tồn, thị trấn, công thành (chế độ chính).
    &2Practice&0: luyện PvP 1v1, không mất đồ.
    &8Pokémon: chưa mở.
  - |-
    &6&lĐổi chế độ
    &0Đổi bất cứ lúc nào:
    &1/server lobby
    &1/server banghoi-1
    &1/server practice-1
    &0Đồ, tiền mỗi chế độ &lriêng&r&0, không mang qua lại.
    &4Lưu ý: &0đang giao tranh mà đổi server = thoát game lúc đánh nhau (chết, rơi đồ).
  - |-
    &6&lLệnh chung
    &1/msg <tên> <tin> &0nhắn riêng
    &8Vd: /msg Linh chào bạn
    &1/r <tin> &0trả lời
    &1/huongdan &0(hoặc &1/hd&0) mở sách này
    &1/caidat &0bật/tắt chat, thông báo
    &1/web &0mã đăng nhập web
    &1/rank &0rank ủng hộ
  - |-
    &6&lLệnh chung (tiếp)
    &1/changepassword <cũ> <mới>
  - |-
    &6&lĐiện thoại (Bedrock)
    &0Bấm la bàn: hiện &lbảng nút&r&0 thay cho menu rương.
    &0Cẩm nang hiện thành bảng, mỗi chương một nút.
    &0Lệnh gõ giống máy tính.
    &8Voice chat chưa có cho điện thoại.
- id: luat
  name: Luật server
  pages:
  - |-
    &4&lLUẬT
    &01. Không hack, không x-ray, không auto-click, không mod nhìn xuyên.
    2. Không chửi bới, quấy rối, phân biệt. Từ tục bị che &8***&0.
    3. Không spam, không quảng cáo server khác.
  - |-
    &4&lLUẬT (tiếp)
    &8Chống hack tự động: bị kick nhầm thì báo admin kèm giờ.
  - |-
    &4&lLUẬT (tiếp)
    &04. Không lợi dụng lỗi game: thấy lỗi thì báo admin (có thể được thưởng).
    5. Đánh nhau theo luật công thành. Thoát game khi đang đánh = chết, rơi đồ.
    6. Không lừa đảo giao dịch: dùng &1/trade&0 cho an toàn.
  - |-
    &4&lLUẬT (tiếp)
    &8Vi phạm: mute, kick, ban tuỳ mức độ.
  - |-
    &4&lLUẬT (tiếp)
    &07. Map là Trái Đất nhưng lãnh thổ trong game &lkhông&r&0 liên quan chủ quyền thật. Cấm tên, chat kích động biên giới, biển đảo, dân tộc.
    8. Tối đa &l2 tài khoản&r&0. Acc phụ phải khai (&1/taikhoanphu&0), không được đánh trận.
  - |-
    &4&lLUẬT (tiếp)
    &09. Vũ khí nổ &lkhông giết người&r&0: end crystal, respawn anchor, nổ giường không trừ máu người chơi; xe goòng TNT chỉ còn 30%.
    &0Đánh bằng kiếm, cung, chuỳ cho công bằng.
    10. Giết dân hoà bình (không tự vệ) bị &4Hội Bàn Tròn&0 xử.
- id: banghoi
  name: "Bang Hội: cơ bản"
  pages:
  - |-
    &6&lBANG HỘI CHIẾN
    &0Lập thị trấn, gom thành quốc gia, chiếm đất và &lcông thành&r&0 nước khác. Không thích đánh nhau: vào &2Liên minh Hoà Bình&0.

    &0Bản đồ là &lTrái Đất 1:1000&r&0. Mùa 1: &lĐông Nam Á&r&0 (có viền, hết mùa mở vùng mới).
  - |-
    &6&lMới vào
    &0Có &l15 phút&r&0 bảo vệ: không ai đánh được bạn.
    &1/newbie disable &0tắt sớm
    &1/newbie checktime &0còn bao lâu
    &0Khu spawn an toàn: không PvP, không phá.
    &0Bắt đầu với &l200 xu&r&0 + quà tân thủ.
  - |-
    &6&lĐi lại
    &1/spawn &0về spawn
    &1/warp &0danh sách địa danh
    &8Vd: /warp pvp
    &1/sethome nha &0đặt nhà tên "nha"
    &1/home nha &0về nhà
    &1/tpa Linh &0xin tới chỗ Linh
    &1/tpaccept &0· &1/tpdeny
  - |-
    &6&lĐi lại (tiếp)
    &4Lưu ý: &0đang giao tranh không dịch chuyển được.
  - |-
    &6&lĐi tìm đất
    &0Muốn lập thị trấn xa spawn: bấm &lNPC dịch chuyển&r&0 ở spawn hoặc gõ &1/tpr&0, chọn khu.
    &8Vd: /tpr taybac
    &0Khu: taybac, lao, trungbo, nambo, thailan, myanmar, namtq, ngaunhien.
  - |-
    &6&lĐi tìm đất (tiếp)
    &8Chờ 5 phút giữa 2 lần, đứng yên 3 giây. Không thả xuống nước, sát thị trấn.
  - |-
    &6&lGiờ chơi thật
    &1/hoatdong &0xem giờ.
    &0Chỉ tính lúc thật sự chơi, đứng AFK không tính.
    &03 giờ: được lập thị trấn.
    &05 giờ: được phong quân hàm, ứng cử, bình chọn.
  - |-
    &6&lGiờ chơi thật (tiếp)
    &0Chơi &l3 giờ/tuần&r&0 là &ldân hoạt động&r&0: thị trấn được thêm đất nhờ bạn.
  - |-
    &6&lĐánh nhau
    &0Bị đánh thì bị &lgắn cờ giao tranh&r&0 15 giây:
    &4thoát game lúc này là chết, rơi đồ.
    &0Đang giao tranh không dịch chuyển được.
    &0Combat kiểu &l1.8&r&0: bấm nhanh, không hồi chiêu.
    &1/pvpstatus &0xem trạng thái.
  - |-
    &6&lĐồ rơi & dọn rác
    &0Đồ dưới đất bị &ldọn mỗi 10 phút&r&0 (báo trước 30 và 5 giây).
    &2Chết: &0đồ quanh chỗ chết (8 khối) được giữ &l10 phút&r&0, quay lại nhặt kịp.
    &0Đồ đổi tên bằng đe không bị dọn.
    &0Giờ công thành tạm ngưng dọn.
  - |-
    &6&lCÀI ĐẶT CÁ NHÂN
    &1/caidat &0tự bật/tắt: chat chung, tin nhắn riêng, thông báo vào/ra, tử vong, dọn rác, bảng bên phải, nhận TPA, nhắc giờ công thành…
    &0Đổi được cả trên web (trang tài khoản).
    &1/sb &0ẩn/hiện bảng bên phải.
  - |-
    &6&lDANH PHẬN
    &0Rank chơi &lmiễn phí&r&0, bấm nhận trong &1/danhphan&0:
    &8Tị Nạn&0 (mới vào) → &7Dân&0 → &2Lương Dân&0 → &6Hào Kiệt&0.
    &0Dân: chơi thật 6 giờ + xong chương 1 (Già Làng).
    &0Lương Dân: 24 giờ + cấp 10. Hào Kiệt: 72 giờ + cấp 25.
  - |-
    &6&lDANH PHẬN: quyền lợi
    &0Tị Nạn: 1 nhà, 2 món chợ.
    &0Dân: 2 nhà, 1 balo 27 ô, 4 món chợ.
    &0Lương Dân: 3 nhà, 2 balo 36 ô, 6 món.
    &0Hào Kiệt: 5 nhà, 3 balo 45 ô, 8 món.
    &8Giữ danh phận khi /choilai. Số liệu có thể đổi: xem /danhphan.
  - |-
    &c&l◆ RANK MEDIA
    &0Cho người &llivestream&r&0 về server (TikTok, YouTube…), miễn phí, admin xét duyệt.
    &0Có thêm nhà, balo, món chợ, đơn thu mua, vé vòng quay nhanh hơn, gói quà &1/kit media&0.
    &0Xem yêu cầu: thẻ Media trong &1/danhphan&0.
  - |-
    &6&lBALO
    &1/balo &0mở balo (&1/balo 2&0 balo thứ 2).
    &0Số balo và số ô theo danh phận. Rank giảm ô: đồ ở ô khoá vẫn giữ.
    &4Lưu ý: &0không mở được lúc đang đánh nhau, trong vùng công thành giờ đánh; &1/choilai&0 là mất đồ trong balo.
  - |-
    &6&lTHĂNG CẤP
    &1/capdo &0xem điều kiện, bấm lên cấp khi đủ:
    &0xu (trả lúc lên), giờ chơi, điểm hạ gục (quái +1, người +10).
    &0Mỗi cấp được &lđiểm&r&0 đổi đặc quyền: /craft, /anvil, /hat, /disposal, giảm 5% Xưởng…
    &0Mỗi 10 cấp có quà mốc. Cấp hiện cạnh tên ở Tab.
  - |-
    &6&lTHĂNG CẤP (tiếp)
    &8Hạ cùng 1 người liên tục chỉ tính 1 lần mỗi 10 phút.
  - |-
    &6&lBXH & DANH HIỆU
    &1/bxh&0: Bá Chủ (quốc gia), Chiến Thần (đánh trận), Đại Phú Hộ, Kiến Trúc Sư.
    &8Vd: /bxh chienthan
    &0Thưởng là &ldanh hiệu&r&0 giữ mãi:
    &1/danhhieu &0xem
    &1/danhhieu chon <mã>
    &1/danhhieu tat &0bỏ
    &8Không bán sức mạnh.
  - |-
    &6&lSỔ THÀNH TÍCH
    &0Chơi một mình cũng có mục tiêu: khám phá, câu cá, săn quái, nuôi pet, Đấu Trường, nấu ăn…
    &0Đạt là nhận quà, mốc khó có &6danh hiệu&0.
    &1/thanhtich
  - |-
    &6&lVINH DANH
    &0Mỗi mùa &l3 tháng&r&0, hết mùa làm lại với bản đồ mới.
    &0Người thắng được khắc tên, dựng tượng ở &6Quảng trường Vinh danh&0 tại sảnh, giữ mãi.
    &1/vinhdanh tp &0tới xem.
  - |-
    &6&lChơi lại từ đầu
    &1/choilai&0 rồi &1/choilai xacnhan&0: mất hết đồ, tiền, nhà, nghề, thị trấn. Giữ rank, danh hiệu, án phạt.
    &07 ngày/lần, 3 lần/mùa. Quà tân thủ chỉ lần đầu.
    &4Trước khi chơi lại: &0dỡ shop rương, rút hàng &1/ah&0 (không thì mất).
  - |-
    &6&lTài khoản phụ
    &0Tối đa 2 tài khoản/người. Acc phụ phải khai:
    &1/taikhoanphu khai <tên chính>
    &0rồi acc chính gõ
    &1/taikhoanphu xacnhan <tên phụ>
    &8Vd: /taikhoanphu khai Linh
  - |-
    &6&lTài khoản phụ (tiếp)
    &0Acc phụ không nhận quân hàm, không gây sát thương trong vùng vây.
- id: thitran
  name: Thị trấn, hoà bình
  pages:
  - |-
    &6&lThị trấn
    &0Cần &l3 giờ&r&0 chơi thật.
    &1/t new <tên> &0lập (&l500 xu&r&0)
    &8Vd: /t new HaNoi
    &1/t claim &0mua ô 16x16 đang đứng (&l25 xu&r&0)
    &1/t add <tên> &0mời dân
    &1/t kick <tên> &0đuổi
    &1/t deposit <tiền> &0nộp quỹ
    &8Vd: /t deposit 300
  - |-
    &6&lThị trấn (tiếp)
    &0Phí duy trì &l10 xu mỗi ngày&r&0, trừ vào quỹ.
    &4Hết quỹ thì thị trấn tan, mất đất!
    &1/t &0thông tin · &1/res &0bạn
    &1/t spawn &0về thị trấn
    &1/t set spawn &0đặt chỗ về
    &1/plot claim &0nhận lô đất trong thị trấn
  - |-
    &6&lThị trấn (tiếp)
    &4Lưu ý: &0không được lập sát spawn (300 khối); đổi thị trấn phải chờ 3 ngày.
  - |-
    &6&lThị trấn: đất
    &0Số ô được mua tăng theo số &ldân hoạt động&r&0 (chơi 3 giờ/tuần).
    &0Nhà, rương trong thị trấn được bảo vệ: người ngoài không phá, không mở được.
    &0Có &lbản đồ web&r&0 xem ranh giới các thị trấn.
  - |-
    &6&lQuốc gia
    &0Gom nhiều thị trấn:
    &1/n new <tên> &0(&l1000 xu&r&0, thị trấn bạn là thủ đô)
    &1/n add <thị trấn>
    &1/n ally add <nước> &0đồng minh
    &8Vd: /n new DaiViet
    &0Phí &l100 xu/ngày&r&0.
    &4Chỉ quốc gia mới công thành được, cần ít nhất 2 thị trấn.
  - |-
    &2&lLIÊN MINH HOÀ BÌNH
    &0Thị trấn trong liên minh không bị vây, không bị chiếm, đất luôn tắt PvP.
    &0Đổi lại: không quân hàm, không đánh trận, chỉ được tự vệ.
    &1/hoabinh &0thông tin
    &1/hoabinh danhsach
  - |-
    &2&lVào / rời hoà bình
    &0Thị trưởng gõ:
    &1/hoabinh vao&0 · &1/hoabinh roi
    &4Lưu ý:
    &0- Thị trấn phải &lchạm đất&r&0 liên minh.
    &0- Vào: chờ &l2 ngày&r&0 mới được bảo vệ.
    &0- Rời: mất bảo vệ ngay, &l14 ngày&r&0 mới vào lại.
  - |-
    &2&lQuyền lợi hoà bình
    &0Chợ &1/ah&0 chỉ dùng trong đất hoà bình.
    &0Bán &1/sell&0 ở kinh đô được &l+20%&r&0.
    &0Shop rương trong đất hoà bình &lmiễn thuế&r&0 (ngoài: 5%).
    &0Có công thành gần nhà sẽ được báo trước 2 ngày: hãy di tản khỏi vùng vây.
  - |-
    &2&lHỘI ĐỒNG HOÀ BÌNH
    &0Thị trưởng thị trấn hoà bình có &l≥3 dân hoạt động&r&0 có 1 phiếu.
    &0Bầu &lĐại diện&r&0 (nhiệm kỳ 30 ngày, bầu trong 2 ngày cuối, tối đa 2 nhiệm kỳ liền).
    &1/hoidong &0xem đại diện, kiến nghị đang mở.
  - |-
    &2&lHội đồng: lệnh
    &1/hoidong ungcu &0ứng cử (dân hoà bình, ≥5 giờ)
    &1/hoidong bau <tên>
    &8Vd: /hoidong bau Linh
    &1/hoidong phieu <mã> co|khong
    &8Vd: /hoidong phieu K3 co
    &1/hoidong baimien &0đề nghị bãi nhiệm
  - |-
    &2&lHội đồng: lệnh (tiếp)
    &1/hoidong deuoi <thị trấn> <lý do>
    &8Phiếu công khai. Kiến nghị mở 3 ngày; bãi nhiệm cần 2/3.
  - |-
    &2&lTỔ CHỨC
    &0Dân hoà bình lập tổ chức, xin giấy phép:
    &2Thương Hội&0: thêm shop rương, đăng 15 món &1/ah&0, rao hàng.
    &2Sự kiện&0: tổ chức sự kiện cho cả server.
    &1/tochuc lap thuonghoi <tên>
    &8Vd: /tochuc lap sukien LeHoiXuan
  - |-
    &2&lTổ chức: lệnh
    &1/tochuc moi <tên> &0mời (người đó &1/tochuc vao&0 trong 10 phút)
    &1/tochuc gop <xu> &0góp quỹ
