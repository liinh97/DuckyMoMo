# DuckyMoMo 21/10: chữ trong menu đã Việt hoá (tools: scratchpad duels_gui.py, sửa tay ở đây).
# =============================================================
# Duels - Arena Selector GUI Configuration
# =============================================================
# This GUI opens when a player clicks on the Arena Selector option
# in the Duel Request Settings GUI.
#
# Configurations available:
#   title: The inventory title (supports & color codes and MiniMessage tags)
#   rows: Number of rows in the GUI (1 - 6)
#   item-slots: The exact slots where arenas are populated dynamically per page
#   decorations: Custom decorative/filler items placed into specific slots
#   buttons: Navigation and action buttons
#
# Slot definitions support:
#   slot: 4                          (single slot)
#   slots: [0, 1, 2, 3]              (list of slots)
#   slots: ["0-8", "18-26"]          (ranges of slots)
#   glowing-slots: [10, 16]          (slots with enchantment glow)
# =============================================================

title: '&8Chọn sân'
rows: 4

# =============================================================
# DYNAMIC ITEM FILL SLOTS
# =============================================================
# Arenas will be placed into these slots sequentially on each page.
item-slots:
  - "10-16"
  - "19-25"

# =============================================================
# DECORATIONS
# =============================================================
decorations:
  # Outer frame border
  border:
    slots:
      - "0-9"
      - 17
      - 18
      - 26
      - "28-30"
      - "32-34"
    item:
      material: STAINED_GLASS_PANE
      data: 7
      name: '&r'
      lore: []
      glowing: false
      custom-model-data: 0

# =============================================================
# BUTTONS
# =============================================================
buttons:
  previous-page:
    slot: 27
    item:
      material: ARROW
      data: 0
      name: '&a« Trang trước'
      lore:
        - '&7Bấm để về trang trước.'
      glowing: false
      custom-model-data: 0

  next-page:
    slot: 35
    item:
      material: ARROW
      data: 0
      name: '&aTrang sau »'
      lore:
        - '&7Bấm để sang trang sau.'
      glowing: false
      custom-model-data: 0

  back:
    slot: 31
    item:
      material: BARRIER
      data: 0
      name: '&cQuay lại'
      lore:
        - '&7Bấm để về menu thách đấu.'
      glowing: false
      custom-model-data: 0

  empty:
    slot: 22
    item:
      material: STICK
      data: 0
      name: '&cChưa có sân trống'
      lore:
        - '&7Hiện chưa có sân trống.'
      glowing: false
      custom-model-data: 0

  # Template format for arena display items
  arena:
    item:
      material: EMPTY_MAP
      data: 0
      name: '&aSân %name%'
      lore:
        - '&7Trạng thái: %status%'
        - ' '
        - '&aBấm để chọn sân này'
      lore-available: '&aĐang trống'
      lore-unavailable: '&cĐang có trận'
      glowing: false
      custom-model-data: 0
