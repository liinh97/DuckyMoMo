# DuckyMoMo 21/10: chữ trong menu đã Việt hoá (tools: scratchpad duels_gui.py, sửa tay ở đây).
# =============================================================
# Duels - Custom Kit Selector GUI Configuration
# =============================================================
# This GUI opens when a player clicks "My Custom Kits" in the Kit Type
# Selector GUI.
#
# Configurations available:
#   title: The inventory title (supports & color codes and MiniMessage tags)
#   rows: Number of rows in the GUI (1 - 6)
#   item-slots: The exact slots where custom kits are populated dynamically
#   decorations: Custom decorative/filler items placed into specific slots
#   buttons: Navigation and action buttons
#
# Slot definitions support:
#   slot: 4                          (single slot)
#   slots: [0, 1, 2, 3]              (list of slots)
#   slots: ["0-8", "18-26"]          (ranges of slots)
#   glowing-slots: [10, 16]          (slots with enchantment glow)
# =============================================================

title: '&8Chọn bộ đồ tự tạo'
rows: 4

# =============================================================
# DYNAMIC ITEM FILL SLOTS
# =============================================================
# Custom kits will be placed into these slots sequentially.
item-slots:
  - "10-16"
  - "19-25"

# =============================================================
# DECORATIONS
# =============================================================
decorations:
  # Outer frame border
  border:
    slots:
      - "0-9"
      - 17
      - 18
      - 26
      - "27-30"
      - "32-35"
    item:
      material: STAINED_GLASS_PANE
      data: 7
      name: '&r'
      lore: []
      glowing: false
      custom-model-data: 0

# =============================================================
# BUTTONS
# =============================================================
buttons:
  back:
    slot: 31
    item:
      material: BARRIER
      data: 0
      name: '&cQuay lại'
      lore:
        - '&7Bấm để về chọn loại bộ đồ.'
      glowing: false
      custom-model-data: 0

  empty:
    slot: 22
    item:
      material: STICK
      data: 0
      name: '&cChưa có bộ đồ tự tạo'
      lore:
        - '&7Bạn chưa tạo bộ đồ nào.'
        - '&7Gõ &e/customkits &7để tạo bộ đồ đầu tiên.'
      glowing: false
      custom-model-data: 0

  # Template format for custom kit display items
  custom-kit:
    item:
      material: NETHERITE_SWORD
      data: 0
      name: '&d%name%'
      lore:
        - '&7Số món: &e%items%'
        - ' '
        - '&aBấm để chọn bộ đồ này'
        - '&7Lưu ý: bộ đồ tự tạo chỉ cược được xu'
      glowing: false
      custom-model-data: 0
