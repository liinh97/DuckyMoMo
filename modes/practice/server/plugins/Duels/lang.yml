  EDIT:
    started: '{PREFIX} &aBạn đang sửa bộ đồ &e%kit%&a. Xong thì gõ &e/%command% save&a.'
    saved: '{PREFIX} &aĐã lưu bộ đồ &e%kit% &avà trả lại túi đồ của bạn.'
    already-editing: '{PREFIX} &cBạn đang sửa một bộ đồ rồi. Gõ &e/%command% save &cđể lưu trước.'
    not-editing: '{PREFIX} &cBạn không đang sửa bộ đồ nào.'
    start-failed: '{PREFIX} &cKhông bắt đầu sửa bộ đồ được.'
    save-failed: '{PREFIX} &cKhông lưu được bộ đồ. Thử lại nhé.'
    in-queue: '{PREFIX} &cKhông sửa bộ đồ được khi đang trong hàng chờ. Rời hàng chờ trước.'
    in-match: '{PREFIX} &cKhông sửa bộ đồ được khi đang đấu. Đợi trận kết thúc.'
    session-aborted: '{PREFIX} &cĐã dừng sửa bộ đồ vì bạn vào hàng chờ hoặc vào trận.'
    invalid-items: '{PREFIX} &cĐã dừng sửa bộ đồ! Chỉ được sắp xếp đồ có sẵn trong bộ gốc, không được thêm đồ từ ngoài.'
    command-blocked: '{PREFIX} &cKhông dùng lệnh khác được khi đang sửa bộ đồ. Gõ &e/%command% save &cđể lưu.'
    drop-blocked: '{PREFIX} &cKhông vứt đồ được khi đang sửa bộ đồ.'
    inventory-blocked: '{PREFIX} &cKhông mở rương/kho được khi đang sửa bộ đồ.'
    block-break-blocked: '{PREFIX} &cKhông phá khối được khi đang sửa bộ đồ.'
    block-place-blocked: '{PREFIX} &cKhông đặt khối được khi đang sửa bộ đồ.'
    interact-blocked: '{PREFIX} &cKhông tương tác với khối được khi đang sửa bộ đồ.'
