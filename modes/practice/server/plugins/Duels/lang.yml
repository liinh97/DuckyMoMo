# DO NOT EDIT THIS VALUE!
config-version: 20

# Define placeholders usable in any message below.
# Example: Adding 'PREFIX: "[Cool]"' below and then putting '{PREFIX}' in a message will display '[Cool]' when the message is sent in game.
STRINGS:
  PREFIX: '&9[Duels]'
  LINE: '&9&m------------------------------------&r'
  HALF_LINE: '&9&m----------------&r'
  FAIL_PREFIX: '&cKhông bắt đầu được trận:'


GENERAL:
  'true': '&acó'
  'false': '&ckhông'
  enabled: '&abật'
  disabled: '&ctắt'
  not-selected: Chưa chọn
  random: Ngẫu nhiên
  none: không có
  unlimited: Không giới hạn
  unknown: Không rõ
  kit-selector: Chọn bộ đồ
  arena-selector: Chọn sân
  item-betting: Cược đồ
  betting: Cược
  cancelled: '{PREFIX} &eĐã huỷ.'


