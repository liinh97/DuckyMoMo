COMMAND:
  kit:
    usage: '{PREFIX} &cCách dùng: /kit [edit|save|reset] [người chơi] [tên bộ đồ]'
    edit:
      usage: '{PREFIX} &cCách dùng: /kit edit <tên bộ đồ>'
    reset:
      usage: '{PREFIX} &cCách dùng: /kit reset <tên bộ đồ> hoặc /kit reset <người chơi> <tên bộ đồ>'
    unknown-subcommand: '{PREFIX} &cKhông có lệnh con: %subcommand%'
  duel:
    usage:
    - '{LINE}'
    - '&f/%command% [người chơi] &e- &7Gửi lời thách đấu.'
    - '&f/%command% [người chơi] <số tiền> &e- &7Gửi lời thách đấu kèm tiền cược.'
    - '&f/%command% [accept | deny] [người chơi] &e- &7Nhận hoặc từ chối lời thách đấu.'
    - '&f/%command% stats <tên> &e- &7Xem thống kê đấu.'
    - '&f/%command% toggle &e- &7Bật/tắt nhận lời thách đấu.'
    - '&f/%command% top [-|wins|losses|kit] &e- &7Xem top thắng, thua hoặc điểm theo bộ đồ.'
    - '{LINE}'
    request:
      send:
        sender:
        - '{LINE}'
        - '&7Đã gửi lời thách đấu cho &f%name%&7.'
        - '&6- &7Bộ đồ: &3%kit%'
        - '&6- &7Dùng đồ của mình: &r%own_inventory%'
        - '&6- &7Sân: &e%arena%'
        - '&6- &7Cược: &6%bet_amount% xu'
        - '&6- &7Cược đồ: &r%item_betting%'
        - '{LINE}'
        receiver:
        - '{LINE}'
        - '&7Bạn nhận lời thách đấu từ &f%name%&7.'
        - '&6- &7Bộ đồ: &3%kit%'
        - '&6- &7Dùng đồ của mình: &r%own_inventory%'
        - '&6- &7Sân: &e%arena%'
        - '&6- &7Cược: &6%bet_amount% xu'
        - '&6- &7Cược đồ: &r%item_betting%'
        - '{LINE}'
        clickable-text:
          info:
            text: '&7Bấm để '
            hover-text: ''
          accept:
            text: '&a[NHẬN] '
            hover-text: '&7Bấm để &anhận &7lời thách đấu.'
          deny:
            text: '&c[TỪ CHỐI]'
            hover-text: '&7Bấm để &ctừ chối &7lời thách đấu.'
      accept:
        sender: '{PREFIX} &f%name% &7đã nhận lời thách đấu của bạn.'
        receiver: '{PREFIX} &7Đã nhận lời thách đấu của &f%name%&7.'
      deny:
        sender: '{PREFIX} &7Lời thách đấu gửi &f%name% &7đã bị từ chối.'
        receiver: '{PREFIX} &7Đã từ chối lời thách đấu của &f%name%&7.'
    party-request:
      send:
        sender-party:
        - '{LINE}'
        - '&f%owner% &7đã gửi lời thách đấu tới &fnhóm của %name%&7.'
        - '&6- &7Bộ đồ: &3%kit%'
        - '&6- &7Dùng đồ của mình: &r%own_inventory%'
        - '&6- &7Sân: &e%arena%'
        - '{LINE}'
        receiver-party:
        - '{LINE}'
        - '&7Nhóm bạn nhận lời thách đấu từ &fnhóm của %name%&7.'
        - '&6- &7Bộ đồ: &3%kit%'
        - '&6- &7Dùng đồ của mình: &r%own_inventory%'
        - '&6- &7Sân: &e%arena%'
        clickable-text:
          info:
            text: '&7Bấm để '
            hover-text: ''
          accept:
            text: '&a[NHẬN] '
            hover-text: '&7Bấm để &anhận &7lời thách đấu.'
          deny:
            text: '&c[TỪ CHỐI]'
            hover-text: '&7Bấm để &ctừ chối &7lời thách đấu.'
          extra:
            text: '{LINE}'
            hover-text: ''
      accept:
        sender-party:
        - '{LINE}'
        - '{PREFIX} &fNhóm của %name% &7đã nhận lời thách đấu của &f%owner%&7.'
        - '{LINE}'
        receiver-party:
        - '{LINE}'
        - '{PREFIX} &f%owner% &7đã nhận lời thách đấu của &fnhóm %name%&7.'
        - '{LINE}'
      deny:
        sender-party:
        - '{LINE}'
        - '{PREFIX} &fNhóm của %name% &7đã từ chối lời thách đấu của &f%owner%&7.'
        - '{LINE}'
        receiver-party:
        - '{LINE}'
        - '{PREFIX} &f%owner% &7đã từ chối lời thách đấu của &fnhóm %name%&7.'
        - '{LINE}'
      preview:
        server-kit: '{PREFIX} &aTrận này dùng bộ đồ của server: &e%kit%'
        own-inventory: '{PREFIX} &aTrận này dùng đồ của mỗi người.'
    stats:
      displayed:
      - '{LINE}'
      - '&7Thống kê của &f%name% &e-'
      - '&7Thắng: &a%wins%'
      - '&7Thua: &c%losses%'
      - '&7Tỉ lệ thắng/thua: &b%wl_ratio%'
      - '&7Nhận thách đấu: &r%requests_enabled%'
      # NOTE: Ratings will only display if either 'display-kit-ratings' or 'display-nokit-rating' is enabled in the configuration.
      rating:
        header: '&7Điểm xếp hạng &e-'
        format: '&f%type%&7: &b%rating%'
        footer: ''
      # NOTE: Past matches will only display if 'display-past-matches' is enabled in the configuration.
      match:
        header: '&7Trận gần đây &e-'
        format: '&a%winner% &fđấu &c%loser% &6[Rê chuột xem]'
        hover-text:
        - '&7Bộ đồ: &3%kit%'
        - '&7Thời lượng: &a%duration%'
        - '&7Cách đây: &f%time%'
        - '&7Máu còn: &d%health%❤'
        footer: '{LINE}'
    toggle:
      enabled: '{PREFIX} &aBạn đang nhận lời thách đấu.'
      disabled: '{PREFIX} &cBạn đã tắt nhận lời thách đấu.'
    top:
      next-update: '{PREFIX} &7Cập nhật lần sau: &f%remaining%'
      header: '{HALF_LINE} &7Top &f10 &7%type% {HALF_LINE}'
      display-format: '&e%rank%. &f%name% &e- &f%score% &7%identifier%'
      footer: '{HALF_LINE} &7Top &f10 &7%type% {HALF_LINE}'

  duels:
    usage:
    - '{LINE}'
    - '&f/%command% help &e- &7Displays this page.'
    - '&f/%command% help arena &e- &7Displays a list of arena commands.'
    - '&f/%command% help kit &e- &7Displays a list of kit commands.'
    - '&f/%command% help queue &e- &7Displays a list of queue commands.'
    - '&f/%command% help sign &e- &7Displays a list of sign commands.'
    - '&f/%command% help user &e- &7Displays a list of user edit commands.'
    - '&f/%command% help extra &e- &7Displays a list of extra commands.'
    - '{LINE}'
    help:
      arena:
      - '{HALF_LINE} &fArena Commands {HALF_LINE}'
      - '&f/%command% create [name] &e- &7Creates an arena with given name.'
      - '&f/%command% set [name] [1|2] &e- &7Sets the teleport position of an arena.'
      - '&f/%command% delete [name] &e- &7Deletes an arena.'
      - '&f/%command% setarenaitem [name] &e- &7Sets the displayed item for selected arena.'
      - '&f/%command% info [name] &e- &7Displays a list of information about the selected arena.'
      - '&f/%command% toggle [name] &e- &7Enables or disables an arena.'
      - '&f/%command% tp [name] <1|2> &e- &7Teleports to an arena.'
      - '&f/%command% list &e- &7Displays the list of all arenas.'
      - '{HALF_LINE} &fArena Commands {HALF_LINE}'
      kit:
      - '{HALF_LINE} &fKit Commands {HALF_LINE}'
      - '&f/%command% savekit <-o> [name] &e- &7Saves a kit with given name.'
      - '&f/%command% loadkit [name] &e- &7Loads the selected kit to your inventory.'
      - '&f/%command% kitgive [kit] [player] &e- &7Gives a kit to a player.'
      - '&f/%command% deletekit [name] &e- &7Deletes a kit.'
