name: DuckyMoMoCore
version: ${version}
main: vn.duckymomo.core.paper.DuckyMoMoCore
api-version: 1.21.11
description: Plugin dùng chung của DuckyMoMo Network (bản Paper)
softdepend:
  - AuthMe
  - LuckPerms
  - CoreProtect
  - Towny
  - squaremap
  - floodgate
  - Vault
  - PlaceholderAPI
  - CrazyEnchantments
  - SiegeWar
  - Essentials
  - Votifier
  - MyPet
  - Citizens
commands:
  goiqua:
    description: "Gói quà theo rank (/kit, /kits, /goiqua). Admin: /kit <mã> <người>, /kit lamlai <người> [mã]"
    aliases: [kit, kits]
  doimanh:
    description: "Đổi mảnh sự kiện lấy quà. Admin: /doimanh give <người> <loại> <số>"
    aliases: [manh]
  vongquay:
    description: "Vòng quay miễn phí: chơi đủ giờ được vé, xem tỉ lệ từng phần thưởng. Admin: /vongquay give <người> <số>"
    aliases: [vq, quay]
  hom:
    description: "Hòm quay: mỗi hòm một loại chìa (điểm danh, chơi online), xem tỉ lệ từng phần thưởng. Admin: /hom give <người> <mã hòm> [số]"
    aliases: [homquay, crate, crates]
  xuong:
    description: "Xưởng chế tạo: đồ đặc biệt có lượt dùng và hạn 7 ngày (Túi Hư, xô nước vô tận, dây hút đồ, cung máu, búa tạ)"
    aliases: [chetao, servertools]
  treothuong:
    description: "Treo thưởng: /treothuong xem ai bị treo, /treothuong dat <người> <xu>. Ai hạ được thì nhận hết"
    aliases: [bounty, sanloi]
  khaihoang:
    description: "Khai hoang vùng mới: cả server góp quỹ (bán /sell, /khaihoang gop <xu>), đủ mốc thì mở rộng bản đồ"
    aliases: [khaimo, frontier]
  choden:
    description: "Chợ đen: mua bán giữa người chơi, hai bên Đang bán (/ah) và Đang thu mua (/donhang)"
    aliases: [cho, chomuaban]
  donhang:
    description: "Chợ đen · thu mua: đặt đơn cần mua (tiền giữ trước), người khác giao hàng nhận tiền ngay. /donhang tao <số> <giá>, /donhang cuatoi"
    aliases: [order, orders, thumua]
  mua:
    description: "Mùa mưa / mùa khô: còn mấy ngày, cây nào lớn nhanh, cá nào xuất hiện. Admin: /mua dat <mua|kho|tudong>"
    aliases: [season, muavu]
  nhiemvu:
    description: "Nhiệm vụ hằng ngày: đào, chặt, săn, xây, câu cá, thu hoạch để nhận quà"
    aliases: [nv]
  diemdanh:
    description: "Điểm danh nhận quà mỗi ngày (bỏ ngày không mất chuỗi). /diemdanh xem: xem tiến độ"
    aliases: [dd, checkin]
  vote:
    description: "Vote cho server trên các trang xếp hạng, nhận xu. /vote top: bảng vote tháng"
    aliases: [bauchon]
  menu:
    description: "Ở sảnh: menu chọn chế độ. Ở Bang Hội Chiến: menu chính (cũng mở bằng Shift + F)"
    aliases: [chedo, modes]
  dmm:
    description: "Lệnh admin của DuckyMoMo: phù phép vượt cấp, thư viện đồ, dọn rác, NPC… (bấm Tab để gợi ý)"
    aliases: [duckymomo]
    permission: duckymomo.admin
  vang:
    description: "Vàng (tiền ủng hộ): xem ví, cửa hàng (rank, trang trí, tên màu); /vang nap lấy mã QR nạp"
    aliases: [gold, vi]
  rank:
    description: "Xem rank donate (tước vị), giá, rank của bạn. Admin: /rank give|remove|check"
    aliases: [donate, tuocvi]
  huongdan:
    description: "Cẩm nang: hướng dẫn chơi các chế độ"
    aliases: [hd, guide, camnang, cn]
  tpr:
    description: "Dịch chuyển ngẫu nhiên tới đất hoang trong vùng mùa: /tpr (menu) hoặc /tpr <khu>"
    aliases: [rtp, ngaunhien, tprandom, randomtp]
    permission: duckymomo.rtp
  hoatdong:
    description: "Xem giờ chơi thật (không tính AFK) của bạn"
    aliases: [giochoi]
  taikhoanphu:
    description: "Khai tài khoản phụ: /taikhoanphu khai <tên chính>, tài khoản chính /taikhoanphu xacnhan <tên phụ>"
    aliases: [accphu]
  choilai:
    description: "Chơi lại từ đầu ở Bang Hội Chiến (mất hết đồ, tiền, nhà, nghề, thị trấn)"
    aliases: [reset]
  hoabinh:
    description: "Liên minh Hoà Bình: /hoabinh (thông tin), vao, roi, danhsach"
    aliases: [lienminh]
  hoidong:
    description: "Hội đồng Hoà Bình: bầu đại diện, bỏ phiếu kiến nghị"
  tochuc:
    description: "Tổ chức của dân hoà bình, xin giấy phép Thương Hội / Sự kiện"
  quangcao:
    description: "Thương Hội có giấy phép rao hàng toàn server (1 lần mỗi giờ)"
  sukien:
    description: "Sự kiện: xem, tới nơi (/sukien den <mã>); Tổ chức Sự kiện tạo sự kiện"
  bantron:
    description: "Hội Bàn Tròn: lịch họp, vụ án, bỏ phiếu, kháng án, kiến nghị"
    aliases: [an, hoibantron]
  bxh:
    description: "Bảng xếp hạng mùa: Bá Chủ, Chiến Thần, Đại Phú Hộ, Kiến Trúc Sư"
    aliases: [bangxephang]
  binhchon:
    description: "Giải Kiến Trúc Sư: đăng ký, tham quan, bỏ phiếu"
  danhhieu:
    description: "Xem và chọn danh hiệu"
    aliases: [title]
  web:
    description: "Lấy mã đăng nhập trang web (xem tài khoản, rank, lệnh của bạn; staff mở trang quản trị theo quyền)"
    aliases: [dangnhapweb, weblogin]
  cuahang:
    description: "Cửa hàng Kinh Đô (vật liệu, trang trí, danh hiệu): rank ủng hộ mở khi đứng trong kinh đô; mọi người bấm NPC ở spawn"
    aliases: [trangtri]
  lichcongthanh:
    description: "Lịch công thành: phiên tới, phiên đó có cho pet chiến đấu tham chiến không"
    aliases: [congthanh, lichvay]
  khobau:
    description: "Bản đồ kho báu: cách dò, các bậc kho báu; admin: /khobau give <người>"
    aliases: [kho-bau, treasure]
  capdo:
    description: "Thăng Cấp: điều kiện lên cấp (xu, giờ chơi, hạ gục), cửa hàng đặc quyền, xếp hạng; admin: /capdo dat <tên> <cấp>"
    aliases: [cap, prestige, thangcap]
  caidat:
    description: "Cài đặt cá nhân: bật/tắt chat chung, tin nhắn riêng, thông báo, bảng bên phải, TPA, nhắc nhở…"
    aliases: [settings, tuychon]
  dungeon:
    description: "Cổng Dungeon: danh sách dungeon, chìa khoá, vé; /dungeon vao|mua|gop <mã>; admin: datan|cho|mo"
    aliases: [dg, hamnguc]
  conghoang:
    description: "Cổng Hoang: cổng dungeon ẩn trên bản đồ; chủ cổng: phi|dong|mo; admin: tao [here]|xoa|ds|datlai"
    aliases: [cong-hoang, rift]
  lukhach:
    description: "Lữ khách: người lạ lang thang kể chuyện về nơi phía sau Cổng Hoang; admin: ds|doi <mã|all>|xoa"
    aliases: [lu-khach, wanderers]
  lenhsan:
    description: "Lệnh săn: quái mạnh đang bị săn ở đâu, thưởng gì"
    aliases: [lenh-san, truyna, truy-na, wanted]
  thaiap:
    description: "Thái Ấp: đất riêng an toàn mua bằng xu (mua, morong, moi, duoi, ghe, thich, top, ten, datspawn)"
    aliases: [thai-ap, datrieng]
  thanhtich:
    description: "Sổ thành tích: mục tiêu chơi một mình (khám phá, câu cá, pet, Đấu Trường, nấu ăn…), đạt là nhận quà"
    aliases: [achievements, sothanhtich]
  linhdanhthue:
    description: "Lính đánh thuê: người không thuộc nước nào đăng ký, các nước thuê ra trận công thành"
    aliases: [ldt, danhthue]
  vinhdanh:
    description: "Quảng trường Danh vọng: người thắng các mùa; admin: /vinhdanh chot|tam (Bang Hội Chiến), /vinhdanh dat|xoa|lammoi (sảnh)"
    aliases: [danhvong, dentvinhdanh, halloffame]
  canbang:
    description: "Cân bằng chiến tranh: Bá chủ, thuộc địa, phí, lợi thế cho bên yếu"
    aliases: [bachu, canbangchientranh]
  kholuong:
    description: "Kho lương công thành của thị trấn: xem, nộp nông sản/cá/món ăn (/kholuong nop|noptat|top)"
    aliases: [kl, luongthuc]
  dacsan:
    description: "Đặc sản vùng: vùng nào thuộc phe nào, phe chủ vùng được mùa đặc sản"
    aliases: [dacsanvung]
  nauan:
    description: "Bếp ra trận: nấu cá câu + nông sản thành món ăn có hiệu ứng"
    aliases: [bep, monan]
  danhphan:
    description: "Danh phận (rank chơi miễn phí): Dân Tị Nạn → Dân → Lương Dân → Hào Kiệt, đủ giờ chơi/cấp/cốt truyện thì bấm nhận; admin: dat <người> <mã> · dongbo"
    aliases: [capbac, rankchoi, member]
  media:
    description: "Rank Sứ Giả (người livestream server): /sugia dangky <link kênh> · live [link] · tat · baocao <tên> <lý do>; admin: ds · duyet|tuchoi|go <tên> · giahan <tên> <ngày> · xem <tên>"
    aliases: [sugia, streamer, livestream]
  balo:
    description: "Balo cá nhân 27 ô (/balo [số]); số balo theo danh phận; admin: /balo xem <tên> [số]"
    aliases: [backpack, bp]
  tinhluyen:
    description: "Tinh Luyện: đổi một chiều khối thường thành món tinh luyện (trade dân làng, nguyên liệu Xưởng, bán /sell); /tinhluyen ban [tatca] · ds · admin: give <mã> [số] [người]"
    aliases: [tl, nguyenlieu]
  buabatpet:
    description: "Bùa bắt pet (tăng xác suất bắt); admin: /buabatpet give <người> [số]"
    aliases: [bua]
  bxhpet:
    description: "Bảng xếp hạng pet chiến đấu (theo kinh nghiệm, lọc theo hệ) và xác suất bắt pet: /bxhpet [hệ|tyle]"
    aliases: [toppet, petbxh]
  dautruong:
    description: "Đấu Trường: người + pet đấu 1v1, 2v2 (hàng chờ, thách đấu, cược, xếp hạng)"
    aliases: [dt, arena]
permissions:
  duckymomo.choilai.admin:
    description: "Reset người chơi khác (/choilai admin <tên> [moi] [giurank]); trang quản trị › Hệ thống dùng qua RCON"
    default: op
  duckymomo.kit.admin:
    description: "Phát gói quà cho người khác, xoá lượt đã nhận (/kit <mã> <người>, /kit lamlai)"
    default: op
  duckymomo.caidat.bypass:
    description: "Nhắn riêng / TPA / mời được cả người đã tắt (staff)"
    default: op
  duckymomo.vinhdanh.admin:
    description: "Chốt vinh danh mùa, đặt bảng/tượng ở Quảng trường Danh vọng"
    default: op
  duckymomo.pet.admin:
    description: "Phát Bùa bắt pet (/buabatpet give)"
    default: op
  duckymomo.pet.batduoc:
    description: "Quyền tạm do module bắt pet cấp đúng lúc quay trúng xác suất; KHÔNG cấp tay (cấp tay = bắt phát nào cũng được)"
    default: false
  duckymomo.mua.admin:
    description: Đổi mùa bằng tay để thử (/mua dat <mua|kho|tudong>)
    default: op
  duckymomo.cuahang:
    description: Mở Cửa hàng Kinh Đô bằng /cuahang khi đứng trong kinh đô (rank ủng hộ, cấp cho nhóm namtuoc)
    default: op
  duckymomo.giayphep.thuonghoi:
    description: Thành viên Thương Hội có giấy phép (nhóm LuckPerms giayphep-thuonghoi)
    default: false
  duckymomo.giayphep.sukien:
    description: Thành viên Tổ chức Sự kiện có giấy phép (nhóm LuckPerms giayphep-sukien)
    default: false
  duckymomo.peace.admin:
    description: Bỏ qua luật Liên minh Hoà Bình (tự bật hoà bình, /ah ở mọi nơi)
    default: op
  duckymomo.town.bypass:
    description: Bỏ qua luật đất đai (giờ chơi, vòng spawn, chờ đổi thị trấn) - admin, thị trấn của server
    default: op
  duckymomo.rtp:
    description: Dùng /tpr (dịch chuyển ngẫu nhiên)
    default: true
  duckymomo.rtp.bypass:
    description: Không phải chờ giữa hai lần /tpr
    default: op
  duckymomo.rtp.free:
    description: Không mất phí /tpr
    default: op
  duckymomo.rank.admin:
    description: Cấp/gỡ/xem rank donate của người khác (/rank give|remove|check)
    default: op
  duckymomo.rank.join:
    description: Có dòng chào khi vào server (rank donate)
    default: false
  duckymomo.rank.join.special:
    description: Vào server có tiếng chuông cho cả server (bậc cao nhất)
    default: false
  duckymomo.admin:
    description: Lệnh admin /dmm
    default: op
  duckymomo.war.bypass:
    description: Phong quân hàm không cần đủ giờ chơi (admin)
    default: op
  duckymomo.chat.bypass:
    description: Không bị chống spam chat (vẫn bị che từ tục)
    default: op
