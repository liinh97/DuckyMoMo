<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuckyMoMo · Hoạt động người chơi</title>
<style>
  /* Mỗi sự kiện một dòng, mới nhất ở dưới; chia nhóm theo ngày */
  :root { --chat: #3b82f6; --join: #16a34a; --command: #c48a00; --admin: #e5484d; --server: #8b5cf6; }
  @media (prefers-color-scheme: dark) { :root { --chat: #8ab4f8; --join: #81c995; --command: #fdd663; --admin: #ff8a80; --server: #c7a6ff; } }
  header.keep { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; background: var(--card); }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 5px 13px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .5; }
  .chip.on { font-weight: 600; color: var(--text); background: var(--chip); }
  .chip.on::before { opacity: 1; }
  .chip[data-type="chat"]::before { background: var(--chat); } .chip[data-type="join"]::before { background: var(--join); }
  .chip[data-type="command"]::before { background: var(--command); } .chip[data-type="admin"]::before { background: var(--admin); }
  header.keep .sepr { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
  header.keep select, header.keep input { padding: 6px 10px; font-size: 14px; }
  header.keep input#player { width: 130px; } header.keep input#q { width: 170px; }
  input[type="date"] { width: auto; }
  .custom { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .custom[hidden] { display: none; }
  .right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 13.5px; }
  label.live { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; user-select: none; }
  label.live input { display: none; }
  label.live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  label.live.on .dot { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
  label.live.on { color: var(--text); }
  /* nhật ký */
  .logcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  #log { height: calc(100vh - 330px); min-height: 320px; overflow-y: auto; font-size: 14px; }
  .info { padding: 8px 16px; color: var(--muted); font-size: 12.5px; border-bottom: 1px solid var(--line-2); }
  .day { position: sticky; top: 0; z-index: 1; background: var(--card-2); padding: 6px 16px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 1px solid var(--line-2); border-top: 1px solid var(--line-2); }
  .line { display: grid; grid-template-columns: 70px 76px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 6px 16px; border-bottom: 1px solid var(--line-2); }
  .line:hover { background: var(--chip); }
  .line .ts { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .tag { font-size: 11px; font-weight: 700; text-align: center; border-radius: 999px; padding: 1px 0; letter-spacing: .03em; }
  .tag.chat { color: var(--chat); background: color-mix(in srgb, var(--chat) 14%, transparent); }
  .tag.join { color: var(--join); background: color-mix(in srgb, var(--join) 14%, transparent); }
  .tag.command { color: var(--command); background: color-mix(in srgb, var(--command) 16%, transparent); }
  .tag.admin { color: var(--admin); background: color-mix(in srgb, var(--admin) 14%, transparent); }
  .line .msg { white-space: pre-wrap; word-break: break-word; }
  .line .msg b { font-weight: 600; }
  /* thiết bị trước tên: PC (máy tính Java), BE (Bedrock), Bot (bot trang Bot) */
  .dev { display: inline-block; font-size: 10.5px; font-weight: 700; border-radius: 5px; padding: 0 5px; margin-right: 5px; vertical-align: 1px; letter-spacing: .02em; }
  .dev.pc { color: #3b82f6; background: color-mix(in srgb, #3b82f6 15%, transparent); }
  .dev.be { color: #16a34a; background: color-mix(in srgb, #16a34a 15%, transparent); }
  .dev.bot { color: var(--muted); background: var(--chip); }
  .line .msg code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: var(--chip); border-radius: 5px; padding: 1px 6px; }
  .line.join .msg { color: var(--muted); } .line.join .msg b { color: var(--text); }
  .where { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .where .srv { color: var(--server); }
  .empty { padding: 50px 16px; text-align: center; color: var(--muted); }
  /* gửi tin vào game */
  #say { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-top: 1px solid var(--line); background: var(--card-2); }
  #say input#sayText { flex: 1; min-width: 220px; }
  #say input#sayName { width: 120px; }
  #say .count { color: var(--muted); font-size: 12px; min-width: 52px; text-align: right; }
  #sayMsg { padding: 0 14px; font-size: 13px; color: var(--muted); background: var(--card-2); }
  #sayMsg:not(:empty) { padding-bottom: 10px; }
  #sayMsg.ok { color: var(--ok); } #sayMsg.err { color: var(--err); }
  @media (max-width: 900px) { #log { height: calc(100vh - 360px); } header.keep { border-radius: 0; } .logcard { border-radius: 0; border-left: 0; border-right: 0; } }
  @media (max-width: 700px) { .line { grid-template-columns: 62px minmax(0, 1fr); } .line .tag { display: none; } .line .where { grid-column: 2; } header.keep input#player, header.keep input#q { width: 130px; } header.keep .sepr { display: none; } }
</style>
<link rel="stylesheet" href="ui.css">
</head>
<body data-dozzle="__DOZZLE_URL__" data-title="Hoạt động người chơi" data-sub="Chat, vào/ra, lệnh của người chơi; gửi tin vào game.">
<script src="shell.js"></script>
<header class="keep">
  <button class="chip on" data-type="chat">Chat</button>
  <button class="chip on" data-type="join">Vào/ra</button>
  <button class="chip on" data-type="command">Lệnh</button>
  <button class="chip on" data-type="admin" title="Tin admin gửi từ trang này">Admin</button>
  <span class="sepr"></span>
  <select id="mode" title="Chế độ"><option value="">Mọi chế độ</option></select>
  <select id="range" title="Khoảng ngày">
    <option value="all">Mọi ngày</option>
    <option value="today">Hôm nay</option>
    <option value="yesterday">Hôm qua</option>
    <option value="7">7 ngày qua</option>
    <option value="30">30 ngày qua</option>
    <option value="custom">Chọn ngày…</option>
  </select>
  <span id="custom" class="custom" hidden>
    <input type="date" id="from" title="Từ ngày"> – <input type="date" id="to" title="Đến ngày (tính cả ngày này)">
  </span>
  <input id="player" placeholder="Người chơi">
  <input id="q" placeholder="Tìm trong nội dung">
  <div class="right">
    <label class="live on" id="liveLabel" title="Tự cập nhật mỗi 5 giây"><input type="checkbox" id="auto" checked><span class="dot"></span>Live</label>
  </div>
</header>
<div class="logcard">
<div id="log"><div class="empty">Đang tải…</div></div>
<form id="say" autocomplete="off">
  <select id="sayTarget" title="Gửi tới">
    <option value="all">Cả mạng</option>
    <option value="banghoi-1">Bang Hội Chiến</option>
    <option value="lobby">Sảnh</option>
    <option value="practice-1">Practice</option>
  </select>
  <select id="sayKind" title="Kiểu gửi">
    <option value="chat">Chat admin</option>
    <option value="broadcast">Thông báo</option>
    <option value="title">Thông báo giữa màn hình</option>
  </select>
  <input id="sayName" placeholder="Tên hiển thị" value="Admin" maxlength="24" title="Tên hiện trước tin chat">
  <input id="sayText" placeholder="Nhập tin gửi vào game, hoặc /lệnh để chạy như console (Enter để gửi)" maxlength="200">
  <span class="count" id="sayCount">0/200</span>
  <button type="submit" id="sayBtn" class="primary">Gửi vào game</button>
</form>
<div id="sayMsg"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
if (!"__DOZZLE_URL__" && $("dozzle")) $("dozzle").style.display = "none";
const TYPE_NAME = { chat: "CHAT", join: "VÀO/RA", command: "LỆNH", admin: "ADMIN" };
let modeNames = {}, timer = null, firstRender = true;

// Bộ lọc nhớ trong địa chỉ trang (#types=chat&mode=banghoi…) để gửi link / tải lại không mất
const saved = new URLSearchParams(location.hash.slice(1));
if (saved.has("types")) {
  const t = saved.get("types").split(",");
  document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", t.includes(c.dataset.type)));
}
$("player").value = saved.get("player") || "";
$("range").value = saved.get("range") || "today";   // mặc định: hôm nay
$("from").value = saved.get("from") || "";
$("to").value = saved.get("to") || "";
$("custom").hidden = $("range").value !== "custom";

// Ngày theo giờ máy người xem (Việt Nam) -> mốc UTC cho server. Trả [từ, đến) dạng "YYYY-MM-DDTHH:MM:SSZ".
const iso = (d) => d.toISOString().slice(0, 19) + "Z";
const dayStart = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
function dateRange() {
  const today = dayStart(new Date());
  switch ($("range").value) {
    case "today": return [today, addDays(today, 1)];
    case "yesterday": return [addDays(today, -1), today];
    case "7": return [addDays(today, -6), addDays(today, 1)];
    case "30": return [addDays(today, -29), addDays(today, 1)];
    case "custom": {
      const parse = (v) => { const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d); };
      return [$("from").value ? parse($("from").value) : null, $("to").value ? addDays(parse($("to").value), 1) : null];
    }
  }
  return [null, null];
}
$("q").value = saved.get("q") || "";

function params() {
  const p = new URLSearchParams();
  p.set("types", [...document.querySelectorAll(".chip.on")].map((c) => c.dataset.type).join(","));
  if ($("mode").value || saved.get("mode")) p.set("mode", $("mode").value || saved.get("mode"));
  if ($("player").value.trim()) p.set("player", $("player").value.trim());
  if ($("q").value.trim()) p.set("q", $("q").value.trim());
  const [from, to] = dateRange();
  if (from) p.set("from", iso(from));
  if (to) p.set("to", iso(to));
  return p;
}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (ts) => {
  const d = new Date(ts);
  if (isNaN(d)) return ts;
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
};

const hms = (d) => isNaN(d) ? "" : [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, "0")).join(":");
function dayName(d) {
  if (isNaN(d)) return "";
  const t = dayStart(new Date()), x = dayStart(d), diff = Math.round((t - x) / 86400000);
  const date = fmt(d).slice(0, 10);
  return diff === 0 ? "Hôm nay · " + date : diff === 1 ? "Hôm qua · " + date : ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"][d.getDay()] + " · " + date;
}
// tên người chơi in đậm; lệnh hiện dạng mã
let DEV = {};
function devHtml(p) {
  const d = DEV[p];
  return d ? `<span class="dev ${esc(d.loai)}" title="${esc(d.chi_tiet || "")}">${esc(d.nhan)}</span>` : "";
}
function msgHtml(e) {
  const t = String(e.text || ""), p = e.player || "";
  if (!p || !t.startsWith(p)) return esc(t);
  let rest = t.slice(p.length);
  if (e.type === "command" && /^:\s*\//.test(rest)) return `${devHtml(p)}<b>${esc(p)}</b> <code>${esc(rest.replace(/^:\s*/, ""))}</code>`;
  return `${devHtml(p)}<b>${esc(p)}</b>${esc(rest)}`;
}

async function load() {
  const p = params();
  if (!p.get("types")) { render([]); return; }
  try {
    const r = await fetch("api/activity?" + p.toString());
    const data = await r.json();
    if ($("mode").options.length === 1) {
      for (const m of data.modes) $("mode").add(new Option(m.name, m.id));
      if (saved.get("mode")) $("mode").value = saved.get("mode");
    }
    modeNames = Object.fromEntries(data.modes.map((m) => [m.id, m.name]));
    if (!data.has_file) {
      $("log").innerHTML = '<div class="empty">Chưa có dữ liệu. Service <code>activity</code> chưa ghi file data/activity/activity.jsonl.</div>';
      return;
    }
    DEV = data.thiet_bi || {};
    render(data.events);
  } catch (e) {
    $("log").innerHTML = '<div class="empty">Không tải được: ' + esc(e) + '</div>';
  }
}

function render(events) {
  const log = $("log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const rows = events.slice().reverse();   // API trả mới nhất trước; hiện như log: mới nhất ở dưới
  const info = `<div class="info">${rows.length} sự kiện${rows.length >= 300 ? " gần nhất (tối đa 300)" : ""}</div>`;
  let day = "", html = "";
  for (const e of rows) {
    const d = new Date(e.ts), dk = isNaN(d) ? "" : d.toDateString();
    if (dk !== day) { day = dk; html += `<div class="day">${esc(dayName(d))}</div>`; }
    html += `<div class="line ${esc(e.type)}"><span class="ts" title="${esc(fmt(e.ts))}">${esc(hms(d) || e.ts)}</span>
      <span class="tag ${esc(e.type)}">${esc(TYPE_NAME[e.type] || e.type)}</span><span class="msg">${msgHtml(e)}</span>
      <span class="where"><span class="srv">${esc(e.server)}</span> · ${esc(modeNames[e.mode] || e.mode)}</span></div>`;
  }
  log.innerHTML = rows.length ? info + html : '<div class="empty">Không có sự kiện nào khớp bộ lọc.</div>';
  if (atBottom || firstRender) log.scrollTop = log.scrollHeight;
  firstRender = false;
}

function changed() {
  firstRender = true;
  saved.delete("mode");
  // địa chỉ trang lưu lựa chọn (range, from, to), không lưu mốc UTC đã tính, để "Hôm nay" mở lại hôm sau vẫn đúng
  const p = params(); p.delete("from"); p.delete("to");
  if ($("range").value) p.set("range", $("range").value);
  if ($("range").value === "custom") {
    if ($("from").value) p.set("from", $("from").value);
    if ($("to").value) p.set("to", $("to").value);
  }
  history.replaceState(null, "", "#" + p.toString());
  load();
}
document.querySelectorAll(".chip").forEach((c) => c.onclick = () => { c.classList.toggle("on"); changed(); });
$("mode").onchange = changed;
$("range").onchange = () => { $("custom").hidden = $("range").value !== "custom"; changed(); };
$("from").onchange = changed;
$("to").onchange = changed;
let typing;
for (const id of ["player", "q"]) $(id).oninput = () => { clearTimeout(typing); typing = setTimeout(changed, 300); };
function schedule() { clearInterval(timer); if ($("auto").checked) timer = setInterval(load, 5000); }
$("auto").onchange = () => { $("liveLabel").classList.toggle("on", $("auto").checked); schedule(); };

// Gửi tin vào game: chat admin, thông báo, hoặc thông báo giữa màn hình (title) qua RCON
try { $("sayName").value = localStorage.getItem("dmm_say_name") || "Admin"; } catch (e) {}
$("sayText").oninput = () => { $("sayCount").textContent = $("sayText").value.length + "/200"; };
$("say").onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $("sayText").value.trim();
  if (!text) return;
  const kind = $("sayKind").value, target = $("sayTarget").value;
  const isCmd = text.startsWith("/");
  if (isCmd && target === "all") { $("sayMsg").textContent = "Chạy lệnh: chọn một server cụ thể (không chạy cho cả mạng)."; $("sayMsg").className = "err"; return; }
  if (isCmd && /^\/\s*(minecraft:)?(stop|restart|reload|op|deop|ban|ban-ip|pardon|whitelist|kill|lp)\b/i.test(text)
      && !(await ask("Chạy lệnh " + text + " trên " + $("sayTarget").selectedOptions[0].text + "?", { title: "Lệnh console", ok: "Chạy" }))) return;
  if (!isCmd && kind === "title" && !(await ask("Hiện chữ to giữa màn hình của mọi người chơi " + ($("sayTarget").selectedOptions[0].text) + "?", { title: "Thông báo giữa màn hình", ok: "Gửi" }))) return;
  $("sayBtn").disabled = true;
  try { localStorage.setItem("dmm_say_name", $("sayName").value.trim() || "Admin"); } catch (e) {}
  try {
    const r = await fetch("api/say", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, kind, target, name: $("sayName").value.trim() || "Admin" }) });
    const d = await r.json();
    $("sayMsg").textContent = d.message || (d.ok ? "Đã gửi" : "Lỗi");
    $("sayMsg").className = d.ok ? "ok" : "err";
    if (d.ok) { $("sayText").value = ""; $("sayCount").textContent = "0/200"; firstRender = true; load(); }
  } catch (e) {
    $("sayMsg").textContent = "Không gửi được: " + e; $("sayMsg").className = "err";
  }
  $("sayBtn").disabled = false;
  $("sayText").focus();
};

load();
schedule();
</script>
</body>
</html>
