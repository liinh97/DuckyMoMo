<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuckyMoMo · Donate</title>
<link rel="stylesheet" href="ui.css">
<style>
  main { padding: 0 0 80px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
  .tabs button { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .don { padding: 14px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .don h3 { margin: 0 0 4px; font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .don .meta { color: var(--muted); font-size: 13.5px; }
  .don code { background: var(--chip); border-radius: 6px; padding: 1px 7px; font-size: 13px; }
  .don .money { font-weight: 700; color: var(--accent); }
  .don .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .st-cho { background: rgba(178, 106, 0, .14); color: var(--warn); font-weight: 600; }
  .st-da_cap { background: rgba(30, 142, 62, .12); color: var(--ok); font-weight: 600; }
  .st-huy { color: var(--muted); }
  .empty { color: var(--muted); padding: 18px 0; }
  .hint { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
  .vg { padding: 14px 18px; margin-bottom: 14px; display: grid; gap: 10px; }
  .vg .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .vg input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--input); color: var(--text); font: inherit; min-width: 0; }
  .vg table { width: 100%; border-collapse: collapse; font-size: 13px; } .vg td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
  @media (max-width: 700px) { .don { grid-template-columns: 1fr; } .don .acts { justify-content: flex-start; } }
</style>
</head>
<body data-dozzle="__DOZZLE_URL__" data-title="Donate · Vàng" data-sub="Người chơi chọn số tiền nạp (web hoặc /rank mua), quét QR rồi bấm 'Tôi đã chuyển khoản'. Kiểm tra tiền đã về (đúng số tiền + nội dung) rồi bấm Duyệt: server cộng Vàng, người chơi tự mua rank/đồ trang trí bằng Vàng.">
<script src="shell.js"></script>
<main>
  <div class="card vg">
    <b>Ví Vàng của người chơi</b>
    <div class="row"><input id="vgTen" placeholder="Tên người chơi"><button class="ghost" id="vgXem">Xem ví</button>
      <input id="vgSo" type="number" placeholder="Số Vàng (âm = trừ)" style="width:170px"><input id="vgLyDo" placeholder="Lý do (bắt buộc)" style="flex:1 1 200px">
      <button class="primary" id="vgGo">Cộng / trừ</button></div>
    <div id="vgOut" class="hint" style="margin:0"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <p class="hint">"Duyệt" = cộng Vàng theo số tiền (tỉ giá + mốc thưởng ở Cài đặt › Toàn mạng › Rank donate). Yêu cầu kiểu cũ (chọn gói rank) cũng được đổi thành Vàng. Vàng chỉ mua đồ trang trí, đúng luật Mojang.</p>
  <div class="list" id="list"><div class="empty">Đang tải…</div></div>
</main>
<script>
const ST = { cho: "Chờ duyệt", tao: "Chưa báo chuyển", da_cap: "Đã cộng Vàng", huy: "Đã huỷ" };
let rows = [], tab = "cho";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const when = ms => ms ? new Date(ms).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" }) : "";
function draw() {
  const count = k => rows.filter(r => r.trang_thai === k).length;
  document.getElementById("tabs").innerHTML = ["cho", "tao", "da_cap", "huy"].map(k =>
    `<button class="${k === tab ? "on" : ""}" data-k="${k}">${ST[k]} (${count(k)})</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.k; draw(); });
  const list = rows.filter(r => r.trang_thai === tab);
  document.getElementById("list").innerHTML = list.length ? list.map(r => `
    <div class="card don"><div>
      <h3>${esc(r.ten)} <span class="badge accent">${esc(r.bac)}</span> <span class="badge">${esc(r.goi)}</span> <span class="badge st-${r.trang_thai}">${ST[r.trang_thai]}</span></h3>
      <div class="meta"><span class="money">${Number(r.tien).toLocaleString("vi-VN")}đ</span> · nội dung <code>${esc(r.noi_dung)}</code>
        · tạo ${when(r.tao_luc)}${r.bao_luc ? " · báo đã chuyển " + when(r.bao_luc) : ""}${r.xu_ly_boi ? ` · ${esc(r.xu_ly_boi)} xử lý ${when(r.xu_ly_luc)}` : ""}</div>
    </div><div class="acts">${r.trang_thai === "cho" || r.trang_thai === "tao" ? `
      <button class="primary" data-a="cap" data-id="${r.id}">Duyệt: cộng Vàng</button>
      <button class="ghost" data-a="xong" data-id="${r.id}">Đã xử lý tay</button>
      <button class="ghost" data-a="huy" data-id="${r.id}">Huỷ</button>` : ""}</div></div>`).join("")
    : `<div class="empty">Không có yêu cầu nào${tab === "cho" ? " đang chờ duyệt" : ""}.</div>`;
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => act(b.dataset.a, b.dataset.id));
}
async function act(a, id) {
  const r = rows.find(x => x.id === id);
  const q = { cap: `Cộng Vàng cho ${r.ten} (nạp ${Number(r.tien).toLocaleString("vi-VN")}đ)? Kiểm tra tài khoản ngân hàng đã nhận đúng số tiền với nội dung ${r.noi_dung}.`,
    xong: `Đánh dấu đã xử lý (KHÔNG cộng Vàng, vd bạn đã tự cộng tay)?`, huy: `Huỷ yêu cầu của ${r.ten}?` }[a];
  if (!(await ask(q, { title: { cap: "Duyệt nạp Vàng", xong: "Đánh dấu đã xử lý", huy: "Huỷ yêu cầu" }[a], ok: { cap: "Cộng Vàng", xong: "Đã xử lý", huy: "Huỷ yêu cầu" }[a],
    cancel: "Quay lại", danger: a === "huy" }))) return;
  toast("Đang xử lý…");
  const res = await fetch("api/donate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: a, id }) });
  const d = await res.json().catch(() => ({}));
  toast(d.message || "Lỗi", d.ok ? "ok" : "err");
  if (d.data) { rows = d.data; draw(); }
}
function vgShow(d) {
  if (!d.ok && d.message) { document.getElementById("vgOut").textContent = d.message; return; }
  document.getElementById("vgOut").innerHTML = `Số dư <b>${Number(d.so_du || 0).toLocaleString("vi-VN")} Vàng</b> · tổng nạp ${Number(d.tong_nap || 0).toLocaleString("vi-VN")}đ
    ${(d.lich_su || []).length ? `<table>${d.lich_su.map(h => `<tr><td>${when(h.luc)}</td><td style="color:${h.thay_doi > 0 ? "var(--ok)" : "var(--err)"}">${h.thay_doi > 0 ? "+" : ""}${h.thay_doi}</td><td>${esc(h.ly_do)}</td><td>còn ${h.so_du_sau}</td></tr>`).join("")}</table>` : ""}`;
}
async function vgCall(body) {
  const res = await fetch("api/vang", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return res.json().catch(() => ({ ok: false, message: "Lỗi" }));
}
document.getElementById("vgXem").onclick = async () => vgShow(await vgCall({ ten: document.getElementById("vgTen").value.trim() }));
document.getElementById("vgGo").onclick = async () => {
  const ten = document.getElementById("vgTen").value.trim(), so = parseInt(document.getElementById("vgSo").value, 10), ly_do = document.getElementById("vgLyDo").value.trim();
  if (!ten || !so || !ly_do) { toast("Nhập tên, số Vàng và lý do.", "err"); return; }
  if (!(await ask(`${so > 0 ? "Cộng" : "Trừ"} ${Math.abs(so)} Vàng cho ${ten}? Lý do: ${ly_do}`, { title: "Điều chỉnh Vàng", ok: "Đồng ý", cancel: "Quay lại", danger: so < 0 }))) return;
  const d = await vgCall({ action: "dieuchinh", ten, so, ly_do });
  toast(d.message || "Lỗi", d.ok ? "ok" : "err"); if (d.ok) vgShow(d);
};
fetch("api/donate").then(r => r.json()).then(d => { rows = d.rows || []; draw(); })
  .catch(() => { document.getElementById("list").innerHTML = '<div class="empty">Không tải được.</div>'; });
</script>
</body>
</html>
