<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuckyMoMo · Cài đặt</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #667085; --line: #e3e6ec;
    --accent: #e8711c; --accent-text: #fff; --ok: #1e8e3e; --err: #c62828; --changed: #fff4e6;
    --input: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161b; --card: #1d2027; --text: #e6e8ee; --muted: #9aa3b2; --line: #2d313b;
            --changed: #3a2a17; --input: #15171c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header a:hover { color: var(--text); }
  .tabs { display: flex; gap: 6px; flex: 1; }
  .tab { border: 1px solid var(--line); background: transparent; color: var(--text); padding: 5px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 120px; }
  .group { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .group h2 { font-size: 15px; margin: 0 0 2px; }
  .group p.desc { color: var(--muted); margin: 0 0 10px; font-size: 13.5px; }
  .row { display: grid; grid-template-columns: 220px 1fr; gap: 6px 16px; padding: 8px 6px; border-radius: 6px; align-items: start; }
  .row.changed { background: var(--changed); }
  .row label { padding-top: 6px; font-size: 14px; }
  .row .note { grid-column: 2; color: var(--muted); font-size: 12.5px; margin-top: -2px; }
  input, select, textarea { width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--input); color: var(--text); font: inherit; }
  textarea { resize: vertical; line-height: 1.4; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .cat { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; cursor: pointer; }
  .cat.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px; }
  .bar .inner { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bar .status { flex: 1; font-size: 13.5px; color: var(--muted); min-width: 200px; }
  .status.ok { color: var(--ok); } .status.err { color: var(--err); }
  button.primary { background: var(--accent); color: var(--accent-text); border: 0; padding: 8px 16px; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 8px 14px; border-radius: 6px; font: inherit; cursor: pointer; }
  details.results { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  details.results pre { white-space: pre-wrap; margin: 4px 0 0; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } .row .note { grid-column: 1; } header { flex-wrap: wrap; } }
  .rw { display: flex; flex-direction: column; gap: 6px; }
  .rw-row { display: grid; grid-template-columns: 130px 1fr 80px 28px; gap: 6px; align-items: center; }
  .rw-row select, .rw-row input { width: 100%; }
  .rw-row .x, .ms-head .x { background: none; border: 0; color: var(--err); cursor: pointer; font-size: 16px; }
  .rw-add { align-self: flex-start; background: transparent; border: 1px dashed var(--line); color: var(--muted); border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  .ms { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 6px; }
  .ms-head { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 13.5px; }
  .ms-head input { width: 80px; }
  .qe-head { display: grid; grid-template-columns: 120px 1fr 120px 90px 28px; gap: 6px; margin-bottom: 6px; }
  .qe-head .x { background: none; border: 0; color: var(--err); cursor: pointer; font-size: 16px; }
  .qe-tg { margin-bottom: 6px; }
  .sp-head { display: grid; grid-template-columns: 1fr 90px 60px auto 28px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .sp-head .x { background: none; border: 0; color: var(--err); cursor: pointer; font-size: 16px; }
  .sp-pct { text-align: right; color: var(--accent); }
  .sp-rare { font-size: 13px; display: flex; gap: 4px; align-items: center; white-space: nowrap; }
  .sp-rare input { width: auto; }
  .fm-head { display: grid; grid-template-columns: 110px 1fr 150px 140px 28px; gap: 6px; margin-bottom: 6px; }
  .fs-head { display: grid; grid-template-columns: 1fr 1fr 80px 28px; gap: 6px; margin-bottom: 6px; }
  .fm-head .x, .fs-head .x { background: none; border: 0; color: var(--err); cursor: pointer; font-size: 16px; }
  .ms textarea { width: 100%; margin-bottom: 6px; }
  @media (max-width: 640px) { .fm-head, .fs-head { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { .rw-row, .qe-head { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>DuckyMoMo · Cài đặt</h1>
  <nav class="tabs" id="tabs"></nav>
  <a href="camnang">Cẩm nang</a>
  <a href="huongdan">Cẩm nang game</a>
  <a href="role">Role</a>
  <a href="thuvien">Thư viện đồ</a>
  <a href="boss">Boss</a>
  <a href="hoatdong">Hoạt động người chơi</a>
  <a id="dozzle" href="__DOZZLE_URL__" target="_blank" rel="noopener">Xem log ↗</a>
</header>
<main id="main"><p>Đang tải…</p></main>
<div class="bar"><div class="inner">
  <div class="status" id="status">Sửa giá trị rồi bấm Lưu. Ô đã sửa được tô màu.</div>
  <button class="ghost" id="reapply" title="Ghi lại mọi giá trị vào plugin và nạp lại (dùng khi server mới cài hoặc sửa tay settings.yml)">Áp dụng lại tất cả</button>
  <button class="primary" id="save" disabled>Lưu và áp dụng</button>
</div></div>

<script>
let modes = [], current = null, edits = {}, category = {};
const $ = (id) => document.getElementById(id);
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

if (!"__DOZZLE_URL__") $("dozzle").style.display = "none";

async function load() {
  const r = await fetch("api/modes");
  modes = await r.json();
  if (!current || !modes.find(m => m.id === current)) current = modes[0] && modes[0].id;
  edits = {};
  render();
}

function render() {
  $("tabs").innerHTML = "";
  for (const m of modes) {
    const b = document.createElement("button");
    b.className = "tab" + (m.id === current ? " active" : "");
    b.textContent = m.schema.title || m.id;
    b.onclick = () => { if (Object.keys(edits).length && !confirm("Bỏ các thay đổi chưa lưu?")) return; current = m.id; edits = {}; render(); };
    $("tabs").appendChild(b);
  }
  const mode = modes.find(m => m.id === current);
  const main = $("main");
  main.innerHTML = "";
  if (!mode) { main.textContent = "Chưa có chế độ nào có settings.schema.yml."; return; }
  // Thanh chọn loại (category của nhóm); "Tất cả" hiện mọi nhóm. Loại có mục đã sửa chưa lưu được đánh dấu •
  const cats = [];
  for (const g of mode.schema.groups) { const c = g.category || "Khác"; if (!cats.includes(c)) cats.push(c); }
  if (!category[mode.id] || (category[mode.id] !== "*" && !cats.includes(category[mode.id]))) category[mode.id] = cats[0];
  const nav = document.createElement("nav");
  nav.className = "cats";
  for (const c of [...cats, "*"]) {
    const b = document.createElement("button");
    b.className = "cat" + (category[mode.id] === c ? " active" : "");
    const dirty = mode.schema.groups.some(g => (c === "*" || (g.category || "Khác") === c) && g.settings.some(st => st.key in edits));
    b.textContent = (c === "*" ? "Tất cả" : c) + (dirty ? " •" : "");
    b.onclick = () => { category[mode.id] = c; render(); };
    nav.appendChild(b);
  }
  main.appendChild(nav);
  for (const g of mode.schema.groups) {
    if (category[mode.id] !== "*" && (g.category || "Khác") !== category[mode.id]) continue;
    const box = document.createElement("section");
    box.className = "group";
    box.innerHTML = `<h2></h2>${g.description ? '<p class="desc"></p>' : ""}`;
    box.querySelector("h2").textContent = g.title;
    if (g.description) box.querySelector(".desc").textContent = g.description;
    for (const s of g.settings) box.appendChild(row(mode, s));
    main.appendChild(box);
  }
  updateBar();
}


// ---- Ô chọn quà (DuckyMoMoCore Rewards): xu <số> | do <mã> [số] | vat <VẬT_LIỆU> [số] | lenh <lệnh> | manh <loại> <số>
let libCache = null;
function lib() {
  if (!libCache) libCache = fetch("api/thuvien").then(r => r.json()).catch(() => ({ items: [], meta: null }));
  return libCache;
}
const RW_KINDS = [["xu", "Xu"], ["do", "Đồ thư viện"], ["vat", "Đồ thường"], ["lenh", "Lệnh console"], ["manh", "Mảnh sự kiện"]];
function rewardsEditor(list, onChange) {
  const box = document.createElement("div"); box.className = "rw";
  const rows = [];
  const emit = () => onChange(rows.map(r => r.val()).filter(Boolean));
  const add = document.createElement("button"); add.type = "button"; add.className = "rw-add"; add.textContent = "+ Thêm quà";
  function addRow(spec) {
    const parts = String(spec || "xu 100").trim().split(/\s+/);
    const row = document.createElement("div"); row.className = "rw-row";
    const kind = document.createElement("select");
    for (const [k, t] of RW_KINDS) { const o = document.createElement("option"); o.value = k; o.textContent = t; kind.appendChild(o); }
    kind.value = RW_KINDS.some(x => x[0] === parts[0]) ? parts[0] : "lenh";
    const mid = document.createElement("span"), amt = document.createElement("input"), x = document.createElement("button");
    amt.type = "number"; amt.min = "0"; x.type = "button"; x.className = "x"; x.textContent = "×"; x.title = "Bỏ";
    let main = null;
    function build(init) {
      mid.innerHTML = ""; amt.style.visibility = "visible";
      const k = kind.value, a = init ? parts.slice(1) : [];
      if (k === "xu") {
        main = document.createElement("input"); main.type = "number"; main.min = "1"; main.value = a[0] || "100"; amt.style.visibility = "hidden";
      } else if (k === "do") {
        main = document.createElement("select");
        main.innerHTML = '<option value="">(đang tải thư viện…)</option>';
        main.dataset.v = a[0] || "";
        lib().then(d => {
          const cur = main.dataset.v;
          const items = d.items || [];
          main.innerHTML = items.map(it => '<option value="' + it.id + '">' + it.id + (it.ten_goi && it.ten_goi !== it.id ? " · " + String(it.ten_goi).replace(/[<>&"]/g, "") : "") + "</option>").join("")
            || '<option value="">(thư viện trống: tạo ở trang Thư viện đồ)</option>';
          if (cur && !items.some(it => it.id === cur)) main.insertAdjacentHTML("afterbegin", '<option value="' + cur + '">' + cur + " (không còn trong thư viện!)</option>");
          if (cur) main.value = cur;
          main.dataset.v = main.value;
          emit();
        });
        amt.value = a[1] || "1"; amt.title = "Số lượng (0 = theo thư viện)";
      } else if (k === "vat") {
        main = document.createElement("input"); main.setAttribute("list", "rw-mats"); main.placeholder = "DIAMOND"; main.value = a[0] || ""; amt.value = a[1] || "1"; amt.title = "Số lượng";
      } else if (k === "manh") {
        main = document.createElement("input"); main.placeholder = "loại mảnh, vd lamnguy"; main.value = a[0] || ""; amt.value = a[1] || "1"; amt.title = "Số mảnh";
      } else {
        main = document.createElement("input"); main.placeholder = "lệnh không có /, {player} = tên người chơi"; main.value = a.join(" "); amt.style.visibility = "hidden";
      }
      main.oninput = main.onchange = () => { main.dataset.v = main.value; emit(); };
      mid.appendChild(main);
    }
    build(true);
    kind.onchange = () => { build(false); emit(); };
    amt.oninput = emit;
    const r = {
      val() {
        const k = kind.value, v = String(main.value || "").trim(), n = parseInt(amt.value || "0", 10);
        if (!v) return "";
        if (k === "xu") return "xu " + v;
        if (k === "lenh") return "lenh " + v;
        if (k === "vat") return "vat " + v.toUpperCase() + " " + (n > 0 ? n : 1);
        if (k === "manh") return "manh " + v.toLowerCase() + " " + (n > 0 ? n : 1);
        return n > 0 ? "do " + v + " " + n : "do " + v;
      }
    };
    x.onclick = () => { rows.splice(rows.indexOf(r), 1); row.remove(); emit(); };
    row.append(kind, mid, amt, x); rows.push(r); box.insertBefore(row, add);
  }
  box.appendChild(add);
  add.onclick = () => { addRow("xu 100"); emit(); };
  for (const sp of list || []) addRow(sp);
  if (!document.getElementById("rw-mats")) {
    const dl = document.createElement("datalist"); dl.id = "rw-mats"; document.body.appendChild(dl);
    lib().then(d => { dl.innerHTML = ((d.meta && d.meta.materials) || []).map(m => '<option value="' + m + '">').join(""); });
  }
  return box;
}
function milestonesEditor(value, onChange) {
  const box = document.createElement("div");
  const ms = [];
  const emit = () => {
    const o = {};
    for (const m of ms) { const d = parseInt(m.day.value, 10); if (d > 0 && m.list.length) o[d] = m.list; }
    onChange(o);
  };
  const add = document.createElement("button"); add.type = "button"; add.className = "rw-add"; add.textContent = "+ Thêm mốc";
  function addMs(day, list) {
    const wrap = document.createElement("div"); wrap.className = "ms";
    const head = document.createElement("div"); head.className = "ms-head";
    head.innerHTML = 'Ngày thứ <input type="number" min="1" max="3650"> <span style="flex:1"></span><button type="button" class="x" title="Bỏ mốc">×</button>';
    const m = { day: head.querySelector("input"), list: (list || []).slice() };
    m.day.value = day || ""; m.day.oninput = emit;
    head.querySelector(".x").onclick = () => { ms.splice(ms.indexOf(m), 1); wrap.remove(); emit(); };
    wrap.append(head, rewardsEditor(m.list, v => { m.list = v; emit(); }));
    ms.push(m); box.insertBefore(wrap, add);
  }
  box.appendChild(add);
  add.onclick = () => {
    const last = ms.length ? Math.max(...ms.map(m => parseInt(m.day.value, 10) || 0)) : 0;
    addMs(last + 7, ["xu 500"]); emit();
  };
  for (const [d, l] of Object.entries(value || {})) addMs(d, l);
  return box;
}


// ---- Trình soạn nhiệm vụ hằng ngày: {mã: {name, type, targets[], amount, rewards[]}}
const QUEST_TYPES = [["break", "Phá khối (đào, chặt)"], ["place", "Đặt khối (xây)"], ["kill", "Giết mob (săn)"], ["fish", "Câu cá"], ["harvest", "Thu hoạch cây chín"]];
function questsEditor(value, onChange) {
  const box = document.createElement("div");
  const qs = [];
  const emit = () => {
    const o = {};
    for (const q of qs) {
      const id = q.id.value.trim();
      if (!id) continue;
      o[id] = { name: q.name.value.trim(), type: q.type.value,
        targets: q.tg.value.split(",").map(x => x.trim().toUpperCase()).filter(Boolean),
        amount: parseInt(q.amount.value || "1", 10), rewards: q.rewards };
    }
    onChange(o);
  };
  const add = document.createElement("button"); add.type = "button"; add.className = "rw-add"; add.textContent = "+ Thêm nhiệm vụ";
  function addQ(id, d) {
    const wrap = document.createElement("div"); wrap.className = "ms";
    const head = document.createElement("div"); head.className = "qe-head";
    head.innerHTML = '<input placeholder="mã, vd dao_da"><input placeholder="Tên hiện cho người chơi"><select></select><input type="number" min="1" max="100000" title="Số lượng cần đạt"><button type="button" class="x" title="Bỏ nhiệm vụ">×</button>';
    const [idEl, nameEl, typeEl, amtEl] = head.querySelectorAll("input,select");
    for (const [k, t] of QUEST_TYPES) { const o = document.createElement("option"); o.value = k; o.textContent = t; typeEl.appendChild(o); }
    const tg = document.createElement("input"); tg.className = "qe-tg"; tg.placeholder = "Mục tiêu, vd STONE, *_ORE, @HOSTILE (trống = tất cả)";
    const q = { id: idEl, name: nameEl, type: typeEl, amount: amtEl, tg, rewards: (d.rewards || []).slice() };
    idEl.value = id || ""; nameEl.value = d.name || ""; typeEl.value = d.type || "break"; amtEl.value = d.amount || 10;
    tg.value = (d.targets || []).join(", ");
    for (const el of [idEl, nameEl, amtEl, tg]) el.oninput = emit;
    typeEl.onchange = emit;
    head.querySelector(".x").onclick = () => { qs.splice(qs.indexOf(q), 1); wrap.remove(); emit(); };
    wrap.append(head, tg, rewardsEditor(q.rewards, v => { q.rewards = v; emit(); }));
    qs.push(q); box.insertBefore(wrap, add);
  }
  box.appendChild(add);
  add.onclick = () => { addQ("", { type: "break", amount: 32, rewards: ["xu 100"] }); emit(); };
  for (const [id, d] of Object.entries(value || {})) addQ(id, d || {});
  return box;
}


// ---- Trình soạn vòng quay: [{label, weight, rare, rewards[]}], tỉ lệ = weight / tổng
function spinEditor(value, onChange) {
  const box = document.createElement("div");
  const ps = [];
  const pct = () => {
    const total = ps.reduce((a, p) => a + (parseInt(p.w.value, 10) || 0), 0);
    for (const p of ps) { const w = parseInt(p.w.value, 10) || 0; p.pct.textContent = total ? (100 * w / total).toFixed(1) + "%" : "–"; }
  };
  const emit = () => {
    pct();
    onChange(ps.map(p => ({ label: p.label.value.trim(), weight: parseInt(p.w.value, 10) || 0, rare: p.rare.checked, rewards: p.rewards }))
      .filter(p => p.weight > 0 && p.rewards.length));
  };
  const add = document.createElement("button"); add.type = "button"; add.className = "rw-add"; add.textContent = "+ Thêm phần thưởng";
  function addP(d) {
    const wrap = document.createElement("div"); wrap.className = "ms";
    const head = document.createElement("div"); head.className = "sp-head";
    head.innerHTML = '<input placeholder="Tên hiện trong vòng quay, vd 5 kim cương"><input type="number" min="1" max="100000" title="Trọng số (càng lớn càng dễ trúng)"><b class="sp-pct"></b><label class="sp-rare"><input type="checkbox"> Hiếm (báo cả server)</label><button type="button" class="x" title="Bỏ">×</button>';
    const [label, w] = head.querySelectorAll("input");
    const p = { label, w, rare: head.querySelector(".sp-rare input"), pct: head.querySelector(".sp-pct"), rewards: (d.rewards || []).slice() };
    label.value = d.label || ""; w.value = d.weight || 10; p.rare.checked = !!d.rare;
    label.oninput = w.oninput = emit; p.rare.onchange = emit;
    head.querySelector(".x").onclick = () => { ps.splice(ps.indexOf(p), 1); wrap.remove(); emit(); };
    wrap.append(head, rewardsEditor(p.rewards, v => { p.rewards = v; emit(); }));
    ps.push(p); box.insertBefore(wrap, add);
  }
  box.appendChild(add);
  add.onclick = () => { addP({ label: "", weight: 10, rewards: ["xu 200"] }); emit(); };
  for (const d of value || []) addP(d || {});
  pct();
  return box;
}


// ---- Loại mảnh sự kiện: {mã: {name, material, lore[], until}}
function fragTypesEditor(value, onChange) {
  const box = document.createElement("div");
  const ts = [];
  const emit = () => {
    const o = {};
    for (const t of ts) {
      const id = t.id.value.trim().toLowerCase();
      if (!id) continue;
      o[id] = { name: t.name.value, material: t.mat.value.trim().toUpperCase() || "AMETHYST_SHARD",
        lore: t.lore.value.split("\n").map(x => x.trimEnd()).filter(Boolean), until: t.until.value };
    }
    onChange(o);
  };
  const add = document.createElement("button"); add.type = "button"; add.className = "rw-add"; add.textContent = "+ Thêm loại mảnh";
  function addT(id, d) {
    const wrap = document.createElement("div"); wrap.className = "ms";
    wrap.innerHTML = '<div class="fm-head"><input placeholder="mã, vd lamnguy"><input placeholder="Tên (mã màu &), vd &c&lMảnh Lâm Nguy"><input list="rw-mats" placeholder="AMETHYST_SHARD"><input type="date" title="Hạn đổi (trống = không hạn)"><button type="button" class="x" title="Bỏ">×</button></div><textarea rows="2" placeholder="Mô tả (lore), mỗi dòng một dòng"></textarea>';
    const [idEl, nameEl, matEl, untilEl] = wrap.querySelectorAll("input");
    const t = { id: idEl, name: nameEl, mat: matEl, until: untilEl, lore: wrap.querySelector("textarea") };
    idEl.value = id || ""; nameEl.value = d.name || ""; matEl.value = d.material || "AMETHYST_SHARD"; untilEl.value = d.until || "";
    t.lore.value = (d.lore || []).join("\n");
    for (const el of [idEl, nameEl, matEl, untilEl, t.lore]) el.oninput = emit;
    wrap.querySelector(".x").onclick = () => { ts.splice(ts.indexOf(t), 1); wrap.remove(); emit(); };
    ts.push(t); box.insertBefore(wrap, add);
  }
  box.appendChild(add);
  add.onclick = () => { addT("", { material: "AMETHYST_SHARD" }); emit(); };
  for (const [id, d] of Object.entries(value || {})) addT(id, d || {});
  if (!document.getElementById("rw-mats")) rewardsEditor([], () => {}); // tạo datalist vật liệu
  return box;
}

// ---- Cửa hàng đổi mảnh: [{label, cost {loại: số}, limit, rewards[]}]
function fragShopEditor(value, onChange) {
  const box = document.createElement("div");
  const os = [];
  const emit = () => onChange(os.map(o => {
    const cost = {};
    for (const part of o.cost.value.split(",")) {
      const m = part.trim().match(/^([a-z0-9_]+)\s+(\d+)$/i) || part.trim().match(/^(\d+)\s+([a-z0-9_]+)$/i);
      if (m) { const [k, n] = /^\d+$/.test(m[1]) ? [m[2], m[1]] : [m[1], m[2]]; cost[k.toLowerCase()] = parseInt(n, 10); }
    }
    return { label: o.label.value.trim(), cost, limit: parseInt(o.limit.value || "0", 10), rewards: o.rewards };
  }).filter(o => Object.keys(o.cost).length && o.rewards.length));
  const add = document.createElement("button"); add.type = "button"; add.className = "rw-add"; add.textContent = "+ Thêm món đổi";
  function addO(d) {
    const wrap = document.createElement("div"); wrap.className = "ms";
    const head = document.createElement("div"); head.className = "fs-head";
    head.innerHTML = '<input placeholder="Tên món, vd 16 kim cương"><input placeholder="Giá: loại số, vd lamnguy 40 (nhiều loại cách dấu phẩy)"><input type="number" min="0" max="1000" title="Mỗi người đổi tối đa (0 = không giới hạn)"><button type="button" class="x" title="Bỏ">×</button>';
    const [label, cost, limit] = head.querySelectorAll("input");
    const o = { label, cost, limit, rewards: (d.rewards || []).slice() };
    label.value = d.label || ""; limit.value = d.limit || 0;
    cost.value = Object.entries(d.cost || {}).map(([k, n]) => k + " " + n).join(", ");
    for (const el of [label, cost, limit]) el.oninput = emit;
    head.querySelector(".x").onclick = () => { os.splice(os.indexOf(o), 1); wrap.remove(); emit(); };
    wrap.append(head, rewardsEditor(o.rewards, v => { o.rewards = v; emit(); }));
    os.push(o); box.insertBefore(wrap, add);
  }
  box.appendChild(add);
  add.onclick = () => { addO({ label: "", cost: {}, limit: 0, rewards: ["xu 1000"] }); emit(); };
  for (const d of value || []) addO(d || {});
  return box;
}

function row(mode, s) {
  const div = document.createElement("div");
  div.className = "row";
  const id = "f_" + s.key;
  const label = document.createElement("label");
  label.htmlFor = id; label.textContent = s.label;
  div.appendChild(label);
  const saved = mode.values[s.key];
  const value = s.key in edits ? edits[s.key] : saved;
  let input;
  if (s.type === "select") {
    input = document.createElement("select");
    s.options.forEach((o, i) => {
      const opt = document.createElement("option");
      opt.value = i; opt.textContent = o.label;
      if (same(o.value, value)) opt.selected = true;
      input.appendChild(opt);
    });
    input.onchange = () => change(mode, s, s.options[input.value].value, div);
  } else if (s.type === "lines") {
    // Mỗi dòng một mục (lưu thành danh sách)
    input = document.createElement("textarea");
    input.rows = Math.min(12, Math.max(3, (value || []).length + 1));
    input.value = (value || []).join("\n");
    input.oninput = () => change(mode, s, input.value.split("\n").map(x => x.trim()).filter(x => x), div);
  } else if (s.type === "rewards") {
    input = rewardsEditor(value || [], v => change(mode, s, v, div));
  } else if (s.type === "fragtypes") {
    input = fragTypesEditor(value || {}, v => change(mode, s, v, div));
  } else if (s.type === "fragshop") {
    input = fragShopEditor(value || [], v => change(mode, s, v, div));
  } else if (s.type === "spin") {
    input = spinEditor(value || [], v => change(mode, s, v, div));
  } else if (s.type === "quests") {
    input = questsEditor(value || {}, v => change(mode, s, v, div));
  } else if (s.type === "milestones") {
    input = milestonesEditor(value || {}, v => change(mode, s, v, div));
  } else if (s.type === "list") {
    // Các mục cách nhau dấu phẩy (lưu thành danh sách)
    input = document.createElement("input");
    input.value = (value || []).join(", ");
    input.placeholder = "Các mục cách nhau dấu phẩy";
    input.oninput = () => {
      let v = input.value.split(",").map(x => x.trim()).filter(x => x);
      if (s.items === "int") v = v.map(x => parseInt(x, 10));
      if (s.items === "number") v = v.map(x => parseFloat(x));
      change(mode, s, v, div);
    };
  } else {
    input = document.createElement("input");
    if (s.type === "int" || s.type === "number") {
      input.type = "number"; input.step = s.type === "int" ? "1" : "any";
      if (s.min !== undefined) input.min = s.min;
      if (s.max !== undefined) input.max = s.max;
    } else if (s.type === "times") {
      input.placeholder = "Ví dụ: 20:00,21:00 (để trống = không có phiên)";
    }
    input.value = value ?? "";
    input.oninput = () => {
      let v = input.value;
      if (s.type === "int") v = v === "" ? "" : parseInt(v, 10);
      if (s.type === "number") v = v === "" ? "" : parseFloat(v);
      change(mode, s, v, div);
    };
  }
  input.id = id;
  div.appendChild(input);
  if (s.note) { const n = document.createElement("div"); n.className = "note"; n.textContent = s.note; div.appendChild(n); }
  if (s.key in edits) div.classList.add("changed");
  return div;
}

function change(mode, s, v, div) {
  if (same(v, mode.values[s.key])) delete edits[s.key]; else edits[s.key] = v;
  div.classList.toggle("changed", s.key in edits);
  updateBar();
  const active = document.querySelector(".cat.active");
  if (active) for (const b of document.querySelectorAll(".cat")) {
    const c = b.textContent.replace(" •", "");
    const mode2 = modes.find(m => m.id === current);
    const dirty = mode2.schema.groups.some(g => (c === "Tất cả" || (g.category || "Khác") === c) && g.settings.some(st => st.key in edits));
    b.textContent = c + (dirty ? " •" : "");
  }
}

function updateBar() {
  const n = Object.keys(edits).length;
  $("save").disabled = n === 0;
  $("save").textContent = n ? `Lưu và áp dụng (${n})` : "Lưu và áp dụng";
}

function showResult(res) {
  const st = $("status");
  st.className = "status " + (res.ok ? "ok" : "err");
  st.textContent = res.message;
  if (res.results && res.results.length) {
    const d = document.createElement("details");
    d.className = "results";
    d.innerHTML = "<summary>Kết quả lệnh</summary><pre></pre>";
    d.querySelector("pre").textContent = res.results.map(r => `> ${r.command}\n${r.output || "(không có phản hồi)"}`).join("\n\n");
    st.appendChild(d);
  }
}

async function post(path, body) {
  $("save").disabled = true; $("reapply").disabled = true;
  $("status").className = "status"; $("status").textContent = "Đang lưu và áp dụng…";
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const res = await r.json();
    if (r.ok) { await load(); }
    showResult(res);
  } catch (e) {
    showResult({ ok: false, message: "Không gửi được: " + e });
  } finally {
    $("reapply").disabled = false; updateBar();
  }
}

$("save").onclick = () => post(`api/modes/${current}/save`, { values: edits });
$("reapply").onclick = () => {
  if (confirm("Ghi lại toàn bộ cài đặt vào plugin và nạp lại?")) post(`api/modes/${current}/apply-all`, {});
};
window.addEventListener("beforeunload", (e) => { if (Object.keys(edits).length) { e.preventDefault(); e.returnValue = ""; } });
load().catch(e => { $("main").textContent = "Không tải được cài đặt: " + e; });
</script>
</body>
