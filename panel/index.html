<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuckyMoMo · Cài đặt</title>
<style>
  @media (max-width: 900px) { .page { padding: 18px 14px 0; } }
  .page { }
  .page-head .search { position: relative; width: min(420px, 100%); }
  .page-head .search input { width: 100%; padding: 10px 14px 10px 38px; border-radius: 10px; font-size: 15px; }
  .page-head .search::before { content: "🔎"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: .7; }
  /* chọn chế độ */
  .modes { display: inline-flex; gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 20px; flex-wrap: wrap; box-shadow: var(--shadow); }
  .mode { border: 0; background: transparent; color: var(--muted); padding: 8px 16px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 14.5px; }
  .mode:hover { color: var(--text); background: var(--chip); }
  .mode.active { background: var(--accent); color: var(--accent-text); }
  .mode .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-left: 6px; vertical-align: middle; }
  /* bố cục: danh mục trái + nội dung */
  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
  .cats { position: sticky; top: 18px; display: flex; flex-direction: column; gap: 2px; padding: 8px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .cat { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 14.5px; }
  .cat:hover { background: var(--chip); }
  .cat.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .cat .ic { width: 22px; text-align: center; }
  .cat .n { margin-left: auto; font-size: 12px; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 0 8px; font-weight: 500; }
  .cat .dirty { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .cat.all { border-top: 1px solid var(--line-2); margin-top: 4px; padding-top: 11px; border-radius: 0 0 8px 8px; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .cats { position: static; flex-direction: row; overflow-x: auto; padding: 6px; scrollbar-width: none; }
    .cats::-webkit-scrollbar { display: none; }
    .savebar .status { flex-basis: 100%; min-width: 0; font-size: 13px; }
    .savebar #reapply { display: none; }
    .savebar .inner { padding: 10px 12px; gap: 8px; }
    .savebar button { flex: 1; }
    .cat { width: auto; white-space: nowrap; }
    .cat .n { display: none; }
    .cat.all { border-top: 0; margin-top: 0; padding-top: 9px; }
  }
  /* nhóm cài đặt */
  #main { display: flex; flex-direction: column; gap: 20px; padding-bottom: 110px; }
  .group { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .ghead { padding: 18px 22px 14px; border-bottom: 1px solid var(--line-2); }
  .ghead .gcat { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 2px; }
  .ghead h2 { font-size: 17px; margin: 0; }
  .ghead p.desc { color: var(--muted); margin: 6px 0 0; font-size: 14px; max-width: 80ch; }
  /* mỗi cài đặt là một thẻ nhỏ, xếp lưới nhiều cột; trình soạn lớn trải hết bề ngang */
  .gbody { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; padding: 16px 22px 20px; align-items: start; }
  .row { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--card-2); position: relative; }
  .row.wide, .gbody > .mxwrap { grid-column: 1 / -1; }
  .row.span2 { grid-column: span 2; }
  .row.bool { flex-direction: row; align-items: center; justify-content: space-between; gap: 14px; }
  .row.bool .lab { min-width: 0; }
  .row.bool .ctl { flex: none; }
  .row.changed { background: var(--changed); border-color: var(--accent); }
  .row .lab label { font-weight: 600; font-size: 14px; display: block; line-height: 1.4; }
  .row .lab .note { color: var(--muted); font-size: 12.5px; margin-top: 3px; line-height: 1.45; }
  .row .lab .pill { display: none; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 1px; }
  .row.changed .lab .pill { display: inline-block; }
  .row .ctl { min-width: 0; }
  .row .ctl > input, .row .ctl > select, .row .ctl > textarea { width: 100%; }
  .row .ctl > textarea { min-height: 110px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13.5px; line-height: 1.5; }
  .row .count { font-size: 12px; color: var(--muted); margin-top: 4px; }
  mark { background: rgba(255, 200, 0, .35); color: inherit; border-radius: 3px; padding: 0 1px; }
  @media (max-width: 700px) { .gbody { grid-template-columns: minmax(0, 1fr); padding: 12px; } .row.span2 { grid-column: auto; } .ghead { padding: 16px; } }
  /* bảng so sánh: các mục cùng dạng "Bậc: mục" (Danh phận, rank, mùa, sách CE…) */
  .mxwrap { border: 1px solid var(--line-2); border-radius: 10px; overflow: auto; background: var(--card-2); max-width: 100%; }
  table.mx { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
  table.mx th, table.mx td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: middle; }
  table.mx thead th { position: sticky; top: 0; z-index: 2; background: var(--card); font-size: 12.5px; color: var(--muted); font-weight: 600; white-space: nowrap; border-bottom: 1px solid var(--line); }
  table.mx tbody th { position: sticky; left: 0; z-index: 1; background: var(--card); font-weight: 600; font-size: 13.5px; min-width: 150px; max-width: 260px; border-right: 1px solid var(--line-2); }
  table.mx thead th:first-child { left: 0; z-index: 3; }
  table.mx tbody tr:last-child > * { border-bottom: 0; }
  table.mx tbody tr:hover > td { background: rgba(127, 127, 127, .05); }
  table.mx td { min-width: 120px; }
  table.mx td input, table.mx td select { width: 100%; min-width: 90px; padding: 5px 8px; font-size: 13.5px; }
  table.mx td input[type=number] { max-width: 130px; }
  table.mx td.changed { background: var(--changed); box-shadow: inset 0 0 0 1px var(--accent); }
  table.mx td.none { color: var(--muted); text-align: center; }
  table.mx .switch .txt { font-size: 12.5px; }
  table.mx .mcline { margin-top: 4px; }
  table.mx .mcline .mc { font-size: 12px; padding: 2px 8px; }
  .mxnote { font-size: 12px; color: var(--muted); padding: 8px 12px; border-top: 1px solid var(--line-2); }
  .empty { color: var(--muted); padding: 40px; text-align: center; background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }
  /* thanh lưu */
  .savebar { position: fixed; bottom: 0; right: 0; left: 236px; z-index: 30; padding: 0 32px 16px; pointer-events: none; }
  @media (max-width: 900px) { .savebar { left: 0; padding: 0 10px 10px; } }
  .savebar .inner { pointer-events: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; box-shadow: 0 8px 30px rgba(0, 0, 0, .18); }
  .savebar.dirty .inner { border-color: var(--accent); }
  .savebar .status { flex: 1; font-size: 14px; color: var(--muted); min-width: 200px; }
  .status.ok { color: var(--ok); } .status.err { color: var(--err); }
  details.results { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  details.results pre { white-space: pre-wrap; margin: 4px 0 0; max-height: 200px; overflow: auto; }
  /* trình soạn (quà, mốc, nhiệm vụ, vòng quay, mảnh, cửa hàng) */
  .ctl input, .ctl select, .ctl textarea { padding: 7px 10px; }
  .rw { display: flex; flex-direction: column; gap: 8px; }
  .rw-row { display: grid; grid-template-columns: 150px 1fr 90px 32px; gap: 8px; align-items: center; }
  .rw-row select, .rw-row input { width: 100%; }
  .kit-head .x, .rw-row .x, .ms-head .x, .qe-head .x, .sp-head .x, .fm-head .x, .fs-head .x, .sh-row .x { background: none; border: 0; color: var(--err); cursor: pointer; font-size: 18px; border-radius: 6px; }
  .rw-row .x:hover, .ms-head .x:hover, .qe-head .x:hover, .sp-head .x:hover, .fm-head .x:hover, .fs-head .x:hover, .sh-row .x:hover { background: rgba(217, 48, 37, .1); }
  .rw-add { align-self: flex-start; background: transparent; border: 1px dashed var(--line); color: var(--muted); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; }
  .rw-add:hover { border-color: var(--accent); color: var(--accent); }
  .small { font-size: 12.5px; color: var(--muted); }
  .ms { border: 1px solid var(--line); background: var(--card-2); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .ms-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 14px; font-weight: 600; }
  .ms-head input { width: 90px; }
  .kit-head { display: grid; grid-template-columns: 140px minmax(0, 1fr) minmax(0, 220px) 170px 32px; gap: 8px; align-items: center; margin-bottom: 10px; }
  .kit-ranks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .kit-ranks .lab { font-size: 13px; color: var(--muted); margin-right: 4px; }
  .kit-rank { border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; }
  .kit-rank.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .kit-rank.donate { border-style: dashed; }
  .kit-all { font-size: 12.5px; color: var(--muted); font-style: italic; }
  .kit-warn { font-size: 13px; color: var(--warn); margin-bottom: 6px; }
  .kit-warn:empty { display: none; }
  @media (max-width: 700px) { .kit-head { grid-template-columns: 1fr 1fr; } }
  .qe-head { display: grid; grid-template-columns: 130px 1fr 170px 100px 32px; gap: 8px; margin-bottom: 8px; }
  .qe-tg { width: 100%; margin-bottom: 8px; }
  .sp-head { display: grid; grid-template-columns: 1fr 100px 64px auto 32px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .sp-pct { text-align: right; color: var(--accent); font-weight: 700; }
  .sp-rare { font-size: 13px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .sp-rare input { width: auto; }
  .fm-head { display: grid; grid-template-columns: 120px 1fr 160px 150px 32px; gap: 8px; margin-bottom: 8px; }
  .ws-grid { display: grid; grid-template-columns: repeat(3, minmax(190px, 1fr)); gap: 6px; max-width: 760px; }
  .ws-cell { display: grid; grid-template-columns: 1fr 56px; gap: 4px; border: 1px dashed var(--line); border-radius: 8px; padding: 4px; }
  .ws-row { display: grid; gap: 8px; align-items: center; margin-bottom: 8px; }
  .ws-row label { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  .fs-head { display: grid; grid-template-columns: 1fr 1fr 90px 32px; gap: 8px; margin-bottom: 8px; }
  .ms textarea { width: 100%; margin-bottom: 8px; }
  .sh-row { display: grid; grid-template-columns: 130px 1fr 100px 120px 32px; gap: 8px; align-items: center; }
  .sh-row select, .sh-row input, .sh-row > span > * { width: 100%; }
  .mcline { margin-top: 6px; } .mcline .mc { display: inline-block; padding: 4px 10px; }

  /* danh sách dạng thẻ */
  .tg { border: 1px solid var(--line); border-radius: 10px; background: var(--input); overflow: hidden; }
  .tg-top { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line-2); background: var(--card-2); }
  .tg-top .tg-filter { flex: 1; max-width: 260px; padding: 5px 10px; font-size: 13.5px; }
  .tg-top.few .tg-filter { visibility: hidden; }
  .tg-n, .ln-n { font-size: 12.5px; color: var(--muted); margin-left: auto; }
  .tg-mode { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 13px; padding: 2px 4px; }
  .tg-mode:hover { text-decoration: underline; }
  .tg-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; cursor: text; max-height: 260px; overflow-y: auto; }
  .tg-chip { display: inline-flex; align-items: center; gap: 2px; background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 2px 3px 2px 11px; font-size: 13.5px; }
  .tg-chip button { border: 0; background: none; color: var(--muted); cursor: pointer; width: 20px; height: 20px; border-radius: 50%; font-size: 14px; line-height: 1; }
  .tg-chip button:hover { background: rgba(217, 48, 37, .14); color: var(--err); }
  .tg-chip.flash { animation: tgflash .9s; }
  @keyframes tgflash { 0%, 60% { background: var(--accent-soft); border-color: var(--accent); } }
  .tg-in { border: 0 !important; box-shadow: none !important; background: transparent !important; flex: 1; min-width: 160px; padding: 3px 4px !important; font-size: 13.5px; }
  .tg-none { color: var(--muted); font-size: 13px; padding: 3px 4px; }
  .tg-text { width: 100%; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13.5px; resize: vertical; padding: 10px !important; }
  /* nhiều dòng chữ */
  .ln-rows { display: flex; flex-direction: column; gap: 6px; }
  .ln-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .ln-row .ln-i { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .ln-row input { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13.5px; }
  .ln-act { display: inline-flex; gap: 2px; opacity: .35; transition: opacity .15s; }
  .ln-row:hover .ln-act, .ln-row:focus-within .ln-act { opacity: 1; }
  .ln-act button { border: 0; background: none; color: var(--muted); cursor: pointer; width: 26px; height: 26px; border-radius: 6px; font-size: 14px; }
  .ln-act button:hover:not(:disabled) { background: var(--chip); color: var(--text); }
  .ln-act button:disabled { opacity: .3; cursor: default; }
  .ln-act button.x { color: var(--err); font-size: 17px; }
  .ln-bar { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .ln-text { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13.5px; resize: vertical; }
  .ln-prev { margin-top: 12px; }
  .ln-cap { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 5px; }
  @media (max-width: 700px) { .ln-act { opacity: 1; } .ln-row { grid-template-columns: minmax(0, 1fr) auto; } .ln-row .ln-i { display: none; } }
  @media (max-width: 700px) { .rw-row, .qe-head, .fm-head, .fs-head, .sh-row, .sp-head { grid-template-columns: 1fr 1fr; } }
</style>

<body data-dozzle="__DOZZLE_URL__">
<script src="shell.js"></script>
<div class="page">
  <div class="page-head">
    <div><h1>Cài đặt</h1><p class="sub">Chỉnh từng chế độ. Bấm Lưu là ghi vào plugin và nạp lại ngay trên server.</p></div>
    <div class="search"><input id="q" type="search" placeholder="Tìm cài đặt… (vd: quà, thời gian, PvP)" autocomplete="off"></div>
  </div>
  <nav class="modes" id="tabs"></nav>
  <div class="layout">
    <nav class="cats" id="cats"></nav>
    <div id="main"><p class="empty">Đang tải…</p></div>
  </div>
</div>
<div class="savebar" id="savebar"><div class="inner">
  <div class="status" id="status">Sửa giá trị rồi bấm Lưu. Mục đã sửa có viền cam.</div>
  <button class="ghost" id="discard" disabled>Huỷ thay đổi</button>
  <button class="ghost" id="reapply" title="Ghi lại mọi giá trị vào plugin và nạp lại (dùng khi server mới cài hoặc sửa tay settings.yml)">Áp dụng lại tất cả</button>
  <button class="primary" id="save" disabled>Lưu và áp dụng</button>
</div></div>

<script>
let modes = [], current = null, edits = {}, category = {}, query = "";
// nhớ chế độ + danh mục trên địa chỉ trang (#banghoi/Chat): tải lại vẫn đúng chỗ
{ const [m, c] = location.hash.slice(1).split("/").map(decodeURIComponent); if (m) { current = m; if (c) category[m] = c; } }
const $ = (id) => document.getElementById(id);
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const CAT_ICON = { "Chiến tranh": "⚔️", "Thị trấn": "🏘️", "Thế giới": "🌍", "Thưởng & sự kiện": "🎁", "Shop": "🛒", "Hệ thống": "⚙️",
  "Kinh tế": "💰", "PvP & combat": "🗡️", "Hiển thị": "🎨", "Nghề": "⛏️", "Chống hack": "🛡️", "Phù phép": "✨", "Người mới": "🐣",
  "Chat": "💬", "Rank donate": "👑", "Sảnh": "🏰", "Role": "🎭", "Khác": "📁" };
const WIDE = new Set(["kits", "rewards", "milestones", "quests", "spin", "fragtypes", "fragshop", "shopitems", "shoptitles", "dishes", "workshop"]);
const fold = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();

async function load() {
  const r = await fetch("api/modes");
  modes = await r.json();
  if (!current || !modes.find(m => m.id === current)) current = modes[0] && modes[0].id;
  edits = {};
  render();
}

function catsOf(mode) {
  const cats = [];
  for (const g of mode.schema.groups) { const c = g.category || "Khác"; if (!cats.includes(c)) cats.push(c); }
  return cats;
}
function settingMatches(g, s) {
  if (!query) return true;
  const q = fold(query);
  return [s.label, s.note, s.key, g.title].some(x => fold(x).includes(q));
}
function highlight(el, text) {
  if (!query) { el.textContent = text; return; }
  const f = fold(text), q = fold(query), i = f.indexOf(q);
  if (i < 0) { el.textContent = text; return; }
  el.innerHTML = "";
  el.append(text.slice(0, i));
  const m = document.createElement("mark"); m.textContent = text.slice(i, i + query.length); el.append(m);
  el.append(text.slice(i + query.length));
}

function render() {
  $("tabs").innerHTML = "";
  for (const m of modes) {
    const b = document.createElement("button");
    b.className = "mode" + (m.id === current ? " active" : "");
    b.textContent = m.schema.title || m.id;
    b.onclick = async () => { if (m.id === current) return; if (Object.keys(edits).length && !(await ask("Bạn có thay đổi chưa lưu. Chuyển trang sẽ bỏ các thay đổi đó.", { title: "Bỏ thay đổi?", ok: "Bỏ thay đổi", danger: true }))) return; current = m.id; edits = {}; render(); };
    $("tabs").appendChild(b);
  }
  const mode = modes.find(m => m.id === current);
  const main = $("main");
  main.innerHTML = "";
  if (!mode) { main.innerHTML = '<p class="empty">Chưa có chế độ nào có settings.schema.yml.</p>'; return; }
  // mục mới chưa từng lưu nhưng schema có giá trị khuyên dùng (default): điền sẵn thành thay đổi chưa lưu
  for (const g of mode.schema.groups) for (const s of g.settings) if ("default" in s && !(s.key in mode.values) && !(s.key in edits)) edits[s.key] = s.default;
  const cats = catsOf(mode);
  if (!category[mode.id] || (category[mode.id] !== "*" && !cats.includes(category[mode.id]))) category[mode.id] = cats[0];
  renderCats(mode, cats);
  history.replaceState(null, "", "#" + encodeURIComponent(mode.id) + "/" + encodeURIComponent(category[mode.id]));
  let shown = 0;
  for (const g of mode.schema.groups) {
    if (!query && category[mode.id] !== "*" && (g.category || "Khác") !== category[mode.id]) continue;
    const settings = g.settings.filter(s => s.type !== "info" && settingMatches(g, s));
    if (!settings.length) continue;
    const box = document.createElement("section");
    box.className = "group";
    box.innerHTML = `<div class="ghead">${query || category[mode.id] === "*" ? '<div class="gcat"></div>' : ""}<h2></h2>${g.description ? '<p class="desc"></p>' : ""}</div><div class="gbody"></div>`;
    if (box.querySelector(".gcat")) box.querySelector(".gcat").textContent = (CAT_ICON[g.category || "Khác"] || "") + " " + (g.category || "Khác");
    highlight(box.querySelector("h2"), g.title);
    if (g.info) box.querySelector("h2").insertAdjacentHTML("beforeend", infoBtn(g.info, g.title));
    if (g.description) box.querySelector(".desc").textContent = g.description;
    const mx = matrix(settings);
    for (const s of settings) {
      if (mx && mx.members.has(s.key)) {
        if (s.key === mx.first) box.querySelector(".gbody").appendChild(matrixEl(mode, mx));
        continue;
      }
      box.querySelector(".gbody").appendChild(row(mode, s));
    }
    main.appendChild(box);
    shown += settings.length;
  }
  if (!shown) main.innerHTML = `<p class="empty">${query ? `Không có cài đặt nào khớp "${query.replace(/[<>&]/g, "")}".` : "Mục này chưa có cài đặt."}</p>`;
  updateBar();
}

function renderCats(mode, cats) {
  const nav = $("cats");
  nav.innerHTML = "";
  for (const c of [...cats, "*"]) {
    const groups = mode.schema.groups.filter(g => c === "*" || (g.category || "Khác") === c);
    const n = groups.reduce((a, g) => a + g.settings.filter(s => s.type !== "info").length, 0);
    const dirty = groups.some(g => g.settings.some(st => st.key in edits));
    const b = document.createElement("button");
    b.className = "cat" + (c === "*" ? " all" : "") + (!query && category[mode.id] === c ? " active" : "");
    b.innerHTML = `<span class="ic">${c === "*" ? "📚" : (CAT_ICON[c] || "📁")}</span><span class="t"></span>${dirty ? '<span class="dirty" title="Có mục đã sửa chưa lưu"></span>' : ""}<span class="n">${n}</span>`;
    b.querySelector(".t").textContent = c === "*" ? "Tất cả" : c;
    b.onclick = () => { query = ""; $("q").value = ""; category[mode.id] = c; render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
    nav.appendChild(b);
  }
}

// select có đúng 2 lựa chọn true/false -> công tắc
function isBool(s) { return s.type === "select" && s.options.length === 2 && s.options.every(o => o.value === true || o.value === false); }

// ---- bảng so sánh: nhãn "Chủ thể: mục" (vd "Dân: số nhà /sethome") lặp ở ≥2 chủ thể và ≥2 mục -> một bảng
const MX_TYPES = new Set(["select", "int", "number", "text", "times"]);
function splitLabel(l) { const m = /^(.+?):\s+(.+)$/.exec(String(l || "")); return m ? [m[1].trim(), m[2].trim()] : null; }
function matrix(settings) {
  const items = [];
  for (const s of settings) {
    const sp = splitLabel(s.label);
    if (sp && (!s.type || MX_TYPES.has(s.type))) items.push({ s, sub: sp[0], f: sp[1] });
  }
  const fieldSubs = new Map();
  for (const it of items) { if (!fieldSubs.has(it.f)) fieldSubs.set(it.f, new Set()); fieldSubs.get(it.f).add(it.sub); }
  const fields = [...fieldSubs].filter(([, subs]) => subs.size >= 2).map(([f]) => f);
  const used = items.filter(it => fields.includes(it.f));
  const subs = [...new Set(used.map(it => it.sub))];
  if (subs.length < 2 || fields.length < 2) return null;
  const cell = new Map(used.map(it => [it.sub + "\u0000" + it.f, it.s]));
  return { subs, fields, cell, members: new Set(used.map(it => it.s.key)), first: used[0].s.key };
}
function matrixEl(mode, mx) {
  // nhiều mục hơn chủ thể -> hàng là mục, cột là chủ thể (bảng so sánh các bậc); ngược lại hàng là chủ thể
  const byField = mx.fields.length > mx.subs.length;
  const rows = byField ? mx.fields : mx.subs, cols = byField ? mx.subs : mx.fields;
  const get = (r, c) => mx.cell.get((byField ? c : r) + "\u0000" + (byField ? r : c));
  const wrap = document.createElement("div"); wrap.className = "mxwrap";
  const t = document.createElement("table"); t.className = "mx";
  const thead = t.createTHead().insertRow();
  thead.appendChild(document.createElement("th"));
  for (const c of cols) {
    const th = document.createElement("th"); highlight(th, c);
    const withInfo = rows.map(r => get(r, c)).find(s => s && s.info);
    if (!byField && withInfo) th.insertAdjacentHTML("beforeend", infoBtn(withInfo.info, c));
    thead.appendChild(th);
  }
  const tb = t.createTBody();
  for (const r of rows) {
    const tr = tb.insertRow();
    const th = document.createElement("th"); highlight(th, r);
    const withInfo = cols.map(c => get(r, c)).find(s => s && s.info);
    if (byField && withInfo) th.insertAdjacentHTML("beforeend", infoBtn(withInfo.info, r));
    tr.appendChild(th);
    for (const c of cols) {
      const td = tr.insertCell();
      const s = get(r, c);
      if (!s) { td.className = "none"; td.textContent = "—"; continue; }
      td.title = [s.label, s.note].filter(Boolean).join("\n");
      fillCtl(mode, s, td, td, true);
      if (s.key in edits) td.classList.add("changed");
    }
  }
  wrap.appendChild(t);
  wrap.insertAdjacentHTML("beforeend", '<div class="mxnote">Rê chuột vào một ô để xem giải thích đầy đủ. Ô đã sửa có viền cam.</div>');
  return wrap;
}

function row(mode, s) {
  const div = document.createElement("div");
  const saved0 = s.key in edits ? edits[s.key] : mode.values[s.key];
  // dòng chữ có mã màu (bảng bên phải, Tab…): dàn hết bề ngang cho dễ đọc
  const colorLines = s.type === "lines" && s.style !== "tags" && (saved0 || []).some(v => /[&§][0-9a-fk-or#]/i.test(String(v)));
  const wide = WIDE.has(s.type) || colorLines || s.type === "list" || (s.type === "lines" && s.style === "tags");
  // chữ dài (câu thông báo…), danh sách nhiều dòng: rộng gấp đôi
  const long = !wide && (s.type === "lines" || s.type === "libitem" || ((s.type === "text" || !s.type) && String(saved0 ?? "").length > 34));
  // công tắc chữ ngắn (Bật/Tắt, Có/Không): tên và công tắc trên một dòng; chữ dài thì xếp dọc như thẻ thường
  const inline = isBool(s) && s.options.every(o => String(o.label).length <= 14);
  div.className = "row" + (wide ? " wide" : long ? " span2" : "") + (inline ? " bool" : "");
  const id = "f_" + s.key;
  const lab = document.createElement("div"); lab.className = "lab";
  const label = document.createElement("label"); label.htmlFor = id;
  highlight(label, s.label);
  const pill = document.createElement("span"); pill.className = "pill"; pill.textContent = "đã sửa";
  // giải thích dài (info: trong schema): nút i ngay sau tên (bấm không nhảy vào ô nhập, shell.js chặn)
  if (s.info) label.insertAdjacentHTML("beforeend", infoBtn(s.info, s.label));
  label.appendChild(pill);
  lab.appendChild(label);
  if (s.note) { const n = document.createElement("div"); n.className = "note"; highlight(n, s.note); lab.appendChild(n); }
  div.appendChild(lab);
  const ctl = document.createElement("div"); ctl.className = "ctl";
  fillCtl(mode, s, div, ctl, false);
  div.appendChild(ctl);
  if (s.key in edits) div.classList.add("changed");
  return div;
}

/** Ô nhập của một cài đặt vào ctl; holder là phần tử nhận lớp "changed" (thẻ hoặc ô bảng). compact: trong bảng (gợi ý khoảng số để ở title). */
function fillCtl(mode, s, holder, ctl, compact) {
  const div = holder;
  const id = "f_" + s.key;
  const saved = mode.values[s.key];
  const value = s.key in edits ? edits[s.key] : saved;
  let input;
  if (isBool(s)) {
    const on = s.options.find(o => o.value === true), off = s.options.find(o => o.value === false);
    input = document.createElement("label"); input.className = "switch";
    input.innerHTML = '<input type="checkbox"><span class="track"></span><span class="txt"></span>';
    const cb = input.querySelector("input"), txt = input.querySelector(".txt");
    cb.checked = value === true; txt.textContent = cb.checked ? on.label : off.label;
    cb.onchange = () => { txt.textContent = cb.checked ? on.label : off.label; change(mode, s, cb.checked, div); };
    cb.id = id;
    ctl.appendChild(input);
    return;
  }
  if (s.type === "select") {
    input = document.createElement("select");
    s.options.forEach((o, i) => {
      const opt = document.createElement("option");
      opt.value = i; opt.textContent = o.label;
      if (same(o.value, value)) opt.selected = true;
      input.appendChild(opt);
    });
    input.onchange = () => change(mode, s, s.options[input.value].value, div);
  } else if (s.type === "lines" && s.style === "tags") {
    input = tagsEditor(value || [], v => change(mode, s, v, div), {});
  } else if (s.type === "lines") {
    input = linesEditor(value || [], v => change(mode, s, v, div));
  } else if (s.type === "rewards") {
    input = rewardsEditor(value || [], v => change(mode, s, v, div));
  } else if (s.type === "shopitems") {
    input = shopItemsEditor(value || [], v => change(mode, s, v, div));
  } else if (s.type === "shoptitles") {
    input = shopTitlesEditor(value || [], v => change(mode, s, v, div));
  } else if (s.type === "fragtypes") {
    input = fragTypesEditor(value || {}, v => change(mode, s, v, div));
  } else if (s.type === "fragshop") {
    input = fragShopEditor(value || [], v => change(mode, s, v, div));
  } else if (s.type === "dishes") {
    input = dishesEditor(value || {}, v => change(mode, s, v, div));
  } else if (s.type === "workshop") {
    input = workshopEditor(value || {}, v => change(mode, s, v, div));
  } else if (s.type === "libitem") {
    input = document.createElement("div");
    const sum = document.createElement("div"); sum.className = "small"; sum.style.marginTop = "4px";
    input.append(libSelect(value || "", s.use || null, (v, init) => { libSummary(sum, v); if (!init && v) change(mode, s, v, div); }), sum);
  } else if (s.type === "spin") {
    input = spinEditor(value || [], v => change(mode, s, v, div));
  } else if (s.type === "kits") {
    input = kitsEditor(value || {}, v => change(mode, s, v, div));
  } else if (s.type === "quests") {
    input = questsEditor(value || {}, v => change(mode, s, v, div));
  } else if (s.type === "milestones") {
    input = milestonesEditor(value || {}, v => change(mode, s, v, div));
  } else if (s.type === "list") {
    input = tagsEditor(value || [], v => change(mode, s, v, div), { items: s.items });
  } else {
    input = document.createElement("input");
    if (s.type === "int" || s.type === "number") {
      input.type = "number"; input.step = s.type === "int" ? "1" : "any";
      if (s.min !== undefined) input.min = s.min;
      if (s.max !== undefined) input.max = s.max;
    } else if (s.type === "times") {
      input.placeholder = "vd 20:00,21:00 · trống = nghỉ"; input.title = "Giờ bắt đầu các phiên, cách nhau dấu phẩy. Để trống = ngày đó không có phiên.";
    }
    input.value = value ?? "";
    // chữ có mã màu: xem trước như trong game ngay dưới ô
    if (s.type === "text" || !s.type) {
      const pv = document.createElement("div"); pv.className = "mcline";
      const upd = () => { const t = String(input.value || ""); pv.hidden = !/[&§][0-9a-fk-or#]/i.test(t); if (!pv.hidden) pv.innerHTML = '<span class="mc">' + mcHtml(t) + "</span>"; };
      input.addEventListener("input", upd); upd();
      setTimeout(() => ctl.appendChild(pv));
    }
    input.oninput = () => {
      let v = input.value;
      if (s.type === "int") v = v === "" ? "" : parseInt(v, 10);
      if (s.type === "number") v = v === "" ? "" : parseFloat(v);
      change(mode, s, v, div);
    };
  }
  input.id = id;
  if (!ctl.contains(input)) ctl.appendChild(input);
  if ((s.type === "int" || s.type === "number") && (s.min !== undefined || s.max !== undefined)) {
    const range = "Trong khoảng " + (s.min ?? "…") + " – " + (s.max ?? "…");
    if (compact) input.title = range;
    else { const r = document.createElement("div"); r.className = "count"; r.textContent = range; ctl.appendChild(r); }
  }
}


function change(mode, s, v, div) {
  if (same(v, mode.values[s.key])) delete edits[s.key]; else edits[s.key] = v;
  div.classList.toggle("changed", s.key in edits);
  updateBar();
  renderCats(mode, catsOf(mode));
}

function updateBar() {
  const n = Object.keys(edits).length;
  $("save").disabled = n === 0;
  $("discard").disabled = n === 0;
  $("save").textContent = n ? `Lưu và áp dụng (${n})` : "Lưu và áp dụng";
  $("savebar").classList.toggle("dirty", n > 0);
  if (n && !$("status").dataset.keep) { $("status").className = "status"; $("status").textContent = `${n} mục đã sửa, chưa lưu.`; }
}

function showResult(res) {
  const st = $("status");
  st.className = "status " + (res.ok ? "ok" : "err");
  st.textContent = res.message;
  st.dataset.keep = "1"; setTimeout(() => delete st.dataset.keep, 4000);
  if (res.results && res.results.length) {
    const d = document.createElement("details");
    d.className = "results";
    d.innerHTML = "<summary>Kết quả lệnh</summary><pre></pre>";
    d.querySelector("pre").textContent = res.results.map(r => `> ${r.command}\n${r.output || "(không có phản hồi)"}`).join("\n\n");
    st.appendChild(d);
  }
}

async function post(path, body) {
  $("save").disabled = true; $("reapply").disabled = true; $("discard").disabled = true;
  $("status").className = "status"; $("status").textContent = "Đang lưu và áp dụng…";
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const res = await r.json();
    if (r.ok) { await load(); }
    showResult(res);
  } catch (e) {
    showResult({ ok: false, message: "Không gửi được: " + e });
  } finally {
    $("reapply").disabled = false; updateBar();
  }
}

$("save").onclick = () => post(`api/modes/${current}/save`, { values: edits });
$("discard").onclick = async () => { if (await ask("Bỏ mọi thay đổi chưa lưu?", { title: "Bỏ thay đổi", ok: "Bỏ thay đổi", danger: true })) { edits = {}; render(); $("status").className = "status"; $("status").textContent = "Đã bỏ thay đổi."; } };
$("reapply").onclick = async () => {
  if (await ask("Ghi lại toàn bộ cài đặt của chế độ này vào plugin và nạp lại?", { title: "Áp dụng lại tất cả", ok: "Áp dụng" })) post(`api/modes/${current}/apply-all`, {});
};
let qTimer = null;
$("q").oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(() => { query = $("q").value.trim(); render(); }, 150); };
window.addEventListener("beforeunload", (e) => { if (Object.keys(edits).length) { e.preventDefault(); e.returnValue = ""; } });

// ---- Danh sách ngắn (từ cấm, tên thế giới…): thẻ nhỏ, gõ rồi Enter để thêm, dán nhiều dòng/dấu phẩy cũng được
function tagsEditor(list, onChange, opts) {
  let vals = (list || []).map(String);
  const box = document.createElement("div"); box.className = "tg";
  box.innerHTML = '<div class="tg-top"><input type="search" class="tg-filter" placeholder="Lọc…"><span class="tg-n"></span><button type="button" class="tg-mode">Sửa dạng văn bản</button></div>'
    + '<div class="tg-chips"></div><textarea class="tg-text" hidden></textarea>';
  const chips = box.querySelector(".tg-chips"), filter = box.querySelector(".tg-filter"), n = box.querySelector(".tg-n");
  const text = box.querySelector(".tg-text"), modeBtn = box.querySelector(".tg-mode");
  const add = document.createElement("input"); add.className = "tg-in"; add.placeholder = opts.items ? "Thêm số… (Enter)" : "Thêm… (Enter để thêm)";
  const conv = (x) => opts.items === "int" ? parseInt(x, 10) : opts.items === "number" ? parseFloat(x) : x;
  const emit = () => { n.textContent = vals.length + " mục"; onChange(vals.map(conv)); };
  function draw() {
    const f = fold(filter.value.trim());
    chips.innerHTML = "";
    vals.forEach((v, i) => {
      if (f && !fold(v).includes(f)) return;
      const c = document.createElement("span"); c.className = "tg-chip"; c.dataset.v = v;
      c.innerHTML = '<span></span><button type="button" title="Bỏ">×</button>';
      c.firstChild.textContent = v;
      c.querySelector("button").onclick = () => { vals.splice(i, 1); draw(); emit(); };
      chips.appendChild(c);
    });
    if (f && !chips.children.length) { const e = document.createElement("span"); e.className = "tg-none"; e.textContent = "Không có mục nào khớp"; chips.appendChild(e); }
    chips.appendChild(add);
    box.querySelector(".tg-top").classList.toggle("few", vals.length < 12);
  }
  function push(raw) {
    let added = 0;
    for (let t of String(raw).split(/[\n,]/)) {
      t = t.trim(); if (!t) continue;
      if (opts.items && isNaN(conv(t))) continue;
      const dup = vals.findIndex(v => v.toLowerCase() === t.toLowerCase());
      if (dup >= 0) { const el = [...chips.children].find(c => c.dataset && c.dataset.v === vals[dup]); if (el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } continue; }
      vals.push(t); added++;
    }
    if (added) { filter.value = ""; draw(); emit(); }
    add.value = ""; add.focus();
  }
  add.onkeydown = (e) => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); push(add.value); } };
  add.onblur = () => { if (add.value.trim()) push(add.value); };
  add.onpaste = (e) => { const t = (e.clipboardData || window.clipboardData).getData("text"); if (/[\n,]/.test(t)) { e.preventDefault(); push(t); } };
  chips.onclick = (e) => { if (e.target === chips) add.focus(); };
  filter.oninput = draw;
  modeBtn.onclick = () => {
    const toText = text.hidden;
    if (toText) { text.value = vals.join("\n"); text.rows = Math.min(16, Math.max(5, vals.length + 1)); }
    text.hidden = !toText; chips.hidden = toText; filter.hidden = toText;
    modeBtn.textContent = toText ? "Xong, về dạng thẻ" : "Sửa dạng văn bản";
    if (!toText) draw();
  };
  text.oninput = () => { vals = text.value.split("\n").map(x => x.trim()).filter(Boolean); emit(); };
  draw(); n.textContent = vals.length + " mục";
  return box;
}

// ---- Nhiều dòng chữ (bảng bên phải, Tab, mẹo, mô tả…): mỗi dòng một ô, đổi thứ tự, xem trước màu như trong game
function linesEditor(list, onChange) {
  let vals = (list || []).map(String);
  const box = document.createElement("div"); box.className = "ln";
  box.innerHTML = '<div class="ln-rows"></div><textarea class="ln-text" hidden></textarea>'
    + '<div class="ln-bar"><button type="button" class="rw-add ln-add">+ Thêm dòng</button><span class="ln-n"></span><button type="button" class="tg-mode">Sửa dạng văn bản</button></div>'
    + '<div class="ln-prev" hidden><div class="ln-cap">Xem trước trong game</div><div class="mc-box"></div></div>';
  const rows = box.querySelector(".ln-rows"), text = box.querySelector(".ln-text"), prev = box.querySelector(".ln-prev");
  const modeBtn = box.querySelector(".tg-mode"), n = box.querySelector(".ln-n");
  const colored = () => vals.some(v => /[&§][0-9a-fk-or#]/i.test(v));
  function preview() {
    n.textContent = vals.length + " dòng";
    prev.hidden = !colored();
    if (!prev.hidden) prev.querySelector(".mc-box").innerHTML = vals.map(v => `<div class="ln">${v.trim() === "" || /^(&r)+$/i.test(v.trim()) ? "&nbsp;" : mcHtml(v)}</div>`).join("");
  }
  const emit = () => { preview(); onChange(vals.filter(v => v.trim() !== "" || colored())); };
  function draw(focus) {
    rows.innerHTML = "";
    vals.forEach((v, i) => {
      const r = document.createElement("div"); r.className = "ln-row";
      r.innerHTML = `<span class="ln-i">${i + 1}</span><input><span class="ln-act"><button type="button" title="Lên">↑</button><button type="button" title="Xuống">↓</button><button type="button" class="x" title="Bỏ dòng">×</button></span>`;
      const inp = r.querySelector("input"); inp.value = v;
      inp.oninput = () => { vals[i] = inp.value; emit(); };
      inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); vals.splice(i + 1, 0, ""); draw(i + 1); emit(); } };
      const [up, down, x] = r.querySelectorAll("button");
      up.disabled = i === 0; down.disabled = i === vals.length - 1;
      up.onclick = () => { [vals[i - 1], vals[i]] = [vals[i], vals[i - 1]]; draw(); emit(); };
      down.onclick = () => { [vals[i + 1], vals[i]] = [vals[i], vals[i + 1]]; draw(); emit(); };
      x.onclick = () => { vals.splice(i, 1); draw(); emit(); };
      rows.appendChild(r);
    });
    if (focus !== undefined && rows.children[focus]) rows.children[focus].querySelector("input").focus();
  }
  box.querySelector(".ln-add").onclick = () => { vals.push(""); draw(vals.length - 1); emit(); };
  modeBtn.onclick = () => {
    const toText = text.hidden;
    if (toText) { text.value = vals.join("\n"); text.rows = Math.min(16, Math.max(4, vals.length + 1)); }
    text.hidden = !toText; rows.hidden = toText; box.querySelector(".ln-add").hidden = toText;
    modeBtn.textContent = toText ? "Xong, về từng dòng" : "Sửa dạng văn bản";
    if (!toText) draw();
  };
  text.oninput = () => { vals = text.value.split("\n"); emit(); };
  draw(); preview();
  return box;
}

// ---- Ô chọn vật phẩm (có tìm kiếm tên Việt/Anh), danh sách lấy từ server
let MATS = [];
function matSearch(q) {
  const f = fold(q), out = [];
  for (const m of MATS) {
    const vn = vnMat(m);
    if (f && !fold(m + " " + prettyMat(m) + " " + (vn || "")).includes(f)) continue;
    out.push({ value: m, label: matLabel(m), sub: m, r: vn ? 0 : 1 });
  }
  return out.sort((a, b) => a.r - b.r).slice(0, 200);
}
function matPick(input, onPick) {

const libEsc = (t) => String(t ?? "").replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));

    return { label: o.label.value.trim(), cost, limit: parseInt(o.limit.value || "0", 10), rewards: o.rewards };
  }).filter(o => Object.keys(o.cost).length && o.rewards.length));
  const add = document.createElement("button"); add.type = "button"; add.className = "rw-add"; add.textContent = "+ Thêm món đổi";
  function addO(d) {
    const wrap = document.createElement("div"); wrap.className = "ms";
    const head = document.createElement("div"); head.className = "fs-head";
    head.innerHTML = '<input placeholder="Tên món, vd 16 kim cương"><input placeholder="Giá: loại số, vd lamnguy 40 · cá: ca:rare 3 (common, rare, epic, legendary)"><input type="number" min="0" max="1000" title="Mỗi người đổi tối đa (0 = không giới hạn)"><button type="button" class="x" title="Bỏ">×</button>';
    const [label, cost, limit] = head.querySelectorAll("input");
    const o = { label, cost, limit, rewards: (d.rewards || []).slice() };
    label.value = d.label || ""; limit.value = d.limit || 0;
    cost.value = Object.entries(d.cost || {}).map(([k, n]) => k + " " + n).join(", ");
    for (const el of [label, cost, limit]) el.oninput = emit;
    head.querySelector(".x").onclick = () => { os.splice(os.indexOf(o), 1); wrap.remove(); emit(); };
    wrap.append(head, rewardsEditor(o.rewards, v => { o.rewards = v; emit(); }));
    os.push(o); box.insertBefore(wrap, add);
  }
  box.appendChild(add);
  add.onclick = () => { addO({ label: "", cost: {}, limit: 0, rewards: ["xu 1000"] }); emit(); };
  for (const d of value || []) addO(d || {});
  return box;
}


// ---- Món ăn ra trận (/nauan): {mã thư viện: {need {VẬT_LIỆU|ca:<độ hiếm>: số}}}
const DISH_EFFECTS = [["REGENERATION", "Hồi máu"], ["RESISTANCE", "Kháng sát thương"], ["ABSORPTION", "Máu ảo"], ["STRENGTH", "Sức mạnh"],
  ["SPEED", "Nhanh nhẹn"], ["FIRE_RESISTANCE", "Kháng lửa"], ["NIGHT_VISION", "Nhìn đêm"], ["WATER_BREATHING", "Thở dưới nước"],
  ["JUMP_BOOST", "Nhảy cao"], ["HASTE", "Đào nhanh"], ["SATURATION", "No bụng"], ["HEALTH_BOOST", "Thêm máu tối đa"]];
const DISH_FISH = [["ca:common", "Cá Thường"], ["ca:rare", "Cá Hiếm"], ["ca:epic", "Cá Quý"], ["ca:legendary", "Cá Huyền thoại"]];
function dishesEditor(value, onChange) {
  // món = món thư viện đồ (công dụng Món ăn: tên, vật phẩm, hiệu ứng ở thư viện); ở đây chỉ nguyên liệu
  const box = document.createElement("div"); box.className = "rw";
  const ds = [];
  const opt = (list, cur) => list.map(([v, t]) => `<option value="${v}"${v === cur ? " selected" : ""}>${t}</option>`).join("");
  const emit = () => {
    const out = {};
    for (const d of ds) {
      if (!d.sel.value) continue;
      const need = {};
      for (const r of d.needs) {
        const k = r.kind.value === "vat" ? String(r.mat.value || "").trim().toUpperCase() : r.kind.value;
        const n = parseInt(r.qty.value || "0", 10);
        if (k && n > 0) need[k] = (need[k] || 0) + n;
      }
      out[d.sel.value] = { need };
    }
    onChange(out);
  };
  const add = document.createElement("button"); add.type = "button"; add.className = "rw-add"; add.textContent = "+ Thêm món";
  function addDish(id, d) {
    const wrap = document.createElement("div"); wrap.className = "ms"; wrap.style.width = "100%"; wrap.style.boxSizing = "border-box";
    const head = document.createElement("div"); head.className = "fs-head";
    head.style.cssText = "display:grid;grid-template-columns:minmax(200px,1fr) 32px;gap:8px;align-items:center";
    head.innerHTML = `<span></span><button type="button" class="x" title="Bỏ món">×</button>`;
    const sum = document.createElement("div"); sum.className = "small"; sum.style.margin = "4px 0 8px";
    const o = { sel: null, needs: [] };
    o.sel = libSelect(id || "", "mon-an", (v, init) => { libSummary(sum, v); if (!init) emit(); });
    head.firstChild.replaceWith(o.sel);
    const needBox = document.createElement("div"); needBox.className = "rw";
    const needT = document.createElement("div"); needT.className = "small"; needT.textContent = "Nguyên liệu (cần để nấu):";
    const addNeed = document.createElement("button"); addNeed.type = "button"; addNeed.className = "rw-add"; addNeed.textContent = "+ Nguyên liệu";
    function needRow(k, n) {
      const row = document.createElement("div"); row.className = "rw-row"; row.style.gridTemplateColumns = "150px minmax(160px,1fr) 90px 32px";
      const isFish = /^ca:/i.test(k || "");
      row.innerHTML = `<select><option value="vat">Vật phẩm</option>${opt(DISH_FISH, isFish ? k.toLowerCase() : "")}</select><span></span><input type="number" min="1" max="640" title="Số lượng"><button type="button" class="x" title="Bỏ">×</button>`;
      const [kind, mid, qty, x] = row.children;
      const mInput = document.createElement("input"); mInput.placeholder = "Chọn vật phẩm…"; mInput.value = isFish ? "" : (k || "");
      const r = { kind, mat: mInput, qty };
      kind.value = isFish ? k.toLowerCase() : "vat"; qty.value = n || 1;
      const sync = () => { mid.innerHTML = ""; if (kind.value === "vat") { mid.appendChild(mInput); matPick(mInput, emit); } };
      sync();
      kind.onchange = () => { sync(); emit(); }; mInput.oninput = emit; qty.oninput = emit;
      x.onclick = () => { o.needs.splice(o.needs.indexOf(r), 1); row.remove(); emit(); };
      o.needs.push(r); needBox.insertBefore(row, addNeed);
    }
    needBox.append(needT, addNeed);
    addNeed.onclick = () => { needRow("WHEAT", 1); emit(); };
    for (const [k, n] of Object.entries(d.need || {})) needRow(k, n);
    head.querySelector(".x").onclick = () => { ds.splice(ds.indexOf(o), 1); wrap.remove(); emit(); };
    wrap.append(head, sum, needBox);
    ds.push(o); box.insertBefore(wrap, add);
  }
  box.appendChild(add);
  add.onclick = () => { addDish("", { need: { WHEAT: 3 } }); };
  for (const [id, d] of Object.entries(value || {})) addDish(id, d || {});
  return box;
}

// ---- Xưởng chế tạo: {mã thư viện: {cost, grid[9], tinh-luyen{}, enabled}}
function workshopEditor(value, onChange) {
  // món = món thư viện đồ (công dụng Kỹ năng đặc biệt: tên, phù phép, kỹ năng, độ bền, hạn ở thư viện); ở đây chỉ công thức
  const box = document.createElement("div"); box.className = "rw";
  const items = [];
  const emit = () => {
    const out = {};
    for (const o of items) {
      if (!o.sel.value) continue;
      const d = {};
      if (!o.on.checked) d.enabled = false;
      d.cost = +o.cost.value || 0;
      d.grid = o.cells.map(c => c.m.value.trim() ? c.m.value.trim().toUpperCase() + " " + (+c.n.value || 1) : "");
      const tl = {};
      for (const part of o.tl.value.split(",")) {
        const m = part.trim().toLowerCase().match(/^([a-z0-9_]+)(?:[:\s]+(\d+))?$/);
        if (m) tl[m[1]] = +(m[2] || 1);
      }
      if (Object.keys(tl).length) d["tinh-luyen"] = tl;
      out[o.sel.value] = d;
    }
    onChange(out);
  };
  const add = document.createElement("button"); add.type = "button"; add.className = "rw-add"; add.textContent = "+ Thêm món";
  function addItem(id, d) {
    const wrap = document.createElement("div"); wrap.className = "ms";
    wrap.innerHTML = `
      <div class="ws-row" style="grid-template-columns:minmax(220px,1.6fr) minmax(120px,.7fr) 70px 32px">
        <label>Món (Thư viện đồ)<span class="i-sel"></span></label>
        <label>Giá (xu)<input type="number" min="0" class="i-cost"></label>
        <label>Bán<input type="checkbox" class="i-on"></label>
        <button type="button" class="x" title="Bỏ món">×</button></div>
      <div class="small i-sum" style="margin:-2px 0 8px"></div>
      <div class="small" style="margin:4px 0">Bàn chế 3×3 (vật phẩm + số lượng, để trống = ô trống):</div>
      <div class="ws-grid"></div>
      <div class="ws-row" style="grid-template-columns:1fr;margin-top:8px">
        <label>Món Tinh Luyện cần thêm (mã:số, cách nhau dấu phẩy; xem /tinhluyen ds)<input class="i-tl" placeholder="vd sat:1, kimcuong:1 (để trống = không cần)"></label></div>`;
    const q = c => wrap.querySelector(c);
    const o = { on: q(".i-on"), cost: q(".i-cost"), tl: q(".i-tl"), cells: [], sel: null };
    o.sel = libSelect(id || "", "ky-nang", (v, init) => { libSummary(q(".i-sum"), v); if (!init) emit(); });
    q(".i-sel").replaceWith(o.sel);
    o.on.checked = d.enabled !== false; o.cost.value = d.cost || 0;
    o.tl.value = Object.entries(d["tinh-luyen"] || {}).map(([k, v]) => k + ":" + v).join(", ");
    const gridBox = q(".ws-grid");
    const grid = (d.grid && d.grid.length) ? d.grid : Object.entries(d.ingredients || {}).map(([k, v]) => k + " " + v);
    for (let k = 0; k < 9; k++) {
      const cell = document.createElement("div"); cell.className = "ws-cell";
      cell.innerHTML = '<input placeholder="trống"><input type="number" min="1" max="640" placeholder="số">';
      const [m, n] = cell.children;
      const a = String(grid[k] || "").trim().split(/[\s:]+/);
      m.value = a[0] || ""; n.value = a[0] ? (a[1] || 1) : "";
      matPick(m, emit); m.oninput = emit; n.oninput = emit;
      o.cells.push({ m, n }); gridBox.appendChild(cell);
    }
    for (const el of [o.cost, o.tl]) el.oninput = emit;
    o.on.onchange = emit;
    q(".x").onclick = () => { items.splice(items.indexOf(o), 1); wrap.remove(); emit(); };
    items.push(o); box.insertBefore(wrap, add);
  }
  box.appendChild(add);
  add.onclick = () => { addItem("", { cost: 5000, grid: ["DIAMOND 3", "", "", "", "STICK 2"] }); };
  for (const [id, d] of Object.entries(value || {})) addItem(id, d || {});
  return box;
}

// ---- Cửa hàng Kinh Đô: món [{material|library, amount, price}] và danh hiệu [{id, text, price}]
function shopItemsEditor(value, onChange) {
  const box = document.createElement("div"); box.className = "rw";
  const rows = [];
  const emit = () => onChange(rows.map(r => r.val()).filter(Boolean));
  const add = document.createElement("button"); add.type = "button"; add.className = "rw-add"; add.textContent = "+ Thêm món";
  function addRow(d) {
    const row = document.createElement("div"); row.className = "sh-row";
    row.innerHTML = '<select><option value="vat">Đồ thường</option><option value="do">Đồ thư viện</option></select><span></span><input type="number" min="1" max="2304" title="Số lượng mỗi lần mua"><input type="number" min="1" max="100000000" title="Giá (xu)"><button type="button" class="x" title="Bỏ">×</button>';
    const [src, mid, amt, price, x] = [row.children[0], row.children[1], row.children[2], row.children[3], row.children[4]];
    let main = null;
    function build(init) {
      mid.innerHTML = "";
      if (src.value === "do") {
        main = document.createElement("select"); main.innerHTML = '<option value="">(đang tải…)</option>';
        const cur = init ? (d.library || "") : "";
        lib().then(t => {
          const items = t.items || [];
          main.innerHTML = items.map(it => '<option value="' + it.id + '">' + it.id + (it.ten_goi && it.ten_goi !== it.id ? " · " + String(it.ten_goi).replace(/[<>&"]/g, "") : "") + "</option>").join("")
            || '<option value="">(thư viện trống)</option>';
          if (cur) { if (!items.some(it => it.id === cur)) main.insertAdjacentHTML("afterbegin", '<option value="' + cur + '">' + cur + " (không còn!)</option>"); main.value = cur; }
          emit();
        });
      } else {
        main = document.createElement("input"); main.placeholder = "Chọn vật phẩm…"; main.value = init ? (d.material || "") : "";
      }
      main.oninput = main.onchange = emit; mid.appendChild(main);
      if (src.value !== "do") matPick(main, emit);
    }
    src.value = d.library ? "do" : "vat"; build(true);
    amt.value = d.amount || 1; price.value = d.price || 100;
    src.onchange = () => { build(false); emit(); };
    amt.oninput = price.oninput = emit;
    const r = { val() {
      const v = String(main.value || "").trim(); if (!v) return null;
      const o = { amount: parseInt(amt.value || "1", 10), price: parseFloat(price.value || "0") };
      if (src.value === "do") o.library = v; else o.material = v.toUpperCase();
      return o;
    } };
    x.onclick = () => { rows.splice(rows.indexOf(r), 1); row.remove(); emit(); };
    rows.push(r); box.insertBefore(row, add);
  }
  box.appendChild(add);
  add.onclick = () => { addRow({ material: "", amount: 16, price: 100 }); emit(); };
  for (const d of value || []) addRow(d || {});
  if (!document.getElementById("rw-mats")) rewardsEditor([], () => {});
  return box;
}
function shopTitlesEditor(value, onChange) {
  const box = document.createElement("div"); box.className = "rw";

  const add = document.createElement("button"); add.type = "button"; add.className = "rw-add"; add.textContent = "+ Thêm danh hiệu";
  function addRow(d) {
    const row = document.createElement("div"); row.className = "sh-row";
    row.innerHTML = '<input placeholder="mã, vd phuthuong"><input placeholder="&6[Phú Thương]"><input type="number" min="1" title="Giá (xu)" style="grid-column: span 2"><button type="button" class="x" title="Bỏ">×</button>';
    const [id, text, price, x] = row.children;
    id.value = d.id || ""; text.value = d.text || ""; price.value = d.price || 1000;
    const r = { id, text, price };

    x.onclick = () => { rows.splice(rows.indexOf(r), 1); row.remove(); emit(); };

  }

  add.onclick = () => { addRow({}); emit(); };
  for (const d of value || []) addRow(d || {});
  return box;
}
