<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuckyMoMo · Role</title>
<link rel="stylesheet" href="ui.css">
<style>
  main { }
  .rl { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 22px; align-items: start; }
  /* danh sách role bên trái */
  .rl-list { position: sticky; top: 18px; padding: 8px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 36px); overflow-y: auto; }
  .rl-list .sec { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 12px 10px 6px; }
  .rl-list .sec:first-child { padding-top: 6px; }
  .ri { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); padding: 8px 10px; border-radius: 9px; cursor: pointer; }
  .ri:hover { background: var(--chip); }
  .ri.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .ri .t { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .ri .t b { font-size: 14.5px; font-weight: 600; }
  .ri .t small { color: var(--muted); font-size: 12.5px; }
  .ri .mc { font-size: 12px; padding: 1px 7px; flex: none; }
  /* chi tiết */
  .rd { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .rd .card { padding: 20px 22px; }
  .rd h2 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .rd .hint { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }
  .hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .hero .mc { font-size: 20px; padding: 8px 16px; border-radius: 10px; }
  .hero h1 { font-size: 22px; margin: 0 0 6px; }
  .hero .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .hero .badge a { color: inherit; cursor: pointer; text-decoration: underline dotted; }
  .warnbox { margin-top: 14px; background: rgba(178, 106, 0, .1); color: var(--warn); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; }
  @media (prefers-color-scheme: dark) { .warnbox { color: #f0b35a; } }
  /* thành viên */
  .members { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .mem { display: inline-flex; align-items: center; gap: 8px; background: var(--chip); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 14px; }
  .mem .exp { color: var(--muted); font-size: 12.5px; }
  .mem .exp.soon { color: var(--err); }
  .x { border: 0; background: transparent; color: var(--muted); cursor: pointer; width: 22px; height: 22px; border-radius: 50%; font-size: 15px; line-height: 1; display: inline-grid; place-items: center; }
  .x:hover { background: rgba(217, 48, 37, .12); color: var(--err); }
  .empty { color: var(--muted); font-size: 14px; margin-top: 12px; }
  .addm { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line-2); }
  .addm.no-months { grid-template-columns: minmax(0, 1fr) auto; }
  /* quyền */
  .ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 13.5px; }
  .seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
  .tools input[type=search] { flex: 1; min-width: 180px; }
  .tools .switch .txt { font-size: 13.5px; color: var(--muted); }
  .sum { display: flex; gap: 6px; flex-wrap: wrap; }
  .pcats { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; margin-top: 16px; }
  .pcat { border: 1px solid var(--line); border-radius: 10px; background: var(--card-2); overflow: hidden; }
  .pcat h3 { font-size: 14px; margin: 0; padding: 10px 14px; display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); }
  .pcat h3 .badge { font-weight: 500; }
  .pr { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: start; padding: 10px 14px; border-top: 1px solid var(--line-2); cursor: pointer; }
  .pr:first-of-type { border-top: 0; }
  .pr:hover { background: var(--chip); }
  .pr .switch { grid-row: span 2; margin-top: 1px; }
  .pr .lb { font-size: 14px; }
  .pr .nd { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pr code { font-size: 11.5px; color: var(--muted); }
  .pr .badge { font-size: 11px; padding: 0 7px; }
  .badge.inh { background: rgba(30, 142, 62, .12); color: var(--ok); }
  .badge.deny { background: rgba(217, 48, 37, .12); color: var(--err); }
  .pr.busy { opacity: .5; pointer-events: none; }
  .pr.via { cursor: default; }
  .preset { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .badge.srv { border: 0; cursor: pointer; background: rgba(26, 115, 232, .13); color: #4c8df6; font: inherit; font-size: 11px; padding: 0 7px; }
  .badge.srv:hover { text-decoration: underline; }
  .pr.via .switch { opacity: .55; }
  .others { margin-top: 18px; }
  .others h3 { font-size: 14px; margin: 0 0 8px; }
  .others .mem code { font-size: 12.5px; }
  .addp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin-top: 12px; }
  .noresult { color: var(--muted); padding: 20px; text-align: center; grid-column: 1 / -1; }
  @media (max-width: 1000px) {
    .rl { grid-template-columns: minmax(0, 1fr); }
    .rl-list { position: static; flex-direction: row; overflow-x: auto; max-height: none; scrollbar-width: none; }
    .rl-list .sec { display: none; }
    .ri { width: auto; flex: none; }
    .ri .t small { display: none; }
    .pcats { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) { .addm, .addm.no-months { grid-template-columns: 1fr; } .rd .card { padding: 16px; } }
</style>
</head>
<body data-dozzle="__DOZZLE_URL__" data-title="Role & rank" data-sub="Chọn một role bên trái: xem ai đang giữ, thêm/gỡ người, bật/tắt quyền. Mọi thay đổi có hiệu lực ngay toàn mạng.">
<script src="shell.js"></script>
<main>
  <div class="rl">
    <nav class="card rl-list" id="list"><div class="empty">Đang tải…</div></nav>
    <div class="rd" id="detail"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const NAMES = { default: "Dân (mặc định)", builder: "Builder", helper: "Helper", mod: "Mod", quanly: "Manager", admin: "Admin",
  namtuoc: "Nam Tước", tutuoc: "Tử Tước", batuoc: "Bá Tước", hautuoc: "Hầu Tước", congtuoc: "Công Tước" };
const KIND = { staff: "Role chức vụ", donate: "Rank donate", default: "Nhóm mặc định" };
const name = (g) => NAMES[g] || g;
let data = null, sel = decodeURIComponent(location.hash.slice(1)) || "", server = "global", filter = "", onlyOn = false;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fold = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").toLowerCase();
const prefixText = (g) => (g.prefix || "").trim() || "&7(không prefix)";
// người đang xem làm được gì (staff đăng nhập bằng tài khoản game bị giới hạn; máy chủ vẫn kiểm tra lại)
let me = { full: true, role: true, quyen: true, khoa: new Set() };
const canMembers = (g) => g.kind !== "default" && (me.full || (me.role && !me.khoa.has(g.name)));
const canPerms = (g) => me.full || (me.quyen && !me.khoa.has(g.name));

// chỉ hiện role/rank người đang xem cấp/gỡ người hoặc sửa quyền được
const visible = () => data.groups.filter(g => canMembers(g) || canPerms(g));
function render() {
  if (!visible().length) { $("list").innerHTML = '<p class="empty">Tài khoản của bạn không quản lý được role nào.</p>'; $("detail").innerHTML = ""; return; }
  if (!visible().some(g => g.name === sel)) sel = visible()[0].name;
  renderList(); renderDetail();
}
function renderList() {
  let h = "";
  for (const [kind, title] of [["staff", "Role chức vụ"], ["donate", "Rank donate"]]) {
    h += `<div class="sec">${title}</div>`;
    const gs = visible().filter(g => kind === "donate" ? g.kind === "donate" : g.kind !== "donate");
    if (!gs.length) { h = h.slice(0, h.lastIndexOf('<div class="sec">')); continue; }
    for (const g of gs) {
      const own = g.perms.filter(p => p.value).length;
      const who = g.kind === "default" ? "mọi người chơi" : (g.count ? g.count + " người" : "chưa có ai");
      h += `<button class="ri${g.name === sel ? " on" : ""}" data-g="${esc(g.name)}"><span class="t"><b>${esc(name(g.name))}</b><small>${who} · ${own} quyền</small></span><span class="mc">${mcHtml(prefixText(g))}</span></button>`;
    }
  }
  $("list").innerHTML = h;
  $("list").querySelectorAll(".ri").forEach(b => b.onclick = () => { sel = b.dataset.g; filter = ""; history.replaceState(null, "", "#" + sel); render(); if (innerWidth < 1000) $("detail").scrollIntoView({ behavior: "smooth" }); });
}

function expiry(m) {
  if (!m.expiry) return "";
  const days = Math.ceil((m.expiry * 1000 - Date.now()) / 86400000);
  return `<span class="exp${days <= 3 ? " soon" : ""}" title="Hết hạn ${new Date(m.expiry * 1000).toLocaleString("vi-VN")}">còn ${days} ngày</span>`;
}
// quyền kế thừa từ các nhóm cha (đệ quy): node -> tên nhóm cho quyền
function inherited(g, seen = new Set()) {
  const out = {};
  for (const pn of g.parents) {
    if (seen.has(pn)) continue; seen.add(pn);
    const pg = data.groups.find(x => x.name === pn); if (!pg) continue;
    for (const p of pg.perms) if (p.value && (p.server === "global" || p.server === server) && !(p.node in out)) out[p.node] = pn;
    for (const [k, v] of Object.entries(inherited(pg, seen))) if (!(k in out)) out[k] = v;
  }
  return out;
}

function renderDetail() {
  const g = data.groups.find(x => x.name === sel);
  const d = $("detail");
  const isDonate = g.kind === "donate";
  // --- đầu trang role
  const vis = new Set(visible().map(x => x.name));
  const parents = g.parents.map(p => vis.has(p) ? `<a data-go="${esc(p)}">${esc(name(p))}</a>` : esc(name(p))).join(", ");
  let h = `<section class="card"><div class="hero"><span class="mc">${mcHtml(prefixText(g))}</span><div><h1>${esc(name(g.name))}</h1><div class="badges">
      <span class="badge accent">${KIND[g.kind]}</span><span class="badge">nhóm <code>${esc(g.name)}</code></span><span class="badge" title="Số lớn hơn = ưu tiên hơn (prefix, quyền)">weight ${g.weight}</span>
      ${parents ? `<span class="badge">kế thừa: ${parents}</span>` : ""}</div></div></div>
    ${isDonate ? '<div class="warnbox">Rank donate chỉ được có quyền <b>trang trí</b>. Cấp lợi thế khi chơi (bay, kit, đồ mạnh…) là pay-to-win, vi phạm luật Mojang.</div>' : ""}
    ${!g.exists ? `<div class="warnbox" style="background:rgba(217,48,37,.12);color:var(--err)">Role này <b>chưa có trong LuckPerms</b>${g.preset ? ": bấm nút bên dưới để tạo kèm bộ quyền khuyên dùng." : "."}</div>` : ""}
    ${g.preset && me.full ? `<div class="preset"><button class="primary" id="preset">${g.exists ? "Áp bộ quyền khuyên dùng" : "Tạo role + bộ quyền khuyên dùng"}</button>
      <span class="hint">Chạy <code>tools/${g.name === "quanly" ? "quanly" : "builder"}-role.cmds</code> (chỉ Admin). Chạy lại được: bật lại quyền trong file, không gỡ quyền bạn tự thêm.</span></div>` : ""}
    <p class="hint">Sửa prefix: trang Cài đặt › Toàn mạng › ${isDonate ? "Rank donate" : "Role"}.</p>
    ${(g.prefixes || []).length > 1 ? `<p class="hint">⚠ Role này đang có ${g.prefixes.length} prefix trong LuckPerms (${g.prefixes.map(p => esc(p.trim())).join(" | ")}); game hiện cái priority cao nhất. Lưu lại prefix ở Cài đặt sẽ xoá hết và đặt lại một cái.</p>` : ""}</section>`;
  // --- thành viên
  h += `<section class="card"><h2>👥 Thành viên ${g.kind !== "default" ? `<span class="badge">${g.count}</span>` : ""}</h2>`;
  const cm = canMembers(g), cp = canPerms(g);
  if (g.kind === "default") {
    h += `<p class="hint">Mọi người chơi đều thuộc nhóm này (${g.count} người đã từng vào). Không cần thêm tay.</p>`;
  } else {
    h += g.members.length ? `<div class="members">${g.members.map(m => `<span class="mem"><b>${esc(m.name)}</b>${expiry(m)}${m.server !== "global" ? `<span class="exp">chỉ ${esc(m.server)}</span>` : ""}${cm ? `<button class="x" title="Gỡ ${esc(m.name)} khỏi ${esc(name(g.name))}" data-rm="${esc(m.name)}">×</button>` : ""}</span>`).join("")}</div>`
      : `<p class="empty">Chưa có ai giữ ${isDonate ? "rank" : "role"} này.</p>`;
    if (cm) h += `<div class="addm${isDonate ? "" : " no-months"}"><input id="player" placeholder="Tên người chơi (Bedrock có dấu chấm đầu, vd .griim7833)" autocomplete="off">
      ${isDonate ? `<select id="months">${[1, 2, 3, 6, 12].map(n => `<option value="${n}">${n} tháng</option>`).join("")}</select>` : ""}
      <button class="primary" id="give">Thêm vào ${esc(name(g.name))}</button></div>
      <p class="hint">${isDonate ? "1 tháng = 30 ngày. Cấp tiếp cùng bậc thì cộng dồn; đổi bậc thì bậc cũ bị bỏ." : "Role chức vụ giữ vĩnh viễn đến khi gỡ."} Người chơi phải từng vào server.</p>`;
  }
  h += `</section>`;
  // --- quyền (không có quyền sửa thì ẩn cả phần)
  if (!cp) { d.innerHTML = h; bindTop(g); return; }
  const own = (node) => g.perms.find(p => p.node === node && p.server === server);
  const inh = inherited(g);
  const cats = data.catalog.filter(c => isDonate ? (c.donate || c.title.startsWith("Chat")) : !c.donate);
  const nOn = g.perms.filter(p => p.value && p.server === server).length;
  const nOther = g.perms.filter(p => p.value && p.server !== server).length;
  h += `<section class="card"><div class="ph"><div><h2>🔑 Quyền</h2><p class="hint">Bật công tắc là cấp quyền ngay. Quyền <span class="badge inh">có sẵn</span> đến từ role cha, không cần bật lại.</p></div>
      <div class="sum"><span class="badge accent">${nOn} quyền riêng bật ở ${server === "global" ? "toàn mạng" : esc(server)}</span>${nOther ? `<span class="badge">+${nOther} ở server khác</span>` : ""}<span class="badge inh">${Object.keys(inh).length} có sẵn từ role cha</span></div></div>
    <div class="tools"><div class="seg" title="Quyền áp dụng ở đâu">${data.servers.map(sv => `<button data-sv="${esc(sv)}" class="${sv === server ? "on" : ""}">${sv === "global" ? "Toàn mạng" : esc(sv)}</button>`).join("")}</div>
      <input type="search" id="pf" placeholder="Lọc quyền… (vd bay, kick, worldedit)" value="${esc(filter)}">
      <label class="switch"><input type="checkbox" id="onlyon" ${onlyOn ? "checked" : ""}><span class="track"></span><span class="txt">Chỉ quyền đang có</span></label></div>`;
  if (g.perms.some(p => p.node === "*" && p.value)) h += `<div class="warnbox">Role này có quyền <code>*</code> (tất cả quyền): mọi công tắc bên dưới đều đang có hiệu lực (hiện bật mờ).</div>`;
  h += `<p class="hint">Lệnh của EssentialsX (/fly, /kick, /ban, /tp, /gamemode…) chỉ có ở <b>Bang Hội Chiến</b> và <b>Practice</b>. Sảnh không cài Essentials nên gõ ở sảnh sẽ báo "Unknown command" dù có quyền.</p>`;
  h += `<div class="pcats" id="pcats"></div>`;
  const known = new Set(cats.flatMap(c => c.perms.map(p => p[0])));
  // quyền trong danh mục mà bật ở server khác: hiện thành nhãn "bật ở …" ngay trên công tắc, không lặp ở đây
  const others = g.perms.filter(p => !known.has(p.node));
  // rank donate chỉ được quyền TRANG TRÍ (luật Mojang): quyền ngoài danh mục trang trí/chat hiện cảnh báo đỏ
  const p2w = isDonate ? others.filter(p => p.value) : [];
  if (p2w.length) h += `<div class="warnbox" style="background:rgba(217,48,37,.12);color:var(--err)">⚠️ Rank donate đang có quyền không phải trang trí: ${p2w.map(p => `<code>${esc(p.node)}</code>`).join(", ")}.
    Bán rank kèm lợi thế chơi (bay, đồ, tiền…) là <b>trái luật Mojang</b> (EULA), có thể bị chặn server. Bấm × bên dưới để gỡ.</div>`;
  h += `<div class="others"><h3>Quyền khác của role này <span class="hint" style="font-weight:400">(không có trong danh mục, mọi server)</span></h3>${others.length ? `<div class="members" style="margin-top:0">${others.map(p => `<span class="mem">${p.value ? "" : '<span class="badge deny">CẤM</span>'}<code>${esc(p.node)}</code>${p.server !== "global" ? `<span class="exp">@${esc(p.server)}</span>` : ""}<button class="x" title="Gỡ quyền" data-unset="${esc(p.node)}" data-srv="${esc(p.server)}">×</button></span>`).join("")}</div>` : '<p class="hint" style="margin:0">Không có.</p>'}
    <div class="addp"><input id="newp" placeholder="Thêm quyền theo tên, vd essentials.workbench (áp dụng: ${server === "global" ? "toàn mạng" : esc(server)})"><button class="ghost" id="addp">Thêm quyền</button></div></div></section>`;
  d.innerHTML = h;
  bindTop(g);
  d.querySelectorAll("[data-sv]").forEach(b => b.onclick = () => { server = b.dataset.sv; renderDetail(); });
  $("pf").oninput = () => { filter = $("pf").value; renderPerms(g, cats, own, inh); };
  $("onlyon").onchange = () => { onlyOn = $("onlyon").checked; renderPerms(g, cats, own, inh); };
  d.querySelectorAll("[data-unset]").forEach(b => b.onclick = async () => { if (await ask(`Gỡ quyền ${b.dataset.unset}${b.dataset.srv !== "global" ? " (ở " + b.dataset.srv + ")" : ""} khỏi ${name(g.name)}?`, { title: "Gỡ quyền", ok: "Gỡ quyền", danger: true })) post({ action: "perm_unset", group: g.name, node: b.dataset.unset, server: b.dataset.srv }); });
  const addp = () => { const v = $("newp").value.trim(); if (v) post({ action: "perm_set", group: g.name, node: v, server }); };
  $("addp").onclick = addp; $("newp").onkeydown = (e) => { if (e.key === "Enter") addp(); };
  renderPerms(g, cats, own, inh);
}

// nút ở đầu trang role + phần thành viên
function bindTop(g) {
  const d = $("detail");
  if ($("preset")) $("preset").onclick = async () => {
    if (await ask(`${g.exists ? "Áp lại" : "Tạo role và áp"} bộ quyền khuyên dùng cho ${name(g.name)}? Người đang giữ role nhận quyền mới ngay.`, { title: "Bộ quyền khuyên dùng", ok: "Chạy" }))
      post({ action: "preset", group: g.name });
  };
  d.querySelectorAll("[data-go]").forEach(a => a.onclick = () => { sel = a.dataset.go; history.replaceState(null, "", "#" + sel); render(); });
  d.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => { if (await ask(`Gỡ ${name(g.name)} của ${b.dataset.rm}? Người này nhận tin trong game (nếu đang online).`, { title: "Gỡ role", ok: "Gỡ", danger: true })) post({ action: "remove", player: b.dataset.rm, group: g.name }); });
  if ($("give")) {
    const give = () => { const p = $("player").value.trim(); if (!p) return $("player").focus(); post({ action: "add", player: p, group: g.name, months: $("months") ? parseInt($("months").value, 10) : 1 }); };
    $("give").onclick = give; $("player").onkeydown = (e) => { if (e.key === "Enter") give(); };
  }
}

function renderPerms(g, cats, own, inh) {
  const q = fold(filter.trim());
  const so = own("*"), star = (so && so.value) || inh["*"];
  let h = "";
  for (const c of cats) {
    const rows = c.perms.filter(([node, label]) => {
      if (q && !fold(label + " " + node).includes(q)) return false;
      const o = own(node);
      return !onlyOn || (o && o.value) || inh[node] || star || (server !== "global" && g.perms.some(p => p.node === node && p.server === "global" && p.value));
    });
    if (!rows.length) continue;
    const on = c.perms.filter(([node]) => { const o = own(node); return (o && o.value) || inh[node] || star ||
      (server !== "global" && g.perms.some(p => p.node === node && p.server === "global" && p.value)); }).length;
    h += `<div class="pcat"><h3><span>${esc(c.title)}</span><span class="badge">${on}/${c.perms.length}</span></h3>`;
    for (const [node, label] of rows) {
      const o = own(node), from = inh[node];
      // đang xem 1 server: quyền bật "toàn mạng" cũng có hiệu lực ở đây
      const glob = server !== "global" && g.perms.find(p => p.node === node && p.server === "global" && p.value);
      // có sẵn (kế thừa từ role cha, qua *, hoặc bật toàn mạng): công tắc hiện BẬT nhưng khoá, khỏi tưởng role không có quyền
      const via = !o && (from || star || glob);
      h += `<label class="pr${via ? " via" : ""}" ${via ? `title="Đã có ${from ? "từ " + esc(name(from)) : star ? "qua quyền *" : "vì bật toàn mạng"}, không cần bật riêng"` : ""}><span class="switch"><input type="checkbox" data-node="${esc(node)}" ${(o && o.value) || via ? "checked" : ""} ${via ? "disabled" : ""}><span class="track"></span></span>
        <span class="lb">${esc(label)}</span><span class="nd"><code>${esc(node)}</code>${o && !o.value ? '<span class="badge deny">đang CẤM</span>' : ""}${!o && from ? `<span class="badge inh">✓ có sẵn từ ${esc(name(from))}</span>` : ""}${!o && !from && star ? '<span class="badge inh">✓ có qua quyền *</span>' : ""}${g.perms.filter(p => p.node === node && p.server !== server).map(p =>
          `<button type="button" class="badge srv${p.value ? "" : " deny"}" data-gosv="${esc(p.server)}" title="Bấm để xem ở ${p.server === "global" ? "toàn mạng" : esc(p.server)}">${p.value ? "✓ bật" : "cấm"} ở ${p.server === "global" ? "toàn mạng" : esc(p.server)}</button>`).join("")}</span></label>`;
    }
    h += `</div>`;
  }
  $("pcats").innerHTML = h || `<div class="noresult">Không có quyền nào khớp.</div>`;
  $("pcats").querySelectorAll("[data-gosv]").forEach(b => b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); server = b.dataset.gosv; renderDetail(); });
  $("pcats").querySelectorAll("input[data-node]").forEach(cb => cb.onchange = () => {
    cb.closest(".pr").classList.add("busy");
    post({ action: cb.checked ? "perm_set" : "perm_unset", group: g.name, node: cb.dataset.node, server });
  });
}

async function post(body) {
  toast("Đang gửi…", "");
  try {
    const r = await fetch("api/roles", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const res = await r.json();
    toast(res.message || (res.ok ? "Xong." : "Lỗi."), res.ok ? "ok" : "err");
    if (res.data) { data = res.data; const y = scrollY; render(); scrollTo(0, y); }
  } catch (e) { toast("Không gửi được: " + e, "err"); }
}
Promise.all([fetch("api/roles").then(r => r.json()), fetch("api/toi").then(r => r.json()).catch(() => null)]).then(([d, t]) => {
  if (d.error) throw d.error;
  if (t && t.game && !t.toan_quyen) {
    const f = new Set(t.tinh_nang || []);
    me = { full: false, role: f.has("role"), quyen: f.has("role-quyen"), khoa: new Set(t.role_khoa || []) };
  }
  data = d; render();
})
  .catch(e => { $("list").innerHTML = `<p class="empty">${esc(e)}</p>`; });
</script>
</body>
</html>
