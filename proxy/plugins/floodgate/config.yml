# Floodgate ở proxy (người chơi Bedrock qua Geyser). Khoá key.pem KHÔNG có trong Git: nằm ở data/proxy/plugins/floodgate/key.pem,
# các server Paper (lobby, banghoi, practice) gắn chung khoá đó (xem volumes trong compose của từng server).
# send-floodgate-data: true (12/10/2026) -> gửi thông tin người chơi Bedrock xuống server con để Floodgate ở đó nhận ra
# (menu dạng form cho điện thoại, GrimAC bỏ qua kiểm tra không hợp với Bedrock). Mọi server con có người Bedrock vào
# PHẢI có Floodgate cùng khoá. Pokémon (Fabric) chưa có Floodgate: chế độ đó không nhận Bedrock (mode.yml).
key-file-name: key.pem
username-prefix: "."
replace-spaces: true
send-floodgate-data: true
disconnect:
  invalid-key: Please connect through the official Geyser
  invalid-arguments-length: Expected {} arguments, got {}. Is Geyser up-to-date?
player-link:
  enabled: true
  require-link: false
  enable-own-linking: false
  allowed: true
  link-code-timeout: 300
  type: sqlite
  enable-global-linking: true
metrics:
  enabled: false
config-version: 3
