# DuckyMoMo: Simple Voice Chat ở proxy Velocity. Chỉ MỘT cổng UDP mở ra ngoài: 24454.
# Người chơi vào mc.goc6.io.vn -> mod voice tự nối UDP mc.goc6.io.vn:24454 -> VPS (DNAT, relay/vps/relay-up.sh) -> WireGuard -> proxy.
# Đường dự phòng playit KHÔNG có voice (playit chưa chuyển cổng UDP này).
port=24454
# trống = nghe ở địa chỉ của proxy (mọi IP trong container)
bind_address=
# trống = mod dùng đúng tên miền người chơi đã nhập + cổng ở trên
voice_host=
