# DuckyMoMo: cổng chuyển tiếp. Máy nhà (container relay, chung mạng với proxy) gọi lên đây.
# Khoá bí mật VPS: /etc/wireguard/vps.key (không rời VPS).
[Interface]
Address = 10.66.0.1/24
ListenPort = 51820
MTU = 1380
PostUp = wg set %i private-key /etc/wireguard/vps.key
PostUp = /etc/wireguard/relay-up.sh
PostDown = /etc/wireguard/relay-down.sh

[Peer]
# Máy nhà (RELAY_WG_PRIVATE_KEY trong .env của repo DuckyMoMo)
PublicKey = W34D1vzJqlroLH5ZHO7mTAjAcqkqWHGOjapdERCHs3U=
AllowedIPs = 10.66.0.2/32
