services:
  # Trang giới thiệu công khai cho người chơi: server, cách vào, gameplay Bang Hội Chiến, Liên minh Hoà Bình,
  # Hội Bàn Tròn (hồ sơ vụ án, lịch họp), bảng xếp hạng - số liệu đọc trực tiếp từ server (chỉ đọc).
  # Mở: http://localhost:${SITE_PORT:-8892}   (công khai qua Trạm 6 khi người dùng đồng ý)
  # Sửa nội dung: site/public/index.html (mount thẳng, tải lại trang là thấy); địa chỉ, link: site/config/site.yml (mount thẳng).
  site:
    build: .
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      BANGHOI_SERVER: banghoi-1
      PROXY_HOST: proxy
      PROXY_PORT: "25577"
      # Đăng nhập bằng tài khoản game: trang web hỏi panel (mạng nội bộ Docker). Không có khoá = tắt nút Đăng nhập.
      PANEL_URL: http://panel:8080
      PANEL_SITE_KEY: ${PANEL_SITE_KEY:-}
    ports:
      - "127.0.0.1:${SITE_PORT:-8892}:8080"
    volumes:
      - ./public:/app/public:ro
      - ./config:/app/config:ro     # site.yml (thư mục, không mount file lẻ: file lẻ hay hỏng sau khi WSL khởi động lại)
      - ../data:/data:ro            # chỉ đọc: cấu hình + dữ liệu plugin của banghoi-1
      - ../modes:/repo/modes:ro     # settings.yml của trang Cài đặt
