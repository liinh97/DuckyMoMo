<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="favicon.png">
<title>Tài khoản DuckyMoMo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--bg2:#121a24;--card:#17212e;--card2:#1d2a3a;--line:#2a3a4f;
  --text:#e8eef5;--muted:#9fb0c3;--dim:#6f8399;
  --gold:#f2b84b;--gold2:#ffd98a;--red:#ef5350;--jade:#3ecf8e;--jade2:#9af0c8;--sky:#5ab4ff;--violet:#b48cff;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 10% -10%,rgba(242,184,75,.12),transparent 60%),radial-gradient(700px 400px at 95% 0,rgba(62,207,142,.08),transparent 60%),var(--bg);color:var(--text);font-family:"Be Vietnam Pro",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.55;font-size:16px;min-height:100vh}
a{color:var(--gold2);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
header{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--text);white-space:nowrap}
.brand img{width:34px;height:34px}
.brand:hover{text-decoration:none}
h1{font-size:clamp(1.5rem,3vw,2rem);margin:0}
h2{font-size:1.1rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
p{margin:0 0 .8em}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:1fr}}
p.red{color:#ff9d9b}
.green{color:#7ee2b0} span.red{color:#ff9d9b}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--gold);text-decoration:none}
.btn.primary{background:linear-gradient(135deg,var(--gold),#d98b25);color:#1d1203;border:none}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.6;cursor:wait}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0b1118;color:var(--text);font:inherit}
input:focus{outline:2px solid rgba(242,184,75,.5);border-color:var(--gold)}
label{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin:12px 0 6px}
.pill{display:inline-flex;align-items:center;gap:.4em;padding:.2em .7em;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.pill.on{color:var(--jade2);border-color:rgba(62,207,142,.4)}
.pill.warn{color:#ffb3b1;border-color:rgba(239,83,80,.45)}
.dot{width:.55em;height:.55em;border-radius:50%;background:var(--dim);display:inline-block}.dot.on{background:var(--jade)}
code,.kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#0b1118;border:1px solid var(--line);border-radius:6px;padding:.05em .4em;font-size:.9em;color:var(--gold2)}
.err{color:#ff9d9b;font-weight:600;min-height:1.4em;margin-top:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.tab.on{background:var(--gold);color:#1d1203;border-color:var(--gold)}

/* đăng nhập */
.login{max-width:980px;margin:40px auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px}
@media (max-width:800px){.login{grid-template-columns:1fr;margin:20px auto}}
.steps{counter-reset:s;display:grid;gap:10px;margin:10px 0}
.steps>div{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.steps>div::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--card2);border:1px solid var(--line);color:var(--gold)}
.safe li{margin:6px 0;color:var(--muted)}

/* hồ sơ */
.head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:26px 0 18px}
.avatar{width:72px;height:72px;border-radius:18px;display:grid;place-items:center;font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--gold),#c97a1a);color:#1d1203;flex:none}
.head .who{flex:1;min-width:220px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
.stat b{display:block;font-size:1.4rem;font-weight:800;margin-top:2px;overflow-wrap:anywhere}
.stat span{font-size:.8rem;color:var(--dim)}
.bar{height:8px;border-radius:99px;background:#0b1118;border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),var(--jade2))}
.quest{margin:10px 0}
.quest .t{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.tier{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card2);margin-bottom:8px}
.tier.mine{border-color:rgba(242,184,75,.6);background:linear-gradient(180deg,rgba(242,184,75,.1),var(--card2))}
.tier .perks{font-size:.85rem;color:var(--muted);margin-top:4px}
.feat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(42,58,79,.6)}
.feat:last-child{border-bottom:none}
.feat small{display:block;color:var(--muted)}
@media (max-width:560px){.feat{flex-direction:column;align-items:stretch}.feat .btn{text-align:center}}
.note{border-radius:12px;padding:12px 14px;background:rgba(242,184,75,.08);border:1px solid rgba(242,184,75,.35);margin-bottom:12px}
.note.red{background:rgba(239,83,80,.08);border-color:rgba(239,83,80,.45)}
.cmds{max-height:640px;overflow:auto;margin-top:8px;padding-right:4px}
.hay{border:1px solid rgba(242,184,75,.35);background:linear-gradient(180deg,rgba(242,184,75,.06),transparent 70%);border-radius:12px;padding:4px 14px 8px}
.hayt{font-weight:800;margin:12px 0 2px;color:var(--gold2)}
details.plg{border-bottom:1px solid rgba(42,58,79,.6)}
details.plg>summary{cursor:pointer;padding:10px 0;font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);list-style:none}
details.plg>summary::before{content:"▸ ";color:var(--gold)}
details.plg[open]>summary::before{content:"▾ "}
.cmdgrp{margin:12px 0 4px;font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.cmd{display:grid;grid-template-columns:minmax(160px,34%) 1fr;gap:14px;padding:8px 0;border-bottom:1px solid rgba(42,58,79,.5);font-size:.92rem}
.cmd>*{min-width:0}
.cmd code{white-space:normal;overflow-wrap:anywhere}
.cmd .al{color:var(--dim);font-size:.8rem}
.cmd .own{color:var(--violet);font-size:.72rem;font-weight:800;margin-left:6px;text-transform:uppercase;white-space:nowrap}
@media (max-width:620px){.cmd{grid-template-columns:1fr;gap:2px}}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{flex:1;min-width:180px}
.check{display:inline-flex;gap:6px;align-items:center;font-size:.88rem;color:var(--muted);cursor:pointer}
.check input{width:auto}
.tools label.check{margin:0}
footer{padding:30px 0;color:var(--dim);font-size:.85rem}
.ttmsg{margin-top:12px;padding:10px 12px;border-radius:10px;font-weight:600}
.ttmsg:empty{display:none}
.ttmsg.ok{background:rgba(62,207,142,.12);color:var(--jade2);border:1px solid rgba(62,207,142,.35)}
.ttmsg.bad{background:rgba(239,83,80,.12);color:#ffb3b1;border:1px solid rgba(239,83,80,.4)}
.ttmsg.wait{background:rgba(242,184,75,.1);color:var(--gold2);border:1px solid rgba(242,184,75,.35)}
.tt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.tt-grid{grid-template-columns:1fr}}
.tt{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card2);min-width:0}
.tt h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:1rem;margin:0 0 10px}
.pal{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:8px 0}
.sw{width:22px;height:22px;border-radius:6px;border:2px solid rgba(255,255,255,.18);cursor:pointer;padding:0}
.fmt{min-width:28px;height:24px;border-radius:6px;border:1px solid var(--line);background:#0b1118;color:var(--text);cursor:pointer}
.hex{display:inline-flex;align-items:center;gap:4px;margin:0;cursor:pointer}.hex input{width:30px;height:24px;padding:0;border:0;background:none}
.pv{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:6px}
.pv-sky{height:120px;background:linear-gradient(#5a8fd6,#9cc4f0 70%,#5a9e4a 70%);position:relative;display:grid;place-items:end center;padding-bottom:10px}
.pv .tag{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.45);padding:2px 8px;font-family:ui-monospace,monospace;font-size:.85rem;white-space:nowrap;max-width:95%;overflow:hidden}
.steve{width:22px;height:66px;background:linear-gradient(#c69c6d 0 33%,#3a6ea5 33% 66%,#2d4a7a 66%)}
.pv-chat,.pv-tab{background:rgba(0,0,0,.55);font-family:ui-monospace,monospace;font-size:.85rem;padding:7px 10px;overflow-wrap:anywhere}
.pv-tab{background:#1a1f27;border-top:1px solid var(--line)}
#ppCv{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 10px;border-radius:12px;border:1px solid var(--line)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chip{padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:#0b1118;color:var(--text);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
.chip.on{border-color:var(--gold);background:rgba(242,184,75,.14);color:var(--gold2)}
.chip.off{opacity:.45}
.chip.cur{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.chip .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:0 0 0 4px}
.chip .x:hover{color:#ff9d9b}
.chip.nopick{cursor:default}
.ask-wrap{position:fixed;inset:0;z-index:100;background:rgba(5,8,12,.6);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.ask{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ask h3{margin:0 0 8px;font-size:1.05rem}
.ask p{margin:0;color:var(--muted);overflow-wrap:anywhere}
.ask-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn.danger{background:var(--red);color:#fff;border:none}
.pkgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pkg{padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:#0b1118;color:var(--text);font:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
.pkg:hover,.pkg.on{border-color:var(--gold);color:var(--gold2)}
.paygrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:700px){.paygrid{grid-template-columns:1fr}.qr{margin:0 auto}}
.qr{display:block;width:260px;height:260px;max-width:100%;border-radius:12px;background:#fff;padding:6px}
.kv{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid rgba(42,58,79,.6)}
.kv span{color:var(--muted);font-size:.85rem;min-width:110px}
.kv b{overflow-wrap:anywhere}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="./"><img src="logo.png" alt=""><span>DuckyMoMo</span></a>
  <a class="btn small" href="./">← Trang chủ</a>
</div></header>

<main class="wrap" id="main"><p class="muted" style="margin-top:40px">Đang tải…</p></main>
<footer><div class="wrap">Trang web không dùng mật khẩu: chỉ người đang đăng nhập trong game mới lấy được mã <code>/web</code>.</div></footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = new Intl.NumberFormat("vi-VN");
const SRV = {"banghoi-1": "Bang Hội Chiến", "lobby": "Sảnh", "practice-1": "Practice", "proxy": "Mọi server"};
const MC = {0:"#555",1:"#3b5bdb",2:"#2f9e44",3:"#1098ad",4:"#c92a2a",5:"#9c36b5",6:"#f2b84b",7:"#adb5bd",8:"#868e96",9:"#5c7cfa",a:"#69db7c",b:"#66d9e8",c:"#ff6b6b",d:"#f783ac",e:"#ffe066",f:"#f8f9fa"};
// "&6&l[Công Tước]" -> chữ có màu như trong game
function mc(t){ let color = "#e8eef5", st = {}, out = "";
  for (const p of String(t || "").split(/(&#[0-9a-fA-F]{6}|&[0-9a-fk-or])/i)) {
    if (!p) continue; let m;
    if ((m = /^&#([0-9a-f]{6})$/i.exec(p))) { color = "#" + m[1]; st = {}; continue; }
    if ((m = /^&([0-9a-fk-or])$/i.exec(p))) { const k = m[1].toLowerCase(); if (MC[k]) { color = MC[k]; st = {}; } else if (k === "r") { color = "#e8eef5"; st = {}; } else st[k] = true; continue; }
    const deco = [st.n && "underline", st.m && "line-through"].filter(Boolean).join(" ");
    out += `<span style="color:${color};${st.l ? "font-weight:800;" : ""}${st.o ? "font-style:italic;" : ""}${deco ? `text-decoration:${deco};` : ""}">${esc(st.k ? p.replace(/\S/g, "▒") : p)}</span>`; }
  return out; }
const day = ms => ms ? new Date(ms).toLocaleDateString("vi-VN") : "–";
const when = ms => ms ? new Date(ms).toLocaleString("vi-VN", {hour:"2-digit", minute:"2-digit", day:"2-digit", month:"2-digit", year:"numeric"}) : "–";
// Hộp xác nhận / thông báo theo giao diện trang (thay confirm/alert của trình duyệt). ask(...) -> Promise<true|false>
function ask(message, o = {}){
  return new Promise(resolve => {
    const w = document.createElement("div"); w.className = "ask-wrap";
    w.innerHTML = `<div class="ask" role="dialog" aria-modal="true"><h3></h3><p></p><div class="ask-btns">${o.info ? "" : '<button class="btn small ask-no"></button>'}<button class="btn primary small ask-ok"></button></div></div>`;
    w.querySelector("h3").textContent = o.title || "Xác nhận"; w.querySelector("p").textContent = message;
    const ok = w.querySelector(".ask-ok"), no = w.querySelector(".ask-no");
    ok.textContent = o.ok || (o.info ? "Đã hiểu" : "Đồng ý"); if (o.danger) ok.classList.add("danger");
    if (no) no.textContent = o.cancel || "Huỷ";
    const done = v => { document.removeEventListener("keydown", key, true); w.remove(); resolve(v); };
    const key = e => { if (e.key === "Escape") done(!!o.info); else if (e.key === "Enter") { e.preventDefault(); done(true); } };
    ok.onclick = () => done(true); if (no) no.onclick = () => done(false);
    w.onmousedown = e => { if (e.target === w) done(!!o.info); };
    document.addEventListener("keydown", key, true); document.body.appendChild(w); ok.focus();
  });
}
const notice = (message, title) => ask(message, {info: true, title: title || "Thông báo"});
async function api(u, body){
  const r = await fetch(u, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)} : {cache:"no-store"});
  const d = await r.json().catch(() => ({}));
  if (!r.ok && !d.message) d.message = "Lỗi " + r.status;
  return d;
}

// ------------------------------------------------------------ đăng nhập
function loginView(needCode){
  $("#main").innerHTML = `
  <div class="login">
    <div class="card">
      <h1 style="margin-bottom:6px">Đăng nhập</h1>
      <p class="muted">Dùng tài khoản trong game DuckyMoMo, không cần mật khẩu: vào game gõ <code>/web</code> để lấy mã. ${needCode ? '<br><b style="color:var(--gold2)">Phiên quản trị đã hết hạn, lấy mã mới để mở lại.</b>' : ""}</p>
      <form id="f" autocomplete="on">
        <label for="ten">Tên nhân vật</label>
        <input id="ten" name="username" autocomplete="username" maxlength="18" required placeholder="vd Linh (Bedrock có dấu chấm đầu: .Linh)">
        <label for="ma">Mã 6 số</label>
        <input id="ma" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Vào game gõ /web để lấy mã">
        <div class="err" id="err"></div>
        <button class="btn primary" id="go" style="width:100%;margin-top:6px">Đăng nhập</button>
      </form>
    </div>
    <div class="card">
      <h2>🔑 Lấy mã từ game</h2>
      <div class="steps">
        <div><span>Vào server, đăng nhập như thường (<code>/login</code>).</span></div>
        <div><span>Gõ <code>/web</code>: server gửi riêng cho bạn mã 6 số.</span></div>
        <div><span>Nhập tên + mã ở đây. Mã dùng <b>1 lần</b>, hết hạn sau 5 phút.</span></div>
      </div>
      <p class="small muted">Máy tính và điện thoại (Bedrock) đều dùng cách này. Trang web không bao giờ hỏi mật khẩu game của bạn.</p>
      <h2 style="margin-top:18px">🛡️ Giữ tài khoản an toàn</h2>
      <ul class="safe small">
        <li>Chỉ nhập mã ở trang <b>app.goc6.io.vn/mc/web</b>. Admin <b>không bao giờ</b> hỏi mã hay mật khẩu của bạn; trang nào đòi mật khẩu game là giả.</li>
        <li>Mỗi lần tài khoản đăng nhập web, server báo vào game cho bạn. Không phải bạn thì đổi mật khẩu ngay: <code>/changepassword</code>.</li>
        <li>Sai 5 lần, tên đó bị khoá đăng nhập web 15 phút.</li>
      </ul>
    </div>
  </div>`;
  $("#f").onsubmit = async e => {
    e.preventDefault();
    const body = {ten: $("#ten").value.trim(), ma: $("#ma").value.replace(/\D/g, "")};
    if (!body.ten || body.ma.length !== 6) { $("#err").textContent = "Nhập tên nhân vật và mã 6 số."; return; }
    $("#go").disabled = true; $("#err").textContent = "";
    const d = await api("api/dangnhap", body).catch(() => ({message: "Không kết nối được."}));
    $("#go").disabled = false;
    if (d.ok) { history.replaceState(null, "", "taikhoan.html"); load(); } else $("#err").textContent = d.message || "Đăng nhập không được.";
  };
  $("#ten").focus();
}

// ------------------------------------------------------------ hồ sơ
let D = null, cmdSrv = "banghoi-1", onlyMine = false, cmdQ = "", DN = {}, PICK = null, BANK = null;
async function loadDonate(){ DN = await api("api/donate", {action: "ds"}).catch(() => ({})); }
function stat(label, value, sub){ return `<div class="stat"><small>${label}</small><b>${value}</b>${sub ? `<span>${sub}</span>` : ""}</div>`; }

function render(){
  const h = D.hoso || {}, q = D.quantri || {}, tk = D.taikhoan || {};
  const donateRoles = (D.roles || []).filter(r => r.loai === "donate"), staffRoles = (D.roles || []).filter(r => r.loai !== "donate");
  const badges = [`<span class="pill">${D.bedrock ? "📱 Bedrock" : "💻 Java"}</span>`,
    D.online ? `<span class="pill on"><span class="dot on"></span>Đang chơi · ${esc(SRV[D.online] || D.online)}</span>` : `<span class="pill"><span class="dot"></span>Đang offline</span>`]

    else { $("#paid").disabled = false; $("#payMsg").textContent = d.message || "Không gửi được."; }

  if ($("#clGo")) $("#clGo").onclick = async () => {

}

function startPP(){
  cancelAnimationFrame(ppAnim);
  const cv = $("#ppCv"); if (!cv) return;
  const ctx = cv.getContext("2d"), W = cv.width, H = cv.height, cx = W / 2, base = H - 30;
  const [col, glyph] = EFFECTS[ppE] || EFFECTS.flame, still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const notes = ["#ff5555", "#ffaa00", "#ffff55", "#55ff55", "#55ffff", "#5555ff", "#ff55ff"];
  const P = (x, y, z) => ({x: cx + x * 38, y: base - y * 38, s: 1 + z * .25});  // x/z đơn vị block, y cao
  function pts(t){
    const out = [], r = Math.random;
    switch (ppS) {
      case "halo": for (let i = 0; i < 12; i++) { const a = t * 1.5 + i / 12 * 6.283; out.push(P(Math.cos(a) * .55, 2.25, Math.sin(a))); } break;
      case "orbit": for (let i = 0; i < 3; i++) { const a = t * 2 + i * 2.094; out.push(P(Math.cos(a) * 1.1, 1.0, Math.sin(a))); } break;
      case "feet": for (let i = 0; i < 4; i++) out.push(P((r() - .5) * .9, .05 + r() * .1, r() - .5)); break;
      case "overhead": for (let i = 0; i < 3; i++) out.push(P((r() - .5) * .7, 2.3 + r() * .3, r() - .5)); break;
      case "point": out.push(P(0, 2.5, 0)); break;
      case "spin": { const a = t * 3; out.push(P(Math.cos(a) * .6, 2.35, Math.sin(a))); } break;
      case "quadhelix": for (let i = 0; i < 4; i++) for (let k = 0; k < 8; k++) { const y = ((t * .8 + k / 8) % 1) * 2.2, a = y * 3 + i * 1.571 + t; out.push(P(Math.cos(a) * .8, y, Math.sin(a))); } break;
      case "wings": for (let k = 0; k < 14; k++) { const u = k / 13, f = Math.sin(t * 3) * .15; out.push(P(-(.25 + u * 1.1), 1.0 + Math.sin(u * 3.14) * .9 + u * .3, -.3 - f)); out.push(P(.25 + u * 1.1, 1.0 + Math.sin(u * 3.14) * .9 + u * .3, -.3 - f)); } break;
      case "rings": for (let k = 0; k < 16; k++) { const a = k / 16 * 6.283, b = t; out.push(P(Math.cos(a) * 1.1, 1.1 + Math.sin(a) * Math.sin(b) * .9, Math.sin(a) * Math.cos(b))); } break;
      case "sphere": for (let k = 0; k < 18; k++) { const u = r() * 6.283, v = Math.acos(2 * r() - 1); out.push(P(Math.sin(v) * Math.cos(u) * 1.2, 1.1 + Math.cos(v) * 1.2, Math.sin(v) * Math.sin(u))); } break;
      case "vortex": for (let k = 0; k < 20; k++) { const y = k / 20 * 2.4, a = t * 3 + y * 4; out.push(P(Math.cos(a) * (.2 + y * .45), y, Math.sin(a))); } break;
      case "beam": { const y = (Math.sin(t * 1.5) + 1) * 1.1; for (let k = 0; k < 14; k++) { const a = k / 14 * 6.283; out.push(P(Math.cos(a) * .8, y, Math.sin(a))); } } break;
      case "whirl": for (let k = 0; k < 3; k++) { const a = t * 4 + k * 2.094, d = ((t * .6 + k / 3) % 1) * 1.6; out.push(P(Math.cos(a) * d, 1.0, Math.sin(a) * d)); } break;
      case "celebration": { const q = (t * .7) % 1, a0 = Math.floor(t * .7) * 2.4; for (let k = 0; k < 10; k++) { const a = a0 + k * .628; out.push(P(Math.cos(a0) * 1.4 + Math.cos(a) * q * .8, 2.4 + Math.sin(a) * q * .8, 0)); } } break;
      case "twins": for (let i = 0; i < 2; i++) { const a = t * 2 + i * 3.1416; out.push(P(Math.cos(a) * 1.1, 1.4 + Math.sin(t * 2) * .3 * (i ? 1 : -1), Math.sin(a))); } break;
      case "pulse": { const q = (t * .8) % 1; for (let k = 0; k < 16; k++) { const a = k / 16 * 6.283; out.push(P(Math.cos(a) * q * 1.6, .1, Math.sin(a) * q)); } } break;
      default: for (let i = 0; i < 4; i++) out.push(P((r() - .5) * 1.3, r() * 2.1, r() - .5));
    }
    return out;
  }
  const trail = [];
  function frame(ms){
    const t = ms / 1000;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0b1118"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#1b2b22"; ctx.fillRect(0, base, W, H - base);
    // nhân vật kiểu khối
    const s = 38; ctx.fillStyle = "#3a6ea5"; ctx.fillRect(cx - s * .25, base - s * 1.5, s * .5, s * .75);
    ctx.fillStyle = "#2d4a7a"; ctx.fillRect(cx - s * .25, base - s * .75, s * .5, s * .75);
    ctx.fillStyle = "#c69c6d"; ctx.fillRect(cx - s * .25, base - s * 2, s * .5, s * .5);
    trail.push(...pts(t).map(p => ({...p, life: 1, c: col === "*" ? notes[(Math.random() * notes.length) | 0] : col})));
    for (const p of trail) p.life -= ["normal", "feet", "overhead", "sphere"].includes(ppS) ? .04 : .12;
    while (trail.length && trail[0].life <= 0) trail.shift();
    if (trail.length > 400) trail.splice(0, trail.length - 400);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const p of trail) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c; ctx.font = `${Math.round(11 * p.s)}px system-ui`; ctx.fillText(glyph, p.x, p.y); }
    ctx.globalAlpha = 1;
    if (!still) ppAnim = requestAnimationFrame(frame);
  }
  ppAnim = requestAnimationFrame(frame);
}

  const inp = $("#nickIn");
  inp.oninput = () => { nickVal = inp.value; drawNickPreview(); };
  const insert = (code) => { const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? a;
    inp.value = inp.value.slice(0, a) + code + inp.value.slice(b); inp.focus(); inp.selectionStart = inp.selectionEnd = a + code.length; nickVal = inp.value; drawNickPreview(); };
  document.querySelectorAll("#trangtri [data-code]").forEach(b => b.onclick = () => insert(b.dataset.code));
  if ($("#hexPick")) $("#hexPick").onchange = e => insert("&" + e.target.value.toLowerCase());
  document.querySelectorAll("#trangtri [data-e]").forEach(b => b.onclick = () => { ppE = b.dataset.e; document.querySelectorAll("#trangtri [data-e]").forEach(x => x.classList.toggle("on", x === b)); if ($("#ppDesc")) $("#ppDesc").textContent = (EFFECTS[ppE] || [])[3] || ""; startPP(); });
  document.querySelectorAll("#trangtri [data-s]").forEach(b => b.onclick = () => { ppS = b.dataset.s; document.querySelectorAll("#trangtri [data-s]").forEach(x => x.classList.toggle("on", x === b)); startPP(); });
  document.querySelectorAll("#trangtri [data-cur]").forEach(b => b.onclick = (e) => { if (e.target.dataset.ppdel) return; [ppE, ppS] = b.dataset.cur.split("|");
    document.querySelectorAll("#trangtri [data-e]").forEach(x => x.classList.toggle("on", x.dataset.e === ppE)); document.querySelectorAll("#trangtri [data-s]").forEach(x => x.classList.toggle("on", x.dataset.s === ppS)); if ($("#ppDesc")) $("#ppDesc").textContent = (EFFECTS[ppE] || [])[3] || ""; startPP(); });
  document.querySelectorAll("#trangtri [data-ppdel]").forEach(b => b.onclick = () => { lastTT = '[data-tt="pp_add"]'; doTT({viec: "pp_remove", id: +b.dataset.ppdel}); });
  document.querySelectorAll("#trangtri [data-dh]").forEach(b => b.onclick = () => { lastTT = "#trangtri [data-dh]"; doTT({viec: "danhhieu", ma: b.dataset.dh}); });
  document.querySelectorAll("#trangtri [data-tt]").forEach(b => b.onclick = () => {
    const v = b.dataset.tt;
    lastTT = `[data-tt="${v}"]`;
    if (v === "nick") return doTT({viec: "nick", gia_tri: (nickVal || "").trim()});
    if (v === "pp_add") return doTT({viec: "pp_add", hieu_ung: ppE, kieu: ppS});
    if (v === "pp_reset") return ask("Tắt mọi hiệu ứng hạt đang bật?", {title: "Tắt hiệu ứng", ok: "Tắt hết"}).then(y => y && doTT({viec: v}));
    doTT({viec: v});
  });
}

// thông báo kết quả hiện ngay dưới hàng nút vừa bấm (trước: cuối khung Trang trí, người dùng không thấy)
let lastTT = "";   // bộ chọn của nút vừa bấm
function placeTT(){
  const m = $("#ttMsg"), b = lastTT && document.querySelector(lastTT);
  if (!m || !b) return;
  b.parentElement.after(m);
  const r = m.getBoundingClientRect();
  if (r.bottom > innerHeight || r.top < 0) m.scrollIntoView({block: "nearest", behavior: "smooth"});
}
async function doTT(body){
  const m = $("#ttMsg"); m.className = "ttmsg wait"; m.textContent = "⏳ Đang gửi tới server…"; placeTT();
  const d = await api("api/trangtri", body).catch(() => ({message: "Không kết nối được."}));
  const show = () => { const e = $("#ttMsg"); e.className = "ttmsg " + (d.ok ? (d.pending ? "wait" : "ok") : "bad");
    e.textContent = (d.ok ? (d.pending ? "⏳ " : "✓ ") : "✕ ") + (d.message || (d.ok ? "Xong." : "Không áp dụng được.")); placeTT(); };
  show();
  // vẽ lại thẻ theo trạng thái mới từ server (tên, danh sách hiệu ứng đang bật, danh hiệu), giữ lựa chọn đang xem
  if (d.trangtri) { D.trangtri = d.trangtri; if (body.viec === "nick_off" && d.ok) nickVal = ""; const y = scrollY; render(); scrollTo(0, y); show(); }
}

function cmdRow(c){
  return `<div class="cmd"><div><code>/${esc(c.ten)}</code>${c.nhan ? `<span class="own">${esc(c.nhan)}</span>` : ""}${c.goi_tat.length ? `<div class="al">${c.goi_tat.map(a => "/" + esc(a)).join(" ")}</div>` : ""}</div><div class="muted">${esc(c.mo_ta) || '<span class="dim">Chưa có mô tả</span>'}</div></div>`;
}
const OPEN = new Set();  // nhóm plugin đang mở
function drawCmds(){
  const q = fold(cmdQ.trim());
  const all = ((D.lenh || {})[cmdSrv] || []).filter(c => (!onlyMine || c.nhan) && (!q || fold(c.ten + " " + c.goi_tat.join(" ") + " " + c.mo_ta + " " + c.plugin).includes(q)));
  if (!all.length) { $("#cmds").innerHTML = '<p class="muted" style="margin-top:12px">Không có lệnh nào khớp.</p>'; return; }
  let h = "";
  // hay dùng: theo thứ tự lenh-hay-dung.yml, chia nhóm Người chơi / Staff / Admin
  // mỗi lệnh hay dùng chỉ hiện 1 dòng: dòng đứng đầu trong cẩm nang (thường là cách dùng chung), biến thể khác về "Tất cả lệnh khác"
  const seenH = new Set(), hay = [];
  all.map((c, i) => [c, i]).filter(([c]) => c.hay).sort((a, b) => a[0].hay[1] - b[0].hay[1] || a[1] - b[1]).map(([c]) => c)
    .forEach(c => { if (!seenH.has(c.hay[1])) { seenH.add(c.hay[1]); hay.push(c); } });
  if (hay.length) {
    h += `<div class="hay"><div class="hayt">⭐ Hay dùng</div>`;
    let g = null;
    for (const c of hay) { if (c.hay[0] !== g) { g = c.hay[0]; h += `<div class="cmdgrp">${esc(g)}</div>`; } h += cmdRow(c); }
    h += `</div>`;
  }
  const rest = all.filter(c => !hay.includes(c)), by = {};
  rest.forEach(c => (by[c.plugin] = by[c.plugin] || []).push(c));
  if (rest.length) h += `<div class="hayt" style="margin-top:16px">${hay.length ? "Tất cả lệnh khác" : "Tất cả lệnh"} <span class="dim small">(${rest.length}, bấm tên plugin để mở)</span></div>`;
  // đang tìm thì mở hết; không thì thu gọn theo plugin
  h += Object.keys(by).sort((a, b) => a.localeCompare(b)).map(p => `<details class="plg" ${q || OPEN.has(p) ? "open" : ""} data-p="${esc(p)}"><summary>${esc(p)} <span class="dim">(${by[p].length})</span></summary>${by[p].map(cmdRow).join("")}</details>`).join("");
  $("#cmds").innerHTML = h;
  $("#cmds").querySelectorAll("details.plg").forEach(d => d.ontoggle = () => { if (!q) d.open ? OPEN.add(d.dataset.p) : OPEN.delete(d.dataset.p); });
}

async function load(){
  const d = await api("api/toi").catch(() => null);
  if (!d) { $("#main").innerHTML = '<p class="muted" style="margin-top:40px">Không kết nối được máy chủ, thử lại sau.</p>'; return; }
  if (!d.bat) { $("#main").innerHTML = '<div class="card" style="margin-top:40px"><h1>Đăng nhập chưa mở</h1><p class="muted">Server chưa bật đăng nhập trên web.</p></div>'; return; }
  if (!d.dang_nhap) return loginView(new URLSearchParams(location.search).get("can") === "ma");
  if (!d.ok) { $("#main").innerHTML = `<div class="card" style="margin-top:40px"><h1>${esc(d.ten || "")}</h1><p class="muted">${esc(d.message || "Không tải được thông tin.")}</p><button class="btn small" id="out">Đăng xuất</button></div>`;
    $("#out").onclick = async () => { await api("api/dangxuat", {}); load(); }; return; }
  D = d;
  await Promise.all([loadDonate(), api("api/info").then(i => { BANK = (i.site || {}).donate || null; }).catch(() => {})]);
  render();
}
load();
</script>
