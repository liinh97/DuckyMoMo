services:
  # playit.gg: cho người ngoài mạng nhà vào server, không cần mở cổng modem.
  # Chỉ chạy khi bật:  docker compose --profile tunnel up -d
  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    profiles: ["tunnel"]
    restart: unless-stopped
    environment:
      # Lấy ở playit.gg (Add agent > Docker). Không commit key này.
      SECRET_KEY: ${PLAYIT_SECRET_KEY:-}   # không bắt buộc khi chưa bật profile tunnel (máy mới chưa có key); bật mà trống thì playit báo lỗi
    # Dùng chung mạng với proxy: trên dashboard playit, tunnel trỏ tới 127.0.0.1
    #   Minecraft Java    -> 127.0.0.1:25577 (TCP)
    #   Minecraft Bedrock -> 127.0.0.1:19132 (UDP)
    # LƯU Ý: tạo lại proxy thì phải tạo lại playit:  docker compose --profile tunnel up -d --force-recreate playit
    network_mode: "service:proxy"
    depends_on:
      proxy:
        condition: service_started
        restart: true             # proxy khởi động lại thì playit cũng khởi động lại để giữ mạng

  # Tự khởi động lại playit khi bị kẹt (nhận kết nối nhưng không chuyển vào proxy). Logic: tunnel/playit-watchdog.sh
  # Xem nó làm gì: docker compose logs playit-watchdog
  playit-watchdog:
    image: docker:29-cli
    profiles: ["tunnel"]
    restart: unless-stopped
    entrypoint: ["sh", "/watchdog/playit-watchdog.sh"]
    environment: { PROJECT: duckymomo, TZ: ICT-7 }   # image không có tzdata: dùng chuỗi POSIX (UTC+7)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # đọc log, khởi động lại playit
      - ./:/watchdog:ro
